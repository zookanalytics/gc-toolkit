<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>helm · attention board</title>
    <script>
      // Mount-prefix normalizer (KTD5, the client half of `base: './'`).
      //
      // The supervisor's service proxy maps BOTH ".../svc/helm" and
      // ".../svc/helm/" to "/" before helm-svc sees them (serviceSubpath in
      // gascity's internal/workspacesvc/manager.go), so the server can neither
      // tell the two apart nor learn its own external prefix — it cannot emit
      // the redirect an ordinary origin server would. Without the trailing
      // slash the document base drops the last segment and every relative
      // asset ("./assets/…") resolves one directory too high: a blank page
      // behind a wall of 404s.
      //
      // Fix it on the client, before the deferred module scripts run. The
      // check is prefix-agnostic on purpose — it needs no knowledge of the
      // city name or mount depth.
      (function () {
        var path = window.location.pathname;
        if (path.charAt(path.length - 1) !== '/') {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
