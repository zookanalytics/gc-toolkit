# gc-toolkit — primary pack for a Gas Town city.
#
# gc-toolkit imports the gastown pack wholesale and layers per-agent
# patches. See specs/tk-0t1ip/pack-patch-timing-analysis.md for the
# safety analysis and prerequisites: no city-level [imports.gastown],
# no [rigs.imports.gastown].
#
# Native gc-toolkit agents (mechanik, polecat-codex,
# _polecat-gemini, plus the *-thread
# variants) ship under agents/. Gastown roster (boot, deacon, mayor,
# polecat, refinery, witness) is imported and divergences are
# expressed as bare-name [[patches.agent]] — pure fragment-append
# overlays on top of base prompts. Each gc-toolkit-specific doctrine
# (heartbeat-no-consent-ui, layered-startup-discovery-{boot,deacon,refinery,witness},
# convoy-integration-branch-mayor, polecat-convoys, polecat-append-notes,
# file-work-records, operator-next-step-trailing, file-feedback-observations,
# learned-conventions-polecat) lives in template-fragments/ and is named
# explicitly in inject_fragments_append below; the base prompt template is
# reused verbatim from gastown. No whole-file prompt mirrors.
#
# One doctrine fragment is deliberately NOT injected here:
# polecat-non-impl-done is carried by agents/polecat-codex/agent.toml alone.
# See the polecat patch below for why, and
# doctor/check-polecat-fragment-sync for the declared exception that keeps
# the divergence honest.
#
# Opt-in sub-packs ship under packs/<name>/ and are imported by
# specific rigs (not by gc-toolkit's importers). The first sub-pack
# is `packs/gascity-keeper/` — the keeper agent + the
# mol-upstream-gc-* formula family + the refinery rebase-handling
# overlay, all of which are gascity-fork-specific and should not be
# loaded into rigs that don't carry a fork. See
# `packs/gascity-keeper/pack.toml` for the import wiring that the
# gascity rig adds in city.toml.
#
# Dog is intentionally NOT vendored: the imported gastown pack owns the
# dog pool (gastown/agents/dog/; gastown pack.toml: "This pack owns its
# dog pool") and ships dog as a city-scoped agent, so gc-toolkit needs no
# roster entry of its own.

[pack]
name = "gc-toolkit"
schema = 2

[imports.gastown]
# gastown composes from the public gascity-packs registry, resolved from
# the user-global pack cache (the running binary pre-seeds that cache with
# its embedded gastown PackFS at this pin). Builtin packs are not
# materialized into a per-city .gc/system/packs tree; see
# cmd/gc/embed_builtin_packs.go.
source = "https://github.com/gastownhall/gascity-packs/tree/main/gastown"
version = "sha:33d3a430a67d1782ad364556cb566bdb01d0afe3"

[global]
# Ordering is load-bearing. Gastown's tmux-theme.sh runs first (from
# the imported pack) and sets the full status-bar theme, including a
# status-right that points at gastown's status-line.sh. Our overrides
# below run AFTER (see gascity/internal/config/pack.go:1450 — "Collect
# globals: included globals first, then this pack's own"; iterated
# in order at runtime/tmux/adapter.go:824). The override script
# rewrites status-right to point at gc-toolkit-status-line.sh, which
# adds the composable title and indicator slots while preserving
# gastown's tier theming and `%H:%M` time slot.
session_live = [
    "{{.ConfigDir}}/assets/scripts/tmux-bindings.sh {{.ConfigDir}}",
    "{{.ConfigDir}}/assets/scripts/tmux-status-line-override.sh {{.Session}} {{.Agent}} {{.ConfigDir}}",
]

[[patches.agent]]
name = "boot"
inject_fragments_append = [
    # Base boot reads the deacon's patrol wisp with `gc bd list ... --json` and
    # no --include-infra, at two sites: the Step 2 triage query and the
    # "Check deacon work" quick-reference row. Wisps are ephemeral
    # (<store>.wisps), so both return empty on every wake and the triage rows
    # keyed on wisp staleness can never fire (lx-ody8m). This fragment
    # supersedes both sites.
    "layered-startup-discovery-boot",
]

[[patches.agent]]
name = "deacon"
inject_fragments_append = [
    "canonical-self-rename",
    "heartbeat-no-consent-ui",
    "layered-startup-discovery-deacon",
]
# Deterministic cycle-recycle: overlays/cycle-recycle/ ships a Claude `Stop` hook
# (.claude/settings.json + .claude/hooks/cycle-recycle.sh) staged into this agent's
# work dir. It self-gates to patrol roles, so the same overlay is a safe no-op
# elsewhere.
overlay_dir = "overlays/cycle-recycle"

[[patches.agent]]
name = "mayor"
inject_fragments_append = [
    "canonical-self-rename",
    "convoy-integration-branch-mayor",
    # The mayor rules on cross-store dispositions and is the one actor that
    # REOPENS a closed bead, which is a write against somebody else's decision.
    # Both halves of tk-isyz0 land on it: stamp a successor pointer when a
    # ruling re-homes work, and never conclude "false close" from a
    # single-store search. Mirrored by hand into agents/mayor-thread/agent.toml
    # (append_fragments) — there is no propagation between the two.
    "bead-disposition",
    "operator-next-step-trailing",
    # Feedback-learning capture: file corrective feedback as observation
    # beads (specs/2026-08-learning-system/implementation-design.md §2a).
    "file-feedback-observations",
]

[[patches.agent]]
name = "polecat"
# polecat-non-impl-done is ABSENT ON PURPOSE — do not "restore" it.
#
# It is the largest artifact in this pack: 70,043 B rendered, 68% of the whole
# polecat prompt, re-paid on every compaction. It documents the done sequence
# for beads that produce no commits (PR signoffs, research), and the measurement
# in specs/tk-23wdf/context-budget-ledger.md §7 candidate 1 is that 2.3% of this
# pool's beads take that path — against 100% on polecat-codex, which is the
# signoff pool and keeps the fragment (agents/polecat-codex/agent.toml).
#
# The cost of the omission is stated in the ledger and accepted, not overlooked:
# the ~2% of claude-pool beads that are non-impl fall back to the impl done
# sequence and hand a zero-commit branch to the refinery, which needs a human
# nudge. The remedy is a research-dispatch emitter that names the method on the
# bead (§6, second MIGRATE row) — nobody has written it — NOT re-adding 70 KB to
# every spawn.
#
# doctor/check-polecat-fragment-sync asserts this list against every native pool
# that shares the base prompt, so the divergence is declared there as a
# pool-scoped exception. That declaration is what makes the fragment REQUIRED on
# polecat-codex rather than merely tolerated: drop it there too and the check
# errors.
inject_fragments_append = [
    "polecat-convoys",
    # Base ships the impl done sequence in two places that are read as one
    # instruction — approval-fallacy's "### The Done Sequence" and the prompt's
    # own "## FINAL REMINDER" — and both write the handoff note with `--notes`,
    # which REPLACES. Every handoff therefore destroys whatever notes the bead
    # already carried (typically the mayor's dispatch note), invisibly, at the
    # moment the bead is passed to the refinery (tk-t41dq). This fragment
    # supersedes the `--notes` in both copies and in mol-polecat-work's
    # submit-and-exit step. It is the anti-case to polecat-non-impl-done: a
    # 2,583 B correction on the path EVERY polecat takes.
    "polecat-append-notes",
    "file-work-records",
    # Feedback-learning loop (specs/2026-08-learning-system/
    # implementation-design.md §2a, §5): the capture fragment files
    # corrective feedback as observation beads; learned-conventions-polecat
    # is the distiller-managed rule surface, seeded empty. Any change to
    # this list must be hand-synced into agents/polecat-codex/agent.toml
    # inject_fragments (no automatic propagation) — and that hand-sync is
    # checked by doctor/check-polecat-fragment-sync.
    "file-feedback-observations",
    "learned-conventions-polecat",
]
# Deterministic work-bead description delivery: overlays/work-context/ ships a
# Claude `PostToolUse` hook that injects the work bead's own description right
# after the polecat claims it. Upstream mol-polecat-work/mol-polecat-base read
# the bead five times, always jq-filtered to one metadata field; the description
# reaches the worker only through `load-context`'s prose `gc bd show`, which the
# `implement` step never repeats and a mid-workflow respawn never runs. Both
# paths degrade silently to title-only (tk-osf13). The hook self-gates to
# GC_TEMPLATE polecat pools on the claude provider, so staging it elsewhere is a
# no-op. doctor/check-work-context-hook guards the wiring.
overlay_dir = "overlays/work-context"

[[patches.agent]]
name = "refinery"
inject_fragments_append = [
    "layered-startup-discovery-refinery",
    # The refinery holds the human-approval merge gate, so its entire subject
    # matter is work that is waiting on the operator — and it went the whole
    # life of the rule without receiving it. On 2026-08-13 the gascity refinery
    # spent ~7h escalating twice and re-narrating the clock over a queue whose
    # only content was PRs awaiting the operator's own approval: exactly the
    # behaviour of an agent that has never been told this is not reportable
    # (tk-l1pj6).
    #
    # The omission was not an oversight about this one name. The set of agents
    # that carry this fragment was derived from "which roles does the operator
    # converse with", and agents/mayor-thread/PROVENANCE.md wrote that reading
    # down as fact — "deacon, witness and refinery … are patrol / automation
    # roles, not operator-facing". That is the right test for whether a role
    # deserves an operator-spawnable THREAD. It is the wrong test for this
    # fragment, whose trigger is whether a human reads the agent's prose as a
    # report. The refinery is precisely where the two tests diverge: nobody
    # holds a sitting with it, and it still writes straight into the operator's
    # attention (pane narration, escalations, and `gc.routed_to=human` on the
    # beads it parks).
    #
    # doctor/check-operator-next-step-wiring now holds the corrected
    # classification for every agent in the pack and fails closed on an
    # unclassified one, so the next agent cannot inherit the same silence.
    "operator-next-step-trailing",
]
# Deterministic cycle-recycle (see deacon patch above).
overlay_dir = "overlays/cycle-recycle"

[[patches.agent]]
name = "witness"
inject_fragments_append = [
    "heartbeat-no-consent-ui",
    # Base witness reconciles its patrol wisps with `gc bd list --type=molecule`
    # and no --include-infra. Wisps are ephemeral (<store>.wisps), so those
    # queries return empty and every restart pours a fresh wisp while leaking
    # the prior one (tk-1waw2). This fragment supersedes both reconcile sites.
    "layered-startup-discovery-witness",
]
# Deterministic cycle-recycle (see deacon patch above).
overlay_dir = "overlays/cycle-recycle"

[[named_session]]
template = "mechanik"
scope = "city"
mode = "always"
