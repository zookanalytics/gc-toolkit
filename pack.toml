# gc-toolkit — primary pack for a Gas Town city.
#
# gc-toolkit imports the gastown pack wholesale and layers per-agent
# patches. See specs/tk-0t1ip/pack-patch-timing-analysis.md for the
# safety analysis and prerequisites: no city-level [imports.gastown],
# no [rigs.imports.gastown].
#
# Native gc-toolkit agents (mechanik, polecat-codex,
# _polecat-gemini, plus the *-thread
# variants) ship under agents/. Gastown roster (boot, deacon, mayor,
# polecat, refinery, witness) is imported and divergences are
# expressed as bare-name [[patches.agent]] — pure fragment-append
# overlays on top of base prompts. Each gc-toolkit-specific doctrine
# (heartbeat-no-consent-ui, layered-startup-discovery-{boot,deacon,refinery,witness},
# convoy-integration-branch-mayor, polecat-convoys, polecat-append-notes,
# polecat-non-impl-done,
# file-work-records, operator-next-step-trailing) lives in template-fragments/ and is named
# explicitly in inject_fragments_append below; the base prompt template is
# reused verbatim from gastown. No whole-file prompt mirrors.
#
# Opt-in sub-packs ship under packs/<name>/ and are imported by
# specific rigs (not by gc-toolkit's importers). The first sub-pack
# is `packs/gascity-keeper/` — the keeper agent + the
# mol-upstream-gc-* formula family + the refinery rebase-handling
# overlay, all of which are gascity-fork-specific and should not be
# loaded into rigs that don't carry a fork. See
# `packs/gascity-keeper/pack.toml` for the import wiring that the
# gascity rig adds in city.toml.
#
# Dog is intentionally NOT vendored: the imported gastown pack owns the
# dog pool (gastown/agents/dog/; gastown pack.toml: "This pack owns its
# dog pool") and ships dog as a city-scoped agent, so gc-toolkit needs no
# roster entry of its own.

[pack]
name = "gc-toolkit"
schema = 2

[imports.gastown]
# gastown composes from the public gascity-packs registry, resolved from
# the user-global pack cache (the running binary pre-seeds that cache with
# its embedded gastown PackFS at this pin). Builtin packs are not
# materialized into a per-city .gc/system/packs tree; see
# cmd/gc/embed_builtin_packs.go.
source = "https://github.com/gastownhall/gascity-packs/tree/main/gastown"
version = "sha:33d3a430a67d1782ad364556cb566bdb01d0afe3"

[global]
# Ordering is load-bearing. Gastown's tmux-theme.sh runs first (from
# the imported pack) and sets the full status-bar theme, including a
# status-right that points at gastown's status-line.sh. Our overrides
# below run AFTER (see gascity/internal/config/pack.go:1450 — "Collect
# globals: included globals first, then this pack's own"; iterated
# in order at runtime/tmux/adapter.go:824). The override script
# rewrites status-right to point at gc-toolkit-status-line.sh, which
# adds the composable title and indicator slots while preserving
# gastown's tier theming and `%H:%M` time slot.
session_live = [
    "{{.ConfigDir}}/assets/scripts/tmux-bindings.sh {{.ConfigDir}}",
    "{{.ConfigDir}}/assets/scripts/tmux-status-line-override.sh {{.Session}} {{.Agent}} {{.ConfigDir}}",
]

[[patches.agent]]
name = "boot"
inject_fragments_append = [
    # Base boot reads the deacon's patrol wisp with `gc bd list ... --json` and
    # no --include-infra, at two sites: the Step 2 triage query and the
    # "Check deacon work" quick-reference row. Wisps are ephemeral
    # (<store>.wisps), so both return empty on every wake and the triage rows
    # keyed on wisp staleness can never fire (lx-ody8m). This fragment
    # supersedes both sites.
    "layered-startup-discovery-boot",
]

[[patches.agent]]
name = "deacon"
inject_fragments_append = [
    "canonical-self-rename",
    "heartbeat-no-consent-ui",
    "layered-startup-discovery-deacon",
]
# Deterministic cycle-recycle: overlays/cycle-recycle/ ships a Claude `Stop` hook
# (.claude/settings.json + .claude/hooks/cycle-recycle.sh) staged into this agent's
# work dir. It self-gates to patrol roles, so the same overlay is a safe no-op
# elsewhere.
overlay_dir = "overlays/cycle-recycle"

[[patches.agent]]
name = "mayor"
inject_fragments_append = [
    "canonical-self-rename",
    "convoy-integration-branch-mayor",
    "operator-next-step-trailing",
]

[[patches.agent]]
name = "polecat"
inject_fragments_append = [
    "polecat-convoys",
    # Base ships the impl done sequence in two places that are read as one
    # instruction — approval-fallacy's "### The Done Sequence" and the prompt's
    # own "## FINAL REMINDER" — and both write the handoff note with `--notes`,
    # which REPLACES. Every handoff therefore destroys whatever notes the bead
    # already carried (typically the mayor's dispatch note), invisibly, at the
    # moment the bead is passed to the refinery (tk-t41dq). This fragment
    # supersedes the `--notes` in both copies and in mol-polecat-work's
    # submit-and-exit step. Ordered before polecat-non-impl-done, which
    # references the impl sequence it is an alternative to.
    "polecat-append-notes",
    "polecat-non-impl-done",
    "file-work-records",
]

[[patches.agent]]
name = "refinery"
inject_fragments_append = [
    "layered-startup-discovery-refinery",
]
# Deterministic cycle-recycle (see deacon patch above).
overlay_dir = "overlays/cycle-recycle"

[[patches.agent]]
name = "witness"
inject_fragments_append = [
    "heartbeat-no-consent-ui",
    # Base witness reconciles its patrol wisps with `gc bd list --type=molecule`
    # and no --include-infra. Wisps are ephemeral (<store>.wisps), so those
    # queries return empty and every restart pours a fresh wisp while leaking
    # the prior one (tk-1waw2). This fragment supersedes both reconcile sites.
    "layered-startup-discovery-witness",
]
# Deterministic cycle-recycle (see deacon patch above).
overlay_dir = "overlays/cycle-recycle"

[[named_session]]
template = "mechanik"
scope = "city"
mode = "always"
