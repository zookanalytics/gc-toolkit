<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>helm · C · Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="shared/base.css">
<style>
  body { overflow: hidden; background: #eeece6; }
  #stage { position: fixed; inset: 0; overflow: hidden; cursor: grab; background-image: radial-gradient(#d9d5cb 1px, transparent 1px); background-size: 22px 22px; }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .island { position: absolute; width: 380px; border-radius: 18px; background: hsl(var(--h) 55% 97%); box-shadow: 0 0 0 1.5px hsl(var(--h) 40% 82%), 0 6px 18px rgba(30, 30, 30, 0.06); padding: 12px 12px 14px; }
  .island.loose { background: #f7f7f5; box-shadow: 0 0 0 1.5px #d4d7dc, 0 6px 18px rgba(30, 30, 30, 0.05); border-style: dashed; }
  .island.wants { box-shadow: 0 0 0 2px var(--you-line), 0 0 0 7px rgba(239, 197, 150, 0.25), 0 6px 18px rgba(30, 30, 30, 0.06); }
  .island .ih { display: flex; align-items: center; gap: 9px; cursor: zoom-in; margin-bottom: 8px; }
  .emb { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; background: hsl(var(--h) 52% 55%); letter-spacing: 0.02em; }
  .island.loose .emb { background: #a6adb8; }
  .island .it { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .island .isub { font-size: 11.5px; color: var(--ink-3); }
  .island .bar { margin: 0 2px 10px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .chip2 { height: 26px; border-radius: 7px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px; cursor: pointer; overflow: hidden; white-space: nowrap; }
  .chip2 .lbl { overflow: hidden; text-overflow: ellipsis; }
  .chip2.s-you { box-shadow: inset 0 0 0 1.5px var(--you-line), 0 0 0 3px rgba(239, 197, 150, 0.35); background: #fffaf3; }
  .chip2.s-stuck { box-shadow: inset 0 0 0 1.5px #efb3aa; }
  .chip2.pile { box-shadow: inset 0 0 0 1px var(--line), 2px 2px 0 -1px #fff, 2px 2px 0 0 var(--line-2), 4px 4px 0 -1px #fff, 4px 4px 0 0 var(--line-2); }
  .chip2.sel { outline: 2px solid var(--focus); outline-offset: 1px; }
  .chip2 .n { font-weight: 700; }
  .sub { margin-top: 10px; border-radius: 13px; padding: 9px; background: hsl(var(--h) 50% 94%); box-shadow: inset 0 0 0 1px hsl(var(--h) 35% 84%); }
  .sub .ih .emb { width: 24px; height: 24px; border-radius: 8px; font-size: 10.5px; }
  .sub .it { font-size: 13px; }
  .landed { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; display: flex; gap: 6px; align-items: center; }
  /* far: each item is a block of its state's color, and names float in screen space */
  .far .chip2 { background: var(--queued-soft); box-shadow: none; }
  .far .chip2 .lbl, .far .chip2 .dot { visibility: hidden; }
  .far .chip2.s-you { background: var(--you); }
  .far .chip2.s-moving { background: var(--moving); }
  .far .chip2.s-stuck { background: var(--stuck); }
  .far .chip2.s-held { background: #cdc7e6; }
  .far .chip2.s-queued { background: #d3d8df; }
  .far .island .ih, .far .landed { visibility: hidden; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .flabel { position: absolute; display: flex; align-items: center; gap: 8px; pointer-events: auto; cursor: zoom-in; background: rgba(255, 255, 255, 0.92); padding: 4px 10px 4px 4px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); white-space: nowrap; font-weight: 650; font-size: 13px; }
  .flabel .emb { width: 26px; height: 26px; border-radius: 8px; font-size: 11px; }
  .flabel .badge-you { font-size: 11.5px; line-height: 18px; }
  .hidden { display: none !important; }
  /* chrome */
  .tools { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; background: rgba(255, 255, 255, 0.94); padding: 6px 10px; border-radius: 12px; box-shadow: var(--shadow-lift); z-index: 10; }
  .tools .brand { font-weight: 700; margin-right: 6px; }
  .tools .brand small { font-weight: 500; color: var(--ink-3); margin-left: 6px; }
  .jump { position: fixed; top: 64px; left: 12px; bottom: 12px; width: 300px; background: rgba(255, 255, 255, 0.96); border-radius: 14px; box-shadow: var(--shadow-lift); z-index: 10; display: flex; flex-direction: column; overflow: hidden; }
  .jump header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  .jump header b { font-size: 15px; }
  .jump header p { margin: 2px 0 0; font-size: 12px; color: var(--ink-3); }
  .jump .list { overflow: auto; padding: 6px; }
  .j { padding: 7px 8px; border-radius: 9px; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 6px; font-size: 12.5px; }
  .j:hover, .j.on { background: #fbf4e8; }
  .j .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .j .m { grid-column: 2; color: var(--ink-3); font-size: 11.5px; display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
  .panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 410px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lift); z-index: 12; padding: 16px 18px 30px; overflow: auto; transform: translateX(110%); transition: transform 0.22s ease; }
  .panel.open { transform: none; }
  .mini { position: fixed; right: 12px; bottom: 12px; width: 180px; height: 150px; background: rgba(255, 255, 255, 0.92); border-radius: 12px; box-shadow: var(--shadow-lift); z-index: 9; overflow: hidden; cursor: pointer; }
  .mini div { position: absolute; border-radius: 2px; }
  .mini .vp { border: 1.5px solid var(--focus); background: rgba(47, 111, 237, 0.06); border-radius: 3px; }
  .zoomv { font-size: 12px; color: var(--ink-3); min-width: 40px; text-align: right; }
  kbd { font: 11px var(--mono); background: var(--surface-2); border-radius: 4px; padding: 0 4px; box-shadow: inset 0 0 0 1px var(--line-2); }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<div id="labels"></div>
<div class="tools">
  <span class="brand">helm <small>C · Canvas</small></span>
  <button class="btn small" id="fit" title="fit everything (0)">Fit all</button>
  <button class="btn small" id="zin" title="zoom in (+)">+</button>
  <button class="btn small" id="zout" title="zoom out (−)">−</button>
  <button class="btn small primary" id="next" title="fly to the next thing that needs you (n)">Next for you · <kbd style="background:#3a404a;color:#fff;box-shadow:none">n</kbd></button>
  <span class="zoomv num" id="zoomv"></span>
</div>
<aside class="jump" id="jump"></aside>
<aside class="panel" id="panel"><button class="btn small" id="pclose" style="float:right">Close · Esc</button><div id="pbody"></div></aside>
<div class="mini" id="mini"></div>
<div class="proto-note">Prototype on a sample board · drag to pan · pinch or ctrl+scroll to zoom · drag an island's name to move it</div>
<script src="shared/sample-board.js"></script>
<script src="shared/model.js"></script>
<script src="shared/ui.js"></script>
<script src="c-canvas.js"></script>
</body>
</html>
