# pr-reconcile — the landing order (specs/tk-1tfzr71.66/design.md, section 4).
# The refinery records each PR it publishes as pending on the bead that owns it
# (gctk pr record), and this order reads those records: a PR the evaluator
# finds ready is merged with its head pinned, or added to its base's merge
# queue, and its bead closes once the merge commit is on the freshly fetched
# target. A PR open at another head goes back to the refinery, and the
# exceptions stay blocked behind a human gate. A PR that waits on your approval
# or its checks holds no agent: the wait is this order's next run.
#
# Exec, not a formula: a run reads records and GitHub and writes guarded
# updates, with no judgment for an LLM. Rig-scoped, each run against its own
# rig's store, with the rig's checkout as its working directory, where it
# fetches the target. pr-reconcile.sh names the rig's refinery from the
# roster and execs `gctk pr reconcile`.
#
# One run at a time is not what holds two runs apart. Gas City starts no run
# while the last one's tracking bead or work is open, but its watchdog closes a
# tracking bead two minutes after it was made whether or not its run still
# works, so the next tick can start a second run beside the first. Each run
# therefore reads each record under the store's record lock, from its read of
# the record to its last write of it, and two runs that overlap act on one
# record one after the other. No webhook fires this order, since an order a
# webhook fires skips Gas City's gates and each event would start a run of its
# own.
#
# A run reads at most 20 records, the least recently checked first, and starts
# none after four minutes (gctk pr reconcile's --count and --budget). One record
# whose PR is open costs about seven seconds, measured on 2026-11-12, so a run
# ends inside the 300-second timeout, and the kernel frees the lock of a run
# the timeout stops. Every 5 minutes, a cycle over 50 open records takes three
# runs, so a PR lands within about fifteen minutes of the last thing it waits
# for, the design's landing-time check being nine in ten within 3 hours. Tune
# from city.toml [[orders.overrides]].
[order]
description = "Landing order: read each PR the refinery recorded as pending, merge a ready one with its head pinned, and close its bead once the merge commit is on the target"
trigger = "cooldown"
interval = "5m"
timeout = "300s"
exec = "$PACK_DIR/assets/scripts/pr-reconcile.sh"
scope = "rig"
