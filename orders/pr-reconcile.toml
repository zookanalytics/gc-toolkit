# pr-reconcile — the landing order (specs/tk-1tfzr71.66/design.md, section 4,
# and specs/tk-1tfzr71.149/design.md, sections 5 and 6). The refinery records
# each PR it publishes as pending on the bead that owns it (gctk pr record), and
# this order is the second of the PR's two loops: it finds and does its work
# from the read the PR watch (orders/pr-poll.toml and orders/pr-compare.toml)
# saved on each bead and the store alone, and reads GitHub to learn nothing. A
# run decides every record each minute: a merge pinned to the head the
# evaluator judged, or added to its base's merge queue with it, an exception, a
# draft's ready transition, and a withdrawal's dismissals and close. A red
# required check or a conflict on an owned PR becomes an ask for the PR's review
# run, a re-run of the failed jobs, a restart of a check that never reports or,
# where the city cannot go on, a human gate, which the run withdraws once the
# checks pass (gctk pr reconcile's help says when). Only the
# merge checks GitHub first: the run has the one-PR update re-read the PR in
# full and decides again on what that read saved before it requests the merge.
# Its bead closes once the merge commit is on the freshly fetched target. A PR
# open at another head goes back to the refinery, which a run wakes and nudges
# for it when only a conversation or an ask holds the PR's bead, and the
# exceptions stay blocked behind a human gate. A PR a ruling retired
# (pr-dispose.sh) is never merged, and once the saved read shows it closed its
# bead closes onto the ruling's successor through bead-rehome.sh. A PR open at
# its validated head with no passed review result there, or with an ask a run
# can take, gets its review run poured here (gctk pr reconcile's help says
# when), and a run that ends without a result is poured again once before a
# human gate asks you. A PR that waits on your approval or its checks holds no
# agent: this order carries the wait.
# Once a PR lands on the rig's default branch, a run checks that branch's seed
# audit, where the rig's clone carries one, and hands the pages stale there to
# seed-audit-reaudit.sh, which slings the branch's one re-render. No PR waits
# on the check or on the re-render.
# Each run also keeps the status: and held: labels of every PR the rig's live
# beads own, on the pending record or not, equal to what the store derives
# (specs/tk-1tfzr71.149/design.md, section 9): it compares the labels the
# one-PR update saved on the PR's bead with the ones gctk pr status derives,
# none once the saved read shows the PR merged or closed, and where they differ
# it has pr-status-label.sh, which reads the PR's labels itself, write them,
# reading nothing of the PR first. A label write is an act like the others, and
# one that does not land records nothing, so the next run writes it again.
#
# Exec, not a formula: a run reads records and writes guarded updates, with no
# judgment for an LLM. Rig-scoped, each run against its own rig's store, with
# the rig's checkout as its working directory, where it fetches the target.
# pr-reconcile.sh names the rig's refinery from the roster and execs `gctk pr
# reconcile`.
#
# One run at a time is not what holds two runs apart. Gas City starts no run
# while the last one's tracking bead or work is open, but its watchdog closes a
# tracking bead two minutes after it was made whether or not its run still
# works, so the next tick can start a second run beside the first. Each act
# therefore reads its record under the store's record lock, from its read of
# the record to its last write of it, and two runs that overlap act on one
# record one after the other. No webhook fires this order, since an order a
# webhook fires skips Gas City's gates and each event would start a run of its
# own.
#
# Every minute, because a run that owes no act reads the store once, asks
# GitHub nothing and writes nothing, and takes no --count. A change on the
# store's side that no writer announces, such as a gate a person clears,
# reaches its act at the next run, and a change a cheap sign shows reaches it
# within about three minutes at the most, the PR watch's minute, this order's
# minute and each run's start at the next lane pass included. A change no sign
# shows reaches it within the hour, once the net saves it. A run takes the
# records that owe an act in a shuffled order, starts none more than 45 seconds
# in, and stops each at 30 seconds with whatever GitHub call, fetch, store read
# or write, human gate's filing or refinery's wake it is making: a fetch gets a
# SIGTERM to git's process group, so git removes the lock files it holds in the
# checkout, and a kill only if it still runs 5 seconds later. The stop ends no
# review run's pour, since a cook stopped before it attaches its run leaves a
# run this order never reads, so an act starts a pour only while 10 seconds of
# its 30 remain, and no disposition writer, since a stop after its close and
# before it ends the bead's branch would leave that branch. An act
# that fails or is stopped records nothing on the bead: the record stays due,
# the next run decides it again, and the run exits 2, so Gas City's run record holds
# the failure. `timeout` holds the 45 seconds of starting acts, the last act's
# 30 seconds and its fetch's 5, the listing and the seed audit's check, which
# starts only inside the 45 seconds; gctk's cli test asserts the bounds sit
# below it. A pour or a disposition writer that runs past its act's 30 seconds
# is ended only by `timeout`. Tune from city.toml [[orders.overrides]].
[order]
description = "Landing order: decide each PR the refinery recorded as pending on the read the PR watch saved and the store, merge a ready one with its head pinned once the one-PR update has re-read it, close its bead once the merge commit is on the target, and keep each owned PR's labels equal to what the store derives"
trigger = "cooldown"
interval = "1m"
timeout = "120s"
exec = "$PACK_DIR/assets/scripts/pr-reconcile.sh"
scope = "rig"
