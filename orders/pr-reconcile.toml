# pr-reconcile — the landing order (specs/tk-1tfzr71.66/design.md, section 4,
# and specs/tk-1tfzr71.149/design.md, sections 5 and 6). The refinery records
# each PR it publishes as pending on the bead that owns it (gctk pr record), and
# this order acts on those records from the beads: a run decides each record
# from the store and the read the one-PR update saved on its bead
# (orders/pr-poll.toml), and reads GitHub only for a merge, which it decides
# again on its own read of the PR and pins to the head it judged, or adds to
# its base's merge queue with it. Its bead closes once the merge commit is on
# the freshly fetched target. A PR open at another head goes back to the
# refinery, and the exceptions stay blocked behind a human gate. A PR open at
# its validated head with no passed review result there, or with an ask a run
# can take, gets its review run poured here (gctk pr reconcile's help says
# when), and a run that ends without a result is poured again once before a
# human gate asks you. A PR that waits on your approval or its checks holds no
# agent: the wait is this order's next run. Once a PR lands on the rig's
# default branch, a run checks that branch's seed audit, where the rig's clone
# carries one, and hands the pages stale there to seed-audit-reaudit.sh, which
# slings the branch's one re-render. No PR waits on the check or on the
# re-render.
#
# Exec, not a formula: a run reads records and writes guarded updates, with no
# judgment for an LLM. Rig-scoped, each run against its own rig's store, with
# the rig's checkout as its working directory, where it fetches the target.
# pr-reconcile.sh names the rig's refinery from the roster and execs `gctk pr
# reconcile`.
#
# One run at a time is not what holds two runs apart. Gas City starts no run
# while the last one's tracking bead or work is open, but its watchdog closes a
# tracking bead two minutes after it was made whether or not its run still
# works, so the next tick can start a second run beside the first. Each act
# therefore reads its record under the store's record lock, from its read of
# the record to its last write of it, and two runs that overlap act on one
# record one after the other. No webhook fires this order, since an order a
# webhook fires skips Gas City's gates and each event would start a run of its
# own.
#
# Every minute, because a run reads no record's PR to decide: it decides every
# record from the beads and takes no --count. A change on the store's side that
# no writer announces, such as a gate a person clears, reaches its act at the
# next run, and a change a cheap sign shows reaches it within about four
# minutes at the most, the PR watch's two and each run's start at the next lane
# pass included (specs/tk-1tfzr71.149/design.md, section 6). A run takes the
# records that owe an act in a shuffled order, starts none more than 45 seconds
# in, and stops each at 30 seconds with whatever GitHub call or fetch it is
# making: a fetch gets a SIGTERM to git's process group, so git removes the
# lock files it holds in the checkout, and a kill only if it still runs 5
# seconds later. An act that fails or is stopped records nothing on the bead:
# its difference stays, the next run acts on it, and the run exits 2, so Gas
# City's run record holds the failure. `timeout` holds the 45 seconds of
# starting acts, the last act's 30 seconds and its fetch's 5, the listing and
# the seed audit's check, which starts only inside the 45 seconds; gctk's cli
# test asserts the bounds sit below it. Tune from city.toml
# [[orders.overrides]].
[order]
description = "Landing order: act from the beads on each PR the refinery recorded as pending, merge a ready one on its own read with its head pinned, and close its bead once the merge commit is on the target"
trigger = "cooldown"
interval = "1m"
timeout = "120s"
exec = "$PACK_DIR/assets/scripts/pr-reconcile.sh"
scope = "rig"
