# feedback-miner — daily sweep of THIS rig's merged/closed PR review threads:
# files one closed observation bead per review post from outside the city, and
# one per corrective-feedback hit in the city's own posts (obs.source=miner),
# deduped on (obs.provenance, obs.category).
# Observations, and one finding when a city post lacks its mark — judging is
# the distiller's. Rig-scoped with a BARE pool so the wisp lands in, and is
# claimed from, each importing rig's own polecat store; no home-rig gate on
# purpose (D5) — a rig without gh/GitHub/auth no-ops on step 1.
[order]
description = "learning: mine this rig's merged/closed PR review threads for outside review feedback and corrective feedback; file observation beads"
formula = "mol-feedback-miner"
trigger = "cooldown"
interval = "24h"
pool = "gc-toolkit.polecat"
scope = "rig"
