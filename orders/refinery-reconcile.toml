# refinery-reconcile — the merge cadence, controller-owned. Runs the five arms
# (gate-ensure, pr-open, merge, pr-facts, convoy-graduate) once per tick; the
# dispatcher's open-tracking gate keys on ScopedName() (refinery-reconcile:rig:
# <rig>), which IS the single-flight guarantee — never set no_work_gate, that
# flag opts out of exactly that gate. `timeout` must stay under core
# order-tracking-sweep's 10m stale window, or a swept tracking bead becomes a
# second dispatch. scope=rig: one registration, store, identity and clock per
# importing rig; per-rig values are derived inside the runner from GC_RIG.
# Tune the interval from city.toml [[orders.overrides]], not here.
[order]
description = "Refinery merge cadence: ensure gates, open pre-open PRs, land approved PRs, record external PR facts, graduate convoys"
trigger = "cooldown"
interval = "60s"
timeout = "300s"
exec = "$PACK_DIR/assets/scripts/refinery-reconcile.sh"
scope = "rig"
