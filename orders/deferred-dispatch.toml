# deferred-dispatch — perform the dispatches owed once their blockers clear.
# `gc sling` reads no `blocks` deps, so a dep between work beads holds nothing;
# `deferred-dispatch.sh arm` records the owed dispatch ON the bead and this
# order slings each armed bead once `bd` reports it ready. Exec, not a formula:
# one `bd list` + one sling per ready bead needs no LLM. Rig-scoped: one pass
# per importing rig against its own store; the runtime's open-tracking gate is
# the single-flight guard, so keep `timeout` under the tracking sweep's
# stale-after (10m). Tune interval from city.toml [[orders.overrides]].
[order]
description = "Deferred dispatch: sling every bead whose dispatch was armed and whose blockers have now cleared; retire the record on beads that closed first"
trigger = "cooldown"
interval = "2m"
timeout = "120s"
exec = "$PACK_DIR/assets/scripts/deferred-dispatch.sh reconcile"
scope = "rig"
