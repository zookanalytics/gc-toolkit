# deferred-dispatch — start each armed bead once nothing holds it.
# `gc sling` reads no `blocks` deps, so a dep between work beads holds nothing;
# `gctk bead arm` records the start ON the bead, and this order's pass,
# `gctk bead start-armed`, slings each armed bead the pool's own serve rule
# would serve, exactly once, and retires the arm of a bead that closed or whose
# work another path delivered (docs/deferred-dispatch.md). Exec, not a formula:
# store reads plus one sling per owed bead need no LLM. Rig-scoped: one pass
# per importing rig against its own store, named by --db.
# Single-flight is the runtime's open-tracking gate, and beneath it each sling
# runs under the bead's own dispatch lock and Gas City's launch lock, so two
# passes over one store pour once. Never set no_work_gate.
# `timeout` gives a pass room to read the armed set and finish several slings.
# The start begins no sling once less than one 90s allowance is left before its
# 7m deadline, so `timeout` stays above that deadline: an override that lowers
# it below 7m lets the timeout cut a sling short, and the next pass finds that
# sling's pour by its title token. services/gctk/arm's test asserts the
# deadline sits below this timeout. GCTK_SCRIPTS_DIR names the pack's scripts,
# through which the start asks a person. Tune from city.toml
# [[orders.overrides]].
[order]
description = "Deferred dispatch: start every armed bead that nothing holds any more, once, and retire the arm on a bead that closed or whose work another path delivered"
trigger = "cooldown"
interval = "5m"
timeout = "600s"
exec = "GCTK_SCRIPTS_DIR=\"$PACK_DIR/assets/scripts\" \"${GCTK_BIN:-$GC_CITY_PATH/.gc/services/gctk/bin/gctk}\" bead start-armed --db \"$GC_RIG_ROOT/.beads\""
scope = "rig"
