# gctk-build — keep the deployed gctk binary current with services/gctk.
# The merge cadence exec's a prebuilt binary and builds nothing, so the build
# runs here, through the builder the helm-build order also runs. Staleness is
# `find -newer` OR a recorded binary_rev other than the revision the tick sees,
# since find -newer is blind to an input a commit deleted; a tick with nothing
# to do costs one find, one record read, one count of the commits origin/main
# is ahead under services/gctk, and one status write, plus an origin fetch at
# most once per 30 minutes. There is no service to restart: a published gctk is
# serving the moment it lands.
# timeout 300s: the module is stdlib-only, so even a cold build is seconds —
# the bound is for a wedged toolchain or fetch, not for the compile.
[order]
description = "Build the gctk binary when services/gctk is newer than it"
trigger = "cooldown"
interval = "5m"
exec = "$PACK_DIR/assets/scripts/gc-build.sh gctk --deploy"
timeout = "300s"
scope = "city"
