# gctk-build — keep the deployed gctk binary current with its sources,
# services/gctk and the root go.mod and go.sum.
# The merge cadence exec's a prebuilt binary and builds nothing, so the build
# runs here, through the builder the helm-build order also runs. A condition
# order: each pass runs the check, `gc-build.sh gctk --due`, and the order runs
# only when it answers that a run is owed and due, by the rule at the script's
# check. The check reads the checkout and gctk's state root and asks gc
# nothing, so the default check_timeout holds it. There is no service to
# restart: a published gctk is serving the moment it lands.
# timeout 300s: gctk's one direct dependency is cobra, and even a cold
# build that downloads it takes seconds. The bound is for a wedged toolchain or
# fetch, not for the compile.
[order]
description = "Build the gctk binary when it is missing or built from another revision than the checkout's"
trigger = "condition"
check = "$PACK_DIR/assets/scripts/gc-build.sh gctk --due"
exec = "$PACK_DIR/assets/scripts/gc-build.sh gctk --deploy"
timeout = "300s"
scope = "city"
