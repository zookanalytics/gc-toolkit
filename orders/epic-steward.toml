# epic-steward — the cadence that gives the city its tendency to elaborate and
# advance epics. One pass reads every open epic in the rig and, for each, files
# the operator the decision that epic now owes: a floor contract for an epic
# with no recorded hypothesis, the rest of the contract once the floor is set,
# and a hypothesis ruling once the epic's units have all landed. A fourth arm —
# a membership sweep for work that has drifted outside its epic — is deferred
# (docs/epic-stewardship.md names the deferral). It is the second steward in the
# pack after the refinery and wears the same shape — enumerate the stewarded
# object, run independent arms, surface the follow-up — and like the refinery it
# is NOT a doctor check: doctor is already over-leveraged, so its only role here
# is asserting this order is live (check-cadence-live covers any orders/ file).
#
# exec, not a formula: a pass is an enumeration, a set of metadata-presence
# gates, and a deduped visit per owed decision — no LLM judgment runs in the
# pass (deferred-dispatch takes the same stance). The judgment an epic needs,
# drafting its hypothesis and ruling on it, is the operator's and is surfaced at
# the visit; generating the draft itself is a later arm, not this one.
#
# The interval is a heartbeat, not the cadence: every arm is idempotent and
# every visit is deduped by (epic, concern) and retracted when the concern
# clears, so a frequent pass re-files nothing. Frequency only shortens how long
# a newly created epic waits for its first audit — the create-time half, which a
# short interval approximates until a first-reaction arm makes it exact. Tune it
# from city.toml [[orders.overrides]], not here.
#
# scope=rig: an epic is a durable per-rig anchor (services/helm), so one
# registration, store, identity and clock per importing rig, each reading its
# own epics. Single-flight is a per-rig flock the driver holds; `timeout` bounds
# how long one wedged pass can hold it.
[order]
description = "Epic stewardship: audit every open epic and file the operator the floor contract, the rest of the contract, or the hypothesis ruling it owes"
trigger = "cooldown"
interval = "1h"
timeout = "300s"
exec = "$PACK_DIR/assets/scripts/epic-steward.sh"
scope = "rig"
