# pool-slot-reap — close the asleep pool session beads that hold a pool slot
# with no runtime and no work.
#
# The controller counts every open pool session bead against its pool's cap and
# frees a slot only when the session in it sleeps for a reason on core's
# freeable list. A pool session stopped by `gc session kill` sleeps as `killed`,
# which is not on that list, so when it holds no work it keeps its slot with
# nothing running in it, and the pool runs below the cap it reports. This pass
# closes such a bead once it has stayed asleep past a grace window with no work
# assigned in any store, leaves deliberate holds and named sessions alone, and
# records each close as a `cleanup` entry in the incident ledger.
#
# City scope: session beads live in the city store and their work can sit in
# any rig's store, so one pass reads the whole city. A pass skipped or cut short
# costs only the close the next pass takes instead; the close is idempotent.
#
# The 600s timeout sits above the longest pass the script allows. No read starts
# after its 240s budget (POOL_SLOT_REAP_BUDGET_S), so a pass ends within the
# budget, plus one read that started just before it ran out, plus the last
# candidate's close tail: the close, the read that settles a failed close,
# and the ledger append. Each of those calls is stopped by 65s (a 60s bound and
# a 5s SIGKILL grace), so a pass ends within 500s, and the timeout never lands
# between a close and its ledger entry.
[order]
description = "Close asleep pool session beads that hold a slot with no runtime and no work past a grace window (e.g. after gc session kill); record each in the incident ledger"
trigger = "cooldown"
interval = "5m"
exec = "$PACK_DIR/assets/scripts/pool-slot-reap.sh"
timeout = "600s"
scope = "city"
idempotent = true
