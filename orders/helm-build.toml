# helm-build — keep the served helm binary current with its sources:
# services/helm, services/gctk, whose packages it imports, and the root go.mod
# and go.sum.
# The service launcher only exec's a prebuilt binary (a build cannot fit the
# 5s readiness probe), so the build runs here and build-and-restart is ONE
# step. A condition order: each pass runs the check, `gc-build.sh helm --due`,
# and the order runs only when it answers that a run is owed and due, by the
# rule at the script's check. The check reads the checkout and the service's
# state root and asks gc nothing, so the default check_timeout holds it.
# timeout 900s: a cold build must be allowed to finish, under any load.
# A city that declares no helm service never gets a binary, so a run stays
# owed there, every five minutes, and each one records that there is nothing
# to deploy.
[order]
description = "Build the helm binary when it is missing or built from another revision than the checkout's, and restart the service onto it"
trigger = "condition"
check = "$PACK_DIR/assets/scripts/gc-build.sh helm --due"
exec = "$PACK_DIR/assets/scripts/gc-build.sh helm --deploy"
timeout = "900s"
scope = "city"
