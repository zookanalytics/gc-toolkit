# helm-build — keep the served helm binary current with services/helm.
# The service launcher only exec's a prebuilt binary (a build cannot fit the
# 5s readiness probe), so the build runs here and build-and-restart is ONE
# step. Staleness is `find -newer`, a recorded binary_rev other than the
# revision the tick sees (find -newer is blind to an input a commit deleted),
# or a binary that cannot read the city's bead stores; a tick with nothing to
# do costs one find, one record read and one probe.
# timeout 900s: a cold build measured 2m29s and must be allowed to finish.
# No-op in cities that declare no helm service.
[order]
description = "Build the helm binary when services/helm is newer than it, and restart the service onto the result"
trigger = "cooldown"
interval = "5m"
exec = "$PACK_DIR/assets/scripts/gc-helm-build.sh --deploy"
timeout = "900s"
scope = "city"
