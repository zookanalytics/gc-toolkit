# mail-notify-on-send — when mail is sent, request a turn for each converse
# sitting that holds unread mail no notice has told it of. Gas City requests a
# recipient's turn only when the sender passes --notify, and mail sent from
# the dashboard cannot, so without this a sitting sees its mail only when the
# operator next types in it. `gctk mail notify --help` states the rule.
#
# The event starts the pass and decides nothing. The pass reads each sitting's
# unread mail again, so mail whose event Gas City did not record wakes its
# sitting at the next pass, and a message already read, mail a sitting sends
# itself, such as a handoff, and mail whose sender's --notify notice is still
# queued request no turn. A sitting that has finished, or is suspended, keeps
# its mail waiting. Its twin, mail-notify-on-reply, runs the same pass when
# mail is replied to, since an order's event trigger names one event type.
#
# The turn arrives on the orders lane's next pass after the mail, about 30
# seconds by default ([daemon] patrol_interval), and later when the lane has
# more due orders than it starts in one pass. Mail sent with --notify starts
# its turn in seconds, and the pass then finds it read or still queued.
#
# Exec, not a formula: a pass reads lists and sends nudges, with no judgment
# for an LLM. City scope, since mail and sessions are the city's: one run per
# city. A pass ends at its two-minute deadline, inside this timeout, and runs
# in about ten seconds.
#
# GCTK_MAIL_NOTIFY_AGENTS names the agents whose sessions are woken, by the
# name the pack gives each. A city wakes another agent's sessions the same way
# with an entry for each of the two orders in city.toml:
#
#   [[orders.overrides]]
#   name = "mail-notify-on-send"
#   env = { GCTK_MAIL_NOTIFY_AGENTS = "<the converse templates> <another agent>" }
#
# Gas City has ruled to wake a session on its mail natively, with a debounce
# (gastownhall/gascity#1966). Once the city runs a Gas City that does, the two
# orders and the verb retire.
[order]
description = "When mail is sent, request a turn for each converse sitting that holds unread mail no notice has told it of"
trigger = "event"
on = "mail.sent"
timeout = "150s"
exec = "\"${GCTK_BIN:-$GC_CITY_PATH/.gc/services/gctk/bin/gctk}\" mail notify --agents \"$GCTK_MAIL_NOTIFY_AGENTS\""
scope = "city"

[order.env]
# The pack's converse templates, the agents under agents/converse-*.
GCTK_MAIL_NOTIFY_AGENTS = "converse-claude-fable converse-claude-opus converse-codex converse-codex-astra converse-codex-sol converse-fable converse-opus"
