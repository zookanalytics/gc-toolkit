# notification-wisp-reap — collapse the surplus copies of a repeated core
# "ESCALATION: <headline>" notice to one open notice in the city store. core
# files a fresh copy each time a monitored condition re-fires and nothing on
# the creating side dedupes them, so they accumulate on the operator's board.
# This is the backstop that missing ending assumes.
#
# City scope: the notices live in the one city store, so one pass reads them
# all. The sweep is idempotent; a pass skipped or cut short by its budget costs
# only the reap the next pass takes instead.
[order]
description = "Collapse duplicate 'ESCALATION' notice copies to one open notice in the city store"
trigger = "cooldown"
interval = "1h"
exec = "$PACK_DIR/assets/scripts/notification-wisp-reap.sh"
timeout = "900s"
scope = "city"
idempotent = true
