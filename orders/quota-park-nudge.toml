# quota-park-nudge — resume agents parked at a provider quota banner. The
# controller reads a parked session as healthy and nothing else wakes it when
# the window reopens. Every 3m, city-wide: peek each live pane, nudge the ones
# showing a limit banner, back off per session up to 15m. Nudge-only (a no-op
# for busy or still-blocked agents); deliberately ignores the banner's stated
# reset time — quota also returns by routes no banner predicts.
[order]
description = "Nudge sessions parked at a provider quota banner until the window reopens"
trigger = "cooldown"
interval = "3m"
exec = "$PACK_DIR/assets/scripts/quota-park-nudge.sh"
scope = "city"
