# converse-reap — end a converse sitting once its conversation is over.
#
# A sitting is a manual converse session under the alias of the conversation it
# holds. Gas City does not end a manual session when its work closes, so a
# sitting closes its own session once its conversation closes or goes back to
# the operator's queue, and a dismiss closes the session that held the
# conversation it closed. This order is the backstop for a session that
# outlives its conversation anyway, under the warrant in docs/warrants.md
# (Converse reap): a converse session whose conversation reads closed, gone or
# back in the queue is settled, so it is closed, attached or not. Viewing a
# sitting does not keep it open: an attached tab exits when the session ends
# and prints the last hand-back recorded on the conversation.
# --min-age is this order's interval in seconds. A session younger than one pass
# may be a sitting engage has started and not yet bound, and a conversation
# written less than one pass ago may still be taking its sitting's last
# hand-back, so either waits a pass.
#
# City scope: converse sessions span rigs and `gc bd show` resolves a
# conversation across ledgers, so one pass reads the whole city. A pass skipped
# or cut short costs only the reap the next pass takes instead; the reap is
# idempotent.
[order]
description = "Close converse sittings whose conversation is gone, or has closed or returned to the operator's queue and taken no write for a pass, attached or not; ends the live sessions they leak"
trigger = "cooldown"
interval = "5m"
exec = "$PACK_DIR/assets/scripts/converse-reap.sh --min-age 300"
timeout = "120s"
scope = "city"
idempotent = true
