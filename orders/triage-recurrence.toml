# triage-recurrence — keeps scoped triage conversations alive exactly
# when warranted. For each open triage-subject bead in the rig, the
# formula files one visit IF the scope has candidates and no visit is
# already open. No candidates → no visit → no board row: pull-only
# holds (a visit is a board row, never a ping).
#
# Spec: specs/2026-08-fresh-start/liveness-and-triage-spec.md §3;
# principle: specs/2026-08-fresh-start/operating-principles.md P3 —
# scoped triage subjects, plural, on common patterns; the clean form of
# the mayor's triage hat, without a resident-agent context blob.
#
# Daily cadence: triage is prioritization, not incident response. The
# liveness sweep (6h) catches unnamed waits; this order only refreshes
# deliberate, scoped triage conversations.
#
# Rig scope + BARE pool — a qualified pool strands the wisp in every
# importer; a bare pool qualifies within each importing rig, so each
# rig evaluates its own triage subjects in its own store.
[order]
description = "triage recurrence: file a visit on each triage-subject bead with candidates in scope and no open visit (pull-only)"
formula = "mol-triage-recurrence"
trigger = "cooldown"
interval = "24h"
pool = "gc-toolkit.polecat"
scope = "rig"
