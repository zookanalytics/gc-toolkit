# triage-recurrence — keeps scoped triage conversations alive exactly
# when warranted. For each open triage-subject bead in the rig, the
# formula files one conversation turn IF the scope looks ripe and no
# turn is already open. No candidates → no turn → no board row:
# pull-only holds (a turn is a board row, never a ping).
#
# Spec: specs/2026-08-fresh-start/liveness-and-triage-spec.md §3;
# design: operating-principles.md P3 resolution (operator, 2026-08-08 —
# scoped triage subjects, plural, on common patterns; the clean form of
# the mayor's triage hat, without the resident-agent context blob).
#
# Daily cadence: triage is prioritization, not incident response. The
# liveness sweep (6h) catches unnamed waits; this order only refreshes
# deliberate, scoped triage conversations.
#
# Rig scope + BARE pool, per the doc-keeper order's recorded lesson —
# each importing rig evaluates its own triage subjects in its own store.
[order]
description = "triage recurrence: file a turn on each ripe triage-subject bead with no open turn (pull-only)"
formula = "mol-triage-recurrence"
trigger = "cooldown"
interval = "24h"
pool = "gc-toolkit.polecat"
scope = "rig"
