description = "A scope=\"rig\" order is never live with no rig bound, and never bound to no rig at all. The discovery-path guard (gc-xaqpf, landed) drops the unbound city-scope copy that used to strand an unclaimable workflow root every fire (tk-gi2pc); this is the regression gate against that returning, plus the live arm for a rig-scoped order that fires nowhere because nothing imports it"
