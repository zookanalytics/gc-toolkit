description = "blocked work carries a dispatch path — a LIVE, unassigned bead that is plainly work (issue_type not in {merge-request, gate, molecule, rig, agent, role, message, decision, epic} and not carrying task_kind=review, gc.step_ref, gc.kind, or gc.demand_for) and is held out of `bd ready` by an open `blocks` edge (it appears in `bd blocked`) must ALSO carry a way to be dispatched once that edge clears: either gc.routed_to / gc.execution_routed_to (a pool already owns it; bd's readiness gates the offer until the blocker closes) or gc.dispatch_when_ready (armed, so the deferred-dispatch reconcile order slings it the moment bd reports it ready). A blocked work bead with NEITHER is the unrouted-and-remember anti-pattern: when its blocker closes it becomes ready and no queue is offered it, so it waits on a person to notice and route it by hand. The remedy the finding names is arming (assets/scripts/deferred-dispatch.sh arm), a safe universal substitute for a hand-held sling. Complement of check-wait-is-an-edge: that one asserts the wait IS an edge rather than prose, this one asserts an edged wait has somewhere to go. Warn-only, because a standing backlog of unarmed blocked work exists; an unreadable store warns and never passes"
