description = "blocked work carries a dispatch path — a LIVE, unassigned bead that is plainly work (issue_type not in {merge-request, gate, molecule, rig, agent, role, message, decision, epic} and not carrying task_kind=review, gc.step_ref, gc.kind, or gc.demand_for) and is not a merge anchor (carries no merge_result) and is held out of `bd ready` by an open `blocks` edge (it appears in `bd blocked`) must ALSO carry a way to be dispatched once that edge clears: gc.routed_to (a pool queue consumes it; bd's readiness gates the offer until the blocker closes) or gc.dispatch_when_ready (armed, so the deferred-dispatch reconcile order slings it the moment bd reports it ready). gc.execution_routed_to is NOT a dispatch path: it is execution provenance for workflow/control-dispatch flows, not a queue a worker or the pool-demand reconciler consumes, so a blocked bead carrying only it is flagged. The workflow-driven state that legitimately rests unrouted and unassigned is the merge anchor: a bead carrying merge_result is driven by the merge cadence (lifecycle/lifecycle.toml — the anchor state is status x merge_result) and offered by no pool queue, so it is exempt on that marker. A blocked work bead with NEITHER route nor arm is the unrouted-and-remember anti-pattern: when its blocker closes it becomes ready and no queue is offered it, so it waits on a person to notice and route it by hand. The remedy the finding names is arming (assets/scripts/deferred-dispatch.sh arm), a safe universal substitute for a hand-held sling. Complement of check-wait-is-an-edge: that one asserts the wait IS an edge rather than prose, this one asserts an edged wait has somewhere to go. Warn-only, because a standing backlog of unarmed blocked work exists; an unreadable store warns and never passes"
