description = "blocked work carries a dispatch path — a LIVE, unassigned bead that is plainly work (issue_type in the work allowlist {bug, feature, task, chore, spike, story} — a positive list, so an infra/topology/container/custom type the check has never heard of is never mistaken for pool work — and not carrying task_kind=review, a standing task_kind (assets/scripts/standing-kinds.sh: a held-by-design record nothing ever dispatches), gc.step_ref or gc.kind) and is not a merge anchor (carries no merge_result) and is held out of `bd ready` by an open `blocks` edge (it appears in `bd blocked`) must ALSO carry a way to be dispatched once that edge clears: gc.routed_to (a pool queue consumes it; bd's readiness gates the offer until the blocker closes) or gc.dispatch_when_ready (armed, so the deferred-dispatch order's pass slings it the moment bd reports it ready). gc.execution_routed_to is NOT a dispatch path: it is execution provenance for workflow/control-dispatch flows, not a queue a worker or the pool-demand reconciler consumes, so a blocked bead carrying only it is flagged. The workflow-driven state that legitimately rests unrouted and unassigned is the merge anchor: a bead carrying merge_result is driven by the merge cadence (lifecycle/lifecycle.toml — the anchor state is status x merge_result) and offered by no pool queue, so it is exempt on that marker. A held bead (one of Gas City's hold labels, hold:mayor or hold:external, read on the `bd blocked` row through assets/scripts/dispatch-path.sh's has_dispatch_hold) is exempt too: intake holds new work for the operator's placement sitting with hold:mayor, and its dispatch is the route it gets once the sitting places it and the hold is lifted, so arming it would start work the operator has not placed. So is a bead a converse sitting holds, through the human gate its hold files under the key conversation.<conversation id>: the sitting's sign-off decides its dispatch once the operator rules, so arming it would send it ahead of the ruling, while every other human gate keeps the rule, because clearing one is the ruling to proceed and an arm is what sends the work then. A blocked work bead with NEITHER route nor arm is the unrouted-and-remember anti-pattern: when its blocker closes it becomes ready and no queue is offered it, so it waits on a person to notice and route it by hand. The remedy the finding names is arming (gctk bead arm), a safe universal substitute for a hand-held sling. Complement of check-wait-is-an-edge: that one asserts the wait IS an edge rather than prose, this one asserts an edged wait has somewhere to go. Warn-only, because a standing backlog of unarmed blocked work exists; an unreadable store warns and never passes"
