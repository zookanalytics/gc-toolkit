description = "Store-scope isolation: a live agent's store environment names its own scope. The running pane process is read as ground truth — GC_RIG must equal the rig in the session's own identity (GC_ALIAS's prefix, else the `<rig>--` session-name prefix) and be absent on a city-scoped one, GC_RIG_ROOT/BEADS_DIR/GC_STORE_ROOT must name no other rig, and GC_STORE_SCOPE must match — because an agent resolving another store writes beads no queue that wants them can see, and nothing else reports it. The session environment is read for the warm-respawn half: `respawn-pane` takes no env argument, so a store key the tmux server holds globally and a city-scoped session neither sets nor marks removed is a warning. GC_BEADS_PREFIX is judged only in that arm, its correct value being a property of the store rather than the session; it never travels alone, since both writers set the five judged keys beside it"
