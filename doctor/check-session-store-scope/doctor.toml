description = "Store-scope isolation: a live agent's store environment names its own scope. The running pane process is read as ground truth — GC_RIG must equal the rig the session's own identity names (its GC_ALIAS's rig prefix, or GC_TEMPLATE's on a session with no alias, such as a member of an unaliased pool; never the session name, which on a pool member opens with its pack binding) and be absent on a city-scoped one, GC_RIG_ROOT/BEADS_DIR/GC_STORE_ROOT must name no other rig, nor the city store on a rig-scoped one, and GC_STORE_SCOPE must match — because an agent resolving another store writes beads no queue that wants them can see, and nothing else reports it. That process is read from /proc, or through `ps -E` on a host with no proc filesystem, such as macOS. A pane whose environment stays hidden, as macOS hides those of its own binaries, is a note on that session, and when no pane can be read at all the check warns once, because the running-process read has then judged nothing. A session carrying neither GC_ALIAS nor GC_TEMPLATE has no scope to judge against and is a warning. The session environment is read for the warm-respawn half: `respawn-pane` takes no env argument, so a store key the tmux server holds globally and a session neither sets nor marks removed is a warning. GC_BEADS_PREFIX is judged only in that arm, its correct value being a property of the store rather than the session; it never travels alone, since both writers set the five judged keys beside it"
