description = "I8: every graph.v2 step bead reaches a terminal state — an open step under a CLOSED molecule root is an error (REOPENED when it already carries gc.outcome, NEVER-CLOSED otherwise; both get re-offered and re-executed against a dead molecule), and an open step under an open root untouched for longer than the stall bound (default 48h) is a warning, the structural stalled-workflow signal"
