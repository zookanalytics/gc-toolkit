description = "I8: every graph.v2 step bead reaches a terminal state — under a CLOSED molecule root an OFFERABLE step (open in its own right, with every blocking dependency closed) is an error, in two shapes (REOPENED when it already carries gc.outcome, NEVER-CLOSED otherwise; both get re-offered and re-executed against a dead molecule), while a step that is parked at status=blocked or still waiting on a live blocker is inert residue and reported as a note; under an OPEN root, an open step untouched for longer than the stall bound (default 48h) is a warning, the structural stalled-workflow signal"
