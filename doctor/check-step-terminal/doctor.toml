description = "I8: every graph.v2 step bead reaches a terminal state — under a CLOSED molecule root an OFFERABLE step (open in its own right, carrying a dispatch path — a gc.routed_to a pool queue consumes or a gc.dispatch_when_ready arm the deferred-dispatch order slings — with every blocking dependency closed) is an error, in two shapes (REOPENED when it already carries gc.outcome, NEVER-CLOSED otherwise; both get re-offered and re-executed against a dead molecule), while a step that is parked at status=blocked, waiting on a live blocker, or carrying no dispatch path (an unrouted, unarmed husk the unassigned+routed pool query never serves) is inert residue and reported as a note; under an OPEN root, an open step untouched for longer than the stall bound (default 48h) is a warning, the structural stalled-workflow signal"
