description = "I8: every graph.v2 step bead reaches a terminal state — under a CLOSED molecule root an OFFERABLE step (open in its own right, carrying a dispatch path — a gc.routed_to a pool queue consumes or a gc.dispatch_when_ready arm the deferred-dispatch order slings — with every blocking dependency closed, and not the control-dispatcher's own workflow-finalize step) is an error, in two shapes (REOPENED when it already carries gc.outcome, NEVER-CLOSED otherwise; both get re-offered and re-executed against a dead molecule), while a step that is parked at status=blocked, waiting on a live blocker, carrying no dispatch path (an unrouted, unarmed husk the unassigned+routed pool query never serves), or the finalize step routed to the dispatcher rather than a pool is inert residue and reported as a note; under an OPEN root, an OFFERABLE step untouched for longer than the stall bound (default 48h) is a warning, the stalled-frontier signal, while a stale step no pool can reach — unrouted, waiting on a live blocker, or the control-dispatcher's finalize step — is inert residue and reported as a note"
