description = "Every rig that can merge has a LIVE, DURABLE refinery idle driver. `merge-skill.sh` fires only from that driver's cadence, so when it dies, APPROVED+CLEAN PRs sit unlanded and NOTHING reports it — the rig is not suspended, the refinery is configured, doctor is green, and the stall is found hours later by a human noticing that approved work is not merging (gc-toolkit PR#345/#346 waited 7h+). It is not a crash: an agent session's systemd scope is KillMode=control-group, so the driver is SIGKILLed with the session that armed it, and `setsid` changes the SESSION not the CGROUP. This check refuses all four confirmed false-greens — session presence, `gc rig status` agent lines, driver.out/reconcile.log mtime (wrong in BOTH directions: the refinery AGENT writes them inline after the driver is gone), and lock-file EXISTENCE (a SIGKILLed driver orphans a 0-byte lock forever) — and asserts instead that the lock is HELD, by that rig's own idle-loop.sh, in the driver's own systemd unit whose WorkingDirectory is a git work tree. A dead driver is the defect on its own; merge-ready PRs escalate it to an error rather than triggering it. Remedy: assets/scripts/refinery-idle-arm.sh (tk-agzpl)"
