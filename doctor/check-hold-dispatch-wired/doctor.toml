description = "A HELD dispatch is parked over its whole molecule, by one writer. Parking a work bead by hand clears the ANCHOR's route and leaves the molecule's seven step beads pool-routed: the drain releases their assignees, `load-context` is the one step nothing blocks, and open + unassigned + routed + ready is the pool's offer predicate — so a fresh full-context polecat is handed the dead chain as new work, forever. Nothing sweeps it either, because `quiesce-completed-workflows.sh` gates on a TERMINAL anchor and a parked-open one is not terminal. The failure is invisible from inside the park: every write succeeds and the bead looks parked. So the writer must ship (`assets/scripts/hold-dispatch.sh`), the polecat must be told to call it (`polecat-close-step-chain`, injected), and neither may acquire the footgun the mechanism exists to avoid — closing a step, which makes the husk permanently unsweepable (tk-oqseh6, specs/tk-8m8d4 guard 2)"
