description = "I13: a workflow root that has started is still advancing or is reachable by something that can advance it. A graph.v2 molecule runs its continuation-group steps inline in one pool session, and those steps carry no owner and no route by construction; a drain landing mid-molecule leaves them open, unowned and unrouted, past both recovery paths — the witness's orphan recovery keys on an assignee, and no route means no pool is offered them — so the molecule advances no further and its workflow-finalize waits forever. I8 is scoped to closed roots and I11 to claimed or routed steps, so neither fires on it. A root is reported STRANDED (error) only when all four hold, each a distinct healthy shape this must not report: SILENT (nothing in the molecule — root or any member, in any status, a close included — written within the bound, default 120m, GC_DOCTOR_ROOT_STALL_MINUTES); UNHELD (no live session behind it — neither the root's gc.session_name nor any member's assignee, gc.session_id or gc.session_name is in the running roster); STARTED (at least one step has closed, so it moved then stopped — a molecule that never closed a step is an inline husk, indistinguishable from most of the rig — AND its work has not landed, its input convoy still open, since a convoy closes when its one work bead closes on land); UNCLAIMABLE (its executable frontier — the members bd ready offers, minus the inert topology kinds workflow/scope/spec poured alongside steps — is non-empty and every frontier member is unassigned AND unrouted, carrying neither gc.routed_to nor gc.execution_routed_to; a routed or owned frontier is reachable, an empty one is a blocker naming the wait, and the execution route a recovery fix stamps to re-offer a strand reads as reachable here). Held on purpose — a non-empty gc.takeaway or hold_reason on the root or a member — is a note, its resting state status=blocked, which bd ready never offers. Fail-safe toward silence: an unread roster declines the run, and an unread store or convoy or closed-step listing leaves that store or candidate unjudged rather than flagging a molecule it could not clear."
