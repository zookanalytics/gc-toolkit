description = "No bead is closed while the work it represents is unlanded (component-model I5) — flags a CLOSED anchor carrying a non-terminal merge_result (absent, pull_request, pre_open_gate) whose PR is still OPEN, which under the close-on-land contract is a FALSE DURABLE RECORD as well as an unreachable one: every merge pass enumerates open beads, so the ledger reads \"landed\" while the PR rots and nothing escalates because nothing can see it. Live-ledger property assertion, not a source grep — check-set-heal.sh phase 0a repairs this shape and this check is the independent observer of whether it actually holds, which is the whole point when the repair's own cadence is what has stopped (tk-vnlll, tk-fip23, tk-39tv12)"
