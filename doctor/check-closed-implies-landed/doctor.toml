description = "I5: no bead is closed while its work is unlanded — a CLOSED ANCHOR carrying merge_result=pull_request or pre_open_gate is an error (it left the merge queue without landing, and merge.sh enumerates open anchors only), so is one carrying pull_request_pending or pull_request_head_changed (the landing order records a PR's end only on a bead that is not closed), and a closed anchor that landed (merged, or the landing order's mr_merged) with no merged_sha recorded is a warning; carrying merge_result is not being an anchor, so a bead whose parent holds the same work and a bead disposed onto a successor (a duplicates or supersedes edge) are both out of scope; ledger-only, no gh calls"
