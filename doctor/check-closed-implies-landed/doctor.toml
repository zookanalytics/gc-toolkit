description = "I5: no bead is closed while its work is unlanded — a CLOSED ANCHOR carrying merge_result=pull_request or pre_open_gate is an error (it left the merge queue without landing, and merge.sh enumerates open anchors only), and a closed merge_result=merged anchor with no merged_sha recorded is a warning; carrying merge_result is not being an anchor, so a bead whose parent holds the same work and a bead disposed via gc.superseded_by are both out of scope; ledger-only, no gh calls"
