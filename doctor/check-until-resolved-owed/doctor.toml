description = "a resolved-by disposition is firing or surfaced. A bead carrying an `until` edge ('X resolves me') is disposed by the deferred-dispatch reconcile order within its cadence once that target closes; this flags an open, unassigned one whose `until` targets have all closed, that no open `blocks` blocker still holds, yet that has stayed undisposed past that window (the order is not firing — see check-cadence-live/I10 — or the close is stuck, commonly an open visit on the bead). Only `until` is read, never `blocks`: a `blocks` target closing leaves the dependent fully owed, so it is never a disposal and never flagged here. Read-only, warn-only: a stalled resolved-by disposition surfaces here instead of the bead re-entering triage as an undifferentiated wait."
