description = "a resolved-by disposition is firing or surfaced. A bead carrying an `until` edge ('X resolves me') is disposed by the deferred-dispatch reconcile order on its next pass once that target closes. This flags an open, unassigned one whose `until` targets have all closed, that no open `blocks` blocker of its own still holds, yet that has stayed undisposed since it became owed (the latest of its `until` targets' closes, its `until` edges' creation and its `blocks` blockers' closes) for longer than that order's cadence window, max(3×interval, one trip of the order dispatch rotation), which is the window check-cadence-live (I10) judges the order by (assets/scripts/order-cadence.sh); such a bead means the order is not firing, its passes spend their budget before they reach the bead, or the close is stuck, commonly an open human gate on the bead. It decides which beads are owed through assets/scripts/until-resolved.sh, as the order does, and re-reads a bead the way the order does before it reports it. Only an `until` edge makes a bead owed, never a `blocks` edge: a `blocks` target closing leaves the dependent fully owed, so it is never a disposal and never flagged here. A bead carrying live work (assets/scripts/live-work.sh, the definition the order reads: a route, a pour, a claim, a branch or PR, a landing state, a kind another component closes, a convoy or an open child on its edges) is never disposed, so once its `until` targets have closed it is reported apart, as a decision for a person rather than as the order not firing. Read-only, warn-only: a stalled resolved-by disposition surfaces here instead of the bead re-entering triage as an undifferentiated wait."
