description = "I7 (disposal): every CLOSED task_kind=review bead whose anchor_bead names an OPEN bead recorded what it concluded — a verdict, or a declination naming why it had none. Cleared by any close-time record: gc.outcome (what signoff.sh and review-sweep.sh both stamp), a notes body, or the pre-rewrite verdict/review_state/review_note/duplicate_of/gc.work_outcome stamps. The dispatcher's own reviewed_oid, check_name, review_branch, review_base, review_pool and fix_target_pool are NOT evidence: they are stamped before any reviewer reads the diff, so a review carrying them has been asked a question, not answered one. Scope is anchor-open because that is where the silence still costs — the gate is owed and the GC_MAX_REVIEW_DISPATCHES ceiling is counting; a review naming no anchor is left alone. Whether a recorded verdict stands behind a green marker is check-gate-marker-provenance's half of I7; ledger-only, no gh calls"
