description = "No rig-workable bead sits unclaimed in the HQ (city / lx) store. A city-scoped role (deacon, mechanik, mayor, dog) runs with GC_RIG unset, so a bare `bd create` lands in the HQ store, which no pool reads — a work bead filed there is marooned by construction: unclaimable, absent from every rig queue, and surfaced by nothing. The check reads $city_path/.beads (city_path from `gc agent list`, GC_CITY_PATH the fallback) and flags each OPEN, UNASSIGNED bead whose issue_type is not infra (session/message/molecule/chore/rig/agent/role/gate/merge-request) and which is unrouted or routed to a pool. The legitimate HQ residents are exempt: a bead routed to `human` or carrying task_kind=visit is an operator-queue decision, a `deacon-ledger` label is a daily digest, and a `debt` label or a `gc doctor:` title is a doctor/tech-debt advisory. Read-only, bounded; an unreadable HQ store warns rather than passing."
