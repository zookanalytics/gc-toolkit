description = "A pull request has exactly one OPEN gating anchor, and an open gating anchor names exactly one pull request (docs/component-model.md I4). Flags a PR claimed by more than one open `merge_result=pull_request` bead, and the dual — one such bead naming several PR numbers — pooled across every rig store and compared within a single repository, using merge-skill.sh's own anchor predicate. The property is otherwise enforced only as a runtime hold inside that script (tk-ynz4b), so it is invisible until someone attempts a merge; since tk-3sdfq the duplicate pair is coalesced and merged rather than held, which makes the merge safe but leaves the ledger state standing forever. Ledger-only and network-free: the ANCHORLESS half of I4 needs a PR's live state to tell a real strand from stale post-merge metadata, and reconcile-merged-prs.sh already walks PR -> BEAD on every refinery pass (tk-qz6081)"
