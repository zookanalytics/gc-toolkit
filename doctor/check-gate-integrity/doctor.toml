description = "I6+I7 (surface): every open gating anchor (merge_result=pre_open_gate|pull_request) declares a non-empty check_set or the explicit \"none\" sentinel, every check.<g> marker matches the declared grammar green|fixable|exception@<40-hex oid>, a green marker on an anchor with no branch metadata is a warning — the evidence binding cannot be checked against a branch that is not recorded — and, where the rig ships docs/review-charter.md, an anchor whose branch diff touches a charter-mandated path declares that gate or carries a triage waiver for it (warn-only: the mechanical backstop for a triage miss)"
