description = "I11: every step a pool is meant to run is being run. Arm 1 (CLAIMED): an in_progress bead carrying gc.step_ref, untouched for longer than the stall bound (default 30m, GC_DOCTOR_CLAIM_STALL_MINUTES), is joined to the session holding it and reported when nothing can be advancing it: UNHELD (no assignee, so neither a holder nor `bd ready` reaches it), ORPHANED (the assignee names no session), DEAD (the holder is not running), or STALLED (the holder runs but its last_active is older than the bound too). Arm 2 (UNCLAIMED): an OPEN step that `bd ready` is offering, carrying a route, with no assignee and no gc.claimed_at ever stamped, untouched past the same bound, is an error only when the agent its route names has a running session holding nothing — a suspended pool, a pool with max 0, a pool scaled to zero, and a pool whose every session is busy are all notes, because a queue behind them is backpressure rather than starvation. Holder-clocked, so it stays quiet for a session that is genuinely working however long the step takes; gate-ensure's pour_spent reads an open step as 'still driven' by design, and check-step-terminal's open-step arm is bead-clocked at 48h"
