description = "I11: every claimed step is being advanced — an in_progress bead carrying gc.step_ref, untouched for longer than the stall bound (default 30m, GC_DOCTOR_CLAIM_STALL_MINUTES), is joined to the session holding it and reported when nothing can be advancing it: UNHELD (no assignee, so neither a holder nor `bd ready` reaches it), ORPHANED (the assignee names no session), DEAD (the holder is not running), or STALLED (the holder runs but its last_active is older than the bound too). Holder-clocked, so it stays quiet for a session that is genuinely working however long the step takes; check-step-terminal and check-routed-work-claimable both scan --status open and see none of this"
