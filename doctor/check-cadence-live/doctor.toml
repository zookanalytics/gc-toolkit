description = "I10: every order this pack ships is alive — each orders/*.toml has a live registration (per importing rig when scope=\"rig\", one unbound registration otherwise) and fired within max(3×interval, 15m), judged from one `gc order history --limit 0` read that names no order and is cut to each order's window, with --limit 0 because a positive limit keeps only the newest runs across every order; condition-triggered orders (no interval) get the registration arm alone"
