description = "I10: every order this pack ships is alive — each orders/*.toml has a live registration (per importing rig when scope=\"rig\", one unbound registration otherwise) and fired within its cadence window, max(3×interval, floor), where the floor is one trip of the order dispatch rotation: ceil(clock-driven registrations / max_dispatches_per_tick) passes at 120s a pass, never below 30m (assets/scripts/order-cadence.sh), because the supervisor fires a short-interval order once per trip; read via `gc order history --limit 0` because any positive limit returns city-store rows only; condition-triggered orders (no interval) get the registration arm alone"
