description = "Every routed, unclaimed bead names a route target that actually exists — flags an open+unassigned bead whose gc.routed_to matches no live agent identity while a rig-qualified form of that same name does, which is the rig-unqualified pool target no pool can ever be offered (tk-5cgyk). Bead-side twin of check-rig-scoped-orders-bound: that one catches the order registration before it fires, this one catches the stranded bead after it exists"
