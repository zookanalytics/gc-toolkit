description = "I3: routed and assigned work is claimable — a routed unassigned bead's gc.routed_to and an assigned bead's assignee must be byte-identical to a live agent identity or a declared sentinel (the offer/poll is exact string equality), a routed unassigned bead must appear in `bd ready` or in `bd blocked` (a bead in neither is offered by no pool and shows its wait in no queue, however valid its address), and no scope=\"rig\" order is registered with no rig bound"
