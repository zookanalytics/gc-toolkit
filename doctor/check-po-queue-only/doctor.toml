description = "I16: the po receives nothing but its queue, the new work Gas City's hold:mayor label holds. An assignment, a mail and `gc sling <po> --on <formula>` reach the seat whatever its config says, and any writer can set a label, so this check names every path that leaves a record within one sweep of its first use. It reports a bead no hold holds that is routed to the po (gc.routed_to) or assigned to one of its addresses, in any unsuspended store, grouping a run's steps under their root; unread mail to the po from any sender (`gc mail inbox <po>`, which wakes nothing), since `human` is also the sender of any caller with no session identity; a bead in the queue that is not new work, carrying anchor_bead or a landing state (merge_result), where a branch alone does not count; and a bead in the queue that something already sends, by an arm (gc.dispatch_when_ready), an assignee or a live run (assets/scripts/run-lib.sh). The po's addresses are every identity Gas City serves its work under: the qualified name `gc agent list` gives the agent named po, the id and runtime session name of each open session `gc session list --template <po>` lists, and the earlier aliases its mailbox names; a city with no po has only its queue judged. The queue is `gc beads list --label hold:mayor --format=json`, read in both shapes it prints. A delivered nudge leaves no record, so it is not seen. Read-only; an unreadable probe warns and never passes"
