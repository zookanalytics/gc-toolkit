description = "cycle-recycle can fire: the Stop hook in overlays/cycle-recycle exits 0 on every uncertainty, so a permanently dead recycle and an idle one are indistinguishable from outside — this asserts the capability instead. Three arms: the city PATH resolves to a NAME in `gc cities` (the hook's first silent exit), the supervisor endpoint the hook reads (`$GC_API_URL/v0/city/<city>/agent/<agent>`) carries a numeric input_tokens for every awake witness | deacon | refinery, and no refinery's git-op defer guard has been continuously true past a bound (default 24h, GC_DOCTOR_RECYCLE_LATCH_HOURS), aged by the oldest currently-dirty tracked path and reported against the file that latched it. Silent when the mechanism is healthy and merely idle; the hook's CWD arm is the refinery's own worktree and is not addressable from here"
