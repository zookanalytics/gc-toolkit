description = "cycle-recycle can fire: the Stop hook in overlays/cycle-recycle exits 0 on every uncertainty, so a permanently dead recycle and an idle one are indistinguishable from outside — this asserts the capability instead. Three arms: a Stop event in the overlay's settings.json invokes the hook without redirecting its stdin (the transcript path it measures from arrives there), the hook's own `--measure` reads the context size a transcript carries, and no refinery's git-op defer guard has been continuously true past a bound (default 24h, GC_DOCTOR_RECYCLE_LATCH_HOURS), aged by the oldest currently-dirty tracked path and reported against the file that latched it. The measurement arm drives the shipped script rather than a copy of its logic. Silent when the mechanism is healthy and merely idle; the hook's CWD arm is the refinery's own worktree and is not addressable from here"
