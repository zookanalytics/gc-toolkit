description = "Routing-config integrity: the bare \"human\" park route (gc.routed_to=human, stamped by lifecycle.sh/escalate.sh/gc-helm.sh/signoff.sh) resolves to a config agent whose QualifiedName is exactly \"human\", so core's session-model check never reports stale-routed-config on operator-owned work — a rig-imported gc-toolkit.human does not match the bare route, so the agent must be a top-level [[agent]] in the town city.toml, with max_active_sessions = 0 so the supervisor spawns no phantom \"human\" pool. Warns when the bare agent is absent, or present but able to spawn; assets/scripts/ensure-human-route-agent.sh writes the stanza"
