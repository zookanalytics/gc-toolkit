description = "I9: the pack each rig executes is the pack that landed. A graph.v2 step's description renders once, at pour, from rigs/<rig>, the checkout the runtime executes, and that checkout advances on the reconciler's 15m cooldown. The findings are LAGGED (a checkout behind its remote past the self-heal window) and UNFETCHED (the remote-tracking ref not refreshed, because the checkout's last fetch failed, which leaves its .git/FETCH_HEAD empty, or because nothing has fetched there past the threshold, so the behind-count misses what landed since the last fetch that worked and is reported as a floor). A run poured before its formula last changed is no finding, because nothing re-renders a poured run and it finishes on the text it poured with"
