description = "I9: the pack each rig executes is the pack that landed. A graph.v2 step's description renders once, at pour, from rigs/<rig>, the checkout the runtime executes, and that checkout advances on the reconciler's 15m cooldown. Two findings: LAGGED (a checkout behind its remote past the self-heal window) and UNFETCHED (the remote-tracking ref itself unrefreshed, the fail-open case where the behind-count reads 0 exactly when the reconciler died, so it is reported as a floor). A run poured before its formula last changed is no finding, because nothing re-renders a poured run and it finishes on the text it poured with"
