description = "The pack the city EXECUTES is the pack that landed, and a running molecule's step text is not older than it (component-model I9). Three findings, separately: LAGGED — a pack-source checkout (rigs/<rig>, what the runtime actually runs) is behind its remote ref by longer than the reconciler's own cooldown, so the lag has stopped self-healing and every agent in that rig is running reviewed-but-superseded code; UNFETCHED — the checkout's remote-tracking ref has not been refreshed inside that window, which matters more than it sounds because it is the FAIL-OPEN case: when the reconciler dies, origin/<default> stops advancing too, so a naive behind-count reads 0 at the exact moment the invariant is most broken; STALE-TEXT — a live molecule root whose gc.formula_source changed after the root poured, which is I9 itself, since a graph.v2 step's description is rendered once at pour and never re-renders. Measured on tk-24aj5w: PR #443 merged 16:06:49Z, the molecule poured 16:06:31Z from pre-#443 text, the checkout advanced at 16:14:32Z — the molecule ran superseded text for its whole life"
