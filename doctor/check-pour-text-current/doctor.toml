description = "I9: a molecule executes the formula text that is current when it runs — a graph.v2 step's description renders once at pour while rigs/<rig>, the checkout the runtime executes, advances on the reconciler's 15m cooldown. Three findings: LAGGED (a checkout behind its remote past the self-heal window), UNFETCHED (the remote-tracking ref itself unrefreshed — the fail-open case where the behind-count reads 0 exactly when the reconciler died, so it is reported as a floor), STALE-TEXT (a live molecule root whose gc.formula_source last changed, per git history, after the root poured). Detection only: nothing re-renders a running molecule's text (tk-5w3boh)"
