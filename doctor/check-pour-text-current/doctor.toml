description = "I9: a molecule executes the formula text that is current when it runs — a graph.v2 step's description renders once at pour while rigs/<rig>, the checkout the runtime executes, advances on the reconciler's 15m cooldown. Three findings: LAGGED (a checkout behind its remote past the self-heal window), UNFETCHED (the remote-tracking ref not refreshed, because the checkout's last fetch failed, which leaves its .git/FETCH_HEAD empty, or because nothing has fetched there past the threshold, so the behind-count misses what landed since the last fetch that worked and is reported as a floor), STALE-TEXT (a live molecule root whose gc.formula_source last changed, per git history, after the root poured). Detection only: nothing re-renders a running molecule's text (tk-5w3boh)"
