description = "The demo:capture toolchain is resolvable — Node, ffmpeg, OPENAI_API_KEY, and gh >= 2.99.0 for inline PR delivery ('gh pr comment --attach') — so a session knows before it captures whether the clip will be narrated or degrade to silent, whether ffmpeg is in place, and whether a produced clip can be delivered inline to its PR. It also reports whether VERCEL_AUTOMATION_BYPASS_SECRET reaches the session; that key is an item only when the secrets file holds it and the session does not, and the warning names the GC_SUPERVISOR_ENV opt-in that carries it. The capture installs its own browser, so the browser is not an item. Warn-only; goes green once every item resolves."
