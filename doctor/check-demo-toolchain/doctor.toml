description = "The demo:capture toolchain is resolvable — Node, a Chromium build, ffmpeg, OPENAI_API_KEY, and gh >= 2.99.0 for inline PR delivery ('gh pr comment --attach') — so a session knows before it captures whether the clip will be narrated or degrade to silent, whether the browser and ffmpeg are in place, and whether a produced clip can be delivered inline to its PR. Warn-only; goes green once all five resolve."
