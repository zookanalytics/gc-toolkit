description = "The refinery merge cadence is provably alive on every rig that imports this pack, and nothing is driving it out of band. `merge-skill.sh` fires only from the refinery-reconcile order, so a rig whose registration stopped ticking has no merge queue and — until this check — nothing said so; the same blind spot let a P1 be filed against gc-toolkit for an outage that was not happening, because the bounded `gc order history` read answers for one store only (tk-fdstg)"
