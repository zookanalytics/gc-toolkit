description = "I2: the anchor state space is closed — every open bead's merge_result is a value the pack writes (the direct landing's merged, the refinery's parks, and the values of Gas Town's pending record), no OPEN bead carries a closed-only value like merged, no bead still carries a healer-bookkeeping key the metadata registry deleted with its writer, and no live bead (any status but closed) carries a key the registry retired with every reader (run.sh's RETIRED_KEYS), whose presence is state nothing acts on any more"
