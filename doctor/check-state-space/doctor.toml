description = "I2: the anchor state space is closed — every open bead's merge_result is a state declared in lifecycle/lifecycle.toml, no OPEN bead carries a closed-only state like merged, an open bead in a declared detached state rests unheld and offered to no pool (no assignee, and gc.routed_to empty — the merge cadence drives those states, so any value is a second driver racing it), a detached-state anchor stays open (the cadence readers enumerate --status=open, so one claimed or held into another live status drops out of the pipeline unseen), no bead still carries a healer-bookkeeping key the metadata registry deleted with its writer, and no live bead (any status but closed) carries a key the registry retired with every reader (run.sh's RETIRED_KEYS), whose presence is state nothing acts on any more"
