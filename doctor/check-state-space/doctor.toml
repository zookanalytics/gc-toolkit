description = "I2: the anchor state space is closed — every open bead's merge_result is a state declared in lifecycle/lifecycle.toml, no OPEN bead carries a closed-only state like merged, an open bead in a declared detached state rests unheld and offered to no pool (no assignee, and gc.routed_to empty or the declared park_route sentinel that no pool claims — the merge cadence drives those states, so any other value is a second driver racing it), and no bead still carries a healer-bookkeeping key the metadata registry deleted with its writer"
