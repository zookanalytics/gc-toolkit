description = "I14: a closed epic that was stewarded was ruled closed — a closed issue_type=epic carrying a hypothesis carries epic_ruling=close (the one terminal ruling of continue/shift/close) with its outcome (epic_ruling_reason), or an explicit disposition pointer (gc.superseded_by); never a silent last-unit auto-close, a close on a ruling that keeps it open, or a close with no outcome (docs/epics.md). A closed epic with no recorded hypothesis predates stewardship and is exempt, so the check ships clean on a pre-stewardship store"
