description = "I15: a closed epic was ruled closed — a closed issue_type=epic other than a Delivery carries epic_ruling=close (the one terminal ruling of continue/shift/close) with its outcome (epic_ruling_reason), or an explicit disposition (a duplicates or supersedes edge onto its successor); never a silent last-unit auto-close, a close on a ruling that keeps it open, or a close with no outcome (docs/epics.md). A Delivery, an epic whose parent is an epic and that carries no hypothesis, is exempt, because its epic carries the ruling, and an incomplete Epic, one with no hypothesis and no epic parent, is held to the ruling like any other epic"
