description = "I14: a closed epic that was stewarded was ruled — a closed issue_type=epic carrying a hypothesis has a non-empty epic_ruling (persevere/pivot/close) or an explicit disposition pointer (gc.superseded_by), never a silent last-unit auto-close (docs/epics.md). A closed epic with no recorded hypothesis predates stewardship and is exempt, so the check ships clean on a pre-stewardship store"
