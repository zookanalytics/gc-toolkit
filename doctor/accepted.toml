# The doctor checks whose failures the operator accepted. The doctor order's
# `gctk doctor run` reads this file, and a failing check that an entry here
# names is recorded under accepted, with its entry, rather than under failing.
# A change to the file is a PR the operator reviews, and the approval is the
# ruling.
#
# Each entry is an [[accepted]] table with four keys:
#   check   the name gc doctor gives the result, whole, such as
#           rig:<rig>:<check> for one rig's instance of a per-rig check
#   reason  why the failure is accepted
#   ruling  the ruling that accepted it
#   for     for a check accepted only for a while, how long it may fail from
#           the time it first failed, as a Go duration; absent, it has no bound
# Each value is a basic string on one line, and `gctk doctor run` refuses a file
# with any other line (services/gctk/doctor/accepted.go). Gas City's pack doctor
# discovery reads only the directories under doctor/, so this file is no check.

[[accepted]]
check = "hold-label-routed-to"
reason = "It warns on every bead that carries a hold:<value> label and no gc.routed_to naming that value, and the pack holds work for placement with hold:mayor and no route. Gas City's issue 6069 (gastownhall/gascity) reports the check as a bug, because a hold label is no route."
ruling = "The operator's approval of the design for the patrols' move onto orders, PR #1537."

[[accepted]]
check = "dolt-compact-state"
for = "3h"
reason = "It warns on every pending-GC marker, the one the compactor writes on purpose when a writer races its flatten included, and the compactor clears that marker at its next pass, every two hours. Three hours lets that pass run."
ruling = "The operator's approval of the design for the patrols' move onto orders, PR #1537."
