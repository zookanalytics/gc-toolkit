description = "Every `gc.routed_to=human` bead states the judgment it is asking for, in `blocked_reason`. The marker means ONLY a human can perform the next action, and it is the one route value nothing can correct: a typo'd pool name is loud (check-routed-work-claimable says so), while `human` is silently unclaimable forever and looks deliberate the whole time. So it gets used as \"nobody claimed it\" — on the 2026-08-23 board, four of nine ELEVATED human rows were ordinary agent work, and three of the nine carried the marker and nothing else. Every pack writer of the marker already sets blocked_reason in the same update, so this checks the pair the machinery keeps and hand-written routes drop. Warns; `blocked` beads are invisible to the helm board, so for those this line is the only place it is ever said (tk-wfufb9)"
