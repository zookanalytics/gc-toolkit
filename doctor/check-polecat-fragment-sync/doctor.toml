description = "Every native agent that shares gastown's polecat prompt by reference injects the SAME gc-toolkit fragment set as the pack.toml polecat patch, modulo the pool-scoped exceptions declared in the check. The two lists are hand-synced with no automatic propagation, so a fragment added to one and forgotten in the other leaves that pool running the unpatched base doctrine — silently, because the pool primes fine and does the wrong thing (tk-t41dq). A declared exception (polecat-non-impl-done on polecat-codex, tk-0981e) is an expectation, not a mute button: the fragment is required on its own pool and reported as extra on any other"
