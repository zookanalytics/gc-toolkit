description = "The `merge_result` state space is declared in one place and both halves of the code are held to it: every literal pack code writes is a declared state, and every pass that discriminates among two or more of them names a declared kind-set (all handoff, all disposition, or the whole space) or declares its own default in a `merge-result-reader:` comment. Seven literals were written across five files while two readers each kept their own hand-rolled list, and the lists disagreed on what an unrecognised value meant — one read it as *not yet anchored*, the other as *terminal, leave it alone* — with neither containing `blocked` or `refused_false_completion`. A hand-rolled list is correct on the day it is written and silently wrong on the day the eighth state lands (component-model.md I2, tk-jozah0)"
