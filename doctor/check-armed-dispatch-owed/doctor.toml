description = "an owed deferred dispatch is firing or surfaced. A bead armed for deferred dispatch (gc.dispatch_when_ready) whose own `blocks` edges have all closed is slung by the deferred-dispatch reconcile order within its cadence; this flags one that has stayed armed past that window (the order is not firing — see check-cadence-live/I10 — or a dispatch is silently stuck) and one armed at a non-open status that `bd list --ready` can never answer. The is_blocked flag cascades DOWN parent-child edges, so such an arm need not appear in `bd blocked` under its own id and check-blocked-work-armed (which flags UNarmed blocked work) does not cover it. Read-only, warn-only: a stalled arm surfaces here instead of waiting days for a human to notice."
