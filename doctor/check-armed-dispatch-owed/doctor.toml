description = "an owed deferred dispatch is firing or surfaced. A bead armed for deferred dispatch (gc.dispatch_when_ready) whose own `blocks` edges have all closed is slung by the deferred-dispatch reconcile order on its next pass. This flags one that has stayed armed past that order's cadence window, max(3×interval, one trip of the order dispatch rotation), which is the window check-cadence-live (I10) judges the order by (assets/scripts/order-cadence.sh); such an arm means the order is not firing or a dispatch is silently stuck. It also flags one armed at a non-open status that `bd list --ready` can never answer. The is_blocked flag cascades DOWN parent-child edges, so such an arm need not appear in `bd blocked` under its own id and check-blocked-work-armed (which flags UNarmed blocked work) does not cover it. Read-only, warn-only: a stalled arm surfaces here instead of waiting days for a human to notice."
