description = "an owed deferred dispatch is firing or surfaced. A bead armed for deferred dispatch (gc.dispatch_when_ready) that nothing holds is slung by the deferred-dispatch reconcile order on its next pass. A hold is an open `blocks` blocker on the bead or on a parent-child ancestor, a demand gate on an ancestor aside (assets/scripts/hold-lib.sh, the predicate reconcile slings on), so an arm a park holds is not owed. This flags an arm nothing holds that has stayed armed past that order's cadence window, max(3×interval, one trip of the order dispatch rotation), which is the window check-cadence-live (I10) judges the order by (assets/scripts/order-cadence.sh); such an arm means the order is not firing or a dispatch is silently stuck. It also flags one armed at a non-open status that `bd list --ready` can never answer. check-blocked-work-armed asks blocked work only for a dispatch path, and an arm is one, so it does not cover these. Read-only, warn-only: a stalled arm surfaces here instead of waiting days for a human to notice."
