description = "an owed deferred dispatch is firing or surfaced. A bead armed for deferred dispatch (gctk bead arm) that nothing holds is started by the deferred-dispatch order's pass, gctk bead start-armed, on its next pass. The check reads each store's arms from that start's dry run, which says, for every armed bead, what holds it and what the next pass would do with its arm, so the check holds no rule of its own about what holds an arm. It flags an arm the next pass would start, or one nothing holds whose formula the start cannot resolve, that has stayed armed past that order's cadence window, max(3×interval, one trip of the order dispatch rotation), which is the window check-cadence-live (I10) judges the order by (assets/scripts/order-cadence.sh); such an arm means the order is not firing or a dispatch is silently stuck. It also flags one armed at a non-open status, or one whose record does not decode, which the start never sends. An arm a wait, a hold label, an assignee or bd's readiness holds is not owed, and one whose attempts reached the cap is not flagged, since the start asks a person about it. check-blocked-work-armed asks blocked work only for a dispatch path, and an arm is one, so it does not cover these. Read-only, warn-only: a stalled arm surfaces here instead of waiting days for a human to notice."
