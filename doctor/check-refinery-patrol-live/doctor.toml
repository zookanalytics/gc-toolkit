description = "I14: a refinery whose queue holds work is cycling its patrol — the agent half of the refinery, where check-cadence-live asserts the refinery-reconcile order. Each mol-refinery-patrol iteration takes one bead from the find-work queue and pours its successor wisp before burning itself, so a refinery working a queue renews its wisp once per bead, while an empty queue ends the turn and leaves the wisp resting. Per refinery `gc status --json` lists (qualified name ending in .refinery), read from its rig's store, STALLED (error) only when both hold: its find-work queue (open, assigned to it, carrying metadata.branch, not an epic, no merge_result) has held a bead past the bound (default 60m, GC_DOCTOR_REFINERY_PATROL_STALL_MINUTES; aged by updated_at, which any later write resets, so the age is never longer than the real wait), AND no mol-refinery-patrol wisp assigned to it was written within that bound, or none exists. An old wisp beside an empty queue is idle, and a queue younger than the bound is a note. A suspended refinery or rig is a note; an unread roster, queue or wisp listing warns"
