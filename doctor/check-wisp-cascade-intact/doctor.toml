description = "Every bead store enforces the wisp auxiliary cascade in its own schema: wisp_labels, wisp_events and wisp_comments carry a foreign key on issue_id, and wisp_child_counters one on parent_id, each REFERENCES wisps(id) ON DELETE CASCADE. The constraint is load-bearing in both directions. It is the only thing that removes a deleted wisp's auxiliary rows on the bulk delete path, which issues DELETE FROM wisps and the sync-plane dependency delete and nothing else, and it is the only thing that refuses a write naming a wisp that does not exist — without it such a row is accepted and is an orphan from the moment it lands. The schema is asserted rather than the row counts, because a store can be arbitrarily far behind on cleanup and still be correct going forward, while a store missing the constraint is silently accumulating. Reported per store at the severity named in run.sh; a store carrying no wisp plane at all is a note. Read-only, INFORMATION_SCHEMA only, one bounded query per store"
