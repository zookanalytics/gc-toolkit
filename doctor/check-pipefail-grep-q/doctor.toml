description = "No shell file that sets `pipefail` feeds a pipeline into `grep -q`. `grep -q` exits at its FIRST match and closes the pipe under a writer that is still writing; the writer takes SIGPIPE, `pipefail` promotes that 141 to the pipeline's status, and a SUCCESSFUL match is read as a failure — a passing assertion reported red, or a shipped script taking the wrong branch. It is a race on how much the writer flushed before grep quit, so it is invisible at small payloads and arrives as they grow (tk-zfjg9)"
