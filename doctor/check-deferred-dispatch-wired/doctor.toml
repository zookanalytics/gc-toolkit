description = "The deferred-dispatch pipeline stays wired end to end, INPUT INCLUDED. `deferred-dispatch.sh arm` is what moved sequencing out of an agent's context and into the ledger (tk-y0ygs), but the arm is inert on its own — orders/deferred-dispatch.toml is what performs the sling once bd reports the bead ready, and orders/dispatch-feeder.toml is what converts ready work into an arm in the first place. Every way these three come apart is silent. Ship the arm without the cadence and `arm` still succeeds and still writes a perfectly well-formed record that nothing will ever act on. Ship both without a feeder and nothing ever arms anything: that was the measured state on 2026-08-24, with 252 ready work beads unrouted, 51 of them over 30 days old and the oldest 123 days, while `list` correctly reported an empty owed-queue and every component reported healthy (tk-ku1uvv). A queue nobody feeds is indistinguishable from a queue with nothing owed, which is the same invisible, unrecoverable hold this machinery exists to remove — so the wiring is checked rather than assumed, including that the feeder calls `arm` rather than slinging for itself, that it takes the oldest work first, and that its per-rig cap and enable flag are still enforced in code"
