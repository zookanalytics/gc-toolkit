description = "A pending dispatch that was armed onto a bead is actually consumed. `deferred-dispatch.sh arm` is what moved sequencing out of an agent's context and into the ledger (tk-y0ygs), but the arm is inert on its own — orders/deferred-dispatch.toml is what performs the sling once bd reports the bead ready. Ship one without the other, or let the order's exec path drift off the script, and `arm` still succeeds and still writes a perfectly well-formed record that nothing will ever act on: the same invisible, unrecoverable hold this machinery exists to remove, stranded one layer down instead of in a session that died"
