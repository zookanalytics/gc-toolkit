description = "A polecat's claim delivers its work bead's description: the PostToolUse command the polecat agent's overlay registers for the Bash tool, run the way Claude runs it on a simulated claim of a formula step (stub gc, scratch copy of the overlay), prints the work bead's description as additionalContext. The check runs the hook rather than reading its source, so an error means the simulated claim got no description back, or the wrong bead's; the hook's other branches stay with assets/scripts/work-context-hook.test.sh, whose absence is a warning"
