description = "No formula shell block iterates an unquoted expansion. Formula blocks are authored as POSIX sh but run in whatever shell the pasting agent has; on this city that is zsh, which performs NO word splitting on an unquoted `$VAR` or `$(cmd)`. `for C in $IDS` then runs its body ONCE with every id joined into a single token — the per-element command fails on the nonsense token and the step records an honest-looking failure having silently skipped every real element. The direction is usually fail-safe for the step's output, so the pass reads clean while doing none of the work (tk-1c9vf)"
