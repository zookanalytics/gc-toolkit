description = "operator PR feedback is routed, not just recorded. The merge cadence stamps a PR's review posture on the anchor (`pr_posture`) in a cheap pre-merge arm and routes the feedback under it (`pr_comment_disposition`) in a separate arm; when the second never runs, the anchor reads as handled while the operator's review sits unrouted, which nothing else surfaces. This flags an OPEN anchor whose `pr_posture` is `commented`/`changes_requested` with no `pr_comment_disposition` past the owed window (GC_FEEDBACK_ROUTING_OWED_SECONDS, default 1800s), measured from the posture's own `@<since>` instant. Exempt: a `pr_unengaged_threads` marker at the same head (the unengaged-thread arm files a visit, not a disposition), and a posture still carrying no `@<since>` (re-dated next pass). Read-only, warn-only: an unrouted review surfaces here instead of waiting for a human to notice their comment went unanswered."
