description = "A landed plan's target list is a filing checklist: every row of a table marked `<!-- plan-targets -->` binds, in its `Bead` column, to a bead, a deliberate `none`, or a named landed outcome. An unbound row is an error (the silent drop this check exists to catch), and so is a marked table carrying no `Bead` column and a bead ID that resolves in no reachable store. A marker with no table warns, an unreadable ledger warns rather than passing, and the summary always reports how many documents, rows and bead references were actually examined so a vacuous pass reads as one."
