description = "No graph.v2 step bead is left OPEN under a molecule whose root already closed. A finalized molecule has no consumer for another step pass — its terminal step has run and every downstream reader is closed — but an open step is still offer-able (the offer resolves through the ROOT's route even when the step's own gc.routed_to is blank), so the pool hands it to a fresh polecat that re-runs the whole step against a dead molecule. Reports the two shapes separately: REOPENED (the step carries gc.outcome, so it completed and was reset afterwards — the tk-ciuad loop, which is self-perpetuating and burns one pool slot per cycle) and NEVER-CLOSED (no gc.outcome, the molecule finalized around a step that never ran). The durable gate belongs in the gc binary; this is the pack-side backstop that keeps both loud, and the regression gate once it lands"
