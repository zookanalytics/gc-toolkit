description = "The cycle-recycle Stop hook and its no-consent doctrine are wired to the same roles: the set of agents carrying overlay_dir=overlays/cycle-recycle (the hook recycles them at a turn boundary) equals the set whose resolved prompt injects the heartbeat-no-consent-ui fragment (which forbids a heartbeat agent a blocking consent UI). A role with the overlay but not the fragment recycles with nothing telling it not to prompt; a role with the fragment but not the overlay never recycles, so the doctrine guards a boundary it does not have. check-config-bound asserts each half RESOLVES and check-recycle-capable asserts the hook can fire; neither asserts the two name the same roles. Static: reads pack.toml and the agent prompt templates, no gc and no network"
