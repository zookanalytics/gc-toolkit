description = "Every wait is a graph edge, not a sentence (component-model I1). Flags an OPEN bead whose prose says it is waiting on, blocked by, awaiting, gated on or depending on a named bead, where no dependency edge exists between the two in either direction. A sentence freezes at the moment it is written and is never true again, so two subjects — one genuinely blocked, one entirely finished — produce mechanically identical rows and every re-derived surface reads both as wanting nothing, forever (docs/lifecycle-composition.md §1). The stronger case is reported separately: a prose wait whose named bead has already CLOSED is that defect in its terminal form — the thing being waited for is done and nothing can notice. Scoped to WAIT LANGUAGE rather than to bead mentions, because a mention is usually provenance or a conclusion and a conclusion is prose by design: measured 2026-08-24 on gc-toolkit, 115 of 909 open beads name another bead somewhere in their notes while 5 express a wait. Candidate ids are resolved against the store before being judged, so a rig or agent name that merely shares the id shape (gc-toolkit, gc-toolkit.furiosa) can never be reported as a missing edge; one that resolves nowhere AND matches the rig roster is dropped outright rather than left as an unresolved note, so those names do not read as gc- prefixed bead ids in the output either. Asserts that the EDGE exists, never that the prose is removed"
