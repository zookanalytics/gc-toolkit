description = "I1: every wait an open bead states about ITSELF is also a graph edge — a metadata key that declares a dependency (blocked_on, waiting_on, gated_on and their suffixed forms), or a status value saying the bead is waiting on a named bead (gc.takeaway, *_reason), must be matched by a blocks edge in either direction. Only type=blocks counts, because it is the one edge type that holds a bead out of bd ready; a tracks, parent-child or related record leaves the wait as unanswerable as the bare string. A wait held only as a string answers no query, so bd ready cannot see it and the bead deadlocks in silence or runs ahead of its blocker. Two degrees: UNEDGED where the named bead is open, FROZEN where it has already closed and the wait can never resolve. Free-form notes are deliberately not scanned — in this city they record OTHER beads' waits in the same words. Asserts the edge exists, never that the string is removed"
