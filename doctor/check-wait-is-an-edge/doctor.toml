description = "I1: a hold is a graph edge, not a marker — a LIVE (non-closed) bead carrying one of the hold markers declared in lifecycle/lifecycle.toml [holds] (triage.hold, blocked_reason, gc.takeaway, gc.routed_to on the park route) must also carry a pending wait of its own, as `gctk bead holds` answers it: an edge of the store's blocked rule (`blocks`, `conditional-blocks` or `waits-for`) onto a bead in the SAME store that is neither closed nor pinned. Only a wait edge counts, because a `tracks` or `parent-child` record holds nothing; only the same store counts, because a cross-store `bd dep add` reports success and holds nothing. Three degrees: UNEDGED where the bead carries no wait edge at all, STALE where every wait it names has landed, is pinned or lives in another store, and FOREIGN where any live bead, marked or not, carries a wait edge into another store. A `waits-for` edge, which the store cannot judge yet, is noted as unjudged. The markers are read from the declaration and never parsed out of prose: a conclusion is prose by design, and no verb list finishes, so every gap in one reads as clean. Reported at the severity lifecycle.toml declares in hold_severity — a warning while the standing backlog of marker-only holds is converted, an error once it is. Asserts the edge exists, never that the marker is removed"
