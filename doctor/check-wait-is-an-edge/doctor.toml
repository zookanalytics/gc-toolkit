description = "I1: a hold is a graph edge, not a marker — a LIVE (non-closed) bead carrying one of the hold markers declared in lifecycle/lifecycle.toml [holds] (triage.hold, blocked_reason, gc.takeaway, gc.routed_to on the park route, check.<g> at the exception verb, dispatch_backstop.<g>, answered_hold.<g>) must also carry a `blocks` edge naming a bead still live in the SAME store. Only `blocks` counts, because it is the one edge type that holds a bead out of `bd ready`; only the same store counts, because a cross-store `bd dep add` reports success and holds nothing. Two degrees: UNEDGED where the bead carries no `blocks` edge at all, STALE where every blocker it names has closed or is unreadable here. The markers are read from the declaration and never parsed out of prose: a conclusion is prose by design, and no verb list finishes, so every gap in one reads as clean. Reported at the severity lifecycle.toml declares in hold_severity — a warning while the standing backlog of marker-only holds is converted, an error once it is. Asserts the edge exists, never that the marker is removed"
