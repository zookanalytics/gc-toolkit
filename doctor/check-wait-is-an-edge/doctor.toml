description = "I1: every wait a LIVE (non-closed) bead states about ITSELF is also a graph edge — a metadata key that declares a dependency (blocked_on, waiting_on, gated_on and their suffixed forms), or a status value saying the bead is waiting on a named bead (gc.takeaway, *_reason), must be matched by a blocks edge in either direction. Only type=blocks counts, because it is the one edge type that holds a bead out of bd ready; a tracks, parent-child or related record leaves the wait as unanswerable as the bare string. A wait held only as a string answers no query, so bd ready cannot see it and the bead deadlocks in silence or runs ahead of its blocker. The scan covers every non-closed status, because claiming or parking a bead does not answer the wait it states. Two degrees: UNEDGED where the named bead is still live, FROZEN where it has already closed and the wait can never resolve. Free-form notes are deliberately not scanned — in this city they record OTHER beads' waits in the same words. Asserts the edge exists, never that the string is removed. A second arm asks the same question of the state a bead carries beside its edges: every metadata key on a live bead must be one lifecycle/lifecycle.toml registers, because an unregistered key is state nothing was written to read. Keys inside the declared runtime namespace are out of scope rather than registered, being another repo's to declare, except where one is a registered key with that prefix added or removed, which is pack state one prefix from its reader and is always an error. Runtime-owned bead types are skipped whole. Two route findings ride along: a bead parked on the declared park route with no gc.takeaway records no question for the person holding it, and a rig-unqualified route names nobody, read here only on the live statuses doctor/check-routed-work-claimable does not scan. The registry grades the two draining backlogs, unregistered keys and questionless parks, as warn or error; an absent or empty registry reports that the arm could not run rather than falling back to a built-in vocabulary"
