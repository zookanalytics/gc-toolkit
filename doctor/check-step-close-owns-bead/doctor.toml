description = "No step closes a bead on an id read from the environment. `gc hook --claim` does NOT refresh `$GC_TRIGGER_BEAD_ID`, so after a claim it still names the session's spawn bead — a formula closing on it writes, successfully and with exit status 0, against another live session's in-progress step, stranding that molecule while its own step stays open and is re-offered forever. The predecessor spelling `$GC_BEAD_ID` is unset in the step environment entirely and closes nothing at all. Both are invisible on reading: the idiom is guarded, names a plausible variable, and works whenever the session is still on its spawn bead — which is every case tested by hand (tk-niu2f, tk-7w69a)"
