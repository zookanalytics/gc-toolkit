description = "No agent silently renders the 16-line generic stub: every agent in the RESOLVED city config whose prompt_template is set must name a readable file, because gc prime falls back to the default prompt (exit 0, nothing on stderr) whenever a declared template cannot be read. Checks resolution, not spelling — the cross-pack <pack>//<subpath> form is safe (an unknown or ambiguous pack is a hard config-load error), but resolution does not verify the subpath exists inside the pack, which is the one route to the stub"
