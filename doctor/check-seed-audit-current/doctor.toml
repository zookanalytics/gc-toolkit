description = "docs/seed-audit/ still matches the fragments it renders: the committed audit of every agent prompt and formula recipe carries the source digest of its inputs, and this check recomputes that digest from the pack tree. A mismatch means a prompt moved without the artifact moving with it, so the committed audit is describing a seed no agent receives any more. Cheap by construction — it hashes files rather than re-rendering; `assets/scripts/render-seed-audit.sh --check` is the authoritative full re-render. A gc-binary-only mismatch is a warning, not an error, because prompt composition lives in the binary and an upgrade moves the artifact with no commit in this repo"
