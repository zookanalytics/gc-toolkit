description = "I7 (depth): every green gate marker on an open gating anchor (merge_result=pre_open_gate|pull_request) names a commit a recorded verdict covers — resolved first against a task_kind=review bead carrying anchor_bead + reviewed_oid, then, for that residue only, against an APPROVED GitHub review on the anchor's pr_number whose own commit oid equals the marker's; a marker both resolvers clear nothing for is an error, and a marker whose GitHub fallback could not run is an undetermined warning. Marker grammar and the check_set declaration are check-gate-integrity's surface half and are not restated here"
