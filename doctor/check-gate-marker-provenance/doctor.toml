description = "I7 (depth): every green lane on an open gating anchor (merge_result=pre_open_gate|pull_request) names a recorded verdict — resolved first against a task_kind=review bead carrying anchor_bead + reviewed_oid and a check_name naming that lane, then, for that residue only, against an APPROVED GitHub review on the anchor's pr_number; a lane both resolvers clear nothing for is an error, and one whose GitHub fallback could not run is an undetermined warning. Marker grammar and the check_set declaration are check-gate-integrity's surface half and are not restated here"
