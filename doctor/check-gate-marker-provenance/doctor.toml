description = "I7 (depth): a lane a merge path trusts as green stands on a verdict its writers produced. For every OPEN gating anchor (merge_result=pre_open_gate|pull_request), every CLOSED task_kind=review bead backing a lane — signoff_verdict=approve carrying a non-empty reviewed_oid, the local backing lane-state.sh derives green from — must record gc.outcome=recorded (a live backing) or superseded (retired); an approve carrying any other outcome still derives the lane green yet stands on a verdict no writer recorded, and is the finding. It reads no commit oid. A closed review with no signoff_verdict backs no lane, because signoff.sh stamps gc.outcome=recorded on every close and recorded names no verdict. An operator's GitHub approval backs a lane with no bead to audit. The check_set declaration is check-gate-integrity's half and is not restated here"
