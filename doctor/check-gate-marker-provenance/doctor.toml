description = "I7 (depth): every green lane on an open gating anchor (merge_result=pre_open_gate|pull_request) names a recorded verdict — resolved first against a CLOSED task_kind=review bead carrying anchor_bead + reviewed_oid, a check_name naming that lane, and either signoff_verdict=approve or (legacy, pre-dating that stamp) gc.outcome=recorded with no signoff_verdict at all, then, for that residue only, against an APPROVED GitHub review on the anchor's pr_number; an open review bead or one closed on request-changes never backs the lane. A lane both resolvers clear nothing for is an error, and one whose GitHub fallback could not run is an undetermined warning. Marker grammar and the check_set declaration are check-gate-integrity's surface half and are not restated here"
