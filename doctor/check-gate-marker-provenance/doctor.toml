description = "I7 (depth): a lane a merge path trusts as green stands on a verdict its writers produced, audited in two arms. Outcome arm (markerless, permanent): for every OPEN gating anchor (merge_result=pre_open_gate|pull_request), every CLOSED task_kind=review bead backing a lane — signoff_verdict=approve carrying a non-empty reviewed_oid, the local backing lane-state.sh derives green from — must record gc.outcome=recorded (a live backing) or superseded (retired); an approve carrying any other outcome still derives the lane green yet stands on a verdict no writer recorded, and is the finding. Marker arm (transition, kept while gate-ensure.sh still reads check.<lane> and skips dispatch on green): every check.<lane>=green on such an anchor must resolve to a backing — a CLOSED approve, or legacy gc.outcome=recorded with no signoff_verdict, review bead naming the anchor and lane with a reviewed_oid, else an APPROVED GitHub review on the anchor's pr_number — since a green marker no backing covers wedges the anchor (gate-ensure raises no review while lane-state holds the merge); nothing found is an error, and a local miss whose GitHub fallback could not run is an undetermined warning. It reads no commit oid; a legacy no-verdict recorded bead and an operator's GitHub approval both pass. The marker arm is removed once the last marker consumer reads lane-state.sh. Marker grammar and the check_set declaration are check-gate-integrity's surface half and are not restated here"
