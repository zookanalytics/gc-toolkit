description = "Every agent in the pack carries an explicit operator-facing verdict, and every agent judged operator-facing actually receives the operator-next-step-trailing fragment through one of the four wiring surfaces (pack patch, agent.toml fragment list, an inline template call, or a prompt it inherits). The rule that the operator's own review queue is not reportable was distributed to the roles someone thought of rather than to the roles a human reads, which left the refinery — the largest producer of that traffic — running without it for the whole life of the rule (tk-l1pj6). An unclassified agent is an ERROR, not a pass: a new agent that nobody classifies is exactly how the refinery was missed"
