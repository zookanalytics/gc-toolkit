description = "The P3 liveness machinery stays wired: the liveness-sweep and triage-recurrence orders exist with the bare-pool/rig-scope shape, the sweep's mechanical precheck is shipped executable and gated with room under its check_timeout (a failing or killed condition check reads as NOT DUE, so a broken precheck silently retires the sweep), their formulas ship with fail-safe aborts and marked gate-visit copies, and the sweep's claim-time re-check is shipped executable, stamped onto the visit and hooked into the converse loop — so unnamed-wait normalization, triage recurrence, and the guarantee that a sitting reads a CURRENT census can't be silently un-shipped (specs/2026-08-fresh-start/liveness-and-triage-spec.md)"
