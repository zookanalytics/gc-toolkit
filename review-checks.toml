# The check index: the checks review can apply. Mechanical facts only — each
# check's name, one line of purpose, and the phase it gates. When a check applies
# to a given diff is a judgment its method states in prose, which triage reads;
# it is not a field here. A check's method is the pack skill named from the
# check, skills/review-<check>/SKILL.md.
#
# A check's `phase` is the stage transition by which it must read green, fixed
# by what the check consumes. The four phases are ordered
# `pre-open < open-as-draft < ready-for-review < merge`: a check that reads only
# the diff is `pre-open`; one that needs the deployed preview is `open-as-draft`.
#
# This file is the pack's index, and every rig gets every check it declares.
# A rig may keep a review-checks.toml of its own, which is laid over this one: a
# row for a check declared here changes its purpose or phase for that rig, key by
# key, and a row for any other check adds a check of the rig's own. Every reader
# takes the rig's rows at the commit it judges (git show <oid>:review-checks.toml),
# so a branch is judged against the index it carries. In gc-toolkit both layers
# read this path: the pack's layer is the installed copy, and the rig's layer is
# the copy at the commit being judged. assets/scripts/review-checks.sh is the one
# parser and the one resolver of that grammar and of the layering.
#
# Which lanes an anchor starts with is configuration, not this file: the default
# check_set is mol-refinery-patrol's check_set var, refinery-reconcile.sh's
# REFINERY_RECONCILE_CHECK_SET, gate-ensure.sh's --default and
# lifecycle/lifecycle.toml's check_set_default. Triage may widen an anchor's
# check_set by any check the effective index declares and may not invent one.
# `approval` is not a check here: it is a universal merge rule (merge.sh)
# requiring a standing non-city APPROVED review.
#
# The other review file a rig may keep is a check's guidance,
# docs/review-<check>.md, which holds that one check's guidance and nothing
# else. The review formula prints it from the commit under review, so it adds
# to the check's method and never replaces it; absent is the common case. A rig
# keeps one to add guidance of its own, or to say where it keeps a reference
# doc the method reads when that doc is not where the method looks.
#
# Adding a check. Declare it here as a [checks.<name>] row, and ship its method
# as skills/review-<name>/SKILL.md, the skill that carries its whole generic
# method, the boundary lines that keep it in its lane included (what belongs to
# `correctness`, what to `demo`). The review formulas load the skill named from
# the check, so nothing else lists it. A specialist check's skill loads the
# shared specialist stance, skills/specialist-stance, rather than restating it:
# enforce through findings, never edit, leave another check's concern to that
# check. The skill stays rig-agnostic: what one rig needs goes in that rig's
# docs/review-<name>.md.

[checks.correctness]
purpose = "Is the change correct and safe as merged?"
phase = "pre-open"

[checks.triage]
purpose = "Which specialist checks does this diff warrant?"
phase = "pre-open"

[checks.demo]
purpose = "Does this change need a visual to be understood, and is the right one delivered?"
phase = "open-as-draft"

[checks.arch]
purpose = "Does the change fit the architecture, and is any architecture change justified and documented in the same PR?"
phase = "pre-open"

[checks.pm]
purpose = "Does the change solve the right user problem, and present it so the operator can judge?"
phase = "pre-open"
