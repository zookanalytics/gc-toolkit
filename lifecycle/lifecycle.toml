# lifecycle.toml — the declared state space of the anchor lifecycle.
# The anchor state is `status` x `merge_result`. This file is the single source
# of truth: assets/scripts/lifecycle.sh embeds the same table as shell constants
# (marked block `lifecycle-state-table`) and lifecycle.test.sh fails on drift.
# Every metadata key the pack writes is enumerated in [metadata]; a key not
# listed here is not pack state (docs/component-model.md §2-§3).

[machine]
# "unanchored" = merge_result ABSENT: not (or no longer) a merge anchor.
states = [
  "unanchored",
  "pre_open_gate",
  "pull_request",
  "merged",
  "abandoned",
  "retargeted",
  "blocked",
  "refused_false_completion",
  "held",
]
# States that also route the bead to a human (lifecycle.sh stamps
# gc.routed_to=human in the same atomic update).
human_states = ["abandoned", "retargeted", "blocked", "refused_false_completion", "held"]
# States the merge cadence drives and no queue offers. lifecycle.sh clears
# gc.routed_to in the same atomic update unless --route is given or the bead
# already rests on park_route. A pool route on one of these is demand for work
# already in the merge queue, and the claim it invites moves the anchor out of
# `--status=open`, where merge.sh and pr-facts.sh both stop seeing it.
detached_states = ["pre_open_gate", "pull_request"]
# The one route value that is not a queue. No pool claims it, so it parks the
# bead for a person (docs/gascity-human-engagement.md). A detached state may
# rest on it, which is where signoff.sh routes a round-capped anchor, and a
# transition that finds it leaves it alone. Every other route is a pool offer.
park_route = "human"
# States whose legal status is closed; every other declared state is open.
# lifecycle.sh enforces the pairing both ways: --close is accepted only into a
# closed state, and a transition into a closed state must carry --close.
closed_states = ["merged"]

# Legal status x merge_result combinations.
[states.unanchored]
status = "open|closed"
meaning = "no merge_result recorded; not a merge anchor (or rejected back to the pool)"

[states.pre_open_gate]
status = "open"
meaning = "branch pushed, gates armed, no PR yet"

[states.pull_request]
status = "open"
meaning = "PR open, awaiting gates + merge"

[states.merged]
status = "closed"
meaning = "landed; merged_sha recorded"

[states.abandoned]
status = "open"
meaning = "PR closed unmerged externally; routed to human"

[states.retargeted]
status = "open"
meaning = "PR base moved externally; routed to human"

[states.blocked]
status = "open"
meaning = "recorded existing_pr unusable; routed to human"

[states.refused_false_completion]
status = "open"
meaning = "no commits on branch; routed to human"

[states.held]
status = "open"
meaning = "a sitting is waiting on an operator decision; routed to human"

# Transitions. Every edge names its writer; lifecycle.sh performs the write.
# A self-edge (from == to) is always legal: an idempotent re-record.
[[transition]]
from = "unanchored"
to = "pre_open_gate"
writer = "formulas/mol-refinery-patrol.toml merge-push (via lifecycle.sh)"

[[transition]]
from = "unanchored"
to = "pull_request"
writer = "formulas/mol-refinery-patrol.toml merge-push, post-open path (via lifecycle.sh)"

[[transition]]
from = "unanchored"
to = "merged"
writer = "formulas/mol-refinery-patrol.toml merge-push, direct strategy (via lifecycle.sh): FF push verified, record + close in one call"

[[transition]]
from = "unanchored"
to = "blocked"
writer = "formulas/mol-refinery-patrol.toml (existing_pr unusable; via lifecycle.sh)"

[[transition]]
from = "unanchored"
to = "refused_false_completion"
writer = "formulas/mol-refinery-patrol.toml (no commits on branch; via lifecycle.sh)"

# `held` is entered only from `unanchored`. merge.sh, gate-ensure.sh and
# pr-facts.sh each enumerate anchors by their gating state, so moving one here
# to record a conversation would drop it from all three for the hold's length.
[[transition]]
from = "unanchored"
to = "held"
writer = "agents/converse, sitting hold (via lifecycle.sh)"

[[transition]]
from = "pre_open_gate"
to = "pull_request"
writer = "assets/scripts/pr-open.sh"

[[transition]]
from = "pre_open_gate"
to = "unanchored"
writer = "formulas/mol-refinery-patrol.toml merge-push (via lifecycle.sh): a rejection back to the pool, or a rework hand-back leaving the anchor class before it closes landed-on-branch. signoff.sh never transitions the anchor: request-changes clears the marker and files a blocking rework child instead."

[[transition]]
from = "pull_request"
to = "merged"
writer = "assets/scripts/merge.sh; assets/scripts/pr-facts.sh (out-of-band merge record)"

[[transition]]
from = "pull_request"
to = "abandoned"
writer = "assets/scripts/pr-facts.sh"

[[transition]]
from = "pull_request"
to = "retargeted"
writer = "assets/scripts/pr-facts.sh"

[[transition]]
from = "pull_request"
to = "unanchored"
writer = "formulas/mol-refinery-patrol.toml merge-push (via lifecycle.sh): a rejection back to the pool, or a rework hand-back leaving the anchor class before it closes landed-on-branch. signoff.sh never transitions the anchor: request-changes clears the marker and files a blocking rework child instead."

[[transition]]
from = "abandoned"
to = "unanchored"
writer = "human"

[[transition]]
from = "retargeted"
to = "pull_request"
writer = "human (base repaired; re-engage the merge queue)"

[[transition]]
from = "retargeted"
to = "unanchored"
writer = "human"

[[transition]]
from = "blocked"
to = "unanchored"
writer = "human"

[[transition]]
from = "refused_false_completion"
to = "unanchored"
writer = "human"

[[transition]]
from = "held"
to = "unanchored"
writer = "agents/converse, the ruling landed (via lifecycle.sh); or human"

[gates]
# check_set: comma list of gate names on the anchor. Default stamped by
# gate-ensure.sh when absent/empty; sentinel "none" is an explicit opt-out.
check_set_default = "codex"
check_set_sentinel = "none"
# check.<g> = <verb>@<oid>. green written only by signoff.sh; cleared/re-armed
# only by the merge cadence. Merge requires every declared gate green@<live head>.
marker_verbs = ["green", "fixable", "exception"]
# `approval` as a check_set member is satisfied only by an external APPROVED
# review at the live head, never by a check.approval marker.
approval_member = "approval"

[posture]
# What the PR is doing, recorded on the anchor by pr-facts.sh in the same
# `<value>@<oid>` shape the check keys use. merge.sh reads these off the bead;
# nothing else re-derives them from GitHub.
posture_key = "pr_posture"
# The pack's own vocabulary, lowercase, derived in this precedence order: a
# standing CHANGES_REQUESTED outranks an unanswered comment, which outranks an
# approval — one reviewer's approval does not answer another reviewer's
# question. "none" is a PR no reviewDecision applies to.
postures = ["changes_requested", "commented", "approved", "review_required", "none"]
# GitHub's mergeStateStatus, recorded verbatim and uppercase: the vocabulary is
# GitHub's, and a value it adds next year must read as GitHub's, not as ours.
merge_state_key = "pr_merge_state"
# The watermarks separate a comment already routed from a new one. Each is the
# highest id routed in its own id space, and advances only after the routing
# reads back, so a comment nothing answered cannot fall below the mark. Two
# spaces, never merged: a reply can land on an old review, so review ids cannot
# stand in for comment ids.
comment_watermark_key = "pr_comment_watermark"
review_watermark_key = "pr_review_watermark"
# What the outstanding comments were routed to: "rework:<bead-id>" (a fix-pool
# child) or "visit:<bead-id>" (a human already holds this anchor). Either holds
# the merge until it closes — the child through a blocks edge, the visit through
# the pr_number stamp merge.sh's in-flight-holder probe reads. A visit takes no
# blocks edge: escalate.sh files it depending on its subject, so an edge back
# would be a cycle.
disposition_key = "pr_comment_disposition"

# The metadata-key registry: every key the rewritten pack writes, grouped.
[metadata.merge_identity]
keys = [
  "branch", "target", "merged_target", "merged_sha", "pr_url", "pr_number",
  "existing_pr", "merge_strategy", "merge_result", "prepare_mode",
  "rejection_reason", "graduation", "blocked_reason", "work_dir",
  "false_completion_suspected", "branch_ready", "halt_reason", "auto_push",
]

[metadata.gates]
keys = [
  "check_set", "check.<g>", "signoff_dismissed", "check_name", "anchor_bead",
  "review_branch", "review_base", "reviewed_oid", "review_pool",
  "source_review_bead", "task_kind", "dispatch_count", "dispatch_backstop.<g>",
  "fix_target_pool",
  # The review-round cap. signoff_cap = <gate>@<oid> names the exception the
  # cap's human park belongs to, so operator feedback can tell that park from
  # one a person made. pr-facts.sh records each batch of such feedback in
  # signoff_rounds_reset = <review id>.<comment id>; signoff.sh answers it with
  # signoff_round_floor = <rework children then>@<batch>, the rounds that no
  # longer count (docs/state-machine.md).
  "signoff_cap", "signoff_rounds_reset", "signoff_round_floor",
]

[metadata.pr_posture]
keys = [
  "pr_posture", "pr_merge_state", "pr_comment_watermark",
  "pr_review_watermark", "pr_comment_disposition",
]

[metadata.holds]
keys = ["merge_hold", "rebase_hold", "tracking_only"]

[metadata.human_surface]
keys = [
  "gc.takeaway", "gc.takeaway_at", "gc.takeaway_by", "gc.continuation_group",
  "gc.origin", "escalation_key", "visit.recheck",
  "sweep.*", "triage.*", "stall_root",
]

# Warrant beads (label=warrant, routed to the dog pool): the due-process kill
# request a patrol detector files against a live-but-wedged session
# (docs/authority-map.md; formulas/mol-dog-shutdown-dance.toml). Renamed from
# the pre-rewrite bare target/reason/requester — bare `target` collides with
# the merge_identity key above.
[metadata.warrant]
keys = ["warrant.target", "warrant.reason", "warrant.requester"]

[metadata.deferred_dispatch]
keys = [
  "gc.dispatch_when_ready", "gc.dispatch_when_ready_args",
  "gc.dispatch_when_ready_armed_by", "gc.dispatch_when_ready_armed_at",
  "gc.dispatch_when_ready_reason",
]

[metadata.learning]
keys = ["obs.*"]

# Runtime-owned: documented here so readers know they exist; written by the
# Gas City runtime, not by pack transitions. The pack stamps gc.routed_to only
# as a routing decision (stamp-don't-sling, lifecycle.sh --route); the claim
# semantics belong to the runtime.
[metadata.runtime_owned]
keys = [
  "gc.routed_to", "gc.step_ref", "gc.root_bead_id", "gc.execution_routed_to",
  "assignee", "gc.input_convoy_id", "gc.kind", "gc.outcome",
]
