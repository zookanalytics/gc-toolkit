# lifecycle.toml — the pack's declared state: the gates and holds an anchor
# carries, and every metadata key the pack writes.
# Every metadata key the pack writes is enumerated in [metadata]; a key not
# listed here is not pack state (docs/component-model.md §2-§3).

[gates]
# check_set: the comma list of check names an anchor carries, which the PR
# body's handoff fact names (services/gctk/pr). Nothing writes it: a review run's
# triage picks the checks each head needs.
# Approval is a UNIVERSAL merge rule, not a check_set member: the landing
# order's evaluator (services/gctk/pr) merges a PR only on a standing APPROVED
# review from an account that can push to the repository. No check_set token
# arms or opts out of it; GitHub branch protection is an extra layer, not the
# authority. Declaration only, like the rest of this section.
approval_rule = "universal-nonself-standing"

# The hold markers: the metadata a live bead carries to say it is not moving.
# I1 holds that a hold is a wait edge to a live bead in the same store, so
# each key below records a hold the graph cannot answer, and a live bead
# carrying one with no such blocker is what doctor/check-wait-is-an-edge
# reports. The check reads this declaration instead of carrying its own list,
# so a marker added here is asserted without a code change. A hold is a KEY,
# never a sentence: prose is where a conclusion is recorded beside the edge,
# and reading it for holds would make prose a hold carrier again.
[holds]
# Present with a non-empty value, and the bead is held, whatever it says.
marker_keys = ["triage.hold", "blocked_reason", "gc.takeaway"]
# A marker its own writer can answer, as
# `<marker>=[<status>,...:]<settled-key>[=<value>]`: <marker> holds while
# <settled-key> is absent or empty on the same bead. Where the pair names a
# value, it also holds while <settled-key> reads anything else, and where the
# pair names statuses, it also holds on a bead at any other status. Nothing here
# clears a marker: the sentence stands, and the second key records beside it
# what answers it. A pair that does not parse is dropped, so its marker holds.
#
# gc.takeaway is stamped by every sign-off, the one that settled its subject as
# much as the one that parked it for a person, and only the writer knows which
# it was — `gctk bead takeaway --no-wait` says so by stamping
# gc.takeaway_settled beside the headline, and a takeaway without it is a hold.
# Every writer of gc.takeaway writes gc.takeaway_settled in the same statement,
# empty unless it means settled, so a stamp cannot inherit the disposition of
# the sitting before it (assets/scripts/takeaway-settled-pairing.test.sh).
#
# blocked_reason is also the pending record's reason: the merge a bead awaits,
# or the exception that holds it. The record writes it only on a bead whose
# marker, pr_reconcile_pending, is true. A run of the landing order decides a
# record whose marker is true while its bead is open, blocked or closed (plan()
# in services/gctk/pr/landing.go, with record.Read), and the check that reads
# this declaration reads no closed bead. So the pair answers the reason on an
# open or blocked bead whose marker is true, where the reason waits on the
# order's next run and not on a bead. On any other status, such as after a
# claim or a deferral, or at any other value, no run reads the record, so the
# reason holds and the bead owes its edge, as it does once the order clears the
# marker. The order clears an exception's marker only after it files the
# exception's human gate, and the edge an exception or a refinery park owes is
# the human gate filed with it. doctor/check-wait-is-an-edge/run.test.sh holds
# the pair's statuses and value to that code.
settled_keys = ["gc.takeaway=gc.takeaway_settled", "blocked_reason=open,blocked:pr_reconcile_pending=true"]
# merge_hold is not a marker_key: an operator's freeze is theirs to lift, and a
# hold that must show as an edge asserts it through blocked_reason or
# gc.takeaway beside it, both declared above, which carry the wait's sentence.
# The terminal end of a wait is a bead of this issue type: the bead others
# block ON, which by construction can hold no `blocks` edge of its own. A human
# gate is filed blocking the bead that waits (human-gate.sh, or the native
# `bd gate create --type=human --blocks`), and a park is a plain gate a bead's
# own edge points at, so a gate is exempt from I1 rather than a permanent
# unedged finding, whatever it carries. Leaving this line out disables the
# exemption; the check reads an omitted field as one the declaration dropped.
terminal_wait_type = "gate"
# How doctor/check-wait-is-an-edge reports a marker with no live blocker.
# "warn" while a backlog of marker-only holds is still being converted to
# edges; "error" once none are left. The posture is declared here rather than
# compiled into the check, so ending the conversion is this line, and so it is
# readable beside the markers it governs.
#
# A finding converts two ways, and neither blanks a marker: the wait it names
# becomes a `blocks` edge on the same store, or — where nothing is waiting —
# its writer re-stamps it with the settled-key. The second is what keeps this
# posture reachable, because a ritual that stamps a marker on every sign-off
# regenerates the population faster than closes drain it.
hold_severity = "warn"

# The metadata-key registry: every key the pack writes that no gctk domain
# declares, grouped and defined. A key a gctk domain owns is declared in that
# domain's package and listed in services/gctk/key-registry.json, which is
# generated from the declarations (docs/gctk-architecture.md, "The ledger"). A
# key absent from both is not pack state (docs/component-model.md §2-§3). A
# retired key whose residue leaves nothing undone stays registered, with a
# definition that opens RETIRED, so that residue on a pre-retirement bead reads
# as known, not as a stray. doctor/check-state-space flags a live bead carrying
# a retired key only where that key means something is wrong: its HEALER_RE
# list holds the keys deleted with their healer writers, and its RETIRED_KEYS
# list the retired keys whose carrier leaves work undone or shows a retired
# writer still stamping, each with its remedy. Each key's definition names five
# things a reader needs and only two of which the value shows: what WRITES it,
# what READS it, what its ABSENCE means, how it is CLEARED, and its value TYPE.
# Prose is spent where a reader cannot recover those from the group and the
# sections above; a key whose mechanics already sit in [gates] or [holds] is
# defined there and only registered here.
#
# Four field-vocabulary rules the whole registry rests on, each settled against
# the code that reads it:
#
# ROUTE. A lifecycle transition writes no park route and routes no work. It
# clears gc.routed_to for a caller's empty --route, or it keeps the route the
# bead carries: every caller of --route
# passes an empty route or the one the bead already carries. lifecycle.sh
# refuses a --route that is not rig-qualified (<rig>/<agent>), `human`
# included, and a direct --set of the key. A park is a human gate:
# human-gate.sh files it on the bead, and its blocks edge keeps the bead out of
# bd ready until a person clears it, whatever the bead's route. Routes on beads
# outside that state machine — a bead with no --to edge for --route to carry —
# are written by whichever script or formula owns that bead's dispatch. The
# pool offer is exact byte equality (gascity hookClaimMatchesRoute), so a bare,
# unqualified or padded value matches no pool and doctor/check-routed-work-
# claimable reports it. Absent and empty mean the same thing — unrouted — and
# every reader treats them alike; clearing a route writes "" or unsets the key.
#
# ASSIGNED vs ROUTED. Both may be set, and on a claimed pool bead both are: a
# claim writes the assignee and leaves the route as the record of which queue
# offered the bead, and every route reader — the claim predicate included —
# asks about the route only while the bead is unassigned. A handoff to a NAMED
# agent clears the route; a pool route left on directly-assigned work reads as
# demand for work no pool is offered.
#
# THE HEADLINE is gc.takeaway, one line read at a glance, so lifecycle.sh
# refuses a --takeaway that normalizes to nothing, and one longer than 140
# codepoints.
#
# A WAIT IS AN EDGE, never a metadata string (I1, doctor/check-wait-is-an-edge):
# `blocks` is the edge type the pack writes for a hold, one of the three bd
# ready honors with `conditional-blocks` and `waits-for`. `parent-child` is
# decomposition that cascades the parent's blocked state DOWN to its children,
# so the pack attaches a conversation or a finding with `tracks` — which
# carries the structure without making the child unclaimable — and reserves
# parent-child for decomposition that should inherit the block. A dedup key such
# as finding.key is an identity for finding the one existing bead per cause, not
# a wait; any wait it carries is a separate blocks edge. A human gate carries
# its situation key as its await id, and that gate is itself the wait.

[metadata.merge_identity]
keys = [
  "branch", "target", "merged_target", "merged_sha", "pr_url", "pr_number",
  "existing_pr", "merge_strategy", "merge_result", "prepare_mode",
  "rejection_reason", "graduation", "blocked_reason", "work_dir",
  "false_completion_suspected", "branch_ready", "halt_reason", "auto_push",
  "merge_record_failures", "zero_diff_check_failures", "fold_target", "artifact_url",
  "opened_as_draft", "draft_readied",
  "bring_current_from", "bring_current_scope", "conflict_audit", "conflict_question",
  "bring_current_record", "bring_current_reopened", "bring_current_round_at",
  "bring_current_lifted_at",
  "direct_landing_sha",
]
# A bead's PR summary, the account of what its change does, is the pr domain's
# key, declared in services/gctk/pr and listed in services/gctk/key-registry.json.
# merge_result is the anchor state itself, declared in services/gctk/pr/record
# with the pending record's values, which gctk pr record and the landing order
# write. lifecycle.sh writes the values outside the record (unset on
# `--to unanchored`), and doctor/check-state-space lists every value a bead may
# carry; absent reads as `unanchored`. Every other key here is a string unless
# noted.
#
# branch — the source branch the refinery merges, exactly. The polecat's
#   workspace-setup writes it on the anchor, and an ask names the PR's branch in
#   it. Read by the landing order, which holds a PR whose head branch is not
#   this one. Absent leaves that check unarmed. The gc runtime's
#   detached-handoff orphan sweep reads it too: it restores the pool route on an
#   open, unassigned, unrouted bead only when the bead carries branch and a
#   session pin (gc.session_id or gc.session_name). Never cleared. Shape
#   `polecat/<bead-id>` for fresh work.
# target — the landing branch the work merges into: the polecat records it at
#   submit, and an integration effort's setup
#   (mol-design-convoy.toml, the work skill's effort recipe) writes the
#   effort's branch on each of its beads and the default branch on its
#   landing bead. Read as the fallback alias for merged_target, and directly as
#   the landing branch by the polecat's submit target-resolve
#   (mol-polecat-work.toml) and the refinery's prepare and merge-push
#   (mol-refinery-patrol.toml). Absent, the merged_target readers fall through
#   to the default branch and submit falls back to base_branch. Never cleared. A
#   branch name.
# merged_target — where the work actually lands. The refinery's pending record
#   (gctk pr record) writes it with the PR, and direct-merge-push.sh records it
#   at a direct landing. Read by the landing order to catch a base moved out
#   from under a validated PR. Absent falls back to target then
#   the default branch. Never cleared.
# merged_sha — the merge commit recorded at close, by the landing order and
#   direct-merge-push.sh. I5 forbids an empty one, so a
#   record that cannot read the oid writes the sentinel `unverified:PR#<n>`
#   rather than nothing. Not read back; never cleared.
# pr_url / pr_number — the open PR, written by the refinery's pending record
#   (gctk pr record); a human gate carries neither, since it names its anchor through its blocks
#   edge. The landing order reads them to bind a bead to its live PR; a
#   non-numeric pr_number is skipped, and an unparseable pr_url resolves to the
#   fail-closed repo `?`. Never cleared.
#   pr_number is an integer; pr_url is the canonical `scheme://host/owner/repo/pull/<n>`.
# existing_pr — a PR the refinery should reuse rather than open. The
#   refinery's requeue keeps it on a bead it sends back,
#   and the pending record writes it (gctk pr record's first write, and the
#   landing order's requeue of a changed head). Read by
#   refinery-land.sh, which lands a bead that names one through its PR, by
#   refinery-publish.sh as the PR to take. Absent means no PR to reuse.
#   Cleared only by the pending record's publication (gctk pr record), which
#   names the PR in the record's own keys. Value is a PR URL.
# merge_strategy — how the refinery lands the branch, in Gas City's values.
#   refinery-land.sh, the refinery's merge-push step, resolves it once: `mr`
#   publishes a PR, `direct` fast-forwards and pushes straight to the target,
#   and `pr`, an older spelling, reads as `mr`. An absent or empty key resolves
#   to the rig's default_merge_strategy var, else `direct`. A bead that would
#   land `direct` on the default branch, where a bead with no target lands,
#   resolves to `mr`, so the default branch takes work only through a PR
#   (docs/warrants.md), and existing_pr forces `mr` too. Any other value,
#   `local` among them, parks the bead behind a human gate. `mr` is stamped by
#   mol-feedback-distiller.toml, and by direct-merge-push.sh, promoting a bead
#   whose direct push was refused for branch protection into the PR path. Read
#   by refinery-land.sh. Never cleared. Enum
#   `mr | pr | direct | local`.
# prepare_mode — RETIRED. A rework child's stamp, `merge`, for how the refinery
#   brings its branch current. Nothing writes it, and the prepare and resume
#   paths merge origin/<target> in whatever it says, never rebasing, so no
#   branch is rewritten or force-pushed.
# rejection_reason — why the last attempt bounced, embedding `head <oid>` so a
#   later pass can tell which head it spoke for. Written by the refinery's
#   requeue (refinery-requeue.sh), the landing order's requeue of a changed head
#   (gctk pr reconcile) and mol-polecat-work.toml; read at
#   load-context to resume rather than redo. Cleared by the direct landing's
#   merged transition (lifecycle.sh), by the publication of a pending record
#   (gctk pr record), and by the polecat once the merge its resume runs
#   concludes. A stop before then, such as a question for a person, leaves it,
#   so the bead's next run resumes again. Freeform instruction text.
# graduation — RETIRED. `true`, set on a convoy bead when convoy graduation
#   carried its integration branch to the default branch. Nothing writes or
#   reads it now: a landing bead carries an integration effort to the default
#   branch. Registered so that residue on a pre-retirement bead reads as known,
#   not as a stray.
# blocked_reason — the human-readable reason an anchor sits in a human state
#   (a refinery park, a PR closed or retargeted out of band), and on the pending
#   record why the bead is blocked: the merge it awaits, or the exception that
#   holds it. Written by the refinery's parks (refinery-prep.sh,
#   refinery-land.sh, refinery-publish.sh) and the pending record's writers
#   (gctk pr record, gctk pr reconcile); it is also a [holds] marker, so a live
#   bead carrying it owes a blocks edge, save on an open or blocked bead whose
#   pr_reconcile_pending is true, a record the landing order's next run reads
#   ([holds] settled_keys). Freeform.
# work_dir — the polecat's per-bead git worktree, an absolute path, written by
#   workspace-setup so a restart or witness recovery can find the work in flight.
#   Absent means no worktree is recorded yet. Never cleared. Absolute path.
# false_completion_suspected — RETIRED. The reason the refinery refused to close
#   a branch as merged when it carried no verified change against its target.
#   Nothing writes or reads it now: refinery-land.sh's park puts that reason in
#   blocked_reason and in its human gate. Registered so that residue on a
#   pre-retirement bead reads as known, not as a stray.
# zero_diff_check_failures — RETIRED. Consecutive patrols whose zero-diff check
#   could not run on a bead. Nothing writes or reads it now: refinery-land.sh
#   stops on a check that cannot run and leaves the work with the refinery, and
#   the next patrol tries again. Registered so that residue on a pre-retirement
#   bead reads as known, not as a stray.
# branch_ready / halt_reason / auto_push — the auto_push=false halt. auto_push is
#   a caller input the submit step reads; when it is false the polecat records
#   branch_ready=true and halt_reason=auto_push_false and stops without pushing or
#   handing off. halt_reason=store_only marks the other halt, a run whose whole
#   product was store work. Absent auto_push means the normal push-and-hand-off
#   path. Not cleared — the halt is terminal for that run. auto_push and
#   branch_ready are boolean-ish; halt_reason is `auto_push_false | store_only`.
# merge_record_failures — RETIRED. Consecutive failures to record a merged PR on
#   an anchor, an integer. Nothing writes or reads it: the landing order writes
#   a bead's end and files its exceptions.
# fold_target — the branch a bead's work was folded directly onto, stamped by
#   the polecat that folds one bead's fix onto another's branch instead of
#   opening its own PR. `gctk pr compose` reads it to count that bead in the
#   branch's PR-body ledger as work already on the branch.
#   No pack script writes it. Absent means nothing was folded. Never cleared. A
#   branch name.
# artifact_url — RETIRED. The demo comment's URL a fix unit of the old review
#   path recorded when a delivered demo was its landing. Nothing writes or reads
#   it.
# opened_as_draft / draft_readied — RETIRED. The heads at which a PR of the old
#   review path opened as a draft and was read ready, which told its lane
#   dispatch the PR's stage. Nothing writes or reads them.
# bring_current_from / bring_current_scope / conflict_audit / conflict_question /
#   bring_current_record / bring_current_reopened / bring_current_round_at /
#   bring_current_lifted_at — RETIRED. The old review path's record of a round
#   that brought a branch current: where it started, the worker's audit of each
#   conflict, the guard's record and ruling, the lanes it reopened and the line
#   its lifted approval drew. A worker's account of a merge resolved by hand is
#   its merge commit's message, which a review run's triage reads. Nothing writes
#   or reads them.
# direct_landing_sha — the commit a direct landing pushes, stamped by
#   direct-merge-push.sh before the push, which waits on the stamp's exit, so a
#   landing whose record fails stays provable to a later patrol. Read by
#   refinery-land.sh's zero-diff guard: a branch with no change against
#   a target that carries the stamp goes down the direct path instead of being
#   refused as a false completion, and direct-merge-push.sh records the landing
#   at the stamp. A stamp whose push did not land names a commit the target does
#   not carry, so the guard ignores it, and the next landing overwrites it.
#   Absent means no direct push waits on its record. Cleared by the merged
#   transition that records the landing, and by the write that promotes the
#   bead to merge_strategy=mr after a push refused for branch protection. An
#   oid.

[metadata.gates]
# A review run's result on the bead that owns a PR, review_results, and the
# checks an ask sends back, review_checks, are the review domain's keys,
# declared in services/gctk/review and listed in services/gctk/key-registry.json.
keys = [
  "check_set", "signoff_dismissed", "approval_dismissed",
  "signoff_verdict", "visual", "visual_fallback_from",
  "check_name", "anchor_bead", "review_branch", "review_base", "reviewed_oid",
  "review_pr_url", "review_pr_number", "review_context", "review_formula",
  "review_pool", "source_review_bead", "source_ruling_bead", "source_review", "task_kind",
  "fix_target_pool", "wedge_seen_root",
]
# check_set carries its mechanics in [gates] above.
#
# withdraw_head — the head a withdrawal of a PR's approvals names, on a PR the
#   pending record holds, is the pr domain's key, declared in services/gctk/pr
#   and listed in services/gctk/key-registry.json: gctk pr withdraw writes it on
#   the withdrawal it files, and the landing order reads it.
# anchor_bead — the anchor a child of a PR's anchor names; the key is what makes
#   it a child. The child also has an edge onto the anchor, its membership edge,
#   of any type. bd keeps one edge per ordered pair, so an edge the pair already
#   carries is the membership edge. A pair with no edge is joined with
#   `related`. A reader enumerates the live children by
#   `--metadata-field anchor_bead=<id>`, and the closed ones through that edge
#   (every dependent of the anchor, whatever the edge's type) once the store is
#   marked joined (bd-lib.sh bd_anchor_children). No pack script files such a
#   child: an ask names the PR's branch and blocks the anchor by its own edge. A
#   human gate carries none: it names the bead it holds through its blocks
#   edge. Never cleared. A bead id.
# task_kind — the bead's role, the one field a reader decides a kind from (I12);
#   every writer of a kind also sets the matching label. Its vocabulary across
#   the pack: `rework` (work on a PR's branch for its anchor), `triage-subject`
#   (an ephemeral-findings bucket), and `observation`/`feedback-pattern`/
#   `prompt-update` (the learning loop). `review`, `finding` and `validation`
#   are the old review path's, which nothing files. Set once at creation; not
#   cleared.
# signoff_dismissed / approval_dismissed / signoff_verdict / visual /
#   visual_fallback_from / check_name / review_branch / review_base /
#   review_pr_url / review_pr_number / review_context / review_formula /
#   reviewed_oid / review_pool / source_review_bead / source_review /
#   source_ruling_bead / fix_target_pool / wedge_seen_root — RETIRED. The old
#   review path's keys on a review bead, a validation pass and a rework child: a
#   review's dispatch record, its lane and the head it pinned, its verdict and a
#   demo verdict's visual, the approvals a sign-off or a pass dismissed, and the
#   review or ruling a rework child answered. A review run keeps its lanes'
#   verdicts and visuals in its own output, and its result in review_results.
#   Nothing writes or reads them.

[metadata.review_findings]
# RETIRED, every key in this group. A finding was the old review path's review
# objection, a bead of task_kind=finding beside its anchor, which finding.sh
# filed and the validation pass ruled; fix_notes sat on the rework child that
# answered it, and source_finding on a deferred finding's follow-up. A review
# run keeps each finding in its lanes' output and rules it in its own step.
# Nothing writes or reads these keys. finding.key, which the patrol findings
# share, is registered with them in [metadata.patrol_findings].
keys = [
  "finding.lane", "finding.disposition", "finding.source",
  "finding.severity", "finding.category", "finding.failure_scenario", "finding.verification",
  "finding.comment_id", "finding.reply", "finding.reply_posted", "finding.pr_comment",
  "finding.pr_answered", "finding.follow_up", "finding.gate", "finding.ruling_bead",
  "finding.visit", "finding.ruling_visit", "finding.review_id", "finding.review_round",
  "finding.fix_unit", "finding.label", "finding.answer", "finding.fix_answer", "finding.fix_flag",
  "fix_notes", "source_finding",
]

[metadata.review_quorum]
# RETIRED, every key in this group. The step metadata of the old two-lane review
# quorum, a formula the old review path poured. Nothing writes or reads these
# keys. gc.output_json, the step-output key a review run's steps write, is the
# review domain's, declared in services/gctk/review and listed in
# services/gctk/key-registry.json.
keys = [
  "gc.review_quorum_lane", "gc.provider", "gc.output_json_schema", "gc.review_quorum_role",
]

[metadata.self_review]
# The self-review check loop in formulas/mol-polecat-work.toml. Each iteration
# runs the rig's declared checks in its own session through `gctk rig`, which
# records each result against the commit it ran at. The loop's exit condition,
# assets/scripts/self-review-check.sh, converges only when the records of the
# runs the step declares pass at the worktree's live HEAD on a clean tree, and
# setup and build, as the step declares them, passed there. For a check the step
# declares no command for, whatever run the iteration made in its place answers.
# Every key here sits on the work bead.
keys = [
  "self_review_passed_sha", "self_review_setup_build", "aborted_at",
  "self_review_loop_attempts",
]
# self_review_passed_sha — RETIRED. The full commit sha an iteration verified,
#   which the self-review step stamped when an agent's word stood for the
#   checks' result. Nothing writes or reads it: self-review-check.sh converges
#   on the records `gctk rig` keeps and on self_review_setup_build. Registered
#   so that residue on a pre-retirement bead reads as known, not as a stray.
# self_review_setup_build — what setup and build, the declared checks `gctk
#   rig` records nothing for, did at the commit an iteration ran them at. One
#   JSON object stored as a string: commit, the full sha; setup and build, each
#   pass, fail, or none for a check that ran no command; and setup_command and
#   build_command, the commands they ran. The self-review step writes it after
#   its checks, and only on a tree with no uncommitted change, because a build
#   over such changes says nothing about HEAD. self-review-check.sh converges
#   the loop only when it names the live HEAD and each command the step
#   declares, a command the step does not declare having nothing to match, with
#   neither one failed, or with a fail a rig_check_pre_existing value holds this
#   very note for. Each run of the step rewrites it. Absent means no run noted
#   them. Never cleared.
# aborted_at — RETIRED for the self-review loop. `self-review-exhausted`,
#   which self-review-check.sh stamped on the budget's last failing attempt.
#   No core pack path writes or reads it. The opt-in packs/gascity-keeper
#   sub-pack stamps the same key with its own step names. Registered so that
#   residue on a pre-retirement bead reads as known, not as a stray.
# self_review_loop_attempts — RETIRED. The attempt number that exhausted the
#   budget, which self-review-check.sh wrote beside aborted_at. No pack path
#   writes or reads it. Registered so that residue on a pre-retirement bead
#   reads as known, not as a stray.

[metadata.rig_checks]
# A caller's judgment, on a bead, that a rig's recorded fail is pre-existing.
# The result that answers a later `gctk rig` call is the record under the rig
# clone's git common directory (services/gctk/README.md, "rig"). The published
# copy of a result, rig_check.<check>, is rig's key, declared in
# services/gctk/internal/rig and listed in services/gctk/key-registry.json.
keys = [
  "rig_check_pre_existing.test", "rig_check_pre_existing.lint",
  "rig_check_pre_existing.typecheck", "rig_check_pre_existing.setup",
  "rig_check_pre_existing.build",
]
# rig_check_pre_existing.test, .lint, .typecheck, .setup, .build — a caller's
#   judgment that one recorded fail of the check is pre-existing: the same
#   failure is red on the base branch, and a tracker carries it. One JSON
#   object stored as a string: commit, the full sha the judgment is about;
#   record, the fail `gctk rig <check> --check` read at that commit when the
#   judgment was written, or for setup and build, which gctk does not record,
#   the work bead's self_review_setup_build naming the check failed there; and
#   trackers, the tracker bead ids. assets/scripts/rig-check-pre-existing.sh is
#   its one writer. The self-review writes it on the work bead at the HEAD it
#   reviews, and the refinery's handle-failures writes it on the anchor at the
#   merged head. A write for the same record adds its trackers; one for another
#   record replaces the value. self-review-check.sh reads the work bead's to
#   pass a recorded fail at HEAD, and review-evidence.sh reads the anchor's at
#   the reviewed commit, so a review's gather calls that fail pre-existing and
#   the correctness method runs no suite for it. Both judge by rig-check-lib.sh,
#   which reads a value whose record is not the one --check reads now, such as
#   one a run with another command or scope replaced, as no judgment. Only the
#   self-review writes and reads a setup or build value, against its note.
#   Absent means no caller judged a fail pre-existing. Never cleared.

[metadata.pr_posture]
# The keys the old merge path's GitHub intake kept on a bead that owns a PR.
# Nothing writes them. The one-PR update writes pr_provenance_since, and
# nothing writes or reads any other key of this group.
keys = [
  # RETIRED. The PR's review posture at a head, `<posture>@<oid>@<since>`.
  # Nothing writes or reads it: the saved read (pr_github_read) holds the
  # approvers and requesters, which the PR-finishing rank reads.
  "pr_posture",
  # RETIRED. GitHub's mergeStateStatus at a head, `<value>@<oid>`. Nothing
  # writes or reads it: the saved read holds the merge state.
  "pr_merge_state",
  # RETIRED. The old receipts' watermark for the inline comments: the highest id
  # the old intake routed among them. Nothing writes or reads it.
  "pr_comment_watermark",
  # RETIRED. The old receipts' watermarks for the counted reviews' messages and
  # for the conversation comments, each the highest id the old intake routed in
  # its id space. Nothing writes or reads them.
  "pr_review_watermark", "pr_issue_comment_watermark",
  # RETIRED. What the old intake routed a PR's last batch of posts to:
  # `rework:<bead-id>` or `human:<gate-id>`. Nothing writes or reads it.
  "pr_comment_disposition",
  # RETIRED. The old intake's batch ledgers, one per id space: one
  # `<disposition>|<exclusive floor>|<inclusive mark>` record per batch, oldest
  # first, joined by ";". Nothing writes or reads them.
  "pr_comment_batch", "pr_review_batch", "pr_issue_comment_batch",
  # RETIRED. The head oid the old intake last filed its gate for unmarked review
  # threads against. Nothing writes or reads it.
  "pr_unengaged_threads",
  # RETIRED. The head oid at which the old intake last re-ran failed required
  # checks. Nothing writes or reads it.
  "pr_check_rerun",
  # The provenance cutover, UTC, YYYY-MM-DDTHH:MM:SSZ: an unmarked post under
  # the city's login from before it is the city's own (gc_city_own in
  # pr-post.sh). The one-PR update (gctk pr refresh) stamps it in the write that
  # saves the first conversation it reads for a bead that lacks it. Absent or
  # malformed, every post under the city's login is the city's own. Never
  # cleared.
  "pr_provenance_since",
  # RETIRED. How far past its watermark the old intake had read the inline
  # comments' review threads as answered. Nothing writes or reads it.
  "pr_comment_answered",
  # RETIRED. How far past its watermark the old intake had read the counted
  # reviews' messages as answered. Nothing writes or reads it.
  "pr_review_answered",
  # RETIRED. The rank the anchor's PR-finishing work was last settled at.
  # Nothing writes or reads it: the priority reconcile settles that work at the
  # rank the priority function reads (docs/steering.md#pr-finishing-work).
  "pr_finishing_settled",
  # RETIRED. The head of the anchor's PR the old intake last read. Nothing
  # writes or reads it: the saved read holds the head, and the record holds the
  # validated one.
  "pr_head_oid",
]

[metadata.pr_round_trip]
# pr.machine / pr.machine_cause / pr.machine_reason — RETIRED. The old review
#   path's verdict on what its merge cadence could do with an anchor next, a
#   dated `<verdict>@<oid>@<since>`, with the cause and reason of a blocked one.
#   Nothing writes or reads them: the landing order's evaluator reads the
#   review run's result and the PR's state.
# pr.unanswered_threads is how many of the PR's review threads wait on the
# city's answer, `<count>@<head oid>`: unresolved, with no answer of the city's
# after their newest feedback, where a post not for review, one the city marked
# handled with its THUMBS_UP, or one a dismissal retired is neither
# (gc_thread_awaits_answer in pr-post.sh). Nothing writes it or reads it: the PR
# watch saves the threads that wait in the GitHub read it keeps on the bead,
# which the landing order's evaluator reads. It is plain, not dated, and never
# cleared.
# pr.conversation — RETIRED. Where the exchange with the operator stood at a
#   head, `<quiet|outstanding|answered>@<oid>@<since>`. Nothing writes or reads
#   it: a post the city has not taken, or an open ask, is the conversation's
#   state, which the landing order's evaluator reads.
keys = ["pr.machine", "pr.machine_cause", "pr.machine_reason", "pr.conversation", "pr.unanswered_threads"]

[metadata.pr_status_label]
# status_label_clear_owed — RETIRED. A status: label clear that did not land,
#   valued with the PR number. Nothing writes or reads it: the landing order
#   compares each owned PR's labels with the ones the store derives each run,
#   and the comparison is the retry.
keys = ["status_label_clear_owed"]

[metadata.pr_close_disposition]
# The disposition a deliberate supersede/not-planned PR close records on the
# anchor that still owns the open PR before the PR closes, so the PR's closer
# consummates it through bead-rehome.sh instead of filing a rework-or-close
# gate: the landing order (gctk pr reconcile), which requests no merge of a PR
# whose anchor carries it. Written by assets/scripts/pr-dispose.sh and read by
# gctk's pr domain; the marker is intent only — bead-rehome.sh stays the sole
# writer of the disposition edge these name.
keys = [
  "gc.pr_close_disposition_kind", "gc.pr_close_disposition_successor",
  "gc.pr_close_disposition_successor_store",
]

[metadata.holds]
keys = ["merge_hold", "rebase_hold", "tracking_only", "hold_reason"]
# merge_hold, rebase_hold and tracking_only are boolean-ish: empty, `false`, `0`
# or `null` is not held, anything else is. merge_hold is the merge freeze an
# operator or converse writes as a plain truthy value; the landing order's
# evaluator honours it. It is not itself a [holds] marker_key, so a bare
# merge_hold owes no blocks edge; a hold that must show as an edge asserts it
# through blocked_reason or gc.takeaway beside it. rebase_hold and tracking_only are OPERATOR freezes
# the pack only reads. The landing order's evaluator holds a PR's merge on its
# anchor's own rebase_hold, as on merge_hold, and files no conflict ask while a
# hold set by hand holds the bead. Nothing reads tracking_only. The pack never
# writes or clears either.
# hold_reason is a freeform sentence recording why a bead or step was parked in
# place. It is not one of the [holds] marker_keys, so unlike blocked_reason it
# owes no blocks edge; it is read only as a "held on purpose" signal.
# doctor/check-claim-advancing exempts a step or root carrying it (or gc.takeaway)
# from its stall arms with the remedy status=blocked. No pack
# script writes it; an operator or the refinery stamps it by hand when parking a
# branch. Never cleared. Freeform.

[metadata.proactive]
# The proactive first-reaction surface. A first reaction is a run of
# formulas/mol-first-reaction.toml that gctk reaction sling slings on its
# subject S. While it runs, the run is the record, and gc sling refuses a
# second live run of the formula on S. Once it ends, the state its exit wrote,
# and after that the gc.takeaway headline every exit writes, keep S out of the
# scan (specs/tk-1tfzr71.105/design.md, section 2), so no key records that S
# had one. The group holds the recommendation a recommend exit leaves for the
# operator's Accept, and the retired keys of the reaction bead and of the
# attempt record before it.
keys = [
  "gc.recommended_formula", "gc.recommended_formula_dispatched",
  "gc.proactive",
  "gc.reaction_kind", "gc.reaction_subject", "gc.reaction_subject_store",
  "gc.reacted_by", "gc.proactive_reaction", "gc.reaction_owned",
  "gc.blocker_key",
  "gc.first_reaction", "gc.first_reaction_reason", "gc.first_reaction_target",
  "gc.first_reaction_at",
]
# gc.recommended_formula — the execution mol a recommend exit names, which
#   gctk reaction accept dispatches once the operator takes it, as a sitting's
#   sign-off does with --accept. The reaction domain owns it
#   (services/gctk/reaction, listed in services/gctk/key-registry.json),
#   and it stays registered here while shell still clears it. gctk reaction
#   dispose sets it once a recommend's gate is filed and unsets a stale one
#   before any exit acts, each write taking its exit. gctk reaction accept
#   unsets it in the write that records its dispatch, and
#   converse-invalidate-recommendation.sh unsets it when a sitting judges the
#   recommendation no longer valid. gctk reaction accept and
#   converse-invalidate-recommendation.sh both read it as a non-empty value, so
#   absent and empty both mean no live recommendation, which no Accept takes.
#   A formula name that `gc formula show` resolves.
# gc.recommended_formula_dispatched — the formula gctk reaction accept slung,
#   written in the update that unsets gc.recommended_formula. The reaction
#   domain owns it (services/gctk/reaction), and it stays registered here while
#   converse-signoff.sh reads it in shell, to tell a recommendation an Accept
#   already took. Accept slings before it writes this key, so absent means no
#   Accept has recorded a dispatch. Never cleared. A formula name.
# gc.proactive — RETIRED. `1`, the scan opt-in patrol-finding.sh stamped on
#   each finding it filed. Nothing writes or reads it: the scan reads every
#   ready, unassigned bead in its rig that is not an epic, so a finding needs no
#   opt-in to be read. Registered so that residue on a pre-retirement bead reads
#   as known, not as a stray.
# gc.reaction_kind — RETIRED. The sub-type a reaction bead carried,
#   `first-reaction`. Nothing writes or reads it, because no pack code files a
#   reaction bead. Registered so that residue on a pre-retirement bead reads as
#   known, not as a stray.
# gc.reaction_subject / _store — RETIRED. On a reaction bead, the subject it
#   tracked and, where the id prefix was ambiguous, that subject's store.
#   Nothing writes or reads them. Registered so that residue on a
#   pre-retirement bead reads as known, not as a stray. Bead id / store.
# gc.reacted_by — RETIRED. On a subject, the reaction bead whose exit landed.
#   Nothing writes or reads it. Registered so that residue on a pre-retirement
#   bead reads as known, not as a stray. A bead id.
# gc.proactive_reaction — RETIRED. `1`, on a subject, the proof an older first
#   reaction stamped once its exit had landed. Nothing writes or reads it.
#   Registered so that residue on a pre-retirement bead reads as known, not as
#   a stray.
# gc.reaction_owned — RETIRED. `1`, the marker that gc-helm.sh
#   `engage --new-subject` wrote on the subject it filed, so that no scan
#   reacted to a subject a sitting owned. Nothing writes or reads it: the
#   subject's open conversation keeps a first reaction off it, because
#   gctk reaction sling refuses a bead an open conversation tracks.
#   Registered so that residue on a pre-retirement bead reads as known, not as
#   a stray.
# gc.blocker_key — RETIRED. The dedup handle a blocked first reaction stamped
#   on the wait bead it filed. Nothing writes or reads it: the blocked exit's
#   --blocker reuses a pending wait of the subject's under the same title, as
#   gctk bead holds lists it, before it files one. Registered so that residue
#   on a pre-retirement bead reads as known, not as a stray.
# gc.first_reaction / _reason / _target / _at — RETIRED. The attempt record a
#   reaction wrote on its subject before the act, with the reason, the target it
#   named and the time. Nothing writes them: the card a first reaction writes in
#   its subject's notes is the record of what it chose and why. Registered so
#   that residue on a pre-retirement bead reads as known, not as a stray.
#   bead-context.sh still shows them on such a bead, and a validating closer
#   reads _reason as the close brief of an older reaction that left its brief
#   there.

[metadata.priority]
# The priority flow (docs/steering.md): a bead's priority is the priority of the
# bead it follows plus its own shift, computed by assets/scripts/priority-lib.sh,
# and the bd priority field holds the result, because a claim reads that field
# and a pour copies it once.
keys = ["priority_shift"]
# priority_shift — the bead's shift from the bead it follows: +1 is one level
#   later and -1 one level sooner, and each level stops at P0 and P4. Written by
#   queue-priority.sh move, its --shift. Read by priority-lib.sh
#   wherever a priority is computed: queue-priority.sh settle, its move and its
#   reconcile pass. Read only on a bead that follows a parent or an anchor, a
#   review run's root among them: a workflow's convoy and steps, and any other
#   workflow's root, carry no shift, and a bead that follows nothing has nothing
#   to shift from. Absent or empty reads as 0, and as -1 on a review run's root,
#   the shift the rest of PR-finishing work is filed with, since the landing
#   order pours the root with none. A value that is not a signed integer makes
#   the bead unreadable, and every bead that follows it, so no priority is
#   computed from it. No pack writer clears it. A signed integer, stored as a
#   number.

[metadata.supersede]
# RETIRED. The successor keys a disposition carried before bd's own edges
# carried it. A disposed bead names its successor through a `duplicates` or
# `supersedes` edge, which bead-rehome.sh records and bd-lib.sh's
# $DISPOSITION_JQ reads, so nothing writes or reads any key here. Registered so
# that residue on a bead disposed before the edges reads as known, not as a
# stray.
keys = [
  "gc.superseded_by", "gc.superseded_by_store",
  "superseded_by", "superseded_by_store",
  "gc.supersedes", "gc.supersedes_store", "duplicate_of", "duplicate_of_store",
]
# gc.superseded_by / _store, and the bare superseded_by / _store — RETIRED. On
#   the origin, the successor it retired into and that successor's store. A
#   live bead carrying one is a disposition whose close never landed, so
#   doctor/check-state-space lists them in RETIRED_KEYS.
# gc.supersedes / _store — RETIRED. On the successor, the origin it replaced.
#   Inert on every bead, live or closed, so it is not in RETIRED_KEYS.
# duplicate_of / _store — RETIRED. The canonical a parked duplicate named, for
#   a sweep that closed it later. A duplicate closes at once now, so a live bead
#   carrying one is a close nothing will make, and doctor/check-state-space
#   lists them in RETIRED_KEYS.

[metadata.epic_stewardship]
# An epic's contract and the ruling on its hypothesis, recorded on the epic bead
# (issue_type=epic). docs/epics.md is the contract these fields make
# machine-readable, and docs/epic-stewardship.md is the enforcement that reads
# them. `gctk epic create` (assets/scripts/epic.sh, the work skill's epic
# create) writes the contract fields into the create that files an epic, and
# refuses an epic whose parent is not an epic when it has no epic_hypothesis.
# A contract field the filer writes is its proposal, and the epic's notes say
# whose words each field is. After the filing a contract field takes only words
# the operator stated or approved, and the ruling's keys are stamped when the
# operator rules at a review of the epic, whose block in the epic's notes is the
# dated record docs/epics.md calls for. No key marks an epic as reviewed, and no
# pack script writes the ruling's keys. finalize-gate.sh
# (clause_epic_ruling_recorded) and doctor/check-epic-closed-implies-ruled read
# epic_hypothesis, epic_ruling and epic_ruling_reason, and `gctk epic
# unweighed` reads the ruling's keys, epic_shifted_at and epic_weighed_at.
keys = [
  "epic_handle", "epic_hypothesis", "epic_boundaries",
  "epic_closure_condition", "epic_indicators",
  "epic_ruling", "epic_ruling_reason",
  "epic_ruling_at", "epic_ruling_by", "epic_ruling_evidence",
  "epic_shifted_at", "epic_weighed_at",
]
# epic_handle / epic_hypothesis / epic_boundaries — the elaboration floor
#   (docs/epics.md): a 3-5 word handle, a one-sentence hypothesis, and the
#   boundaries. epic_hypothesis also tells an Epic from a Delivery: an epic
#   whose parent is an epic and that carries none is a Delivery, which the
#   ruling requirement does not hold (clause_epic_ruling_recorded).
# epic_closure_condition / epic_indicators — the rest of the contract (3-6
#   closure checks, 1-3 leading indicators). Absent means unrecorded.
# epic_ruling — the latest ruling on the hypothesis: `continue`, `shift`, or
#   `close` (docs/epics.md). continue and shift keep the epic open; close is the
#   one terminal ruling. Each later ruling overwrites the last.
#   clause_epic_ruling_recorded holds the finalize of an epic other than a
#   Delivery until it reads close with an outcome, and
#   check-epic-closed-implies-ruled errors on such a closed epic that lacks
#   either. Absent means the hypothesis has not been ruled on.
# epic_ruling_reason — why the latest ruling was made, written with it. On a close
#   ruling it is the outcome, and the close requires it: the hypothesis held, was
#   disproven, cannot be met as stated, stalled, or ran past its cost. On continue
#   or shift it says what the next body of work is aimed at. Absent or whitespace
#   alone reads as unrecorded.
# epic_ruling_at / epic_ruling_by / epic_ruling_evidence — when the operator
#   made the latest ruling, who recorded it, and the human gate whose resolve
#   carried it. Bookkeeping beside epic_ruling; absent leaves the provenance
#   unstated.
# epic_shifted_at — when the operator last ruled shift, stamped with that
#   ruling and left standing by a later continue or close, so the rig's po
#   still weighs the shift at its next portfolio sync. Absent records no shift
#   beyond the ruling's own keys.
# epic_weighed_at — the time of the read the rig's po last weighed the epic
#   from at a portfolio sync, which `gctk epic unweighed` prints first, stamped
#   with the sync's note on the epic. A close or shift on or after its day
#   lists at the next sync. Absent means no sync has weighed the epic.

[metadata.human_surface]
keys = [
  # gc.demand_for — RETIRED. It named the bead a demand gated. Nothing writes or
  # reads it: a human gate names the bead it gates through its blocks edge, and
  # an open human gate there is what tells a person still deciding from a
  # sitting that ended, never the gc.takeaway headline beside it.
  # doctor/check-state-space lists it in RETIRED_KEYS.
  # gc.takeaway_settled is the headline's own disposition, "1" where its writer
  # said nothing is waiting and empty where it did not: [holds] settled_keys
  # reads it, and it is rewritten with every headline rather than surviving one.
  "gc.takeaway", "gc.takeaway_at", "gc.takeaway_by", "gc.takeaway_settled",
  "gc.demand_for", "gc.hold_demand", "gc.gate_visit",
  "gc.continuation_group", "gc.origin", "gc.outcome_reason",
  "escalation_key", "escalation_raised_by", "visit_topic",
  "escalation.recurrences", "escalation.recurrence_last",
  "stale_escalated_at", "stale_escalated_to",
  "visit.recheck", "sweep.*", "triage.*",
  "gc.pr_visit_summary", "gc.pr_visit_actions",
  "gc.ruling", "gc.folded_into", "gc.handback", "gc.handback_at",
  "gc.ruling_consequence",
]
# The gc.takeaway family carries its mechanics in the comment above and in
# [holds] (settled_keys): gctk bead takeaway and lifecycle.sh write the takeaway
# (gc.takeaway_by records which), and gc.takeaway_settled is `1` when nothing
# waits and empty for a live wait. The takeaway package
# (services/gctk/takeaway) declares the family, and it stays registered here
# while shell still reads it (docs/gctk-architecture.md, Debt).
# gc.hold_demand — RETIRED. On a converse hold's VISIT, it named the demand the
#   hold filed. A hold now files a human gate, and its conversation's replies-to
#   edge names the gate, so nothing writes or reads the key, and
#   doctor/check-state-space lists it in RETIRED_KEYS.
# gc.gate_visit — RETIRED. On a demand, the visit the retired gate-visit sweep
#   filed for it (a bead id, or `filed`). Nothing writes or reads it, and
#   doctor/check-state-space lists it in RETIRED_KEYS.
# gc.continuation_group — Gas City's continuation group: the hook claim
#   preassigns a claimed bead's open, unassigned siblings in the same group to
#   the claiming session. The pack's formulas stamp `main` on their step beads,
#   beside gc.session_affinity, so one session runs a molecule's inline steps
#   in turn. A visit filed before the cutover carries its subject here, which
#   nothing reads. A conversation carries none. Never cleared.
# gc.origin — `operator` marks a topic a human commissioned. operator-intake.sh
#   stamps it on its subject when the key is absent, and gc-helm.sh `engage
#   --new-subject` writes it in the create payload of the subject it files.
#   bead-context.sh returns it with a subject's context. It decides no
#   first-reaction exit. The rubric in agents/proactive/prompt.template.md has
#   the reacting agent triage an operator capture on its merits like any other
#   bead, and
#   gctk reaction dispose gates nothing on it. Absent is an ordinary bead.
#   Not cleared.
# gc.outcome_reason — RETIRED. On a closed visit, the one-line sentence naming
#   why it closed, stamped beside the gc.outcome word a reader groups by.
#   Nothing writes or reads it: a conversation's close reason carries that
#   sentence, and the helm board's sittings card reads it there as the
#   headline when the sitting left no takeaway. Registered so that residue on a
#   pre-retirement bead reads as known, not as a stray; doctor/check-state-space
#   reports a live bead that still carries it.
# escalation_key — RETIRED. On a visit, the situation key it was filed under.
#   Nothing writes or reads it: a human gate carries its situation key as its
#   await id (human-gate.sh), and the pack's readers look a gate up by that.
#   doctor/check-state-space lists it in RETIRED_KEYS.
# escalation_raised_by — RETIRED. It named the patrol wisp that raised a visit
#   redirected onto a standing triage bucket. human-gate.sh refuses a wisp
#   rather than redirecting it, and nothing ever read this key. Registered so
#   that residue on a pre-retirement bead reads as known, not as a stray.
# visit_topic — RETIRED. `own` on a visit filed for a distinct concern beside a
#   live sitting on its subject, written by gc-helm.sh open before the cutover.
#   A conversation is a concern of its own and keeps a sitting of its own, so
#   nothing writes or reads the key. Registered so that residue on a
#   pre-retirement bead reads as known, not as a stray.
# escalation.recurrences / escalation.recurrence_last — RETIRED. They were the
#   recurrence tally kept on a closed visit inside its verdict window.
#   human-gate.sh keeps no tally: a quiet window a call declares files nothing
#   and counts nothing. Registered so that residue on a pre-retirement bead
#   reads as known, not as a stray.
# stale_escalated_at / stale_escalated_to — RETIRED. Nothing writes or reads
#   these: an anchor whose PR is open is a named wait however long the PR sits,
#   so no pass escalates it for its age. Registered so that residue on a
#   pre-retirement bead reads as known, not as a stray.
# visit.recheck — RETIRED. The recheck command liveness-sweep.sh stamped on a
#   batch visit, a shell snippet. Nothing writes or reads it: the sweep's gate
#   carries the command in its message (`liveness-recheck.sh --ids <new>
#   --carried <carried> --pass-at <time>`), and doctor/check-state-space lists
#   it in RETIRED_KEYS.
# sweep.* — RETIRED. The census liveness-sweep.sh stamped on a batch visit:
#   sweep.new_ids and sweep.carried_ids (comma-joined id lists, this pass and
#   carried) and sweep.pass_at (the pass timestamp). Nothing writes or reads
#   them: the census rides the re-check command in the gate's message, and
#   doctor/check-state-space lists each in RETIRED_KEYS.
# triage.* — the standing triage subjects liveness-sweep.sh keeps: triage.scope
#   names what a subject covers (`unnamed-waits` on the sweep's bucket, or the
#   scope tokens its recurrence pass evaluates: p<=N, label:X, kind:X,
#   unrouted), triage.last_seen the comma-joined ids in scope when the last
#   recurrence was filed (absent until the subject is first evaluated, empty
#   for an empty scope), and triage.hold a held-by-design marker ([holds]
#   marker_keys).
# gc.pr_visit_summary / gc.pr_visit_actions — RETIRED. They were the closing
#   text of a visit's PR reminder, stashed on the visit before it closed. The
#   comment pr-sitting-comment.sh draws reads a visit's conclusion and actions
#   from the conversation itself, its gc.handback and its comments, so nothing
#   writes or reads them, and doctor/check-state-space lists them in
#   RETIRED_KEYS.
# gc.ruling — RETIRED. On a VISIT closed before the cutover, the operator's
#   ruling in its sitting, freeform text. Nothing writes or reads it: a ruling
#   is the resolve reason of each gate a sitting answers, headed `ruled:`.
#   doctor/check-state-space
#   lists it in RETIRED_KEYS.
# gc.folded_into — RETIRED. On a VISIT closed `folded` before the cutover, the
#   visit it folded into, a bead id in the folded visit's own store. Nothing
#   writes or reads it, because gates do not fold, and doctor/check-state-space
#   lists it in RETIRED_KEYS.
# gc.handback / gc.handback_at — on a conversation, the latest hand-back its
#   converse sitting posted, whole (a framing or the sign-off), and when it was
#   recorded (RFC-3339 UTC). gc-helm.sh `handback` writes both in one update,
#   each record replacing the one before. gc-helm.sh `engage` reads them once
#   the tab's attach returns on a closed conversation, and prints the text in
#   the operator's terminal as the sitting's last words. Absent, the tab says
#   the sitting recorded no hand-back. Once the conversation reads closed,
#   pr-sitting-comment.sh shows the text word for word as the visit's conclusion
#   in its comment on the subject's PR. The rig board reads both through gctk's
#   listing and opens an open decision's Details with the newest hand-back on a
#   conversation that tracks it, open or closed. Never cleared. Freeform
#   multi-line text.
# gc.ruling_consequence — on a conversation, the open PR each of its rulings'
#   --rework or --retire acts on: a JSON object from the ruling's answer
#   (`ruled: <ruling>`) to {act, anchor, child}, act `rework` or `retire`,
#   anchor the PR's anchor bead, and child the rework a `rework` filed.
#   converse-signoff.sh writes a ruling's entry first, without child, and the
#   rework or retirement acts only on its zero exit. Once converse-rework.sh
#   names the ask it filed, the sign-off writes the entry again with it as the
#   child, before any other write. A re-run of that ruling with the same answer
#   acts on the anchor it names, even once that anchor has closed, as a retired
#   PR's does when the landing order consummates its disposition, and files no
#   second rework once the child it names has closed. An entry binds no re-run
#   that answers differently, which rewrites it when its answer acts on a PR.
#   Never cleared.

[metadata.patrol_findings]
# One durable bead per distinct patrol finding, written by
# assets/scripts/patrol-finding.sh (the deacon and witness patrols file through
# it). finding.key and finding.about together are the dedup identity. A report
# whose key and subject both match a live bead records a recurrence on that
# bead, unless that bead is held at blocked with nothing open left to wait on.
# A report that names no subject matches only a bead with no finding.about. An
# --about that names a wisp (`*-wisp-*`) is dropped, and the key alone
# identifies the finding. A patrol burns its wisp when the pass ends, so no
# later pass can name the same one. When no live bead takes the report, a new
# bead is refused while a live finding with the same finding.scope carries the
# report's key under another subject or none, or the report's subject under
# another key. The refusal lists those findings, and a caller reporting one of
# them re-runs with that finding's key and subject, which records a recurrence
# there. --distinct files the new bead despite those findings, though an exact
# match still records a recurrence. A key meant to hold one finding per subject
# passes --distinct on every call. finding.scope is which patrol filed it;
# finding.digest is the message hash that tells a recurrence with changed text
# from an identical one. finding.occurrences counts the recurrences and
# finding.first_seen/finding.last_seen bracket them.
# finding.recurrence_of names the earlier finding a reappearance repeats: a
# closed one, or one held at blocked with nothing open left to wait on. Either
# way it is the bead to read first.
keys = [
  "finding.key", "finding.scope", "finding.digest",
  "finding.first_seen", "finding.last_seen", "finding.occurrences",
  "finding.about", "finding.recurrence_of",
]
# finding.key here is the same prefix the review findings use
# ([metadata.review_findings]); the two families share the name and are told
# apart by task_kind, and only these patrol keys (scope, digest, the seen
# timestamps, occurrences, about, recurrence_of) belong to this one.

[metadata.preexisting_failure]
# One tracker per failure already red on a base branch, filed through
# assets/scripts/preexisting-failure.sh by the refinery's merge gate
# (mol-refinery-patrol.toml, handle-failures) and by a polecat's pre-flight
# (mol-polecat-work.toml, preflight-tests).
keys = ["failure_key"]
# failure_key — the failure's dedup identity, as the script's `key` derives it:
#   a test function, a repo-relative path, or a linter and a path. `file` writes
#   it in the create and reads it back; `find` matches it exactly, over the live
#   statuses for both gates' lookup, then over closed beads when no live tracker
#   holds it, to follow the most recently closed tracker's chain of
#   disposition edges to a live bead, and over closed beads for the pre-flight's landed-fix
#   check. `find` reads no title, so a bug without it is no tracker. A first
#   reaction's intake reads it to admit the tracker to a pool. Never cleared,
#   so a retitle or a fold leaves it in place. A string.

[metadata.seed_audit_reaudit]
# The seed audit's re-audit: the one bead that re-renders generated/seed-audit on
# the default branch, once that branch is found committing files that no longer
# render as committed, and lands the new text in a pull request of its own.
# Filed and slung by assets/scripts/seed-audit-reaudit.sh, which the landing
# order (gctk pr reconcile) calls with the files it found.
keys = ["seed_audit_reaudit"]
# seed_audit_reaudit — the branch the re-audit re-renders, written in the create
#   with target set to the same branch. The writer's dedup reads it over the live
#   statuses, so a branch owns at most one live re-audit. Never cleared. A branch
#   name.

# Warrant beads (label=warrant): the kill request a patrol filed against a live
# session, for the dog pool's shutdown dance. The pack has neither now, since
# Gas City's work ladder recovers a stuck pool seat.
[metadata.warrant]
keys = ["warrant.target", "warrant.reason", "warrant.requester"]
# warrant.target / warrant.reason / warrant.requester — RETIRED. The session a
#   warrant named, why the patrol filed it, and the patrol the dance answered
#   when it finished. Nothing writes or reads them now. Registered so that
#   residue on a pre-retirement bead reads as known, not as a stray.

[metadata.deferred_dispatch]
# The arm itself, gc.dispatch_when_ready and its _args, _armed_by, _armed_at,
# _reason and _fail_count, is gctk's: services/gctk/arm/record declares each key
# and is its one writer, and services/gctk/key-registry.json lists them. What
# stays here is the pool a ruling's wait re-slings to, the arm's retired crash
# marker and the retired notice.
keys = [
  "gc.dispatch_when_ready_slung", "gc.notify_when_ready", "resling_target",
]
# gc.dispatch_when_ready_slung — RETIRED. The crash marker the reconcile pass
#   wrote around its sling, `slinging@<ts>` while an attempt was in flight and
#   `slung@<ts>` once proven. gctk bead start-armed finds an earlier attempt's
#   pour by the token on its root's title and reads gc sling's exit 3 instead,
#   and nothing writes or reads the marker. Registered so that residue on a
#   pre-retirement bead reads as known, not as a stray.
# gc.notify_when_ready — RETIRED. The notice owed to the named agent a bead was
#   assigned to, whose value named the agent. A named agent hears about ready
#   work through Gas City's hand-off, its nudges and its controller's wake
#   (docs/deferred-dispatch.md), and nothing writes or reads the key. A bead
#   that still carries it stays assigned to the agent it names, which hears
#   through those paths. Registered so that residue on a pre-retirement bead
#   reads as known, not as a stray.
# resling_target — the pool a declined run's work re-slings to. await-ruling.sh
#   writes it in the update that clears the work bead's route keys before the
#   arm, because from that clear until the arm lands nothing else on the bead
#   names the pool. Its own pool lookup reads it last, after the route keys and
#   gc.dispatch_when_ready, so a re-run after an arm that was refused or failed
#   still finds the pool with no --target. Absent means no ruling wait has
#   cleared the bead's routes. Never cleared; the next wait overwrites it. A
#   rig-qualified pool identity (<rig>/<agent>).

[metadata.design_convoy]
# The resume record formulas/mol-design-convoy.toml keeps on its subject, the
# effort's landing bead (docs/design-convoy.md). Each step reads it from the
# subject when the step starts, so a resumed run files no second bead and
# dispatches nothing twice.
keys = [
  "gc.design_child", "gc.design_armed",
  "gc.impl_child", "gc.impl_armed",
  "gc.summary_task", "gc.summary_armed",
]
# gc.design_child / gc.impl_child / gc.summary_task — the design child, the
#   implementation child and the summary task, each written on the subject by
#   the step that files it, in the update after its create. The later steps
#   read the ids to wire their edges and to dispatch, and the implementation
#   child's brief tells it to make the bead gc.summary_task names wait on each
#   bead it splits into. Absent means the bead is not filed: its own step files
#   it, and a later step that needs it stops. Not cleared. A bead id.
# gc.design_armed / gc.impl_armed / gc.summary_armed — `1` once the dispatch
#   step has dispatched that bead: the design child slung, the implementation
#   child armed behind the design or slung, the summary task armed. The step
#   dispatches only after every target and edge of the setup is written and the
#   subject is with the refinery, and stamps each marker right after its
#   own dispatch. Absent means that dispatch has not happened, so a resume runs
#   it. Not cleared. A string.

[metadata.rig_demo]
# The paths formulas/mol-rig-demo.toml records on its demo-request bead, the
# input convoy's one member. Each later step derives the bead again and reads
# the path from it, so the path outlives the session that recorded it.
keys = ["demo_script_path", "demo_mp4_path"]
# demo_script_path — the demo:capture script the capture runs, written by the
#   prepare-script step once the file exists: the pour's demo_script, or the
#   path the gc-toolkit.gc-demo-script skill reports for a source_bead. The
#   capture step reads it, and stops, asking for prepare-script to run again,
#   when it is absent or names no file. Not cleared. A file path, absolute or
#   relative to the capture session's working directory.
# demo_mp4_path — the clip the capture step wrote, under
#   ${TMPDIR:-/tmp}/rig-demo/<request bead>/, outside the repo tree, written
#   once rig-demo-capture.sh exits 0. The deliver-and-finalize step reads it to
#   deliver the clip with demo-deliver.sh or to report where it is, and stops,
#   asking for capture to run again, when it is absent or names an empty or
#   missing file. Not cleared. A file path.

[metadata.learning]
# The feedback-learning loop's beads (docs/feedback-learning.md). obs.* is the
# observation surface — obs.category, obs.scope, obs.source, obs.directive,
# obs.provenance, obs.distilled and their siblings — written by the observer at
# filing and read by the distiller; the wildcard registers the whole namespace.
# The other keys sit on a pattern bead (task_kind=feedback-pattern), backlog
# work whose state is its bd status: open while it needs a decision, waiting on
# its follow-up through a blocks edge, deferred while it gathers evidence, and
# closed once resolved (formulas/mol-feedback-distiller.toml, judge-and-cluster
# §7). The keys record the judgments behind that state, and none of them is the
# state.
keys = [
  "obs.*", "remedy_class", "eng_bead",
  "evidence_count", "distinct_sources", "first_seen", "last_seen",
  "promotion_hold", "proposal_bead", "proposal_carrier", "proposal_action",
  "remedy_note",
  "promotion_disposition", "disposition", "remedy_outcome", "remedy_veto_ref",
  "origin",
]
# remedy_class — `structural` on a promoted feedback pattern the distiller judged
#   belongs in code rather than a prompt rule; written with eng_bead by
#   mol-feedback-distiller.toml. eng_bead — the engineering bead that structural
#   remedy was filed as. A bead id; neither is cleared.
# evidence_count / distinct_sources / first_seen / last_seen — a pattern's
#   rollups, which the distiller derives from the observations stamped onto it
#   and overwrites on every pattern it touches, whatever its status
#   (judge-and-cluster §3): the distinct obs.provenance events, the distinct
#   obs.source values among them, and the dates of the earliest and the latest
#   observation. The rubric weighs them as evidence. Never cleared; the next run
#   that touches the pattern overwrites them. Two counts and two RFC 3339 UTC
#   timestamps.
# promotion_hold — the block a deferred pattern is held on, as a slug such as
#   `gate1-single-event-operator`, written by the distiller when it defers the
#   pattern (judge-and-cluster §7) and read by the run that judges it next.
#   Absent on a pattern never held. Not cleared, so it names the last hold, and
#   the pattern's status says whether it is held now. A slug.
# proposal_bead / proposal_carrier / proposal_action — the prompt-update the
#   distiller filed for a pattern, with that proposal's carrier and action
#   (file-and-dispatch §1), read by a later run to learn what the pattern
#   spawned. Absent on a pattern that never promoted. Not cleared; a later
#   proposal overwrites them. A bead id and two words from the proposal's Rule
#   section.
# remedy_note — a sentence the distiller's judgment leaves on a pattern about its
#   remedy, read by the run that judges the pattern next. Freeform; not cleared.
# promotion_disposition / disposition / remedy_outcome / remedy_veto_ref /
#   origin — RETIRED. Nothing writes them now. Earlier runs recorded a pattern's
#   outcome in the first four, which its status and its close or defer reason
#   now carry, and origin named the audit that seeded a pattern
#   (`audit:<bead>`). Registered so that residue on a pattern reads as known,
#   not as a stray. Strings; never cleared.

[metadata.upstream_send]
# An upstream finding (docs/outbound-sends.md) is known by its upstream-finding
# label, and keeps what it records in its description and its edges. The
# external-issue skill files it with no metadata key, task_kind included. These
# keys are the ones some upstream findings carry with a command drafted for the
# other project.
keys = ["upstream_send_key", "gh_command", "gh_verb", "gh_target_repo"]
# upstream_send_key / gh_command / gh_verb / gh_target_repo — RETIRED. Nothing
#   writes them now. On an upstream finding that carries them, gh_command is a
#   drafted command, gh_target_repo and gh_verb its target and action, and
#   upstream_send_key a situation key nothing reads. The conversation that picks
#   the finding up may start from the draft, after it has read the project's
#   security policy. Registered so that they read as known, not as strays.
#   Strings; never cleared.

[metadata.patrol_bookkeeping]
# Rig-stamps and recovery bookkeeping the patrols write on beads they touch.
keys = [
  "gc.rig", "reconcile_rig",
  "recovered", "recovered_at", "recovered_count",
]
# gc.rig — the rig a patrol stamps on a bead just before assigning it, so an
#   interrupted pour leaves a rig-scoped orphan; written by mol-witness-patrol.toml
#   and mol-refinery-patrol.toml. The rig name.
# reconcile_rig — the rig a checkout-reconcile bead pertains to, the field
#   reconcile-rig-checkouts.sh enumerates the mayor's beads by. A rig name.
# recovered / recovered_at / recovered_count — witness orphan-recovery
#   bookkeeping (mol-witness-patrol.toml). recovered_at and recovered_count feed a
#   crash-loop RATE, which is what a reader must judge a repeat recovery by;
#   recovered is a flag nothing clears, so its mere presence is not that signal.
#   Two timestamps and a count; not cleared.

# Runtime-owned: documented here so readers know they exist; the claim, pour and
# step semantics belong to the Gas City runtime, not to pack transitions. The
# pack does write some of these as decisions — gc.routed_to is a routing stamp
# (lifecycle.sh --route, stamp-don't-sling), gc.execution_routed_to is cleared by
# mol-polecat-work's blocked-work guard and by await-ruling.sh, and gc.outcome
# is stamped by many pack components — but their meaning is the runtime's.
[metadata.runtime_owned]
keys = [
  "gc.routed_to", "gc.execution_routed_to", "gc.run_target", "gc.outcome",
  "assignee", "gc.session_id", "gc.session_name", "gc.session_affinity",
  "gc.claimed_at", "gc.kind", "gc.synthetic", "gc.step_id", "gc.step_ref",
  "gc.root_bead_id", "gc.root_store_ref", "gc.input_convoy_id", "gc.formula_source", "gc.formula_name",
  "gc.native_step_dependencies.v1", "gc.graphv2_*", "gc.var.*",
  "pin_awake",
  "gc.formula_contract", "gc.work_dir", "gc.work_commit", "gc.work_branch",
  "gc.work_outcome", "work_outcome",
]
# gc.outcome — the terminal disposition a workflow step or bead records: a broad
#   enum whose members include `pass` and `recorded` (a step or verdict that
#   stood), `superseded`, `moot` and `dismissed`, written by the pack component
#   that reached the outcome (claim-close.sh, gc-helm.sh and the done arms), and `canceled`, which gascity's
#   run cancel stamps on every member of a run it ends; read by the done gates
#   and the review graph. gc.routed_to and gc.execution_routed_to are
#   the route stamps (see the ROUTE rule in the preamble). The rest — assignee,
#   the session and claim stamps, the step and root linkage, the poured vars and
#   gc.formula_source, gc.session_affinity (the continuation backstop acts only
#   on a step marked `require`) and pin_awake (settable only by
#   `gc session pin`) — are written by the runtime; the pack reads them and does
#   not write them.
# gc.run_target — a third route stamp beside gc.routed_to and
#   gc.execution_routed_to, written by the runtime: gascity's
#   ReleaseWorkBead re-stamps it as a fallback route on a drained session's work
#   bead it finds otherwise unrouted, so the pool re-offers stranded work. No
#   pack script writes or reads it. Absent or empty means unrouted. A route
#   value, per the ROUTE rule in the preamble. A formula step can also declare
#   it in its step metadata: gascity's sling routes a poured step by its
#   assignee, else by this key.
# gc.formula_name — the formula a workflow root was poured from, stamped by the
#   pour beside gc.kind=workflow. The landing order reads it to tell a review
#   run, a live root of mol-pr-review, attached to a PR's bead by a blocks edge.
# gc.formula_contract — `graph.v2` on a workflow root, stamped by the formula
#   pour beside gc.kind=workflow. orphan-dispose.sh, run-cancel.sh and
#   mol-witness-patrol.toml read it, or gc.kind=workflow, to classify a bead as a
#   workflow root — the runtime's own IsWorkflowRoot test, mirrored in the pack.
# gc.work_dir / gc.work_commit / gc.work_branch — the runtime's work-record
#   keys on a work bead: the worker's checkout, the commit that satisfied the
#   bead, and the branch that commit is on. The gascity binary writes gc.work_dir
#   and gc.work_branch at claim time (hookClaimIdentityPatch), from the claiming
#   worker's checkout. mol-polecat-work's workspace-setup rewrites gc.work_branch
#   with the branch the work is cut on, since the claim stamps the pool
#   worktree's base checkout. The lifecycle writer's transition into `merged`
#   writes gc.work_commit (merged_sha) and gc.work_branch (merged_target) from
#   the landing it records, when that landing names both.
#   mol-refinery-patrol.toml's rework hand-back close writes them from the head
#   it read back from origin and the branch that head is on. The close of an ask
#   an earlier round of the run fixed, by `gctk review passed --record`, writes
#   them from the fix's commit and the PR's branch, which the repair pushed that
#   commit onto from a worktree of the rig checkout. The opt-in
#   packs/gascity-keeper sub-pack's landing check (rebase-landing.sh) writes them
#   from the rebased tip the operator pushed and the branch it landed on, when
#   it closes a landed rebase. bead-rehome.sh
#   reads gc.work_dir and gc.work_commit — with the pack-written bare work_dir
#   defined in merge_identity — as proof a run produced work before a duplicate
#   or fixed-upstream close.
#   The runtime's work-record close gate reads the commit and the branch: a
#   `shipped` close needs gc.work_commit reachable on gc.work_branch in the
#   rig's checkout (warn-only by default). The gate runs git in gc.work_dir when
#   the bead records one, and the pack's worker checkouts are worktrees of the
#   rig checkout, sharing its refs. No pack script reads gc.work_branch, and the
#   runtime's detached-handoff orphan sweep reads the bare branch defined in
#   merge_identity, not this key. Absent means no such product was recorded. A
#   path, a sha, a branch.
# gc.work_outcome — a work bead's self-reported disposition, read as `no-op`
#   (produced nothing) or `shipped` (landed work). Its meaning is the runtime's,
#   like gc.outcome: the runtime's work-record gate checks it when a plain task
#   bead closes, and warns on a missing or unknown value unless
#   GC_WORK_RECORD_ENFORCE makes it block the close. The pack stamps `shipped`
#   from the lifecycle writer's transition into `merged`, from
#   mol-refinery-patrol.toml's rework hand-back close, from the review loop's
#   check (`gctk review passed --record`) closing an ask an earlier round fixed
#   and from the gascity-keeper sub-pack's landing check closing a landed
#   rebase, and `no-op` from these closes of beads that ship no commit of their
#   own: bead-rehome.sh's close of a disposed bead, work-outcome.sh's on a
#   conversation and on the work bead stand-down.sh stops, the refinery's
#   hand-off close in effort-bring-current.sh, reconcile-rig-checkouts.sh's
#   close of a rig's reconcile subject, mol-validate-close,
#   mol-feedback-distiller's pattern close, mol-rig-demo's request close, the
#   gascity-keeper sub-pack's drift-report and rework closes, the
#   observation-filing recipes, the review loop's check closing any other ask
#   the run answered, the landing order's close of a withdrawal it carried out
#   and of a bead a retired PR leaves nothing to do for, and agents by hand.
#   bead-rehome.sh reads it
#   to confirm a no-op origin is disposable, `gctk pr compose` drops a no-op row
#   from a branch's ledger, and each falls back to the legacy bare `work_outcome`
#   alias. Absent leaves the
#   disposition unstated. Never cleared.
# gc.synthetic — "true" on a machine-minted convoy, written by the runtime that
#   mints it. liveness-sweep.sh's machine_convoy test reads it, with the sling-
#   and input-convoy title prefixes, as a signal that a convoy is machine-owned
#   rather than a person's. The pack does not write it. Absent means the convoy
#   is not marked synthetic. A boolean-valued string.
