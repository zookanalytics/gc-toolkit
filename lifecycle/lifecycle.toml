# lifecycle.toml — the declared state space of the anchor lifecycle.
# The anchor state is `status` x `merge_result`. This file is the single source
# of truth: gctk lifecycle, which assets/scripts/lifecycle.sh execs, carries the
# executable copy (services/gctk/internal/lifecycle), and lifecycle.test.sh fails
# on drift.
# Every metadata key the pack writes is enumerated in [metadata]; a key not
# listed here is not pack state (docs/component-model.md §2-§3).

[machine]
# "unanchored" = merge_result ABSENT: not (or no longer) a merge anchor.
states = [
  "unanchored",
  "pre_open_gate",
  "pull_request",
  "merged",
  "abandoned",
  "retargeted",
  "blocked",
  "refused_false_completion",
  "held",
]
# States that also route the bead to a human (lifecycle.sh stamps
# gc.routed_to=human in the same atomic update).
human_states = ["abandoned", "retargeted", "blocked", "refused_false_completion", "held"]
# States the merge cadence drives and no queue offers, so an anchor in one rests
# both unrouted and unheld. lifecycle.sh writes the two halves in the same
# atomic update: it clears gc.routed_to unless --route is given or the bead
# already rests on park_route, and it clears the assignee unless --assignee is
# given, at status=open only. A pool route on one of these is demand for work
# already in the merge queue, and the claim it invites moves the anchor out of
# `--status=open`, where merge.sh and pr-facts.sh both stop seeing it. An
# assignee is the same anchor still sitting in the refinery's own find-work
# queue, which flags a merge_result-bearing bead it finds there and does not
# take it. The assignee clear stops at status=open because bd refuses to take a
# live claim and drops the whole update with it, and because a live claim is a
# hold to escalate rather than one to overwrite.
detached_states = ["pre_open_gate", "pull_request"]
# The one route value that is not a queue. No pool claims it, so it parks the
# bead for a person (docs/gascity-human-engagement.md). A detached state may
# rest on it, and a transition that finds it leaves it alone. Every other route
# is a pool offer.
# A park must NAME what it waits for: writing this route without a gc.takeaway
# is refused, because the helm board spends the takeaway as the row's NEEDS
# sentence and reports a park without one as no question recorded.
park_route = "human"
# States whose legal status is closed; every other declared state is open.
# lifecycle.sh enforces the pairing both ways: --close is accepted only into a
# closed state, and a transition into a closed state must carry --close.
# Entering `merged` additionally requires a non-empty --set merged_sha: its
# meaning is "landed; merged_sha recorded", so it cannot be entered without the
# landing that defines it. The same write records the work record that landing
# gives (gc.work_outcome, gc.work_commit, gc.work_branch; see
# [metadata.runtime_owned]).
closed_states = ["merged"]

# Legal status x merge_result combinations.
[states.unanchored]
status = "open|closed"
meaning = "no merge_result recorded; not a merge anchor (or rejected back to the pool)"

[states.pre_open_gate]
status = "open"
meaning = "branch pushed, checks armed, no PR yet"

[states.pull_request]
status = "open"
meaning = "PR open, awaiting checks + merge"

[states.merged]
status = "closed"
meaning = "landed; merged_sha recorded"

[states.abandoned]
status = "open"
meaning = "PR closed unmerged externally; routed to human"

[states.retargeted]
status = "open"
meaning = "PR base moved externally; routed to human"

[states.blocked]
status = "open"
meaning = "recorded existing_pr unusable; routed to human"

[states.refused_false_completion]
status = "open"
meaning = "no commits on branch; routed to human"

[states.held]
status = "open"
meaning = "a sitting is waiting on an operator decision; routed to human"

# Transitions. Every edge names its writer; the lifecycle writer performs the
# write: gctk lifecycle, which lifecycle.sh execs and gctk merge runs in-process.
# A self-edge (from == to) is always legal: an idempotent re-record.
[[transition]]
from = "unanchored"
to = "pre_open_gate"
writer = "formulas/mol-refinery-patrol.toml merge-push (via lifecycle.sh)"

[[transition]]
from = "unanchored"
to = "pull_request"
writer = "formulas/mol-refinery-patrol.toml merge-push, post-open path (via lifecycle.sh)"

[[transition]]
from = "unanchored"
to = "merged"
writer = "formulas/mol-refinery-patrol.toml merge-push, direct strategy (via lifecycle.sh): FF push verified, record + close in one call"

[[transition]]
from = "unanchored"
to = "blocked"
writer = "formulas/mol-refinery-patrol.toml (existing_pr unusable; via lifecycle.sh)"

[[transition]]
from = "unanchored"
to = "refused_false_completion"
writer = "formulas/mol-refinery-patrol.toml (no commits on branch; via lifecycle.sh)"

# `held` is entered only from `unanchored`. merge.sh, gate-ensure.sh and
# pr-facts.sh each enumerate anchors by their gating state, so moving one here
# to record a conversation would drop it from all three for the hold's length.
[[transition]]
from = "unanchored"
to = "held"
writer = "assets/scripts/converse-hold.sh, a converse sitting's hold (via lifecycle.sh)"

[[transition]]
from = "pre_open_gate"
to = "pull_request"
writer = "assets/scripts/pr-open.sh"

[[transition]]
from = "pre_open_gate"
to = "unanchored"
writer = "assets/scripts/rejection-repool.sh (via lifecycle.sh), run from the rebase and handle-failures arms of formulas/mol-refinery-patrol.toml: a rejection back to the polecat pool, which a fresh mol-polecat-work pour rebuilds. Or formulas/mol-refinery-patrol.toml merge-push (via lifecycle.sh): a rework hand-back leaving the anchor class before it closes landed-on-branch. signoff.sh never transitions the anchor: request-changes clears the marker and files a blocking rework child instead."

[[transition]]
from = "pull_request"
to = "merged"
writer = "assets/scripts/merge.sh; assets/scripts/pr-facts.sh (out-of-band merge record)"

[[transition]]
from = "pull_request"
to = "abandoned"
writer = "assets/scripts/pr-facts.sh"

[[transition]]
from = "pull_request"
to = "retargeted"
writer = "assets/scripts/pr-facts.sh"

[[transition]]
from = "pull_request"
to = "unanchored"
writer = "assets/scripts/rejection-repool.sh (via lifecycle.sh), run from the rebase and handle-failures arms of formulas/mol-refinery-patrol.toml: a rejection back to the polecat pool, which a fresh mol-polecat-work pour rebuilds. Or formulas/mol-refinery-patrol.toml merge-push (via lifecycle.sh): a rework hand-back leaving the anchor class before it closes landed-on-branch. signoff.sh never transitions the anchor: request-changes clears the marker and files a blocking rework child instead."

[[transition]]
from = "abandoned"
to = "unanchored"
writer = "human"

[[transition]]
from = "retargeted"
to = "pull_request"
writer = "human (base repaired; re-engage the merge queue)"

[[transition]]
from = "retargeted"
to = "unanchored"
writer = "human"

[[transition]]
from = "blocked"
to = "unanchored"
writer = "human"

[[transition]]
from = "refused_false_completion"
to = "unanchored"
writer = "human"

[[transition]]
from = "held"
to = "unanchored"
writer = "assets/scripts/converse-signoff.sh, the ruling landed (via lifecycle.sh); or human"

[gates]
# check_set: comma list of check names on the anchor. Default stamped by
# gate-ensure.sh when absent/empty; sentinel "none" is an explicit opt-out.
# Triage widens it (signoff.sh --add-gates), and bring-current-guard.sh adds
# triage to a set that lacks it when a bring-current round conflicts, so triage
# rules on every such round. Neither widens the none or off opt-out, which only
# a person changes: on one, the guard lifts the approval itself.
check_set_default = "correctness,triage"
check_set_sentinel = "none"
# A lane's state is derived from its reviews (lane-state.sh) and never stored on
# the anchor. Merge requires every declared check to derive green.
# docs/state-machine.md holds the lane vocabulary.
# Approval is a UNIVERSAL merge rule, not a check_set member: merge.sh requires
# every PR to carry a latest APPROVED review by an account other than the city's,
# standing across later pushes until it is dismissed, with a standing
# CHANGES_REQUESTED from any other account a veto. A dismissed review is dropped
# before each reviewer's latest is taken, so it neither approves nor vetoes, and
# it does not hide its author's older approval. Once a ruling on a bring-current
# round lifts the approval, no approval submitted at or before the anchor's
# bring_current_lifted_at counts, dismissed or not. No check_set token arms or
# opts out of it; GitHub branch protection is an
# extra layer, not the authority. Declaration only, like the rest of this
# section (the rule lives in gctk merge's reviewVerdict, and in
# review-verdict.sh for the shell readers).
approval_rule = "universal-nonself-standing"

# The hold markers: the metadata a live bead carries to say it is not moving.
# I1 holds that a hold is a `blocks` edge to a live bead in the same store, so
# each key below records a hold the graph cannot answer, and a live bead
# carrying one with no such blocker is what doctor/check-wait-is-an-edge
# reports. The check reads this declaration instead of carrying its own list,
# so a marker added here is asserted without a code change. A hold is a KEY,
# never a sentence: prose is where a conclusion is recorded beside the edge,
# and reading it for holds would make prose a hold carrier again.
[holds]
# Present with a non-empty value, and the bead is held, whatever it says.
marker_keys = ["triage.hold", "blocked_reason", "gc.takeaway"]
# A marker its own writer can answer, as `<marker>=<settled-key>`: <marker>
# holds only while <settled-key> is absent or empty on the same bead.
# gc.takeaway is stamped by every sign-off, the one that settled its subject as
# much as the one that parked it for a person, and only the writer knows which
# it was — `gc-helm.sh takeaway --no-wait` says so by stamping
# gc.takeaway_settled beside the headline, and a takeaway without it is a hold.
# Nothing here clears a marker: the sentence stands and the second key records
# the disposition beside it. Every writer of a marker in this list writes its
# settled-key in the same statement, empty unless it means settled, so a stamp
# cannot inherit the disposition of the sitting before it
# (assets/scripts/takeaway-settled-pairing.test.sh).
settled_keys = ["gc.takeaway=gc.takeaway_settled"]
# merge_hold is not a marker_key: an operator's freeze is theirs to lift, and a
# hold that must show as an edge asserts it through blocked_reason or
# gc.takeaway beside it, both declared above, which carry the wait's sentence.
# The route that parks a bead for a person is park_route in [machine]. A bead
# resting on it waits on somebody, and that wait has the same shape as any
# other.
route_key = "gc.routed_to"
# The terminal end of a wait carries this key: the bead others block ON, which
# by construction can hold no `blocks` edge of its own. gc-helm.sh stamps
# gc.demand_for=<gated> on the demand it files — the gated bead blocks on the
# demand, and the demand blocks on nothing — so the demand is exempt from I1
# rather than a permanent unedged finding. Leaving this line out disables the
# exemption; the check reads an omitted field as one the declaration dropped.
terminal_wait_key = "gc.demand_for"
# How doctor/check-wait-is-an-edge reports a marker with no live blocker.
# "warn" while a backlog of marker-only holds is still being converted to
# edges; "error" once none are left. The posture is declared here rather than
# compiled into the check, so ending the conversion is this line, and so it is
# readable beside the markers it governs.
#
# A finding converts two ways, and neither blanks a marker: the wait it names
# becomes a `blocks` edge on the same store, or — where nothing is waiting —
# its writer re-stamps it with the settled-key. The second is what keeps this
# posture reachable, because a ritual that stamps a marker on every sign-off
# regenerates the population faster than closes drain it.
hold_severity = "warn"

[posture]
# What the PR is doing, recorded on the anchor by pr-facts.sh. pr_posture is a
# dated key, `<value>@<oid>@<since>`: a required posture — review_required, or a
# standing changes_requested once the cadence has run dry — is a cause of an owed
# row, so the instant the requirement was first read at this head is what orders
# that row in the operator's queue. pr_merge_state keeps a plain
# `<value>@<oid>` shape — nothing queues on it. merge.sh
# reads these off the bead; nothing else re-derives them from GitHub.
posture_key = "pr_posture"
# The pack's own vocabulary, lowercase, derived in this precedence order: a
# standing CHANGES_REQUESTED outranks an unanswered comment, which outranks an
# approval — one reviewer's approval does not answer another reviewer's
# question. An approval the anchor's bring_current_lifted_at set aside reads
# review_required, because the merge no longer counts it. "none" is a PR no
# reviewDecision applies to.
postures = ["changes_requested", "commented", "approved", "review_required", "none"]
# GitHub's mergeStateStatus, recorded verbatim and uppercase: the vocabulary is
# GitHub's, and a value it adds next year must read as GitHub's, not as ours.
merge_state_key = "pr_merge_state"
# The watermarks separate a comment already routed from a new one. Each is the
# highest id routed in its own id space, and advances only after the routing
# reads back, so a comment nothing answered cannot fall below the mark. Three
# spaces, never merged: a reply can land on an old review, and a Conversation-tab
# issue comment draws ids from a range unrelated to either, so no one space
# stands in for another.
comment_watermark_key = "pr_comment_watermark"
review_watermark_key = "pr_review_watermark"
issue_comment_watermark_key = "pr_issue_comment_watermark"
# What the watermarks count is feedback: every review, inline comment and
# conversation comment that is not the city's own post, whoever wrote it. The
# city's own post carries the mark pr-post.sh appends, or is an unmarked post
# under the city's login from before this instant (UTC, YYYY-MM-DDTHH:MM:SSZ),
# when its posts did not yet carry one. pr-facts.sh stamps it the first time it
# reads the open PR; absent or malformed, every post under the city's login is
# the city's own.
provenance_since_key = "pr_provenance_since"
# What the outstanding comments were routed to: "rework:<bead-id>" (a fix-pool
# child, whatever holds the anchor) or "visit:<bead-id>" (nowhere to route work:
# no fix pool, or the PR head branch unresolved). Either holds the merge until it
# closes — the child through a blocks edge, the visit through the pr_number stamp
# merge.sh's in-flight-holder probe reads. A visit takes no blocks edge:
# escalate.sh files it depending on its subject, so an edge back would be a
# cycle.
disposition_key = "pr_comment_disposition"

[machine_axis]
# What the merge cadence can do with this anchor on its next pass, recorded by
# whichever stage reached the verdict. Every stage already computes it once per
# pass and prints it to a log; this key is where the answer is kept, so a reader
# never re-implements two scripts' predicates to learn it.
machine_key = "pr.machine"
#   progressing       some automated actor will act — a pool-routed blocker is
#                     open, or a declared lane is short of green
#   settled           every declared check reads green; the cadence
#                     is done and the PR waits on approval, on the merge pass,
#                     or on nothing
#   blocked           the merge cannot proceed without a person, and no review
#                     verdict is what it waits on: a required review thread is
#                     unresolved, the base has gone BEHIND, or an unrouted
#                     blocker no automated actor will clear holds it. Distinct
#                     from settled — which waits on a review or the merge pass —
#                     so the board can show it as needs-attention rather than
#                     awaiting-review. The specific cause rides pr.machine_reason.
machines = ["progressing", "settled", "blocked"]
# Written from pre_open_gate onward, before a PR number exists: gate-ensure.sh
# reaches a pre-open anchor's verdict on the same pass as an open one's.
writers = "assets/scripts/gate-ensure.sh (via lifecycle.sh), assets/scripts/merge.sh (gctk merge, through the lifecycle writer it runs in-process)"

[conversation]
# Where the exchange with the operator stands, recorded on the anchor by
# pr-facts.sh against the [posture] watermarks. A dated key,
# `<value>@<oid>@<since>`: it is head-pinned so a value read before the branch
# moved on never reads as current, and the board's board.prConversation gates it
# on the pr.machine head the same way the approval clause gates the posture.
conversation_key = "pr.conversation"
# The values pr-facts.sh records, derived from the watermarks and the routing
# disposition each pass:
#   quiet        no human utterance in any of the three id spaces — and a pre-open
#                anchor, where no PR yet exists to speak on
#   outstanding  a human utterance sits above its space's watermark, or a batch
#                routed to a fix unit that has not closed yet — the city still
#                working it, the coarser truth, never collapsed into quiet
#   answered     the routed fix unit has closed — a rework child when its branch
#                lands, a visit when a person resolves it — so the city's reply is
#                there to look at. A head move alone is not answered: a merge-in of
#                the base or an operator push leaves the fix unit open.
# The position re-derives from the disposition, which lands in the same
# transition as the watermark it routes past, so a routed batch survives a
# dropped conversation write; an anchor with no disposition and no recorded
# position stays unknown until a new utterance.
# asking is NOT here: it is the demand edge, read from the graph with no key of
# its own. covered is NOT here: it waits on a comment-to-bead link nothing
# records yet, so an utterance the city works reads outstanding until then.
conversations = ["quiet", "outstanding", "answered"]

[dated_keys]
# Keys in the shape <value>@<oid>@<since>. The queue the helm board renders is
# ordered by how long a row has been owed, so a cause of an owed row has to
# carry the instant its turn began. Head-pinned causes keep it inside the value
# rather than in a key beside it: a timestamp that can be written when the value
# is not ends up dating a state that no longer holds, with nothing in either key
# saying so.
keys = ["pr.machine", "pr.conversation", "pr_posture"]
# lifecycle.sh --set-dated is the only writer, and it applies one rule: preserve
# the existing instant while the value and the oid both hold, stamp the current
# one when either differs. Set, preserve and clear all fall out of it — the
# reconcile cadence re-deriving the same verdict at the same head leaves the
# instant alone, and a head move arrives with a fresh one no owed row reads.
since_format = "RFC 3339 UTC"

# The metadata-key registry: every key the pack writes, grouped and defined. A
# key absent from the groups below is not pack state (docs/component-model.md
# §2-§3), and doctor/check-state-space flags a bead carrying a key whose writer
# was retired (its HEALER_RE and RETIRED_KEYS lists; retiring a key adds it
# there). Each key's definition names five things a reader needs and only
# two of which the value shows: what WRITES it, what READS it, what its ABSENCE
# means, how it is CLEARED, and its value TYPE. Prose is spent where a reader
# cannot recover those from the group and the sections above; a key whose
# mechanics already sit in [gates], [posture], [holds], [machine],
# [machine_axis] or [dated_keys] is defined there and only registered here.
#
# Four field-vocabulary rules the whole registry rests on, each settled against
# the code that reads it:
#
# ROUTE. On a bead making a lifecycle transition, gc.routed_to is written by
# lifecycle.sh --route in the same atomic update as the --to edge, and a direct
# --set of the key is refused there, so a transition-coupled route cannot bypass
# it. Routes on beads outside that state machine — a bead with no --to edge for
# --route to carry — are stamped directly with gc bd update --set-metadata by
# whichever script or formula owns that bead's dispatch. The recurring shapes: an
# escalation or visit routed to its handler pool or parked to `human`
# (escalate.sh, gc-helm.sh, mol-visit.toml, mol-feedback-distiller.toml); a
# reaction bead routed to the proactive pool (gc-proactive.sh); a rework child
# routed to its fix pool (pr-facts.sh, pre-open-rebase.sh); a review
# bead's pool route restored after an abandoned round (mol-review.toml). A route
# value is a rig-qualified pool identity (<rig>/<agent>) or
# the park sentinel `human` ([machine] park_route); the pool
# offer is exact byte equality (gascity hookClaimMatchesRoute), so a bare,
# unqualified or padded value matches no pool and doctor/check-routed-work-
# claimable reports it. Absent and empty mean the same thing — unrouted — and
# every reader treats them alike; clearing a route writes "" or unsets the key.
# Empty is NOT a park: an open, unassigned bead with an empty route is a
# re-routing candidate that pr-facts.sh's stranded-rework rescue re-stamps, so a
# park is the `human` sentinel, and lifecycle.sh refuses to write it without a
# gc.takeaway.
#
# ASSIGNED vs ROUTED. Both may be set, and on a claimed pool bead both are: a
# claim writes the assignee and leaves the route as the record of which queue
# offered the bead, and every route reader — the claim predicate included —
# asks about the route only while the bead is unassigned. A handoff to a NAMED
# agent clears the route; a pool route left on directly-assigned work reads as
# demand for work no pool is offered.
#
# THE OPERATOR-FACING QUESTION is gc.takeaway. The helm board spends it as the
# row's NEEDS sentence, so lifecycle.sh refuses to park a bead for a person
# (--route human) without one, and a park with an empty takeaway renders as
# "routed to you — no question recorded".
#
# A WAIT IS AN EDGE, never a metadata string (I1, doctor/check-wait-is-an-edge):
# `blocks` is the one edge type bd ready honors as a hold. `parent-child` is
# decomposition that cascades the parent's blocked state DOWN to its children,
# so the pack attaches a visit, a demand or a finding with `tracks` — which
# carries the structure without making the child unclaimable — and reserves
# parent-child for decomposition that should inherit the block. A `*_key` value
# (finding.key, escalation_key, gc.blocker_key, upstream_send_key) is a dedup
# identity for finding the one existing bead per cause, not a wait; any wait it
# carries is a separate blocks edge.

[metadata.merge_identity]
keys = [
  "branch", "target", "merged_target", "merged_sha", "pr_url", "pr_number",
  "existing_pr", "merge_strategy", "merge_result", "prepare_mode",
  "rejection_reason", "graduation", "blocked_reason", "work_dir",
  "false_completion_suspected", "branch_ready", "halt_reason", "auto_push",
  "pr_summary", "merge_record_failures", "fold_target", "artifact_url",
  "opened_as_draft", "draft_readied",
  "bring_current_from", "bring_current_scope", "conflict_audit", "conflict_question",
  "bring_current_record", "bring_current_reopened", "bring_current_round_at",
  "bring_current_lifted_at",
]
# merge_result is the anchor state itself and is defined in [machine] / [states]
# above: lifecycle.sh is its only writer (set on every transition, unset on
# `--to unanchored`), absent reads as `unanchored`, and its value is one of the
# declared states. Every other key here is a string unless noted.
#
# branch — the source branch the refinery merges, exactly. The polecat's
#   workspace-setup writes it on the anchor; pr-facts.sh writes it on a rework
#   child (the branch that child reworks). Read by merge.sh (the live head must
#   match it), pr-open.sh, pr-facts.sh and gate-ensure.sh. Absent leaves those
#   checks unarmed and pr-open skips the anchor. The gc runtime's
#   detached-handoff orphan sweep reads it too: it restores the pool route on an
#   open, unassigned, unrouted bead only when the bead carries branch and a
#   session pin (gc.session_id or gc.session_name). Never cleared. Shape
#   `polecat/<bead-id>` for fresh work.
# target — the landing branch the work merges into: the polecat records it at
#   submit, the refinery stamps it on a rework child (pr-facts.sh,
#   pre-open-rebase.sh, signoff.sh), and convoy-graduate.sh writes it on
#   graduation. Read two ways — as the fallback alias for merged_target before a
#   PR opens (pr-open.sh, gate-ensure.sh, both defaulting to the rig's default
#   branch when both are absent), and directly as the landing branch by the
#   polecat's submit target-resolve (mol-polecat-work.toml), the refinery's
#   prepare and merge-push (mol-refinery-patrol.toml), the pre-open review base
#   derived from the anchor (mol-review.toml), and signoff.sh verifying a rework
#   child. Absent, the merged_target readers fall through to the default branch
#   and submit falls back to base_branch. Never cleared. A branch name.
# merged_target — where the PR actually lands, resolved onto the anchor when the
#   PR opens (pr-open.sh) and read by merge.sh, pr-facts.sh and gate-ensure.sh to
#   catch a base moved out from under a validated PR. Absent falls back to
#   target then the default branch. Never cleared.
# merged_sha — the merge commit recorded at close, by merge.sh and pr-facts.sh
#   (record-failure-cap.sh writes it by hand). I5 forbids an empty one, so a
#   record that cannot read the oid writes the sentinel `unverified:PR#<n>`
#   rather than nothing. Not read back; never cleared.
# pr_url / pr_number — the open PR, written when it opens (pr-open.sh) and copied
#   onto rework children and visits by pr-facts.sh. merge.sh and pr-facts.sh read
#   them to bind a bead to its live PR; a non-numeric pr_number is skipped, and an
#   unparseable pr_url resolves to the fail-closed repo `?`. Never cleared.
#   pr_number is an integer; pr_url is the canonical `scheme://host/owner/repo/pull/<n>`.
# existing_pr — a PR the refinery should reuse rather than open. pr-facts.sh
#   stamps it on a rework child equal to that child's pr_url and signoff.sh on
#   the child it files; the refinery's rejection transition carries it through
#   (mol-refinery-patrol.toml). Read by mol-refinery-patrol.toml to force the PR
#   pipeline when set (merge_strategy flips to mr) and to count the bead
#   PR-shaped, and by signoff.sh to verify a rework child's pr_fields. Absent
#   means no PR to reuse. Never cleared. Value is a PR URL.
# merge_strategy — how the refinery lands the branch. mol-refinery-patrol.toml
#   resolves it once, in its merge-strategy-resolve block: `mr` opens and merges
#   a PR, `direct` fast-forwards and pushes straight to the target, and `pr` is
#   an alias normalized to `mr` on read. An absent key resolves to the
#   default_merge_strategy var (default `mr`); an empty value resolves to
#   `direct`. `mr` is stamped by pr-facts.sh, signoff.sh, convoy-graduate.sh,
#   pre-open-rebase.sh and mol-feedback-distiller.toml,
#   and existing_pr forces the resolved mode up from `direct` at the refinery.
#   A target under `polecat/` (another bead's per-bead PR head) carrying no PR of
#   its own resolves the other way, from `mr` down to `direct`, so the branch
#   folds onto that PR head instead of opening a nested PR against it.
#   `pr` is written only by mol-refinery-patrol.toml, auto-promoting a bead whose
#   direct push was rejected for branch protection into the PR pipeline. Read by
#   mol-refinery-patrol.toml and signoff.sh. Never cleared. Enum `mr | pr | direct`.
# prepare_mode — how the refinery brings a rework branch current before it lands.
#   Every branch shape (per-bead `polecat/*`, shared `integration/*`, a
#   graduation) is stamped `merge`: the branch is brought current by merging
#   origin/<target> in, never rebased, so no shape is rewritten or force-pushed.
#   Written by pr-facts.sh, pre-open-rebase.sh and mol-refinery-patrol.toml. The
#   prepare and resume paths merge the target in whatever the stamp says; an
#   absent value resolves to merge too, so a dropped stamp cannot select a
#   rewrite. A dispatch site reads the stamp back and routes a child only once it
#   sticks, and pre-open-rebase.test.sh holds both dispatch sites to `merge`.
#   Never cleared. Enum `rebase | merge`; only `merge` is stamped.
# rejection_reason — why the last attempt bounced, embedding `head <oid>` so a
#   later pass can tell which head it spoke for. Written by the refinery
#   (pr-facts.sh, signoff.sh, pre-open-rebase.sh, mol-polecat-work.toml); read at
#   load-context to resume rather than redo, and by pr-facts.sh to dedup a child
#   already covering a head. Cleared with `--unset` by the refinery's
#   merge-push in each transition it makes on a hand-back (merged, unanchored,
#   pre_open_gate, pull_request), and by the polecat once the merge its resume
#   runs concludes. A stop before then, such as a question for a person, leaves
#   it, so the bead's next run resumes again. Freeform instruction text.
# graduation — `true`, set on the convoy bead by convoy-graduate.sh when an
#   integration branch is carried to the default branch. prepare_mode is `merge`
#   for every branch shape, so this flag does not change how the branch is
#   brought current. Never cleared.
# blocked_reason — the human-readable reason an anchor sits in a human state
#   (existing_pr unusable, a PR closed or retargeted out of band). Written by
#   pr-facts.sh; it is also a [holds] marker, so a live bead carrying it owes a
#   blocks edge. Freeform.
# work_dir — the polecat's per-bead git worktree, an absolute path, written by
#   workspace-setup so a restart or witness recovery can find the work in flight.
#   Absent means no worktree is recorded yet. Never cleared. Absolute path.
# false_completion_suspected — the reason mol-refinery-patrol.toml refused to
#   close a branch as merged when it carried no verified change against its
#   target; written on the `refused_false_completion` transition for a person to
#   read. Freeform reason.
# branch_ready / halt_reason / auto_push — the auto_push=false halt. auto_push is
#   a caller input the submit step reads; when it is false the polecat records
#   branch_ready=true and halt_reason=auto_push_false and stops without pushing or
#   handing off. halt_reason=store_only marks the other halt, a run whose whole
#   product was store work. Absent auto_push means the normal push-and-hand-off
#   path. Not cleared — the halt is terminal for that run. auto_push and
#   branch_ready are boolean-ish; halt_reason is `auto_push_false | store_only`.
# pr_summary — the polecat's account of what the diff does, stamped on the anchor
#   at submit and rendered as the PR's `## Summary` by pr-open.sh, which falls
#   back to the dispatch text and then a generic line when it is absent or blank.
#   Never cleared. Freeform markdown.
# merge_record_failures — consecutive failures to record a merged PR on this
#   anchor. merge.sh and pr-facts.sh both perform that record and both retry
#   every pass with no memory, so the count is the only thing that can tell a
#   store busy for a tick from a refusal no later pass will clear. An integer
#   written by record-failure-cap.sh (absent reads as 0), cleared with `--unset`
#   by the record that lands.
# fold_target — the branch a bead's work was folded directly onto, stamped by
#   the polecat that folds one bead's fix onto another's branch instead of
#   opening its own PR. pr-stack.sh reads it (`--metadata-field fold_target`) to
#   count that bead in the branch's PR-body ledger as work already on the branch.
#   No pack script writes it. Absent means nothing was folded. Never cleared. A
#   branch name.
# artifact_url — the delivered artifact a rework fix unit lands instead of a
#   commit, the sibling of merged_sha for a unit that lands no commit.
#   demo-deliver.sh writes it on the fix unit (task_kind=rework) when it attaches
#   a demo to the PR and closes the unit in the same write, recording the attached
#   comment's URL as the delivery evidence. pr-facts.sh's write-back reads it to
#   cite that URL when it resolves the finding's thread, rather than a head commit
#   the artifact never made. Absent means the fix unit lands a commit, cited at the
#   PR head as usual. Never cleared — it is the closed unit's durable evidence. A
#   comment URL.
# opened_as_draft — the head oid a PR was opened (or adopted) as a draft at,
#   because its check_set names an `open-as-draft` check that gates the
#   draft->ready flip. pr-open.sh writes it on the pull_request transition: on a
#   draft it created, or on an adopted draft only when the city's own login
#   authored it and its timeline carries no conversion to draft. Its PRESENCE is
#   what tells the draft-to-ready arm this is a draft the refinery owns the flip
#   of (not an operator's manual draft or re-draft), and tells gate-ensure.sh
#   and services/gctk/prstatus (the status: label and the board's PR phase) the
#   anchor is still in the open-as-draft stage. Absent means the PR opened ready,
#   or is a draft someone else owns. Never cleared. An oid.
# draft_readied — the head oid a PR was read ready at (pr-open.sh): the head the
#   draft-to-ready arm flipped it at, or the head it already read ready at,
#   whatever holds the anchor. Its PRESENCE stops that arm re-reading the PR
#   every pass and stops it ever re-flipping a PR an operator later re-drafted,
#   and tells gate-ensure.sh and services/gctk/prstatus the anchor reached the
#   ready-for-review stage. Absent means the arm has not read it ready. Never
#   cleared. An oid.
# bring_current_from — the PR head a rejected-branch resume started from,
#   written by mol-polecat-work.toml's resume block before it merges the target
#   in. bring-current-guard.sh reads it at submit as the start of the round, so
#   a session that re-runs the handoff after the push still reads the whole
#   round. Absent, the guard starts from the origin head it read before the push,
#   and refuses a hand-off that pushed nothing past it until the worker stamps
#   it, with bring_current_scope beside it. Never cleared; the next resume
#   overwrites it. An oid.
# bring_current_scope — whether bringing the branch current is the resumed
#   bead's whole job: merge-only for a conflict or stale-base rejection, else
#   with-work. Written by the resume block beside bring_current_from, and as
#   with-work by a worker whose hand-off the guard refused for recording no
#   start. On a merge-only bead the guard counts a commit of the bead's own as
#   an edit beyond the merge, which owes an audit entry. Absent reads as
#   with-work; absent beside a bring_current_from stamp, it marks a resume
#   step that asks for no audit, so the round owes no entries.
# conflict_audit — the worker's audit of the round, on the bead it holds: a
#   JSON array of {path, collided, resolution, check, rating}, one per item the
#   guard names, rating routine or judgment. Written by bring-current-audit.sh
#   add; cleared by the resume block when a round starts.
# conflict_question — the conflict a worker could not resolve without
#   guessing: {paths, collided, question}. Written by bring-current-audit.sh
#   ask, which files the visit that asks it; cleared when a round starts.
# bring_current_record — the anchor's record of its latest bring-current round
#   (bring-current-guard.sh guard): the head, the start, the target, the class
#   (clean or conflicted), the guard's evidence per item, the worker's audit,
#   and the round's ruling once made: triage's (bring-current-guard.sh decide,
#   run by signoff.sh), or one the guard recorded itself, marked by=guard,
#   which a re-run of the same hand-off carries out again. A conflicted round
#   no ruling covers yet is carried into the next round's record. Every message
#   about a round renders from it. A JSON object, overwritten each round.
# bring_current_reopened — the lanes the anchor's conflicted rounds reopened:
#   triage, written by the guard, and the lanes triage's rulings reopened or
#   added. lane-state.sh lets no GitHub approval submitted before
#   bring_current_round_at back one of these lanes. A comma list that only
#   grows.
# bring_current_round_at — when the latest conflicted round was recorded (UTC,
#   ISO 8601), written by the guard with that round's record.
# bring_current_lifted_at — the round time of the latest conflicted round whose
#   ruling lifted the human approval (UTC, YYYY-MM-DDTHH:MM:SSZ; the ruling's
#   own time when the round recorded none). Written by bring-current-guard.sh
#   once a ruling to lift the approval is recorded, by decide for triage's and
#   by guard for one it recorded itself, and read back before any approval is
#   dismissed; it never moves back. The approval rule
#   counts no approval submitted at or before it: gctk merge's reviewVerdict
#   at the merge's approval gate and in its visit order, whose terminal re-read
#   holds a merge when the line moved after validation, and review-verdict.sh
#   in pr-facts.sh's conflict arm and posture arm, which records such an
#   approval as review_required and keeps the line in the posture's basis. So
#   an approval GitHub would not let the guard dismiss still lands nothing, the
#   board shows the approval owed, and one submitted after it lands the PR.
#   A later round whose ruling keeps the approval leaves it as it is. Absent
#   means no ruling lifted the approval. Never cleared.

[metadata.gates]
keys = [
  "check_set", "signoff_dismissed", "approval_dismissed",
  "signoff_verdict", "visual", "visual_fallback_from",
  "check_name", "anchor_bead", "review_branch", "review_base", "reviewed_oid",
  "review_pr_url", "review_pr_number",
  "review_pool", "source_review_bead", "source_ruling_bead", "source_review", "task_kind",
  "fix_target_pool", "wedge_seen_root",
]
# check_set carries its mechanics in [gates] above: the comma list of check
# names (default `correctness,triage` stamped by gate-ensure.sh when empty,
# sentinel `none` the opt-out), and empty is never `none` — a reader holds the
# merge closed on it.
#
# signoff_dismissed — `<github-review-id>@<oid>`: a stale GitHub review the city
#   dismissed at that head. Written by signoff.sh and pr-facts.sh, each reading it
#   back before the irreversible dismissal, so no dismissal goes unrecorded. A
#   record only: no gate reads it, since approval is a universal merge rule that
#   no dismissal arms or relaxes. Never cleared.
# approval_dismissed — on a validation-pass bead, the outside approvals that
#   pass dismissed when it ruled a fresh whole-diff review warranted: the GitHub
#   review ids, comma-separated. A lone id can read back as a number, so a
#   reader compares it with tostring. Written by approval-withdraw.sh and read
#   back before it notes the judgment on the anchor and before the first
#   irreversible dismissal. A retry of the same pass reads it and dismisses only
#   those reviews, so it never dismisses an approval given after them. Absent
#   means the pass dismissed nothing: it converged, or no approval stood. Never
#   cleared.
# signoff_verdict — the review verdict, `approve` or `request-changes`, written
#   in the same write that closes the review bead (signoff.sh's closing update;
#   review-outcome.sh writes `approve` in the create that files a back-lane
#   outcome already closed). lane-state.sh derives a lane green
#   from a closed review carrying `approve` with a non-empty reviewed_oid and a
#   non-superseded gc.outcome; doctor/check-gate-marker-provenance audits the
#   same shape. A closed review with no signoff_verdict, such as a legacy review
#   closed before the stamp existed, backs no lane locally. signoff.sh stamps
#   gc.outcome=recorded on every close, approve and request-changes alike, so
#   recorded names no verdict. A lane resting on such a close is green only on
#   an APPROVED GitHub review (lane-state.sh github_approved). Never cleared;
#   set once.
# visual — the demo check's visual decision: `none` when the change needs no
#   visual, else the modality that conveys it (`repo-artifact`, `screenshot` or
#   `video`). Written by signoff.sh on a `demo` review bead in the same update as
#   reviewed_oid, and read back before the verdict posts; signoff.sh refuses it
#   on any other check. A record only: no gate reads it, and the posted verdict
#   names it on a `Visual:` line, where `repo-artifact` reads `author-committed`.
#   Absent means signoff.sh recorded no demo verdict on the bead: another
#   check's review, a demo review closed without a verdict, a lane backing
#   review-outcome.sh wrote, or a review closed before the stamp existed. Never
#   cleared. One of those four values.
# visual_fallback_from — on a demo review bead whose delivered visual stands in
#   for the modality that fits, because that one could not be produced: the
#   modality that fits, `screenshot` or `video`, always costlier than `visual`.
#   Written by signoff.sh in the same update as visual and read back before the
#   verdict posts. A demo verdict that names no fallback clears it in that
#   update, so a retried verdict never keeps an earlier attempt's. A record
#   only: no gate reads it, and the posted verdict names it on the `Visual:`
#   line as `fallback from <modality>`. Absent means the demo verdict delivered
#   or named the modality that fits, recorded none, or was never given.
# check_name — the lane a review or backing bead speaks for, defaulting to
#   `correctness` when absent. Written on the review child by gate-ensure.sh and on a
#   backing outcome by review-outcome.sh; read by signoff.sh, lane-state.sh and
#   the provenance check. Never cleared.
# anchor_bead — the gating anchor a review, rework, finding, validation or visit
#   child names; the key is what makes it a child. The child also has an edge
#   onto the anchor, its membership edge, of any type. bd keeps one edge per
#   ordered pair, so an edge the pair already carries is the membership edge.
#   A visit whose subject is the anchor is usually joined by the `tracks` edge
#   escalate.sh puts from the visit onto its subject. A pair with no edge is
#   joined with `related`. A reader enumerates the live children by
#   `--metadata-field anchor_bead=<id>`, and the closed ones through that edge
#   (every dependent of the anchor, whatever the edge's type)
#   once the store is marked joined (bd-lib.sh bd_anchor_children). Written by
#   gate-ensure.sh, finding.sh, review-outcome.sh, signoff.sh, rework-child.sh,
#   pr-facts.sh, pre-open-rebase.sh and visit-close.sh, each on a child joined to
#   the anchor no later than the stamp. A review, rework, finding or validation
#   child carries it from the create that files it
#   (tools/lint-learned.d/create-then-stamp.sh holds that); pr-facts.sh stamps it
#   onto the visits escalate.sh files for a feedback batch it cannot route and
#   for unengaged review threads. Empty on an open child of a producer's own
#   title, it marks one an earlier two-write create left behind: gate-ensure.sh,
#   signoff.sh and pr-facts.sh close such a child before they file its
#   replacement (bd_unmake_orphans in bd-lib.sh), and pr-facts.sh's red-check
#   arm adopts one. On a review bead signoff.sh falls back to the up `blocks`
#   edge and refuses the verdict if none resolves. Never cleared. A bead id.
# review_branch / review_base — the branch under review and its base, stamped on
#   the review child by gate-ensure.sh; read by signoff.sh as the fallback when
#   the anchor names no branch or no landing target. Never cleared. Branch names.
# review_pr_url / review_pr_number — the anchor's open PR, stamped on the review
#   child by gate-ensure.sh when the anchor is a pull_request, both or neither;
#   mol-review pins its gh calls to them. They are not pr_url / pr_number, which
#   gc-helm.sh resolves a PR number by, so a live review does not make its PR
#   ambiguous. Never cleared. A PR URL and its number.
# reviewed_oid — the head a review pinned, and the head a green backing vouches
#   for. Written by gate-ensure.sh (only when the head resolves), signoff.sh and
#   review-outcome.sh. signoff.sh reads it as the dispatch pin; lane-state.sh and
#   the provenance check treat a backing with no reviewed_oid as greening
#   nothing. Cleared with `--unset` only on signoff.sh's gone-pin path. A
#   lowercased git oid.
# review_pool — the pool a lane's review dispatches to, written on the review
#   child by gate-ensure.sh, which reads it back (falling back to
#   gc.execution_routed_to) to repair a wedged lane. Never cleared. A pool name.
# source_review_bead / source_review — which feedback a rework child answers, in
#   two id spaces that cannot share a key. rework-child.sh stamps
#   source_review_bead = the review BEAD signoff.sh files the child for, and
#   gate-ensure's already-answered probe counts a child by that key. pr-facts.sh
#   stamps source_review = the comma-joined GitHub review ids whose bodies its
#   child carries verbatim, a comment batch rather than a signoff round.
#   Neither is cleared.
# source_ruling_bead — the visit a ruling-sourced rework child answers, the
#   analog of source_review_bead for an operator ruling rather than a review
#   verdict. rework-child.sh stamps it = the visit converse-rework.sh names, the
#   one the sitting reached the ruling in. A child rework-child.sh files carries
#   source_review_bead or source_ruling_bead, never both, and the writer dedups
#   a second child against that key. gate-ensure's quiescence probe counts a
#   live child by either key, and duplicate-sweep.sh's twin pass pairs a
#   never-dispatched child with a landed sibling by either key. The finding
#   lanes' fix-unit readers (finding.sh, liveness-sweep.sh) take no child
#   carrying source_ruling_bead: it answers the ruling, not a finding. Not
#   cleared.
# task_kind — the bead's role, the one field a reader decides a kind from (I12);
#   every writer of a kind also sets the matching label. Its vocabulary across
#   the pack: `review` (a review dispatch, and the approve outcome that backs a
#   lane green), `rework` (a fix unit answering a verdict), `finding` (a review
#   objection, [metadata.review_findings]), `validation` (a validator pass,
#   mol-validate.toml), `visit` (a human engagement), `triage-subject` (an
#   ephemeral-findings bucket), `observation`/`feedback-pattern`/`prompt-update`
#   (the learning loop), and `upstream-send` (a parked outbound command). Set
#   once at creation; not cleared.
# fix_target_pool — the pool a rework fix unit routes to, written on the review
#   child by gate-ensure.sh when a fix pool is configured; read by signoff.sh,
#   which defaults it to `<rig>.polecat`. Never cleared. A pool name.
# wedge_seen_root — the workflow root gate-ensure.sh last saw spent (every step
#   closed but the finalizer) while the review it drives has no verdict and no
#   route, stamped on that review bead so a wedge gets one quiet pass before it
#   escalates; a differing or absent value is the first sighting. A root bead id.

[metadata.review_findings]
# A finding is a review objection with an identity of its own, so it outlives
# the commit oid a rebase destroys and one objection cannot be filed twice.
# task_kind=finding names the bead; anchor_bead (declared under [metadata.gates])
# names the gating anchor. The interlock a finding places on its anchor is a
# graph edge, not a key here: the disposition picks the edge type, so no clause
# below is a hold marker [holds] would demand an edge for. finding.key is a
# shared prefix with the patrol findings in [metadata.patrol_findings]; the two
# families are distinguished by task_kind (finding here, a patrol bead there),
# and finding.lane/disposition/source belong only to the review family.
keys = [
  # The lane whose review raised the finding — a check_set member — or `human`
  # for a finding carrying a PR comment. It names a reviewer, never a commit.
  "finding.lane",
  # The dedup handle: the lane's name plus a normalized locus and message,
  # carrying neither a commit oid nor a line number so it survives a rebase.
  # Re-raising an objection whose key already has an open finding on this anchor
  # creates nothing; idempotency is by key, never by how often a check is read.
  "finding.key",
  # One of: unvalidated | must-fix | deferred | declined | needs-you | restates.
  # A reviewer files a finding unvalidated and the validator rules it; every
  # ruling ends the finding closed or converts it to a visit. must-fix wires
  # finding --blocks anchor, the hold merge.sh's blocker probe reads, until the
  # fix unit lands. deferred files a claimable follow-up bead (gated behind the
  # anchor, its provenance edge --discovered-from the finding) and closes the
  # finding; declined closes it with the reason, no edge. restates closes a human
  # review body that only frames the review's own inline comments, each a finding
  # of its own, with no edge and no answer owed: the review's living answer gives
  # it no entry and no count.
  # needs-you files a visit for the operator, or names one already open on the
  # anchor's feedback, and leaves the finding OPEN — an open finding holds its
  # human review changes-requested until the operator rules the visit holding
  # its question (gc.ruling on it, following any fold) and no fix unit on its
  # lane, nor a ruling's rework child, is in flight, when finding.sh
  # close-answered closes it.
  "finding.disposition",
  # machine:<lane> or human:<login> — who raised it. A human finding is what
  # lets an operator's PR comment produce work the way a reviewer's finding does.
  "finding.source",
  # The GitHub comment databaseId that raised a human finding, stamped by
  # pr-facts.sh at file time: an inline review comment, a review body (the
  # review's own id, so it equals finding.review_id), or a Conversation comment.
  # For an inline comment it is also the id the reviewThread carries, so the
  # write-back can find the thread and post the finding's owed reply into it.
  "finding.comment_id",
  # The answer a HUMAN objection owes its raiser, which pr-facts.sh's write-back
  # delivers where the raiser wrote: a reply in an inline comment's thread, the
  # review's living answer for a review body, which sits in no thread, or a
  # Conversation comment linking a Conversation comment. A declined finding's
  # overrule (set on `set-disposition declined --reply`), a deferred finding's
  # follow-up id, or a needs-you finding's visit id (both set by set-disposition
  # as it rules). A machine or no-objection finding owes none and sets it not.
  # A ruling that owes none clears it in the write that commits the ruling: a
  # must-fix, a restates, and a decline given no --reply.
  # The peer model: the validator may overrule or defer a human objection, or
  # send it to them, never in silence.
  "finding.reply",
  # Set by pr-facts.sh's write-back once the answer finding.reply holds is on the
  # PR: for a thread or Conversation answer once its own text is posted or found
  # there, and dropped when that text is missing and its post fails; for a review
  # body once the review's living answer carrying it is on the PR. A living
  # answer too long for one comment can shorten the reply it quotes, and the cut
  # names the finding that holds it whole. The write-back reads the answer back
  # off GitHub on every pass, so this records the read for the review dismissal,
  # which waits for it.
  "finding.reply_posted",
  # The GitHub databaseId of the comment pr-facts.sh's write-back posted to carry
  # a machine finding ruled must-fix or deferred to its PR: a file-level review
  # comment, or a Conversation comment when the locus names no file in the diff.
  # Set once the post lands, so a later pass leaves the finding alone until it
  # closes.
  "finding.pr_comment",
  # Set by the same write-back once a posted finding has closed and its comment
  # carries the answer: `1` when it was answered and its thread, if it has one,
  # is resolved, carries a later post that is not the city's own, or stays open
  # for the operator because the finding was declined or deferred, and `gone`
  # when the comment had been removed from the PR and nothing was left to
  # answer. A finding carrying it costs the write-back no GitHub read.
  "finding.pr_answered",
  # The claimable follow-up bead a deferred finding files to carry the later work,
  # set by finding.sh as the deferral runs. It carries the objection and the
  # deferral reason, and the create that files it carries both its edges: the
  # anchor --blocks it until the merge, and it is --discovered-from the finding.
  # The same create stamps it source_finding, below. A deferral retried after a
  # failure finds the follow-up the failed attempt filed by that stamp, so the
  # retry files no second one.
  "finding.follow_up",
  # The visit that carries a needs-you finding's decision, set by finding.sh as
  # the ruling runs: one it filed, or one already open on the anchor's feedback
  # that the ruling named. The finding stays open and the visit id is posted to
  # the raiser's thread. close-answered follows it through any fold to the visit
  # holding the question, and closes the finding once that visit has closed
  # carrying the operator's ruling (gc.ruling) and no fix unit on the finding's
  # lane, nor a ruling's rework child, is in flight. A visit closed with no
  # ruling releases nothing.
  "finding.visit",
  # The visit whose recorded ruling released a needs-you finding, stamped by
  # finding.sh close-answered in the write that closes it: finding.visit itself,
  # or the visit a fold handed its question on to. pr-facts.sh's review dismissal
  # names it, and counts a closed needs-you finding as answered only when it is
  # set. Absent on an open finding and on one closed any other way. A bead id.
  "finding.ruling_visit",
  # The databaseId of the GitHub review that raised a human finding, stamped by
  # pr-facts.sh at file time beside finding.comment_id. It groups an anchor's
  # human findings by their originating review, so once every finding one review
  # raised has closed, and every answer one of them owes its raiser is on the PR
  # (finding.reply_posted), the write-back dismisses THAT review and re-requests
  # its author — per-review, independent of other reviews on the same PR.
  "finding.review_id",
  # The rework child dispatched with the batch that raised a finding, recorded by
  # finding.sh upsert --fix-unit as pr-facts.sh files a human batch routed to
  # work. A must-fix ruling hangs its close-ordering edge from this child, never
  # from another rework child on the anchor: an earlier batch's, a stale-base
  # merge-in, a red-check rework. A later batch re-raising the open finding
  # records its own child, and on a finding already ruled must-fix hangs that
  # child's edge too. A finding filed without one falls back to the lane-level
  # match. A bead id.
  "finding.fix_unit",
  # The words the review's living answer shows for a human finding
  # (assets/scripts/review-answer.sh, written by pr-facts.sh's write-back). Each
  # is plain text and absent until its writer records it.
  # finding.label — a few words naming the point, written by the validator as it
  #   rules (`set-disposition --label`). The living answer labels a point with
  #   its comment's own bold lead first, so this one shows only for a comment
  #   that opens with no headline. Absent, the label is the comment's first
  #   sentence.
  # finding.answer — the one sentence the validator answers the point with, in
  #   its own words (`set-disposition --answer`): a decline's reason, a deferral,
  #   or for needs-you the question the visit asks, which defaults to the
  #   ruling's --reason. Absent, the living answer shows finding.reply.
  #   Each ruling sets finding.label and finding.answer, or clears each one it
  #   does not supply, in the write that commits it, so neither outlives the
  #   ruling that wrote it.
  # finding.fix_answer — the fix unit's own sentence on how it answered the point
  #   compared with what was asked (`finding.sh answer`). The living answer shows
  #   it for a must-fix point, and for any point the fix flagged.
  # finding.fix_flag — `1` when the fix unit flags the point for the reviewer's
  #   look (`finding.sh answer --flag`): it chose among options they left open,
  #   departed from their suggestion, or changed code the ruling declined. A
  #   flagged point sits under Worth a look. Absent means unflagged, and an
  #   answer given without --flag removes it.
  #   A later batch's child taking the finding over (`finding.sh upsert
  #   --fix-unit`) clears finding.fix_answer and finding.fix_flag in the write
  #   that records it, so neither outlives the fix unit that wrote it.
  "finding.label", "finding.answer", "finding.fix_answer", "finding.fix_flag",
  # fix_notes — on the fix unit (task_kind=rework), not a finding: its notes on
  #   the round, written by the fix unit through `finding.sh fix-notes` and shown
  #   folded under the points of each living answer whose findings name it as
  #   finding.fix_unit. Absent, the living answer has no notes block. Replaced by
  #   a later write, never cleared. Plain text.
  "fix_notes",
  # On the follow-up a deferred finding files, the finding it carries forward,
  # stamped by finding.sh in the create that files the follow-up. finding.sh reads
  # it when a deferral is retried: of the finding's live discovered-from
  # dependents, only one carrying the stamp is the follow-up to reuse. Other
  # beads are discovered-from a finding too, such as the bug scaffolding-sweep.sh
  # files to carry a disposed anchor's finding forward, and none is taken for the
  # follow-up. A bead id. Never cleared.
  "source_finding",
]

[metadata.review_quorum]
# The two-lane review quorum, formulas/mol-review-quorum-signoff.toml. Two lane
# steps review one diff on different providers, and a synthesis step makes the
# single signoff.sh call. gate-ensure.sh pours it in place of mol-review when
# refinery-reconcile.sh's REFINERY_RECONCILE_REVIEW_FORMULA names it. Every key
# here sits on a step bead of that molecule, never on the review bead or the
# anchor. All but gc.output_json are the formula's step metadata, stamped on the
# step when the molecule pours, beside the gc.run_target each step routes by
# ([metadata.runtime_owned]). None is cleared.
keys = [
  "gc.output_json", "gc.review_quorum_lane",
  "gc.provider", "gc.output_json_schema", "gc.review_quorum_role",
]
# gc.output_json — a lane's review-quorum.lane.v1 object, compact JSON stored as
#   a string, written by the lane on its own step bead before it closes that
#   step. The synthesis step reads it from both closed lane steps. A lane whose
#   output is missing or unreadable is reduced coverage, not a pass: the
#   synthesis says so in the verdict, and requests changes with a finding naming
#   the gap when one lane is not enough for a confident verdict. The key is
#   gascity's step-output key: the runtime copies it from an attempt to its
#   logical bead and from a scope member to its scope body, and an on_complete
#   fan-out reads it. The lane steps are plain steps, so the synthesis step is
#   their only reader.
# gc.review_quorum_lane — the lane id on each lane step (lane_one_id and
#   lane_two_id, which refinery-reconcile.sh defaults to `codex` and `claude`).
#   The synthesis step finds the two lane steps by it, scoped by gc.root_bead_id
#   because lane ids repeat across pours.
# gc.provider / gc.output_json_schema / gc.review_quorum_role — labels that
#   neither the pack nor the gascity runtime reads: each lane step's provider
#   var and the schema its output follows (`review-quorum.lane.v1`), and
#   `synthesis` on the synthesis step. A lane routes by gc.run_target, not by
#   gc.provider.

[metadata.self_review]
# The self-review check loop in formulas/mol-polecat-work.toml. Each iteration
# runs the rig's declared checks in its own session and stamps the head it saw
# pass. The loop's exit condition, assets/scripts/self-review-check.sh,
# converges only when that stamp names the worktree's live HEAD on a clean tree.
# All three keys sit on the work bead.
keys = ["self_review_passed_sha", "aborted_at", "self_review_loop_attempts"]
# self_review_passed_sha — the full commit sha an iteration verified, written by
#   the self-review step once every declared check has passed on a clean tree.
#   self-review-check.sh passes the loop only when it equals the worktree's
#   HEAD. Absent means no iteration has passed yet, and the loop runs another.
#   Never cleared: a later commit leaves it naming an older head, which the exit
#   condition reads as not yet passed.
# aborted_at — `self-review-exhausted`, stamped by self-review-check.sh on the
#   budget's last failing attempt. The same update reopens the work bead, clears
#   its route and session pins, reassigns it to the witness derived from its
#   pool route, and appends the failure to its notes. self-review-check.sh is
#   also its only reader: a bead already carrying it gets no second handback.
#   Absent means no handback has run. Never cleared. The opt-in
#   packs/gascity-keeper sub-pack stamps the same key with its own step names.
# self_review_loop_attempts — the attempt number that exhausted the budget,
#   written in the same handback. No pack path reads it back. Absent means no
#   handback has run. Never cleared. An integer string.

[metadata.rig_checks]
# The published copy of a check's result, which `gctk rig <check>
# --publish-bead <bead>` writes on the bead its caller names. The result that
# answers a later `gctk rig` call is the record under the rig clone's git
# common directory (services/gctk/README.md, "rig"); this copy is for whoever
# reads the bead.
keys = ["rig_check.test", "rig_check.lint", "rig_check.typecheck"]
# rig_check.test, rig_check.lint, rig_check.typecheck — the record the
#   publishing call answered with, as one JSON object: check, result, scope
#   (absent on a lint or typecheck run), commit, tree, exit_code, duration_ms,
#   runner, recorded_at and command. gctk writes it only once the record store
#   holds the result it copies: after recording a result, and after answering
#   from a record. It reads the copy back once to confirm the write. No other
#   pack path reads it. Absent means no call published that check to the bead.
#   Never cleared: the next publish replaces it. Its commit is the one the check
#   ran at: the head the call answered for, or, for a full-suite test pass
#   answered through the tree, an earlier commit with the same tree. A JSON
#   object stored as a string.

[metadata.pr_posture]
# pr_posture, pr_merge_state, the two watermarks and pr_comment_disposition
# carry their mechanics in [posture] above (pr_posture is also a [dated_keys]
# key). pr-facts.sh is the sole writer of this group.
keys = [
  "pr_posture", "pr_merge_state", "pr_comment_watermark",
  "pr_review_watermark", "pr_issue_comment_watermark", "pr_comment_disposition",
  # The comment-batch disposition history, one ledger per id space: one
  # `<disposition>|<exclusive floor>|<inclusive mark>` record per batch, oldest
  # first, joined by ";". pr_comment_batch covers the inline comments,
  # pr_review_batch the review bodies, and pr_issue_comment_batch the
  # Conversation comments. A ledger outlives the single-valued
  # pr_comment_disposition because the bead a batch routed may not have closed
  # when the next batch arrives, and a comment an earlier batch left unanswered
  # still sits at or below its space's cumulative watermark. pr-facts.sh writes
  # all three as it routes each batch, reconciles the inline ledger in the
  # write-back sweep, and reads the ledgers to mark each comment awaiting a person
  # or resolved.
  "pr_comment_batch", "pr_review_batch", "pr_issue_comment_batch",
  # The head oid the unengaged-review-thread visit was last filed against.
  # pr-facts.sh stamps it when it files that visit and reads it back to re-raise
  # only when a later head still carries the threads, so the same head never
  # re-files.
  "pr_unengaged_threads",
  # The provenance cutover, mechanics in [posture] above. Written once per
  # anchor; signoff.sh reads it for the same test.
  "pr_provenance_since",
  # How far the review threads have answered past pr_comment_watermark and
  # pr_review_watermark: every inline comment (or counted review body) above the
  # watermark through this id was confirmed answered by the last thread read.
  # pr-facts.sh writes them when a read moves them and skips the read on a pass
  # whose newest feedback sits at or below both, so feedback answered off the
  # watermark is not re-read on every pass. They never stand in for the
  # watermarks: a routing writes those, and the write-back reads only those.
  "pr_comment_answered", "pr_review_answered",
]

[metadata.pr_round_trip]
# pr.machine and pr.conversation are the two round-trip axes, both dated keys
# (see [machine_axis], [conversation], [dated_keys]). pr-facts.sh writes
# pr.conversation; gate-ensure.sh and merge.sh write pr.machine.
# pr.machine_reason is the human sentence naming why a `blocked` machine verdict
# cannot merge (which thread, which base, which blocker). It is plain, not dated:
# it is read only while pr.machine is `blocked`, and merge.sh writes the two
# together and clears the reason whenever it records any other verdict.
keys = ["pr.machine", "pr.machine_reason", "pr.conversation"]

[metadata.pr_close_disposition]
# The disposition a deliberate supersede/not-planned PR close records on the
# still-OPEN anchor (merge_result=pull_request) before the PR closes, so
# pr-facts.sh's close arm consummates it through bead-rehome.sh instead of
# filing a rework-or-close visit. Written by assets/scripts/pr-dispose.sh, read
# by assets/scripts/pr-facts.sh; the marker is intent only — bead-rehome.sh
# stays the sole writer of the gc.superseded_by pointer these name.
keys = [
  "gc.pr_close_disposition_kind", "gc.pr_close_disposition_successor",
  "gc.pr_close_disposition_successor_store",
]

[metadata.holds]
keys = ["merge_hold", "rebase_hold", "tracking_only", "hold_reason"]
# merge_hold, rebase_hold and tracking_only are boolean-ish: empty, `false`, `0`
# or `null` is not held, anything else is. merge_hold is the merge freeze an
# operator or converse writes as a plain truthy value; merge.sh, gate-ensure.sh
# and pr-open.sh honour it. It is not itself a [holds] marker_key, so a bare
# merge_hold owes no blocks edge; a hold that must show as an edge asserts it
# through blocked_reason or gc.takeaway beside it. rebase_hold and tracking_only are OPERATOR freezes
# the pack only reads: a rebase_hold on any bead naming a branch stops
# pre-open-rebase.sh, pr-open.sh, pr-facts.sh and convoy-graduate.sh from
# rebasing or dispatching it, save the one dispatch pr-facts.sh files whatever
# holds the anchor: a review-feedback batch's rework child, which brings the
# branch current by merge as it answers. tracking_only opts a PR out of
# merge.sh's in-flight-holder count. The pack never writes or clears either.
# hold_reason is a freeform sentence recording why a bead or step was parked in
# place. It is not one of the [holds] marker_keys, so unlike blocked_reason it
# owes no blocks edge; it is read only as a "held on purpose" signal.
# doctor/check-claim-advancing exempts a step or root carrying it (or gc.takeaway)
# from its stall arms with the remedy status=blocked, and duplicate-sweep.sh notes
# that a disposed duplicate had been parked, leaving the text on the bead. No pack
# script writes it; an operator or the refinery stamps it by hand when parking a
# branch. Never cleared. Freeform.

[metadata.proactive]
# The proactive first-reaction surface. A first reaction is its own leased task
# bead R that tracks the subject S; exactly-once is the substrate's, keyed on R's
# identity, not a marker on S
# (specs/tk-5n01ns/reaction-bead-first-reaction.md). The group also holds the
# recommendation a recommend exit leaves for the operator's Accept, and the
# marker that stands the scan down on a subject a live owner already reacts to.
keys = [
  "gc.proactive",
  "gc.reaction_kind", "gc.reaction_subject", "gc.reaction_subject_store",
  "gc.reacted_by", "gc.proactive_reaction",
  "gc.blocker_key",
  "gc.recommended_formula", "gc.recommended_formula_dispatched",
  "gc.reaction_owned",
  "gc.first_reaction", "gc.first_reaction_reason", "gc.first_reaction_target",
  "gc.first_reaction_at",
]
# gc.proactive — `1`, the standing scan opt-in, written by patrol-finding.sh in
#   the create payload of each finding it files. Read by tools/gc-proactive.sh,
#   whose scan unions the opt-in query (`bd ready --metadata-field
#   gc.proactive=1`) with a movable-forward query of every ready, unassigned,
#   non-epic bead, and runs both through one precision filter. An absent key
#   therefore excludes no bead. Never cleared.
# gc.reaction_kind — the reaction sub-type on the reaction bead R, `first-reaction`.
#   Written by tools/gc-proactive.sh in R's create call. Leaves room for other
#   reaction kinds without a second dedup dimension. Never cleared.
# gc.reaction_subject / _store — on the reaction bead R, the subject S it tracks
#   and (only where the id prefix is ambiguous) that subject's store. Written by
#   tools/gc-proactive.sh in R's create call, so R is born tracking S; read by the
#   create-R-once dedup (with task_kind=reaction) and by the reaction worker to
#   resolve S. A tracks edge R->S mirrors the subject. Never cleared. Bead id / store.
# gc.reacted_by — on the SUBJECT S, the reaction bead R whose write-back landed.
#   Written by first-reaction-dispose.sh LAST, after the disposition act and any
#   edge, so its presence proves the whole write-back landed. Read by that
#   script's re-offer recovery and by its --stand-down, which the reaction worker
#   (agents/proactive/prompt.template.md) runs before it reacts, to close a
#   re-claimed R without re-disposing S, and shown by bead-context.sh. It
#   is not a guard progress is refused on — the write-backs are idempotent — and it
#   is keyed to R's id, so a marker left by a closed R does not block a later
#   re-reaction by a different R. Never cleared. A bead id.
# gc.proactive_reaction — `1`, the legacy landed proof on the SUBJECT S for a
#   frozen mol-first-reaction molecule, which has no reaction bead R to key on.
#   Written by first-reaction-dispose.sh's no-`--reaction-bead` path after the
#   disposition act, the close exit's included, in place of gc.reacted_by; a
#   frozen molecule's advance-and-drain also writes it on a subject
#   gc.reaction_owned marks, before it consumes that marker. Read by that
#   molecule's frozen REACTED checks and by this script's re-offer guard, so a re-offered
#   frozen step does not re-release a subject a worker already holds. gc.reacted_by
#   is its replacement for the reaction-bead path; kept until pre-cutover molecules
#   drain. Never cleared.
# gc.blocker_key — the dedup handle on the wait bead a blocked first reaction
#   FILES, so one wait stands per recurring cause rather than one per instance
#   (first-reaction-dispose.sh stamps it on the created blocker and looks an
#   existing one up by it). It does not replace a blocks edge: the wait itself is
#   already a blocks edge (--waiting-on), and this key only names the cause across
#   instances. Never cleared. A caller-supplied string.
# gc.recommended_formula — the execution mol a recommend exit names, which the
#   operator can Accept from the subject's visit. first-reaction-dispose.sh sets
#   it before the act of a recommend disposition and unsets a stale one on every
#   other disposition, reading the key back either way. gc-helm.sh
#   `accept` unsets it in the write that records its dispatch, and
#   converse-invalidate-recommendation.sh unsets it when a sitting judges the
#   recommendation no longer valid. The board's Accept derivation
#   (services/helm/internal/board/derive.go), gc-helm.sh `accept` and
#   converse-invalidate-recommendation.sh all read it as a non-empty value, so
#   absent and empty both mean no live recommendation, and the visit offers
#   Discuss only. A formula name that `gc formula show` resolves.
# gc.recommended_formula_dispatched — the formula gc-helm.sh `accept` slung,
#   written in the update that unsets gc.recommended_formula and read back after
#   it. `accept` reads it to resume a run that dispatched but did not finish: it
#   completes the unset and the visit dismiss, and never slings again. `accept`
#   slings before it writes this key, so absent means no Accept has recorded a
#   dispatch. Never cleared. A formula name.
# gc.reaction_owned — `1`, the stand-down marker on a subject whose reaction a
#   live owner already holds. gc-helm.sh `engage --new-subject` writes it in the
#   create payload of the subject it files, beside gc.origin, so no scan sees
#   that subject unmarked. tools/gc-proactive.sh drops a marked bead from its
#   scan and refuses to file a reaction for one, and a reaction that reaches one
#   anyway closes its reaction bead without acting and leaves the marker
#   (first-reaction-dispose.sh --stand-down, which
#   agents/proactive/prompt.template.md runs). A frozen mol-first-reaction
#   molecule's advance-and-drain still consumes it: it writes
#   gc.proactive_reaction=1, reads it back, and only then unsets this key.
#   Absent means no live owner. Cleared only by that frozen consume.
# gc.first_reaction / _reason / _target / _at — RETIRED. The attempt record a
#   reaction wrote on its subject before the act, with the reason, the target it
#   named and the time. Nothing writes them now: a reaction bead's identity is
#   its exactly-once key, and the card in the subject's notes is the record of
#   what was chosen and why. Registered so that residue on a pre-retirement bead
#   reads as known, not as a stray. bead-context.sh still shows them on such a
#   bead, and a validating closer reads _reason as the close brief of a reaction
#   that ran before reaction beads.

[metadata.placement]
# Intake's hold on new work (docs/steering.md). A bead may reach a pool only as a
# member of an epic, as PR-finishing work, as a checked emergency, or by the
# operator's own move. Other new work waits for the operator's placement sitting,
# which places it under an epic or routes it on its own.
keys = ["placement"]
# placement — `pending`, the marker on a bead held for the placement sitting.
#   Written by first-reaction-dispose.sh when intake holds its actionable route
#   or its blocked exit's --then-route, and read back before the release; by
#   mol-witness-patrol.toml's bug-file block, in the create of a pack-defect bug;
#   and by mol-feedback-distiller.toml, in the create of each prompt-update and
#   engineering bead. Read through assets/scripts/placement.sh, whose
#   awaiting_placement is the queue gc-helm.sh unplaced lists, the named wait
#   liveness-classify.sh and liveness-recheck.sh give the bead, the exemption
#   doctor/check-blocked-work-armed reads, and the beads the proactive scan
#   (tools/gc-proactive.sh) files no first reaction for. A parent, a route, an
#   arm, an assignee or a live pour places a bead whatever the marker says, so a
#   marker left on a placed bead names no wait. Absent means intake never held
#   the bead. No pack writer clears it. A string.

[metadata.priority]
# The priority flow (docs/steering.md): a bead's priority is the priority of the
# bead it follows plus its own shift, computed by assets/scripts/priority-lib.sh,
# and the bd priority field holds the result, because a claim reads that field
# and a pour copies it once.
keys = ["priority_shift"]
# priority_shift — the bead's shift from the bead it follows: +1 is one level
#   later and -1 one level sooner, and each level stops at P0 and P4. Written by
#   queue-priority.sh move, which `gc-helm.sh priority --shift` runs, and read
#   back there. Read by priority-lib.sh wherever a priority is computed:
#   queue-priority.sh settle, its move and its reconcile pass. Read only on a
#   bead that follows a parent or an anchor: a workflow's convoy, root and steps
#   carry no shift, and a bead that follows nothing has nothing to shift from.
#   Absent or empty reads as 0. A value that is not a signed integer makes the
#   bead unreadable, and every bead that follows it, so no priority is computed
#   from it. No pack writer clears it. A signed integer, stored as a number.

[metadata.supersede]
# The re-home / supersede pointers, written by bead-rehome.sh when work moves to
# a successor bead or a duplicate is folded into a survivor. The pointer is how a
# closed bead names where its work went; pr-dispose.sh reads gc.superseded_by to
# treat an already-disposed anchor as a no-op, preexisting-failure.sh follows it
# from a closed tracker to the live bead that carries its failure, and the helm
# board renders it.
keys = [
  "gc.superseded_by", "gc.superseded_by_store",
  "superseded_by", "superseded_by_store",
  "gc.supersedes", "gc.supersedes_store", "duplicate_of", "duplicate_of_store",
]
# gc.superseded_by / _store — on the ORIGIN bead, the successor it retired into
#   and (only where the id prefix is ambiguous) that successor's store.
#   bead-rehome.sh writes them, in one write bd applies only while the origin
#   still has the status and assignee its gates read, reads them back, and
#   refuses to overwrite a DIFFERENT successor. Flat dotted keys read by bracket
#   access; the non-dotted `superseded_by` and `superseded_by_store` are legacy
#   fallbacks, read only — bead-rehome.sh and duplicate-sweep.sh fall back to
#   them when the dotted form is absent, and no pack path writes them. Cleared
#   only by deferred-dispatch.sh, and only a pointer it had bead-rehome.sh stamp
#   under its claim: in the write that reopens a bead it has disposed when its
#   read after the close finds something that landed on the bead or its edges
#   after it claimed the bead, and in the write that gives back a claimed bead
#   whose close bead-rehome.sh did not make (docs/authority-map.md, Withdraw a
#   disposal). On an open bead the pointer is live work (live-work.sh), so the
#   until consumer never disposes a bead another closer has pointed. Bead id /
#   store.
# gc.supersedes / _store — the reverse pointer on the SUCCESSOR bead, naming the
#   origin it replaced; written best-effort by bead-rehome.sh, not read back.
# duplicate_of — the survivor a duplicate names, the handle duplicate-sweep.sh
#   enumerates by `--has-metadata-key duplicate_of`. Stamped by hand on a
#   diagnosed duplicate; no pack script writes it. pr-stack.sh drops a row
#   carrying it from the branch's bead list. A bead id. Never cleared.
# duplicate_of_store — the store that survivor lives in, the sibling of
#   gc.superseded_by_store, set only where the survivor's id prefix is ambiguous.
#   duplicate-sweep.sh reads it to leave a duplicate alone when its survivor sits
#   in a store this pass cannot resolve; absent reads as this rig's own store.
#   Stamped beside duplicate_of by hand; no pack script writes it. Never cleared.
#   A store ref.

[metadata.epic_stewardship]
# An epic's contract and the ruling on its hypothesis, recorded on the epic bead
# (issue_type=epic). docs/epics.md is the contract these fields make
# machine-readable, and docs/epic-stewardship.md is the enforcement that reads
# them. They are the operator's: stamped when the operator confirms a contract
# field or rules at a sitting on the epic, the dated decision docs/epics.md calls
# for. No pack script writes them. finalize-gate.sh (clause_epic_ruling_recorded)
# and doctor/check-epic-closed-implies-ruled read epic_hypothesis, epic_ruling and
# epic_ruling_reason.
keys = [
  "epic_handle", "epic_hypothesis", "epic_boundaries",
  "epic_closure_condition", "epic_indicators",
  "epic_ruling", "epic_ruling_reason",
  "epic_ruling_at", "epic_ruling_by", "epic_ruling_evidence",
]
# epic_handle / epic_hypothesis / epic_boundaries — the elaboration floor
#   (docs/epics.md): a 3-5 word handle, a one-sentence hypothesis, and the
#   boundaries. epic_hypothesis is also the close gate's trigger: its presence
#   brings an epic under the ruling requirement (clause_epic_ruling_recorded).
# epic_closure_condition / epic_indicators — the rest of the contract (3-6
#   closure checks, 1-3 leading indicators). Absent means unrecorded.
# epic_ruling — the latest ruling on the hypothesis: `continue`, `shift`, or
#   `close` (docs/epics.md). continue and shift keep the epic open; close is the
#   one terminal ruling. Each later ruling overwrites the last.
#   clause_epic_ruling_recorded holds a stewarded epic's finalize until it reads
#   close with an outcome, and check-epic-closed-implies-ruled errors on a closed
#   stewarded epic that lacks either. Absent means the hypothesis has not been
#   ruled on.
# epic_ruling_reason — why the latest ruling was made, written with it. On a close
#   ruling it is the outcome, and the close requires it: the hypothesis held, was
#   disproven, cannot be met as stated, stalled, or ran past its cost. On continue
#   or shift it says what the next body of work is aimed at. Absent or whitespace
#   alone reads as unrecorded.
# epic_ruling_at / epic_ruling_by / epic_ruling_evidence — when the latest ruling
#   was recorded, who recorded it, and the visit bead of the sitting that carried
#   it. Bookkeeping beside epic_ruling; absent leaves the provenance unstated.

[metadata.human_surface]
keys = [
  # gc.demand_for names the bead a demand gates. It is what the merge cadence
  # reads to tell a sitting still waiting on a person from one that ended:
  # gc.takeaway beside it is the headline, replaced at sign-off and cleared by
  # nothing a sitting does, so only the demand's own liveness answers that
  # question.
  # gc.takeaway_settled is the headline's own disposition, "1" where its writer
  # said nothing is waiting and empty where it did not: [holds] settled_keys
  # reads it, and it is rewritten with every headline rather than surviving one.
  "gc.takeaway", "gc.takeaway_at", "gc.takeaway_by", "gc.takeaway_settled",
  "gc.demand_for", "gc.hold_demand", "gc.gate_visit",
  "gc.continuation_group", "gc.origin", "gc.outcome_reason",
  "escalation_key", "escalation_raised_by",
  "escalation.recurrences", "escalation.recurrence_last",
  "stale_escalated_at", "stale_escalated_to",
  "visit.recheck", "sweep.*", "triage.*",
  "gc.pr_visit_summary", "gc.pr_visit_actions",
  "gc.ruling", "gc.folded_into",
]
# The gc.takeaway family and gc.demand_for carry their mechanics in the comment
# above and in [holds] (settled_keys, terminal_wait_key): gc-helm.sh, signoff.sh
# and lifecycle.sh write the takeaway (gc.takeaway_by records which), and
# gc.takeaway_settled is `1` when nothing waits and empty for a live wait.
# gc.hold_demand — on a converse hold's VISIT, the demand bead the hold filed;
#   converse-hold.sh trusts it as the SOLE proof of a real hold and reads it back
#   before posting the framing. Not cleared here. A bead id.
# gc.gate_visit — on a gate bead, the visit gate-visit-sweep.sh filed for it (a
#   bead id, or `filed`); its presence is how the sweep skips a gate already
#   escalated, and `--unset` re-offers the visit.
# gc.continuation_group — the subject a visit is scoped to, converse's
#   group-scoped re-claim fence. Written on the visit by gc-helm.sh and
#   escalate.sh, and repaired toward the subject id when a read-back finds it
#   empty (an empty group disables the fence). Never cleared. A bead id.
# gc.origin — `operator` marks a topic a human commissioned. gc-visit-open.sh
#   stamps it on its subject when the key is absent, and gc-helm.sh `engage
#   --new-subject` writes it in the create payload of the subject it files.
#   bead-context.sh returns it with a subject's context. It decides no
#   first-reaction exit. The rubric in agents/proactive/prompt.template.md has
#   the reacting agent triage an operator capture on its merits like any other
#   bead, and
#   first-reaction-dispose.sh gates nothing on it. Absent is an ordinary bead.
#   Not cleared.
# gc.outcome_reason — on a closed VISIT, the one-line sentence naming why it
#   closed, stamped beside the gc.outcome word a reader groups by. Three writers
#   stamp the pair before they close a visit: visit-close.sh, the guarded close;
#   gc-helm.sh `dismiss`, with gc.outcome=dismissed; and bead-rehome.sh, on a
#   visit it re-homes that records no outcome yet. Each reads the pair back and
#   refuses the close when it did not land. The helm board
#   (services/helm/internal/source/facts.go) shows it as the sitting's headline
#   when the sitting left no takeaway. Absent, the headline falls back to the
#   subject's title. Never cleared. Freeform text.
# escalation_key / escalation_raised_by — escalate.sh files one open visit per
#   situation, keyed on escalation_key (the caller's dedup handle, read back and
#   read by pr-facts.sh); escalation_raised_by records the ephemeral wisp id that
#   raised a redirected visit. Neither is cleared.
# escalation.recurrences / escalation.recurrence_last — the suppression tally
#   escalate.sh keeps on the CLOSED verdict-bearing visit: how many times the
#   situation recurred while a verdict stood (an integer string, absent reads as
#   0, read to decide whether to re-raise) and when it last did (RFC-3339 UTC).
#   Overwritten each recurrence, never cleared.
# stale_escalated_at / stale_escalated_to — RETIRED. Nothing writes or reads
#   these: an anchor whose PR is open is a named wait however long the PR sits,
#   so no pass escalates it for its age. Registered so that residue on a
#   pre-retirement bead reads as known, not as a stray.
# visit.recheck — a recheck command liveness-sweep.sh stamps on a visit, which
#   converse-recheck-hook.sh and liveness-recheck.sh run to re-test the
#   condition. A shell snippet.
# sweep.* — liveness-sweep.sh's bookkeeping on its summary bead: sweep.new_ids
#   and sweep.carried_ids (comma-joined id lists, this pass and carried) and
#   sweep.pass_at (the pass timestamp). Overwritten each pass.
# triage.* — the triage-subject surface: triage.scope is the bucket
#   (`unnamed-waits` from liveness-sweep.sh, `ephemeral-subject-findings` from
#   escalate.sh), triage.last_seen the last pass a subject was seen (set to the
#   time when present, cleared to empty when gone), and triage.hold a
#   held-by-design marker ([holds] marker_keys).
# gc.pr_visit_summary / gc.pr_visit_actions — the closing text of a visit's PR
#   reminder, stamped on the VISIT by converse-signoff.sh before the visit
#   closes, so the post-close writer can mark the reminder closed without
#   re-deriving the sitting. The summary is the sitting's takeaway. The actions
#   name the work it routed, then the ruling it reached or what is still owed.
#   pr-visit-comment.sh `close` reads each one when its caller passes no
#   --summary or --actions, as converse-settle's close step and
#   converse-claim.sh's stranded-finish recovery do. Absent or empty leaves that
#   line out of the closed reminder. Never cleared. Freeform text, rendered as
#   one line.
# gc.ruling — on a VISIT, the operator's ruling in its sitting, the one line
#   converse-signoff.sh --ruled yes resolves the sitting's demands with. Stamped
#   and read back before the visit closes; a --ruled no sign-off clears one an
#   earlier run left, and stops when either write does not read back. finding.sh
#   close-answered reads it: a needs-you finding is released only by a closed
#   visit carrying one, because a visit closed moot, benign, dismissed or cut
#   short answers nothing. Absent means nobody ruled in that sitting. Freeform
#   text.
# gc.folded_into — on a VISIT closed `folded`, the visit it folded into, which now
#   carries its question. visit-close.sh requires --into on every fold and stamps
#   it with the outcome pair, read back before the close. finding.sh
#   close-answered follows it, as it follows bead-rehome.sh's gc.superseded_by on
#   a re-homed visit, to the visit whose ruling answers the question. Never
#   cleared. A bead id in the folded visit's own store.

[metadata.patrol_findings]
# One durable bead per distinct patrol finding, written by
# assets/scripts/patrol-finding.sh (the deacon and witness patrols file through
# it). finding.key and finding.about together are the dedup identity. A report
# whose key and subject both match a live bead records a recurrence on that
# bead, unless that bead is held at blocked with nothing open left to wait on.
# A report that names no subject matches only a bead with no finding.about. An
# --about that names a wisp (`*-wisp-*`) is dropped, and the key alone
# identifies the finding. A patrol burns its wisp when the pass ends, so no
# later pass can name the same one. When no live bead takes the report, a new
# bead is refused while a live finding with the same finding.scope carries the
# report's key under another subject or none, or the report's subject under
# another key. The refusal lists those findings, and a caller reporting one of
# them re-runs with that finding's key and subject, which records a recurrence
# there. --distinct files the new bead despite those findings, though an exact
# match still records a recurrence. A key meant to hold one finding per subject
# passes --distinct on every call. finding.scope is which patrol filed it;
# finding.digest is the message hash that tells a recurrence with changed text
# from an identical one. finding.occurrences counts the recurrences and
# finding.first_seen/finding.last_seen bracket them.
# finding.recurrence_of names the earlier finding a reappearance repeats: a
# closed one, or one held at blocked with nothing open left to wait on. Either
# way a fix that did not hold is visible.
keys = [
  "finding.key", "finding.scope", "finding.digest",
  "finding.first_seen", "finding.last_seen", "finding.occurrences",
  "finding.about", "finding.recurrence_of",
]
# finding.key here is the same prefix the review findings use
# ([metadata.review_findings]); the two families share the name and are told
# apart by task_kind, and only these patrol keys (scope, digest, the seen
# timestamps, occurrences, about, recurrence_of) belong to this one.

[metadata.preexisting_failure]
# One tracker per failure already red on a base branch, filed through
# assets/scripts/preexisting-failure.sh by the refinery's merge gate
# (mol-refinery-patrol.toml, handle-failures) and by a polecat's pre-flight
# (mol-polecat-work.toml, preflight-tests).
keys = ["failure_key"]
# failure_key — the failure's dedup identity, as the script's `key` derives it:
#   a test function, a repo-relative path, or a linter and a path. `file` writes
#   it in the create and reads it back; `find` matches it exactly, over the live
#   statuses for both gates' lookup, then over closed beads when no live tracker
#   holds it, to follow the most recently closed tracker's gc.superseded_by
#   chain to a live bead, and over closed beads for the pre-flight's landed-fix
#   check. `find` reads no title, so a bug without it is no tracker. Never
#   cleared, so a retitle or a fold leaves it in place. A string.

# Warrant beads (label=warrant, routed to the dog pool): the due-process kill
# request a patrol detector files against a live-but-wedged session
# (docs/authority-map.md; formulas/mol-dog-shutdown-dance.toml). Renamed from
# the pre-rewrite bare target/reason/requester — bare `target` collides with
# the merge_identity key above.
[metadata.warrant]
keys = ["warrant.target", "warrant.reason", "warrant.requester"]

[metadata.deferred_dispatch]
# A dispatch armed to fire when a bead re-enters bd ready, managed by
# deferred-dispatch.sh: it enumerates armed beads by the presence of
# gc.dispatch_when_ready and clears the whole family with --unset once it slings.
# The same script's until consumer marks a bead it is disposing.
keys = [
  "gc.dispatch_when_ready", "gc.dispatch_when_ready_args",
  "gc.dispatch_when_ready_armed_by", "gc.dispatch_when_ready_armed_at",
  "gc.dispatch_when_ready_reason", "gc.dispatch_when_ready_slung",
  "gc.dispatch_when_ready_fail_count", "gc.notify_when_ready",
  "gc.deferred_routed_to", "gc.deferred_execution_routed_to",
  "gc.deferred_assignee", "resling_target", "gc.until_disposal",
]
# gc.dispatch_when_ready — the sling target (agent or pool); its PRESENCE means
#   armed, and its value is what deferred-dispatch.sh slings to. Cleared with
#   --unset on disarm and after the sling.
# gc.dispatch_when_ready_args — a JSON array of extra sling args, defaulting to
#   `[]`; a malformed value leaves the bead armed rather than slinging wrong.
# gc.dispatch_when_ready_armed_by / _armed_at — provenance (actor, RFC-3339 UTC),
#   written at arm and not read back.
# gc.dispatch_when_ready_reason — free text, shown by `list`, not acted on.
# gc.dispatch_when_ready_slung — the reconcile idempotency marker: `slinging@<ts>`
#   while an attempt is in flight, `slung@<ts>` once proven, so a reconcile pass
#   does not sling twice. Cleared with the rest of the family.
# gc.dispatch_when_ready_fail_count — the sling attempts reconcile has made on
#   this arm, the budget that stops a sling which never finalizes from minting
#   an input convoy every pass. reconcile bumps it in the write that stamps
#   `slinging@`, so a failed sling and a death both leave it raised. At the cap
#   (GC_MAX_DISPATCH_SLING_FAILURES, default 3) reconcile stops re-slinging,
#   escalates the bead through escalate.sh and leaves it armed. `list` reports
#   such an arm CAPPED, and doctor/check-armed-dispatch-owed skips it because
#   the escalation already surfaced it. An integer string; absent or non-numeric
#   reads as 0. Cleared with the rest of the family by disarm, which ends a
#   proven dispatch. Clearing it by hand restarts a capped retry.
# gc.notify_when_ready — a notice owed to the named agent the bead is assigned
#   to; its PRESENCE means owed, and its value is the agent. `deferred-dispatch.sh
#   notify` writes it, then mails the agent (gc mail send --notify) at once when
#   bd already reports the bead ready, and clears it once the agent's turn is
#   requested: by the mail's `notified`, or else by gc session nudge. Otherwise
#   reconcile does both once bd does. A notice that gets no turn requested keeps
#   it for the next pass. A pass clears it unsent on a bead that closed, that
#   the agent claimed, or that is no longer assigned to that agent. Each of
#   these clears re-reads the bead first and leaves a value that names another
#   agent by then. The disarm verb clears it with the family, while reconcile
#   retiring an arm on the same bead leaves it.
# gc.deferred_routed_to / gc.deferred_execution_routed_to / gc.deferred_assignee —
#   the deferred counterparts of gc.routed_to, gc.execution_routed_to and the
#   assignee: the routing a fired dispatch restores. mol-polecat-work's bd-ready
#   guard clears them (to "") alongside the live route when it de-routes a bead
#   that reached a polecat while blocked, and await-ruling.sh clears them the
#   same way before it arms a declined run's re-sling.
# resling_target — the pool a declined run's work re-slings to. await-ruling.sh
#   writes it in the update that clears the work bead's route keys before the
#   arm, because from that clear until the arm lands nothing else on the bead
#   names the pool. Its own pool lookup reads it last, after the route keys and
#   gc.dispatch_when_ready, so a re-run after an arm that was refused or failed
#   still finds the pool with no --target. Absent means no ruling wait has
#   cleared the bead's routes. Never cleared; the next wait overwrites it. A
#   rig-qualified pool identity (<rig>/<agent>).
# gc.until_disposal — the successor the until consumer is disposing a bead onto,
#   written under its claim (the bead in progress under assignee
#   deferred-dispatch) once its read under the claim finds the bead owed, just
#   before bead-rehome.sh stamps gc.superseded_by. A pointer it names on a bead
#   under the claim is the consumer's own, so a pass that stops after the stamp
#   leaves the next one a pointer it can withdraw. Cleared by the claim itself
#   and in every write that ends one: the give-back, the release from a close
#   that stands, and the reopen. A bead id.

[metadata.learning]
# The feedback-learning loop's beads (docs/feedback-learning.md). obs.* is the
# observation surface — obs.category, obs.scope, obs.source, obs.directive,
# obs.provenance, obs.distilled and their siblings — written by the observer at
# filing and read by the distiller; the wildcard registers the whole namespace.
keys = ["obs.*", "remedy_class", "eng_bead"]
# remedy_class — `structural` on a promoted feedback pattern the distiller judged
#   belongs in code rather than a prompt rule; written with eng_bead by
#   mol-feedback-distiller.toml. eng_bead — the engineering bead that structural
#   remedy was filed as. A bead id; neither is cleared.

[metadata.upstream_send]
# A parked outbound command for a repo the rig does not own, filed by
# upstream-finding.sh (task_kind=upstream-send) for the operator to run
# (docs/outbound-sends.md). upstream_send_key dedups; the gh_* keys carry the
# command and its target so the operator pastes exactly what was found.
keys = ["upstream_send_key", "gh_command", "gh_verb", "gh_target_repo"]
# upstream_send_key — the caller's dedup handle; a second finding on the same key
#   reuses the parked bead. Read back after the stamp; not cleared.
# gh_command — the full shell command to paste (the deliverable), read to catch a
#   divergent re-file. gh_verb / gh_target_repo — the action and the repo slug,
#   provenance not read back. All strings; not cleared.

[metadata.patrol_bookkeeping]
# Rig-stamps and recovery bookkeeping the patrols write on beads they touch.
keys = [
  "gc.rig", "reconcile_rig",
  "recovered", "recovered_at", "recovered_count",
]
# gc.rig — the rig a patrol stamps on a bead just before assigning it, so an
#   interrupted pour leaves a rig-scoped orphan; written by mol-witness-patrol.toml
#   and mol-refinery-patrol.toml. The rig name.
# reconcile_rig — the rig a checkout-reconcile bead pertains to, the field
#   reconcile-rig-checkouts.sh enumerates the mayor's beads by. A rig name.
# recovered / recovered_at / recovered_count — witness orphan-recovery
#   bookkeeping (mol-witness-patrol.toml). recovered_at and recovered_count feed a
#   crash-loop RATE, which is what a reader must judge a repeat recovery by;
#   recovered is a flag nothing clears, so its mere presence is not that signal.
#   Two timestamps and a count; not cleared.

# Runtime-owned: documented here so readers know they exist; the claim, pour and
# step semantics belong to the Gas City runtime, not to pack transitions. The
# pack does write some of these as decisions — gc.routed_to is a routing stamp
# (lifecycle.sh --route, stamp-don't-sling), gc.execution_routed_to is cleared by
# mol-polecat-work's blocked-work guard and by await-ruling.sh, and gc.outcome
# is stamped by many pack components — but their meaning is the runtime's.
[metadata.runtime_owned]
keys = [
  "gc.routed_to", "gc.execution_routed_to", "gc.run_target", "gc.outcome",
  "assignee", "gc.session_id", "gc.session_name", "gc.session_affinity",
  "gc.claimed_at", "gc.kind", "gc.synthetic", "gc.step_id", "gc.step_ref",
  "gc.root_bead_id", "gc.root_store_ref", "gc.input_convoy_id", "gc.formula_source",
  "gc.native_step_dependencies.v1", "gc.graphv2_*", "gc.var.*",
  "pin_awake", "configured_named_session",
  "gc.formula_contract", "gc.work_dir", "gc.work_commit", "gc.work_branch",
  "gc.work_outcome", "work_outcome",
]
# gc.outcome — the terminal disposition a workflow step or bead records: a broad
#   enum whose members include `pass` and `recorded` (a step or verdict that
#   stood), `superseded`, `moot` and `dismissed`, written by the pack component
#   that reached the outcome (step-close.sh, signoff.sh, review-outcome.sh,
#   pr-facts.sh, gc-helm.sh and the done arms), and `canceled`, which gascity's
#   run cancel stamps on every member of a run it ends; read by the done gates
#   and the review graph. gc.routed_to and gc.execution_routed_to are
#   the route stamps (see the ROUTE rule in the preamble). The rest — assignee,
#   the session and claim stamps, the step and root linkage, the poured vars and
#   gc.formula_source, gc.session_affinity (the runtime pins it to gc.session_id)
#   and pin_awake (settable only by `gc session pin`) — are written by the
#   runtime; the pack reads them and does not write them.
# gc.run_target — a third route stamp beside gc.routed_to and
#   gc.execution_routed_to, written by the runtime: gascity's
#   ReleaseWorkBead re-stamps it as a fallback route on a drained session's work
#   bead it finds otherwise unrouted, so the pool re-offers stranded work. No
#   pack script writes or reads it. Absent or empty means unrouted. A route
#   value, per the ROUTE rule in the preamble. A formula step can also declare
#   it in its step metadata: gascity's sling routes a poured step by its
#   assignee, else by this key, which is how mol-review-quorum-signoff sends
#   each lane to its provider's pool ([metadata.review_quorum]).
# gc.formula_contract — `graph.v2` on a workflow root, stamped by the formula
#   pour beside gc.kind=workflow. orphan-dispose.sh, run-cancel.sh and
#   mol-witness-patrol.toml read it, or gc.kind=workflow, to classify a bead as a
#   workflow root — the runtime's own IsWorkflowRoot test, mirrored in the pack.
# gc.work_dir / gc.work_commit / gc.work_branch — the runtime's work-record
#   keys on a work bead: the worker's checkout, the commit that satisfied the
#   bead, and the branch that commit is on. The gascity binary writes gc.work_dir
#   and gc.work_branch at claim time (hookClaimIdentityPatch), from the claiming
#   worker's checkout. mol-polecat-work's workspace-setup rewrites gc.work_branch
#   with the branch the work is cut on, since the claim stamps the pool
#   worktree's base checkout. The lifecycle writer's transition into `merged`
#   writes gc.work_commit (merged_sha) and gc.work_branch (merged_target) from
#   the landing it records, when that landing names both.
#   mol-refinery-patrol.toml's rework hand-back close writes them from the head
#   it read back from origin and the branch that head is on. duplicate-sweep.sh
#   reads gc.work_dir and gc.work_commit — with the pack-written bare work_dir
#   defined in merge_identity — as proof a run produced work before disposing a
#   duplicate, and bead-rehome.sh reads them the same way before a duplicate or
#   fixed-upstream close.
#   The runtime's work-record close gate reads the commit and the branch: a
#   `shipped` close needs gc.work_commit reachable on gc.work_branch in the
#   rig's checkout (warn-only by default). The gate runs git in gc.work_dir when
#   the bead records one, and the pack's worker checkouts are worktrees of the
#   rig checkout, sharing its refs. No pack script reads gc.work_branch, and the
#   runtime's detached-handoff orphan sweep reads the bare branch defined in
#   merge_identity, not this key. Absent means no such product was recorded. A
#   path, a sha, a branch.
# gc.work_outcome — a work bead's self-reported disposition, read as `no-op`
#   (produced nothing) or `shipped` (landed work). Its meaning is the runtime's,
#   like gc.outcome: the runtime's work-record gate checks it when a plain task
#   bead closes, and warns on a missing or unknown value unless
#   GC_WORK_RECORD_ENFORCE makes it block the close. The pack stamps `shipped`
#   from the lifecycle writer's transition into `merged` and from
#   mol-refinery-patrol.toml's rework hand-back close, and `no-op` from
#   duplicate-sweep.sh on a rework twin it disposes,
#   first-reaction-dispose.sh on the reaction bead it closes,
#   mol-validate-close, work-outcome.sh on every visit close, the
#   observation-filing recipes, and converse by hand. duplicate-sweep.sh reads it
#   to confirm a no-op duplicate is disposable, bead-rehome.sh to confirm a no-op
#   origin is, pr-stack.sh drops a no-op row from a branch's ledger, and each
#   falls back to the legacy bare `work_outcome` alias. Absent leaves the
#   disposition unstated. Never cleared.
# configured_named_session — on a session bead, the authoritative "standing
#   named" gate: "true" marks a session the pack's [[named_session]] config
#   declares standing, applied by the runtime. pin-keepalive.sh reads it beside
#   pin_awake to decide which conversational sessions to keep pinned; the pack
#   does not write it. Absent or any value but "true" means the session is not a
#   standing named one. A boolean-valued string.
# gc.synthetic — "true" on a machine-minted convoy, written by the runtime that
#   mints it. liveness-sweep.sh's machine_convoy test reads it, with the sling-
#   and input-convoy title prefixes, as a signal that a convoy is machine-owned
#   rather than a person's. The pack does not write it. Absent means the convoy
#   is not marked synthetic. A boolean-valued string.
