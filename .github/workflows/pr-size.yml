name: pr-size

# Shows each pull request its size change, as rule 3 of
# docs/built-once-target.md asks of every gc-toolkit pull request: the net
# runtime and test lines from the merge base to the head, by subsystem, and the
# lines the change adds to files the deletion plan retires. Below the size it
# shows what the change does to the suite's time, from the tests run at the
# head. pr-size.sh measures the size with tools/measure.sh --pr, reads the time
# with suite-time.sh, and keeps one comment on the pull request current. This is
# gc-toolkit's own check, not pack content another rig runs, so no other rig
# gets a size line.
#
# The end of a pull request's run of another workflow starts this, through
# workflow_run: a run of pr-size-start.yml, which a push to the pull request or
# a change of the branch it merges into starts, and a run of tests.yml, which
# ends long after the push that started it and brings the time it took.
# workflow_run runs this file as the repository's default branch carries it,
# never as the pull request has it, and pr-size.sh runs the tool and reads the
# deletion plan as the merge base has them, so a change cannot edit the job, the
# tool or the plan to hide what it adds. The checkout is the default branch, so
# the attributes git counts lines with are that branch's too. The head is read
# only as git objects, and the suite's seconds only as data from the run's
# artifact. Nothing from either runs, which is what makes the write token this
# event carries safe to hold. GitHub's default event policy blocks
# pull_request_target, the event that would start this on the pull request
# itself, in a public repository such as this one.
#
# GitHub files a workflow_run run's check on the default branch's tip, so a pull
# request's checks list shows its pr-size-start.yml run and no run of this, and
# the size comment is this check's output. A run of this that fails shows in the
# Actions tab and on the default branch's tip.

on:
  workflow_run:
    workflows: [tests, pr-size-start]
    types: [completed]

# Every run whose job measures a pull request takes that pull request's group,
# whichever workflow's end started it, so no two runs write its comment at once,
# and a newer run cancels the one before it. Runs take a group in the order they
# start waiting on it, not the order of their events, so pr-size.sh measures the
# pull request as it stands when the run starts. A run whose job measures nothing
# takes a group of its own, so it cancels no run that measures. A draft's tests
# run, whose jobs all skip, ends seconds after the pr-size-start.yml run of the
# same push, and in the pull request's group its end would cancel the run that
# measures the push. The group's expression repeats the job's condition.
concurrency:
  group: >-
    pr-size-${{ (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0]
    && (github.event.workflow_run.name == 'pr-size-start' && github.event.workflow_run.conclusion == 'success'
    || github.event.workflow_run.name == 'tests' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')))
    && github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

# GitHub lists the issue-comment endpoints, which a pull request's comments
# use, under both the issues and the pull-requests permissions. A run's jobs
# and artifacts take actions: read.
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  size:
    # The job measures for a run that a pull request started, which GitHub names
    # in the run's pull_requests. A pr-size-start.yml run measures when it
    # succeeded, and one that an edit of the title or body skipped measures
    # nothing. A tests run measures when it passed or failed. One that ended
    # skipped, as a draft's does, or cancelled brings no finished suite, and the
    # pr-size-start.yml run of its push has measured that push.
    if: >-
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0]
      && (github.event.workflow_run.name == 'pr-size-start' && github.event.workflow_run.conclusion == 'success'
      || github.event.workflow_run.name == 'tests' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default branch at its tip, and every branch with its history, so
      # the branch the pull request merges into and the merge base are here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # pr-size.sh reads the pull request's head and the branch it merges into
      # from the pull request, and measures from that branch's tip as the
      # checkout fetched it. GITHUB_SHA is the default branch's tip, which is
      # not the base of a pull request into another branch.
      - name: Post the pull request's size
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: >-
          bash .github/workflows/pr-size.sh
          --repo "${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
