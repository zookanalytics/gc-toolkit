name: tests

# Runs every test in the repository off-host on pull requests to main and on
# pushes to main, so the tests gate changes without loading the pool host, and a
# regression that lands is still caught. Each job runs the repository's
# all-tests command, `make test` (tools/test.sh says what it runs): the Go
# tests, the board web app's checks and every shell suite. It runs twice, on
# Linux (test) and on macOS (test-macos). The city's host is macOS, where sed,
# grep, awk, date, stat, find and the rest of the userland are the BSD tools,
# and ps, lsof, flock and process groups are the host's, so a construct that
# passes on Linux and fails under the host's tools fails the macOS check the way
# it fails on the host.
# docs/review-correctness.md says what each gate runs, these jobs among them, so
# a change to what a job runs changes that page too.
# A draft pull request runs no tests. That saves Actions minutes while a change
# is still taking follow-up commits. Marking the pull request ready, or pushing
# to it once ready, runs them. The draft flag carries no workflow state; it is
# only a CI-cost lever here.
# The tests are hermetic: each stubs gc/bd and works in its own temp dir, so a
# runner needs no gc binary and no running city. They need bash 5, git, jq 1.8
# or later, timeout(1), flock(1), lsof, a Python with tomllib, a Ruby with
# Psych, make, the Go toolchain the setup-go step installs, and the Node the
# setup-node step installs. Psych is the YAML parser Ruby ships, and
# action-pins.test.sh reads the workflows with it. The Linux job installs its
# jq and takes the rest from ubuntu-latest; the macOS job installs what its
# image lacks.
# Main's ruleset names the checks that gate a merge by job id, and every job
# here is one of them, so adding, removing or renaming a job, or giving it a
# name: or a matrix, changes the checks a merge waits on.
# A job the ruleset requires skips only a draft. The city's merge counts no
# skipped result (services/gctk/pr/rules.go), so a job that a condition of its
# own skipped at a ready head would hold that pull request's merge.
# Each job keeps each shell suite run's seconds, in its job summary and as the
# artifact suite-times-<job>, whether the tests passed or failed. pr-size.yml
# reads them when a pull request's run of this workflow ends in success or
# failure, for the size comment's section on the suite's time (suite-time.sh).
# They fail no check.

on:
  pull_request:
    branches: [main]
    # Specifying types replaces GitHub's default set, so opened/synchronize/
    # reopened are kept explicitly; ready_for_review runs the tests when a
    # draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # A draft pull request skips the tests. A push to main and a manual
    # dispatch carry no pull_request context, so the event-name guard runs
    # them anyway.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Each job, not the workflow, holds a concurrency group. A job that a draft
    # skips never starts, so it cancels nothing, and a draft's run cannot cancel
    # the run that marking the pull request ready started. Jobs of one run that
    # shared a group would cancel each other, so each group names its job by
    # the id written in, since github.job is null outside a job's steps.
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Go tests, and the shell suites whose scripts reach lifecycle.sh,
      # which execs gctk and has no other implementation, build from source.
      # go.mod names the toolchain version. A build downloads gctk's few
      # modules, cobra and what it needs, so the job keeps no module cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The web app's checks run under the host's Node major. npm ci installs
      # its packages from package-lock.json, so the job keeps no npm cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # The host resolves Homebrew's jq first on PATH, and it is 1.8.2. This
      # image's jq is the one its Ubuntu release ships, so the job installs
      # 1.8.2 from the jq release, checks it against the SHA-256 pinned here,
      # and puts it ahead of the image's jq on PATH.
      - name: Install jq 1.8.2
        env:
          JQ_VERSION: "1.8.2"
          JQ_SHA256: "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f"
        run: |
          dir="$RUNNER_TEMP/jq-$JQ_VERSION"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/jq" "https://github.com/jqlang/jq/releases/download/jq-$JQ_VERSION/jq-linux-amd64"
          echo "$JQ_SHA256  $dir/jq" | sha256sum -c - \
            || { echo "::error::the jq $JQ_VERSION download does not match its pinned SHA-256"; exit 1; }
          chmod +x "$dir/jq"
          echo "$dir" >> "$GITHUB_PATH"

      # A PATH change reaches only the steps after the one that makes it, so
      # the jq the tests resolve is checked in a step of its own.
      - name: Check the runner resolves jq 1.8 or later
        run: bash .github/workflows/check-jq.sh

      # The runner serves this job alone, so the shell suites take every core.
      # run-tests.sh defaults to half of them, which leaves a shared host's
      # agents room, and at that count this job runs about twice as long.
      - name: Run every test
        run: make test RUN_TESTS_FLAGS="-j $(getconf _NPROCESSORS_ONLN) --seconds $RUNNER_TEMP/suite-times.tsv"

      # Each run's seconds, kept whether the tests passed or failed. Keeping
      # them fails no check: a step here that fails leaves the job's result to
      # the tests.
      - name: Show each run's seconds
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash .github/workflows/suite-time.sh summary "$RUNNER_TEMP/suite-times.tsv" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: suite-times-${{ github.job }}
          path: ${{ runner.temp }}/suite-times.tsv
          if-no-files-found: ignore

  test-macos:
    # The same draft gate as test.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # A concurrency group of its own, as test's comment says.
    concurrency:
      group: ${{ github.workflow }}-test-macos-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-latest
    # The same tests take the macOS runner more than twice as long as
    # ubuntu's, so its limit is higher.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Go toolchain as test.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The same Node as test.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # The image's only bash is /bin/bash 3.2. run-tests.sh needs bash 5, and
      # it runs each suite with the first bash on PATH. Scripts under test
      # bound calls with timeout(1), and refinery-reconcile.sh and gc-helm.sh's
      # accept take their locks with flock(1); macOS ships neither, and the pr
      # package's Go lock test runs flock(1) against the record lock.
      # tmux-intake-prompt.test.sh runs tmux-bindings.sh under /bin/sh against
      # a real tmux server, and skips that case without tmux. The host
      # installs each from Homebrew.
      # coreutils links only the GNU names macOS lacks, such as timeout and
      # nproc, and installs the rest under a g prefix, so date, stat, touch
      # and the like stay BSD.
      - name: Install bash 5, coreutils, flock and tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: brew install bash coreutils flock tmux

      # This job tests the BSD userland only while the runner resolves the
      # tools the host does. Without a tomllib python3, the suites that read
      # TOML skip and still pass, and without tmux or lsof a case does the
      # same; a Go test that starts a host tool skips without it too, as
      # gctk's host adapter does without lsof, the pr package's lock test
      # without flock, and the board's tests that answer from the stub store
      # without bash or jq. A GNU tool ahead of /usr/bin on PATH lets a
      # GNU-only construct pass, and a jq older than 1.8 rejects programs the
      # host's jq compiles. Any such drift fails this step by name instead.
      - name: Check the runner resolves the host's tools
        run: |
          sw_vers
          fail=0
          v="$(env bash -c 'echo "${BASH_VERSINFO[0]}"')"
          [ "${v:-0}" -ge 5 ] || { echo "::error::env bash is bash ${v:-unknown}; the suite needs bash 5"; fail=1; }
          env bash --version | head -n 1
          python3 -c 'import sys, tomllib; print(sys.executable, sys.version.split()[0], "has tomllib")' \
            || { echo "::error::python3 ($(command -v python3)) has no tomllib"; fail=1; }
          bash .github/workflows/check-jq.sh || fail=1
          for t in go git timeout flock tmux lsof make node npm; do
            p="$(command -v "$t")" || { echo "::error::$t is not on PATH"; fail=1; continue; }
            echo "$t: $p"
          done
          for t in sed grep awk find date stat xargs du cut head tail ps readlink realpath cp ln install mktemp touch wc sort tr; do
            p="$(command -v "$t")" || p=""
            case "$p" in
              /usr/bin/*|/bin/*) ;;
              *) echo "::error::$t resolves to '${p:-nothing}', not the BSD tool in /usr/bin or /bin"; fail=1 ;;
            esac
          done
          exit "$fail"

      # Every core, as in test. Half of this runner's three cores is one job,
      # and the suite's runs, one after another, take longer than
      # timeout-minutes allows.
      - name: Run every test
        run: make test RUN_TESTS_FLAGS="-j $(getconf _NPROCESSORS_ONLN) --seconds $RUNNER_TEMP/suite-times.tsv"

      # The same seconds as test keeps.
      - name: Show each run's seconds
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash .github/workflows/suite-time.sh summary "$RUNNER_TEMP/suite-times.tsv" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: suite-times-${{ github.job }}
          path: ${{ runner.temp }}/suite-times.tsv
          if-no-files-found: ignore
