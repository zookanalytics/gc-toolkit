name: tests

# Runs the pack's *.test.sh suite off-host on pull requests to main and on
# pushes to main, so the suite gates changes without loading the polecat
# self-review or the pool host, and a regression that lands is still caught.
# A draft pull request does not run the suite. That saves Actions minutes while
# a change is still taking follow-up commits. Marking the pull request ready, or
# pushing to it once ready, runs the suite. The draft flag carries no workflow
# state; it is only a CI-cost lever here.
# The suite is hermetic: each test stubs gc/bd and works in its own temp dir,
# so the runner image needs no gc binary and no running city — only bash, git,
# jq (preinstalled on ubuntu-latest) and a Go toolchain for the gctk build that
# lifecycle.test.sh exercises.

on:
  pull_request:
    branches: [main]
    # Specifying types replaces GitHub's default set, so opened/synchronize/
    # reopened are kept explicitly; ready_for_review runs the suite when a
    # draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Only the latest commit on a ref needs a result; cancel superseded runs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A draft pull request skips the suite. A push to main and a manual
    # dispatch carry no pull_request context, so the event-name guard runs
    # them anyway.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # lifecycle.test.sh builds services/gctk from source; the rest of the
      # suite is shell-only. go.mod names the toolchain version. gctk is
      # stdlib-only (no go.sum), so module caching has nothing to cache.
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gctk/go.mod
          cache: false

      - name: Run the *.test.sh suite in parallel
        run: bash tools/run-tests.sh
