name: tests

# Runs the pack's *.test.sh suite off-host on pull requests to main and on
# pushes to main, so the suite gates changes without loading the polecat
# self-review or the pool host, and a regression that lands is still caught.
# The suite runs twice, on Linux (test) and on macOS (test-macos). The city's
# host is macOS, where sed, grep, awk, date, stat, find and the rest of the
# userland are the BSD tools, so a GNU-only construct that passes on Linux
# fails the macOS job the way it fails on the host.
# A draft pull request does not run the suite. That saves Actions minutes while
# a change is still taking follow-up commits. Marking the pull request ready, or
# pushing to it once ready, runs the suite. The draft flag carries no workflow
# state; it is only a CI-cost lever here.
# The suite is hermetic: each test stubs gc/bd and works in its own temp dir,
# so a runner needs no gc binary and no running city. It needs bash 5, git,
# jq, timeout(1), flock(1), a Python with tomllib, and the Go toolchain the
# setup-go step installs for the gctk builds that several suites make.
# ubuntu-latest preinstalls the rest; the macOS job installs what its image
# lacks.
# Main's ruleset names the checks that gate a merge by job id, so renaming a
# job, or giving it a name: or a matrix, changes the check a merge waits on.

on:
  pull_request:
    branches: [main]
    # Specifying types replaces GitHub's default set, so opened/synchronize/
    # reopened are kept explicitly; ready_for_review runs the suite when a
    # draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Only the latest commit on a ref needs a result; cancel superseded runs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A draft pull request skips the suite. A push to main and a manual
    # dispatch carry no pull_request context, so the event-name guard runs
    # them anyway.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # lifecycle.sh execs gctk and has no other implementation, so every
      # suite whose scripts reach it builds services/gctk from source, and so
      # does pr-status-label.test.sh; the rest of the suite is shell-only.
      # go.mod names the toolchain version. gctk is stdlib-only (no go.sum), so
      # module caching has nothing to cache.
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gctk/go.mod
          cache: false

      # The runner serves this job alone, so the suite takes every core.
      # run-tests.sh defaults to half of them, which leaves a shared host's
      # agents room, and at that count this job runs about twice as long.
      - name: Run the *.test.sh suite in parallel
        run: bash tools/run-tests.sh -j "$(getconf _NPROCESSORS_ONLN)"

  test-macos:
    # The same draft gate as test.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    # The same suite takes the macOS runner more than twice as long as
    # ubuntu's, so its limit is higher.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The same gctk toolchain as test.
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gctk/go.mod
          cache: false

      # The image's only bash is /bin/bash 3.2. run-tests.sh needs bash 5, and
      # it runs each suite with the first bash on PATH. run-tests.sh bounds
      # each run with timeout(1), and refinery-reconcile.sh takes its lock
      # with flock(1); macOS ships neither. tmux-visit-prompt.test.sh runs
      # tmux-bindings.sh under /bin/sh against a real tmux server, and skips
      # that case without tmux. The host installs all four from Homebrew.
      # coreutils links only the GNU names macOS lacks, such as timeout and
      # nproc, and installs the rest under a g prefix, so date, stat, touch
      # and the like stay BSD.
      - name: Install bash 5, coreutils, flock and tmux
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: brew install bash coreutils flock tmux

      # This job tests the BSD userland only while the runner resolves the
      # tools the host does. Without a tomllib python3, the suites that read
      # TOML skip and still pass, and without tmux one case does the same. A
      # GNU tool ahead of /usr/bin on PATH lets a GNU-only construct pass. Any
      # such drift fails this step by name instead.
      - name: Check the runner resolves the host's tools
        run: |
          sw_vers
          fail=0
          v="$(env bash -c 'echo "${BASH_VERSINFO[0]}"')"
          [ "${v:-0}" -ge 5 ] || { echo "::error::env bash is bash ${v:-unknown}; the suite needs bash 5"; fail=1; }
          env bash --version | head -n 1
          python3 -c 'import sys, tomllib; print(sys.executable, sys.version.split()[0], "has tomllib")' \
            || { echo "::error::python3 ($(command -v python3)) has no tomllib"; fail=1; }
          for t in jq go git timeout flock tmux; do
            p="$(command -v "$t")" || { echo "::error::$t is not on PATH"; fail=1; continue; }
            echo "$t: $p"
          done
          for t in sed grep awk find date stat xargs du cut head tail ps readlink realpath cp ln install mktemp touch wc sort tr; do
            p="$(command -v "$t")" || p=""
            case "$p" in
              /usr/bin/*|/bin/*) ;;
              *) echo "::error::$t resolves to '${p:-nothing}', not the BSD tool in /usr/bin or /bin"; fail=1 ;;
            esac
          done
          exit "$fail"

      # Every core, as in test. Half of this runner's three cores is one job,
      # and the suite's runs, one after another, take longer than
      # timeout-minutes allows.
      - name: Run the *.test.sh suite in parallel
        run: bash tools/run-tests.sh -j "$(getconf _NPROCESSORS_ONLN)"
