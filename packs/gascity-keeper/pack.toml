# gascity-keeper — opt-in sub-pack for the gascity rig.
#
# Bundles the keeper agent (operator front-end for upstream sync /
# rebase / PR-prep workflows), its supporting formulas (the
# `mol-upstream-gc-*` family), and the rebase doctrine that the
# polecats in a fork-bearing rig need.
#
# Imports nothing on its own. The patch below targets an agent that
# the importing rig pulled in via gc-toolkit (polecat), so this pack
# only composes correctly when loaded alongside the gc-toolkit core
# pack.
#
# Imported only by the gascity rig — the rig that maintains the
# `zookanalytics/gascity ← gastownhall/gascity` fork. Other rigs
# that import gc-toolkit (gc-toolkit's own rig, or any other rig
# pulling in gc-toolkit purely for its skills/prompts) do NOT
# pick this up.

[pack]
name = "gascity-keeper"
schema = 2

# The sub-pack ships the keeper, its `mol-upstream-gc-*` formulas, and
# the gascity-rig-specific fragments (rebase-conventions,
# polecat-patterns). It does NOT carry `[[patches.agent]]` blocks:
# sub-pack patches can only target agents the sub-pack itself imports,
# and importing gastown here would duplicate gastown's agents under the
# `gascity-keeper` binding (so the gc-toolkit-patched polecat gets
# shadowed by a bare gastown copy). The right home for the
# fragment-injection patch is the importing city/rig — the importing
# city's `city.toml` carries a `[[rigs.patches]]` block for the gascity
# rig alongside `[rigs.imports.gascity-keeper]`.

# template-fragments/ also holds symlinks to the root-pack fragments
# the keeper prompt composes (watch-dispatched-work, where-to-search,
# work-quality-base, work-quality-system), so the text keeps one
# source. In the gascity rig both packs are composed and either copy
# renders the same bytes. Outside a city nothing composes them:
# `gc lint` there loads only the linted pack's own fragments, and the
# links are what resolve the keeper prompt. A root fragment the keeper
# prompt starts composing needs a link here too, or standalone lint
# reports `template "<name>" not defined`.

# For the broader gc-toolkit install context (importing gc-toolkit,
# `[[rigs.overrides]]`, verification with `gc doctor`), see
# `docs/install.md` in the gc-toolkit repo root.

# Example wiring (in the importing city's `city.toml`):
#
#   [[rigs]]
#   name = "<rig-name>"  # the rig that should run the keeper
#
#   [rigs.imports.gc-toolkit]
#   source = "<path-to-your-gc-toolkit-checkout>"
#
#   [rigs.imports.gascity-keeper]
#   source = "<path-to-your-gc-toolkit-checkout>/packs/gascity-keeper"
#
#   [[rigs.patches]]
#   agent = "polecat"
#   inject_fragments_append = ["rebase-conventions", "polecat-patterns"]
#
# `rebase-conventions` is the polecat-facing doctrine (classification,
# check loop, conflict policy, resume, and how a finished rebase lands).
# The refinery takes no rebase fragment: the operator force-pushes each
# rebase onto main from the human gate the rebase formula files, so a
# rebase never reaches the refinery.
#
# The `[[rigs.patches]]` block is nested inside the `[[rigs]]` block
# (TOML scoping), so it applies to that one rig only. After editing
# city.toml, run `gc config show` to confirm the keeper resolves as
# `<rig-name>/gascity-keeper.keeper` and the fragments compose into the
# rig's polecat.

# Materialise the keeper on demand in whichever rig imports this pack.
# The agent ships as bare `keeper` inside the sub-pack; the binding
# qualifier comes from the import (e.g., `gascity-keeper.keeper`),
# and the rig prefix from the importing rig (`gascity/gascity-keeper.keeper`).
[[named_session]]
template = "keeper"
scope = "rig"
mode = "on_demand"
