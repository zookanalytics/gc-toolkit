description = """
Rework a single conflicted kept commit during a gascity upstream rebase
(dispatched by `mol-upstream-gc-rebase` v11 mid-rebase; v12 resolves
conflicts inline and does not use this formula).

A focused polecat re-implements the conflicted commit's *intent* against
the new upstream layer in the parent's shared mid-rebase worktree
(`metadata.work_dir` — `.git/rebase-merge/` state is left intact for the
parent to resume), classifies the outcome, and the parent acts on the
classification:

- **mechanical** — intent transfers cleanly; apply and commit.
- **dropped-absorbed** — upstream provides or supersedes it; leave clean,
  parent will `git rebase --skip`.
- **judgment-required** — rework needed a design call; commit AND
  self-report so the parent dispatches a review polecat first.
- **infeasible** — cannot proceed from this context; hand back to the
  keeper with a question for the operator.

Extends `mol-polecat-base` for `load-context` only — the rest of the
polecat-work chain does not apply: this mol shares the parent's worktree
and pushes no branch. Dispatch metadata stamped by the parent: `work_dir`,
`rebase_bead`, `requesting_keeper`, `commit_sha`, `commit_subject`,
`conflicted_files`, `context_file`. Any setup failure (worktree missing,
mid-rebase state unreadable, commit drift) resolves to
`classification=infeasible` with `infeasible_reason`, close, nudge keeper."""
formula = "mol-upstream-gc-rebase-rework"
extends = ["mol-polecat-base"]
version = 1

[vars]
[vars.issue]
description = "The rework bead assigned to this polecat"
required = true

[vars.rebase_bead]
description = "The parent rebase bead (also stamped as metadata.rebase_bead on the rework bead)"
required = true

[vars.requesting_keeper]
description = "Keeper agent address to nudge on completion (also stamped as metadata.requesting_keeper)"
required = true

[[steps]]
id = "workspace-setup"
title = "Enter the shared rebase worktree and verify the mid-rebase target commit"
needs = ["load-context"]
description = """
Reuse the parent rebase polecat's worktree. Do NOT create a new one.
Do NOT touch `.git/rebase-merge/` — the parent expects to resume.

**1. Read the dispatch metadata:**
```bash
WORK_DIR=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.work_dir // empty')
REBASE_BEAD=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.rebase_bead // empty')
REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper // empty')
TARGET_SHA=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.commit_sha // empty')
CONTEXT_FILE=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.context_file // empty')
CONFLICTED_FILES=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.conflicted_files // "[]"')
```

If any of `WORK_DIR`, `REBASE_BEAD`, `REQUESTING_KEEPER`, `TARGET_SHA`
are empty, the dispatch was malformed — close with
`metadata.classification=infeasible`, `metadata.infeasible_reason="missing
dispatch metadata"`, nudge `{{requesting_keeper}}`, drain.

**2. Enter the shared worktree** (`cd "$WORK_DIR"`). If the directory
does not exist: `classification=infeasible`,
`infeasible_reason="shared worktree missing at $WORK_DIR"`, drain.

**3. Verify the mid-rebase target matches our assignment.** Defensive:
stale mid-rebase state from a different commit is possible. Never
`git rebase --abort` our own assignment.

```bash
if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
    IN_PROGRESS_SHA=$(git rev-parse REBASE_HEAD 2>/dev/null \
        || cat "$(git rev-parse --git-path rebase-merge)/stopped-sha" 2>/dev/null \
        || cat "$(git rev-parse --git-path rebase-apply)/original-commit" 2>/dev/null \
        || echo "")
    if [ -z "$IN_PROGRESS_SHA" ]; then
        gc bd update {{issue}} \
            --set-metadata classification=infeasible \
            --set-metadata infeasible_reason="mid-rebase state present but in-progress commit unidentifiable"
        gc bd close {{issue}} --reason "infeasible: mid-rebase state unreadable"
        gc session nudge "$REQUESTING_KEEPER" "rework {{issue}} infeasible (mid-rebase unreadable); rebase $REBASE_BEAD needs re-pour"
        gc runtime drain-ack
        exit 0
    fi
    # Match by prefix (REBASE_HEAD is a full sha; TARGET_SHA may be short).
    case "$IN_PROGRESS_SHA" in
        ${TARGET_SHA}*) : ;;  # match — proceed
        *)
            gc bd update {{issue}} \
                --set-metadata classification=infeasible \
                --set-metadata infeasible_reason="mid-rebase commit $IN_PROGRESS_SHA != assigned $TARGET_SHA"
            gc bd close {{issue}} --reason "infeasible: mid-rebase commit drift"
            gc session nudge "$REQUESTING_KEEPER" "rework {{issue}} infeasible (commit drift); rebase $REBASE_BEAD needs re-pour"
            gc runtime drain-ack
            exit 0
            ;;
    esac
else
    gc bd update {{issue}} \
        --set-metadata classification=infeasible \
        --set-metadata infeasible_reason="shared worktree is not mid-rebase"
    gc bd close {{issue}} --reason "infeasible: shared worktree not mid-rebase"
    gc session nudge "$REQUESTING_KEEPER" "rework {{issue}} infeasible (not mid-rebase); rebase $REBASE_BEAD needs re-pour"
    gc runtime drain-ack
    exit 0
fi
```

**Exit criteria:** cwd is the shared mid-rebase worktree; the in-progress
commit matches `metadata.commit_sha`; rebase state is untouched.
"""

[[steps]]
id = "preflight-tests"
title = "Skip — rework polecat operates inside a mid-rebase worktree"
needs = ["workspace-setup"]
description = """
Checks inside a mid-rebase worktree would conflate the rebase's failure
surface with the rework's; the parent's post-rebase `check` step covers
the full kept stack. Close this step and proceed."""

[[steps]]
id = "implement"
title = "Skip — replaced by classify-and-rework"
needs = ["preflight-tests"]
description = """
The actual work lives in `classify-and-rework`. Close this step and
proceed."""

[[steps]]
id = "self-review"
title = "Skip — replaced by classify-and-rework's commit shape"
needs = ["implement"]
description = """
The commit shape and bead-metadata report are this formula's review
surface; the parent's `check`/`install` verify the full stack. Close this
step and proceed."""

[[steps]]
id = "classify-and-rework"
title = "Read the conflict context, classify, do the rework (or skip), commit"
needs = ["self-review"]
description = """
Read the context, decide the classification, act, and self-report so the
parent can route on re-entry without re-deriving your reasoning.

**1. Read the context.**

```bash
CONTEXT_FILE=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.context_file')
TARGET_SHA=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.commit_sha')
TARGET_SUBJECT=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.commit_subject')
CONFLICTED_FILES=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.conflicted_files')

cat "$CONTEXT_FILE"
git status --short
```

The context file carries the kept commit's full body, the conflicted
files' status, the raw conflict markers, upstream's recent diffs touching
the same files, and the goal-not-implementation framing.

**2. Classify.** Fork commits represent goals, not literal
implementations; when upstream solves the underlying problem its own way,
the strategic goal is to shrink the custom-commit surface. Pick exactly
one:

- **mechanical** — the intent transfers cleanly; only anchors,
  identifiers, or surrounding code shifted. No design call.
- **dropped-absorbed** — upstream already provides the behavior or removed
  the surface; drop the **entire** commit.
- **judgment-required** — the rework requires a design call (multiple
  reasonable applications, public API change, behavior choice, broken
  original assumption). Do the rework AND self-report for review.
- **infeasible** — cannot complete from this context (missing deps, scope
  exploded, context exhaustion approaching, intent conflicts with
  upstream's direction and needs operator input).

**3. Act on the classification.**

### mechanical

Apply the equivalent change on the new layer (remove conflict markers,
write the intended new state), then:

```bash
git add -- $(printf '%s' "$CONFLICTED_FILES" | jq -r '.[]')
git commit --no-verify -m "rework $(printf '%s' "$TARGET_SHA" | cut -c1-12): $TARGET_SUBJECT (per {{issue}})

Original commit's intent ported to post-upstream code in the shared
rebase worktree. See {{issue}} for context and metadata.classification."

FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD | jq -R . | jq -s .)
gc bd update {{issue}} \
    --set-metadata classification=mechanical \
    --set-metadata files_changed="$FILES_CHANGED" \
    --notes "Mechanical rework of $TARGET_SHA. Files: $(printf '%s' "$FILES_CHANGED" | jq -r '. | join(", ")')"
```

### dropped-absorbed

The whole commit goes — including anything that rode along. Do NOT
cherry-pick adjacent changes, back-port tests written against the
now-fixed-upstream bug, or preserve refactors that happened to ride along;
a piece with genuinely independent value gets a NEW bead and lands on its
own merits, never smuggled through the rebase as commit-preservation.

Do NOT commit. Reset so the index is clean; the parent will
`git rebase --skip`:

```bash
git reset --hard HEAD

gc bd update {{issue}} \
    --set-metadata classification=dropped-absorbed \
    --notes "Upstream already provides this behavior or supersedes the commit. Recommended action: git rebase --skip. Rationale: <one to three sentences>."
```

### judgment-required

Apply the rework you believe is correct (same shape as `mechanical`),
commit, AND self-report the judgment — the parent dispatches a review
polecat against this commit before `git rebase --continue`:

```bash
git add -- $(printf '%s' "$CONFLICTED_FILES" | jq -r '.[]')
git commit --no-verify -m "rework $(printf '%s' "$TARGET_SHA" | cut -c1-12): $TARGET_SUBJECT (per {{issue}})

Original commit's intent ported to post-upstream code in the shared
rebase worktree. Classification: judgment-required (review pending).
See {{issue}} for context and metadata.judgment_summary."

FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD | jq -R . | jq -s .)
gc bd update {{issue}} \
    --set-metadata classification=judgment-required \
    --set-metadata files_changed="$FILES_CHANGED" \
    --set-metadata judgment_summary="<one to three sentences describing the design call you made and the alternatives considered>" \
    --notes "Judgment-required rework of $TARGET_SHA. See metadata.judgment_summary."
```

### infeasible

Do NOT commit. Leave the worktree as-is (mid-rebase, conflicts
unresolved); the parent hands the rebase bead back to the keeper with
your reason surfaced:

```bash
gc bd update {{issue}} \
    --set-metadata classification=infeasible \
    --set-metadata infeasible_reason="<concise one-liner: missing dep / scope too broad / context exhausted / operator input needed>" \
    --notes "Infeasible: <full explanation with what's blocking and what the operator should consider>."
```

**4. Close the rework bead and nudge the keeper:**

```bash
REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper')
REBASE_BEAD=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.rebase_bead')
CLASSIFICATION=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.classification')

gc bd close {{issue}} --reason "Rework classified: $CLASSIFICATION"
gc session nudge "$REQUESTING_KEEPER" "rework {{issue}} done ($CLASSIFICATION); rebase $REBASE_BEAD ready to re-pour"
gc runtime drain-ack
exit 0
```

**Exit criteria:** `metadata.classification` is one of the four values;
the worktree state matches it (committed for mechanical/judgment-required,
clean for dropped-absorbed, untouched for infeasible); the rework bead is
closed; the keeper has been nudged."""
