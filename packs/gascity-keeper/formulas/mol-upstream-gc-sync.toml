description = """
Detect upstream-gascity drift in the vendored gastown pack. Read-only —
walks `agents/*/PROVENANCE.md`, asks the gascity rig what's changed since
each pinned commit, writes a markdown report into bead notes plus a
referenced file. No file mutation, no pin bumps (apply and pin-bump are
follow-up mols).

Extends `mol-polecat-base` for `load-context`, but replaces the
`implement / self-review` chain with a single `survey` step that drives
`tools/upstream-gc-sync.sh`, then a `report-and-close` step that persists
the output and closes the bead. Every abort path hands the bead to its
owner. A keeper that `{{notify_recipient}}` names is assigned the bead, with the
failure tail in its notes and `metadata.aborted_at` naming the step, and its
mail requests its turn. With no keeper named, or `human`, a person is asked
through a human gate the bead waits on, and clearing it runs the sync again."""
formula = "mol-upstream-gc-sync"
extends = ["mol-polecat-base"]
version = 3

[vars]
[vars.upstream_rig]
description = "Upstream rig name (resolved via 'gc rig list --json')"
default = "gascity"

[vars.upstream_ref]
description = "Ref in the upstream rig to compare each pin against"
default = "origin/main"

[vars.sync_script]
description = "Drift-detector script path (relative to the pack root)"
default = "tools/upstream-gc-sync.sh"

[vars.with_diff]
description = "If '1', the report includes per-agent unified diffs"
default = "0"

[vars.notify_recipient]
description = "Optional mail address to notify with the report (e.g., human, gascity/gascity-keeper.keeper). Empty = skip mail."
default = ""

[vars.binding_prefix]
description = "The binding the city imports gc-toolkit under, with its trailing dot. This sub-pack's formulas run on gc-toolkit's polecats, so gc sling pours them with that binding, and a step drops the dot to call the pack's scripts as gc <binding> scripts-dir prints them."
default = "gc-toolkit."

[[steps]]
id = "workspace-setup"
title = "Set up gc-toolkit worktree (read-only — no branch needed)"
needs = ["load-context"]
description = """
Read-only mol: no feature branch. The worktree gives the survey script a
deterministic pack-root CWD and keeps concurrent sync runs from colliding.

**1. Reuse or create the worktree:**

```bash
WORKTREE=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.work_dir // empty')
```

If `WORKTREE` is non-empty and points to an existing directory, `cd`
there and skip to step 2. Otherwise:
```bash
WORKTREE_PATH="$(pwd)/worktrees/{{issue}}"
# >>> upstream-sync-worktree-add
# The worktree belongs to this rig's checkout (not the upstream rig step 2
# fetches), named by path so the session's cwd cannot pick the repo. An empty
# root would let `git -C ""` follow cwd, so an unresolvable rig fails closed.
OWN_RIG_ROOT=$("$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/rig-root.sh")
[ -n "$OWN_RIG_ROOT" ] || { echo "workspace-setup: cannot resolve the rig root" >&2; exit 1; }
git -C "$OWN_RIG_ROOT" fetch --prune origin
git -C "$OWN_RIG_ROOT" worktree add "$WORKTREE_PATH" --detach "origin/{{base_branch}}"
# <<< upstream-sync-worktree-add
cd "$WORKTREE_PATH"
gc bd update {{issue}} --set-metadata work_dir="$WORKTREE_PATH"
```

**2. Fetch upstream rig** (fresh, so the report reflects current upstream):
```bash
RIG_ROOT=$("$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/rig-root.sh" --rig "{{upstream_rig}}")
[ -n "$RIG_ROOT" ] && git -C "$RIG_ROOT" fetch --prune origin
```

If `{{upstream_rig}}` is not registered in this city (rig-root.sh prints
nothing, so the line exits non-zero instead of letting `git -C ""` fetch the
current directory's repository), the sync stops and hands the bead to its
owner. A keeper is assigned it with the failure in its notes and mailed with
`--notify`, which requests its turn, and the session drains. A person is asked
through a human gate in one call, which makes the bead wait on the gate, armed
to run the sync again once it clears, then ends the run and drains:
```bash
case "{{notify_recipient}}" in
""|human)
    "$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/decline.sh" --step mol-upstream-gc-sync.workspace-setup \
        --reason "upstream rig {{upstream_rig}} is not registered in this city" \
        --subject {{issue}} --key upstream-gc-sync-no-rig \
        --message "mol-upstream-gc-sync stopped at workspace-setup: upstream rig '{{upstream_rig}}' is not registered in this city, so no drift report was generated. Register the rig, or retarget this bead." \
        --formula mol-upstream-gc-sync ;;
*)
    gc bd update {{issue}} \
        --set-metadata aborted_at=workspace-setup \
        --status=open \
        --assignee="{{notify_recipient}}" \
        --append-notes "Upstream rig '{{upstream_rig}}' not present in this city; cannot generate drift report."
    gc mail send "{{notify_recipient}}" --notify -s "upstream-gc-sync: {{issue}} stopped at workspace-setup" \
        -m "Upstream rig '{{upstream_rig}}' is not registered in this city. {{issue}} is assigned to you, and its notes say why."
    gc runtime drain-ack ;;
esac
```

**Exit criteria:** worktree exists at `metadata.work_dir`; upstream
rig `{{upstream_rig}}` has been fetched."""

[[steps]]
id = "preflight-tests"
title = "Skip — sync variant is read-only"
needs = ["workspace-setup"]
description = """
No code changes, tests, or builds in this mol. Close this step and proceed."""

[[steps]]
id = "implement"
title = "Skip — replaced by survey step"
needs = ["preflight-tests"]
description = """
The work for this formula is the `survey` step below. Close this step
and proceed."""

[[steps]]
id = "self-review"
title = "Skip — replaced by survey step"
needs = ["implement"]
description = """
No implementation diff to review — the report is the deliverable. Close
this step and proceed."""

[[steps]]
id = "survey"
title = "Run the drift-detector script and capture the report"
needs = ["workspace-setup"]
description = """
Drive `{{sync_script}}` against the upstream rig, capturing stdout to a
report file under the worktree.

**1. Verify the script is present and executable.** When it is not, the sync
stops and hands the bead to its owner, as workspace-setup's stop does:
```bash
if [ ! -x "{{sync_script}}" ]; then
    case "{{notify_recipient}}" in
    ""|human)
        "$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/decline.sh" --step mol-upstream-gc-sync.survey \
            --reason "no executable drift detector at {{sync_script}}" \
            --subject {{issue}} --key upstream-gc-sync-no-detector \
            --message "mol-upstream-gc-sync stopped at survey: no executable drift detector at {{sync_script}}, so no drift report was generated. Install one at the configured sync_script path." \
            --formula mol-upstream-gc-sync ;;
    *)
        gc bd update {{issue}} \
            --set-metadata aborted_at=survey \
            --status=open \
            --assignee="{{notify_recipient}}" \
            --append-notes "Sync script not found or not executable at {{sync_script}} — pack may not include the drift detector yet."
        gc mail send "{{notify_recipient}}" --notify -s "upstream-gc-sync: {{issue}} stopped at survey" \
            -m "No executable drift detector at {{sync_script}}. {{issue}} is assigned to you, and its notes say why."
        gc runtime drain-ack ;;
    esac
fi
```

**2. Run the script and capture output:**

```bash
RIG_ROOT=$("$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/rig-root.sh" --rig "{{upstream_rig}}")
REPORT_DIR="$(pwd)/.gc/upstream-gc-sync"
mkdir -p "$REPORT_DIR"
REPORT_FILE="$REPORT_DIR/{{issue}}.md"
ERR_FILE="$REPORT_DIR/{{issue}}.err"

EXTRA_ARGS=()
if [ "{{with_diff}}" = "1" ]; then
    EXTRA_ARGS+=(--with-diff)
fi

if "{{sync_script}}" \
        --rig-path "$RIG_ROOT" \
        --upstream-ref "{{upstream_ref}}" \
        "${EXTRA_ARGS[@]}" \
        > "$REPORT_FILE" 2> "$ERR_FILE"; then
    gc bd update {{issue}} --set-metadata report_file="$REPORT_FILE"
else
    # The failure goes to the notes first, so either owner reads it there.
    gc bd update {{issue}} \
        --set-metadata aborted_at=survey \
        --append-notes "$(cat <<EOF
Sync script failed.

Stderr:
$(cat "$ERR_FILE" 2>/dev/null || echo "(stderr capture missing)")

Stdout (if any):
$(cat "$REPORT_FILE" 2>/dev/null || echo "(stdout capture missing)")
EOF
)"
    case "{{notify_recipient}}" in
    ""|human)
        "$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/decline.sh" --step mol-upstream-gc-sync.survey \
            --reason "the drift detector failed on {{upstream_rig}}" \
            --subject {{issue}} --key upstream-gc-sync-detector-failed \
            --message "mol-upstream-gc-sync stopped at survey: the drift detector failed on {{upstream_rig}}, and its stderr and stdout are in this bead's notes. Fix what failed it." \
            --formula mol-upstream-gc-sync ;;
    *)
        gc bd update {{issue}} --status=open --assignee="{{notify_recipient}}"
        gc mail send "{{notify_recipient}}" --notify -s "upstream-gc-sync: {{issue}} stopped at survey" \
            -m "The drift detector failed on {{upstream_rig}}. {{issue}} is assigned to you, and its notes carry the failure."
        gc runtime drain-ack ;;
    esac
fi
```

**Exit criteria:** `metadata.report_file` records the path to the
captured report; the file exists and is non-empty."""

[[steps]]
id = "report-and-close"
title = "Append report to bead notes, optionally mail, close bead, exit"
needs = ["survey"]
description = """
Persist the report so it survives without the worktree, optionally mail a
copy, then close.

**1. Append the report to bead notes** (readable via `gc bd show`, no
filesystem access needed):
```bash
REPORT_FILE=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.report_file')
gc bd update {{issue}} --append-notes "$(cat "$REPORT_FILE")"
```

**2. Optionally mail the report:**
```bash
RECIPIENT="{{notify_recipient}}"
if [ -n "$RECIPIENT" ]; then
    gc mail send "$RECIPIENT" \
        -s "upstream-gc-sync: drift report for {{issue}}" \
        -m "$(cat "$REPORT_FILE")"
fi
```

**3. Close the bead and exit:**
```bash
gc bd close {{issue}} --reason "Drift report generated: $REPORT_FILE"
gc runtime drain-ack
exit 0
```

**Exit criteria:** bead closed; `metadata.report_file` set; notes carry
the markdown body; recipient mailed when `{{notify_recipient}}` was set;
session drained."""
