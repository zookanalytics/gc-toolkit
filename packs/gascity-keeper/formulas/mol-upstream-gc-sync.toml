description = """
Detect upstream-gascity drift in the vendored gastown pack. Read-only —
walks `agents/*/PROVENANCE.md`, asks the gascity rig what's changed since
each pinned commit, writes a markdown report into bead notes plus a
referenced file. No file mutation, no pin bumps (apply and pin-bump are
follow-up mols).

Extends `mol-polecat-base` for `load-context`, but replaces the
`implement / self-review` chain with a single `survey` step that drives
`tools/upstream-gc-sync.sh`, then a `report-and-close` step that persists
the output and closes the bead. Every abort path leaves the bead open,
reassigned to `{{notify_recipient}}` (or `human`), with the failure tail
in notes and `metadata.aborted_at` naming the step."""
formula = "mol-upstream-gc-sync"
extends = ["mol-polecat-base"]
version = 3

[vars]
[vars.upstream_rig]
description = "Upstream rig name (resolved via 'gc rig list --json')"
default = "gascity"

[vars.upstream_ref]
description = "Ref in the upstream rig to compare each pin against"
default = "origin/main"

[vars.sync_script]
description = "Drift-detector script path (relative to the pack root)"
default = "tools/upstream-gc-sync.sh"

[vars.with_diff]
description = "If '1', the report includes per-agent unified diffs"
default = "0"

[vars.notify_recipient]
description = "Optional mail address to notify with the report (e.g., human, gascity/gascity-keeper.keeper). Empty = skip mail."
default = ""

[[steps]]
id = "workspace-setup"
title = "Set up gc-toolkit worktree (read-only — no branch needed)"
needs = ["load-context"]
description = """
Read-only mol: no feature branch. The worktree gives the survey script a
deterministic pack-root CWD and keeps concurrent sync runs from colliding.

**1. Reuse or create the worktree:**

```bash
WORKTREE=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.work_dir // empty')
```

If `WORKTREE` is non-empty and points to an existing directory, `cd`
there and skip to step 2. Otherwise:
```bash
git fetch --prune origin
WORKTREE_PATH="$(pwd)/worktrees/{{issue}}"
git worktree add "$WORKTREE_PATH" --detach "origin/{{base_branch}}"
cd "$WORKTREE_PATH"
gc bd update {{issue}} --set-metadata work_dir="$WORKTREE_PATH"
```

**2. Fetch upstream rig** (fresh, so the report reflects current upstream):
```bash
RIG_ROOT=$(gc rig list --json | jq -r '.rigs[] | select(.name=="{{upstream_rig}}") | .path')
git -C "$RIG_ROOT" fetch --prune origin
```

If `{{upstream_rig}}` is not registered in this city (the `select` prints
empty and the fetch fails loudly), record the failure and abort — the
`--status=open` + reassign + `gc.routed_to` triplet keeps the bead from
stranding `in_progress` on this drained session:
```bash
ABORT_OWNER="{{notify_recipient}}"
[ -z "$ABORT_OWNER" ] && ABORT_OWNER="human"
gc bd update {{issue}} \
    --set-metadata aborted_at=workspace-setup \
    --status=open \
    --assignee="$ABORT_OWNER" \
    --set-metadata gc.routed_to="$ABORT_OWNER" \
    --set-metadata "gc.takeaway=upstream rig '{{upstream_rig}}' is not registered in this city — register it or retarget this bead" \
    --set-metadata "gc.takeaway_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
    --set-metadata gc.takeaway_by=mol-upstream-gc-sync \
    --notes "Upstream rig '{{upstream_rig}}' not present in this city; cannot generate drift report."
gc runtime drain-ack
exit 1
```

**Exit criteria:** worktree exists at `metadata.work_dir`; upstream
rig `{{upstream_rig}}` has been fetched."""

[[steps]]
id = "preflight-tests"
title = "Skip — sync variant is read-only"
needs = ["workspace-setup"]
description = """
No code changes, tests, or builds in this mol. Close this step and proceed."""

[[steps]]
id = "implement"
title = "Skip — replaced by survey step"
needs = ["preflight-tests"]
description = """
The work for this formula is the `survey` step below. Close this step
and proceed."""

[[steps]]
id = "self-review"
title = "Skip — replaced by survey step"
needs = ["implement"]
description = """
No implementation diff to review — the report is the deliverable. Close
this step and proceed."""

[[steps]]
id = "survey"
title = "Run the drift-detector script and capture the report"
needs = ["workspace-setup"]
description = """
Drive `{{sync_script}}` against the upstream rig, capturing stdout to a
report file under the worktree.

**1. Verify the script is present and executable:**
```bash
SCRIPT={{sync_script}}
if [ ! -x "$SCRIPT" ]; then
    ABORT_OWNER="{{notify_recipient}}"
    [ -z "$ABORT_OWNER" ] && ABORT_OWNER="human"
    gc bd update {{issue}} \
        --set-metadata aborted_at=survey \
        --status=open \
        --assignee="$ABORT_OWNER" \
        --set-metadata gc.routed_to="$ABORT_OWNER" \
        --set-metadata "gc.takeaway=the pack ships no runnable drift detector — install one at the configured sync_script path" \
        --set-metadata "gc.takeaway_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --set-metadata gc.takeaway_by=mol-upstream-gc-sync \
        --notes "Sync script not found or not executable at $SCRIPT — pack may not include the drift detector yet."
    gc runtime drain-ack
    exit 1
fi
```

**2. Run the script and capture output:**

```bash
RIG_ROOT=$(gc rig list --json | jq -r '.rigs[] | select(.name=="{{upstream_rig}}") | .path')
REPORT_DIR="$(pwd)/.gc/upstream-gc-sync"
mkdir -p "$REPORT_DIR"
REPORT_FILE="$REPORT_DIR/{{issue}}.md"
ERR_FILE="$REPORT_DIR/{{issue}}.err"

EXTRA_ARGS=()
if [ "{{with_diff}}" = "1" ]; then
    EXTRA_ARGS+=(--with-diff)
fi

if "$SCRIPT" \
        --rig-path "$RIG_ROOT" \
        --upstream-ref "{{upstream_ref}}" \
        "${EXTRA_ARGS[@]}" \
        > "$REPORT_FILE" 2> "$ERR_FILE"; then
    gc bd update {{issue}} --set-metadata report_file="$REPORT_FILE"
else
    ABORT_OWNER="{{notify_recipient}}"
    [ -z "$ABORT_OWNER" ] && ABORT_OWNER="human"
    gc bd update {{issue}} \
        --set-metadata aborted_at=survey \
        --status=open \
        --assignee="$ABORT_OWNER" \
        --set-metadata gc.routed_to="$ABORT_OWNER" \
        --set-metadata "gc.takeaway=drift detector failed on {{upstream_rig}} — read the captured stderr in this bead's notes" \
        --set-metadata "gc.takeaway_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --set-metadata gc.takeaway_by=mol-upstream-gc-sync \
        --notes "$(cat <<EOF
Sync script failed.

Stderr:
$(cat "$ERR_FILE" 2>/dev/null || echo "(stderr capture missing)")

Stdout (if any):
$(cat "$REPORT_FILE" 2>/dev/null || echo "(stdout capture missing)")
EOF
)"
    gc runtime drain-ack
    exit 1
fi
```

**Exit criteria:** `metadata.report_file` records the path to the
captured report; the file exists and is non-empty."""

[[steps]]
id = "report-and-close"
title = "Append report to bead notes, optionally mail, close bead, exit"
needs = ["survey"]
description = """
Persist the report so it survives without the worktree, optionally mail a
copy, then close.

**1. Append the report to bead notes** (readable via `gc bd show`, no
filesystem access needed):
```bash
REPORT_FILE=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.report_file')
gc bd update {{issue}} --notes "$(cat "$REPORT_FILE")"
```

**2. Optionally mail the report:**
```bash
RECIPIENT="{{notify_recipient}}"
if [ -n "$RECIPIENT" ]; then
    gc mail send "$RECIPIENT" \
        -s "upstream-gc-sync: drift report for {{issue}}" \
        -m "$(cat "$REPORT_FILE")"
fi
```

**3. Close the bead and exit:**
```bash
gc bd close {{issue}} --reason "Drift report generated: $REPORT_FILE"
gc runtime drain-ack
exit 0
```

**Exit criteria:** bead closed; `metadata.report_file` set; notes carry
the markdown body; recipient mailed when `{{notify_recipient}}` was set;
session drained."""
