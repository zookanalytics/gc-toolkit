description = """
Rebase the gascity rig's `origin/main` onto `upstream/main`, drop already-
landed-or-supplanted local commits, run the quality gate, install, push the
working branch (`rebase/{{issue}}`) to origin, and hand off to refinery for
the force-push to `{{upstream_branch}}`.

Extends `mol-polecat-base` for the standard lifecycle entry points but uses
its own gating steps in place of implement / self-review — the work is a
controlled rebase with a verdict-keeping survey, not a feature.

**Force-push ownership:** the terminal force-push onto `{{upstream_branch}}`
is performed by the rig-scoped refinery via the sub-pack's
`refinery-rebase-handling` overlay, never by this polecat. The polecat pushes
only its own ref `refs/heads/rebase/{{issue}}` and reassigns the bead to
refinery; the overlay detects rebase beads (via `metadata.molecule_id`, with
`metadata.backup_ref` as fallback), preflights, performs the leased
force-push, and closes the bead. "Polecats never force-push to main" stays
absolute; the legitimate rebase tail lives in one auditable place.

## Conflict handling: one fresh iteration per conflict (check loop)

Fork commits represent goals, not literal implementations. When `git rebase`
halts on a kept commit because upstream shifted the surrounding code, the
*intent* still applies — a conflict is the next unit of work, not a failure.

The `rebase` step is a **check loop** (`[steps.check]`, formulas v2 §3.1):
the orchestrator runs the step, runs an exit-condition script when the
iteration closes, and while that script fails it appends another iteration —
each its own bead with a fresh agent session. Materializes as
`<wf>.rebase.spec` (spec), `<wf>.rebase.iteration.N` (work), and
`<wf>.rebase` (ralph control bead holding loop state).

`assets/scripts/rebase-check.sh` is the exit condition: it passes only when
the rebase is finished, the worktree clean, HEAD sits on
`metadata.rebase_onto_sha`, and `metadata.check_passed_sha` equals the live
HEAD. Exhausting `max_attempts` closes the control bead `gc.outcome=fail` —
and because nothing runs after that, the exit condition performs the keeper
handback itself on the last failing attempt: stamps
`aborted_at=rebase-loop-exhausted` on the work bead, reassigns it to
`requesting_keeper` with the failure tail in notes, and nudges. Prior
iterations remain as durable history; `metadata.conflict_resolutions`
accumulates one audit entry per resolved conflict.

The exit condition also appends one `metadata.iteration_timings` entry per
attempt: when the runtime minted the attempt, when a session picked it up,
when the iteration's own work ended, when the check ran, the session that ran
it, and the verdict with its reason. That is the loop's only cost measurement,
because the ralph condition env carries no duration of its own, and it is what
separates a loop resolving conflicts from one wedged on the same error every
attempt.

**Iterations must be pool-routed.** The runtime recycles the previous
iteration's worker session only when the attempt target is a pool. Sling this
formula at a pool, never at a named agent — a named target skips the recycle
and iteration N+1 inherits iteration N's context, losing the fresh-context
property this design exists for. The step declares no `assignee` (which
`[steps.check]` forbids anyway).

The rebase step never hands back mid-loop and never writes
`rebase_in_progress` / `pending_rework` (the retired v11 mechanism —
`mol-upstream-gc-rebase-rework` is kept for manual dispatch only). A conflict
the iteration genuinely cannot resolve is recorded as
`metadata.conflict_questions` — the iteration leaves the rebase in place and
never fakes a resolution; the loop then exhausts and the exit condition
routes the bead to the keeper carrying both `conflict_questions` and
`aborted_at=rebase-loop-exhausted`. No silent drops, no auto-resolution.

## Abort shape (workspace-setup, install, push)

All post-rebase abort paths share one keeper-routed shape, in this order:
reassign the bead to `requesting_keeper` (falling back to
`notify_recipient` only when no keeper was stamped), record the failure tail
in bead **notes** (durable even if mail fails), set `aborted_at`, **nudge the
keeper** — all before any mail. Mail to `notify_recipient` is a SECONDARY
backstop, never the primary signal. The keeper's prime sweep matches
`aborted_at` beads assigned to it. The keeper, not the operator's mail alias,
is the durable holder."""
formula = "mol-upstream-gc-rebase"
extends = ["mol-polecat-base"]
version = 12

# The `rebase` step uses [steps.check], a graph-only construct, so the v2
# contract is declared explicitly (formulas v2 §5).
[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.upstream_remote]
description = "Git remote name pointing at the upstream gascity repository"
default = "upstream"

[vars.origin_remote]
description = "Git remote name pointing at the city's fork"
default = "origin"

[vars.upstream_branch]
description = "Branch to rebase onto and push back to"
default = "main"

[vars.check_command]
description = "Post-rebase quality gate command. The default `make check` in gascity is fmt-check + lint + vet + test — the authoritative safety net for the kept set, since conflict resolutions are committed by `git rebase --continue` without the pre-commit hook. Operators can scope down (e.g. --var check_command='make test'); the default is intentionally the full gate."
default = "make check"

[vars.install_command]
description = "Command that rebuilds and installs the gc binary locally"
default = "make install"

[vars.notify_recipient]
description = "Mail target for completion and abort notifications"
default = "human"

[vars.requesting_keeper]
description = "Keeper agent address (e.g., gascity/gascity-keeper.keeper) for abort handbacks. Optional; falls back to notify_recipient, but a keeper-aware operator should stamp metadata.requesting_keeper at dispatch."
default = ""

[[steps]]
id = "workspace-setup"
title = "Set up gascity worktree, fetch upstream, write safety backup ref"
needs = ["load-context"]
description = """
Establish a clean worktree on the gascity rig at
`{{origin_remote}}/{{upstream_branch}}`, fetch upstream, and write a backup
ref so the rebase is recoverable.

**1. Locate the gascity rig** — `$GC_RIG_ROOT` when rig-scoped, else
`gc rig list --json` (top-level `.rigs[]` with `.name`/`.path`).

**2. Reuse or create the worktree.** Check `metadata.work_dir` first; if it
points at an existing directory, `cd` there and skip to step 3. Otherwise
create one anchored to `$GC_CITY_PATH` — the path must NOT derive from
`$(pwd)` (which encodes the polecat alias, so a re-pour to another pool
polecat could not resume). Single-segment name (`rebase-<bead>`) so gascity's
worktree walkers discover and prune it:
```bash
RIG_ROOT=$(gc rig list --json | jq -r '.rigs[] | select(.name=="gascity") | .path')
: "${GC_CITY_PATH:?GC_CITY_PATH must be set; refusing to derive worktree path from /}"
WORKTREE_PATH="$GC_CITY_PATH/.gc/worktrees/gascity/rebase-{{issue}}"
mkdir -p "$(dirname "$WORKTREE_PATH")"
git -C "$RIG_ROOT" fetch --prune {{origin_remote}}
git -C "$RIG_ROOT" worktree prune
if git -C "$RIG_ROOT" rev-parse --verify "refs/heads/rebase/{{issue}}" >/dev/null 2>&1; then
    # Reattach an existing branch (survived a reaped worktree); the prune
    # above dropped stale admin entries so this add does not collide.
    git -C "$RIG_ROOT" worktree add "$WORKTREE_PATH" "rebase/{{issue}}"
else
    git -C "$RIG_ROOT" worktree add "$WORKTREE_PATH" -b "rebase/{{issue}}" "{{origin_remote}}/{{upstream_branch}}"
fi
cd "$WORKTREE_PATH"
gc bd update {{issue}} --set-metadata work_dir="$WORKTREE_PATH" --set-metadata branch="rebase/{{issue}}"
```

The local branch lets us rebase without touching `{{upstream_branch}}`; the
push step writes only `refs/heads/rebase/{{issue}}` on `{{origin_remote}}`,
and refinery's overlay lands the history. `metadata.branch` records the
working branch; `metadata.target` (stamped at hand-off) the destination.

**3. Fetch the upstream remote:**
```bash
git fetch {{upstream_remote}} --prune
```

**4. Write (or reuse) the safety backup ref.** It must always point at the
pre-rebase tip. On a resume after a mid-rebase crash we MUST NOT mint a new
ref — it would point at post-rebase state and destroy the rollback target:

```bash
EXISTING_BACKUP=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.backup_ref // empty')

if [ -n "$EXISTING_BACKUP" ] && \
        git rev-parse --verify "${EXISTING_BACKUP}^{commit}" >/dev/null 2>&1; then
    BACKUP_REF="$EXISTING_BACKUP"
    echo "Reusing existing backup ref: $BACKUP_REF -> $(git rev-parse --short "$BACKUP_REF")"
else
    PRE_REBASE_TIP=$(git rev-parse --verify "{{origin_remote}}/{{upstream_branch}}")
    HEAD_SHA=$(git rev-parse HEAD)
    if [ "$HEAD_SHA" != "$PRE_REBASE_TIP" ]; then
        echo "ERROR: HEAD ($HEAD_SHA) does not match {{origin_remote}}/{{upstream_branch}}" >&2
        echo "       tip ($PRE_REBASE_TIP). Refusing to mint a new backup_ref." >&2
        # Keeper-routed abort (see the abort shape in the header).
        REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper // empty')
        [ -z "$REQUESTING_KEEPER" ] && REQUESTING_KEEPER="{{notify_recipient}}"
        gc bd update {{issue}} \
            --set-metadata aborted_at=workspace-setup \
            --status=open \
            --assignee="$REQUESTING_KEEPER" \
            --notes "Refused to mint backup_ref: HEAD ($HEAD_SHA) does not match {{origin_remote}}/{{upstream_branch}} ($PRE_REBASE_TIP). Resume requires manual recovery."
        gc session nudge "$REQUESTING_KEEPER" "rebase {{issue}}: aborted at workspace-setup (backup_ref mint refused) — operator engagement needed (metadata.aborted_at=workspace-setup)" || true
        gc runtime drain-ack
        exit 1
    fi
    BACKUP_TS=$(date -u +%Y%m%dT%H%M%SZ)
    BACKUP_REF="refs/backups/main-pre-rebase-$BACKUP_TS"
    git update-ref "$BACKUP_REF" "$PRE_REBASE_TIP"
    gc bd update {{issue}} \
        --set-metadata backup_ref="$BACKUP_REF" \
        --set-metadata pre_rebase_tip="$PRE_REBASE_TIP"
fi
```

`git reset --hard $BACKUP_REF` unwinds the rebase; `metadata.pre_rebase_tip`
records the same sha for cross-check.

**Exit criteria:** worktree exists at `metadata.work_dir`; HEAD matches the
pre-rebase tip on a fresh run (or the backup ref validates on a resume);
`metadata.backup_ref` recorded; `{{upstream_remote}}` fetched."""

# The next three steps are OVERRIDES, not filler: `extends` merges a parent
# step in unless the child replaces it by ID, and there is no mechanism to
# drop an inherited step. Deleting these stubs resurrects the base's generic
# feature-implementation steps against the rebase worktree.

[[steps]]
id = "preflight-tests"
title = "Skip — rebase variant uses its own gates"
needs = ["workspace-setup"]
description = """
Neutralizes `mol-polecat-base`'s preflight step. The rebase step's patch-id
checks plus the check-loop quality gate cover what preflight would have
caught. Close this step and proceed."""

[[steps]]
id = "implement"
title = "Skip — replaced by survey + rebase steps"
needs = ["preflight-tests"]
description = """
Neutralizes `mol-polecat-base`'s implement step. The work lives in `survey`
and `rebase` below. Close this step and proceed."""

[[steps]]
id = "self-review"
title = "Skip — replaced by the rebase check loop + install"
needs = ["implement"]
description = """
Neutralizes `mol-polecat-base`'s self-review step. Verification lives inside
the `rebase` check loop (which will not exit until `{{check_command}}` is
green at the rebased HEAD) and in `install`. Close this step and proceed."""

[[steps]]
id = "survey"
title = "Classify each divergent commit as drop-merged-upstream / drop-supplanted / keep"
needs = ["self-review"]
description = """
Build a verdict table for every commit on `{{origin_remote}}/{{upstream_branch}}`
that is not on `{{upstream_remote}}/{{upstream_branch}}`. The verdicts feed
the rebase step.

**Skip on resume** if `metadata.commit_verdicts` is already set — verdicts
don't change mid-rebase:

```bash
if [ "$(gc bd show {{issue}} --json | jq -r '.[0].metadata.commit_verdicts // empty')" != "" ]; then
    echo "commit_verdicts already set; skipping survey on resume."
else
```

**1. Compute the divergent set:**
```bash
git range-diff {{upstream_remote}}/{{upstream_branch}}...{{origin_remote}}/{{upstream_branch}}
git log --oneline {{upstream_remote}}/{{upstream_branch}}..{{origin_remote}}/{{upstream_branch}}
```

`range-diff` shows patch-id matches (`=`), fuzzy matches (`~`), and no match
(`>`). Input to the verdicts, not a substitute for reading each commit.

**2. Classify each origin commit** (oldest → newest), exactly one verdict:

- **drop-merged-upstream** — patch-id-equal (or trivially-equal) to an
  upstream commit; the rebase drops it automatically.
- **drop-supplanted** — upstream solves the same problem differently (LLM
  judgment: read the upstream log for adjacent fixes). Rewritten out via
  the sequence editor in the next step.
- **keep** — local-only patch with no upstream equivalent; carried forward.

**3. Persist the verdicts** — markdown table to notes, JSON to metadata:

```
| sha | subject | verdict | rationale |
|-----|---------|---------|-----------|
| abc1234 | <subject> | drop-merged-upstream | matches upstream <sha> by patch-id |
```

```json
[
  {"sha": "abc1234", "subject": "...", "verdict": "drop-merged-upstream", "rationale": "..."},
  {"sha": "def5678", "subject": "...", "verdict": "drop-supplanted", "rationale": "...", "upstream_ref": "..."},
  {"sha": "ghi9abc", "subject": "...", "verdict": "keep", "rationale": "..."}
]
```

```bash
gc bd update {{issue}} --notes "<markdown table here>"
gc bd update {{issue}} --set-metadata commit_verdicts='<json string>'
fi  # end of resume-skip guard
```

**Exit criteria:** every divergent commit has a verdict on the bead;
`metadata.commit_verdicts` parses; the markdown table is in the notes."""

[[steps]]
id = "rebase"
title = "Rebase onto upstream, one conflict per iteration, until the gate is green"
needs = ["survey"]
description = """
**Config: check_command = {{check_command}}**

You are **one iteration of a check loop**. Read this whole step before you
touch anything. You may be iteration 1 starting fresh, iteration N resuming
a halted rebase, or the iteration that only has to get the gate green.
Nothing from a previous iteration is in your context — by design. Determine
where you are from the worktree and the bead, never from memory.

When you close your bead the orchestrator runs the exit condition
(`assets/scripts/rebase-check.sh`), which passes only when: no rebase in
progress; worktree clean; HEAD on top of `metadata.rebase_onto_sha`;
`metadata.check_passed_sha` equals the live HEAD. If it fails, the next
iteration is appended with a fresh session. Leave the worktree and the bead
in a truthful state.

**1. Enter the worktree** (never work in the rig checkout):

```bash
WORKTREE=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.work_dir // empty')
[ -n "$WORKTREE" ] || { echo "ERROR: no metadata.work_dir on {{issue}}" >&2; exit 1; }
cd "$WORKTREE" || exit 1
```

**2. Determine which state you are in.**

```bash
if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
    STATE=mid-rebase
elif [ -z "$(gc bd show {{issue}} --json | jq -r '.[0].metadata.rebase_onto_sha // empty')" ]; then
    STATE=fresh
else
    STATE=rebased
fi
echo "iteration state: $STATE"
```

**3. STATE=fresh — start the rebase.**

Fetch upstream and pin the tip exactly once: the exit condition requires
HEAD to sit on `metadata.rebase_onto_sha`, so a later re-fetch that moved
the tip would make a started rebase impossible to pass. On any resume, do
NOT re-fetch and do NOT re-stamp.

```bash
git fetch {{upstream_remote}} {{upstream_branch}}
ONTO=$(git rev-parse {{upstream_remote}}/{{upstream_branch}})
gc bd update {{issue}} --set-metadata rebase_onto_sha="$ONTO"
```

Build the sequence-editor script: rewrite `pick <sha>` to `drop <sha>` for
every `drop-supplanted` sha. Shas travel via the exported `DROP_SHAS` so the
heredoc stays quoted:

```bash
DROP_SHAS=$(gc bd show {{issue}} --json | jq -r \\
  '.[0].metadata.commit_verdicts // "[]" | fromjson
   | map(select(.verdict=="drop-supplanted") | .sha) | join(" ")')
export DROP_SHAS

cat > /tmp/seqedit-{{issue}}.sh <<'SEQ'
#!/bin/sh
# The todo carries ABBREVIATED hashes; DROP_SHAS holds FULL shas. Match the
# todo hash as a PREFIX of a full drop sha; rewrite pick -> drop.
todo=$1
awk -v drops="$DROP_SHAS" '
  BEGIN { n = split(drops, d, " ") }
  /^pick / {
    h = $2
    for (i = 1; i <= n; i++) {
      if (substr(d[i], 1, length(h)) == h) { sub(/^pick/, "drop"); break }
    }
  }
  { print }
' "$todo" > "$todo.tmp" && mv "$todo.tmp" "$todo"
SEQ
chmod +x /tmp/seqedit-{{issue}}.sh

GIT_SEQUENCE_EDITOR=/tmp/seqedit-{{issue}}.sh \\
  git rebase -i "$ONTO" >/tmp/rebase-out-{{issue}}.txt 2>&1 || true
```

Empty `DROP_SHAS` makes the editor a no-op; `drop-merged-upstream` commits
drop automatically by patch-id; `keep` commits replay. A conflict here is
expected — fall through to step 4.

**4. STATE=mid-rebase — resolve the conflict in front of you.**

Fork commits represent goals; when upstream shifts the surrounding code the
*intention* usually still applies with some cleanup. Read the conflicted
commit holistically and rework its intent onto the new upstream layer.

```bash
COMMIT_SHA=$(git rev-parse REBASE_HEAD 2>/dev/null || echo "")
git log -1 --format='%s%n%n%b' "$COMMIT_SHA"   # what this commit was FOR
git status --porcelain                          # what is conflicted
git log -p -5 {{upstream_remote}}/{{upstream_branch}} -- <conflicted file>
```

Judge each conflicted commit with the standard vocabulary (the
`rebase-conventions` fragment defines it):

- **mechanical** — the intent ports directly; resolve the markers, keep.
- **dropped-absorbed** — upstream provides the behavior; `git rebase --skip`
  the WHOLE commit — do not preserve bundled extras.
- **judgment-required** — the intent applies but the shape must change; make
  the call and record your reasoning in the audit entry. No review polecat
  exists on this path.
- **infeasible** — you cannot port it without guessing. Do NOT invent a
  resolution and do NOT skip it to make the loop pass; see step 6.

Resolve, stage, continue:

```bash
git add <resolved files>
git -c core.editor=true rebase --continue
```

Keep going while you are making real progress — several conflicts in one
iteration is good; the loop is a safety net for short context or fresh eyes,
not a quota. Append one audit entry per conflict you resolve:

```bash
ENTRY=$(jq -nc --arg sha "$COMMIT_SHA" --arg subj "<subject>" \\
  --arg cls "<mechanical|dropped-absorbed|judgment-required>" \\
  --arg res "<what you did and why>" \\
  '{commit_sha:$sha, commit_subject:$subj, classification:$cls, resolution:$res}')
LOG=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.conflict_resolutions // "[]"')
LOG=$(printf '%s' "$LOG" | jq -c ". + [$ENTRY]")
gc bd update {{issue}} --set-metadata conflict_resolutions="$LOG"
```

**5. STATE=rebased — get the quality gate green.**

Sanity-check the kept set (should roughly match the `keep` rows, allowing
for reworks):

```bash
git log {{upstream_remote}}/{{upstream_branch}}..HEAD --oneline
```

Run the gate — the authoritative safety net, since conflict resolutions
landed without the pre-commit hook:

```bash
{{check_command}}
```

- **Green** — stamp the HEAD it passed at, *after* your last commit:
  ```bash
  gc bd update {{issue}} --set-metadata check_passed_sha="$(git rev-parse HEAD)"
  ```
- **Red** — fixing it is your job, not an abort. A failure often points at
  an earlier iteration's resolution; read `metadata.conflict_resolutions`
  for the likely culprit. Fix, commit, re-run, re-stamp. Out of context?
  Close your bead — the next iteration picks up from here.

The stamp is sha-bound: any later commit invalidates it and the loop
re-gates.

**6. If you are genuinely stuck.**

Record the question and leave the rebase where it is. Do not fabricate a
resolution, do not skip a commit you did not judge absorbed, and do not
`git rebase --abort` (it discards every prior iteration's work).

```bash
QUESTIONS=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.conflict_questions // "[]"')
ENTRY=$(jq -nc --arg sha "$COMMIT_SHA" --arg subj "<subject>" \\
  --arg q "<what you need decided, and what you already ruled out>" \\
  '{commit_sha:$sha, commit_subject:$subj, question:$q}')
gc bd update {{issue}} \\
  --set-metadata conflict_questions="$(printf '%s' "$QUESTIONS" | jq -c ". + [$ENTRY]")"
```

Then close your bead as usual (step 7) — do NOT reassign to the keeper and
do NOT drain-and-park. Recording the question is the whole escalation on
your side: the loop runs out its attempts and the exit condition hands
{{issue}} to the keeper (`aborted_at=rebase-loop-exhausted`, reassigned,
failure tail in notes, nudge) while the control bead closes
`gc.outcome=fail`. `metadata.backup_ref` still restores the pre-rebase state.

**7. Close your iteration bead** — closing is what runs the exit condition.
Do NOT drain-and-park, reassign, or re-pour anything.

```bash
gc bd close <your-iteration-bead-id> --reason "rebase iteration complete"
```

Close by **explicit id**: a pool-claimed polecat often has `GC_BEAD_ID`
unset, and a guarded `gc bd close "$GC_BEAD_ID"` silently no-ops, stalling
the loop forever.

**Exit criteria (for the step, not for you):** rebase finished, worktree
clean, HEAD on `metadata.rebase_onto_sha`, `metadata.check_passed_sha` ==
HEAD. Any iteration that leaves the worktree closer to that state has done
its job."""

[steps.check]
# Total iterations including the first. Each iteration can resolve several
# conflicts, so this bounds pathological churn rather than conflict count.
# Exhaustion closes the control bead gc.outcome=fail; the exit condition
# hands the work bead back to the keeper on that last failing attempt — it
# reads this budget off the control bead's gc.max_attempts, so changing the
# number here needs no other edit.
max_attempts = 25

[steps.check.check]
mode = "exec"
path = "../assets/scripts/rebase-check.sh"
# The script reads bead metadata and git state — it verifies the gate, it
# does not run it (see rebase-check.sh's header for why). It writes twice:
# one `metadata.iteration_timings` entry per attempt, and the exhaustion
# handback on the final failing attempt. 2m is slack for a loaded Dolt and
# those two writes, not a budget for `make check`.
timeout = "2m"

[[steps]]
id = "install"
title = "Rebuild and install gc from the rebased state"
needs = ["rebase"]
description = """
**Config: install_command = {{install_command}}**

**Resume-skip on an unchanged HEAD (trust-and-skip)**, keyed to
`metadata.install_passed_sha`:
```bash
HEAD_SHA=$(git rev-parse HEAD)
if [ "$(gc bd show {{issue}} --json | jq -r '.[0].metadata.install_passed_sha // empty')" = "$HEAD_SHA" ]; then
    echo "install already passed at this HEAD ($HEAD_SHA); trust-and-skip"
else
    {{install_command}}
fi
```

On pass, stamp the HEAD sha and proceed:
```bash
gc bd update {{issue}} --set-metadata install_passed_sha="$(git rev-parse HEAD)"
```

On failure, the standard keeper-routed abort (`aborted_at=install`):

```bash
INSTALL_TAIL=$(<install output, last 200 lines>)
BACKUP_REF=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.backup_ref')
WORKTREE=$(pwd)

REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper // empty')
[ -z "$REQUESTING_KEEPER" ] && REQUESTING_KEEPER="{{notify_recipient}}"

gc bd update {{issue}} \
  --set-metadata aborted_at=install \
  --status=open \
  --assignee="$REQUESTING_KEEPER" \
  --notes "$(cat <<EOF
Rebase and tests passed but {{install_command}} FAILED (aborted_at=install).

Worktree: $WORKTREE
Backup ref: $BACKUP_REF

Failure tail:
$INSTALL_TAIL

To restore the pre-rebase state: git reset --hard $BACKUP_REF
EOF
)"

gc session nudge "$REQUESTING_KEEPER" "rebase {{issue}}: install failed — operator engagement needed (metadata.aborted_at=install; failure tail in bead notes)" || true

# Secondary backstop ONLY: best-effort mail to the operator.
if ! gc mail send {{notify_recipient}} -s "gascity rebase: install failed" -m "$(cat <<EOF
Rebase and tests passed but {{install_command}} failed.

Worktree: $WORKTREE
Backup ref: $BACKUP_REF
Bead: {{issue}}

Failure tail:
$INSTALL_TAIL

Next: investigate from the worktree. To restore the pre-rebase state:
  git reset --hard $BACKUP_REF
EOF
)"; then
    echo "WARN: mail send failed for {{issue}}; the keeper handback (assignee + aborted_at + notes + nudge) is the durable signal" >&2
fi
gc runtime drain-ack
exit 0
```"""

[[steps]]
id = "push"
title = "Push the rebased branch to origin (polecat-owned ref, no force on main)"
needs = ["install"]
description = """
**Config: origin_remote = {{origin_remote}}**
**Config: upstream_branch = {{upstream_branch}}**

Push to the polecat-owned ref only — a fast-forward push, so no `--force`
variant is needed or appropriate. The force-push onto `{{upstream_branch}}`
belongs to the refinery overlay:

```bash
git push {{origin_remote}} HEAD:rebase/{{issue}}
```

If the push fails (auth, network, ref protection on `refs/heads/rebase/*` —
NOT a race against `{{upstream_branch}}`, which refinery detects), do NOT
retry blindly; standard keeper-routed abort (`aborted_at=push`):

```bash
BACKUP_REF=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.backup_ref')
WORKTREE=$(pwd)

REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper // empty')
[ -z "$REQUESTING_KEEPER" ] && REQUESTING_KEEPER="{{notify_recipient}}"

gc bd update {{issue}} \
  --set-metadata aborted_at=push \
  --status=open \
  --assignee="$REQUESTING_KEEPER" \
  --notes "$(cat <<EOF
git push {{origin_remote}} HEAD:rebase/{{issue}} FAILED (aborted_at=push).
The rebased history is intact in the worktree; the refinery force-push to
{{upstream_branch}} has NOT fired yet.

Worktree: $WORKTREE
Backup ref: $BACKUP_REF

Next: investigate the push failure (auth, network, ref protection on
refs/heads/rebase/*). Once the push lands, refinery handles the rest.
EOF
)"

gc session nudge "$REQUESTING_KEEPER" "rebase {{issue}}: push to rebase ref failed — operator engagement needed (metadata.aborted_at=push; context in bead notes)" || true

# Secondary backstop ONLY: best-effort mail to the operator.
if ! gc mail send {{notify_recipient}} -s "gascity rebase: push to rebase ref failed" -m "$(cat <<EOF
git push {{origin_remote}} HEAD:rebase/{{issue}} failed. The polecat pushes
its working branch only; the refinery-owned force-push onto
{{upstream_branch}} has NOT fired yet.

Worktree: $WORKTREE
Backup ref: $BACKUP_REF
Bead: {{issue}}

The rebased history is intact in the worktree; once the push lands,
refinery handles the rest.
EOF
)"; then
    echo "WARN: mail send failed for {{issue}}; the keeper handback (assignee + aborted_at + notes + nudge) is the durable signal" >&2
fi
gc runtime drain-ack
exit 0
```

**Race-loss against `{{upstream_branch}}` is not this step's concern:** the
refinery overlay compares the current tip to `metadata.pre_rebase_tip`, pins
the `--force-with-lease` expected value to the same SHA, and on a loss hands
the bead back to the keeper (`aborted_at=refinery-race-loss`) — see
`refinery-rebase-handling`. We hand off and exit.

**Exit criteria:** `{{origin_remote}}/refs/heads/rebase/{{issue}}` points at
the rebased HEAD, ready for refinery to land."""

[[steps]]
id = "notify-and-handoff"
title = "Mail the completion summary, append to bead notes, hand off to refinery"
needs = ["push"]
description = """
Compose the completion summary, mail it, append a clean copy to bead notes,
then reassign the bead to refinery for the force-push. **Do NOT close the
bead** — only the refinery closes after the force-push lands (polecats never
close their own work bead).

**1. Build the summary.** Sections:
- **Dropped commits** — the drop rows from `metadata.commit_verdicts` (sha,
  subject, verdict, rationale).
- **Conflict resolutions** — compact rendering of
  `metadata.conflict_resolutions` when non-empty; omit entirely when empty:
  ```bash
  RESOLUTIONS=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.conflict_resolutions // "[]"')
  RES_COUNT=$(printf '%s' "$RESOLUTIONS" | jq 'length')
  if [ "$RES_COUNT" -gt 0 ]; then
      MECH=$(printf '%s' "$RESOLUTIONS" | jq '[.[] | select(.classification=="mechanical")] | length')
      DROPPED=$(printf '%s' "$RESOLUTIONS" | jq '[.[] | select(.classification=="dropped-absorbed")] | length')
      JUDGED=$(printf '%s' "$RESOLUTIONS" | jq '[.[] | select(.classification=="judgment-required")] | length')
      RES_HEADLINE="$RES_COUNT conflict(s) resolved: $MECH mechanical, $DROPPED dropped-absorbed, $JUDGED judgment-required; full log on metadata.conflict_resolutions."
      RES_DETAIL=$(printf '%s' "$RESOLUTIONS" | jq -r '.[] | "  \\(.commit_sha[0:8]) classification=\\(.classification) resolution=\\(.resolution)"')
  else
      RES_HEADLINE=""
      RES_DETAIL=""
  fi
  ```
- **Upstream commits absorbed** — `git log --oneline <pre-rebase-tip>..{{upstream_remote}}/{{upstream_branch}}`.
- **Loop cost** — one row per attempt from `metadata.iteration_timings`, so
  the run reports what it cost without anyone querying metadata for it:
  ```bash
  TIMINGS=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.iteration_timings // "[]"')
  COST=$(printf '%s' "$TIMINGS" | jq -r '.[] |
    "  attempt \\(.attempt) \\(.verdict) session=\\(.session_id // "?") minted=\\(.appended_at // "?") started=\\(.started_at // "?") closed=\\(.closed_at // "?")"')
  ```
  `minted` to `started` is spawn, session boot and work discovery; `started`
  to `closed` is the attempt's own work. Report both spans rather than the
  total: which one dominates is the question this record exists to answer.
- **Check / install / push outcomes** and the **backup ref** (name +
  pre-rebase tip sha, so the operator can roll back without paging this mol
  back in).

**2. Mail the operator:**
```bash
gc mail send {{notify_recipient}} -s "gascity rebase: ready for refinery handoff" -m "<summary>"
```

**3. Append the summary to bead notes** (markdown; the resolutions section
may be a full table — it is the durable forensic record):
```bash
gc bd update {{issue}} --notes "<summary>"
```

**4. Hand off to refinery.** The overlay recognises rebase beads via
`metadata.molecule_id` / `metadata.backup_ref`, preflights, force-pushes
with the lease, and closes the bead:

```bash
# Make sure the metadata refinery reads matches what we pushed.
gc bd update {{issue}} \
  --set-metadata branch=rebase/{{issue}} \
  --set-metadata target={{upstream_branch}}

# Reassign to the rig-scoped refinery. ${GC_RIG:+$GC_RIG/} yields "<rig>/"
# under a rig session, empty in HQ-only cities; the binding-qualified name
# carries the gc-toolkit. prefix (the refinery comes from gc-toolkit's
# import into gascity).
REFINERY_TARGET="${GC_RIG:+$GC_RIG/}gc-toolkit.refinery"
gc bd update {{issue}} --status=open --assignee="$REFINERY_TARGET"

# Wake/nudge are best-effort — refinery's watcher catches the assignment
# regardless; the explicit prompt shortens latency.
gc session wake "$REFINERY_TARGET" || true
gc session nudge "$REFINERY_TARGET" "Rebase bead {{issue}} ready: force-push rebase/{{issue}} onto {{upstream_branch}}." || true
```

**5. Drain and exit:**
```bash
gc runtime drain-ack
exit 0
```

**Exit criteria:** completion mail sent (with the resolutions headline when
any fired); bead notes carry the summary; `metadata.conflict_resolutions`
remains as the JSON record; bead reassigned to refinery with
`metadata.branch` and `metadata.target` set; session drained. The bead stays
OPEN — refinery closes it after the force-push lands."""
