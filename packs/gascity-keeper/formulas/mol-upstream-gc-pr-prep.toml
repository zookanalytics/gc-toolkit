description = """
Prepare an upstream pull request from one or more local-fork commits. An
ordered batch is cherry-picked onto a single branch and lands as one combined
PR draft; N=1 is the single-commit case. Mechanical work through
`push-branch`, then `prepare-pr-handoff` drafts the PR title/body (and an
optional issue draft), then `handback-to-keeper` re-routes the bead to the
requesting keeper for the conversational tail.

PR creation itself is operator-gated and currently blocked at the city level —
this mol stops at branch push + draft-on-bead. The keeper (or operator) decides
when to run the assembled `gh pr create` command.

Extends `mol-polecat-base` for load-context but replaces the implement /
self-review chain with cherry-pick / scrub / test / push / draft / handback.
Every abort path (cherry-pick conflict, test failure, push race) mails the
keeper + operator and hands the bead back open, assigned and routed to the
keeper — never stranded `in_progress` on the drained session."""
formula = "mol-upstream-gc-pr-prep"
extends = ["mol-polecat-base"]
version = 3

[vars]
[vars.commit_sha]
description = "Whitespace-separated, ORDERED list of one-or-more local commits on origin/main to extract for upstream submission. Apply order is topological — old→new, as the commits sit on origin/main. A single SHA (N=1) is the original single-commit behavior."
required = true

[vars.branch_name]
description = "Explicit name for the assembled PR branch. Empty (default): a single SHA yields upstream-pr/<short-sha>, multiple SHAs yield upstream-pr/<issue> (stable + unique). Set: used verbatim, e.g. upstream-pr/test-env-isolation."
default = ""

[vars.upstream_remote]
description = "Git remote name pointing at the upstream gascity repository"
default = "upstream"

[vars.origin_remote]
description = "Git remote name pointing at the city's fork"
default = "origin"

[vars.upstream_branch]
description = "Branch the eventual upstream PR will target"
default = "main"

[vars.test_command]
description = "Test command run after cherry-pick + scrub"
default = "make test"

[vars.requesting_keeper]
description = "Keeper agent address (e.g., gascity/gascity-keeper.keeper) the bead returns to after prep"
required = true

[[steps]]
id = "workspace-setup"
title = "Set up gascity worktree branched off upstream"
needs = ["load-context"]
description = """
Branch off `{{upstream_remote}}/{{upstream_branch}}` (NOT `{{origin_remote}}`)
so the PR's commit history is upstream-relative. The keeper stamped
`metadata.commit_sha` (ordered list, old→new), `metadata.requesting_keeper`,
and optionally `metadata.branch_name`.

**1. Read the inputs:**
```bash
COMMIT_SHA=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.commit_sha')
REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper')
BRANCH_NAME=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.branch_name // empty')
```

If `COMMIT_SHA` or `REQUESTING_KEEPER` is empty the dispatch was malformed —
escalate to the operator with subject `pr-prep: missing metadata` and exit.
Do not invent defaults.

**2. Reuse or create the worktree.** Check `metadata.work_dir` first; if it
exists, `cd` there and skip to step 3. Otherwise:

```bash
RIG_ROOT=$(gc rig list --json | jq -r '.rigs[] | select(.name=="gascity") | .path')

# Split the ordered SHA list explicitly with awk: zsh — the shell this block
# is pasted into — performs NO word-splitting on an unquoted expansion, so
# `set -- $COMMIT_SHA` sets ONE joined parameter there.
SHA_LIST=$(mktemp)
printf '%s' "$COMMIT_SHA" | awk '{ for (i = 1; i <= NF; i++) print $i }' > "$SHA_LIST"
N=$(awk 'END { print NR }' "$SHA_LIST")
FIRST_SHA=$(awk 'NR == 1 { print; exit }' "$SHA_LIST")

# Branch-naming rule:
#   branch_name set       → use it verbatim
#   empty + single SHA    → upstream-pr/<short-sha>
#   empty + multiple SHAs → upstream-pr/{{issue}}     (stable + unique)
if [ -n "$BRANCH_NAME" ]; then
  BRANCH="$BRANCH_NAME"
elif [ "$N" -eq 1 ]; then
  SHORT_SHA=$(git -C "$RIG_ROOT" rev-parse --short "$FIRST_SHA")
  BRANCH="upstream-pr/$SHORT_SHA"
else
  BRANCH="upstream-pr/{{issue}}"
fi
WORKTREE_PATH="$(pwd)/worktrees/{{issue}}"

git -C "$RIG_ROOT" fetch --prune {{upstream_remote}}
git -C "$RIG_ROOT" worktree add "$WORKTREE_PATH" -b "$BRANCH" "{{upstream_remote}}/{{upstream_branch}}"
cd "$WORKTREE_PATH"
gc bd update {{issue}} \
  --set-metadata work_dir="$WORKTREE_PATH" \
  --set-metadata branch="$BRANCH"
```

If the branch name collides with an existing worktree branch, append
`-{{issue}}` to disambiguate.

**Exit criteria:** worktree at `$WORKTREE_PATH`; branch computed per the rule
above, based on `{{upstream_remote}}/{{upstream_branch}}`; both recorded on
the bead."""

[[steps]]
id = "preflight-tests"
title = "Skip — pr-prep variant uses its own gates"
needs = ["workspace-setup"]
description = """
Gating happens in `cherry-pick` (conflict), `test` (post-scrub), and
`push-branch`. Nothing useful to preflight on a fresh upstream branch.
Close this step and proceed."""

[[steps]]
id = "implement"
title = "Skip — replaced by cherry-pick + scrub-commit-message steps"
needs = ["preflight-tests"]
description = """
The implementation work lives in `cherry-pick` and `scrub-commit-message`
below. Close this step and proceed."""

[[steps]]
id = "self-review"
title = "Skip — replaced by test + prepare-pr-handoff steps"
needs = ["implement"]
description = """
Verification is the `test` step; diff review is taken on by
`prepare-pr-handoff`, which reads the commits anyway. Close this step and
proceed."""

[[steps]]
id = "cherry-pick"
title = "Cherry-pick the ordered batch onto upstream, scrubbing each commit"
needs = ["self-review"]
description = """
Apply the ordered batch (old→new), scrubbing each commit's message *while it
is HEAD* (amending a non-HEAD commit afterward is fiddly, so the scrub is
folded into this loop). N=1 is one cherry-pick, one scrub.

```bash
COMMIT_SHA=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.commit_sha')

# Fresh combined-scrub log; scrub-commit-message persists it as metadata.scrub_diff.
SCRUB_LOG=/tmp/scrub-all-{{issue}}.txt
: > "$SCRUB_LOG"

# Explicit awk split + read-from-FILE: zsh does not word-split unquoted
# expansions, and a file (not a pipe) lets the fail-safe `exit 0` below
# leave the step rather than a subshell.
SHA_LIST=$(mktemp)
printf '%s' "$COMMIT_SHA" | awk '{ for (i = 1; i <= NF; i++) print $i }' > "$SHA_LIST"
while IFS= read -r SHA; do
  if ! git cherry-pick "$SHA"; then
    # --- Conflict on THIS commit: capture which, reset, hand back. ---
    git status --short > /tmp/cherry-pick-conflict-{{issue}}.txt
    git cherry-pick --abort
    # Reset the branch back to the upstream base so no partial batch strands.
    git reset --hard "{{upstream_remote}}/{{upstream_branch}}"

    REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper')
    gc mail send "$REQUESTING_KEEPER" -s "pr-prep: cherry-pick conflict for {{issue}}" -m "$(cat <<EOF
Cherry-pick of $SHA onto {{upstream_remote}}/{{upstream_branch}} conflicted.

Bead: {{issue}}
Worktree: $(pwd)
Batch: $COMMIT_SHA
Conflicting commit: $SHA
Conflicts:
$(cat /tmp/cherry-pick-conflict-{{issue}}.txt)

Commit $SHA of the batch conflicts on current upstream — drop it from the
batch or split it. Likely cause: the commit depends on local-only context
that doesn't exist upstream. The branch was reset to the upstream base; no
partial batch was left behind.
EOF
)"
    gc mail send human -s "pr-prep: cherry-pick conflict for {{issue}}" -m "(see keeper mail)"

    gc bd update {{issue}} \
      --set-metadata aborted_at=cherry-pick \
      --set-metadata conflict_sha="$SHA" \
      --status=open \
      --assignee="$REQUESTING_KEEPER" \
      --set-metadata gc.routed_to="$REQUESTING_KEEPER"
    gc runtime drain-ack
    exit 0
  fi

  # --- Scrub THIS commit's message while it is HEAD (pattern list below). ---
  git log -1 --format='%B' > /tmp/scrub-before-{{issue}}.txt
  # ...inspect; if a rewrite is needed: git commit --amend -m "<scrubbed message>"...
  {
    echo "=== $SHA ==="
    echo "BEFORE:"
    cat /tmp/scrub-before-{{issue}}.txt
    echo
    echo "AFTER:"
    git log -1 --format='%B'
    echo
  } >> "$SCRUB_LOG"
done < "$SHA_LIST"
```

**Scrub each commit (LLM judgment, not blind regex).** Rewrite anything that
would leak city-internal context into upstream history:

- Bead-ID-shaped tokens — `lx-…`, `gc-…`, `tk-…`, `sl-…` (a token like
  `gc-init` could be a real upstream symbol; consider context).
- Rig names (`gc rig list` entries) and city references ("this city",
  the city's own name).
- Internal agent handles — `polecat`, `refinery`, `witness`, `deacon`,
  `converse`, `mechanik`, `keeper`, and any older handle that survives in
  history. Replace with neutral wording ("the city's keeper agent" →
  "tooling"); generalize rig names (`gc-toolkit pack` → "downstream pack");
  drop `Tracking: tk-abc123`-style lines entirely.

If nothing matches, leave the message untouched — the before/after entry is
simply identical. Either way the loop appends one `=== <sha> ===` block per
commit to the scrub log.

**Exit criteria:** HEAD carries every commit of the batch in order, each with
a scrubbed message; working tree clean; `/tmp/scrub-all-{{issue}}.txt` holds a
before/after block per commit. On a conflict: branch reset to the upstream
base, `aborted_at=cherry-pick` + `conflict_sha` set, bead open and re-routed
to the keeper."""

[[steps]]
id = "scrub-commit-message"
title = "Persist the combined scrub diff (scrub applied per-commit in cherry-pick)"
needs = ["cherry-pick"]
description = """
The scrub already ran per-commit inside the `cherry-pick` loop. This no-op
marker persists the combined before/after record so the keeper can surface
the full rewrite set (and the operator can object if a scrub overreached):

```bash
SCRUB_LOG=/tmp/scrub-all-{{issue}}.txt
if [ -s "$SCRUB_LOG" ]; then
  gc bd update {{issue}} --set-metadata scrub_diff="$(cat "$SCRUB_LOG")"
else
  # Should never be empty after a successful cherry-pick step; record the
  # anomaly rather than silently passing.
  gc bd update {{issue}} --set-metadata scrub_diff="(no scrub log found — cherry-pick loop did not run?)"
fi
```

**Exit criteria:** `metadata.scrub_diff` records a before/after block for
every commit in the batch."""

[[steps]]
id = "test"
title = "Run the test suite on the cherry-picked branch"
needs = ["scrub-commit-message"]
description = """
**Config: test_command = {{test_command}}**

```bash
{{test_command}}
```

If tests pass, close this step and proceed. If tests fail, hand back — the
operator decides whether the commit is viable upstream as-is:

```bash
TEST_TAIL=$(<test output, last 200 lines>)
REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper')

gc mail send "$REQUESTING_KEEPER" -s "pr-prep: tests failed for {{issue}}" -m "$(cat <<EOF
Cherry-pick succeeded but {{test_command}} failed on the rebased branch.

Bead: {{issue}}
Worktree: $(pwd)

Failure tail:
$TEST_TAIL
EOF
)"
gc mail send human -s "pr-prep: tests failed for {{issue}}" -m "(see keeper mail)"

gc bd update {{issue}} \
  --set-metadata aborted_at=test \
  --status=open \
  --assignee="$REQUESTING_KEEPER" \
  --set-metadata gc.routed_to="$REQUESTING_KEEPER"
gc runtime drain-ack
exit 0
```"""

[[steps]]
id = "push-branch"
title = "Push the prepped branch to origin"
needs = ["test"]
description = """
**Config: origin_remote = {{origin_remote}}**

Push the computed branch (`metadata.branch`, whatever workspace-setup
produced) to `{{origin_remote}}` — a feature-branch push, never
`{{upstream_branch}}`:

```bash
BRANCH=$(git branch --show-current)
git push {{origin_remote}} HEAD
```

Record the branch URL for the keeper conversation:
```bash
ORIGIN_URL=$(git remote get-url {{origin_remote}})
# Convert git@github.com:owner/repo.git → https://github.com/owner/repo
HTTPS_URL=$(printf '%s' "$ORIGIN_URL" | \
  sed -E 's#^git@github.com:([^/]+)/([^.]+)(\\.git)?$#https://github.com/\\1/\\2#' | \
  sed -E 's#\\.git$##')
BRANCH_URL="$HTTPS_URL/tree/$BRANCH"
gc bd update {{issue}} --set-metadata branch_url="$BRANCH_URL"
```

If the push is rejected because the branch already exists on
`{{origin_remote}}`, retry with `--force-with-lease` (never plain
`--force`). If that is also rejected, treat it as a race and hand back:

```bash
REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper')

gc mail send "$REQUESTING_KEEPER" -s "pr-prep: branch race for {{issue}}" -m "$(cat <<EOF
git push --force-with-lease was rejected on $(git branch --show-current).
Someone else pushed to that branch on {{origin_remote}}.

Bead: {{issue}}
Worktree: $(pwd)

Next: review what landed remotely. If the new commits should supersede
this prep, abandon this bead; otherwise restart pr-prep on a fresh bead.
EOF
)"
gc mail send human -s "pr-prep: branch race for {{issue}}" -m "(see keeper mail)"

gc bd update {{issue}} \
  --set-metadata aborted_at=push-branch \
  --status=open \
  --assignee="$REQUESTING_KEEPER" \
  --set-metadata gc.routed_to="$REQUESTING_KEEPER"
gc runtime drain-ack
exit 0
```

**Exit criteria:** branch is on `{{origin_remote}}`; `metadata.branch_url`
records the GitHub URL."""

[[steps]]
id = "prepare-pr-handoff"
title = "Draft PR title/body, optional issue, and gh commands"
needs = ["push-branch"]
description = """
LLM judgment work: read the batch, draft a PR title/body, decide whether an
upstream issue would help, assemble commands. Persist everything to bead
metadata for the keeper's handback conversation.

**1. Read the commits (oldest→newest):**
```bash
git log --reverse --format='%H%n%s%n%b%n--' {{upstream_remote}}/{{upstream_branch}}..HEAD
git diff --stat {{upstream_remote}}/{{upstream_branch}}..HEAD
```

**2. Draft the PR title.** N=1: the cleaned commit subject; rewrite to
neutral imperative-verb-plus-scope if it reads city-internally. N>1:
synthesize a title naming the *theme* of the whole set, not any single
commit's subject.

```bash
gc bd update {{issue}} --set-metadata suggested_pr_title="<title>"
```

**3. Draft the PR body.** N=1: the commit body, then a `## Why this PR`
one-paragraph stub the keeper iterates on with the operator. N>1: a short
overall rationale, then `## Commits` (one bullet per commit — subject +
one line of what/why), then the same `## Why this PR` stub. The stub is
intentionally short and editable; don't oversell, flag unknowns.

```bash
gc bd update {{issue}} --set-metadata suggested_pr_body="<body>"
```

**4. Decide on a companion issue; always set every issue field.** An issue
helps for RFC-shaped changes, behavioural decisions worth surfacing
publicly, or known-contentious areas. Not worth filing for clear-repro bug
fixes, obviously-equivalent refactors, or doc fixes. The contract is
"always set, possibly empty" — the keeper never special-cases missing keys:

```bash
ISSUE_DECISION=yes   # or "no"
ISSUE_REASON="<one-line rationale>"

if [ "$ISSUE_DECISION" = "yes" ]; then
  ISSUE_TITLE="<drafted title>"
  ISSUE_BODY="<drafted body>"
else
  ISSUE_TITLE=""
  ISSUE_BODY=""
fi

gc bd update {{issue}} \
  --set-metadata issue_advice="${ISSUE_DECISION}: ${ISSUE_REASON}" \
  --set-metadata suggested_issue_title="$ISSUE_TITLE" \
  --set-metadata suggested_issue_body="$ISSUE_BODY"
```

**5. Build ready-to-paste gh commands** (stored on the bead — PR creation is
city-blocked, the operator pastes them once policy unblocks). No
placeholders: resolve fork-owner from the remote URL, branch from the
worktree, title/body from metadata; `printf %q` so multi-line bodies
round-trip on paste:

```bash
ORIGIN_URL=$(git remote get-url {{origin_remote}})
# Owner segment from git@github.com:owner/repo(.git) or https://github.com/owner/repo(.git)
FORK_OWNER=$(printf '%s' "$ORIGIN_URL" | \
  sed -E 's#^git@github.com:([^/]+)/.*#\\1#; t; s#^https?://github.com/([^/]+)/.*#\\1#')
BRANCH=$(git branch --show-current)
PR_TITLE=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.suggested_pr_title')
PR_BODY=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.suggested_pr_body')

PR_CMD=$(printf 'gh pr create --repo gastownhall/gascity --base %s --head %s:%s --title %q --body %q' \
  "{{upstream_branch}}" "$FORK_OWNER" "$BRANCH" "$PR_TITLE" "$PR_BODY")

if [ "$ISSUE_DECISION" = "yes" ]; then
  ISSUE_CMD=$(printf 'gh issue create --repo gastownhall/gascity --title %q --body %q' \
    "$ISSUE_TITLE" "$ISSUE_BODY")
else
  ISSUE_CMD=""
fi

gc bd update {{issue}} \
  --set-metadata gh_pr_command="$PR_CMD" \
  --set-metadata gh_issue_command="$ISSUE_CMD"
```

**Exit criteria:** metadata carries every promised key with concrete values:
`branch_url`, `suggested_pr_title`, `suggested_pr_body`,
`suggested_issue_title`, `suggested_issue_body`, `issue_advice`,
`gh_pr_command`, `gh_issue_command`. Issue fields are empty strings when no
issue is recommended; `gh_pr_command` has no placeholders."""

[[steps]]
id = "handback-to-keeper"
title = "Reassign the bead to the keeper, nudge, mail backstop"
needs = ["prepare-pr-handoff"]
description = """
Mirror the polecat→refinery handoff contract, destination = the requesting
keeper. The bead stays **open** — the keeper closes it after the title/body
conversation.

**1. Reassign and re-route:**
```bash
REQUESTING_KEEPER=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.requesting_keeper')
gc bd update {{issue}} \
  --status=open \
  --assignee="$REQUESTING_KEEPER" \
  --set-metadata gc.routed_to="$REQUESTING_KEEPER"
```

**2. Nudge the keeper (ephemeral signal):**
```bash
gc session nudge "$REQUESTING_KEEPER" "PR prep ready: {{issue}}"
```

**3. Mail the operator a durable backstop** (the keeper may not be running):
```bash
BRANCH_URL=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.branch_url')
gc mail send human -s "pr-prep ready: {{issue}}" -m "$(cat <<EOF
PR prep is complete for {{issue}}. Branch pushed: $BRANCH_URL.

The keeper ($REQUESTING_KEEPER) has been re-assigned the bead and
nudged. When you're ready to refine the PR title / body, engage the
keeper — it'll surface the drafts and the gh commands for review.

If the keeper isn't running, just spawn it: gc session new $REQUESTING_KEEPER.
EOF
)"
```

**4. Drain and exit:**
```bash
gc runtime drain-ack
exit 0
```

**Exit criteria:** bead open and assigned to the keeper; nudge sent;
operator mailed; session drained."""
