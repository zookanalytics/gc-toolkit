description = """
mol-nx-turn — "I want to talk about this": file one conversation turn on a
subject bead, routed to the converse pool. (Brand, O8.) The operator-driven
trigger of the one entry point — all three triggers (formula-driven,
event-driven, operator-driven) collapse into filing a turn
(specs/tk-h9pq5/design-doc.md, Key Components §5; architecture.md "How work
moves").

Consistency trace: attention budget + earn every interaction -> bead
(continuation group) + role + routing -> Attention & conversation.

Contract: v1, one step — the one-step formula architecture names. Run by
whoever wants the conversation (operator shell, thread-ops, a formula
step); the step files the turn and exits. Pool demand does the spawning.

Interlock (O4, recorded note): files no gated work; nothing to sign off.
"""
formula = "mol-nx-turn"
version = 1

[vars]
[vars.subject]
description = "The subject bead the conversation is about — its id IS the conversation's identity"
required = true

[vars.visit]
description = "The visit prompt: what this turn needs from the operator (decision, review, catch-up). Substituted into a shell command — avoid quote characters, or put the detail in the -d body by hand."
required = true

[vars.binding_prefix]
description = "Import binding prefix with trailing dot; combined with the rig qualifier it names the converse pool (the exact-match read side needs the qualified name — docs/gascity-routing-model.md)"
default = "gc-next."

[[steps]]
id = "file-turn"
title = "File the turn bead in the subject's continuation group"
description = """
```bash
POOL="${GC_RIG:+$GC_RIG/}{{binding_prefix}}converse"
TURN=$(gc bd create -t task --title "turn: {{subject}} — {{visit}}" -d "{{visit}}" --json | jq -r '.id // .[0].id')
gc bd update "$TURN" --set-metadata "gc.routed_to=$POOL" \
  --set-metadata "gc.continuation_group={{subject}}" \
  --set-metadata "task_kind=conversation"
gc bd dep add "$TURN" {{subject}} --type=parent-child
```

The turn's body is the visit prompt; extend the `-d` body if {{visit}}
alone under-specifies the visit. Stamp-don't-sling, one key per flag, and
the POOL must be the rig-qualified exact-match form
(docs/gascity-routing-model.md). Warm, the live group session vacuums the
turn; cold, pool demand spawns one. `task_kind=conversation` is the
structural tell the health patrol's reaper-skip keys on — without it a
held turn reads as an orphan.
"""
