description = "Each RIG patrol chain (land, health-rig) has exactly one open cycle bead and it is not stale — errors on a dead chain (no open cycle bead), warns on a stale one (older than twice the anchor interval), a doubled one (two open links race), or an unreadable ledger. The health-city chain is a stage-4 activation (deviation D6) and is not asserted until it exists. Detect only; the nx-patrol-anchor order is the repair path (spec §4)"
