# converse — works visits: filed requests for bounded sittings of a subject
# bead's dialogue. A visit that still needs a human is held and becomes the
# sitting; one whose premise died closes silently. Design authority:
# specs/tk-h9pq5/design-doc.md; session-ending mechanics (what ends a held
# sitting now that no idle clock does, and how the converse-reap order collects
# the settled session, since a manual session is exempt from the no-wake-reason
# drain) are verified in docs/gascity-human-engagement.md — read that before
# tuning.
# Demand is the default routed-pool predicate; a filed visit IS the demand.
scope = "rig"
wake_mode = "fresh"
# A rig worktree, not a plain dir under the city tree: the sitting shells gh/git
# to inspect the rig's PRs and branches, and those tools resolve the repo from
# the working directory. Under .gc/agents/ that resolves to the city repo the
# .gc tree sits in, not the rig this agent serves. worktree-setup.sh cuts the
# checkout from the rig root, as the polecat/proactive/refinery pools already do.
work_dir = ".gc/worktrees/{{.Rig}}/converse/{{.AgentBase}}"
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
# Empty on purpose, and empty is not what protects a sitting. converse runs as
# a manual (spawn-on-engagement) session, never pool_managed, and all three
# claim backstops gate governs() on pool_managed (gascity idle_nudge.go,
# execution_backstop.go), so none of them fires against a held sitting whatever
# this field holds. The manual origin is the exemption. Empty is also not a
# uniform "skip": the three claim backstops split on an empty nudge. Only the
# execution backstop drains on it: gascity's shared empty-content path
# (nudge_backstop.go) runs its exhausted action, the tracked drain that
# releases the claim. The pool-claim backstop substitutes a default claim nudge
# and re-delivers instead. The continuation backstop's exhausted action is a
# no-op. Neither of those drains. So for a pool_managed session emptiness
# drains only through the execution backstop, and converse, never pool_managed,
# is reached by none of it.
# Nothing is lost at launch. The launch delivers the rendered prompt, and step 1
# of that prompt is the claim block, so a fresh slot claims with no keystrokes.
# A provider that takes no prompt argument gets the prompt prepended to this
# field, and prepending to an empty field still delivers it, so the precondition
# is the prompt rather than prompt_mode. A prompt that stops opening with the
# claim block leaves nothing to start the turn.
# Non-empty text does not arm a backstop here; it feeds that launch delivery.
# The text must then name converse-claim.sh (the claimer — the scoped claim
# lives there, never the raw `gc hook --claim`), and it must send the session
# back through the prompt's step-1 block instead of naming the script alone. A
# bare invocation passes no group, so the out-of-group guard reads "first claim
# of a session: any group" on every wake — and the action=hold verdict, which is
# what stops a nudge from ending a live sitting, is read in that block and
# nowhere else. Keep it at peer length; fixes go in the prompt or a script.
nudge = ""
# 0 disables the idle reap for this role; any positive value re-arms it. A
# sitting ends when its visit closes — the agent's own sign-off, or the
# operator's bare `gc-helm dismiss` (it infers the subject) — and the
# `converse-reap` order then closes the settled, unattached session, so the
# max_active_sessions slot is freed once the visit closes rather than leaking.
# Why, and the ending this does not reach (an OPEN visit the operator walked
# away from): docs/gascity-human-engagement.md.
idle_timeout = "0"
min_active_sessions = 0
# Bounds concurrently LIVE sittings only; open visits queue at zero cost. A
# conservative floor that rigs raise in city.toml when their own queue earns it.
# Every rig running converse at this default fits inside the city session cap; a
# pack default sized for one deep queue would starve the polecat pools and the
# refinery in every other rig.
max_active_sessions = 2
