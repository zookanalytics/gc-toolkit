# converse — works visits: filed requests for bounded sittings of a subject
# bead's dialogue. A visit that still needs a human is held and becomes the
# sitting; one whose premise died closes silently. Design authority:
# specs/tk-h9pq5/design-doc.md; session-ending mechanics (what ends a held
# sitting now that no idle clock does, and the no-wake-reason drain that takes
# the pane once one ends) are verified in docs/gascity-human-engagement.md —
# read that before tuning.
# Demand is the default routed-pool predicate; a filed visit IS the demand.
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/converse/{{.AgentBase}}"
# Three constraints on editing the nudge: it must name converse-claim.sh (the
# claimer — the scoped claim lives there, never the raw `gc hook --claim`); it
# must never be empty (a CLI agent needs typed text to start a turn); and it
# must send the session back through the prompt's step-1 block instead of
# naming the script alone. A bare invocation passes no group, so the
# out-of-group guard reads "first claim of a session: any group" on every wake
# — and the action=hold verdict, which is what stops a nudge from ending a
# live sitting, is read in that block and nowhere else.
# Keep it at peer length; fixes go in the prompt or a script.
nudge = "Run step 1's claim block (assets/scripts/converse-claim.sh) with your current subject; follow the action it returns."
# 0 disables the idle reap for this role; any positive value re-arms it. A
# sitting then ends only when its visit closes — the agent's own sign-off, or
# the operator's `gc-helm dismiss <subject>` — so a held visit holds a
# max_active_sessions slot until one of those runs. Why, and the endings this
# does not remove: docs/gascity-human-engagement.md.
idle_timeout = "0"
min_active_sessions = 0
# Bounds concurrently LIVE sittings only; open visits queue at zero cost.
max_active_sessions = 6
