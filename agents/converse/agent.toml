# converse — works visits: filed requests for bounded sittings of a subject
# bead's dialogue. A visit that still needs a human is held and becomes the
# sitting; one whose premise died closes silently. Design authority:
# specs/tk-h9pq5/design-doc.md; session-ending mechanics (idle_timeout DOES
# end a held sitting; the no-wake-reason drain takes the pane after it) are
# verified in docs/gascity-human-engagement.md — read that before tuning.
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/converse/{{.AgentBase}}"
# Two constraints on editing the nudge: it must name converse-claim.sh (the
# claimer — the scoped claim lives there, never the raw `gc hook --claim`),
# and it must never be empty (a CLI agent needs typed text to start a turn).
# Keep it at peer length; fixes go in the prompt or a script.
nudge = "Run assets/scripts/converse-claim.sh; work the visit it returns."
# Bounds how long an unattended HELD sitting survives; open visits outlive
# sessions either way (recovery reconstitutes from the record).
idle_timeout = "8h"
min_active_sessions = 0
# Bounds concurrently LIVE sittings only; open visits queue at zero cost.
max_active_sessions = 6

# scale_check = the reconciler's SPAWN predicate, in count form (0 = no demand).
#
# The --db pin is the load-bearing half. The default probe runs bare `bd ready`,
# which resolves its store from the pool work_dir, and converse's work_dir is a
# plain directory under the city root rather than a rig worktree — so it carries
# no .beads and the read walks up to the CITY store, while a rig-scope session
# claims from the rig store. City-filed visits routed here are then counted as
# demand no converse session can claim, and the pool pins at max_active_sessions
# against them. Every other pool agent in this pack works from a rig worktree,
# which does carry .beads; moving this work_dir into one would make the pin
# redundant rather than wrong.
#
# The flags mirror the offer's serving rules (gascity internal/config,
# PoolDemandServeRules): a row the offer withholds is not a seat's worth of work.
# A hold label added there and not here re-opens the same gap.
scale_check = '''
_='' # env-prefix landing: the reconciler prepends VAR='…' to line 1; a bare assignment absorbs and persists it (line 1 must stay a bare assignment).
target="{{.Rig}}/gc-toolkit.converse"
n=$(gc bd ready --db {{.RigRoot}}/.beads --metadata-field "gc.routed_to=$target" --unassigned --exclude-type=epic --exclude-label "hold:mayor" --exclude-label "hold:external" --json --limit 0 2>/dev/null | jq 'length' 2>/dev/null)
if [ -n "$n" ]; then printf '%s' "$n"; else printf '0'; fi
'''
