# converse — works visits: filed requests for bounded sittings of a subject
# bead's dialogue. A visit that still needs a human is held and becomes the
# sitting; one whose premise died closes silently. Design authority:
# specs/tk-h9pq5/design-doc.md; session-ending mechanics (idle_timeout DOES
# end a held sitting; the no-wake-reason drain takes the pane after it) are
# verified in docs/gascity-human-engagement.md — read that before tuning.
# Demand is the default routed-pool predicate; a filed visit IS the demand.
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/converse/{{.AgentBase}}"
# Two constraints on editing the nudge: it must name converse-claim.sh (the
# claimer — the scoped claim lives there, never the raw `gc hook --claim`),
# and it must never be empty (a CLI agent needs typed text to start a turn).
# Keep it at peer length; fixes go in the prompt or a script.
nudge = "Run assets/scripts/converse-claim.sh; work the visit it returns."
# Bounds how long an unattended HELD sitting survives; open visits outlive
# sessions either way (recovery reconstitutes from the record).
idle_timeout = "8h"
min_active_sessions = 0
# Bounds concurrently LIVE sittings only; open visits queue at zero cost.
max_active_sessions = 6
