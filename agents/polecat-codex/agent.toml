# polecat-codex — the rig's worker pool on the codex provider. Same doctrine
# and prompt shape as agents/polecat; the merge cadence routes review beads
# (carrying mol-review) here via REVIEW_POOL, but any bead-with-formula is
# claimable.
scope = "rig"
provider = "codex"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/polecat-codex/{{.AgentBase}}"
# The nudge is the whole instruction a woken pool slot acts on, so it names the
# task and not just the command that starts it. A nudge naming only a command is
# obeyed literally: the session runs the claim, reports the JSON, and stops, and
# nothing re-offers a held claim. The two pools differ only in provider, so both
# carry this same nudge text.
nudge = """
Claim and complete one work item: gc hook --claim --json returns assigned work \
first and routed pool work second, and the bead it names is yours to carry \
through its formula to the terminal step. Claiming is not completing. A reason \
of existing_assignment means you already hold the work, so execute it instead \
of reporting it. If you cannot proceed, record why on the bead and clear your \
assignee so the work is re-offered.\
"""
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
min_active_sessions = 0
# Pool sizing, not review policy: two concurrent sessions per rig.
max_active_sessions = 2
