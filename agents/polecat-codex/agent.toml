# polecat-codex — the rig's worker pool on the codex provider. Same doctrine
# and prompt shape as agents/polecat; the merge cadence routes review beads
# (carrying mol-review) here via REVIEW_POOL, but any bead-with-formula is
# claimable.
scope = "rig"
provider = "codex"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/polecat-codex/{{.AgentBase}}"
# The nudge is the whole instruction a pool slot acts on when it wakes, so it
# names the task and not just the command to run. A session that reads it as a
# command runs the claim and stops, holding a claim on work that nothing will
# re-offer. It opens with gc prime because a codex session arrives with none of
# its rendered doctrine loaded, leaving the nudge as the only thing in context.
nudge = """
Run gc prime to load your doctrine before you act. Then claim and complete one \
work item: gc hook --claim --json returns assigned work first and routed pool \
work second, and the bead it names is yours to carry through its formula to \
the terminal step. Claiming is not completing. A reason of \
existing_assignment means you already hold the work, so execute it instead of \
reporting it. If you cannot proceed, record why on the bead and clear your \
assignee so the work is re-offered.\
"""
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
min_active_sessions = 0
# Pool sizing, not review policy: two concurrent sessions per rig.
max_active_sessions = 2
