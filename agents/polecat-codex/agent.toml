# polecat-codex — the rig's worker pool on the codex provider. Same doctrine
# and prompt shape as agents/polecat; the merge cadence routes review beads
# (carrying mol-review) here via REVIEW_POOL, but any bead-with-formula is
# claimable.
scope = "rig"
provider = "codex"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/polecat-codex/{{.AgentBase}}"
# The nudge is the whole instruction a woken pool slot acts on, so it names the
# task and not just the command that starts it. A nudge naming only a command is
# obeyed literally: the session runs the claim, reports the JSON, and stops, and
# nothing re-offers a held claim. Both pools wake into the same startup and
# claim contract, so the text is identical in both.
#
# The hand-back in the nudge is the write assets/scripts/hand-back.sh makes for
# an in_progress claim, spelled out as one command because a session's
# environment names no pack directory to run that script from. The script's
# header gives the reasons for the write's shape.
#
# The nudge points at the prompt's claim contract for the one read a session
# orients from, assets/scripts/claim-context.sh, rather than naming the script:
# gc expands no template in a nudge, so only the prompt can render the pack's
# path.
#
# The nudge stays within 800 bytes, for the reason agents/polecat/agent.toml
# gives.
nudge = """
Claim and complete one work item: the bead gc hook --claim --json names is \
yours to carry through its formula to the terminal step. Claiming is not \
completing: a reason of existing_assignment means you already hold the work, \
so execute it rather than report it. Orient from the result and the one read \
your prompt's claim contract names. If you cannot proceed, record why on the \
bead, then hand it back with one write that reopens it and releases your \
claim: `gc bd update <bead> --if-assignee="${GC_ALIAS:-$GC_SESSION_ID}" \
--if-status=in_progress --status=open --assignee="" --unset-metadata \
gc.session_id --unset-metadata gc.session_name`. If that exits non-zero, keep \
your assignee, say so on the bead, and orphan recovery returns the bead once \
your session ends.\
"""
# Codex reads no .claude overlay, so the gh origin guard is registered in the
# Codex home before the session starts (docs/gh-origin-guard.md, "Codex").
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync", "{{.ConfigDir}}/assets/scripts/gh-origin-guard-codex.sh"]
idle_timeout = "2h"
min_active_sessions = 0
# Pool sizing, not review policy: two concurrent sessions per rig.
max_active_sessions = 2
