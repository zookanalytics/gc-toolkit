# refinery — per-rig merge judgment (named singleton, on_demand; the
# [[named_session]] stanza lives in pack.toml). A session takes one item
# assigned to it through mol-refinery-patrol's steps and ends, and Gas City
# starts one only when an item waits or a wake names one. The 60s merge cadence
# is the refinery-reconcile ORDER, not this session.
scope = "rig"
wake_mode = "fresh"
# {{.AgentBase}} names the one session the cap below allows, so each rig has one
# tree. Gas Town's refinery works in the parent directory, which holds that tree
# here. Moving work_dir there would leave the tree untracked inside the new one,
# and worktree-setup.sh --sync fails a start on an untracked file.
work_dir = ".gc/worktrees/{{.Rig}}/refinery/{{.AgentBase}}"
nudge = "Run gc prime, then take the one item waiting for you: the steps of mol-refinery-patrol, from validate-identity to end-session."
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
# The search a session's gc hook --claim takes its item through, which leaves
# nothing Gas City counts as the refinery's demand that it would not take
# (gctk refinery next --help).
work_query = "\"${GCTK_BIN:-$GC_CITY_PATH/.gc/services/gctk/bin/gctk}\" refinery next"
# A session ends itself once its item's last write is made, so this stops only
# a session that stopped answering.
idle_timeout = "2h"
# A rig runs one refinery: its gate's record is one per rig
# (refinery-lib.sh, refinery_gate_dir), and a gate's start stops a gate another
# session left, so two refineries would stop each other's gates. With no cap,
# or a higher one, Gas City's pool starts numbered refineries beside the named
# one (docs/gascity/agent-types.md, "A cap of 1 puts routed work on the named
# session").
max_active_sessions = 1
