# refinery — per-rig merge-judgment patrol (named singleton, on_demand; the
# [[named_session]] stanza lives in pack.toml). Runs mol-refinery-patrol.
# The 60s merge cadence is the refinery-reconcile ORDER, not this session.
scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/refinery/{{.AgentBase}}"
nudge = "Run gc prime, then the startup wisp reconcile; process the merge queue."
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
# work_dir is per-instance, so the routed-pool path can materialize numbered
# refineries alongside the named singleton. The patrol reconcile in
# prompt.template.md collects one wisp per rig by title. Two refineries on a rig
# therefore burn each other's in-flight wisps, and this cap is what prevents it.
max_active_sessions = 1
