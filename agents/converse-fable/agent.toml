# converse-fable — kept for the sittings already open on it. engage does not
# offer it, and opens converse-claude-fable for the same model. Gas City's
# reconciler wakes no session whose template is not configured, drains one
# that holds no work, and closes one whose process is gone, releasing the
# conversation it held, so this template stays until no open sitting runs on
# it. Its fields are the ones its sittings started on, documented on
# converse-claude-opus.
scope = "rig"
provider = "claude"
option_defaults = { model = "claude-fable-5-2" }
prompt_template = "agents/_converse/prompt.template.md"
work_dir = ".gc/worktrees/{{.Rig}}/converse-fable/{{.AgentBase}}"
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
wake_mode = "resume"
attach = true
session_live = [
  'tmux ${GC_TMUX_SOCKET:+-L "$GC_TMUX_SOCKET"} set-option -t "={{.Session}}:" detach-on-destroy on',
  'tmux ${GC_TMUX_SOCKET:+-L "$GC_TMUX_SOCKET"} set-option -t "={{.Session}}:" set-titles on \; set-option -t "={{.Session}}:" set-titles-string "#{?#{GC_DRAIN_ACK},done · ,}#T"',
]
nudge = ""
idle_timeout = "0"
sleep_after_idle = "10m"
min_active_sessions = 0
max_active_sessions = 8
