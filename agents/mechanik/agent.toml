# mechanik — city-scoped structural engineer (named singleton, always;
# stanza in pack.toml). Dispatches pack edits to polecats; direct-edits city.toml.
scope = "city"
# mechanik runs on Fable because the operator talks to it directly.
provider = "claude"
option_defaults = { model = "claude-fable-5-2" }
# mechanik holds the operator's standing conversation, and its prompt's start
# step pins its session. resume brings it back after a restart the pin does not
# prevent, such as the process exiting on its own. One restart still starts
# fresh: after a config change moves mechanik's fingerprint while it is alive,
# the pin defers the drift, and the next restart repairs it with a new
# conversation. Running `gc reload --soft` after such a change rebaselines
# started_config_hash in place, and the next restart resumes. `gc handoff`
# always starts a fresh conversation.
wake_mode = "resume"
work_dir = ".gc/agents/mechanik"
nudge = "Check mail (gc mail inbox) and assigned work (gc hook), then act accordingly."
# 0, as the controller applies no idle_timeout to an always-mode named session.
idle_timeout = "0"
