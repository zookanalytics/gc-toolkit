# converse-opus — a converse sitting on the Opus work tier, and the default of
# the per-model converse templates (converse-*). They share the converse role
# and prompt and differ only in provider and model; this one carries the longer
# per-field documentation the others point back to. `gc-helm engage` opens one
# with `gc session new converse-opus --alias <conversation> --no-attach`: the
# alias is the conversation task's id (`c-<id>` where the runtime refuses the
# bare id), and the conversation's assignee is that alias, which is how its
# claim finds it, through the default work query, so the template needs no work
# query of its own. That is an origin=manual session, which is not pool_managed,
# so the controller's pacing of pool work never reaches it: the work ladder
# governs pool-managed seats only, and so do the claim backstops it replaces
# when `[daemon] work_ladder` is off. A pane held open for a conversation is
# never recycled or drained for being quiet.
# Session-ending mechanics (when a sitting's conversation is done, and when its
# agent runs and stops) are documented in docs/human-engagement.md, which links
# the Gas City facts beneath them; read that before tuning.
scope = "rig"
provider = "claude"
option_defaults = { model = "claude-opus-5-5" }
# Share the converse role's prompt rather than carry a copy; a variant differs
# from its siblings only in provider and model. The prompt lives in
# agents/_converse/, which defines no agent: the pack loader skips a directory
# under agents/ whose name starts with `_`. Retiring any one variant is then a
# plain directory delete that leaves the prompt the others read in place.
prompt_template = "agents/_converse/prompt.template.md"
# A rig worktree, not a plain dir under the city tree: the sitting shells gh/git
# to inspect the rig's PRs and branches, and those tools resolve the repo from
# the working directory. Under .gc/agents/ that resolves to the city repo the
# .gc tree sits in, not the rig this sitting serves. worktree-setup.sh cuts the
# checkout from the rig root, as the polecat/proactive/refinery pools already do.
work_dir = ".gc/worktrees/{{.Rig}}/converse-opus/{{.AgentBase}}"
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
# resume carries the conversation across suspend, pin, and every wake; a fresh
# session per conversation is what makes each sitting new, so the thread lives
# here.
wake_mode = "resume"
# The operator attaches to the sitting.
attach = true
# A client attached to the sitting exits when the sitting's session is
# destroyed under it, instead of moving to another session. detach-on-destroy
# is a tmux session option, so this sets it for the sitting's session alone and
# leaves the server's global value as it is: a client attached with
# `-f no-detach-on-destroy`, and every client on any other session, still moves
# on. `gc-helm engage` runs its attach as a child, so once the client exits, on
# a detach or with the session, it reads the conversation, and prints the
# sitting's last hand-back when the sitting has ended. Gas City runs
# session_live after every start of the session with GC_TMUX_SOCKET naming the
# city's tmux server, and re-applies a changed value without a restart. The
# `=<name>:` target matches the session exactly.
# The second entry passes the sitting's pane title on to the terminal of a
# client attached to it, so the operator's tab shows the sitting's title. The
# sitting sets that title with `gctk session title`, which has Claude Code or
# Codex name its own session, and each draws that name as its terminal title,
# which tmux keeps as the pane title (#T). set-titles is a session option too,
# so the entry reaches the sitting's session alone and leaves the server's
# global value as it is. The title leads with "done · " once the session's tmux
# environment holds GC_DRAIN_ACK, which every `gc runtime drain-ack` of the
# session sets, its own or an operator's, so a tab on a sitting that has
# drained reads done while the pane stays live under it. tmux reads the flag
# when it next draws the title: at once when the pane prints, and otherwise at
# its next status refresh, every 15 seconds by default. A restart starts the
# session without the flag.
session_live = [
  'tmux ${GC_TMUX_SOCKET:+-L "$GC_TMUX_SOCKET"} set-option -t "={{.Session}}:" detach-on-destroy on',
  'tmux ${GC_TMUX_SOCKET:+-L "$GC_TMUX_SOCKET"} set-option -t "={{.Session}}:" set-titles on \; set-option -t "={{.Session}}:" set-titles-string "#{?#{GC_DRAIN_ACK},done · ,}#T"',
]
# Empty on purpose, and empty is not what protects a sitting. A sitting runs as
# a manual (spawn-on-engagement) session, never pool_managed. The work ladder,
# which nudges and recycles claimed work, governs pool-managed seats only
# (ladderGoverns in gascity's cmd/gc/work_ladder_lane.go), and so do the claim
# backstops it replaces when `[daemon] work_ladder` is off, so nothing nudges
# or drains a held sitting whatever this field holds. The manual origin is the
# exemption.
# Nothing is lost at launch. The launch delivers the rendered prompt, and that
# prompt's loop opens with the claim block, so a fresh sitting claims with no
# keystrokes. A provider that takes no prompt argument gets the prompt prepended
# to this field, and prepending to an empty field still delivers it, so the
# precondition is the prompt rather than prompt_mode. A prompt that stops
# opening with the claim block leaves nothing to start the turn.
# Non-empty text arms no nudge here; it feeds that launch delivery.
# The text must then send the session back through the prompt's claim block
# rather than name `gc hook --claim` alone: the block's restart rule, which
# reads an existing assignment as a sitting to resume rather than one to drain
# or work to a close, is what stops a nudge from ending a live sitting, and it
# is read there and nowhere else. Keep it at peer length; fixes go in the
# prompt.
nudge = ""
# 0 keeps this template off the idle ladder; any positive value re-arms it. That
# ladder kills and restarts a session after no terminal output, and an operator
# reading a held thread produces none.
idle_timeout = "0"
# How a sitting ends. Its conversation is done only when the agent's sign-off
# or the operator's bare `gc-helm dismiss` (it infers the conversation) closes
# it, and each then runs `gc runtime drain-ack`, whose flag marks the tab done
# (session_live above). The v2 reconciler holds that stop while a client is
# attached, so the pane stays live while the operator watches, and stops the
# agent within about five minutes of the detach. The record then reads drained,
# and the core reaper closes it a day later. A sitting cut short while it holds
# its conversation keeps running until the operator re-attaches or dismisses,
# and a low-context sitting hands its conversation back to the operator's queue
# and drains.
# A sitting that holds no open conversation, such as one whose conversation was
# closed by hand, is stopped by this idle sleep. v2 sleeps a session that holds
# no claimed or assigned work and has no client attached once this long has
# passed since its last detach or terminal output, and the record then stays
# asleep, holding no process, until it is closed. Attaching wakes it with its
# thread (wake_mode above). Gas City warns at its start and at each config
# reload that idle_timeout and sleep_after_idle are both set, and with
# idle_timeout at 0 this one applies.
# A slept session stays asleep only while its recorded sleep policy matches
# this one, so changing the value wakes every sitting it has slept, and each
# runs its prompt's claim again. docs/human-engagement.md has the mechanics.
sleep_after_idle = "10m"
# Sittings are opened by hand, never spawned by demand: min 0 starts nothing.
# max_active_sessions does not ration them: `gc session new` checks no session
# count, and the reconciler keeps every manual session that is neither closed
# nor drained wanted, whatever the count.
min_active_sessions = 0
max_active_sessions = 8
