# converse-codex — a converse sitting on the codex provider. One of the
# per-model converse templates (converse-*), which share the converse role and
# prompt and differ only in provider and model. `gc-helm engage` opens one with
# `gc session new converse-codex --alias <conversation> --no-attach`, whose
# alias is the conversation task's id: an origin=manual session, which is not
# pool_managed, so the pool execution backstop never governs it and a pane held
# open for a conversation is not reaped by a no-nudge drain. The field
# rationale is documented on converse-opus.
scope = "rig"
provider = "codex"
option_defaults = { model = "gpt-6.1-sol" }
prompt_template = "agents/_converse/prompt.template.md"
work_dir = ".gc/worktrees/{{.Rig}}/converse-codex/{{.AgentBase}}"
# Codex reads no .claude overlay, so the gh origin guard is registered in the
# Codex home before the session starts (docs/gh-origin-guard.md, "Codex").
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync", "{{.ConfigDir}}/assets/scripts/gh-origin-guard-codex.sh"]
wake_mode = "resume"
attach = true
session_live = ['tmux ${GC_TMUX_SOCKET:+-L "$GC_TMUX_SOCKET"} set-option -t "={{.Session}}:" detach-on-destroy on']
nudge = ""
idle_timeout = "0"
min_active_sessions = 0
max_active_sessions = 8
