# proactive — the dedicated, small, always-on pool for first reactions. A bead
# is routed to it RAW (gc.routed_to only, no formula); a worker claims it with
# `gc hook --claim`, reads it, writes a card to its notes, and disposes — route
# the bead to a pool, hold it on a `blocks` edge, file a visit, or close it as
# superseded — per agents/proactive/prompt.template.md, then drains. NOT a
# resident loop — a bead reaches it via `tools/gc-proactive.sh sling <bead>` or
# `tools/gc-proactive.sh scan --sling`. max_active_sessions = 2 is this pool's
# only throttle: routed beads queue at zero cost until a slot frees, so the
# pool never starves impl work and never drops a slung reaction. How many
# beads ONE `scan --sling` sweep may hand it is a separate bound,
# GC_PROACTIVE_SLING_CAP in tools/gc-proactive.sh. mr-only for any code it
# produces. Demand ranking is mirrored testably in tools/gc-proactive.sh
# (`demand`, `board_rank`) — keep the copies in sync.
# Design: specs/bead-universe/design-doc.md Phase 4.

scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/proactive/{{.AgentBase}}"
nudge = "Claim one routed subject with gc hook --claim, react to it per your prompt (write the card, then dispose), and drain. If the claim returns nothing, drain."
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 2

# work_query = the running worker's discovery query: routed demand ranked by
# board weight (oldest-first within a band), sliced to the worker's page. The
# jq drops graph.v2 STRUCTURAL beads — topology ROOTS (gc.kind in workflow/
# scope/spec) and formula STEP beads (gc.step_ref/gc.step_id/gc.root_bead_id
# set). A root is routed only to name its run and gc hook --claim never offers
# it; a step advances its own workflow by closing its own bead, so reacting to
# it as a subject derails a live molecule. The claimable unit is the routed
# subject bead itself (a plain task/bug/feature/spike), which survives the
# filter. It reads the FULL routed set (--limit 0) and drops the structural
# beads BEFORE the 20-row slice, so a page filled by them cannot bury a
# claimable subject behind them — that would leave this query empty while
# scale_check, which counts the same full filtered set, reads > 0, spawning a
# worker that claims nothing and drains. The gc binary's default pool query
# carries the root clause on both the worker and count forms; this custom pair
# broadens it to steps and must keep both forms in sync.
work_query = '''
_='' # env-prefix landing: the reconciler prepends VAR='…' to line 1; a bare assignment absorbs and persists it (line 1 must stay a bare assignment).
target="{{.Rig}}/gc-toolkit.proactive"
r=$(gc bd ready --db {{.RigRoot}}/.beads --metadata-field "gc.routed_to=$target" --unassigned --exclude-type=epic --json --limit 0 2>/dev/null | jq 'def prio_w($p): (if $p == null then 1 else ([0, 4 - $p] | max) end); map(select((((.metadata["gc.kind"] // "") | (. == "workflow" or . == "scope" or . == "spec")) or ((.metadata["gc.step_ref"] // "") != "") or ((.metadata["gc.step_id"] // "") != "") or ((.metadata["gc.root_bead_id"] // "") != "")) | not)) | sort_by(-(prio_w(.priority)), (.created_at // "")) | .[0:20]' 2>/dev/null)
if [ -n "$r" ]; then printf '%s' "$r"; else printf '[]'; fi
'''

# scale_check = the reconciler's SPAWN predicate; work_query's demand in count
# form (0 = no demand = no spawn) so a spawn always finds work to claim. It
# counts the SAME full filtered set (--limit 0, graph.v2 structural beads
# dropped) that work_query board-ranks and slices, so scale_check > 0 holds
# exactly when work_query can return a row: counting a root gc hook --claim will
# never offer, or a step it must not react to, would spawn a worker with nothing
# safe to claim — the churn this pool hit.
scale_check = '''
_='' # env-prefix landing — same rationale as work_query's line 1.
target="{{.Rig}}/gc-toolkit.proactive"
n=$(gc bd ready --db {{.RigRoot}}/.beads --metadata-field "gc.routed_to=$target" --unassigned --exclude-type=epic --json --limit 0 2>/dev/null | jq '[ .[] | select((((.metadata["gc.kind"] // "") | (. == "workflow" or . == "scope" or . == "spec")) or ((.metadata["gc.step_ref"] // "") != "") or ((.metadata["gc.step_id"] // "") != "") or ((.metadata["gc.root_bead_id"] // "") != "")) | not) ] | length' 2>/dev/null)
if [ -n "$n" ]; then printf '%s' "$n"; else printf '0'; fi
'''

# mr-invariant, belt-and-suspenders: code from a first reaction defaults to
# the gated mr path, never direct.
[env]
GC_DEFAULT_MERGE_STRATEGY = "mr"
