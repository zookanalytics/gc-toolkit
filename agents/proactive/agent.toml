# proactive — the dedicated, small, always-on pool that runs first reactions.
# A reaction is a run of formulas/mol-first-reaction.toml slung on its subject
# by `gctk reaction sling` and `gctk reaction sweep`. The pour routes the
# run's one step, react, to this pool, and Gas City's default work
# query offers that step to a worker, which reads the subject, writes a card
# to its notes, then disposes the subject — route it to a pool (or, when no
# epic holds it, hold it with Gas City's hold:mayor label for the operator's
# placement sitting) or assign it to a named agent other than the po, hold it
# on a `blocks` edge, hand a confident no-op to a validating closer, or put it
# to the operator as a human gate — and closes its step. NOT a resident loop.
# max_active_sessions = 2 is this pool's only throttle: a slung run waits at no
# cost until a slot frees, so the pool never starves impl work and never drops
# a reaction. mr-only for any code a reaction produces.
# Design: specs/tk-1tfzr71.105/design.md.

scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/proactive/{{.AgentBase}}"
nudge = "Run gc hook --claim; proactive demand is the react step of a mol-first-reaction run on a subject. React to the subject, dispose it, close the step. If the claim returns nothing, drain."
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 2
# A sling or an arm aimed at this pool with no formula of its own pours a
# first reaction, never the city's default work formula.
default_sling_formula = "mol-first-reaction"
