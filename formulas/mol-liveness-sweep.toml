description = """
mol-liveness-sweep — the P3 enforcement pass: no idle beads. Every open
bead must be worked, waiting-on-structure, gated, conversing, or
held-by-design; anything else is an UNNAMED WAIT
(specs/2026-08-fresh-start/operating-principles.md P3;
specs/2026-08-fresh-start/liveness-and-triage-spec.md §2, as amended by
the operator's 2026-08-08 review).

Normalization is BATCHED, not per-bead (operator review: N idle beads
must cost one conversation, not N): the sweep owns a standing
"unnamed waits" triage subject per rig and files ONE visit per pass
listing every candidate. Per-bead conversations emerge only from that
sitting's outcomes ("start a visit on X" is a decision the human makes
inside the batch visit, not something the sweep presumes).

Graph-liveness only: the witness patrol owns SESSION-liveness (dead
assignees, orphan recovery); this sweep never touches assigned work.
Fired by orders/liveness-sweep.toml on cooldown; one fire = one pass:
classify, batch-file, log, drain.

Contract: v1 — a one-shot linear pass, the doc-keeper shape.
"""
formula = "mol-liveness-sweep"
version = 1

[vars]
[vars.list_cap]
description = "Max candidates enumerated in one batch visit, for readability of the sitting"
default = "20"

[[steps]]
id = "classify"
title = "Classify every open bead; isolate the unnamed waits"
description = """
Build the classification from two listings. **Fail-safe first (the
witness discipline): if either command fails or returns a non-array,
write a note explaining what broke, file NOTHING, and drain — never
normalize on partial data.**

```bash
OPEN=$(mktemp); READY=$(mktemp)
gc bd list --status=open --json --limit=0 > "$OPEN"
gc bd ready --unassigned --limit=0 --json > "$READY"
jq -e 'type=="array"' "$OPEN" >/dev/null && jq -e 'type=="array"' "$READY" >/dev/null \
  || { echo "FAIL-SAFE: listing unreadable — sweep aborts, nothing filed"; exit 1; }
```

The classes — every open bead must be one of these, and the first four
are named waits or live work; only the fifth is a defect:

1. **worked** — assigned, or `gc.routed_to` non-empty (a pool will
   claim it).
2. **waiting-on-structure** — open blockers, or open children. This is
   type-agnostic (no special-casing of epics): a parent whose children
   are still open is waiting on them by construction. `gc bd ready`
   already excludes blocker-blocked beads and gates; children require
   the check below.
3. **conversing** — it IS a visit (`task_kind=visit`), or an open visit
   exists in its continuation group.
4. **held-by-design** — `task_kind=triage-subject` (waits on its own
   visits).
5. **unnamed** — none of the above: the defect this sweep exists for.

Mechanically: start from the ready set (unassigned, unblocked,
ungated), drop routed / visit / triage-subject / in-an-open-group
beads with the jq below — then, for each survivor **that has
children** (epics prominently included), confirm the children's state
with `gc bd show <id>` : open children → class 2, drop it; all
children closed or none → keep. An epic whose children have all closed
is a first-class unnamed wait — it needs a "what comes next?"
exploration, and this is exactly how it surfaces.

```bash
CANDIDATES=$(jq -n --slurpfile open "$OPEN" --slurpfile ready "$READY" '
  ([($open[0] // [])[]
     | select((.metadata.task_kind // "") == "visit")
     | (.metadata["gc.continuation_group"] // empty)]) as $convgroups
  | [ ($ready[0] // [])[]
      | select((.metadata["gc.routed_to"] // "") == "")
      | select((.metadata.task_kind // "") != "visit")
      | select((.metadata.task_kind // "") != "triage-subject")
      | select(.id as $id | ($convgroups | index($id)) | not)
    ] | map({id, title, type})')
printf '%s\n' "$CANDIDATES"
# now apply the children check per candidate (class 2 drop) before step 2
```

Record in your notes: the counts per class, the surviving unnamed ids,
and any candidate you dropped via the children check.
"""

[[steps]]
id = "normalize"
title = "One batch visit on the sweep's triage subject (never per-bead)"
description = """
**1. Resolve the sweep's standing triage subject** (one per rig; create
on first run, idempotent — search `$OPEN` for it first):

```bash
SWEEP_SUBJECT=$(jq -r '[.[] | select((.metadata.task_kind // "") == "triage-subject")
  | select((.metadata["triage.scope"] // "") == "unnamed-waits")] | (.[0].id // "")' "$OPEN")
if [ -z "$SWEEP_SUBJECT" ]; then
  SWEEP_SUBJECT=$(gc bd create -t task --title "triage: unnamed waits (this rig)" \
    -d "Standing triage scope: open beads with no worker, route, structure-wait, gate, or visit. Each visit lists the current unnamed waits; dispositions are route / gate / park-into-a-scope / kill — or open a visit on one." --json | jq -r '.id // .[0].id')
  gc bd update "$SWEEP_SUBJECT" --set-metadata "task_kind=triage-subject" \
    --set-metadata "triage.scope=unnamed-waits"
fi
```

**2. Skip if its visit is already open** — if `$SWEEP_SUBJECT` appears
in the open-visit continuation groups from the classify step, log
"batch visit already open; N candidates await it" and drain. The human
closes the visit by working through it; the next pass picks up what
remains. Self-limiting: the backlog never costs more than one
conversation.

**3. Otherwise, if any unnamed waits survived, file ONE visit** listing
up to {{list_cap}} of them (one line each: `id — title — why it reads
idle`, the epic what-comes-next candidates called out as such; put the
list in the `-d` body):

```bash
# >>> gate-visit
POOL="${GC_RIG:+$GC_RIG/}gc-toolkit.converse"
VISIT=$(gc bd create -t task --title "visit: $SWEEP_SUBJECT — unnamed waits: N candidates to disposition" \
  -d "<the candidate list, one line per bead, built from the classify step>" --json | jq -r '.id // .[0].id')
gc bd update "$VISIT" --set-metadata "gc.routed_to=$POOL" \
  --set-metadata "gc.continuation_group=$SWEEP_SUBJECT" \
  --set-metadata "task_kind=visit"
gc bd dep add "$VISIT" "$SWEEP_SUBJECT" --type=parent-child
# <<< gate-visit
```

Zero unnamed waits → file nothing (an empty board is success). Log the
outcome either way: filed (visit id + candidate count), skipped-open,
or clean. Then drain — the pass is complete.
"""
