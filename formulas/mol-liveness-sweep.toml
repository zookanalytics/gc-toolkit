description = """
mol-liveness-sweep — the P3 enforcement pass: no idle beads. Every open
bead must be worked, gated (by structure or by a gating state),
conversing, or held-by-design; anything else is an UNNAMED WAIT
(specs/2026-08-fresh-start/operating-principles.md P3;
specs/2026-08-fresh-start/liveness-and-triage-spec.md §2).

Normalization is BATCHED, not per-bead: the sweep owns a standing
"unnamed waits" triage subject per rig and files ONE visit per pass —
a large backlog costs one conversation, never one per idle bead.
Per-bead visits emerge only from that sitting's decisions.

Reporting is DELTA, not census: a pass names the candidates that are NEW
since the previous pass and files nothing when none are. "Unnamed" is
the resting state of any filed-but-not-active bead, so the full
population is approximately the whole backlog — re-listing it every pass
re-litigates a stable set and buries the one bead that actually changed.
The baseline lives in `sweep.reported` on the standing subject; its
failure mode is to re-report, never to hide (operator decision
2026-08-10, bead tk-snnpp) — and that bias governs every check added
since: a probe that cannot be read excludes nothing.
`assets/scripts/liveness-sweep-delta.test.sh` extracts the eight marked
blocks below and executes them, so the delta split, the class filters
(machine convoy, landed-anchor husk, worked-via-convoy, takeaway, gating
state, operator hold, and the root fold that keeps this sweep out of a
conversation another formula is already having) and the
classify→normalize handoff cannot drift from what an agent actually
runs. The re-file guard is extracted with them.

The visit body is a SNAPSHOT of the pass, and a sitting reads it whenever
the visit is claimed — a day or more later, by which time a routed
candidate may have merged and deployed (bead tk-gvas6: 60% of one body
was wrong on arrival, its headline P0 included). So the pass stamps the
census as machine state on the visit — `sweep.new_ids`,
`sweep.carried_ids`, `sweep.pass_at`, and a `visit.recheck` naming
`assets/scripts/liveness-recheck.sh` — and the claim-time re-check
re-derives every listed id's class from two batched reads. The census the
sitting works from is therefore current; the body is its provenance.
`assets/scripts/liveness-recheck.test.sh` pins that seventh marked block
and the re-check itself.

A mechanical PRECHECK decides whether this formula runs at all (bead
tk-7h51d). `orders/liveness-sweep.toml` is a condition order whose check is
`assets/scripts/liveness-sweep-precheck.sh` — three batched bead reads and a
jq, about three seconds, no session and no network — run on the rig's 6h
cadence. Every pass used to spend a polecat session reaching the conclusion
"nothing new", which made the common case the expensive one. The precheck
applies a deliberately SMALLER filter than classify below: every exclusion it
makes, classify also makes, and it omits the three that are not locally
decidable (worked-via-convoy, the open-PR intersection, the pre-open gate
verdicts). Its survivors are therefore a SUPERSET of this step's candidates,
so it may end the pass when the NEW set is provably empty, and anything else
— including any unreadable probe, a missing subject, or its own abort — runs
the pass unchanged.

One consequence of the class 0(b) exclusion lands HERE rather than in
classify, and is deliberate (bead tk-st143). A landed husk is not
locally decidable — telling it from a live step needs the root, its
convoy and the anchor — so the precheck cannot exclude it, and it must
not try: excluding more than classify does is the one direction that
breaks the superset guarantee, and the bead it would hide is a genuinely
stalled step. So husks keep the precheck firing: they never enter
`sweep.reported` any more, they never close on their own, and the
precheck therefore reads them as new on every pass and runs a pass that
now files nothing. That is a session for no visit — a strictly better
trade than the visit it replaces, which spent an operator sitting on
work that did not exist, but it is residue and not a fix. What ends it
is the reaper `sweep.husk_roots` exists to feed.

Two consequences for whoever is reading this because they are RUNNING it.
Reaching this step means only that the cheap half could not PROVE the board
empty; it is not evidence that there is something to file, and classify below
remains the authority on that. And nothing upstream has been decided on your
behalf: the precheck writes no bead, never advances `sweep.reported`, and
never creates the standing subject.

Graph-liveness only: the witness patrol owns SESSION-liveness (dead
assignees, orphan recovery); this sweep never touches assigned work.
Fired by orders/liveness-sweep.toml on cooldown.

Contract: graph.v2 — the compiled workflow root is Ready-visible, so a
scale-from-zero pool wakes for it (a v1 molecule root is NOT
Ready-visible, so a cold pool would never wake). Each step closes its own
step bead with gc.outcome before the graph advances. classify hands its
survivor set and both liveness words to normalize as metadata on the shared
ROOT bead — NOT as shell state, which a separate normalize step bead claimed
by a fresh session does not inherit (bead tk-7uvm9). Both step beads carry
gc.root_bead_id, so the handoff needs no knowledge of the other step's id.
The normalize step is fail-closed on that handoff, and distinguishes a
classify that failed from one whose output is unreadable.
"""
formula = "mol-liveness-sweep"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.list_cap]
description = "Max NEW candidates ENUMERATED INDIVIDUALLY in the batch visit body; new candidates beyond the cap are still included, grouped into labelled cohorts (the cap bounds line-by-line detail, not coverage). Carried candidates are never enumerated individually — they are a count plus a bare id list."
default = "20"

[[steps]]
id = "classify"
title = "Classify every open bead; isolate the unnamed waits"
description = """
Build the classification from two listings. **Fail-safe first (the
witness discipline): if either command fails or returns a non-array,
write a note explaining what broke, then close THIS step with
`gc.outcome=fail` — the normalize step reads that outcome and no-ops.
Never normalize on partial data.** (Torn reads under concurrent writes
are a known transient, so an aborted pass is correct, not alarming.)

```bash
# The census CUT. Everything below is true as of this instant and of no other,
# and the visit that carries it is read a day or more later — so the moment is
# stamped and travels with the census (bead tk-gvas6).
PASS_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
LIVE=$(mktemp); READY=$(mktemp); WIDEN=$(mktemp); ALIVE=$(mktemp)
gc bd list --status=open,in_progress --json --limit=0 > "$LIVE"
gc bd ready --unassigned --limit=0 --json > "$READY"
# WIDEN carries every non-closed status LIVE omits. The per-candidate edge
# check below asks "is the bead this candidate tracks or parents still
# ALIVE?" — and alive means NOT CLOSED, not "present in LIVE". LIVE is
# open+in_progress only, so a target that is blocked, deferred, pinned or
# hooked is absent from it, and a candidate waiting on such a target reads
# as an unnamed wait when it is a named one (live case tk-dhue: a convoy
# tracking a BLOCKED bead). A silently empty widening reintroduces exactly
# that bug, so it aborts the pass under the same fail-safe as the other two.
gc bd list --status=blocked,deferred,pinned,hooked --json --limit=0 > "$WIDEN"
if ! jq -e 'type=="array"' "$LIVE" >/dev/null || ! jq -e 'type=="array"' "$READY" >/dev/null || ! jq -e 'type=="array"' "$WIDEN" >/dev/null; then
  echo "FAIL-SAFE: listing unreadable — sweep aborts, nothing filed"
  gc bd update <your-claimed-step-bead-id> --set-metadata gc.outcome=fail --status=closed
# use the step bead id from YOUR claim — no env var carries it
  exit 0
fi
# ALIVE is the not-closed set the edge check resolves against: LIVE widened
# by WIDEN. LIVE itself stays open+in_progress — the visit-liveness and
# subject reads below need exactly that narrower set.
jq -s 'add' "$LIVE" "$WIDEN" > "$ALIVE"
```

The classes — class 0 is not work at all, 1 through 4 are named waits or
live work, and only the fifth is a defect:

0. **machine scaffolding** — residue the machinery minted for itself,
   which owes a reaper rather than a sitting. Two shapes: **(a)** the
   convoy beads below, and **(b)** the step beads of a workflow whose
   anchor already landed (the `landed-husks` block; a step of a finished
   workflow is teardown backlog and there is no disposition a sitting
   could take on it). Both are excluded here for the same reason and by
   the same ruling — exclusion first, a reaper follows.

   **(a) machine convoys** — a convoy bead the machinery mints for its
   own bookkeeping: the per-sling `input convoy for <bead>` one-child
   wrapper, and the `sling-<bead>` convoy. Nobody dispositions it, it
   carries no work, and it never closes on its own — the wrapper orphans
   the moment the work bead it tracks closes, then stays open forever and
   arrives as an unnamed wait on every pass thereafter. Two other readers
   of this same spine already drop exactly these two title prefixes as
   MACHINE convoys: `assets/scripts/gc-helm.sh` (the operator board's
   floating-convoy gather, whose comment records that the `input convoy
   for …` kind once slipped through "only by accident") and
   `services/helm/internal/source/supervisor.go` (`gatherConvoys`, whose
   comment says it mirrors the shell). So the surface an operator READS
   excluded them in two independent implementations while the sweep that
   GENERATES operator work did not. Measured 2026-08-14: 40 open input
   convoys city-wide (gc-toolkit 19, gascity 11, signal-loom 6,
   shutupandlisten 4), each one a future candidate; the gc-toolkit ready
   set that day already held seven. Operator ruling 2026-08-14 (visit
   sl-ji4b4 on subject sl-djvs, sitting 8): exclusion first, a reaper for
   the orphans follows.

   **The discriminator is the title prefix, guarded by the bead's TYPE.**
   `gc.synthetic=true` alone does not do it — the `sling-` convoys carry
   no metadata at all — and the title prefix alone is broader HERE than in
   the two implementations above, which read `gc convoy list` and so see
   nothing but convoys. This block reads every ready bead of every type,
   where a bug titled "input convoy for tk-x never closes" or
   "sling-created convoys are never reaped" is an ordinary thing to file
   against this very defect. So the test is `issue_type=convoy` AND (one
   of the two machine prefixes OR `gc.synthetic=true`), which cannot hide
   a work bead whose title merely talks about a convoy.

   **A non-machine convoy is NOT dropped**, and that is the distinction
   gc-helm.sh draws in the same breath: an unowned floating convoy is the
   orphan the observer must CATCH, not residue to hide. Class 0 covers
   only what the machinery minted for itself.

   Do not confuse this with the husk in class 1 below — they are opposite
   directions of the same fact. There, a dead synthetic convoy must not
   HIDE the member bead it tracks. Here, the convoy bead ITSELF is the
   candidate. Class 1 keeps the member visible; class 0 drops the
   wrapper. Both hold at once and neither weakens the other.

1. **worked** — assigned, `gc.routed_to` non-empty, or a work bead a live
   molecule is driving. mol-polecat-work stamps assignee and `gc.routed_to`
   on the molecule ROOT and its step beads, never on the work bead it
   carries, so for the whole life of the molecule that work bead has neither
   and would read as unnamed. The only edge back to it is the INCOMING
   `tracks` edge from its input convoy — the direction 2(i) deliberately
   ignores, and one not even present on the work bead to read (`gc bd show
   <work-bead>` returns `dependents: null`; the edge lives only on the
   convoy's outgoing side). So it is resolved FORWARD, once per pass, by the
   `worked-via-convoy` block below: the convoys some non-closed bead names as
   `gc.input_convoy_id`, and the members those convoys `tracks`. **The husk
   is the hard half:** a `tracks` edge is not itself coverage — an orphan
   synthetic convoy named by no live molecule tracks its member too, and
   skipping on the edge alone would hide the highest-priority idle bead
   behind a dead convoy (live case gc-spwr under husk gc-j20jn). The test is
   a LIVE NAMER read from ALIVE, never the convoy's existence. It proved
   itself twice in one day — gc-f7wx8 and gc-1mtj both read as unnamed while
   actively dispatched — and the signal that fools the agent who just
   performed the dispatch fools the sweep every pass.
2. **gated** — the wait has a name, either in the graph (structure) or
   in a gating state. The spec's class 2 is both halves
   (liveness-and-triage-spec.md §2: "an open blocking dependency, an
   open `type=human` gate, OR gating-state markers — refinery
   sub-states count"); this formula once implemented only the first,
   which is the defect bead tk-yyfjv records.

   **(i) structure** — open blockers, or a structural edge that
   explains the wait, **checked in the directions that mean waiting** —
   a direction-blind rule floods the census with false waits: (a) it has
   non-closed children via `parent-child`
   (a parent waits on its children — the reverse is NOT a wait: a child
   with an open parent is workable); (b) it has non-closed members via
   `tracks` (a convoy/container waits on what it carries); (c) it
   `tracks` a non-closed bead (it hangs off something still alive — spec
   beads tracking a routed root). **The wait is real whenever the target
   is not closed, not only when it is open.** A blocked, deferred, pinned
   or hooked target still names the wait, so liveness is resolved against
   ALIVE — the not-closed set the opening block builds — and never against
   LIVE, which is open+in_progress only: a target absent from LIVE but
   present in ALIVE (the live case tk-dhue, a convoy `tracks`-ing a
   BLOCKED bead) would otherwise survive the edge check and misfile as a
   class 5 unnamed wait. That instance no longer reaches the edge check —
   tk-dhue is `sling-tk-24gdht` and class 0 now drops it earlier — but
   the rule it established is unchanged and still load-bearing for every
   non-machine convoy: re-derive against a current case before treating
   tk-dhue as reproducible. `gc bd ready` already excludes
   blocker-blocked beads and gates; the edge checks need the
   per-candidate pass below. Note: a fully idle linked cluster still
   surfaces through its root (the node with no outgoing waits), so one
   sitting dispositions the cluster.

   **(ii) gating state** — a refinery sub-state that names a wait no
   edge in the graph expresses: the work is DONE, pushed, codex-green,
   and parked on an open pull request awaiting a human approval on
   GitHub. Such a bead has no open blocker and no bd-level gate, so
   `gc bd ready` returns it, and nothing about it changes until a human
   acts — so it re-surfaces every pass, forever, and each pass spends a
   sitting re-deciding a bead nobody in the city can move. Measured on
   signal-loom (sweep of 2026-08-09T23:55Z): six of the ten unnamed
   waits were PR-parked, all codex-green, all BLOCKED on GitHub
   awaiting approval — 60% of that sitting was one condition the
   classifier could not see. The marker is `merge_result=pull_request`
   (`docs/work-bead-state-machine.md`; the same field
   `doctor/check-merge-gate-drop` enumerates live gating anchors on).

   **The marker alone is NOT the test — the PR must still be LIVE.** A
   naive "carries `merge_result`, skip it" rule builds the inverse
   defect and hides rejected work permanently, exactly when it most
   needs a sitting. The marker outlives the work: it stays stamped
   after the PR closes. So the check is an intersection against the
   OPEN pull requests read from GitHub, and both terminal states stay
   VISIBLE — **merged** (the bead is finishable and should surface for
   close-out) and **closed-unmerged** (the work was rejected and
   genuinely needs a sitting).

   Three cases deliberately left VISIBLE rather than guessed at, all
   erring toward re-report: a bead with `merge_result=pull_request` but
   no parseable `pr_url` (nothing to check liveness against — the
   refinery patrol backfills `pr_url`/`pr_number`, and until it does
   the bead is reported); a `pr_url` naming a repository the open-PR
   read did not cover; and any pass where that read failed at all.
   **`merge_result=pre_open_gate` IS covered — a distinct gate, not the
   open-PR one** (bead tk-5ttye). The earlier carve-out held that a
   pre-open anchor never reaches the candidate set, because the review
   bead holding its gate carries a `blocks` edge that `gc bd ready`
   drops on. That is true only while the review is OPEN, and the normal
   end of every pre-open review is the review bead CLOSING — which lifts
   the `blocks` edge. The anchor then sits in `pre_open_gate` waiting for
   `pre-open-resolve.sh` to open its PR, with no open blocker and no
   bd-level gate, so `gc bd ready` returns it and every other
   discriminator misses it (live case gc-d760o: codex-green, review
   closed, branch pushed and live — reported as an unnamed wait when it
   was a named one).

   A pre-open anchor has no PR yet, so the live thing is not a PR GitHub
   can be asked about but the GATE itself: `check_set` names the required
   checks and `check.<name>` carries each verdict (`green@<oid>`,
   `fixable@<oid>`, `exception@<oid>`; `docs/work-bead-state-machine.md`,
   the same pair `doctor/check-merge-gate-drop` reads). The test is
   verdict-based — the marker's VALUE, never a live-head lookup, because
   the sweep does batched reads only and never one network call per bead:

   * `merge_result=pre_open_gate` AND every gate in `check_set` records
     `green@` → gated, waiting on `pre-open-resolve.sh` — dropped. The
     `none`/`off`/`approval` sentinels are not marker-backed gates and
     are removed from the set exactly as the merge gate removes them
     (`merge-skill.sh` `checkset_hold_gate`); an effective set that is
     then EMPTY is no positive evidence and does NOT drop.
   * a gate recording a NON-green verdict (`fixable@`, `exception@`) is
     left to fall through, not skipped: a live rework child (a non-closed
     `parent-child`) is dropped by 2(i)(a), and a live review bead never
     reaches the candidate set at all (its `blocks` edge) — so what
     survives to class 5 is a non-green gate with nothing in flight,
     which is genuinely stalled work and MUST stay visible.
   * `check_set` unset, or any named gate's marker absent → reported. An
     unset or absent marker is the hole tk-t46nq and tk-qs1j6 describe,
     and it must stay visible.

   This is why it is a discriminator and not a one-line "carries
   `pre_open_gate`, skip it": that naive rule would hide an anchor
   sitting on a `fixable` verdict under the signoff convergence cap — the
   operator-gated state that most needs the board — the same inverse
   defect the open-PR half warns about for a closed PR.
3. **conversing** — it IS a visit (`task_kind=visit`), a live visit
   exists in its continuation group, or a live visit already names the
   WORKFLOW ROOT it belongs to. Live means open OR held — a visit being
   held is `in_progress`, which is why the listing above is
   `--status=open,in_progress`; an open-only read would re-file on
   exactly the subjects whose sittings are live.

   **The root fold is the cross-FORMULA half, and the continuation group
   cannot do it** (bead tk-st143). A visit is deduped against its
   siblings by `gc.continuation_group`, which folds two visits on the
   same SUBJECT — and a root-scoped stall visit
   (`assets/scripts/detect-stalled-workflows.sh`, stamping
   `stall_root=<root>` and hanging off the stalled-workflows subject)
   never shares a group with this sweep's batch visit on the
   unnamed-waits subject. So both filed, about the same frozen workflow,
   and the operator held three concurrent sittings on one shape
   (2026-08-13: su-331y and su-s1if on the roots, su-qoma listing su-adua
   — a frontier step of su-ykfw, the root su-331y was already about).
   The fold is therefore keyed on `gc.root_bead_id`, matched against the
   `stall_root` of every live visit.

   **Precedence is deliberate and one-directional: the root-scoped visit
   wins, and this sweep folds into it.** A stall visit is a diagnosis of
   one workflow — its frontier, its silence, what cannot be claimed; this
   sweep's contribution is one line of a batch census. Folding the census
   line into the diagnosis loses nothing. Folding the other way, by
   suppressing a stall visit because some batch census happened to list a
   bead of that root, would trade the diagnosis for the bullet point —
   which is why `detect-stalled-workflows.sh` deliberately does NOT read
   this sweep's visits, and why that asymmetry is written down here
   rather than left to look like an oversight.
4. **held-by-design** — four shapes, all named waits:
   (a) a **standing record** — `task_kind` names one of the idioms that
   are created open, unrouted and unassigned ON PURPOSE and are never
   claimable: `triage-subject` (a scope bead itself) and
   `feedback-pattern` (a distiller cluster anchor,
   `mol-feedback-distiller.toml`: "Standing record: stays open, gets NO
   `gc.routed_to` and NO assignee — like a triage-subject, it is never
   routed and never claimable"). The classify block holds these in ONE
   named list (`standing_kinds`) rather than a select line per idiom, so
   the next standing shape is a string rather than a new filter — see
   below for why, and for the one other file that holds the same list;
   (b) a bead a scope actually HOLDS — parked onto a scope bead with a
   real dependency edge (`gc bd dep add <bead> <scope>`), which makes it
   blocker-blocked, so `gc bd ready` drops it before it ever reaches the
   candidate set. Nothing here has to test for (b): the edge IS the
   park, and it is the only way a SCOPE covers a bead (see the note
   below — that ruling is about scope membership, and (d) is not scope
   membership);
   (c) `gc.takeaway` non-empty — a human is holding it awaiting their
   own answer, with `gc.takeaway_at`/`gc.takeaway_by` recording who and
   when. Skip it and the sweep re-litigates precisely the beads a human
   touched most recently, in front of the person who parked them;
   (d) `triage.hold` non-empty — an operator has decided this bead
   waits, and the value is the REASON it waits, with
   `triage.hold_at`/`triage.hold_by` recording who and when.

   Only (b) needs no test of its own — the edge does it. (a), (c) and
   (d) carry no structural edge and so must each be filtered explicitly:
   (a) against the `standing_kinds` list, (c) and (d) on their stamps.

   **Why (a) is a named list and not one select line per idiom**
   (bead tk-rw2ra). `feedback-pattern` was the second standing-record
   idiom and it was missed for its whole existence: the 2026-08-14T05:05Z
   pass reported 42 new unnamed waits of which THIRTEEN were distiller
   pattern beads — 31% of the census, none of them work, none of them
   dispositionable. A standing record is the worst possible false
   positive here because it NEVER closes: the distiller keeps each
   pattern bead forever as its cluster anchor, so every one migrates
   from new to carried and inflates the carried count of every future
   pass permanently, and the population grows monotonically with each
   distiller run. Nothing about the classifier announced the gap — the
   exclusion list simply never got its second member, the same way the
   merge-gate anchor false positive (tk-yyfjv) was a deliberate empty
   `gc.routed_to` read as unrouted. A fourth idiom would land the same
   way, so the test to apply when adding one is not "does it look like a
   triage-subject" but the property all of these share: **created
   unrouted and unassigned by design, and never claimable.** If a new
   `task_kind` has that property, add the string to `standing_kinds` —
   in the classify block below AND in the matching def in
   `assets/scripts/liveness-recheck.sh`, which must hold the same list
   or a census filed before the change re-checks the bead as idle. The
   two cannot share code (a jq program inside a TOML description, and a
   standalone script), so `liveness-recheck.test.sh` reads the def out
   of each side and fails on a drifted pair.

   **Why (d) exists, and why it is a stamp rather than an edge**
   (operator ruling on bead tk-yyfjv, ratified 2026-08-11). A bead the
   operator has deliberately held had no machine-readable marker at
   all, so classify saw it as unnamed and re-surfaced it every pass,
   forever. Live instances at filing: tk-4day9, tk-bird61, tk-0tln5 —
   the last one's hold existed only as the word HELD in its title,
   which no classifier can read. The park edge was REJECTED for this
   scope by that ruling: parking is scope membership, and a hold is a
   per-bead decision that a later tidy-up of "stray" edges would
   silently un-park. `gc.takeaway` was not reused for it either — that
   field is the helm surface's "what this bead needs from a human" and
   is spent as the board's NEEDS sentence, so overloading it would
   reroute every operator hold onto the board as a request.

   **A hold must name its wait — that is the whole of P3.** The value
   IS the reason, and an EMPTY `triage.hold` is a cleared hold, not a
   hold — the same absent-vs-empty tri-state as `gc.takeaway`, and the
   same `// ""` coalescing makes it work. Any non-empty stamp holds the
   bead, including a reasonless `triage.hold=true`: a marker that read
   as set and silently did nothing would be a worse failure than a
   terse one. A bare `true` still names no wait, which is why the
   funnel note lists every held bead WITH its reason — that is what
   makes a reasonless hold visible as something to fix, rather than a
   hold nobody can read.

   The hold has no external liveness to check — the operator's decision
   IS the live thing until they clear it, which is the whole difference
   from 2(ii), where the live thing is a PR that GitHub can be asked
   about. So it is honoured for as long as it is stamped, and the
   funnel note is what keeps a stale hold visible while it is not a
   defect.

5. **unnamed** — none of the above: the defect this sweep exists for.

**Scope coverage is the EDGE, and only the edge** (operator decision
2026-08-10, bead tk-snnpp). A scope naming its members by filter — the
`triage.scope` token schema that mol-triage-recurrence evaluates — is
deliberately NOT read here, so there is no membership-by-name: a bead is
covered when an edge holds it and at no other time. Two consequences
worth stating where the park is performed: the edge is load-bearing (a
tidy-up that deletes it silently un-parks the bead), and the scope bead
must stay OPEN (closing it un-parks everything it holds). If
membership-by-name is ever wanted, that token schema is where to start.
This governs SCOPE COVERAGE only; class 4(d)'s operator hold is a
per-bead decision, not membership, and is a stamp by the same ruling
that made the park an edge — for the opposite reason (an edge a tidy-up
can delete is the wrong home for a decision only the operator may
reverse).

Mechanically: read the open pull requests, the worked-via-convoy set and
the landed-anchor husks once each (the blocks below), apply the jq, then for each survivor check
its dependency edges with
`gc bd show <id>`, resolving every "is that target still alive?" test
against ALIVE (not closed), never against LIVE — any of the three
class-2(i) structural shapes above (non-closed parent-child children;
non-closed tracks members; tracks a non-closed bead) → class 2, drop
it, logging which shape; an epic whose children have ALL closed → keep
it, called out as a "what comes next?" candidate. Shape (a) has no
outgoing edge on the candidate to read — children hold the parent-child
edge, so `gc bd show <parent>` lists none of them — so build the reverse
index from ALIVE, not LIVE: a blocked child is absent from LIVE, which
is exactly how a gated parent used to misfile as unnamed. A parent is
gated iff ALIVE holds a bead whose `parent-child` parent is this
candidate.

**The gate half is a batched GitHub read, once per pass, before the
jq.** One `gh pr list` per repository the candidates' own beads name —
never one call per bead, and never a call against whatever repository
`gh` happens to be pointed at. The repositories come from the beads'
`pr_url` values because a PR NUMBER alone names nothing: every
repository has a #246, so an unqualified intersection would drop a bead
whose PR is closed merely because some other repository has that number
open. Matching on the repo-qualified URL also makes every failure mode
safe by construction — a repository that was not read contributes no
open PRs, so its beads are reported rather than hidden.

```bash
# >>> open-prs
# The gate half of class 2, read ONCE per pass. Which repositories to ask is
# read from the BEADS (their own pr_url), never from whatever repository gh
# happens to be pointed at: a sweep runs in some agent's worktree, and an
# ambient repo would answer about a different project's PR numbers entirely.
PRREPOS=$(jq -r '[ .[] | select((.metadata.merge_result // "") == "pull_request") | [ ((.metadata.pr_url // "") | ascii_downcase) | capture("://(?<h>[^/]+)/(?<o>[^/]+/[^/]+)/pull/[0-9]+") ] | .[0] | select(. != null) | (.h + "/" + .o) ] | unique | .[]' "$READY" 2>/dev/null)
PRURLS=$(mktemp)
PR_LIVENESS=none
# `while read` from a FILE — never `for R in $PRREPOS`, and never a pipe.
# zsh, the shell an agent actually pastes this block into, does NOT word-split
# an unquoted expansion: the for-loop ran ONCE with every repository joined
# into a single token, every read failed on that nonsense name, and the pass
# reported `unverified` having asked about nothing (tk-1c9vf). A FILE rather
# than `... | while read` because a pipe puts the loop in a SUBSHELL, and
# $PR_LIVENESS — the entire point of the loop — would not survive it.
PRREPO_LIST=$(mktemp)
printf '%s' "$PRREPOS" | awk '{ for (i = 1; i <= NF; i++) print $i }' > "$PRREPO_LIST"
while IFS= read -r R; do
  # An `if`, not a `&&`: as the first statement in the loop body a false `&&`
  # is the body's exit status, which aborts the pass under `set -e`.
  if [ "$PR_LIVENESS" = "none" ]; then PR_LIVENESS=verified; fi
  # --limit is REQUIRED: gh pr list defaults to 30 and truncates in silence.
  # The read itself sits INSIDE the `if`, for the same reason as the `if` above.
  # A bare `ROWS=$(gh ...)` is a simple assignment, so its exit status IS the
  # command substitution's: under `set -e` a transient `gh` failure — precisely
  # the case the `else` below exists to report — would abort the pass before
  # `unverified` could be recorded, leaving the sweep with no liveness word at
  # all rather than an honest one.
  if ROWS=$(gh pr list --repo "$R" --state open --limit 1000 --json url 2>/dev/null) && [ -n "$ROWS" ] && printf '%s' "$ROWS" | jq -e 'type == "array"' >/dev/null 2>&1; then
    printf '%s' "$ROWS" | jq -r '.[].url // empty' >> "$PRURLS"
  else
    PR_LIVENESS=unverified
    echo "WARN: open-PR read FAILED for $R — its PR-parked beads are REPORTED this pass, never hidden; say so in the visit body" >&2
  fi
done < "$PRREPO_LIST"
OPEN_PRS=$(jq -R . < "$PRURLS" | jq -sc 'map(select(length > 0))')
# <<< open-prs
```

`$PR_LIVENESS` is three-valued and all three must stay distinguishable:
`none` (no PR-parked candidate this pass — nothing to ask about),
`verified` (every named repository answered), `unverified` (at least one
did not). Collapsing the last two is the failure this whole file is
biased against: an unreadable probe that reads as "no open PRs" would
be indistinguishable from a genuine empty answer. It cannot hide a bead
— an unread repository contributes no open PRs, so its beads are
reported — but the sitting is owed the word `unverified` in the visit
body, because otherwise a list full of already-parked work looks like a
real backlog.

**The worked half is a batched bead read, once per pass, before the
jq** — the exact shape of the gate half above, for the same reason: a
work bead a live molecule is driving carries no worker stamp of its own
(class 1's molecule indirection). Read the convoys ANY non-closed bead
names as `gc.input_convoy_id` (from ALIVE, so a blocked or deferred
molecule still counts as a live namer), then read each convoy's tracked
members — those members are worked, and the jq drops them.

```bash
# >>> worked-via-convoy
# The worked half of class 1, read ONCE per pass. mol-polecat-work stamps
# assignee and gc.routed_to on the molecule root and its steps, never on the
# work bead the convoy tracks, so the work bead reads as unnamed for the whole
# life of its molecule. The incoming tracks edge is not even on the work bead
# to read (gc bd show <work-bead> returns dependents: null), so resolve it
# forward: convoys some non-closed bead names as its input convoy, and the
# members those convoys track.
#
# HUSK-SAFE, the hard half: a tracks edge is not itself coverage. An orphan
# synthetic convoy (gc.synthetic=true, created and abandoned, named by no live
# molecule) tracks its member too, and a "has an incoming tracks edge, skip it"
# rule would hide the highest-priority genuinely-idle bead behind a dead convoy.
# The gate is a LIVE NAMER, never the convoy's existence: INPUT_CONVOYS is read
# from ALIVE, so a convoy no non-closed bead names contributes nothing and its
# members stay candidates.
INPUT_CONVOYS=$(jq -r '[ .[] | (.metadata["gc.input_convoy_id"] // "") | select(. != "") ] | unique | .[]' "$ALIVE" 2>/dev/null)
WORKED_TMP=$(mktemp)
CONVOY_LIVENESS=none
# `while read` from a FILE, for the reasons spelled out on the open-prs loop
# above: zsh does not word-split, so `for C in $INPUT_CONVOYS` ran the body
# ONCE on every convoy id joined into one token. This is the loop the defect
# was MEASURED on (bead sl-e7l4): under zsh, one WARN naming the joined string
# and WORKED=[]; under bash, three ids resolved. The pass looked clean while
# the class-1 discriminator did nothing at all (tk-1c9vf).
CONVOY_LIST=$(mktemp)
printf '%s' "$INPUT_CONVOYS" | awk '{ for (i = 1; i <= NF; i++) print $i }' > "$CONVOY_LIST"
while IFS= read -r C; do
  # An if, not a &&, as the loop body's first statement: a false && would be the
  # body's exit status and abort the pass under set -e (same as the open-prs loop).
  if [ "$CONVOY_LIVENESS" = "none" ]; then CONVOY_LIVENESS=verified; fi
  # gc bd show, NOT the list JSON. gc bd list and gc bd ready key a dependency on
  # .type + .depends_on_id and render an EMPTY tracks list for this very edge; gc
  # bd show keys it on .dependency_type + .id and returns the real one. Read the
  # wrong shape and every convoy looks memberless, WORKED stays empty, the
  # discriminator drops nothing, and the bug returns in silence. The read sits
  # inside the if for the same errexit reason as open-prs. Read the convoy's
  # OUTGOING tracks members — the reliable direction gc bd show emits.
  if ROWS=$(gc bd show "$C" --json 2>/dev/null) && printf '%s' "$ROWS" | jq -e 'type == "array"' >/dev/null 2>&1; then
    printf '%s' "$ROWS" | jq -r '.[0].dependencies[]? | select(.dependency_type == "tracks") | .id' >> "$WORKED_TMP"
  else
    CONVOY_LIVENESS=unverified
    echo "WARN: convoy read FAILED for $C — the beads it tracks are REPORTED this pass, never hidden; say so in the visit body" >&2
  fi
done < "$CONVOY_LIST"
WORKED=$(jq -R . < "$WORKED_TMP" | jq -sc 'map(select(length > 0)) | unique')
# <<< worked-via-convoy
```

`$CONVOY_LIVENESS` is three-valued exactly as `$PR_LIVENESS`: `none` (no
non-closed bead named any convoy this pass — nothing to resolve),
`verified` (every named convoy read), `unverified` (at least one read
failed). A failed convoy read cannot hide a bead — its members are
simply not marked worked, so they stay candidates and are reported — but
the sitting is owed the word, or a list of actively-worked beads reads
as a real backlog.

**The husk half is a third batched read, once per pass, before the jq**
(bead tk-st143). It answers a question no other block here asks: not "is
this bead being worked?" but "did the workflow this bead belongs to
already finish?" — because a graph.v2 workflow whose ANCHOR has landed
owes no more work, while its step beads stay open forever
(`mol-polecat-work` closes no step, ever), stay ready, and so arrive as
unnamed waits on every pass. Measured on shutupandlisten 2026-08-13:
sixteen step beads across two dead roots (su-zu1j, anchor su-uzy9.4, PR
#57 merged; su-vc8n, anchor su-uzy9.5, PR #58 merged, input convoy
su-lo2e closed), all nominated, none of them work anybody could do.

They are class 0(b) for a reason worth stating: a step of a landed
workflow is TEARDOWN BACKLOG, and there is no disposition a sitting can
take on it. Route it and a polecat re-implements landed work on a branch
whose PR already merged; kill it by hand and the dep-chained siblings it
gates are still there; park or hold it and the operator has spent a
decision on machine residue. What retires these is a reaper, exactly as
for the machine convoys of 0(a) — so this block excludes them and the
funnel note names the ROOT ids as the teardown set owed, which
`stamp-handoff` also stamps as machine state.

The chain is root to input convoy to anchor, so it resolves per ROOT and
never per candidate: the distinct `gc.root_bead_id` values across the
ready set, three reads each, and every step bead of a landed root drops
at once.

```bash
# >>> landed-husks
# Class 0(b), read ONCE per pass, keyed by ROOT. The candidates carry
# gc.root_bead_id; the root names its input convoy; the convoy tracks the anchor.
STEP_ROOTS=$(jq -r '[ .[] | (.metadata["gc.root_bead_id"] // "") | select(. != "") ] | unique | .[]' "$READY" 2>/dev/null)
HUSK_TMP=$(mktemp)
HUSK_ROOTS_TMP=$(mktemp)
HUSK_LIVENESS=none
ROOT_LIST=$(mktemp)
# awk splits, not the shell, and the loop reads a FILE rather than a pipe — the
# two traps spelled out on the open-prs and worked-via-convoy loops above (zsh
# does not word-split an unquoted expansion; a piped loop runs in a subshell and
# loses every variable it sets). Same shape, same reasons (bead tk-1c9vf).
printf '%s' "$STEP_ROOTS" | awk '{ for (i = 1; i <= NF; i++) print $i }' > "$ROOT_LIST"
while IFS= read -r R; do
  # An if, not a &&, as the loop body's first statement: a false && would be the
  # body's exit status and abort the pass under set -e.
  if [ "$HUSK_LIVENESS" = "none" ]; then HUSK_LIVENESS=verified; fi
  CONVOY=""
  if RJSON=$(gc bd show "$R" --json 2>/dev/null) && printf '%s' "$RJSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
    CONVOY=$(printf '%s' "$RJSON" | jq -r '.[0].metadata["gc.input_convoy_id"] // ""')
  else
    HUSK_LIVENESS=unverified
    echo "WARN: root read FAILED for $R — its step beads are REPORTED this pass, never hidden; say so in the visit body" >&2
  fi
  # A root naming NO convoy is not a failure and not a husk: it has no anchor that
  # could have landed, so its steps stay ordinary candidates.
  if [ -n "$CONVOY" ]; then
    MEMBERS=""
    if CJSON=$(gc bd show "$CONVOY" --json 2>/dev/null) && printf '%s' "$CJSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
      # gc bd show, NOT the list JSON: only show emits this edge on
      # .dependency_type + .id, the same trap worked-via-convoy documents.
      MEMBERS=$(printf '%s' "$CJSON" | jq -r '.[0].dependencies[]? | select(.dependency_type == "tracks") | .id')
    else
      HUSK_LIVENESS=unverified
      echo "WARN: convoy read FAILED for $CONVOY — root $R is REPORTED this pass, never hidden; say so in the visit body" >&2
    fi
    if [ -n "$MEMBERS" ]; then
      ALL_LANDED=1
      MEMBER_LIST=$(mktemp)
      printf '%s' "$MEMBERS" | awk '{ for (i = 1; i <= NF; i++) print $i }' > "$MEMBER_LIST"
      while IFS= read -r A; do
        LANDED=""
        if AJSON=$(gc bd show "$A" --json 2>/dev/null) && printf '%s' "$AJSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
          # LANDED is the unambiguous PAIR and deliberately only that pair.
          LANDED=$(printf '%s' "$AJSON" | jq -r 'if ((.[0].status // "") == "closed") or ((((.[0].metadata // {}).merge_result // "") | tostring) == "merged") then "yes" else "" end')
        else
          HUSK_LIVENESS=unverified
          echo "WARN: anchor read FAILED for $A — root $R is REPORTED this pass, never hidden; say so in the visit body" >&2
        fi
        if [ -z "$LANDED" ]; then ALL_LANDED=0; fi
      done < "$MEMBER_LIST"
      if [ "$ALL_LANDED" = "1" ]; then
        echo "$R" >> "$HUSK_ROOTS_TMP"
        jq -r --arg r "$R" '[ .[] | select((.metadata["gc.root_bead_id"] // "") == $r) | .id ] | .[]' "$READY" >> "$HUSK_TMP"
      fi
    fi
  fi
done < "$ROOT_LIST"
HUSK_STEPS=$(jq -R . < "$HUSK_TMP" | jq -sc 'map(select(length > 0)) | unique')
HUSK_ROOTS=$(jq -R . < "$HUSK_ROOTS_TMP" | jq -sc 'map(select(length > 0)) | unique')
# <<< landed-husks
```

`$HUSK_LIVENESS` is three-valued exactly as the other two: `none` (no
ready bead named a workflow root this pass), `verified` (every root,
convoy and anchor read), `unverified` (at least one read failed). A
failed read cannot hide a bead — the root contributes no husk steps, so
its candidates stay visible and are reported — but the sitting is owed
the word.

**Landed is `status=closed` OR `merge_result=merged`, and deliberately
only that pair.** Every other terminal-looking marker is a state a LIVE
molecule wears mid-flight: `pull_request` is what a rework molecule's
anchor already carries from the round being reworked, `pre_open_gate` is
a gate the anchor is actively sitting in, and a refinery handoff or a
human park are both mid-flight. Reading any of them as completion is what
made two live stalls invisible in the sibling implementation of this same
test (`assets/scripts/detect-stalled-workflows.sh`, whose block comment
records the measurement); this one inherits both the rule and the reason.

Cost, measured on this rig 2026-08-22: 239 ready rows, 21 of them
carrying a `gc.root_bead_id` across 21 distinct roots, 63 bd reads, ~31s
wall. That is the whole of this block's price on a 6h cadence, and it
scales with the number of distinct ROOTS rather than with the backlog.
Sixteen of those 21 were husks — so on the day this shipped, three
quarters of the step beads this rig was nominating were steps of
workflows that had already landed.

**ALL tracked members must be landed, and a convoy with none is not a
husk.** The anchor set is the convoy's `tracks` members, and the test is
universal rather than existential so a multi-member convoy with one live
anchor keeps every step of that root visible. The `mol-polecat-work`
wrapper tracks exactly one member, so in the common case the two readings
coincide — but the difference is the whole safety margin if a convoy ever
carries two, and it costs one word.

**Verify against a known-worked bead before trusting a clean run.** If
`$INPUT_CONVOYS` is non-empty but `$WORKED` came back `[]`, the tracks
read is almost certainly keyed wrong (the `gc bd list` vs `gc bd show`
trap the block comment names) — the discriminator looks like it works
and silently excludes nothing. Spot-check one convoy by hand
(`gc bd show <convoy>`) against a molecule you know is in flight; the
regression test pins the `dependency_type` key so an edit cannot swap it
back to the list shape unseen.

```bash
# >>> classify-candidates
CANDIDATES=$(jq -n --slurpfile live "$LIVE" --slurpfile ready "$READY" --argjson openprs "${OPEN_PRS:-[]}" --argjson worked "${WORKED:-[]}" --argjson husks "${HUSK_STEPS:-[]}" '
  def pr_key:
    [ ((. // "") | tostring | ascii_downcase)
      | capture("://(?<h>[^/]+)/(?<o>[^/]+/[^/]+)/pull/(?<n>[0-9]+)") ]
    | .[0] | if . == null then "" else (.h + "/" + .o + "/pull/" + .n) end;
  def standing_kinds: ["triage-subject", "feedback-pattern"];
  def machine_convoy:
    (.issue_type // "") == "convoy"
    and ((((.title // "") | startswith("sling-"))
          or ((.title // "") | startswith("input convoy for"))
          or ((.metadata["gc.synthetic"] // "") == "true")));
  def pre_open_all_green:
    (.metadata // {}) as $m
    | (($m.check_set // "")
        | split(",")
        | map(gsub("^[[:space:]]+|[[:space:]]+$"; ""))
        | map(select(length > 0))
        | map(select((ascii_downcase) as $g | $g != "none" and $g != "off" and $g != "approval"))) as $gates
    | ($gates | length) > 0
      and all($gates[]; ($m["check." + .] // "") | startswith("green@"));
  ([($live[0] // [])[]
     | select((.metadata.task_kind // "") == "visit")
     | (.metadata["gc.continuation_group"] // empty)]) as $convgroups
  | ([($live[0] // [])[]
     | select((.metadata.task_kind // "") == "visit")
     | (.metadata.stall_root // empty)
     | select(. != "")]) as $rootvisits
  | ([($openprs // [])[] | pr_key] | map(select(. != ""))) as $openkeys
  | [ ($ready[0] // [])[]
      | select(machine_convoy | not)
      | select(.id as $id | ($husks | index($id)) | not)
      | select((.metadata["gc.routed_to"] // "") == "")
      | select(.id as $id | ($worked | index($id)) | not)
      | select((.metadata["gc.root_bead_id"] // "") as $r
               | $r == "" or (($rootvisits | index($r)) == null))
      | select((.metadata.task_kind // "") != "visit")
      | select((.metadata.task_kind // "") as $k | (standing_kinds | index($k)) == null)
      | select((.metadata["gc.takeaway"] // "") == "")
      | select((.metadata["triage.hold"] // "") == "")
      | select((((.metadata.merge_result // "") == "pull_request")
                and (((.metadata.pr_url // "") | pr_key) as $k
                     | $k != "" and ($openkeys | index($k)) != null)) | not)
      | select((((.metadata.merge_result // "") == "pre_open_gate")
                and pre_open_all_green) | not)
      | select(.id as $id | ($convgroups | index($id)) | not)
    ] | map({id, title, type: .issue_type})')
# <<< classify-candidates
printf '%s\n' "$CANDIDATES"
# apply the edge check (children + tracks) per candidate before step 2
```

Neither block contains a BACKSLASH, and that is deliberate — this
paragraph does not contain one either, for the same reason. A formula
description is a TOML triple-quoted string, so TOML consumes escapes
before an agent ever sees them: a trailing backslash silently joins two
lines, backslash-n becomes a real newline, and jq's string
interpolation (backslash-paren) is not a valid TOML escape at all — it
fails the whole formula to parse, which is how this note came to be
written (the first draft of it did exactly that). The regression test
extracts these blocks from the RAW file text while the agent runs the
PARSED string, so any backslash makes those two texts differ and the
test stops pinning what actually runs. Hence `capture("://...")` with
no start anchor and no whitespace class, `.h + "/" + .o` instead of
interpolation, and `jq -R . | jq -sc` instead of splitting on a newline
literal. The rule for editing this file: if a block needs a backslash,
find the form that does not.

The `pr_key` normalization is what makes the intersection mean
anything. It keys on host + owner/repo + number, so `#521` in one
repository never matches `#521` in another; it ignores the scheme and
any trailing path (`/files`), so the same PR written two ways still
matches itself; and anything that is not a pull-request URL — a bare
number, an empty string, an absent key, an issues link — keys to `""`
and is dropped from both sides, which leaves the bead visible.

Every `// ""` above is load-bearing, not style: on a real store most
beads carry no `gc.routed_to`, no `task_kind`, no `gc.takeaway`,
no `triage.hold` and no `merge_result` key at all — measured on this
rig, 106 of 147 ready rows carry no `metadata` object whatsoever — so a
strict `==`/`!=` against a missing key compares to `null` and matches
the wrong set. Both hold filters drop a bead whose stamp is non-empty
and KEEP one whose stamp is present-but-empty: an empty takeaway, and
an empty `triage.hold`, are cleared holds, not holds.

Record in your notes: counts per class as a funnel, the surviving ids,
what the edge check dropped, and — because these are the drops nothing
else in the pass makes visible — the worked-via-convoy ids with the
convoy covering each, the PR-parked ids with their PR numbers, the
machine-convoy drops as a COUNT and never a list (class 0(a) is noise
by construction, and a reaper rather than a sitting is what removes it;
a count that keeps growing pass over pass is the signal that the reaper
is still owed), the landed-husk drops as a count of STEPS plus the
distinct ROOT ids in `$HUSK_ROOTS` — the teardown set, worth naming
where the machine convoys are not, because each root is one reap rather
than one bead — the ids folded into a live root-scoped visit with the
`stall_root` covering each, the pre-open-gated ids with the green gate marker each
carries, the held ids WITH the reason each hold gives, and the
`$PR_LIVENESS`, `$CONVOY_LIVENESS` and `$HUSK_LIVENESS` values. A hold, a parked PR, a
pre-open gate and a molecule-driven work bead are named waits, not
defects, but a wait
nobody ever reads is how a bead disappears for good; the funnel note is
the only place they surface.

**Hand the survivor set to normalize as MACHINE state, not prose** (bead
tk-7uvm9). classify and normalize are separate step beads and the pool
re-offers each ready step, so a fresh normalize session inherits none of this
shell — `$CANDIDATES`, `$PR_LIVENESS`, `$CONVOY_LIVENESS` are simply gone.
The funnel note above is for humans; the block below is the contract the next
step's jq reads. It rides the ROOT bead: every step bead carries
`gc.root_bead_id`, so normalize reads the same root back without ever knowing
this step's id. Resolve the root from YOUR step bead first:

```bash
ROOT=$(gc bd show <your-claimed-step-bead-id> --json | tr -d '[:cntrl:]' | jq -r '.[0].metadata["gc.root_bead_id"] // ""')
# use the step bead id from YOUR claim — no env var carries it
```

The survivor set to hand off is the POST-edge-check set: the
classify-candidates `$CANDIDATES` minus every id the per-candidate edge check
moved to class 2. Collect those dropped ids as `$EDGE_DROPS` (space- or
newline-separated, empty if none) and the block derives the survivors
deterministically — never hand-type the survivor list, which is exactly the
prose fragility this fix removes. `$CANDIDATES` stays the source of each
survivor's title and type, so nothing is re-derived against a newer listing.

```bash
# >>> stamp-handoff
DROPS_TMP=$(mktemp)
# awk does the splitting, not the shell: `for d in ${EDGE_DROPS:-}` relied on
# word-splitting that zsh does not perform, so a multi-id EDGE_DROPS landed in
# the file as ONE joined line and dropped no candidate (tk-1c9vf). $EDGE_DROPS
# is hand-set, space- OR newline-separated, so split on any whitespace.
printf '%s' "${EDGE_DROPS:-}" | awk '{ for (i = 1; i <= NF; i++) print $i }' > "$DROPS_TMP"
EDGE_DROPS_JSON=$(jq -R . < "$DROPS_TMP" | jq -sc 'map(select(length > 0))')
SURVIVORS=$(printf '%s' "$CANDIDATES" | jq -c --argjson drop "$EDGE_DROPS_JSON" 'map(select(.id as $i | ($drop | index($i)) | not))')
printf '%s' "$SURVIVORS" | jq -e 'type == "array"' >/dev/null || { echo "stamp-handoff: SURVIVORS is not a JSON array — do not close this step" >&2; exit 1; }
[ -n "$ROOT" ] || { echo "stamp-handoff: no gc.root_bead_id resolved — cannot hand off to normalize" >&2; exit 1; }
# The cut travels with the census. Fall back to now only if the opening block's
# capture did not survive a restart — a slightly-late cut still measures the
# right thing, an ABSENT one leaves the sitting unable to tell a fresh body from
# a two-day-old one.
PASS_AT="${PASS_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
# The teardown set travels as machine state for the same reason the survivor set
# does: it is the one output of this pass no visit carries, because class 0(b) is
# excluded from the census by design. A reaper reads sweep.husk_roots; nothing has
# to parse root ids back out of a funnel note.
HUSK_ROOTS_CSV=$(printf '%s' "${HUSK_ROOTS:-[]}" | jq -r 'if type == "array" then join(",") else "" end' 2>/dev/null || echo "")
gc bd update "$ROOT" --set-metadata "sweep.candidates=$SURVIVORS" --set-metadata "sweep.pr_liveness=$PR_LIVENESS" --set-metadata "sweep.convoy_liveness=$CONVOY_LIVENESS" --set-metadata "sweep.husk_liveness=${HUSK_LIVENESS:-unverified}" --set-metadata "sweep.husk_roots=$HUSK_ROOTS_CSV" --set-metadata "sweep.pass_at=$PASS_AT" --set-metadata "sweep.classify_outcome=pass" || { echo "stamp-handoff: failed to stamp root $ROOT — do not close this step" >&2; exit 1; }
# <<< stamp-handoff
```

Then close this step — AFTER the stamp above, never before: closing releases
normalize, so the handoff must be durable first. The `sweep.classify_outcome=pass`
the stamp writes is what tells normalize the handoff is present and readable,
a state distinct from a classify that failed.

```bash
gc bd update <your-claimed-step-bead-id> --set-metadata gc.outcome=pass --status=closed
# use the step bead id from YOUR claim — no env var carries it
```
"""

[[steps]]
id = "normalize"
title = "One batch visit on the sweep's triage subject — new candidates only, never per-bead"
needs = ["classify"]
description = """
**0. Read classify's handoff, fail-closed.** classify hands its survivor
set and both liveness words to this step as METADATA ON THE ROOT BEAD, not
as shell state — the two steps are separate step beads and a fresh normalize
session (the normal case: the pool re-offers each ready step) inherits none
of classify's variables (bead tk-7uvm9). Both step beads carry
`gc.root_bead_id`, so resolve the shared root from THIS step's bead and read
the stamp back:

```bash
ROOT=$(gc bd show <your-claimed-step-bead-id> --json | tr -d '[:cntrl:]' | jq -r '.[0].metadata["gc.root_bead_id"] // ""')
# use the step bead id from YOUR claim — no env var carries it
[ -n "$ROOT" ] || { echo "normalize: no gc.root_bead_id on this step bead — nothing filed"; gc bd update <your-claimed-step-bead-id> --set-metadata gc.outcome=fail --status=closed; exit 0; }
```

```bash
# >>> read-handoff
ROOTMETA=$(gc bd show "$ROOT" --json 2>/dev/null | tr -d '[:cntrl:]' | jq -c '.[0].metadata // {}' 2>/dev/null || echo '{}')
CLASSIFY_OUTCOME=$(printf '%s' "$ROOTMETA" | jq -r '.["sweep.classify_outcome"] // ""')
CANDIDATES=$(printf '%s' "$ROOTMETA" | jq -c '.["sweep.candidates"] // empty | (if type == "string" then fromjson else . end)' 2>/dev/null || true)
PR_LIVENESS=$(printf '%s' "$ROOTMETA" | jq -r '.["sweep.pr_liveness"] // "unverified"')
CONVOY_LIVENESS=$(printf '%s' "$ROOTMETA" | jq -r '.["sweep.convoy_liveness"] // "unverified"')
HUSK_LIVENESS=$(printf '%s' "$ROOTMETA" | jq -r '.["sweep.husk_liveness"] // "unverified"')
HUSK_ROOTS=$(printf '%s' "$ROOTMETA" | jq -r '.["sweep.husk_roots"] // ""')
PASS_AT=$(printf '%s' "$ROOTMETA" | jq -r '.["sweep.pass_at"] // ""')
if [ "$CLASSIFY_OUTCOME" != "pass" ]; then HANDOFF_STATE=classify-failed
elif [ -z "$CANDIDATES" ] || ! printf '%s' "$CANDIDATES" | jq -e 'type == "array"' >/dev/null 2>&1; then HANDOFF_STATE=unreadable
else HANDOFF_STATE=ok; fi
# <<< read-handoff
```

The two failure modes are now DISTINCT, which they were not when this step
read a bare `gc.outcome` (bead tk-7uvm9 — the whole reason it exists):

- `classify-failed` — classify never reached `pass` (a fail-safe abort on an
  unreadable listing, or it never ran). Log "classify failed — normalizing
  nothing"; this is a known transient under concurrent writes.
- `unreadable` — classify reported `pass` but its handoff is gone or
  malformed (`sweep.candidates` absent, or not a JSON array). Log "classify
  passed but its handoff is UNREADABLE — normalizing nothing". This is a real
  defect to notice, not a transient — say so in the log.

Either way, close this step with `gc.outcome=fail` and stop — never normalize
on absent or partial input:

```bash
if [ "$HANDOFF_STATE" != "ok" ]; then
  gc bd update <your-claimed-step-bead-id> --set-metadata gc.outcome=fail --status=closed
  exit 0
fi
```

`$CANDIDATES` is now the post-edge-check survivor set exactly as classify
computed it — the same variable steps 2–5 already consume, unchanged.
`$PR_LIVENESS`, `$CONVOY_LIVENESS` and `$HUSK_LIVENESS` are the words classify
recorded; all three
default to `unverified` if somehow unset — the report-don't-hide bias this
whole file is built on. `$HUSK_ROOTS` is the teardown set classify excluded
(class 0(b)): a comma-separated list of workflow roots whose anchor has landed
and whose step beads are backlog for a reaper. It is NOT part of the census and
never goes in the body — it rides here so the number is reportable in the log
line, and so a reaper has one place to read it. `$PASS_AT` is the census CUT — the instant everything
in `$CANDIDATES` was last true — and step 4 stamps it on the visit so the
sitting can measure the body's age instead of guessing it.

**1. Build the live listing fresh, then resolve the standing triage
subject.** Unlike the survivor set, `$LIVE` is a point-in-time read that is
correct to take now, not carry: the subject is a persistent bead, and step 3
asks whether a visit is live *at this moment*, not in the population classify
measured. So this step reads it fresh (its fail-safe mirrors classify's):

```bash
LIVE=$(mktemp)
gc bd list --status=open,in_progress --json --limit=0 > "$LIVE"
if ! jq -e 'type=="array"' "$LIVE" >/dev/null 2>&1; then
  echo "normalize: live listing unreadable — nothing filed"
  gc bd update <your-claimed-step-bead-id> --set-metadata gc.outcome=fail --status=closed
  exit 0
fi
```

The standing triage subject (one per rig; create on first run, idempotent —
search `$LIVE` for it first) is also where this sweep keeps its only piece of
state, the delta baseline:

```bash
SWEEP_SUBJECT=$(jq -r '[.[] | select((.metadata.task_kind // "") == "triage-subject")
  | select((.metadata["triage.scope"] // "") == "unnamed-waits")] | (.[0].id // "")' "$LIVE")
if [ -z "$SWEEP_SUBJECT" ]; then
  SWEEP_SUBJECT=$(gc bd create -t task --title "triage: unnamed waits (this rig)" \
    -d "Standing triage scope: open beads with no worker, route, structure-wait, gate, or visit. Each visit lists the unnamed waits that are NEW since the previous pass, and carries the rest as a count. Dispositions are route / gate / kill / park — where park means hanging the bead off a triage-subject scope bead with a real dependency edge (gc bd dep add <bead> <scope>), never prose in a note. This bead also holds the sweep's delta baseline in metadata sweep.reported." --json | jq -r '.id // .[0].id')
  gc bd update "$SWEEP_SUBJECT" --set-metadata "task_kind=triage-subject" \
    --set-metadata "triage.scope=unnamed-waits"
fi
```

**2. Split the survivors into NEW and CARRIED.** `$CANDIDATES` is the
classify step's post-edge-check survivor set. The baseline
`sweep.reported` is a comma-separated id list — the candidate set as of
the last pass that actually reported. ABSENT baseline (first run, or a
rig that has never reported) means every candidate is new, which is the
intended first-run behaviour: one full census, then deltas.

```bash
# >>> sweep-delta
REPORTED=$(gc bd show "$SWEEP_SUBJECT" --json | tr -d '[:cntrl:]' | jq -r '.[0].metadata["sweep.reported"] // ""')
NEW=$(printf '%s' "$CANDIDATES" | jq -c --arg seen "$REPORTED" '
  ($seen | split(",") | map(select(. != ""))) as $s
  | map(select(.id as $id | ($s | index($id)) | not))')
CARRIED=$(printf '%s' "$CANDIDATES" | jq -c --arg seen "$REPORTED" '
  ($seen | split(",") | map(select(. != ""))) as $s
  | map(select(.id as $id | ($s | index($id)) != null))')
NEW_COUNT=$(printf '%s' "$NEW" | jq 'length')
CARRIED_COUNT=$(printf '%s' "$CARRIED" | jq 'length')
CARRIED_IDS=$(printf '%s' "$CARRIED" | jq -r '[.[].id] | join(", ")')
CUR_IDS=$(printf '%s' "$CANDIDATES" | jq -r '[.[].id] | join(",")')
# <<< sweep-delta
```

Membership is `index($id)`, which returns a POSITION or `null` — and
position 0 is a real hit. jq happens to treat 0 as truthy, so the `| not`
in the NEW predicate is safe; the CARRIED predicate is written `!= null`
rather than relying on that, because a truthiness test ported to almost
any other language would read the FIRST id in the baseline as a miss and
re-report that one bead on every pass forever.

**3. Skip if its visit is already live (open or held)** — recompute the
live-visit continuation groups from `$LIVE` (built fresh in step 1, no longer
inherited from classify) and check whether one already names `$SWEEP_SUBJECT`:

```bash
LIVE_VISIT=$(jq -r --arg s "$SWEEP_SUBJECT" '[.[] | select((.metadata.task_kind // "") == "visit") | (.metadata["gc.continuation_group"] // "")] | (index($s) // "") | tostring' "$LIVE")
```

`index` returns a position or null; position 0 (`"0"`) is a real hit and
null coalesces to `""`, so a non-empty `$LIVE_VISIT` means a visit is live.
If it is non-empty, log
"batch visit already live; $CARRIED_COUNT candidates await it, $NEW_COUNT new since the last pass",
close this step (`gc.outcome=pass`), done. Self-limiting: the backlog
never costs more than one conversation. **Do not advance the baseline on
this path** — those new candidates were never put in front of anyone, so
marking them reported would retire them unseen. Skipping the stamp costs
one re-listing; taking it loses the bead.

**4. Otherwise, if anything is NEW, run the re-file guard and then file
ONE visit.** Zero new candidates
→ file nothing and go to step 5, even when `$CARRIED_COUNT` is large: a
stable population is not news, and an empty board is success either way.
The body reports the delta, under a first line that says what it is —
a snapshot of `$PASS_AT`, re-checkable with the command step 4a stamps
(the sitting reads this body a day or more from now; see 4a):

- **New this pass** — the sitting's actual agenda. Enumerate up to
  {{list_cap}} individually, one line each: `id — title — why it reads
  idle`, with epic what-comes-next candidates called out. Beyond the
  cap, group the remainder into labelled cohorts with every id still
  listed.
- **Carried** — one line: `$CARRIED_COUNT` still unnamed from earlier
  passes, followed by `$CARRIED_IDS`. Bare ids, no re-litigation. They
  are listed so nothing is hidden, not so the sitting works them again.
- **Dispositions** — spell the menu out, with the park that actually
  works:
  - **route** — give it demand with the plain form (`gc sling <pool> <id>`):
    it picks up the pool's `default_sling_formula`, which starts a real
    workflow with a root bound to that formula and an input convoy that
    TRACKS the bead. **Do not route with `--on <formula>` here** — `--on`
    attaches an ephemeral wisp instead, and the root it builds is DETACHED:
    bound to no pool formula, carrying no input convoy, so no convoy tracks
    the work. The failure is silent — a detached root looks routed at a
    glance, and the cost lands later as work nothing is following. `--on`
    belongs only to the visit that genuinely needs a non-default formula,
    and then knowingly, with that consequence accepted (bead tk-f21vs);
  - **gate** — file a visit or a gate on it, so the wait has a name;
  - **kill** — `gc bd close <id> --reason "…"`;
  - **park** — hang it off a `task_kind=triage-subject` scope bead with
    a REAL dependency edge: `gc bd dep add <bead> <scope>`. The bead
    becomes blocked by the scope, leaves `gc bd ready`, and stops being
    a candidate. **The edge IS the park** — it is load-bearing, so a
    later tidy-up of "stray" edges silently un-parks every bead it held,
    and closing the scope bead does the same. Parking in prose — a note,
    a comment, a decision recorded in the sitting — parks nothing: the
    bead is a candidate again on the next pass;
  - **hold** — the operator decides this bead waits, and says why:
    `gc bd update <id> --set-metadata "triage.hold=<the reason>"`, plus
    `triage.hold_at` and `triage.hold_by`. Class 4(d): the bead stays
    open, ready and unblocked, and stops being a candidate because the
    wait now has a name a classifier can read. **This is the hold, and
    park is NOT it** — park makes a bead a scope's member; a hold is a
    per-bead decision only the operator reverses, which is why it is a
    stamp rather than an edge a later tidy-up can delete (operator
    ruling on tk-yyfjv, 2026-08-11). The value is the reason, so an
    empty stamp clears the hold and a bare `true` holds the bead while
    naming nothing — the classify funnel note lists held beads with
    their reasons so a reasonless one is visible.
    Offering **park** for a bead the operator simply wants held was
    itself part of that defect: it is the wrong mechanism, and it was
    the only one this menu had.

If `$PR_LIVENESS` is `unverified`, say so in the body, in one line at
the top: the open-PR read failed for at least one repository, so beads
parked on a live PR may be listed here as candidates. Nothing is
hidden by that failure, but the sitting would otherwise read a list of
already-parked work as a real backlog and re-decide beads nobody in the
city can move — which is the exact cost this class-2 gate half exists
to remove. Likewise if `$CONVOY_LIVENESS` is `unverified`: a convoy read
failed, so a work bead a live molecule is driving may be listed as a
candidate — reported, never hidden, but the sitting should know a worked
bead can appear here for that reason. And likewise if `$HUSK_LIVENESS`
is `unverified`: a root, convoy or anchor read failed, so a step bead of
a workflow that already landed may be listed — again reported rather
than hidden, and again worth a line, because a step of a finished
workflow is the one candidate shape with no disposition available.

**First, the re-file guard: an agenda a sitting already dispositioned is
not news, however the baseline reads** (bead tk-st143). The step-3 skip
deliberately does not advance `sweep.reported`, and a baseline can also be
lost or reset — so the same NEW set can come round again after a sitting
has already worked it, and be filed a second time under a title identical
to the first. That happened: su-qoma was a verbatim re-file of su-7j8b,
same title, on a set su-7j8b had closed out two days earlier with
`gc.outcome=dispositioned`.

So before creating, ask whether a CLOSED visit on this subject already
carried exactly this NEW set and was stamped `dispositioned`. The test is
the id SET and not the title: the title is a pair of counts, which collide
by accident and change whenever one bead moves, while the set is the
agenda itself — "unless the underlying candidate set actually changed" is
what the guard has to mean.

`dispositioned` specifically, and not merely "closed", because
`gc.outcome` is the sitting's own one-word verdict and the words are not
interchangeable: a visit closed `cut-short` ran out of time with its
agenda un-worked, and re-filing it is exactly right. Every other outcome
word therefore files, which keeps the guard biased the way the rest of
this formula is — toward re-reporting.

```bash
# >>> refile-guard
REFILE_SUPPRESSED=""
NEW_KEY=$(printf '%s' "$NEW" | jq -r '[.[].id] | sort | join(",")')
if [ -n "$NEW_KEY" ]; then
  # --status=closed is REQUIRED: a --metadata-field query defaults to open beads
  # only, so without it this asks about the one population that cannot answer.
  PRIOR=$(gc bd list --status=closed --metadata-field "gc.continuation_group=$SWEEP_SUBJECT" --limit=0 --json 2>/dev/null | tr -d '[:cntrl:]')
  # Fail-open, like every other probe here: an unreadable listing proves nothing
  # was dispositioned, so the visit is filed.
  if printf '%s' "$PRIOR" | jq -e 'type == "array"' >/dev/null 2>&1; then
    REFILE_SUPPRESSED=$(printf '%s' "$PRIOR" | jq -r --arg key "$NEW_KEY" '
      [ .[]
        | select(((.metadata // {}).task_kind // "") == "visit")
        | select((((.metadata // {})["gc.outcome"] // "") | tostring) == "dispositioned")
        | select(((((.metadata // {})["sweep.new_ids"] // "") | tostring)
                  | split(",") | map(select(length > 0)) | sort | join(",")) == $key)
        | .id ] | (.[0] // "")')
  fi
fi
# <<< refile-guard
```

If `$REFILE_SUPPRESSED` is non-empty, file NOTHING and log
"same NEW set as dispositioned visit $REFILE_SUPPRESSED; not re-filed",
then go to step 5 and DO advance the baseline. Advancing is what makes the
guard terminate: these ids stop being new, become carried, and the next
pass files nothing on them at all. This is the one path other than a filed
visit that may advance the baseline, and it is allowed for the reason
step 3's skip is not — the set WAS put in front of someone, and they closed
it out.

File the visit BEFORE stamping the baseline in step 5. In that order a
failed create leaves the baseline untouched and the next pass re-reports;
the reverse would retire the whole set on a visit nobody ever saw.

```bash
# >>> gate-visit
POOL="${GC_RIG:+$GC_RIG/}gc-toolkit.converse"
VISIT=$(gc bd create -t task --title "visit: $SWEEP_SUBJECT — unnamed waits: $NEW_COUNT new, $CARRIED_COUNT carried" \
  -d "<the new-candidate list, the carried ids, and the disposition menu>" --json | jq -r '.id // .[0].id')
[ -n "$VISIT" ] && [ "$VISIT" != "null" ] \
  || { echo "gate-visit: bd create returned no id — stop and re-run this block; do not improvise another create form" >&2; exit 1; }
gc bd update "$VISIT" --set-metadata "gc.routed_to=$POOL" \
  --set-metadata "gc.continuation_group=$SWEEP_SUBJECT" \
  --set-metadata "task_kind=visit"
gc bd dep add "$VISIT" "$SWEEP_SUBJECT" --type=tracks
# tracks, NOT parent-child: a parent-child edge transmits the subject's
# blocked/arrested state to the visit, making it unclaimable on exactly
# the beads that most need conversation.
# <<< gate-visit
```

**4a. Stamp the census so it can be RE-CHECKED at claim time.** The body you
just wrote is a snapshot of `$PASS_AT`, and the sitting reads it whenever the
visit is claimed — routinely a day or more later. Measured on visit 8 of
tk-hok6w (visit tk-3qeq0, bead tk-gvas6): the pass cut at 2026-08-12T00:10Z,
the sitting read it ~41.5 hours later, and FIVE of the ten new candidates had
merged AND deployed in between (tk-1u8mi #316, tk-7g37t #322, tk-xesf6 #325,
tk-5ttye #328, tk-pe1hd #332 — the headline P0). Three of the five closed
within two and a half hours of the pass, so the body was already half wrong
long before anyone opened it. 60% of that body was wrong on arrival, including
the three items it called "worth deciding first".

Naming the timestamp in the body does not fix this — that body already did.
The fix is that the ids leave here as MACHINE state, so a claim-time re-read
is one command rather than a prep budget: `assets/scripts/liveness-recheck.sh`
re-derives every listed id's class from two batched reads and prints a
corrected census — measured on that pass's 115 ids, 0.34s of query time and
1.8s wall. The sweep itself is unchanged: the re-check runs later, when the
answer is still true.

```bash
# >>> visit-recheck-stamp
# The id lists as machine state. Nothing should ever have to parse ids back out
# of the prose body, which is exactly the fragility the survivor handoff removed
# one step upstream (bead tk-7uvm9).
NEW_IDS_CSV=$(printf '%s' "$NEW" | jq -r 'map(.id) | join(",")')
CARRIED_IDS_CSV=$(printf '%s' "$CARRIED" | jq -r 'map(.id) | join(",")')
# The script is SEARCHED for, never assumed: this sweep runs in every importer
# rig, and $GC_RIG_ROOT there is a rig with no assets/ at all (the same search
# the converse prompt performs for gc-helm.sh, for the same reason).
RECHECK_SH=""
for cand in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  if [ -x "$cand/assets/scripts/liveness-recheck.sh" ]; then RECHECK_SH="$cand/assets/scripts/liveness-recheck.sh"; break; fi
done
gc bd update "$VISIT" --set-metadata "sweep.new_ids=$NEW_IDS_CSV" --set-metadata "sweep.carried_ids=$CARRIED_IDS_CSV" --set-metadata "sweep.pass_at=$PASS_AT"
if [ -n "$RECHECK_SH" ]; then
  gc bd update "$VISIT" --set-metadata "visit.recheck=$RECHECK_SH"
else
  echo "WARN: no liveness-recheck.sh on any candidate root — the visit carries its id lists but NO runnable re-check; say so at the top of the body so the sitting knows to verify by hand" >&2
fi
# <<< visit-recheck-stamp
```

`visit.recheck` is the generic handle, not a sweep-private one: it says "this
visit's body is a snapshot — run this before acting on it", and the converse
loop runs it during prep for any visit that carries one
(`agents/converse/prompt.template.md`, step 3). Its contract is a PATH to an
executable taking the visit bead id as its only argument — never a command
string, so what the sitting runs is a file it can read first. The two id lists
and `sweep.pass_at` are this sweep's payload for it.

**The body must say so too, in its first line** — the stamp is what makes the
re-check mechanical, and the line is what makes it legible to a sitting whose
prompt is a version behind:

> Census cut `$PASS_AT` — a snapshot, not the board. Re-check before acting:
> `<the visit.recheck value> <this visit's id>`

**5. Advance the baseline to the CURRENT candidate set** — reached only
from step 4 (visit filed, nothing new to file, or the re-file guard
suppressed an already-dispositioned set), never from the step-3
skip. Writing the current set, rather than adding to the old one, is what
prunes departures: a bead that was dispositioned and later regresses into
the candidate set counts as new again and gets re-surfaced.

```bash
if [ -n "$CUR_IDS" ]; then
  gc bd update "$SWEEP_SUBJECT" --set-metadata "sweep.reported=$CUR_IDS" \
    --set-metadata "sweep.reported_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
else
  gc bd update "$SWEEP_SUBJECT" --unset-metadata sweep.reported >/dev/null 2>&1 || true
fi
```

The baseline is one comma-joined id list, bounded by the rig's open-bead
count. Two passes overlapping would make the last writer win; the
cooldown order makes that unlikely, and the loss is a re-report, never a
hidden bead — which is the direction every choice in this step is biased.

Log the outcome either way (new count, carried count, visit id or
"nothing filed"), then close this step:

```bash
gc bd update <your-claimed-step-bead-id> --set-metadata gc.outcome=pass --status=closed
# use the step bead id from YOUR claim — no env var carries it
```
"""
