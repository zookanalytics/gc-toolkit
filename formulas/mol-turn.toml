description = """
mol-turn — "I want to talk about this": file one conversation turn on a
subject bead, routed to the converse pool. The operator-driven trigger of
the one entry point — all three triggers (formula-driven, event-driven,
operator-driven) collapse into filing a turn (specs/tk-h9pq5/design-doc.md,
Key Components §5; docs/architecture.md "How work moves").

Contract: v1, one step — the one-step formula the architecture names. Run
by whoever wants the conversation (operator shell, a formula step, another
conversation); the step files the turn and exits. Pool demand does the
spawning.

Files no gated work; nothing to sign off.
"""
formula = "mol-turn"
version = 1

[vars]
[vars.subject]
description = "The subject bead the conversation is about — its id IS the conversation's identity"
required = true

[vars.visit]
description = "The visit prompt: what this turn needs from the operator (decision, review, catch-up). Substituted into a shell command — avoid quote characters, or put the detail in the -d body by hand."
required = true

[vars.binding_prefix]
description = "Import binding prefix with trailing dot; combined with the rig qualifier it names the converse pool (the exact-match read side needs the qualified name — docs/gascity-routing-model.md)"
default = "gc-toolkit."

[[steps]]
id = "file-turn"
title = "File the turn bead in the subject's continuation group"
description = """
```bash
# >>> gate-turn
# The canonical gate-turn snippet (spec: specs/2026-08-fresh-start/
# liveness-and-triage-spec.md §1). Consumers copy this block, markers
# included; assets/scripts/gate-turn.test.sh extracts and checks every
# copy's load-bearing invariants (rig-qualified pool, one key per
# --set-metadata flag, parent-child edge, turn title brand).
POOL="${GC_RIG:+$GC_RIG/}{{binding_prefix}}converse"
TURN=$(gc bd create -t task --title "turn: {{subject}} — {{visit}}" -d "{{visit}}" --json | jq -r '.id // .[0].id')
gc bd update "$TURN" --set-metadata "gc.routed_to=$POOL" \
  --set-metadata "gc.continuation_group={{subject}}" \
  --set-metadata "task_kind=conversation"
gc bd dep add "$TURN" {{subject}} --type=parent-child
# To gate other work on this conversation, add a blocking edge:
# gc bd dep add "$TURN" --blocks "<blocked-bead-id>"
# <<< gate-turn
```

The turn's body is the visit prompt; extend the `-d` body if {{visit}}
alone under-specifies the visit. Stamp-don't-sling, one key per flag, and
the POOL must be the rig-qualified exact-match form
(docs/gascity-routing-model.md). Warm, the live group session vacuums the
turn; cold, pool demand spawns one. `task_kind=conversation` is the
structural marker that makes a turn legible as a conversation (to the
board and to patrols) — note the witness's orphan recovery deliberately
does NOT skip on it: a turn whose session died mid-hold SHOULD return to
the pool, because respawn-and-reconstitute-from-the-record is the cold
continuity path (specs/2026-08-fresh-start/spine-port.md, decision D4).
"""
