description = """
mol-visit — "I want to talk about this": file one visit on a
subject bead, parked on the helm board (gc.routed_to=human), or reuse the
conversation visit already open on it. The
operator-driven trigger of the one entry point — all three triggers
(formula-driven, event-driven, operator-driven) collapse into filing a visit
(specs/tk-h9pq5/design-doc.md, Key Components §5; docs/architecture.md "How
work moves").

Contract: v1, one step — the one-step formula the architecture names. Run
by whoever wants the conversation (operator shell, a formula step, another
conversation); the step files the visit and exits. The converse routed-pool is
retired: the visit holds no session until an operator engages it off the board
(gc-helm engage).

Files no gated work; nothing to sign off.
"""
formula = "mol-visit"
version = 1

[vars]
[vars.subject]
description = "The subject bead the conversation is about — its id IS the conversation's identity"
required = true

[vars.visit]
description = "The visit prompt: what this visit needs from the operator (decision, review, catch-up). Substituted into a shell command — avoid quote characters, or put the detail in the -d body by hand."
required = true

[[steps]]
id = "file-visit"
title = "File the visit bead in the subject's continuation group"
description = """
```bash
# >>> gate-visit
# The canonical gate-visit snippet (spec: specs/2026-08-fresh-start/
# liveness-and-triage-spec.md §1). Consumers copy this block, markers
# included; assets/scripts/gate-visit.test.sh extracts and checks every
# copy's load-bearing invariants (human route, one key per --set-metadata
# flag, tracks edge, visit title brand).
# The converse routed-pool is retired: a filed visit parks on the helm board
# (gc.routed_to=human, the board's exact gather predicate) and holds no session
# until an operator engages it (gc-helm engage).
POOL="human"
# The title carries the visit text as a one-line headline: whitespace
# collapsed, then cut to 140 characters (the board's headline cap) and to 400
# bytes, because bd caps a title at 500 bytes. The body keeps the full text.
VISIT_TEXT="{{visit}}"
VISIT_TAIL=$(printf '%s' "$VISIT_TEXT" | jq -Rsr 'gsub("[[:space:]]+"; " ") | ltrimstr(" ") | rtrimstr(" ")
  | if length > 140 then (.[:139] | rtrimstr(" ")) + "…" else . end
  | until(utf8bytelength <= 400; (.[:-2] | rtrimstr(" ")) + "…")' 2>/dev/null)
# One conversation visit per subject. A second run of this block, whether a
# re-run after a later command failed or a second session on a re-offered step,
# reuses the conversation visit already open on the subject and files nothing.
# Coverage is visit-identity.sh's rule: the tracks edge, else the group stamp.
# A visit carrying an escalation_key is escalate.sh's, and `escalate.sh
# --retract` closes it when its own situation clears, so it never stands in for
# this one. A listing that does not read files anyway: a second visit is a
# bounded nuisance, and a visit never filed asks nobody.
VISIT=""
VI=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -f "$c/assets/scripts/visit-identity.sh" ] && { VI="$c/assets/scripts/visit-identity.sh"; break; }
done
if [ -n "$VI" ] && . "$VI"; then
  VISIT=$(gc bd list --status=open,in_progress --metadata-field task_kind=visit --json --limit 0 2>/dev/null | tr -d '[:cntrl:]' \
    | jq -r --arg s "{{subject}}" "$VISIT_IDENTITY_JQ"'if type == "array" then ([ .[]
        | select((.metadata.task_kind // "") == "visit" and (.metadata.escalation_key // "") == "")
        | select(.status == "open" or .status == "in_progress")
        | select(visit_covers($s)) | .id ] | sort | .[0] // "") else "" end' 2>/dev/null || printf '')
else
  echo "gate-visit: warning: visit-identity.sh not found, so no open visit on {{subject}} can be matched — filing" >&2
fi
if [ -n "$VISIT" ]; then
  echo "gate-visit: visit $VISIT is already open on {{subject}} — reusing it, not filing a second" >&2
else
  # bd create answers the new bead as an object or an array holding it, and a
  # refused create as a bare {"error": ...} object. Read the id type-guarded, so
  # a refusal yields no id instead of a jq crash, and report bd's own reason.
  VISIT_JSON=$(gc bd create -t task --title "visit: {{subject}} — $VISIT_TAIL" -d "$VISIT_TEXT" --json)
  VISIT=$(printf '%s' "$VISIT_JSON" | jq -r 'if type == "array" then (.[0].id // empty) else (.id // empty) end' 2>/dev/null)
  [ -n "$VISIT" ] && [ "$VISIT" != "null" ] \
    || { CREATE_ERR=$(printf '%s' "$VISIT_JSON" | jq -r 'if type == "object" then (.error // empty) else empty end' 2>/dev/null)
         echo "gate-visit: bd create returned no id${CREATE_ERR:+: $CREATE_ERR} — stop, address what bd reported, and re-run this block; do not improvise another create form" >&2; exit 1; }
  gc bd update "$VISIT" --set-metadata "gc.routed_to=$POOL" \
    --set-metadata "gc.continuation_group={{subject}}" \
    --set-metadata "task_kind=visit"
  gc bd dep add "$VISIT" {{subject}} --type=tracks
  # tracks, NOT parent-child: a parent-child edge transmits the subject's
  # blocked/arrested state to the visit, making it unclaimable on exactly
  # the beads that most need conversation.
  # To gate other work on this conversation, add a blocking edge:
  # gc bd dep add "$VISIT" --blocks "<blocked-bead-id>"
  # Read the group stamp back and repair it from the subject if it landed
  # empty: it can land present-but-empty while every sibling stamp in the
  # same update lands, and an empty group disables converse's group-scoped
  # re-claim fence. Repair and warn, never exit — this block files the one
  # visit for its scope, and on a persistent miss the tracks edge still
  # carries the subject for guards that read the union.
  GROUP_GOT=$(gc bd show "$VISIT" --json | tr -d '[:cntrl:]' | jq -r '.[0].metadata["gc.continuation_group"] // ""' 2>/dev/null || printf '')
  if [ "$GROUP_GOT" != "{{subject}}" ]; then
    echo "gate-visit: warning: gc.continuation_group on $VISIT read back as '$GROUP_GOT', expected '{{subject}}' — repairing" >&2
    gc bd update "$VISIT" --set-metadata "gc.continuation_group={{subject}}" || true
    GROUP_GOT=$(gc bd show "$VISIT" --json | tr -d '[:cntrl:]' | jq -r '.[0].metadata["gc.continuation_group"] // ""' 2>/dev/null || printf '')
    if [ "$GROUP_GOT" = "{{subject}}" ]; then
      echo "gate-visit: the repair landed on $VISIT" >&2
    else
      echo "gate-visit: warning: the repair did not land on $VISIT — the tracks edge still carries the subject, and the live-visit guards read the union" >&2
    fi
  fi
fi
# <<< gate-visit
```

The visit bead's body is the visit prompt; extend the `-d` body if {{visit}}
alone under-specifies it. Stamp-don't-sling, one key per flag. The visit is
routed to `human` (gc.routed_to=human, the helm board's exact gather
predicate): it parks on the board and holds no session until an operator draws
it off with `gc-helm engage`, which spawns the sitting on demand.
`task_kind=visit` is the structural marker that makes a visit legible as
engagement.
"""
