description = """
Deacon patrol loop. Poured as a root-only wisp on startup:

  gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}'
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: check inbox, run town-wide coordination
tasks, pour the next iteration. On crash, re-read the formula steps
and determine where you left off from context.

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: every exit path (happy or early) pours the next
wisp before burning this one. The prompt only bootstraps the first wisp.

## Deacon Role

The deacon is the **LLM sidekick to the controller**. It handles periodic
tasks that require judgment or observation — things the Go controller
can't or shouldn't do.

1. **Work-layer health** — are witnesses and refineries making progress?
   (Not "are they running" — that's the controller's job.)
2. **Utility agent health** — detect stuck dogs, dispatch shutdown dance.
3. **Orphan process cleanup** — kill leaked claude/node subagent processes.
4. **System diagnostics** — run `gc doctor`, act on findings.

Mechanical tasks (gate evaluation, cross-rig deps, orphan bead sweeps,
wisp compaction) are handled by exec orders in the maintenance
pack — no LLM needed.

## Idle Town Principle

The deacon should be silent/invisible when the town is healthy and idle.
Skip health checks when no active work exists. Use exponential backoff
between patrol cycles.

## What the deacon does NOT do

- Start/stop/restart agents (controller handles this)
- Per-rig orphaned bead recovery (witness handles this)
- Code implementation (polecats do this)
- Kill agents directly (files warrants, dog pool runs shutdown dance)
- Pool sizing (controller pool reconciliation)

Read each step's description before acting — Config values override defaults."""
formula = "mol-deacon-patrol"
version = 18

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.event_timeout]
description = "Seconds to sleep before re-checking. Replaces former event-watch loop which hot-spun on cache-reconcile firehose."
default = "60"

[[steps]]
id = "check-inbox"
title = "Check mail"
description = """
**Check mail:**
```bash
gc mail inbox
```

Handle each message type:

**HELP / Escalation:**
Assess the request. Can you help directly? If not, escalate:
```bash
gc mail send mayor/ -s "ESCALATION: <agent> needs help" -m "<details>"
```
Archive after handling.

**DOG_DONE:**
A utility agent completed its task (e.g., shutdown dance, dep
propagation). Note the outcome for observability. Archive.

**Other / informational:**
Archive after reading.

**Hygiene principle**: Archive messages after they're fully processed.
Inbox should be near-empty after this step.

Close this step and proceed."""

[[steps]]
id = "orphan-process-cleanup"
title = "Kill orphaned claude subagent processes"
needs = ["check-inbox"]
description = """
Claude Code's Task tool spawns subagent processes that sometimes don't
clean up. These accumulate and consume significant memory.

**Detection:** Orphaned subagent processes have TTY = "?" in `ps` output.
They are child processes of claude/node that lost their parent.

```bash
ps aux | grep -E 'claude|node' | grep '?'
```

**Judgment required:** Not all TTY=? processes are orphaned. Some are
legitimate background processes. Look for:
- Processes consuming significant memory (>500MB RSS)
- Processes that have been running much longer than any active session
- Multiple identical processes (accumulated from repeated crashes)

**Action:** Kill confirmed orphans:
```bash
kill <pid>
```

Use judgment — this is exactly why an LLM does it, not Go code.

Close this step after check (even if no orphans found)."""

[[steps]]
id = "health-scan"
title = "Check work-layer health"
needs = ["orphan-process-cleanup"]
description = """
Monitor whether work is flowing through rig coordination agents.
The controller handles "is the agent running?" The deacon handles
"is work progressing?"

**Skip docked/parked rigs.** Only check active rigs.

**For each active rig, assess witness health:**

Check witness patrol wisp freshness. Each patrol cycle burns a wisp.
If the last wisp is much older than the maximum backoff cap (300s) plus
buffer, the witness may be stuck. But if there's no active work in the
rig, the witness is legitimately idle — not stuck.

**For each active rig, assess refinery health:**

Check refinery patrol wisp freshness + queue state:
- Wisp recently burned → healthy (actively cycling)
- Wisp open, no work assigned to refinery → idle, fine
- Wisp open, work assigned to refinery, stale `UpdatedAt` → stuck

**No hardcoded thresholds.** Read wisp timestamps, queue state, and
the nature of the current work. Make a judgment call about whether
something is stuck. This is exactly why an LLM does it, not Go code.

**Quota-parked is NOT stuck.** An agent showing a provider limit banner
("hit your session limit" / "hit your usage limit") at an idle prompt is
alive and correct: its turn ended inside the block, so it has no pending
work and no timer to drive it until the window reopens. Do **not** file a
warrant — a shutdown dance discards a healthy session holding live context,
and a fresh agent hits the same block. Seven warrants were filed against two
such agents on 2026-08-02 (bead tk-al95k). Recovery is mechanical and already
running: the `quota-park-nudge` order polls every session's pane city-wide
every 3m and nudges the parked ones until the window actually reopens. Leave
them to it. See docs/quota-park-recovery.md.

**For stuck coordination agents, file a warrant:**
```bash
gc bd create --type=task --label=warrant \
  --title="Stuck: <rig>/<role>" \
  --metadata '{"target":"<session>","reason":"<reason>","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
```

The dog pool runs `mol-shutdown-dance` for due process.

**Escalate to mayor** only for systemic issues (multiple rigs affected,
patterns of failure).

Close this step after assessment."""

[[steps]]
id = "queue-starvation-check"
title = "Cross-check assigned work against visible work signal"
needs = ["health-scan"]
description = """
Cross-check assigned work against visible work signal. A session can
look healthy-idle in a patrol wisp view while its queue is silently
starving — the refinery (upstream #1833) self-polled for 13h42m with
seven beads in its queue and no visible work signal, because its poll
filter resolved to an identity that didn't match its own.

The deacon's wisp-freshness check catches "no patrol activity" but not
"active polling, wrong filter, queue silently piling up." This step
closes that gap.

**Step 1: For each active coordination/merge session, compute the pair:**
- `A` = count of open beads assigned to the session's agent identity
- `B` = the most recent bead.updated_at across those beads (work signal)

```bash
gc agents list --json --active | jq -r '.[] | .agent_id' | while read -r AGENT; do
    ASSIGNED=$(gc bd list --status=open --assignee="$AGENT" --json --limit=0 | jq 'length')
    LATEST=$(gc bd list --status=open --assignee="$AGENT" --json --limit=0 \\
        | jq -r '[.[].updated_at] | max // ""')
    printf '%s\\t%s\\t%s\\n' "$AGENT" "$ASSIGNED" "$LATEST"
done
```

The latest bead.updated_at is the cheapest proxy for "did this session
move work recently?" — every claim, status transition, metadata update,
or note bumps it.

**Step 2: Flag when queue > 0 and signal is stale (judgment call,
guideline ~30min):**

If `A > 0` AND `now - B` has grown well past the patrol's natural
cadence (default guideline: 30min — roughly 6x the 300s max patrol
backoff), the session is holding work without making progress. This
is exactly why an LLM does it, not Go code. Consider:
- Coordination agents (refinery, witness) naturally cycle in seconds
  when work is present; 30min is an eternity, not a lull.
- Polecats may take longer per step; be more lenient before flagging.
- A freshly-assigned bead with no prior activity gets `updated_at` at
  assignment time; if it's hours old, the session picked it up but
  never acted.

**Step 3: For flagged sessions, nudge first, then warrant:**

```bash
gc session nudge "$STUCK_SESSION" "Queue has $ASSIGNED open beads, no bead activity for <duration>. Run gc hook."
```

If the nudge doesn't unstick within the next patrol cycle, escalate
by filing a warrant for the dog pool:

```bash
gc bd create --type=task --label=warrant \\
    --title="Stuck queue: <session> — $ASSIGNED beads, no activity $duration" \\
    --metadata '{"target":"<session>","reason":"queue starvation: N beads, no bead.updated_at progress","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
```

The dog runs `mol-shutdown-dance` and the controller respawns a fresh
session that re-reads the queue with a correct filter.

**Step 4: A genuinely-idle session (no assigned beads) is NOT flagged.**
If `A == 0`, this step is a no-op for that session. Idle-but-ready
refineries and witnesses are healthy.

Close this step after the cross-check runs for every active session."""

[[steps]]
id = "utility-agent-health"
title = "Check utility agent (dog) health"
needs = ["queue-starvation-check"]
description = """
Detect utility agents (dogs) that are alive but stuck on their work.

The controller detects dead agents. But "working too long" is a
work-layer judgment: is this task genuinely slow, or is the agent stuck?
The controller can't know this. The deacon can, by checking bead and
wisp timestamps.

**Step 1: Find active utility agent work:**
```bash
gc bd list --status=in_progress --metadata-field gc.routed_to={{binding_prefix}}dog --json --limit=0
```

**Step 2: For each, assess progress:**

Check the work bead's `UpdatedAt` and the agent's wisp freshness.
Consider the nature of the work — a shutdown dance with 240s timeouts
will naturally take longer than a quick dep propagation.

No hardcoded thresholds. Use judgment.

**Step 3: For stuck utility agents, file a warrant:**
```bash
gc bd create --type=task --label=warrant \
  --title="Stuck dog: <agent>" \
  --metadata '{"target":"<session>","reason":"<reason>","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
```

A different dog from the pool picks up the warrant and runs the
shutdown dance. If the pool is at capacity with all dogs stuck,
escalate to mayor.

Close this step after assessment."""

[[steps]]
id = "dolt-health"
title = "Run Dolt data-plane health check"
needs = ["utility-agent-health"]
description = """
Run `gc dolt health --json` to inspect the Dolt data plane and flag anomalies.

This step surfaces problems that individual patrol steps won't catch:
commit bloat (compactor dog may have failed), unrestorable backups (backup
dog may have failed), orphan databases, and zombie Dolt server processes.

**Step 1: Run the health check**

Keep the report — Step 2a needs its `databases[]` list, and re-probing
costs another 5 s per database against a data plane this step exists to
watch:
```bash
HEALTH_JSON=$(gc dolt health --json)
printf '%s' "$HEALTH_JSON" | jq .
```

Parse the JSON output (HealthReport schema):
- `server`: running, reachable, pid, port, latency_ms
- `databases[]`: name, commits, open_beads
- `backups`: dolt_freshness, dolt_age_seconds, dolt_stale — **never
  sufficient on its own.** Absent backup data renders as
  `"dolt_freshness": "", "dolt_age_sec": 0, "dolt_stale": false`, so a
  TOTAL backup failure is indistinguishable from a fresh backup and
  `dolt_stale` can only ever fire on a *partial* one. Verify backups by
  manifest mtime on disk (Step 2a); treat these fields as advisory.
- `processes`: zombie_count, zombie_pids
- `orphans[]`: name, size

Note: `--json` always exits 0 when the payload is well-formed; health
state is signalled in-band. Key decisions off `server.reachable`, not
`server.running` — a process can hold the port while its goroutines
are wedged (the latter is what first prompted this check to exist).

**Step 2: Evaluate thresholds**

| Signal | Threshold | Meaning |
|--------|-----------|---------|
| `server.reachable == false` | — | Dolt server is down or unresponsive (CRITICAL) |
| `server.latency_ms > 5000` | 5 s | Server may be overloaded |
| `databases[].commits > 50000` | 50 k | Compactor dog may have stalled |
| backup restorability — see **Step 2a** | every live database has a backup dir whose newest file is its manifest, <12 h old | Backup dog may have failed. Do NOT key this off `backups.dolt_stale` — it reads false-clean through a total outage |
| `processes.zombie_count > 0` | any | Zombie Dolt servers detected |
| `orphans` non-empty | any | Advisory only — NEVER act on this count directly; verify with `gc dolt-cleanup` (hyphen, dry-run) first |

**Step 2a: Verify backups by manifest mtime (never by `dolt_stale`)**

A backup is restorable only up to its committed **manifest**. Dolt writes
chunk `.darc` files first and commits the `manifest` last, so a healthy
database's newest file IS its manifest. If a `.darc` is newer, the run
uploaded data but never committed it — nothing after the manifest
timestamp is restorable, however new the chunks look. Directory mtime and
directory size both lie here: they move with the chunk writes.

**Drive the scan from the live database list, not from the backup dirs.**
A database whose backup directory is *missing entirely* is the worst case
and is invisible to a walk of `$BACKUP_ROOT/*/` — that walk can only judge
backups that already exist, so it would emit no verdict for the one
database with no backup at all and still let you conclude "clean". The
expected set is `databases[].name` from the Step 1 report; a backup dir
with no matching live database is advisory only (a dropped or renamed db).

The markers below let the regression test extract and exercise this exact
snippet (assets/scripts/dolt-backup-manifest-check.test.sh), so the shipped
rule cannot drift from the tested one.

```bash
# >>> backup-manifest-check
BACKUP_ROOT="${GC_CITY_PATH:-$GC_CITY}/.dolt-backup"
# Expected databases come from the Step 1 health report: reuse $HEALTH_JSON
# if you still have it, otherwise probe again. Lazy by design — set
# EXPECTED_DBS to run this snippet against a fixture (the test does) and
# neither the probe nor jq is invoked.
: "${EXPECTED_DBS:=$(printf '%s' "${HEALTH_JSON:-$(gc dolt health --json)}" | jq -r '.databases[].name')}"
# In-flight grace: mid-sync the newest file IS a chunk, because the manifest
# is committed last. Only call that a failure once the writes have stopped
# advancing for GRACE_SEC — or once the manifest is already stale, which no
# healthy in-flight run can explain.
GRACE_SEC="${GRACE_SEC:-900}"
STALE_H="${STALE_H:-12}"
NOW=$(date +%s)
# Portable mtime: GNU (-c), BSD/macOS (-f), 0 when the file is absent.
mtime_of() { stat -c %Y "$1" 2>/dev/null || stat -f %m "$1" 2>/dev/null || echo 0; }
# One-line form of the list, so a root-level finding can name every affected
# database on a single line. The unquoted expansion is the point: it collapses
# the newline-separated list.
# shellcheck disable=SC2086,SC2116
DB_NAMES="$(echo $EXPECTED_DBS)"

if [ -z "$EXPECTED_DBS" ]; then
    echo "FLAG-ROOT: health report listed no databases - cannot verify any backup"
elif [ ! -d "$BACKUP_ROOT" ]; then
    echo "FLAG-ROOT: no backup root at $BACKUP_ROOT - NO restorable backup for: $DB_NAMES"
elif [ -z "$(ls -A "$BACKUP_ROOT" 2>/dev/null)" ]; then
    echo "FLAG-ROOT: backup root $BACKUP_ROOT is empty - NO restorable backup for: $DB_NAMES"
else
    for name in $EXPECTED_DBS; do
        db="$BACKUP_ROOT/$name"
        if [ ! -d "$db" ]; then
            echo "FLAG $name: no backup directory at $db - never backed up"
            continue
        fi
        m_t=$(mtime_of "$db/manifest")
        newest=""; newest_t=0
        while IFS= read -r f; do
            t=$(mtime_of "$f")
            if [ "$t" -gt "$newest_t" ]; then newest_t="$t"; newest="${f##*/}"; fi
        done < <(find "$db" -type f 2>/dev/null)
        since=$(( NOW - newest_t ))
        age_h=$(( (NOW - m_t) / 3600 ))
        if [ "$m_t" -eq 0 ]; then
            if [ "$newest_t" -gt 0 ] && [ "$since" -le "$GRACE_SEC" ]; then
                echo "RECHECK $name: no manifest yet, '$newest' written ${since}s ago - first commit may be in flight"
            else
                echo "FLAG $name: no manifest - nothing restorable"
            fi
        elif [ "$newest" != "manifest" ]; then
            if [ "$since" -le "$GRACE_SEC" ] && [ "$age_h" -le "$STALE_H" ]; then
                echo "RECHECK $name: newest file is '$newest' written ${since}s ago, manifest ${age_h}h old - sync may be in flight"
            else
                echo "FLAG $name: newest file is '$newest', not the manifest - uploaded but never committed; not restorable past ${age_h}h ago"
            fi
        elif [ "$age_h" -gt "$STALE_H" ]; then
            echo "FLAG $name: manifest is ${age_h}h old (>${STALE_H}h = 2x backup cadence)"
        else
            echo "OK $name: manifest is newest, ${age_h}h old"
        fi
    done
    for d in "$BACKUP_ROOT"/*/; do
        [ -d "$d" ] || continue
        extra="${d%/}"; extra="${extra##*/}"
        case " $DB_NAMES " in
            *" $extra "*) ;;
            *) echo "INFO $extra: backup dir with no live database (advisory)" ;;
        esac
    done
fi
# <<< backup-manifest-check
```

Every expected database gets exactly one verdict:

| Verdict | Meaning |
|---------|---------|
| `OK` | manifest is the newest file and within the staleness threshold |
| `FLAG` | not restorable — act on it (Step 3) |
| `RECHECK` | indeterminate, a sync may be in flight — **not** clean |
| `FLAG-ROOT` | no root, empty root, or no database list: nothing is verified |
| `INFO` | extra backup dir, no live database — advisory, never a verdict |

Flag a database when ANY holds:
- it has **no backup directory**, or
- it has **no manifest** (and nothing is being written right now), or
- the newest file in its backup dir is **not** the manifest, or
- the manifest is older than **12 h** — 2x the 6 h cadence (backup runs at
  21:00 / 03:00 / 09:00 / 15:00Z).

**Missing and empty roots are findings, not warnings.** A missing or empty
`$BACKUP_ROOT` means *no* database has a restorable backup — the most
severe state this check can find. It names the affected databases so Step 3
has something concrete to nudge and escalate with; never let it degrade
into an unnamed warning.

**The in-flight grace, and why it cannot hide a real failure.** During a
normal sync the newest file is a `.darc` until the run commits, so a scan
that fires the instant it sees a chunk newer than the manifest would flag
every healthy run in progress. `RECHECK` covers that window, and it closes
two ways so a broken sync cannot camp in it:
- **Writes stop advancing.** A live sync keeps writing; a dead one freezes.
  Once the newest file is older than `GRACE_SEC` (15 min), it is a FLAG.
  Re-running Step 2a is the whole re-check — no state to carry.
- **The manifest is already stale.** A run in flight cannot explain a
  manifest older than 12 h. That combination is a sync that keeps writing
  and never commits, so it flags immediately regardless of the grace
  window. This is exactly the lx shape: fresh chunks every rotation, a
  manifest 40 h behind.

A `RECHECK` is not a pass. Re-run Step 2a before concluding the step, and
treat a database that is still `RECHECK` after the grace window as `FLAG`.

**Do not flag on sync duration.** A large database is slow but healthy as
long as its manifest is newest and recent — lx is ~3 GB and needs ~95 s to
sync. The failure this catches is "uploaded but never committed"
(`.darc` newer than manifest), not "slow".

**Step 2b: Read the backup dog's failure mail (live second channel)**

The backup dog reports per-database sync failures by mail to the `human`
mailbox, which no agent drains — during the outage that prompted this
step, several such mails sat unread while the patrol logged OK. This step
is that channel's reader:

```bash
gc mail inbox human | grep -E 'Dolt backup: [0-9]+/[0-9]+ databases failed to sync'
```

A hit names the failing databases in its body and should corroborate
Step 2a; a hit with a clean Step 2a (or the reverse) means one of the two
channels is lying — investigate rather than picking the happier one.
**List only.** Do NOT `gc mail read` or `gc mail archive` these — that is
the operator's inbox, and draining it here hides the outage from them.

**Step 3: React to alerts**

**Server down (CRITICAL):** `server.reachable == false` — either no
process is listening on the port, or a process is listening but not
answering SQL (wedged goroutines, migration lock, saturated pool).
```bash
gc mail send mayor/ -s "ESCALATION: Dolt server unreachable [CRITICAL]" \\
  -m "gc dolt health reports server.reachable=false"
```

**Commit bloat (commits > 50k in any DB):**
The compactor dog (`mol-dog-compactor`) may have failed. Log for awareness.
If the compactor order is configured, it will self-dispatch. Otherwise
nudge the dog pool:
```bash
gc session nudge dog/ "Compactor needed: <db_name> has <count> commits"
```

**Unrestorable backup (any Step 2a `FLAG`, or a Step 2b mail):**
The backup dog (`mol-dog-backup`) may have failed. A manifest that is not
the newest file is a FAILED backup, not a slow one — the database cannot
be restored past the manifest timestamp. Same pattern — log and nudge if
order hasn't self-healed:
```bash
gc session nudge dog/ "Backup needed: <db> manifest <age> old / not newest"
```
If the same database is still flagged on the next rotation, the dog's own
retries are not clearing it. Escalate — unattended, this is silent data
loss on a ledger nobody can restore:
```bash
gc mail send mayor/ -s "ESCALATION: <db> has no restorable backup [HIGH]" \\
  -m "Manifest <age>h old; newest file <file>. Backup dog retries not clearing."
```
"Still flagged on the next rotation" is answered by your own escalation
trail, not by memory: that mail is the durable record. Before escalating,
check whether this database was already escalated:
```bash
gc mail inbox mayor/ | grep -F "no restorable backup"
```
A prior hit for the same database means the retries have had a full cycle
and have not cleared it — escalate again and say so.

**No backup root, or an empty one (`FLAG-ROOT`):** the most severe state
this step can report — *no* database has a restorable backup, so the whole
Step 2a verdict set is missing rather than clean. Escalate immediately with
the database names the verdict lists; do not nudge the dog and move on:
```bash
gc mail send mayor/ -s "ESCALATION: no Dolt backups exist at all [CRITICAL]" \\
  -m "Backup root <path> missing/empty. NO restorable backup for: <db names>."
```

**Indeterminate (`RECHECK`):** a sync may be in flight. Re-run the Step 2a
snippet; a live sync advances its newest file, a dead one does not. If the
database is still `RECHECK` after the grace window, treat it as a `FLAG`
above. Never count a `RECHECK` toward "healthy".

**Zombie processes:**
Kill zombie Dolt servers not on the expected port:
```bash
kill <zombie_pid>
```

**Orphan DBs (`orphans` non-empty):**
Do NOT act on the health `orphans` count directly — the reporter can
false-positive live rig databases as orphans, and a forced removal on that
count would destroy a live rig ledger (unrecoverable). Confirm against the
rig-protected dry-run authority first:
```bash
gc dolt-cleanup --json    # hyphen, Go-side: dry-run, rig-protected
```
Real orphans are exactly the databases it lists under `dropped.names`
(`rigs_protected` are already excluded). If `dropped.names` is empty, there
is nothing to clean — the health `orphans` entries are live rig DBs (a
reporter false-positive); log and move on. `gc dolt-cleanup` (hyphen,
the Go-side command) is dry-run by default; removal happens only under
`--force`. Do NOT rely on the `gc dolt cleanup` (space) pack-script's
defaults — always use the hyphen command for orphan inspection/cleanup.
Reclaim confirmed orphans only via human-approved
`gc dolt-cleanup --force` escalated to mayor — never run a destructive
`--force` automatically from this step, and never
`gc dolt cleanup --force --server-down-ok` against a reachable server (it can
`rm -rf` an open database and corrupt NBS, #1549).

**If everything is healthy:**
Log `Dolt health: OK` and move on. "Healthy" requires an explicit `OK`
verdict from Step 2a for **every** database in `databases[]` — no `FLAG`,
no `FLAG-ROOT`, and no outstanding `RECHECK`. A green `gc dolt health`
alone does not earn it, and neither does "nothing was flagged": a database
with no backup directory produces no verdict from a dir-walk at all, which
is how a total outage reads clean. Count the verdicts against the expected
list before you write OK.

**Exit criteria:** Health check run, every database in `databases[]`
carrying a Step 2a verdict, alerts handled or escalated."""

[[steps]]
id = "system-health"
title = "Run system diagnostics"
needs = ["dolt-health"]
description = """
Run `gc doctor --json` for a workspace health check. **Always
pass `--json`.** The default human output puts a count in the headline
message (e.g. "1 session model finding(s)") and hides the actionable
list of findings in `CheckResult.Details` unless `--verbose` is set.
The `--json` mode is the stable machine-readable contract: every check
emits `{name, status, message, details[], fix_hint, fix_error,
fix_attempted, fixed}` regardless of verbosity, plus a `summary`
object with `{passed, warned, failed, fixed}`. Schema:
`engdocs/contributors/doctor-json.md`.

gc-toolkit local delta: keep `--json` parsing. Base v14 uses a bare
`gc doctor` whose human-output count is a regression for the deacon
(needs the structured findings list to decide whether to act or
escalate).

```bash
gc doctor --json | jq '.checks[] | select(.status != "ok")'
```

That filter shows only the warning/error checks with their full
details — the actionable subset.

**For simple findings:** Act directly (e.g., stale lock files, temp
directory cleanup, broken worktrees via `gc doctor --fix`).

**For complex findings:** Escalate to mayor. Forward the offending
check object verbatim (it includes `name`, `message`, `details`, and
any `fix_hint`) so the mayor sees the same machine-readable context:
```bash
finding=$(gc doctor --json | jq '.checks[] | select(.name=="<check>")')
gc mail send mayor/ -s "DOCTOR: <finding>" -m "$finding"
```

Close this step after check."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["system-health"]
description = """
**Config: event_timeout = {{event_timeout}}**

End of patrol cycle. Pour the next iteration, then wait or exit.

**1. Quick inbox check (end-of-cycle hygiene):**
```bash
gc mail inbox
```
Handle any urgent messages that arrived during patrol. Archive the rest.

**2. Pour next iteration BEFORE burning:**
```bash
NEXT=$(gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}' --json | jq -r '.new_epic_id')
gc bd update "$NEXT" --assignee=$GC_AGENT
```

**3. Wait before next cycle:**
```bash
sleep {{event_timeout}}
```

Previous implementation watched `gc events --type=bead.updated` for fast wake-up, but cache-reconcile fires that event constantly, turning the watch into a tight loop with no useful backoff. Fixed sleep gives predictable idle cost.

**4. Burn this wisp:**
```bash
gc bd mol burn <this-wisp-id> --force
```

The new wisp is ready. Re-read formula steps to start
the next patrol cycle.

**Exit criteria:** Next wisp poured, this wisp burned."""
