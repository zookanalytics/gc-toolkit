description = """
Deacon patrol loop — city infrastructure health. Poured as a root-only wisp
on startup (the agent prompt's startup reconcile adopts before it pours):

  gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}' --var event_timeout='{{event_timeout}}' --var doctor_interval='{{doctor_interval}}'
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: mail, orphan-process cleanup, Dolt health,
doctor sweep, pour the next iteration. Steps are not materialized; read
each description as you reach it, and never exit the wisp from an
intermediate step. The deacon is the controller's judgment layer — it never
starts/stops agents, never recovers per-rig beads (witness), never writes
code. A finding becomes one deduped BEAD through
assets/scripts/patrol-finding.sh, and a proactive first reaction disposes it:
routed to a pool, held on an edge, or escalated to the operator as a visit.
assets/scripts/escalate.sh is for what a patrol cannot express as a bead.

Every non-routine ACTION also leaves one line in the incident ledger
(assets/scripts/gc-deacon-ledger.sh), which is how a shift is reconstructed
without replaying a transcript. A reading that came back on-track appends
nothing: a ledger that records every cycle records no signal. escalate.sh
writes its own `escalation` entry, so a step that escalated owes the ledger
only what it additionally did by hand.

The marked backup-manifest-check block is extracted and executed by
assets/scripts/dolt-backup-manifest-check.test.sh; keep the markers and
keep it backslash-free."""
formula = "mol-deacon-patrol"

[vars]
[vars.binding_prefix]
description = "Agent identity prefix with trailing dot. Non-empty default on purpose: this patrol files a warrant routed to the dog, and an empty prefix renders a bare dog address that no agent holds."
default = "gc-toolkit."

[vars.event_timeout]
description = "Seconds to wait before the next cycle. Spent as a bounded until-loop (the harness blocks a standalone sleep). Ceiling 600: the harness caps one call at 600s."
default = "600"

[vars.doctor_interval]
description = "Length of the per-interval doctor-sweep window, in seconds. The sweep step gates itself on this, so the patrol keeps its faster cadence for mail and Dolt while the sweep opens at most one window per interval. A window normally holds one start; a run that ends failed or exceeded earns one retry inside it (capped by GC_DOCTOR_SWEEP_MAX_ATTEMPTS, default 2), so on the failure path the sweep can run twice in one interval, while a completed run arms no retry. It also bounds a result's age: a sweep that finished more than one interval before the patrol collects it is reported stale and filed nowhere. 1800 is the shortest the operator asked for. doctor-sweep.sh owns the default, so a value that never reaches it still opens one window per hour."
default = "3600"

[[steps]]
id = "check-inbox"
title = "Check mail"
description = """
```bash
gc mail inbox
```
Handle what you can directly; anything needing a human becomes a visit via
escalate.sh. A `DOG_DONE:` notice is a completed shutdown dance on a
warrant — note the outcome (the closed warrant carries the evidence) and
archive. Archive processed messages — inbox near-empty after this step.

Ledger what you ACTED on. An escalation records itself, so what is owed here
is the message you resolved yourself and the outcome a `DOG_DONE:` reports:
```bash
LEDGER=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/gc-deacon-ledger.sh" ] && { LEDGER="$c/assets/scripts/gc-deacon-ledger.sh"; break; }
done
"$LEDGER" append recovery "<what you resolved, and how>" "mail:<message-id>"
"$LEDGER" append warrant "<session> <pardoned|executed> by the dog" "bead:<warrant-id>"
```
An inbox you only read and archived appends nothing.

Close this step and proceed."""

[[steps]]
id = "orphan-process-cleanup"
title = "Kill orphaned claude subagent processes"
needs = ["check-inbox"]
description = """
Subagent processes sometimes outlive their parents and accumulate memory.
Detect: `ps aux | grep -E 'claude|node' | grep '?'` (TTY = "?"). Judgment
required — not every TTY=? process is orphaned; look for large RSS
(>500MB), runtimes far beyond any live session, or multiples of the same
command. Kill confirmed orphans with `kill <pid>`.

A kill is an action nothing else records, so ledger it — one entry for the
pass, naming what made those processes orphans:
```bash
LEDGER=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/gc-deacon-ledger.sh" ] && { LEDGER="$c/assets/scripts/gc-deacon-ledger.sh"; break; }
done
"$LEDGER" append cleanup "killed <n> orphaned subagents (<pids>; <what marked them orphaned>)" -
```
A pass that killed nothing appends nothing. Close this step either way."""

[[steps]]
id = "dolt-health"
title = "Run Dolt data-plane health check"
needs = ["orphan-process-cleanup"]
description = """
**1. Run the check once and keep the payload** (re-probing costs ~5s per
database against the very data plane being watched). The same command runs
step 2's backup check on that payload:
```bash
HEALTH_JSON=$(gc dolt health --json)
printf '%s' "$HEALTH_JSON" | jq .
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/dolt-backup-check.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
HEALTH_JSON="$HEALTH_JSON" "${SCRIPTS:?dolt-backup-check.sh not found in the pack}/dolt-backup-check.sh"
```
Key decisions off `server.reachable`, never `server.running` — a process
can hold the port with wedged goroutines. Thresholds: unreachable server =
CRITICAL; `latency_ms > 5000` = overloaded; `databases[].commits > 50000` =
compactor stalled; zombie PIDs = kill them; `orphans[]` = ADVISORY only
(verify with the dry-run `gc dolt-cleanup --json` before believing it, and
never run a destructive `--force` from this step).

**2. Read the backup verdicts — by manifest mtime, never by
`backups.dolt_stale`.** Absent backup data renders as `dolt_stale=false`, so
that field reads false-clean through a TOTAL outage. `dolt-backup-check.sh`
checks each live database's backup on disk against its committed manifest (its
header carries the contract) and prints one verdict line per database: OK,
FLAG, RECHECK, FLAG-ROOT, or an advisory INFO.

"Healthy" requires an explicit `OK` for EVERY database in `databases[]` —
no FLAG, no FLAG-ROOT, no outstanding RECHECK (re-run the check; a RECHECK
whose cause is an unreadable directory never clears by waiting — fix the
read or treat as FLAG).

**3. React.** File each finding through the one writer, carrying the
verdict line VERBATIM (each is a complete one-line reason; do not
re-template it):
```bash
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/patrol-finding.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
# The deacon is city-scoped: GC_RIG picks the store the finding lands in and
# the proactive pool that reacts to it.
ESC_RIG="${GC_RIG:-gc-toolkit}"
GC_RIG="$ESC_RIG" "$SCRIPTS/patrol-finding.sh" --scope deacon-findings --key dolt-backup-<db> --title "Dolt backup: <db> is not restorable" --message "<the Step 2 FLAG line, verbatim>"
# server unreachable: --key dolt-server-unreachable --priority 0 (CRITICAL)
# FLAG-ROOT:          --key dolt-backup-root (names every affected database)
# commit bloat:       --key dolt-commit-bloat-<db> (commits > 50000; compaction
#                     is a manual operator action until an actuator exists)
# orphan databases:   --key dolt-orphan-dbs (advisory orphans[] non-empty;
#                     removal is a manual operator action — never --force here)
```
The key is the identity of the situation, so a flag that is still true next
cycle lands on the bead it already has as another occurrence, and files
nothing. Give two databases two keys; a shared key would make them one
finding.

Before restarting anything, collect non-fatal diagnostics first
(`SHOW FULL PROCESSLIST`, `gc dolt logs`, bounded `gc dolt health --json`,
`gc dolt status`) — a blind restart destroys the evidence.

**4. Ledger what you did by hand.** Each escalation above already wrote its
own entry carrying the visit id. A zombie PID you killed, or a Dolt process
you restarted, is an action with no other durable record:
```bash
LEDGER=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/gc-deacon-ledger.sh" ] && { LEDGER="$c/assets/scripts/gc-deacon-ledger.sh"; break; }
done
"$LEDGER" append cleanup "killed zombie dolt PIDs <pids> on <db>" -
"$LEDGER" append recovery "restarted the Dolt server after <diagnostic finding>" -
```
An all-`OK` scan appends nothing — it is the on-track reading this ledger
deliberately leaves out.

**Exit criteria:** health check run, every database carrying a verdict,
findings escalated, hand actions ledgered."""

[[steps]]
id = "system-health"
title = "Run gc doctor sweep"
needs = ["dolt-health"]
description = """
**Config: doctor_interval = {{doctor_interval}}**

A full sweep outlasts the harness's 600s limit on one call, so it never runs in
the foreground: `doctor-sweep.sh` starts it detached and collects it on a later
cycle, one sweep window per `doctor_interval`, with one capped retry for a run
that ended failed or exceeded. Run the script once per cycle and let it decide
whether to start a sweep, wait for one, or collect it:
```bash
# >>> doctor-sweep-run
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/doctor-sweep.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
# Capture the rc: under a strict shell an uncaptured non-zero ends the block
# before the report is echoed.
RC=0
SWEEP=$(GC_DOCTOR_SWEEP_INTERVAL='{{doctor_interval}}' "$SCRIPTS/doctor-sweep.sh") || RC=$?
echo "$SWEEP"
STATE=$(printf '%s' "$SWEEP" | sed -n 's/^state=//p')
PAYLOAD=$(printf '%s' "$SWEEP" | sed -n 's/^payload=//p')
# <<< doctor-sweep-run
```
`STATE` is the first line's value, and it says what this cycle owes:

- `idle`, `started`, `running`, `deferred` or `throttled`: there is no payload
  to read. Say which one and close the step. A `started` sweep is collected a
  cycle or two later. A `deferred` one stood down because the pre-spawn `gc
  dolt health` gate found the data plane degraded (dolt-health already filed
  that). A `throttled` one met the inter-sweep cadence floor, the
  one-per-interval ceiling working, not a fault. File nothing for these.
- `stale`: there is no payload to read either. A sweep finished more than one
  `doctor_interval` before this cycle reached it, so the runner discarded it as
  an old observation and the next cycle starts a fresh one (`finished_at=`,
  `age=`). Say so, file nothing for it, and close the step.
- `complete`: the payload is the file named by `payload=`. Filter it below.
- `failed`, `exceeded` or `blocked`: a FAILED scan. File it with the recipe
  below, `--key doctor-sweep-failed` and the whole `state=` block as the
  message. `exceeded` names the check its bound stopped; a vanished `failed`
  sweep carries `cause=` and `launch=`/`unit=`; `blocked` carries `reason=`,
  the wall the next cycle meets too. There is no payload to filter.
- Any other state, or a non-zero `RC`: a FAILED scan too, filed the same way:
  a state this table does not name is a sweep going dark.

A FAILED scan carries no payload to filter, so it files one finding under the
shared key and the step is done:
```bash
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/patrol-finding.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
# GC_RIG is bound because the deacon is city-scoped: it selects the store the
# finding bead lands in, and it rig-qualifies the proactive pool whose worker
# reacts to it.
ESC_RIG="${GC_RIG:-gc-toolkit}"
GC_RIG="$ESC_RIG" "$SCRIPTS/patrol-finding.sh" --scope deacon-findings --key doctor-sweep-failed --title "doctor sweep did not complete: state=${STATE:-unknown} rc=$RC" --message "$SWEEP"
```
One key spans every failed cycle, so a sweep that keeps failing updates one
bead instead of filing another.

A check that hit its own `--check-timeout` arrives as a non-`ok` status with
`timed_out: true`, so the filter below selects it and `--check` files it on the
check's one bead. `abandoned=` and `abandoned_checks=` are a summary for the
report, never a second finding under another key; say the missing verdicts
are not passes.

The actionable subset:
```bash
jq -c '.results[] | select(.status != "ok")' "$PAYLOAD"
```
For each finding: act directly on the simple ones (stale locks, temp
cleanup, `gc doctor --fix`-able); file the rest. `--check` derives the
situation key from the check's own name, so every recurrence lands on one
bead:
```bash
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/patrol-finding.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
FINDING=$(jq -c '.results[] | select(.name=="<check>")' "$PAYLOAD")
CHECK=$(printf '%s' "$FINDING" | jq -r '.name')
VERDICT=$(printf '%s' "$FINDING" | jq -r '.message')
# GC_RIG is bound because the deacon is city-scoped: it selects the store the
# finding bead lands in, and it rig-qualifies the proactive pool whose worker
# reacts to it.
ESC_RIG="${GC_RIG:-gc-toolkit}"
GC_RIG="$ESC_RIG" "$SCRIPTS/patrol-finding.sh" --scope deacon-findings --check "$CHECK" --title "doctor $CHECK: $VERDICT" --message "$FINDING"
```
Pass the finding's `.name` verbatim through `--check`, which derives the key
`doctor-<check>` so every rendering of one check dedups to one bead. Do not
hand-search for an existing bead first: the key decides that, and a related
bead elsewhere is the first reaction's judgment. Report the bead id the writer
names, and whether it filed or counted an occurrence.

A finding you FIXED yourself leaves no visit behind it, so it leaves no
record unless you write one:
```bash
LEDGER=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/gc-deacon-ledger.sh" ] && { LEDGER="$c/assets/scripts/gc-deacon-ledger.sh"; break; }
done
"$LEDGER" append cleanup "<check-name>: <what you cleared, and how>" -
```
A sweep whose findings were all already tracked, and a `state=complete` with
nothing but `ok`, append nothing. So does a sweep that only `started` — the
ledger records what happened, not what is pending.

Also run every cycle, whatever the sweep is doing:
- Stuck sessions: read `$SCRIPTS/quota-park-nudge.sh --status`
  (closed-field surface) instead of session panes. `quota_park=yes` is a
  healthy park — never a warrant. A session it reports `escalated=1`
  (nudging exhausted), or a live infrastructure session whose patrol wisp
  is stale past the freshness you already treat as wedged, is
  live-but-wedged: file ONE warrant for the dog pool via `file-warrant.sh` —
  never kill directly. It resolves the session to the id dance-probe.sh
  requires, dedups on it, and refuses if nothing live matches:
  ```bash
  # >>> warrant-file
  SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
    [ -x "$c/assets/scripts/file-warrant.sh" ] && [ -x "$c/assets/scripts/gc-deacon-ledger.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
  done
  # exit 0 filed a new warrant (its id on stdout), 3 one already stood (ledgered
  # when it opened), 1 refused: no live session. Ledger only the filing.
  FILED=$("$SCRIPTS/file-warrant.sh" --owner "<session>" --role "<rig>/<role>" --reason "<what is stale and for how long>" --requester deacon --dog "{{binding_prefix}}dog")
  case $? in
    0) "$SCRIPTS/gc-deacon-ledger.sh" append warrant "<session> filed for the dog: <what is stale and for how long>" "${FILED:+bead:$FILED}" ;;
    3) : ;;  # a warrant already stood; it was ledgered when it opened
    *) echo "file-warrant.sh refused to file for <session> (it resolved to no live session id); escalate this wedged session instead." >&2 ;;
  esac
  # <<< warrant-file
  ```
  The dog pool runs mol-dog-shutdown-dance (three bounded interrogations,
  pardon-or-execute, DOG_DONE notice back); its probe re-checks the
  quota-park surface, so a race with a fresh park still cannot execute a
  parked session. The outcome comes back as a `DOG_DONE:` notice, which
  check-inbox ledgers next cycle.

Close this step after the script has been run and its state acted on."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["system-health"]
description = """
**Config: event_timeout = {{event_timeout}}**

**1. Quick inbox hygiene:** `gc mail inbox`; handle urgent, archive rest.

**2. Wait out the cycle BEFORE pouring.** The pour below arms `exit 1` on a
failed pour or assign, and the deacon wakes fresh, so an exit here respawns a
deacon that re-runs the doctor sweep with no pause. Waiting first means a
degraded data plane that fails the pour cannot hot-loop that respawn: every
cycle pays one inter-cycle wait, whether the pour then succeeds or fails. A
bounded clock-poll in ONE tool call (the harness blocks a standalone sleep, and
caps one call at 600s):
```bash
end=$(( $(date +%s) + {{event_timeout}} ))
until [ "$(date +%s)" -ge "$end" ]; do sleep 5; done
```

**3. Pour the next iteration, assign it, then burn this one.** GUARD the assign
(a poured but unassigned wisp reaches no hook and drops the loop), and forward
every declared var, so a value chosen at the startup pour is not silently
replaced by the formula default from the next cycle on. Burn the current wisp
in this block, right after the assign, so the burn is atomic with the pour: no
turn boundary falls between them, and a context recycle (the
`overlays/cycle-recycle` Stop hook) can land only before the pour or after the
burn, never on a half-done cycle whose current wisp the next boot's reconcile
would burn as a stale orphan. `GC_BEAD_ID` is empty on a fresh session, so the
fallback that resolves the current wisp has to work: a wisp is an ephemeral
molecule, which means `--type=molecule --include-infra` plus the title filter,
and any narrower query reads empty.
```bash
# >>> patrol-wisp-pour
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --include-infra --limit=0 --json | jq -r '[.[] | select(.title == "mol-deacon-patrol")][0].id // empty')
fi
NEXT=$(gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}' --var event_timeout='{{event_timeout}}' --var doctor_interval='{{doctor_interval}}' --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next deacon wisp; NOT burning this one."
  exit 1
fi
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign poured wisp $NEXT; rolling it back and NOT burning this one."
  gc bd mol burn "$NEXT" --force || echo "Rollback burn of $NEXT failed; startup reconcile will collect it."
  exit 1
fi
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current wisp; not burning."
  exit 1
fi
# <<< patrol-wisp-pour
```

The new wisp is ready; run `gc hook` and start the next cycle."""
