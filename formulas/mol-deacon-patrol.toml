description = """
Deacon patrol loop — city infrastructure health. Poured as a root-only wisp
on startup (the agent prompt's startup reconcile adopts before it pours):

  gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}' --var event_timeout='{{event_timeout}}'
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: mail, orphan-process cleanup, Dolt health,
doctor sweep, pour the next iteration. Steps are not materialized; read
each description as you reach it, and never exit the wisp from an
intermediate step. The deacon is the controller's judgment layer — it never
starts/stops agents, never recovers per-rig beads (witness), never writes
code. Escalations go through assets/scripts/escalate.sh — one open visit
per situation key.

The marked backup-manifest-check block is extracted and executed by
assets/scripts/dolt-backup-manifest-check.test.sh; keep the markers and
keep it backslash-free."""
formula = "mol-deacon-patrol"

[vars]
[vars.binding_prefix]
description = "Agent identity prefix, including trailing dot when bound."
default = ""

[vars.event_timeout]
description = "Seconds to wait before the next cycle. Spent as a bounded until-loop (the harness blocks a standalone sleep). Ceiling 600: the harness caps one call at 600s."
default = "600"

[[steps]]
id = "check-inbox"
title = "Check mail"
description = """
```bash
gc mail inbox
```
Handle what you can directly; anything needing a human becomes a visit via
escalate.sh. A `DOG_DONE:` notice is a completed shutdown dance on a
warrant — note the outcome (the closed warrant carries the evidence) and
archive. Archive processed messages — inbox near-empty after this step.
Close it and proceed."""

[[steps]]
id = "orphan-process-cleanup"
title = "Kill orphaned claude subagent processes"
needs = ["check-inbox"]
description = """
Subagent processes sometimes outlive their parents and accumulate memory.
Detect: `ps aux | grep -E 'claude|node' | grep '?'` (TTY = "?"). Judgment
required — not every TTY=? process is orphaned; look for large RSS
(>500MB), runtimes far beyond any live session, or multiples of the same
command. Kill confirmed orphans with `kill <pid>`. Close this step even
when nothing was found."""

[[steps]]
id = "dolt-health"
title = "Run Dolt data-plane health check"
needs = ["orphan-process-cleanup"]
description = """
**1. Run the check once and keep the payload** (re-probing costs ~5s per
database against the very data plane being watched):
```bash
HEALTH_JSON=$(gc dolt health --json)
printf '%s' "$HEALTH_JSON" | jq .
```
Key decisions off `server.reachable`, never `server.running` — a process
can hold the port with wedged goroutines. Thresholds: unreachable server =
CRITICAL; `latency_ms > 5000` = overloaded; `databases[].commits > 50000` =
compactor stalled; zombie PIDs = kill them; `orphans[]` = ADVISORY only
(verify with the dry-run `gc dolt-cleanup --json` before believing it, and
never run a destructive `--force` from this step).

**2. Verify backups by manifest mtime — never by `backups.dolt_stale`.**
Absent backup data renders as `dolt_stale=false`, so that field reads
false-clean through a TOTAL outage. The contract, carried by the block
below: a backup is restorable only up to its committed manifest (Dolt
writes chunks first, manifest LAST, so a healthy dir's newest file IS the
manifest and an equal-second tie resolves TO it); the scan is driven by the
live `databases[].name` list, never a walk of the backup dirs (a database
with no dir at all is invisible to a walk); missing/empty roots are
FLAG-ROOT findings naming every affected database; an in-flight sync gets a
bounded RECHECK grace that a stale manifest bypasses; and an unreadable
directory is UNPROVEN, never clean.

```bash
# >>> backup-manifest-check
BACKUP_ROOT="${GC_CITY_PATH:-$GC_CITY}/.dolt-backup"
# Expected databases come from the Step 1 health report: reuse $HEALTH_JSON
# if you still have it, otherwise probe again. Lazy by design — set
# EXPECTED_DBS to run this snippet against a fixture (the test does) and
# neither the probe nor jq is invoked.
: "${EXPECTED_DBS:=$(printf '%s' "${HEALTH_JSON:-$(gc dolt health --json)}" | jq -r '.databases[].name')}"
# In-flight grace: mid-sync the newest file IS a chunk, because the manifest
# is committed last. Only call that a failure once the writes have stopped
# advancing for GRACE_SEC — or once the manifest is already stale, which no
# healthy in-flight run can explain.
GRACE_SEC="${GRACE_SEC:-900}"
STALE_H="${STALE_H:-12}"
NOW=$(date +%s)
# Portable mtime: GNU (-c), BSD/macOS (-f), 0 when the file is absent.
mtime_of() { stat -c %Y "$1" 2>/dev/null || stat -f %m "$1" 2>/dev/null || echo 0; }
# Split the list ONCE, with awk rather than with shell word-splitting, and
# derive both forms from it: one name per line for the loop below, and the
# space-joined one-liner a root-level finding names every affected database on.
# (zsh does not word-split unquoted expansions, so a shell split runs once on
# the whole list joined into a single token.)
DB_LIST=$(mktemp)
printf '%s' "$EXPECTED_DBS" | awk '{ for (i = 1; i <= NF; i++) print $i }' > "$DB_LIST"
DB_NAMES=$(awk '{ if (s == "") s = $0; else s = s " " $0 } END { print s }' "$DB_LIST")

if [ -z "$EXPECTED_DBS" ]; then
    echo "FLAG-ROOT: health report listed no databases - cannot verify any backup"
elif [ ! -d "$BACKUP_ROOT" ]; then
    echo "FLAG-ROOT: no backup root at $BACKUP_ROOT - NO restorable backup for: $DB_NAMES"
elif [ -z "$(ls -A "$BACKUP_ROOT" 2>/dev/null)" ]; then
    echo "FLAG-ROOT: backup root $BACKUP_ROOT is empty - NO restorable backup for: $DB_NAMES"
else
    while IFS= read -r name; do
        db="$BACKUP_ROOT/$name"
        if [ ! -d "$db" ]; then
            echo "FLAG $name: no backup directory at $db - never backed up"
            continue
        fi
        m_t=$(mtime_of "$db/manifest")
        # Seed the scan WITH the manifest so an mtime tie resolves to it: stat
        # reads whole seconds and Dolt commits the manifest LAST, so a tie is a
        # fast healthy sync. Only a chunk STRICTLY newer than the manifest
        # displaces it — the torn-backup signature.
        newest="manifest"; newest_t=$m_t
        # ...but a seed is only safe once the directory has actually been READ:
        # capture the scan and its exit status, because an enumeration that
        # fails (or lists nothing while the manifest is readable) would let the
        # seed carry a fresh manifest to OK and hide a newer chunk behind an
        # unreadable directory. Unread is UNPROVEN, never clean. `||` marks the
        # expected failure as handled so a strict-shell paste survives.
        scan_rc=0
        scan_out=$(find "$db" -type f 2>/dev/null) || scan_rc=$?
        scan_fail=""
        if [ "$scan_rc" -ne 0 ]; then
            scan_why=$(find "$db" -type f 2>&1 >/dev/null | sed -n 1p || true)
            scan_fail="find exited $scan_rc${scan_why:+: $scan_why}"
        elif [ "$m_t" -gt 0 ] && [ -z "$scan_out" ]; then
            scan_fail="find listed no files though $db/manifest is readable"
        fi
        while IFS= read -r f; do
            [ -n "$f" ] || continue
            t=$(mtime_of "$f")
            if [ "$t" -gt "$newest_t" ]; then newest_t="$t"; newest="${f##*/}"; fi
        done <<< "$scan_out"
        since=$(( NOW - newest_t ))
        age_h=$(( (NOW - m_t) / 3600 ))
        if [ -n "$scan_fail" ]; then
            if [ "$m_t" -eq 0 ]; then
                echo "FLAG $name: backup directory scan failed ($scan_fail) and there is no manifest - nothing verifiably restorable"
            elif [ "$age_h" -gt "$STALE_H" ]; then
                echo "FLAG $name: backup directory scan failed ($scan_fail) and the manifest is ${age_h}h old (>${STALE_H}h = 2x backup cadence)"
            else
                echo "RECHECK $name: backup directory scan failed ($scan_fail) - cannot rule out a file newer than the ${age_h}h-old manifest"
            fi
        elif [ "$m_t" -eq 0 ]; then
            if [ "$newest_t" -gt 0 ] && [ "$since" -le "$GRACE_SEC" ]; then
                echo "RECHECK $name: no manifest yet, '$newest' written ${since}s ago - first commit may be in flight"
            else
                echo "FLAG $name: no manifest - nothing restorable"
            fi
        elif [ "$newest" != "manifest" ]; then
            if [ "$since" -le "$GRACE_SEC" ] && [ "$age_h" -le "$STALE_H" ]; then
                echo "RECHECK $name: newest file is '$newest' written ${since}s ago, manifest ${age_h}h old - sync may be in flight"
            else
                echo "FLAG $name: newest file is '$newest', not the manifest - uploaded but never committed; not restorable past ${age_h}h ago"
            fi
        elif [ "$age_h" -gt "$STALE_H" ]; then
            echo "FLAG $name: manifest is ${age_h}h old (>${STALE_H}h = 2x backup cadence)"
        else
            echo "OK $name: manifest is newest, ${age_h}h old"
        fi
    done < "$DB_LIST"
    for d in "$BACKUP_ROOT"/*/; do
        [ -d "$d" ] || continue
        extra="${d%/}"; extra="${extra##*/}"
        case " $DB_NAMES " in
            *" $extra "*) ;;
            *) echo "INFO $extra: backup dir with no live database (advisory)" ;;
        esac
    done
fi
# <<< backup-manifest-check
```

"Healthy" requires an explicit `OK` for EVERY database in `databases[]` —
no FLAG, no FLAG-ROOT, no outstanding RECHECK (re-run the block; a RECHECK
whose cause is an unreadable directory never clears by waiting — fix the
read or treat as FLAG).

**3. React.** Escalate each finding through the one writer, carrying the
verdict line VERBATIM (each is a complete one-line reason; do not
re-template it):
```bash
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/escalate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
"$SCRIPTS/escalate.sh" --subject <this wisp or the tracking bead> --key dolt-backup-<db> --message "<the Step 2 FLAG line, verbatim>"
# server unreachable: --key dolt-server-unreachable (CRITICAL)
# FLAG-ROOT:          --key dolt-backup-root (names every affected database)
# commit bloat:       --key dolt-commit-bloat-<db> (commits > 50000; compaction
#                     is a manual operator action until an actuator exists)
# orphan databases:   --key dolt-orphan-dbs (advisory orphans[] non-empty;
#                     removal is a manual operator action — never --force here)
```
Before restarting anything, collect non-fatal diagnostics first
(`SHOW FULL PROCESSLIST`, `gc dolt logs`, bounded `gc dolt health --json`,
`gc dolt status`) — a blind restart destroys the evidence.

**Exit criteria:** health check run, every database carrying a verdict,
findings escalated."""

[[steps]]
id = "system-health"
title = "Run gc doctor sweep"
needs = ["dolt-health"]
description = """
Run once, bounded, and reuse the payload (`gc doctor` exits 1 when findings
exist — that is normal):
```bash
DOCTOR_JSON=$(timeout 300 gc doctor --json); DOCTOR_RC=$?
```
Schema guard (one line, fail loud — a missing `.results` key means the
contract drifted and the filter below is blind, which must never read as
clean):
```bash
printf '%s' "$DOCTOR_JSON" | jq -e 'has("results")' >/dev/null 2>&1 || { echo "doctor payload invalid or schema drifted (rc=$DOCTOR_RC) — NOT reporting clean"; }
```
An rc other than 0/1, or a payload without `.results`, is a FAILED scan:
escalate it (`--key doctor-sweep-failed`) and do not run the filter.

The actionable subset:
```bash
printf '%s' "$DOCTOR_JSON" | jq -c '.results[] | select(.status != "ok")'
```
For each finding: act directly on the simple ones (stale locks, temp
cleanup, `gc doctor --fix`-able); dedup the rest against existing beads
city-wide (`bd search` per rig store — your rig store is not the city, and
a name miss is not proof of absence: search the finding's distinctive nouns
too) — an OPEN match means tracked, note the id and move on. Escalate only
the untracked remainder, one situation key per finding so repeats dedup:
```bash
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/escalate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
FINDING=$(printf '%s' "$DOCTOR_JSON" | jq -c '.results[] | select(.name=="<check>")')
"$SCRIPTS/escalate.sh" --subject <this wisp or the tracking bead> --key "doctor-<check-name>" --message "$FINDING"
```
State what the dedup found — bead ids on a match, the stores and terms
searched on a miss.

Two adjacent duties, same cadence:
- Closing a bead that names a doctor finding? Close it through
  `$SCRIPTS/doctor-finding-gate.sh` — it re-runs the check first, so the
  ledger cannot say "fixed" while the check still fires.
- Stuck sessions: read `$SCRIPTS/quota-park-nudge.sh --status`
  (closed-field surface) instead of session panes. `quota_park=yes` is a
  healthy park — never a warrant. A session it reports `escalated=1`
  (nudging exhausted), or a live infrastructure session whose patrol wisp
  is stale past the freshness you already treat as wedged, is
  live-but-wedged: file ONE warrant for the dog pool — never kill directly,
  and skip if an open warrant already names the target:
  ```bash
  OPEN_WARRANT=$(gc bd list --status=open,in_progress --metadata-field "warrant.target=<session>" --limit=1 --json | jq -r 'if type == "array" then (.[0].id // empty) else empty end')
  if [ -z "$OPEN_WARRANT" ]; then
    gc bd create --type=task --title="Stuck: <rig>/<role>" --metadata '{"warrant.target":"<session>","warrant.reason":"<what is stale and for how long>","warrant.requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}' --label=warrant
  fi
  ```
  The dog pool runs mol-dog-shutdown-dance (three bounded interrogations,
  pardon-or-execute, DOG_DONE notice back); its probe re-checks the
  quota-park surface, so a race with a fresh park still cannot execute a
  parked session.

Close this step after the sweep."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["system-health"]
description = """
**Config: event_timeout = {{event_timeout}}**

**1. Quick inbox hygiene:** `gc mail inbox`; handle urgent, archive rest.

**2. Pour next iteration BEFORE burning — and GUARD the assign** (a poured
but unassigned wisp reaches no hook and drops the loop; forward every
declared var — a --root-only pour materializes no defaults):
```bash
NEXT=$(gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}' --var event_timeout='{{event_timeout}}' --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next deacon wisp; NOT burning this one."
  exit 1
fi
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign poured wisp $NEXT; rolling it back and NOT burning this one."
  gc bd mol burn "$NEXT" --force || echo "Rollback burn of $NEXT failed; startup reconcile will collect it."
  exit 1
fi
```

**3. Wait before the next cycle** — a bounded clock-poll in ONE tool call
(the harness blocks a standalone sleep, and caps one call at 600s):
```bash
end=$(( $(date +%s) + {{event_timeout}} ))
until [ "$(date +%s)" -ge "$end" ]; do sleep 5; done
```

**4. Burn this wisp — only if step 2 succeeded:**
```bash
gc bd mol burn <this-wisp-id> --force
```

The new wisp is ready; run `gc hook` and start the next cycle."""
