description = """
mol-triage-recurrence — wakes standing triage conversations when they
have something NEW to talk about.

What it does, plainly: the operator keeps standing "triage subjects" —
beads marked task_kind=triage-subject, each defining a pool of beads it
curates (examples: "triage: held ideas", "triage: all P1s of this
rig"). This formula runs on a daily order and, for each triage subject,
files ONE visit (a routed conversation sitting) IF the subject's
candidate set has CHANGED since the last visit this step filed AND no
visit for it is already live — open OR held (a held visit is
`in_progress`). An unchanged set, a scope that was already empty, or a
visit already live → it files nothing for that subject. A scope that
just EMPTIED is a change like any other: it files one last visit naming
what left, then goes quiet. The result: each triage conversation
appears on the board exactly when it has new material, and never
stacks.

Why a set-delta and not just "the scope is non-empty": the non-empty
test skips STACKING but not RECURRENCE. A **park-shaped** subject — one
whose scope matches exactly the beads parking puts into it, e.g.
`label:parked-debt` — never drains, so a non-empty test re-asks the same
already-answered question every cooldown forever. Three of them fired at
once on 2026-08-10, each on a set unchanged from the day before, each
costing a sitting. Only "the set moved" tells a park worth revisiting
from one that is simply still parked.

Deliberate gap: a purely STRATEGIC change — the line that parked work
belongs to becomes live again, so everything in scope turns ripe at once
— moves no ids and so files nothing. That trigger is the operator's, by
hand via mol-visit; a subject that wants it says so in its own prose. Do
not try to infer it here.

The triage itself (enumerate candidates, rank, frame promote/park/kill)
is NOT this formula's job — the converse session does that at visit
time. This formula only answers "is a visit warranted right now?"

Contract: graph.v2, so the compiled workflow root is Ready-visible and
a scale-from-zero pool wakes for it. The step closes its own step bead
with gc.outcome.

Spec: specs/2026-08-fresh-start/liveness-and-triage-spec.md §3.
"""
formula = "mol-triage-recurrence"

[requires]
formula_compiler = ">=2.0.0"

[[steps]]
id = "evaluate-and-file"
title = "Per triage subject: skip if a visit is live or the scope set is unchanged; file a visit on a delta"
description = """
**1. List the triage subjects and the live visits.** Fail-safe: an
unreadable listing means close this step with `gc.outcome=fail` and
file nothing — never evaluate on partial data. On that path stamp
NOTHING: recording a candidate set you could not read makes the next
run's delta a lie, and the silence it buys is permanent.

```bash
OPEN=$(mktemp); LIVE=$(mktemp)
gc bd list --status=open --json --limit=0 > "$OPEN"
gc bd list --status=open,in_progress --json --limit=0 > "$LIVE"
if ! jq -e 'type=="array"' "$OPEN" >/dev/null || ! jq -e 'type=="array"' "$LIVE" >/dev/null; then
  echo "FAIL-SAFE: listing unreadable — recurrence aborts, nothing filed"
  gc bd update <your-claimed-step-bead-id> --set-metadata gc.outcome=fail --status=closed
# use the step bead id from YOUR claim — no env var carries it
  exit 0
fi
SUBJECTS=$(jq '[.[] | select((.metadata.task_kind // "") == "triage-subject")
  | {id, title,
     scope: (.metadata["triage.scope"] // ""),
     last_seen: (if ((.metadata // {}) | has("triage.last_seen"))
                 then (.metadata["triage.last_seen"] // "") else null end)}]' "$OPEN")
CONVGROUPS=$(jq '[.[] | select((.metadata.task_kind // "") == "visit") | ((.metadata["gc.continuation_group"] // ""), (.dependencies[]? | select((.type // "") == "tracks") | (.depends_on_id // ""))) | select(. != "")]' "$LIVE")
# A visit names its subject TWICE — the gc.continuation_group stamp and the
# tracks edge the gate-visit block adds in the same breath — and only the edge
# has proved reliable: on su-ab9je (shutupandlisten, 2026-08-20, bead tk-d6ddn)
# the stamp landed EMPTY while the title, the sibling stamps in the same update,
# and the tracks edge all carried the subject. Root cause never established, so
# the guard reads BOTH and takes the union rather than trusting either alone —
# a guard that misses a HELD sitting stacks a second visit on its subject.
# gc bd list renders the edge as .type + .depends_on_id (gc bd show renders the
# same edge as .dependency_type + .id); this is the LIST shape.
# The select(. != "") is not tidying: an empty stamp would otherwise enter the
# set as "", and a lookup for an empty subject id would match it and report a
# live visit that does not exist.
#
# $LIVE, not $OPEN, for the visit set: a visit being held is
# in_progress, not open — and a sitting already live is exactly the
# case the skip below exists to protect.
# `last_seen` is a TRI-STATE and must stay one: null when the key is
# ABSENT ("never evaluated" — always file), "" when it is present and
# empty ("the last evaluation saw an empty scope"), otherwise the
# recorded set. jq keeps absent and empty apart (an empty string is
# truthy there); a `// ""` coalesce would flatten them and silence the
# first visit of every subject that existed before this landed.
```

**2. Per subject, in order:**

- **Skip if a visit is live** — the subject's id appears in
  `$CONVGROUPS` (open AND held visits, and named by EITHER the visit's
  `gc.continuation_group` stamp or its `tracks` edge, per the listing
  above). Log
  `skipped-live-visit`. Never stack a second visit on one subject.
  **Stamp nothing on this path.** A bead that enters the scope while a
  sitting is held must still surface on the first run after that visit
  closes; stamping here would fold it into the already-seen set and
  swallow it silently.
- **Evaluate the scope with the defined filter schema.** A triage
  subject's machine-readable scope is its `triage.scope` metadata:
  space-separated tokens, each one of exactly these forms —

  | token | meaning (applied to the open-bead listing) |
  |---|---|
  | `p<=N` | `(.priority // 99) <= N` |
  | `label:X` | `(.labels // [])` contains `X` |
  | `kind:X` | `(.metadata.task_kind // "") == "X"` |
  | `unrouted` | `(.metadata["gc.routed_to"] // "") == ""` and `(.assignee // "") == ""` |

  The `// <default>` coalescing in every predicate is load-bearing, not
  style: on a real store `.assignee` is JSON `null` (never `""`) and
  most beads carry no `gc.routed_to` key at all, so a strict `== ""`
  comparison matches zero beads. Apply the predicates exactly as
  written.

  Candidates = open beads matching ALL tokens, excluding visits and
  triage subjects themselves. Apply the tokens as jq filters over
  `$OPEN` — never paste scope text into a shell command. A token not in
  this table is ignored and logged (`unknown-scope-token`); a subject
  with NO recognized tokens is logged `skipped-no-machine-scope` and
  never guessed at — its scope prose is for the sitting, not for you.
  One reserved value: `unnamed-waits` marks the liveness sweep's
  standing subject, whose visits mol-liveness-sweep files itself — log
  `skipped-owned-by-sweep` for that subject and move on; it is
  expected, not unknown.
- **Serialize the candidate set and read back the last one filed.**
  The set is the sorted bead ids, comma-joined — the same shape this
  step stamps, so the two are comparable as plain strings.

```bash
# $SUBJECT = this subject's id; $MATCHED = the jq array of its candidates
NOW=$(printf '%s' "$MATCHED" | jq -r '[.[].id] | sort | join(",")')
N=$(printf '%s' "$MATCHED" | jq 'length')
# "<absent>" carries jq's null through to the shell: a comma-joined id
# list can never contain "<", so the tri-state survives the round trip
# and "never evaluated" stays distinguishable from "saw an empty scope".
WAS=$(printf '%s' "$SUBJECTS" | jq -r --arg s "$SUBJECT" \
  '.[] | select(.id == $s) | (.last_seen // "<absent>")')
```

- **Zero candidates AND the recorded set was empty or absent →
  `skipped-no-candidates`,** file nothing: nothing entered and nothing
  left, so there is nothing for a sitting to be about. Stamp the EMPTY
  set when the key was ABSENT (stamp `""`, never leave the key absent):
  the day a bead enters a scope that was empty, `""` → `"tk-xxxxx"`
  reads as a change, whereas an absent key would leave "never
  evaluated" standing forever. When `""` is already recorded, stamp
  nothing — it is already this set.
- **Zero candidates but the recorded set was NON-EMPTY → file** (step
  3), with `$N` = 0 and a body that names what left; step 3's stamp
  then records the empty set. Emptying is a delta, and the acceptance
  is symmetric — the day a bead enters *or leaves* a scope, exactly one
  visit names it. Skipping here would swallow the leave PERMANENTLY:
  the stamp would record `""`, and the next run would compare empty
  against empty, call it unchanged, and no sitting would ever be filed
  for the beads that left.
- **Unchanged set → `skipped-unchanged`,** file nothing and stamp
  nothing — the recorded set already IS this set. This is the park-shaped
  case: same beads, same question, already answered.
- **Any other change → file** (step 3). That includes `triage.last_seen`
  absent with candidates present: absent means never evaluated and MUST
  file, so every subject that existed before this landed keeps today's
  behaviour on its first run after it.

```bash
if [ -z "$NOW" ] && { [ "$WAS" = "" ] || [ "$WAS" = "<absent>" ]; }; then
  echo "$SUBJECT: skipped-no-candidates"
  # Idempotent: re-writing the same empty set every cooldown would be a
  # Dolt commit per subject per day for no state change. Only the ABSENT
  # key is stamped here — an already-recorded "" is this same set.
  [ "$WAS" = "" ] || gc bd update "$SUBJECT" --set-metadata "triage.last_seen="
elif [ "$NOW" = "$WAS" ]; then
  echo "$SUBJECT: skipped-unchanged ($N in scope, none entered or left)"
else
  : # Changed — INCLUDING the emptied case ($NOW empty, $WAS a non-empty
    # set). File the visit (step 3); the stamp there records $NOW, empty
    # or not, and only after the visit exists.
fi
```

**3. File the visit for each subject whose set CHANGED** — including one
that just emptied, where `$N` is `0` and the body names only what left
(`$SUBJECT` = that subject's id). Build the DELTA first and put it in
the `-d` body: which ids entered and which left since
`triage.last_seen` is what the sitting is actually about — a bare count
re-states what the subject already knows.

```bash
DELTA=$(jq -rn --arg now "$NOW" --arg was "$WAS" '
  def ids: split(",") | map(select(. != ""));
  ($now | ids) as $n
  | (if $was == "<absent>" then null else ($was | ids) end) as $w
  | if $w == null then
      "First evaluation of this subject (no triage.last_seen recorded), so entered/left are not meaningful yet: all "
      + ($n | length | tostring) + " are simply what is in scope now."
    else
      "Entered since the last visit: "
      + (($n - $w) | if length == 0 then "(none)" else join(", ") end)
      + ". Left: "
      + (($w - $n) | if length == 0 then "(none)" else join(", ") end) + "."
    end')
```

```bash
# >>> gate-visit
POOL="${GC_RIG:+$GC_RIG/}gc-toolkit.converse"
VISIT=$(gc bd create -t task --title "visit: $SUBJECT — triage: $N candidates in scope" \
  -d "$DELTA Current set: <one line per candidate: id — title; (empty) when N is 0>" --json | jq -r '.id // .[0].id')
[ -n "$VISIT" ] && [ "$VISIT" != "null" ] \
  || { echo "gate-visit: bd create returned no id — stop and re-run this block; do not improvise another create form" >&2; exit 1; }
gc bd update "$VISIT" --set-metadata "gc.routed_to=$POOL" \
  --set-metadata "gc.continuation_group=$SUBJECT" \
  --set-metadata "task_kind=visit"
gc bd dep add "$VISIT" "$SUBJECT" --type=tracks
# tracks, not parent-child: a parent-child edge would transmit the
# subject's blocked state to the visit, making it unclaimable.
# tk-ax6y4: read the group stamp BACK, and repair it if it did not land.
# It lands PRESENT-BUT-EMPTY on a minority of these updates while every
# sibling stamp in the SAME call lands and the tracks edge below lands —
# 5 instances across 3 rigs, ~1 in 3 of the daily sweep visits. An empty
# group silently disables converse's group-scoped re-claim fence, which
# is how an operator mid-conversation gets an unrelated visit prepped in
# the same thread (tk-msfmu).
#
# REPAIR, NEVER REFUSE. This block files the ONLY visit for its scope, so
# refusing on a lost stamp would trade a quiet degradation for a louder
# outage of the same surface — ~1 pass in 3 filing no visit at all.
#
# The WARNING is the deliverable. The failure is per-invocation, not
# ambient — two visits two minutes apart have disagreed — so a logged
# instance, with what the read actually returned, is the only thing that
# will pin the cause.
GROUP_GOT=$(gc bd show "$VISIT" --json | tr -d '[:cntrl:]' | jq -r '.[0].metadata["gc.continuation_group"] // ""')
if [ "$GROUP_GOT" != "$SUBJECT" ]; then
  echo "gate-visit: WARNING gc.continuation_group on $VISIT read back as '$GROUP_GOT', expected '$SUBJECT' — repairing (tk-ax6y4)" >&2
  gc bd update "$VISIT" --set-metadata "gc.continuation_group=$SUBJECT"
  GROUP_GOT=$(gc bd show "$VISIT" --json | tr -d '[:cntrl:]' | jq -r '.[0].metadata["gc.continuation_group"] // ""')
  if [ "$GROUP_GOT" = "$SUBJECT" ]; then
    echo "gate-visit: the repair landed on $VISIT" >&2
  else
    echo "gate-visit: WARNING the repair did NOT land on $VISIT either — its tracks edge still carries the subject, and every live-visit guard reads the union (tk-d6ddn)" >&2
  fi
fi
# <<< gate-visit
```

Stamp the set you just filed on, and only AFTER the visit exists — the
guard above exits on a failed create, so an unfiled delta is never
recorded as seen and the next run re-files it:

```bash
gc bd update "$SUBJECT" --set-metadata "triage.last_seen=$NOW"
```

**4. Log the per-subject outcomes** (skipped-live-visit /
skipped-unchanged / skipped-no-candidates / skipped-no-machine-scope /
skipped-owned-by-sweep / filed + visit id), then close this step:

```bash
gc bd update <your-claimed-step-bead-id> --set-metadata gc.outcome=pass --status=closed
# use the step bead id from YOUR claim — no env var carries it
```
"""
