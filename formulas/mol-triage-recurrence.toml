description = """
mol-triage-recurrence — wakes standing triage conversations when they
have something to talk about.

What it does, plainly: the operator keeps standing "triage subjects" —
beads marked task_kind=triage-subject, each defining a pool of beads it
curates (examples: "triage: held ideas", "triage: all P1s of this
rig"). This formula runs on a daily order and, for each triage subject,
files ONE visit (a routed conversation sitting) IF the subject's scope
currently has candidates worth a sitting AND no visit for it is already
open. No candidates, or a visit already open → it files nothing for
that subject. The result: each triage conversation appears on the
board exactly when it has material, and never stacks.

The triage itself (enumerate candidates, rank, frame promote/park/kill)
is NOT this formula's job — the converse session does that at visit
time. This formula only answers "is a visit warranted right now?"

Contract: graph.v2, so the compiled workflow root is Ready-visible and
a scale-from-zero pool wakes for it. The step closes its own step bead
with gc.outcome.

Spec: specs/2026-08-fresh-start/liveness-and-triage-spec.md §3.
"""
formula = "mol-triage-recurrence"

[requires]
formula_compiler = ">=2.0.0"

[[steps]]
id = "evaluate-and-file"
title = "Per triage subject: skip if a visit is open; file a visit if the scope has candidates"
description = """
**1. List the triage subjects and the open visits.** Fail-safe: an
unreadable listing means close this step with `gc.outcome=fail` and
file nothing — never evaluate on partial data.

```bash
OPEN=$(mktemp)
gc bd list --status=open --json --limit=0 > "$OPEN"
if ! jq -e 'type=="array"' "$OPEN" >/dev/null; then
  echo "FAIL-SAFE: listing unreadable — recurrence aborts, nothing filed"
  [ -n "${GC_BEAD_ID:-}" ] && gc bd update "$GC_BEAD_ID" --set-metadata gc.outcome=fail --status=closed
  exit 0
fi
SUBJECTS=$(jq '[.[] | select((.metadata.task_kind // "") == "triage-subject") | {id, title, scope: (.metadata["triage.scope"] // "")}]' "$OPEN")
CONVGROUPS=$(jq '[.[] | select((.metadata.task_kind // "") == "visit") | (.metadata["gc.continuation_group"] // empty)]' "$OPEN")
```

**2. Per subject, in order:**

- **Skip if a visit is open** — the subject's id appears in
  `$CONVGROUPS`. Log `skipped-open-visit`. Never stack a second visit
  on one subject.
- **Evaluate the scope with the defined filter schema.** A triage
  subject's machine-readable scope is its `triage.scope` metadata:
  space-separated tokens, each one of exactly these forms —

  | token | meaning (applied to the open-bead listing) |
  |---|---|
  | `p<=N` | `.priority <= N` |
  | `label:X` | `.labels` contains `X` |
  | `kind:X` | `.metadata.task_kind == X` |
  | `unrouted` | `.metadata["gc.routed_to"] == ""` and `.assignee == ""` |

  Candidates = open beads matching ALL tokens, excluding visits and
  triage subjects themselves. Apply the tokens as jq filters over
  `$OPEN` — never paste scope text into a shell command. A token not in
  this table is ignored and logged (`unknown-scope-token`); a subject
  with NO recognized tokens is logged `skipped-no-machine-scope` and
  never guessed at — its scope prose is for the sitting, not for you.
- **File when there are candidates.** One or more candidates → file the
  visit below. Zero → log `skipped-no-candidates`, file nothing.

**3. File the visit for each subject with candidates** (`$SUBJECT` =
that subject's id; put the candidate count and ids in the `-d` body):

```bash
# >>> gate-visit
POOL="${GC_RIG:+$GC_RIG/}gc-toolkit.converse"
VISIT=$(gc bd create -t task --title "visit: $SUBJECT — triage: N candidates in scope" \
  -d "<candidate count and ids from the scope filter>" --json | jq -r '.id // .[0].id')
gc bd update "$VISIT" --set-metadata "gc.routed_to=$POOL" \
  --set-metadata "gc.continuation_group=$SUBJECT" \
  --set-metadata "task_kind=visit"
gc bd dep add "$VISIT" "$SUBJECT" --type=tracks
# tracks, not parent-child: a parent-child edge would transmit the
# subject's blocked state to the visit, making it unclaimable.
# <<< gate-visit
```

**4. Log the per-subject outcomes** (skipped-open-visit /
skipped-no-candidates / skipped-no-machine-scope / filed + visit id),
then close this step:

```bash
[ -n "${GC_BEAD_ID:-}" ] && gc bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed
```
"""
