description = """
Two-lane review quorum that ends in a single signoff. Two read-only reviewer
lanes read the same diff on DIFFERENT providers; a synthesis step combines
their findings, writes findings.md + findings.json, and makes THE ONE
signoff.sh verdict call. It is the gc-toolkit realization of the core
mol-review-quorum scaffold (lane fan-out + per-lane provider + the
review-quorum.lane.v1 durable schema), wired to this rig's signoff seam.

Attached at dispatch to a review bead exactly as mol-review is
(gc sling <pool> <review-bead> --on mol-review-quorum-signoff), and takes the
same values as vars: the review bead, the check, the anchor, the branch, the
base its diff starts from, the commit under review, the anchor's PR once one is
open, and why the review went out. One sling pours the two lanes and the
synthesis, so all three read the same commit.

The mol-review hard contract is preserved intact: ONE verdict per claim — the
synthesis makes the single signoff.sh call and the lanes never call it; the
verdict is posted as a COMMENT, never a GitHub approval (signoff.sh owns
that). The lanes add reviewer breadth on a second
provider; the check, the finding beads, and the rework child are the same
machinery mol-review hands to.

Lane routing is per-step: each lane carries gc.run_target / gc.provider, so
the two lanes land on two provider pools and each runs on its pool's default
model. The synthesis reads each lane's durable review-quorum.lane.v1 output
from the lane step bead's gc.output_json.

Each step closes its own bead through assets/scripts/step-close.sh, which
resolves by (gc.root_bead_id, gc.step_ref) — never a GC_*BEAD_ID env var. The
lanes run in separate pool sessions and each closes its own lane step; the
synthesis is the terminal step and closes the chain forward. No shell variable
survives from one block to the next, so each block names the values it uses.
"""
formula = "mol-review-quorum-signoff"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.review_bead]
description = "The review bead this run answers."
required = true

[vars.check]
description = "The check this review applies: the review bead's check_name, in lowercase."
required = true

[vars.anchor_bead]
description = "The work bead the verdict lands on, whose description says what the change is for."
required = true

[vars.review_branch]
description = "The branch under review."
required = true

[vars.review_base]
description = "The branch the change lands on, where its diff starts."
required = true

[vars.reviewed_oid]
description = "The commit under review: the branch's head when the review was dispatched, never moved or cleared."
required = true

[vars.review_pr_url]
description = "The anchor's open PR, empty before one opens."
default = ""

[vars.review_pr_number]
description = "That PR's number, empty with it."
default = ""

[vars.review_context]
description = "Why this review went out, such as a bring-current round for triage to rule on, else empty. Free text, so the steps name it in prose and never inside a shell block."
default = ""

[vars.binding_prefix]
description = "The binding the city imports the pack under, with its trailing dot: the prefix of the pack's skill names in a session's catalog. Sling adds it to every pour."
default = "gc-toolkit."

[vars.lane_one_id]
description = "Durable ID for reviewer lane one"
required = true

[vars.lane_one_provider]
description = "Provider identifier for reviewer lane one"
required = true

[vars.lane_one_target]
description = "Gas City pool target for reviewer lane one"
required = true

[vars.lane_two_id]
description = "Durable ID for reviewer lane two"
required = true

[vars.lane_two_provider]
description = "Provider identifier for reviewer lane two"
required = true

[vars.lane_two_target]
description = "Gas City pool target for reviewer lane two"
required = true

[vars.synthesis_target]
description = "Gas City pool target for the synthesis-and-signoff step"
required = true

[[steps]]
id = "review-lane-one"
title = "Review lane one"
description = """
You are one lane of a two-lane review quorum, running as durable lane
`{{lane_one_id}}` on provider `{{lane_one_provider}}` (your pool's default
model). Read the diff and record findings; the synthesis step
makes the verdict. Do NOT call signoff.sh, do NOT touch the anchor, do NOT
file finding or rework beads, and do NOT modify any file, branch, comment, or
bead other than writing your own durable output onto this step bead.

This review is `{{review_bead}}`, applying the `{{check}}` check to branch
`{{review_branch}}` at commit `{{reviewed_oid}}`, the branch's head when the
review was dispatched. Its diff starts where the branch left `{{review_base}}`.
The change is `{{anchor_bead}}`'s. Its PR is `{{review_pr_url}}`, empty before
one opens. Why the dispatch sent this review: {{review_context}}

**1. Check the record.** When the block names a missing key, review nothing:
write your lane output (part 4) with verdict `blocked`, a summary naming the
key and no findings, and close this step. The synthesis makes the refusal.
```bash
# >>> review-record-check
MISSING=""
for kv in "review_bead={{review_bead}}" "check={{check}}" "anchor_bead={{anchor_bead}}" "review_branch={{review_branch}}" "review_base={{review_base}}" "reviewed_oid={{reviewed_oid}}"; do
  [ -n "${kv#*=}" ] || MISSING="${MISSING:+$MISSING, }${kv%%=*}"
done
# <<< review-record-check
[ -z "$MISSING" ] || { echo "the review's record lacks $MISSING: this lane reviews nothing" >&2; exit 1; }
```

**2. Gather what the review reads.** The block prints the anchor, the PR's
page when one is open, the rig's guidance for this check, and the path of the
review's worktree at `{{reviewed_oid}}`, which the two lanes and the synthesis
share. Read the change there with git, read-only: its diff is
`git diff origin/{{review_base}}...HEAD`.
```bash
# >>> review-gather
REPO="${GC_RIG_ROOT:-}"
[ -n "$REPO" ] || REPO=$(gc rig list --json | jq -r --arg r "$GC_RIG" '.rigs[] | select(.name == $r) | .path')
[ -n "$REPO" ] || { echo "review: cannot resolve rig root (GC_RIG_ROOT unset, GC_RIG='$GC_RIG' matched no rig in the roster)" >&2; exit 1; }
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/review-workspace.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
: "${SCRIPTS:?review-workspace.sh not found in the pack}"
git -C "$REPO" fetch --quiet origin "{{review_base}}" "{{review_branch}}" || exit 1
git -C "$REPO" cat-file -e "{{reviewed_oid}}^{commit}" 2>/dev/null || git -C "$REPO" fetch --quiet --no-tags origin "{{reviewed_oid}}" || exit 1
WT=$("$SCRIPTS/review-workspace.sh" add --review-bead "{{review_bead}}" --oid "{{reviewed_oid}}" --repo "$REPO") || exit 1
cd "$WT" || exit 1
echo "== The change: {{anchor_bead}}"
gc bd show "{{anchor_bead}}" || exit 1
if [ -n "{{review_pr_url}}" ]; then
  echo "== The PR as published: {{review_pr_url}}"
  gh pr view "{{review_pr_url}}" --json title,body --jq '.title, "", .body' || exit 1
fi
echo "== The rig's guidance for {{check}}: docs/review-{{check}}.md at {{reviewed_oid}}, empty when it keeps none"
"$SCRIPTS/review-checks.sh" --extension "{{check}}" --at "{{reviewed_oid}}" || exit 1
echo "== The pack's scripts: $SCRIPTS"
echo "== The review's worktree: $WT"
# <<< review-gather
```

**3. Apply the check's method to the diff, read-only.**
<!-- >>> review-method-load -->
The check's method is the skill `{{binding_prefix}}review-{{check}}`. Load it
from your skill catalog and apply it, and no other review skill. A copy of a
skill in the review's worktree is the change under review, not your method.
When your catalog has no such skill:

- If the rig's check index declares `{{check}}`
  (`review-checks.sh --check {{check}} --at {{reviewed_oid}}` prints its row),
  judge the diff against the purpose the row states. Load
  `{{binding_prefix}}specialist-stance` and hold it. Say in your coverage line
  that the pack ships no method for this check.
- If no index declares it (the call exits 1 saying no index declares the
  check), approve, and pass `--needs-you` saying the check is declared
  nowhere, so the operator decides whether it stays in the anchor's
  `check_set`. A call that fails for any other reason, such as a commit it
  cannot read, is no answer, and nothing approves on it.

The rig's guidance for this check is the reviewed commit's
`docs/review-{{check}}.md`, which the gather block printed when the commit
carries one. It adds to the method and never replaces it. Most rigs keep
none.
<!-- <<< review-method-load -->

A lane reads what the method reads and judges as the method does, and runs
nothing the method runs, anywhere: not at the reviewed commit and not against
the pre-change code. The synthesis step runs all of that once for the quorum,
and a finding that depends on its result is the synthesis's to confirm. Where
the method passes a flag or approves with `--needs-you`, say so in your
summary for the synthesis. Record a mutation baseline with
`git status --porcelain=v1 -z` in the worktree before and after, and report any
delta you introduced (there should be none).

**4. Write your durable lane output** to this step bead's `gc.output_json` as
a `review-quorum.lane.v1` object, then close the step. The keys:
`lane_id`={{lane_one_id}}, `provider`={{lane_one_provider}},
`model` (the model you actually ran — self-report it), `verdict` (one of `pass`, `pass_with_findings`,
`fail`, `blocked`), `summary`, `findings_count`, `findings` (each with
`severity`, the grade the check's method gives the finding or `blocking` or
`note` where the method grades none, `title`, `body` stating what is wrong /
why it matters / the fix, `file`, and `line` or range), `evidence` (what you
read), `read_only_enforcement` (`baseline_command`, `after_command`,
`passed`), `mutations_delta` (empty if none).
```bash
SC=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/step-close.sh" ] && { SC="$c/assets/scripts/step-close.sh"; break; }
done
: "${SC:?step-close.sh not found in the pack}"
# LANE_BEAD is this lane step bead: the bead_id `gc hook --claim --json` handed
# you (a direct single-step claim, so the claimed id IS this lane step). Write
# your review-quorum.lane.v1 object into gc.output_json — metadata is stored as
# a string, so store it compact — then close by (root, step_ref) with the id as
# the hint. step-close.sh closes only; it does not write gc.output_json.
LANE_BEAD="<the bead_id from your gc hook --claim --json>"
gc bd update "$LANE_BEAD" --set-metadata "gc.output_json=$(jq -c . lane-{{lane_one_id}}.json)"
"$SC" --step mol-review-quorum-signoff.review-lane-one --convoy {{convoy_id}} --bead "$LANE_BEAD" --outcome pass
```

**Exit criteria:** whole diff read read-only, review-quorum.lane.v1 written to
this step's gc.output_json, this step bead closed. No verdict, no signoff.
"""
metadata = { "gc.run_target" = "{{lane_one_target}}", "gc.provider" = "{{lane_one_provider}}", "gc.review_quorum_lane" = "{{lane_one_id}}", "gc.output_json_schema" = "review-quorum.lane.v1" }

[[steps]]
id = "review-lane-two"
title = "Review lane two"
description = """
You are one lane of a two-lane review quorum, running as durable lane
`{{lane_two_id}}` on provider `{{lane_two_provider}}` (your pool's default
model). Read the diff and record findings; the synthesis step
makes the verdict. Do NOT call signoff.sh, do NOT touch the anchor, do NOT
file finding or rework beads, and do NOT modify any file, branch, comment, or
bead other than writing your own durable output onto this step bead.

This review is `{{review_bead}}`, applying the `{{check}}` check to branch
`{{review_branch}}` at commit `{{reviewed_oid}}`, the branch's head when the
review was dispatched. Its diff starts where the branch left `{{review_base}}`.
The change is `{{anchor_bead}}`'s. Its PR is `{{review_pr_url}}`, empty before
one opens. Why the dispatch sent this review: {{review_context}}

**1. Check the record.** When the block names a missing key, review nothing:
write your lane output (part 4) with verdict `blocked`, a summary naming the
