this step's gc.output_json, this step bead closed. No verdict, no signoff.
"""
metadata = { "gc.run_target" = "{{lane_two_target}}", "gc.provider" = "{{lane_two_provider}}", "gc.review_quorum_lane" = "{{lane_two_id}}", "gc.output_json_schema" = "review-quorum.lane.v1" }

[[steps]]
id = "synthesize-and-signoff"
title = "Synthesize the two lanes and hand ONE verdict to signoff.sh"
needs = ["review-lane-one", "review-lane-two"]
description = """
Combine the two lanes into one verdict and hand it to signoff.sh — once — then
close the chain and drain. This is the ONE verdict per claim: signoff.sh owns
the artifact, the review bead's close with the verdict, the finding beads from
findings.json, the rework child, and the COMMENT-only posting. You add none of that; you
decide the verdict and call signoff.sh exactly once.

**1. Re-derive the review bead and its pins** (each step is its own shell),
exactly as `formulas/mol-review.toml`'s `load-dispatch` does:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
REVIEW_BEAD=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
[ -n "$REVIEW_BEAD" ] || { echo "mol-review-quorum-signoff needs an input convoy with exactly one tracked member" >&2; exit 1; }
M=$(gc bd show "$REVIEW_BEAD" --json | jq -c '.[0].metadata')
REVIEWED_OID=$(printf '%s' "$M" | jq -r '.reviewed_oid // empty')
# The workflow root is on THIS synthesis step bead (the bead this claim handed
# you), not on the review bead. Scope the lane lookup by it: lane_ids are
# constant across pours, so gc.review_quorum_lane alone would also match lanes
# from every other quorum molecule.
SYNTH_BEAD="<the bead_id your gc hook --claim returned for this step>"
ROOT=$(gc bd show "$SYNTH_BEAD" --json | jq -r '.[0].metadata["gc.root_bead_id"] // empty')
[ -n "$ROOT" ] || { echo "cannot resolve workflow root from the synthesis step bead $SYNTH_BEAD" >&2; exit 1; }
```

**2. Read both lanes' durable output.** Each lane wrote a
`review-quorum.lane.v1` object to its step bead's `gc.output_json`. Find the
two lane step beads by their `gc.review_quorum_lane` stamp (`{{lane_one_id}}`,
`{{lane_two_id}}`), scoped to this workflow root in the query. `--status closed`
is required (a metadata-field query defaults to open only), and `--limit=0`
lifts the default 50-row cap: lane ids are constant across pours, so a capped
lookup can fill its page with other molecules' lane beads and read this root's
completed lane as missing.
```bash
for LANE in {{lane_one_id}} {{lane_two_id}}; do
  gc bd list --metadata-field gc.review_quorum_lane="$LANE" --metadata-field gc.root_bead_id="$ROOT" --status closed --limit=0 --json \
    | jq -r '.[0].metadata["gc.output_json"] // empty'
done
```
A lane that is missing, unreadable, or closed `fail` is REDUCED COVERAGE, not
a pass: say so in the verdict body and, when the missing lane leaves you unable
to reach a confident verdict, treat the review as request-changes with a
finding that names the coverage gap rather than approving on one lane.

**3. Run what the check's method runs, once,** in the review's workspace. Make
it with the `review-workspace-add` block of `formulas/mol-review.toml`, and
only that block, because `hb` here is this step's own keepalive, below.
Anything else you write to disk goes in the same workspace. The lanes ran
nothing, so this is the quorum's one run of everything the method runs, at the
pinned commit and against the pre-change code alike, and a method that runs
nothing leaves this step nothing to do. Run each long command under `hb`:
```bash
SYNTH_BEAD="<the bead_id your gc hook --claim returned for this step>"
# >>> quorum-lease-keepalive
# A claim's lease has a fixed five-minute TTL, and a synthesizer whose lease
# lapses during a long command reads as dead. `hb <command>` refreshes
# $SYNTH_BEAD while it runs, and runs it plain when no wrapper resolves.
LHB=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/lease-heartbeat.sh" ] && { LHB="$c/assets/scripts/lease-heartbeat.sh"; break; }; done
hb() { if [ -n "$LHB" ]; then "$LHB" "$SYNTH_BEAD" -- "$@"; else "$@"; fi; }
# <<< quorum-lease-keepalive
```

**4. Synthesize the verdict body.** UNION the lanes' findings — two providers
catch more than one, which is the point — then dedupe findings that are the
same defect at the same locus, keeping lane provenance. A finding either lane
raises as blocking under the check's method that survives your own judgment is
blocking for the quorum. `approve` iff no blocking finding stands across both
lanes and your own run; otherwise `request-changes`. Write the verdict body to
`findings.md` in mol-review's verdict envelope (the findings with
location+impact+fix, and the trail of reviewed branch/base/commit, scope
checked and filed, each in a collapsed block under the line `signoff.sh` opens
the comment with) with the lines the check's method adds to it, self-contained
because pre-open it is replayed verbatim as the opening PR comment. Note in the
trail which lanes covered what, and any reduced coverage.

**5. Emit `findings.json`** beside it — a JSON array, one `{locus, message}`
per blocking finding, `[]` on approve — exactly as
`formulas/mol-review.toml`'s `review` step 6b specifies (rebase-stable locus:
a file and a symbol or section, never a line number or oid).

**6. One call, through the one writer.** Resolve signoff.sh from the pack and
call it once:
```bash
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/signoff.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
"${SCRIPTS:?signoff.sh not found in the pack}/signoff.sh" --review-bead "$REVIEW_BEAD" --verdict <approve|request-changes> --reviewed-oid "$REVIEWED_OID" --notes-file findings.md --findings-file findings.json
```
Do not post the review yourself, do not write to the anchor, do not file rework
or finding beads, and never run `gh pr review --approve`.

Pass on this same call every flag the check's method names for the verdict,
and `--needs-you` when a decision is the operator's to make.
When signoff.sh refuses a verdict for a missing or invalid flag, it has written
nothing, so re-run the call with the flag corrected; that is still the one
verdict.

**7. Failure arms** are mol-review's `verdict-and-drain` arms verbatim: a
`superseded`/`already closed` exit from signoff needs no re-pin (drop the
verdict, close the chain, drain); any other failure appends your findings to
the review bead (`--append-notes`, never `--notes`), then — after the chain is
closed — restores the bead's route from `metadata.review_pool` so the pool can
re-claim it, then drains.

**8. Close this workflow's step chain forward, remove the workspace, then
drain.** Terminal step: close every step by its `(gc.root_bead_id,
gc.step_ref)` pair through step-close.sh, in forward order; the lanes closed
their own beads already, so those return "not this session's to close" and are
left for the finalizer. Never close `workflow-finalize`.
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
REVIEW_BEAD=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
SC=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/step-close.sh" ] && { SC="$c/assets/scripts/step-close.sh"; break; }
done
: "${SC:?step-close.sh not found in the pack}"
for STEP in review-lane-one review-lane-two synthesize-and-signoff; do
  "$SC" --step "mol-review-quorum-signoff.$STEP" --convoy {{convoy_id}} --outcome pass || echo "step-close: mol-review-quorum-signoff.$STEP was not this session's to close — left for the finalizer"
done
# >>> quorum-review-workspace-remove
[ -n "$REVIEW_BEAD" ] && "$(dirname "$SC")/review-workspace.sh" remove --review-bead "$REVIEW_BEAD"
# <<< quorum-review-workspace-remove
gc runtime drain-ack
```

**Exit criteria:** both lanes read (or reduced coverage recorded), the check
method's commands run once under `hb`, findings.md + findings.json written,
exactly one signoff.sh call succeeded (or findings appended and the route
restored), step chain closed forward, the workspace removed unless the bead
went back to the pool, drain acknowledged.
"""
metadata = { "gc.run_target" = "{{synthesis_target}}", "gc.review_quorum_role" = "synthesis" }
