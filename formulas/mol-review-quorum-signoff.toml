MISSING=""
for kv in "review_bead={{review_bead}}" "check={{check}}" "anchor_bead={{anchor_bead}}" "review_branch={{review_branch}}" "review_base={{review_base}}" "reviewed_oid={{reviewed_oid}}"; do
  [ -n "${kv#*=}" ] || MISSING="${MISSING:+$MISSING, }${kv%%=*}"
done
# <<< review-record-check
[ -z "$MISSING" ] || { echo "the review's record lacks $MISSING: this lane reviews nothing" >&2; exit 1; }
```

**2. Gather what the review reads.** The block prints the anchor, the PR's
page when one is open, the rig's guidance for this check, and the path of the
review's worktree at `{{reviewed_oid}}`, which the two lanes and the synthesis
share. Read the change there with git, read-only: its diff is
`git diff origin/{{review_base}}...HEAD`.
```bash
# >>> review-gather
REPO="${GC_RIG_ROOT:-}"
[ -n "$REPO" ] || REPO=$(gc rig list --json | jq -r --arg r "$GC_RIG" '.rigs[] | select(.name == $r) | .path')
[ -n "$REPO" ] || { echo "review: cannot resolve rig root (GC_RIG_ROOT unset, GC_RIG='$GC_RIG' matched no rig in the roster)" >&2; exit 1; }
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/review-workspace.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
: "${SCRIPTS:?review-workspace.sh not found in the pack}"
git -C "$REPO" fetch --quiet origin "{{review_base}}" "{{review_branch}}" || exit 1
git -C "$REPO" cat-file -e "{{reviewed_oid}}^{commit}" 2>/dev/null || git -C "$REPO" fetch --quiet --no-tags origin "{{reviewed_oid}}" || exit 1
WT=$("$SCRIPTS/review-workspace.sh" add --review-bead "{{review_bead}}" --oid "{{reviewed_oid}}" --repo "$REPO") || exit 1
cd "$WT" || exit 1
