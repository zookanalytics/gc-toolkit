metadata = { "gc.run_target" = "{{lane_two_target}}", "gc.provider" = "{{lane_two_provider}}", "gc.review_quorum_lane" = "{{lane_two_id}}", "gc.output_json_schema" = "review-quorum.lane.v1" }

[[steps]]
id = "synthesize-and-signoff"
title = "Synthesize the two lanes and hand ONE verdict to signoff.sh"
needs = ["review-lane-one", "review-lane-two"]
description = """
Combine the two lanes into ONE verdict, hand it to signoff.sh once, then
close the chain and drain. This review is `{{review_bead}}`, the `{{check}}`
check at `{{reviewed_oid}}` on `{{review_branch}}`. Why the dispatch sent it:
{{review_context}}

**1. Check the record.** When the block names a missing key, review nothing:
append to the review's notes which key its record lacks and that closing the
review lets the next gate-ensure pass dispatch a fresh one, then close the
chain and drain as part 9 does, leaving the route empty.
```bash
# >>> review-record-check
MISSING=""
for kv in "review_bead={{review_bead}}" "check={{check}}" "anchor_bead={{anchor_bead}}" "review_branch={{review_branch}}" "review_base={{review_base}}" "reviewed_oid={{reviewed_oid}}"; do
  [ -n "${kv#*=}" ] || MISSING="${MISSING:+$MISSING, }${kv%%=*}"
done
# <<< review-record-check
[ -z "$MISSING" ] || { echo "the review's record lacks $MISSING: reviewing nothing" >&2; exit 1; }
```

**2. Read both lanes' durable output,** the `review-quorum.lane.v1` object each
lane wrote to its step bead's `gc.output_json`, found by the lane's
`gc.review_quorum_lane` stamp within this workflow's root:
```bash
SYNTH_BEAD="<the bead_id your gc hook --claim returned for this step>"
ROOT=$(gc bd show "$SYNTH_BEAD" --json | jq -r '.[0].metadata["gc.root_bead_id"] // empty')
[ -n "$ROOT" ] || { echo "cannot resolve workflow root from the synthesis step bead $SYNTH_BEAD" >&2; exit 1; }
# A metadata query reads open beads unless told otherwise, and lane ids repeat
# across pours, so an uncapped read of closed lanes under this root.
for LANE in {{lane_one_id}} {{lane_two_id}}; do
  gc bd list --metadata-field gc.review_quorum_lane="$LANE" --metadata-field gc.root_bead_id="$ROOT" --status closed --limit=0 --json \
    | jq -r '.[0].metadata["gc.output_json"] // empty'
done
```
A lane that is missing, unreadable, or closed `fail` or `blocked` is REDUCED
COVERAGE, not a pass: say so in the verdict body, and when it leaves you no
confident verdict, request changes with a finding naming the coverage gap
rather than approve on one lane.

**3. Gather what the review reads,** as each lane did:
```bash
# >>> review-gather
REPO="${GC_RIG_ROOT:-}"
[ -n "$REPO" ] || REPO=$(gc rig list --json | jq -r --arg r "$GC_RIG" '.rigs[] | select(.name == $r) | .path')
[ -n "$REPO" ] || { echo "review: cannot resolve rig root (GC_RIG_ROOT unset, GC_RIG='$GC_RIG' matched no rig in the roster)" >&2; exit 1; }
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/review-workspace.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
: "${SCRIPTS:?review-workspace.sh not found in the pack}"
git -C "$REPO" fetch --quiet origin "{{review_base}}" "{{review_branch}}" || exit 1
git -C "$REPO" cat-file -e "{{reviewed_oid}}^{commit}" 2>/dev/null || git -C "$REPO" fetch --quiet --no-tags origin "{{reviewed_oid}}" || exit 1
WT=$("$SCRIPTS/review-workspace.sh" add --review-bead "{{review_bead}}" --oid "{{reviewed_oid}}" --repo "$REPO") || exit 1
cd "$WT" || exit 1
echo "== The change: {{anchor_bead}}"
gc bd show "{{anchor_bead}}" || exit 1
if [ -n "{{review_pr_url}}" ]; then
  echo "== The PR as published: {{review_pr_url}}"
  gh pr view "{{review_pr_url}}" --json title,body --jq '.title, "", .body' || exit 1
fi
echo "== The rig's guidance for {{check}}: docs/review-{{check}}.md at {{reviewed_oid}}, empty when it keeps none"
"$SCRIPTS/review-checks.sh" --extension "{{check}}" --at "{{reviewed_oid}}" || exit 1
echo "== The pack's scripts: $SCRIPTS"
echo "== The review's worktree: $WT"
# <<< review-gather
```

**4. Load the method, and run what it runs, once.**
<!-- >>> review-method-load -->
The check's method is the skill `{{binding_prefix}}review-{{check}}`. Load it
from your skill catalog and apply it, and no other review skill. A copy of a
skill in the review's worktree is the change under review, not your method.
When your catalog has no such skill:

- If the rig's check index declares `{{check}}`
  (`review-checks.sh --check {{check}} --at {{reviewed_oid}}` prints its row),
  judge the diff against the purpose the row states. Load
  `{{binding_prefix}}specialist-stance` and hold it. Say in your coverage line
  that the pack ships no method for this check.
- If no index declares it (the call exits 1 saying no index declares the
  check), approve, and pass `--needs-you` saying the check is declared
  nowhere, so the operator decides whether it stays in the anchor's
  `check_set`. A call that fails for any other reason, such as a commit it
  cannot read, is no answer, and nothing approves on it.

The rig's guidance for this check is the reviewed commit's
`docs/review-{{check}}.md`, which the gather block printed when the commit
carries one. It adds to the method and never replaces it. Most rigs keep
none.
<!-- <<< review-method-load -->

The lanes ran nothing, so this is the quorum's one run of everything the
method runs, at the reviewed commit and against the pre-change code alike. A
long command runs under the claim-lease keepalive, `lease-heartbeat.sh <the
bead_id your gc hook --claim returned for this step> -- <command>`, from the
pack's scripts the gather printed. Anything else you write to disk goes in the
review's workspace, beside the worktree.

**5. Synthesize the verdict body.** UNION the lanes' findings, then dedupe
those that are the same defect at the same locus, keeping lane provenance. A
finding either lane raises as blocking under the method that survives your
own judgment is blocking for the quorum: `approve` iff none stands across both
lanes and your own run, else `request-changes`. Write the body to
`findings.md` in mol-review's verdict envelope, with the lines the method adds,
self-contained because pre-open it is the PR's opening comment, and note in
the trail which lanes covered what and any reduced coverage.

**6. Emit `findings.json`** beside it, one `{locus, message}` per blocking
finding and `[]` on approve, exactly as `formulas/mol-review.toml`'s `review`
step 5b specifies.

**7. One call, through the one writer.** The verdict names `{{reviewed_oid}}`,
the commit the quorum read, and signoff.sh refuses any other. Pass every flag
the method names for the verdict, and `--needs-you` when a decision is the
operator's; a call refused for a missing or invalid flag wrote nothing, so
re-run it corrected. Never post the review yourself, write to the anchor, file
beads, or run `gh pr review --approve`.
```bash
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/signoff.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
"${SCRIPTS:?signoff.sh not found in the pack}/signoff.sh" --review-bead "{{review_bead}}" --verdict <approve|request-changes> --reviewed-oid "{{reviewed_oid}}" --notes-file findings.md --findings-file findings.json
```

**8. Failure arms** are mol-review's `verdict-and-drain` arms: after a
`superseded` or `already closed` exit, close the chain and drain; after any
other failure, append your findings to the review bead (`--append-notes`),
close the chain, then restore its route from `metadata.review_pool` and drain.

**9. Close the chain forward, remove the workspace, then drain.** Close every
step through step-close.sh in forward order; the lanes closed their own beads,
so those report "not this session's to close". Never close `workflow-finalize`.
```bash
SC=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/step-close.sh" ] && { SC="$c/assets/scripts/step-close.sh"; break; }
done
: "${SC:?step-close.sh not found in the pack}"
for STEP in review-lane-one review-lane-two synthesize-and-signoff; do
  "$SC" --step "mol-review-quorum-signoff.$STEP" --convoy {{convoy_id}} --outcome pass || echo "step-close: mol-review-quorum-signoff.$STEP was not this session's to close — left for the finalizer"
done
# >>> quorum-review-workspace-remove
"$(dirname "$SC")/review-workspace.sh" remove --review-bead "{{review_bead}}"
# <<< quorum-review-workspace-remove
gc runtime drain-ack
```

**Exit criteria:** one signoff.sh call succeeded or a failure arm taken, the
chain closed forward, drain acknowledged.
"""
metadata = { "gc.run_target" = "{{synthesis_target}}", "gc.review_quorum_role" = "synthesis" }
