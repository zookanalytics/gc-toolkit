description = """
Executable design-convoy pattern — a dispatch molecule that stands up an owned
integration convoy converse reaches by recommendation, then drains. Slung `--on`
a single subject (the initiative) from the recommend-to-Accept path, it creates
the owned convoy, cuts its integration branch, files a design child whose doc
lands on that branch, and arms an implementation child behind the design's
approval. Design and implementation graduate to the default branch as one
reviewed unit. Doctrine: docs/design-convoy.md.

The molecule writes no code and needs no worktree of its own; convoy-seed.sh
carries the push rights a converse sitting lacks. Each step re-derives the
subject from the input convoy ({{convoy_id}}'s one tracked member) in its own
shell, records its result on the subject so a resume is idempotent, and closes
its own step bead through assets/scripts/step-close.sh — resolved by
(gc.root_bead_id, gc.step_ref), never a GC_*BEAD_ID env var, which after a
hook-claim names a different step.

Every PR this convoy produces, the design child's checkpoint PR included, merges
only with a standing APPROVED review from an account other than the city's,
which counts until it is dismissed: merge.sh enforces that as a universal rule,
so no check_set token arms it. design_gated (var, default
true) chooses when implementation starts. Gated: the implementation child is
armed behind the design child's closure, so the operator's approval of the
design's PR is what releases it. All-in-one (design_gated=false): design and
implementation dispatch together, and the graduation PR is where the operator
first reviews them as one unit.
"""
formula = "mol-design-convoy"

[requires]
formula_compiler = ">=2.0.0"

[vars.design_gated]
description = "true (default): the implementation child is held behind the design child by a blocks edge and dispatched when the design child closes, which happens when its checkpoint PR merges with the operator's approval. false: design and implementation dispatch together and land on the integration branch in parallel. Either way every PR needs a standing APPROVED review from an account other than the city's, which counts until it is dismissed (merge.sh's universal approval rule). The value is read case-insensitively: false, 0, no, or off selects all-in-one; true, 1, yes, or on selects design-gated; an empty or unrecognized value also selects design-gated, with a warning, so a typo never drops the design gate. The operator overrides per initiative at Accept with --var design_gated=false."
default = "true"

[[steps]]
id = "load-context"
title = "Read the initiative and resolve the convoy shape"
description = """
Prime, then read the subject this design-convoy stands up.

**1. Prime and derive the subject (the initiative):**
```bash
gc prime
gc bd prime
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
SUBJECT=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
[ -n "$SUBJECT" ] || { echo "mol-design-convoy needs an input convoy with exactly one tracked member" >&2; exit 1; }
```

**2. Read the subject's body and its recommendation card.** The card (in the
subject's notes) is where converse recorded the design topic and the intended
implementation, so read it — it is the seed for the design child's brief and the
implementation child's scope:
```bash
gc bd show "$SUBJECT"
gc bd show "$SUBJECT" --json | tr -d '[:cntrl:]' | jq '.[0].metadata'
```

**3. Resolve the gate shape.** `design_gated` is `{{design_gated}}` (default
`true`). Design-gated holds implementation until the design's checkpoint PR
merges with the operator's approval; all-in-one dispatches both together.
Nothing acts on it here, since arm-implementation resolves the same var with the
same block, but resolving it now reports a value the block does not recognize
before the convoy exists. Confirm the resolved shape is the one this initiative
wants before standing the convoy up:
```bash
# >>> design-gated-resolve
# Case-insensitive: false, 0, no, or off selects all-in-one; true, 1, yes, or on
# selects design-gated. Anything else, empty included, falls back to the
# design-gated default, so a typo never drops the design gate.
DESIGN_GATED_RAW="{{design_gated}}"
case "$(printf '%s' "$DESIGN_GATED_RAW" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
  false|0|no|off) DESIGN_GATED=false ;;
  true|1|yes|on)  DESIGN_GATED=true ;;
  *) DESIGN_GATED=true; echo "design_gated='$DESIGN_GATED_RAW' is not a recognized boolean; using the design-gated default" >&2 ;;
esac
# <<< design-gated-resolve
echo "design_gated resolves to $DESIGN_GATED"
```

**Close this step bead so the graph advances.** Non-terminal, so no drain:
```bash
SC=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/step-close.sh" ] && { SC="$c/assets/scripts/step-close.sh"; break; }
done
"${SC:?step-close.sh not found in the pack}" --step mol-design-convoy.load-context --outcome pass
```

**Exit criteria:** the subject and its card are read, and this step is closed.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[[steps]]
id = "seed-convoy"
title = "Create the owned convoy and cut its integration branch"
needs = ["load-context"]
description = """
Stand the durable convoy up with `convoy-seed.sh`: create the owned convoy, set
its target to `integration/<convoy-id>`, and cut+push that branch from a
disposable worktree. A converse sitting cannot do this — it never pushes — which
is why the pattern needs this molecule.

**Idempotent on resume.** `convoy-seed.sh` writes the new convoy id to `--id-file`
the instant the convoy is created — before the fallible target-set and branch cut —
and this step records it on the subject right then, on success or failure. A re-run
therefore passes the recorded id back as `--convoy`, so it reuses the first convoy
instead of creating a second, and `convoy-seed.sh` skips the cut when origin already
carries the branch.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
SUBJECT=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
[ -n "$SUBJECT" ] || { echo "mol-design-convoy needs an input convoy with exactly one tracked member" >&2; exit 1; }
SUBJECT_JSON=$(gc bd show "$SUBJECT" --json | tr -d '[:cntrl:]')
INITIATIVE=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].title // empty')
CONVOY_ID=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.design_convoy_id"] // empty')

SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/convoy-seed.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
[ -n "$SCRIPTS" ] || { echo "convoy-seed.sh not found in the pack" >&2; exit 1; }

IDFILE=$(mktemp "${TMPDIR:-/tmp}/gctk-design-convoy-id.XXXXXX") || { echo "mktemp failed" >&2; exit 1; }
SEED_RC=0
# Build convoy-seed.sh's argv as an array. The agent shell is zsh, which does
# not word-split an unquoted ${CONVOY_ID:+--convoy "$CONVOY_ID"}: it reaches
# convoy-seed.sh as the single argument `--convoy <id>`, which it rejects as an
# unknown argument, so the resume above never reuses the recorded convoy. An
# array keeps --convoy and the id separate words in every shell.
# >>> seed-convoy-invoke
SEED_ARGS=(--name "$INITIATIVE")
[ -n "$CONVOY_ID" ] && SEED_ARGS+=(--convoy "$CONVOY_ID")
SEED_ARGS+=(--id-file "$IDFILE" --json)
SEED_JSON=$("$SCRIPTS/convoy-seed.sh" "${SEED_ARGS[@]}") || SEED_RC=$?
# <<< seed-convoy-invoke
# convoy-seed.sh writes the created convoy id to --id-file before its fallible
# target-set and branch cut. Record it now — on success OR failure — so a resume
# after a mid-cut crash reuses this convoy instead of creating a second one.
SEEDED_ID=$(tr -d '[:cntrl:]' < "$IDFILE" 2>/dev/null); rm -f "$IDFILE"
[ -n "$SEEDED_ID" ] && gc bd update "$SUBJECT" --set-metadata "gc.design_convoy_id=$SEEDED_ID"
[ "$SEED_RC" -eq 0 ] || { echo "convoy-seed failed (rc=$SEED_RC)" >&2; exit 1; }
CONVOY_ID=$(printf '%s' "$SEED_JSON" | tr -d '[:cntrl:]' | jq -r '.convoy_id // empty')
BRANCH=$(printf '%s' "$SEED_JSON" | tr -d '[:cntrl:]' | jq -r '.branch // empty')
[ -n "$CONVOY_ID" ] && [ -n "$BRANCH" ] || { echo "convoy-seed returned no convoy id/branch" >&2; exit 1; }

# Record the authoritative id+branch now that the cut has succeeded (the id was
# already persisted above; re-recording it with the branch is idempotent).
gc bd update "$SUBJECT" --set-metadata "gc.design_convoy_id=$CONVOY_ID" --set-metadata "gc.design_convoy_branch=$BRANCH"
```

**Close this step bead.** Non-terminal, so no drain:
```bash
SC=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/step-close.sh" ] && { SC="$c/assets/scripts/step-close.sh"; break; }
done
"${SC:?step-close.sh not found in the pack}" --step mol-design-convoy.seed-convoy --outcome pass
```

**Exit criteria:** the owned convoy exists, its target is `integration/<convoy-id>`,
that branch is on origin, the id is recorded on the subject, and this step is
closed.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[[steps]]
id = "arm-design"
title = "File the design child and dispatch it"
needs = ["seed-convoy"]
description = """
File the design child, link it to the convoy, and sling it to the polecat pool.
The child branches from the integration branch, lands its design doc there, and
the refinery opens the checkpoint PR onto that branch. That PR merges only with
a standing APPROVED review from an account other than the city's, under
`merge.sh`'s universal approval rule, so the child carries no check_set stamp of
its own.

**Idempotent on resume** via two markers on the subject: `gc.design_child` (the
child was filed) and `gc.design_armed` (it was linked and slung).
`gc.design_child` guards the non-idempotent create alone; the convoy link is an
idempotent sling precondition and lives under `gc.design_armed`. So a re-run
neither files a second child nor pours a second workflow, and never slings a
child that is unlinked from the convoy.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
SUBJECT=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
[ -n "$SUBJECT" ] || { echo "mol-design-convoy needs an input convoy with exactly one tracked member" >&2; exit 1; }
SUBJECT_JSON=$(gc bd show "$SUBJECT" --json | tr -d '[:cntrl:]')
INITIATIVE=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].title // empty')
CONVOY_ID=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.design_convoy_id"] // empty')
BRANCH=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.design_convoy_branch"] // empty')
DESIGN_CHILD=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.design_child"] // empty')
[ -n "$CONVOY_ID" ] && [ -n "$BRANCH" ] || { echo "seed-convoy did not record the convoy; cannot arm design" >&2; exit 1; }

POOL="${GC_RIG:+$GC_RIG/}gc-toolkit.polecat"
case "$POOL" in */*) ;; *) echo "cannot rig-qualify the pool; set GC_RIG" >&2; exit 1 ;; esac
```

**File the design child (only if not already filed).** Replace the `<...>` with
the design topic and questions you read from the subject's card in load-context:
bd answers a refused create with an `{"error": ...}` object, so the id is read
type-guarded and a refusal reports bd's own reason:
```bash
if [ -z "$DESIGN_CHILD" ]; then
  CREATE_JSON=$(gc bd create --title "design: $INITIATIVE" -t task -d "## Goal
Design <the topic>, per the initiative $SUBJECT. Land the design doc on
$BRANCH (this convoy's integration branch) and open it as a checkpoint PR
onto that branch for the operator's on-branch review. Do NOT start
implementation — it is a separate child of this convoy.

## What to settle
<the design questions from the initiative card>

## Deliverable
A design doc committed to $BRANCH and opened as a PR onto it. The design
defines the implementation child's breakdown. Use the filing-documentation
skill for placement." --json | tr -d '[:cntrl:]')
  DESIGN_CHILD=$(printf '%s' "$CREATE_JSON" | jq -r 'if type == "array" then (.[0].id // empty) else (.id // empty) end' 2>/dev/null)
  [ -n "$DESIGN_CHILD" ] || { CREATE_ERR=$(printf '%s' "$CREATE_JSON" | jq -r 'if type == "object" then (.error // empty) else empty end' 2>/dev/null); echo "bd create filed no design child${CREATE_ERR:+: $CREATE_ERR}" >&2; exit 1; }
  gc bd update "$SUBJECT" --set-metadata "gc.design_child=$DESIGN_CHILD" || { echo "design child $DESIGN_CHILD is filed but gc.design_child did not record on $SUBJECT; record it by hand before a re-run, or the re-run files a second child" >&2; exit 1; }
fi
```

**Link, verify, and sling (only if not already armed).** The convoy link
resolves `metadata.target=integration/<convoy-id>` for the child at sling time.
It is an idempotent precondition of the sling, so it runs here, before every
sling including a resumed one. A child slung without it opens its PR against
the default branch, so the link is read back before the sling. The read-back
decides, not the add's exit status: a resume re-runs the add on an edge the
failed pass may already have written, and an add refused on an existing edge
looks the same as one that wrote nothing. A link that does not read back fails
the step with `gc.design_armed` unstamped, which leaves the arm for a resume to
re-run:
```bash
ARMED=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.design_armed"] // empty')
# >>> arm-design-dispatch
if [ -z "$ARMED" ]; then
  gc bd dep add "$DESIGN_CHILD" "$CONVOY_ID" --type=parent-child || echo "dep add of design child $DESIGN_CHILD under convoy $CONVOY_ID returned non-zero (already linked?); reading the edge back" >&2
  LINKED=$(gc bd dep list "$DESIGN_CHILD" --direction=down -t parent-child --json 2>/dev/null | tr -d '[:cntrl:]' | jq -r --arg c "$CONVOY_ID" '[.[]? | select(.id == $c)] | length' 2>/dev/null)
  [ "${LINKED:-0}" -ge 1 ] 2>/dev/null || { echo "design child $DESIGN_CHILD reads no parent-child edge to convoy $CONVOY_ID after the link; not slinging" >&2; exit 1; }
  gc sling "$POOL" "$DESIGN_CHILD" --on mol-polecat-work || { echo "sling of design child failed" >&2; exit 1; }
  gc bd update "$SUBJECT" --set-metadata "gc.design_armed=1" || { echo "design child $DESIGN_CHILD is slung but gc.design_armed did not record on $SUBJECT; record it by hand before a re-run, or the re-run slings it again" >&2; exit 1; }
fi
# <<< arm-design-dispatch
```

**Close this step bead.** Non-terminal, so no drain:
```bash
SC=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/step-close.sh" ] && { SC="$c/assets/scripts/step-close.sh"; break; }
done
"${SC:?step-close.sh not found in the pack}" --step mol-design-convoy.arm-design --outcome pass
```

**Exit criteria:** the design child is filed, linked to the convoy with the link
read back, slung to the pool, and this step is closed.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[[steps]]
id = "arm-implementation"
title = "File the implementation child and arm it behind the design"
needs = ["arm-design"]
description = """
File one implementation child that builds the initiative per the design.
For `design_gated=true`, hold it behind the design child with a `blocks` edge and
arm a deferred dispatch, so the design's closure is what sends it to the pool.
For `design_gated=false`, sling it now to run in parallel.

One implementation child, not a fan-out: the design defines the breakdown, so the
implementation child carries "split into multiple beads if the design
calls for it" and splits itself when it runs — the design does not exist yet to
enumerate the pieces here.

**Idempotent on resume** via `gc.impl_child` (the child was filed) and
`gc.impl_armed` (it was linked, then slung or armed) on the subject.
`gc.impl_child` guards the non-idempotent create alone; the convoy link and,
when gated, the `blocks` edge are idempotent dispatch preconditions and live
under `gc.impl_armed`. So a re-run neither files a second child nor dispatches
one that is unlinked from the convoy or unheld behind the design.

`design_gated` resolves through the same marked block load-context ran:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
SUBJECT=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
[ -n "$SUBJECT" ] || { echo "mol-design-convoy needs an input convoy with exactly one tracked member" >&2; exit 1; }
SUBJECT_JSON=$(gc bd show "$SUBJECT" --json | tr -d '[:cntrl:]')
INITIATIVE=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].title // empty')
CONVOY_ID=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.design_convoy_id"] // empty')
BRANCH=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.design_convoy_branch"] // empty')
DESIGN_CHILD=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.design_child"] // empty')
IMPL_CHILD=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.impl_child"] // empty')
[ -n "$CONVOY_ID" ] && [ -n "$BRANCH" ] && [ -n "$DESIGN_CHILD" ] || { echo "convoy or design child not recorded; cannot arm implementation" >&2; exit 1; }
# >>> design-gated-resolve
# Case-insensitive: false, 0, no, or off selects all-in-one; true, 1, yes, or on
# selects design-gated. Anything else, empty included, falls back to the
# design-gated default, so a typo never drops the design gate.
DESIGN_GATED_RAW="{{design_gated}}"
case "$(printf '%s' "$DESIGN_GATED_RAW" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
  false|0|no|off) DESIGN_GATED=false ;;
  true|1|yes|on)  DESIGN_GATED=true ;;
  *) DESIGN_GATED=true; echo "design_gated='$DESIGN_GATED_RAW' is not a recognized boolean; using the design-gated default" >&2 ;;
esac
# <<< design-gated-resolve

SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/deferred-dispatch.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
[ -n "$SCRIPTS" ] || { echo "deferred-dispatch.sh not found in the pack" >&2; exit 1; }

POOL="${GC_RIG:+$GC_RIG/}gc-toolkit.polecat"
case "$POOL" in */*) ;; *) echo "cannot rig-qualify the pool; set GC_RIG" >&2; exit 1 ;; esac
```

**File the implementation child (only if not already filed).** Its brief says
when to start, by shape, and the id is read type-guarded as in arm-design:
```bash
if [ -z "$IMPL_CHILD" ]; then
  if [ "$DESIGN_GATED" = "true" ]; then
    IMPL_START="This bead is held behind the design child: it reaches the pool only after the design's checkpoint PR merges with the operator's approval, so the design is approved when you start."
  else
    IMPL_START="This bead runs beside the design child (design_gated=false): build against the design as it lands on $BRANCH, and expect to revise if the operator changes the design in review."
  fi
  CREATE_JSON=$(gc bd create --title "implement: $INITIATIVE per its design" -t task -d "## Goal
Implement $INITIATIVE per the design for it on $BRANCH (the design child
$DESIGN_CHILD of this convoy). Branch FROM $BRANCH and open your PR ONTO
$BRANCH — not the default branch. The convoy graduates holistically once this
lands.

## Scope
Follow the design. Split into multiple beads if the design calls for it.
$IMPL_START" --json | tr -d '[:cntrl:]')
  IMPL_CHILD=$(printf '%s' "$CREATE_JSON" | jq -r 'if type == "array" then (.[0].id // empty) else (.id // empty) end' 2>/dev/null)
  [ -n "$IMPL_CHILD" ] || { CREATE_ERR=$(printf '%s' "$CREATE_JSON" | jq -r 'if type == "object" then (.error // empty) else empty end' 2>/dev/null); echo "bd create filed no implementation child${CREATE_ERR:+: $CREATE_ERR}" >&2; exit 1; }
  gc bd update "$SUBJECT" --set-metadata "gc.impl_child=$IMPL_CHILD" || { echo "implementation child $IMPL_CHILD is filed but gc.impl_child did not record on $SUBJECT; record it by hand before a re-run, or the re-run files a second child" >&2; exit 1; }
fi
```

**Link, verify, then arm or sling, by shape (only if not already armed).** The
convoy link resolves `metadata.target=integration/<convoy-id>` for the child,
and under design-gated the `blocks` edge is what keeps the deferred dispatch
from firing before the design closes. Both are idempotent preconditions of the
dispatch, so they run here, before every dispatch including a resumed one, and
each is read back before anything dispatches. As in arm-design, the read-back
decides, not the add's exit status. An edge that does not read back fails the
step with `gc.impl_armed` unstamped, which leaves the arm for a resume to
re-run:
```bash
ARMED=$(printf '%s' "$SUBJECT_JSON" | jq -r '.[0].metadata["gc.impl_armed"] // empty')
# >>> arm-implementation-dispatch
if [ -z "$ARMED" ]; then
  gc bd dep add "$IMPL_CHILD" "$CONVOY_ID" --type=parent-child || echo "dep add of implementation child $IMPL_CHILD under convoy $CONVOY_ID returned non-zero (already linked?); reading the edge back" >&2
  LINKED=$(gc bd dep list "$IMPL_CHILD" --direction=down -t parent-child --json 2>/dev/null | tr -d '[:cntrl:]' | jq -r --arg c "$CONVOY_ID" '[.[]? | select(.id == $c)] | length' 2>/dev/null)
  [ "${LINKED:-0}" -ge 1 ] 2>/dev/null || { echo "implementation child $IMPL_CHILD reads no parent-child edge to convoy $CONVOY_ID after the link; not dispatching" >&2; exit 1; }
  if [ "$DESIGN_GATED" = "true" ]; then
    # Hold behind the design child and arm the deferred dispatch: the design's
    # closure, when its checkpoint PR merges with the operator's approval,
    # fires the sling. dep add's second id is the blocker, so the design
    # blocks the implementation here.
    gc bd dep add "$IMPL_CHILD" "$DESIGN_CHILD" --type=blocks || echo "dep add holding implementation child $IMPL_CHILD behind design child $DESIGN_CHILD returned non-zero (already held?); reading the edge back" >&2
    HELD=$(gc bd dep list "$IMPL_CHILD" --direction=down -t blocks --json 2>/dev/null | tr -d '[:cntrl:]' | jq -r --arg d "$DESIGN_CHILD" '[.[]? | select(.id == $d)] | length' 2>/dev/null)
    [ "${HELD:-0}" -ge 1 ] 2>/dev/null || { echo "implementation child $IMPL_CHILD reads no blocks edge from design child $DESIGN_CHILD after the add; not arming" >&2; exit 1; }
    "$SCRIPTS/deferred-dispatch.sh" arm "$IMPL_CHILD" --target "$POOL" --sling-arg --on --sling-arg mol-polecat-work --reason "design-convoy: implementation armed behind design child $DESIGN_CHILD's approval" || { echo "deferred-dispatch arm failed" >&2; exit 1; }
  else
    gc sling "$POOL" "$IMPL_CHILD" --on mol-polecat-work || { echo "sling of implementation child failed" >&2; exit 1; }
  fi
  gc bd update "$SUBJECT" --set-metadata "gc.impl_armed=1" || { echo "implementation child $IMPL_CHILD is dispatched but gc.impl_armed did not record on $SUBJECT; record it by hand before a re-run, or the re-run dispatches it again" >&2; exit 1; }
fi
# <<< arm-implementation-dispatch
```

**Close this step bead.** Non-terminal, so no drain:
```bash
SC=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/step-close.sh" ] && { SC="$c/assets/scripts/step-close.sh"; break; }
done
"${SC:?step-close.sh not found in the pack}" --step mol-design-convoy.arm-implementation --outcome pass
```

**Exit criteria:** the implementation child is filed, linked to the convoy, and
either held and armed behind the design (gated) or slung now (all-in-one), with
each edge read back; this step is closed.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[[steps]]
id = "drain"
title = "Close the step chain and drain"
needs = ["arm-implementation"]
description = """
The convoy is standing and its children are dispatched or armed. This molecule's
work is done. It writes no card and holds nothing: the durable owned convoy lives
on and graduates, the ephemeral input convoy drains with this molecule.

This is the terminal step, so close its own step bead (the earlier steps closed
themselves in order) and drain. The control-dispatcher's `workflow-finalize`
closes the `kind=workflow` root once every step is closed; never close the root,
the subject, or any child yourself.
