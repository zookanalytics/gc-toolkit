description = """
mol-rig-demo — capture one narrated video demo of a rig's app, parameterized by
rig and scenario, and deliver it to a PR or report its path. The reusable
rig-demo mol of epic tk-vd66j1: the video review modality (tk-vd66j1.9) pours it
to produce a clip for a PR under review, and an operator pours it for any rig
from a shell.

  gc sling <rig>/<pool> <demo-request-bead> --on mol-rig-demo \\
    --var rig_name=<rig> \\
    --var demo_script=<path>            # or: --var source_bead=<bead>
    --var serve_dir=<dir>               # or: --var serve_cmd="<cmd>" / --var base_url=<url>
    --var deliver_subject=<bead>        # optional; or --var deliver_pr=<n>; omit to just report

The capture is engine-driven over @zookanalytics/sprintshow
(skills/demo-capture/SKILL.md): the engine drives Playwright headlessly, the
only path a pool session has, since it carries no browser MCP. The mechanical
half — engine resolution, lint, capture, liveness check — lives in
assets/scripts/rig-demo-capture.sh so this formula, tk-vd66j1.9, and a shell all
drive it the same way. Delivery is assets/scripts/demo-deliver.sh (tk-vd66j1.4),
which attaches the clip to the PR inline and uncommitted.

Two inputs name the scenario, and the mol needs exactly one: demo_script is a
ready demo:capture-format script; source_bead is a bead whose work the mol turns
into a script by following skills/gc-demo-script/SKILL.md. One input names how
the rig's app is reached — serve_dir, serve_cmd, or base_url — the one
rig-specific fact, threaded as a pour var because no rig-to-app map exists
(docs/rig-demo.md). A per-rig default store is tracked separately; this mol
reads the target from the pour.

The clip is an artifact, never a committed file: it is written outside the repo
tree and delivered to the PR, because a user-attachments URL is the only
inline-playable path and no .gitattributes LFS filter covers an MP4.

Contract: single continuation group, run inline in one session. Derive the
demo-request bead from the input convoy's single member; produce the script;
capture; deliver or report; close the request bead and the step chain forward;
drain. On any blocker, escalate.sh files one visit and molecule-hold.sh holds
the molecule before the drain, so a declined demo is never a silent strand.
NEVER commit the MP4, NEVER close or route a delivered PR's anchor.
"""
formula = "mol-rig-demo"

[requires]
formula_compiler = ">=2.0.0"

[vars]

[vars.rig_name]
description = "Rig whose app is demoed. Resolved to a checkout path via `gc rig list`; also the default root for a relative serve_dir."
required = true

[vars.demo_script]
description = "Path to a ready demo:capture-format markdown script. Use this OR source_bead. Absolute, or relative to the capture session's cwd."
default = ""

[vars.source_bead]
description = "A bead whose work becomes the script, generated by following skills/gc-demo-script/SKILL.md. Use this OR demo_script."
default = ""

[vars.serve_dir]
description = "Static directory the engine serves with its built-in file server. Absolute, or relative to the rig_name checkout. One of serve_dir / serve_cmd / base_url."
default = ""

[vars.serve_cmd]
description = "Dev-server command the engine spawns, waits for, and tears down (e.g. 'npm run dev'). One of serve_dir / serve_cmd / base_url."
default = ""

[vars.base_url]
description = "URL of a server already running, driven as-is. One of serve_dir / serve_cmd / base_url."
default = ""

[vars.serve_port]
description = "Port for serve_dir / serve_cmd."
default = "5173"

[vars.capture_mode]
description = "walkthrough (default, one continuous recorded take) or proof (one checked screenshot per step)."
default = "walkthrough"

[vars.narrate]
description = "Narrate the clip when OPENAI_API_KEY is set. 'false' forces a silent, captioned clip. A missing key is always silent, never a failure."
default = "true"

[vars.deliver_subject]
description = "A bead whose pr_number/pr_url names the PR to deliver the clip to. Optional; with deliver_pr unset too, the mol reports the artifact path instead of delivering."
default = ""

[vars.deliver_pr]
description = "PR number or URL to deliver the clip to, when no deliver_subject names one. Optional."
default = ""

[[steps]]
id = "prepare-script"
title = "Resolve or generate the demo:capture script"
description = """
**1. Prime and derive the demo-request bead** (the single tracked member of the
input convoy):
```bash
gc prime
gc bd prime
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
REQUEST_BEAD=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/molecule-hold.sh" ] && [ -x "$c/assets/scripts/escalate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
: "${SCRIPTS:?molecule-hold.sh and escalate.sh not found in the pack}"
if [ -z "$REQUEST_BEAD" ]; then
  if ! "$SCRIPTS/escalate.sh" --subject "{{convoy_id}}" --key rig-demo-malformed-convoy --message "Input convoy {{convoy_id}} does not have exactly one tracked member, so mol-rig-demo cannot derive its demo-request bead; the pour is malformed and must be redone. Held at prepare-script; nothing was captured or closed."; then
    echo "escalate.sh recorded no release path; NOT holding or draining, so the step stays claimable and the next worker retries the escalation." >&2
  elif "$SCRIPTS/molecule-hold.sh" --step "mol-rig-demo.prepare-script" --bead "${CLAIMED_STEP_BEAD_ID:-}" --reason "input convoy {{convoy_id}} does not have exactly one tracked member; the pour is malformed and must be redone"; then
    gc runtime drain-ack
  else
    echo "molecule-hold did not fully land; NOT draining — something in this molecule is still claimable." >&2
  fi
  exit 1
fi
echo "demo request: $REQUEST_BEAD"
```

**2. Resolve the scenario into a script path.** The mol needs exactly one of
`demo_script` (a ready script) or `source_bead` (generate one). The resolved
path is stamped on the request bead so the capture step reads it back.

If `demo_script` is set, it must exist:
```bash
SCRIPT_PATH="{{demo_script}}"
SOURCE_BEAD="{{source_bead}}"
if [ -n "$SCRIPT_PATH" ] && [ -n "$SOURCE_BEAD" ]; then
  echo "give exactly one of demo_script / source_bead, not both" >&2
  "$SCRIPTS/escalate.sh" --subject "$REQUEST_BEAD" --key rig-demo-ambiguous-scenario --message "mol-rig-demo on $REQUEST_BEAD got both demo_script and source_bead; the scenario is ambiguous. Held at prepare-script." \
    && "$SCRIPTS/molecule-hold.sh" --step "mol-rig-demo.prepare-script" --bead "${CLAIMED_STEP_BEAD_ID:-}" --reason "both demo_script and source_bead set; scenario ambiguous" \
    && gc runtime drain-ack
  exit 1
fi
```

If `source_bead` is set instead, generate the script by following
`skills/gc-demo-script/SKILL.md` against that bead. The skill reads the bead
tree, categorizes the diff, and writes a validated demo:capture script to
`.captures/demo-scripts/<bead>-<slug>.md` (gitignored); use the path it reports
as `SCRIPT_PATH`. Follow the skill as written — it is the method, not a script
to call.

If neither is set, this is a malformed pour: escalate (key
`rig-demo-no-scenario`), hold `mol-rig-demo.prepare-script`, drain, exit 1.

**3. Record the resolved path** for the capture step and for crash recovery:
```bash
[ -n "$SCRIPT_PATH" ] && [ -f "$SCRIPT_PATH" ] || { echo "no demo script resolved at '$SCRIPT_PATH'" >&2; exit 1; }
gc bd update "$REQUEST_BEAD" --set-metadata demo_script_path="$SCRIPT_PATH" --append-notes "rig-demo: scenario resolved to $SCRIPT_PATH"
```

**Exit criteria:** a demo:capture script exists at `demo_script_path` on the
request bead.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[[steps]]
id = "capture"
title = "Capture the narrated MP4 against the rig's app"
needs = ["prepare-script"]
description = """
Re-derive the request bead and the resolved script:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
REQUEST_BEAD=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
REQUEST_JSON=$(gc bd show "$REQUEST_BEAD" --json | tr -d '\\000-\\037')
SCRIPT_PATH=$(printf '%s' "$REQUEST_JSON" | jq -r '.[0].metadata.demo_script_path // empty')
[ -n "$SCRIPT_PATH" ] && [ -f "$SCRIPT_PATH" ] || { echo "no resolved demo script on $REQUEST_BEAD; re-run prepare-script" >&2; exit 1; }
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/rig-demo-capture.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
: "${SCRIPTS:?rig-demo-capture.sh not found in the pack}"
```

**1. Resolve the app target.** Exactly one of `serve_dir` / `serve_cmd` /
`base_url` is given. A relative `serve_dir` resolves against the `rig_name`
checkout, because the app being demoed is that rig's:
```bash
RIG_PATH=$(gc rig list --json | tr -d '\\000-\\037' | jq -r --arg r "{{rig_name}}" '.rigs[]? | objects | select(.name == $r) | .path // empty' | head -n1)
SERVE_DIR="{{serve_dir}}"
case "$SERVE_DIR" in
  "" ) : ;;
  /* ) : ;;
  * ) [ -n "$RIG_PATH" ] && SERVE_DIR="$RIG_PATH/$SERVE_DIR" ;;
esac
```

**2. Choose an artifact path OUTSIDE the repo tree.** A demo clip is never
committed — no .gitattributes LFS filter covers an MP4, and delivery is to the
PR, not the tree:
```bash
OUT_DIR="${TMPDIR:-/tmp}/rig-demo/$REQUEST_BEAD"
mkdir -p "$OUT_DIR"
OUT="$OUT_DIR/{{rig_name}}-$(basename "$SCRIPT_PATH" .md).mp4"
```

**3. Capture.** `rig-demo-capture.sh` resolves the engine, lints, drives the
capture, and fails closed if no MP4 appears:
```bash
set -- --script "$SCRIPT_PATH" --output "$OUT" --mode "{{capture_mode}}" --port "{{serve_port}}"
if [ -n "$SERVE_DIR" ]; then set -- "$@" --serve-dir "$SERVE_DIR"
elif [ -n "{{serve_cmd}}" ]; then set -- "$@" --serve "{{serve_cmd}}" --cwd "${RIG_PATH:-$(pwd)}"
else set -- "$@" --base-url "{{base_url}}"
fi
[ "{{narrate}}" = "false" ] && set -- "$@" --no-narrate
if ! "$SCRIPTS/rig-demo-capture.sh" "$@"; then
  HOLD=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
    [ -x "$c/assets/scripts/molecule-hold.sh" ] && [ -x "$c/assets/scripts/escalate.sh" ] && { HOLD="$c/assets/scripts"; break; }
  done
  : "${HOLD:?molecule-hold.sh and escalate.sh not found in the pack}"
  gc bd update "$REQUEST_BEAD" --append-notes "rig-demo: capture failed for {{rig_name}} from $SCRIPT_PATH."
  if ! "$HOLD/escalate.sh" --subject "$REQUEST_BEAD" --key rig-demo-capture-failed --message "mol-rig-demo could not capture a clip of {{rig_name}} from $SCRIPT_PATH (serve_dir='$SERVE_DIR' serve_cmd='{{serve_cmd}}' base_url='{{base_url}}'). The engine or the app did not produce an MP4; a human must check the app target and the demo toolchain (doctor/check-demo-toolchain). Held at capture."; then
    echo "escalate.sh recorded no release path; NOT holding or draining." >&2
  elif "$HOLD/molecule-hold.sh" --step "mol-rig-demo.capture" --bead "${CLAIMED_STEP_BEAD_ID:-}" --reason "capture of {{rig_name}} failed to produce an MP4; check the app target and the demo toolchain"; then
    gc runtime drain-ack
  else
    echo "molecule-hold did not fully land; NOT draining." >&2
  fi
  exit 1
fi
gc bd update "$REQUEST_BEAD" --set-metadata demo_mp4_path="$OUT" --append-notes "rig-demo: captured {{capture_mode}} clip -> $OUT"
```

**Exit criteria:** a non-empty MP4 at `demo_mp4_path` on the request bead.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[[steps]]
id = "deliver-and-finalize"
title = "Deliver the clip or report it, then close the request and drain"
needs = ["capture"]
description = """
Re-derive the request bead and the captured clip:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
REQUEST_BEAD=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
REQUEST_JSON=$(gc bd show "$REQUEST_BEAD" --json | tr -d '\\000-\\037')
MP4=$(printf '%s' "$REQUEST_JSON" | jq -r '.[0].metadata.demo_mp4_path // empty')
[ -n "$MP4" ] && [ -s "$MP4" ] || { echo "no captured MP4 on $REQUEST_BEAD; re-run capture" >&2; exit 1; }
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/step-close.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
: "${SCRIPTS:?step-close.sh not found in the pack}"
```

**1. Deliver, or report.** When a PR is named — `deliver_pr` directly, or
`deliver_subject` whose pr_number/pr_url names one — attach the clip inline and
uncommitted with `demo-deliver.sh`. It pins the rig's own origin and fails
closed on a foreign PR or a missing/old gh. With no PR named, there is nothing
to deliver to: record the artifact path on the request bead and stop there.
```bash
DELIVERED=""
if [ -n "{{deliver_pr}}" ]; then
  "$SCRIPTS/demo-deliver.sh" --file "$MP4" --pr "{{deliver_pr}}" && DELIVERED="PR {{deliver_pr}}"
elif [ -n "{{deliver_subject}}" ]; then
  "$SCRIPTS/demo-deliver.sh" --file "$MP4" --subject "{{deliver_subject}}" && DELIVERED="the PR of {{deliver_subject}}"
fi
if { [ -n "{{deliver_pr}}" ] || [ -n "{{deliver_subject}}" ]; } && [ -z "$DELIVERED" ]; then
  HOLD=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
    [ -x "$c/assets/scripts/molecule-hold.sh" ] && [ -x "$c/assets/scripts/escalate.sh" ] && { HOLD="$c/assets/scripts"; break; }
  done
  : "${HOLD:?molecule-hold.sh and escalate.sh not found in the pack}"
  gc bd update "$REQUEST_BEAD" --append-notes "rig-demo: delivery failed; clip is at $MP4."
  if ! "$HOLD/escalate.sh" --subject "$REQUEST_BEAD" --key rig-demo-delivery-failed --message "mol-rig-demo captured a clip of {{rig_name}} at $MP4 but could not deliver it to the PR (deliver_pr='{{deliver_pr}}' deliver_subject='{{deliver_subject}}'). demo-deliver.sh fails closed on a foreign PR or a missing/too-old gh; a human must check the PR reference. Held at deliver-and-finalize."; then
    echo "escalate.sh recorded no release path; NOT holding or draining." >&2
  elif "$HOLD/molecule-hold.sh" --step "mol-rig-demo.deliver-and-finalize" --bead "${CLAIMED_STEP_BEAD_ID:-}" --reason "capture succeeded but delivery to the PR failed; the clip is at $MP4"; then
    gc runtime drain-ack
  else
    echo "molecule-hold did not fully land; NOT draining." >&2
  fi
  exit 1
fi
```

**2. Close the demo-request bead.** This bead is the mol's own — no refinery or
reviewer disposes of it — so the pass that fulfilled it closes it, naming where
the clip went. Do NOT close or route a delivered PR's anchor; the clip is a
comment on the PR, not a change to its lifecycle.
```bash
OUTCOME="reported (clip at $MP4)"
[ -n "$DELIVERED" ] && OUTCOME="delivered to $DELIVERED"
gc bd update "$REQUEST_BEAD" --status=closed --set-metadata gc.outcome=recorded --append-notes "rig-demo: $OUTCOME."
```

**3. Close the step chain forward, then drain.** Forward order (each step blocks
the next); close only through step-close.sh, which resolves by
(gc.root_bead_id, gc.step_ref). Never close an injected `workflow-finalize`
(the control-dispatcher's):
```bash
SC="$SCRIPTS/step-close.sh"
for STEP in prepare-script capture deliver-and-finalize; do
  "$SC" --step "mol-rig-demo.$STEP" --outcome pass || echo "step-close: mol-rig-demo.$STEP was not this session's to close — left for the finalizer"
done
gc runtime drain-ack
```

**Exit criteria:** the clip delivered or its path reported, the request bead
closed, the step chain closed forward, the session drained.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }
