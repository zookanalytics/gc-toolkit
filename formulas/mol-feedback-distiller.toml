description = """
mol-feedback-distiller — turn pending feedback observations into reviewed
prompt-update proposals, on judgment rather than counters.

Agents and the miner record corrective feedback as observation beads
(task_kind=observation, closed at creation, provenance-keyed). This formula
runs on a daily heartbeat order; the D7 gate here is the real cadence — it
scopes the JUDGING of observations (volume / urgency / age), never the run:
the retirement pass over adopted rules is unconditional, every run. Judging
uses the learning-distill rubric (D6: promotion is a reasoned judgment — a
standing directive or operator-endorsed observation promotes at N=1, a
diff-scoped nit waits for recurrence; counts and heat are inputs, never
arithmetic). Output: at most a few change-unit `prompt-update` beads. Each
waits for the operator's placement, then rides the pool worker -> refinery ->
operator-review pipeline (D3). Base rate: ZERO or ONE proposals per run; a
chatty run is a smell.

A proposal names a CARRIER before it names rule text: a conventions bullet,
an operator-profile entry, a work-quality entry, a review-rubric dimension, or
an exemplar pair.
The carrier decides the target file, the budget, and which gates apply; the
rubric holds the selection rule.

Each cluster of observations lives on a pattern bead
(`task_kind=feedback-pattern`), which is backlog work this formula triages.
Every run leaves each pattern decided: closed once resolved, waiting on the
follow-up it spawned, or deferred with a date while it gathers evidence. A
closed pattern reopens when its feedback recurs.

Agent memory notes are the loop's second intake. read-memory ends the waits
that are done, and the due notes join the pending set, so the cadence gate
counts them and the judge reads each one by the rubric's memory section
beside the observations. file-and-dispatch applies each note's decision. The
mechanics are `assets/scripts/memory-intake.sh`.

Read-only plus bead-filing: this formula never edits a fragment, prompt, or
skill — only an operator-merged PR changes agent behavior.

Every step closes its own bead through `assets/scripts/claim-close.sh --step
<step-id>` (resolved into `$SC` at the top of each shell block).
No-op arms close their OWN bead and end their shell WITHOUT draining (the
successors re-derive the gates and no-op cheaply; only the terminal step
drains). `DISTILL_RUN` (open | gated | aborted | off-home) is session state;
a worker waking fresh re-runs load-and-gate through its cadence gate to
rebuild it — never guesses.

Spec: specs/2026-08-learning-system/implementation-design.md §3; rulings D5-D7.
"""
formula = "mol-feedback-distiller"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Agent identity prefix with trailing dot. Non-empty default on purpose: this formula is poured by a gc order, and order dispatch injects no routing vars."
required = false
default = "gc-toolkit."

[vars.distill_min_pending]
description = "Cadence-gate floor (D7): judge when pending observations reach this count. Urgent observations (obs.endorsed=operator or obs.directive=standing) never wait on volume."
required = false
default = "5"

[vars.distill_max_age_days]
description = "Trickle guard (D7): when the oldest pending observation exceeds this age, the run proceeds regardless of count."
required = false
default = "14"

[vars.max_beads_per_run]
description = "Maximum prompt-update/engineering beads filed per run; dropped survivors re-surface next cycle (state is durable, so this is naturally resumable)."
required = false
default = "3"

[vars.fragment_bullet_cap]
description = "Bullet budget per learned-conventions fragment. A promotion past the cap must name a displacement in the same proposal or it does not file."
required = false
default = "15"

[vars.profile_entry_cap]
description = "Entry budget for the operator profile (carrier: profile). Same displacement rule as fragment_bullet_cap."
required = false
default = "12"

[vars.work_quality_entry_cap]
description = "Entry budget per work-quality fragment — the shared base or any one per-class fragment (carrier: work-quality). Same displacement rule as fragment_bullet_cap."
required = false
default = "12"

[vars.exemplar_cap]
description = "Entry budget for the exemplar corpus, template-fragments/learning-exemplars.template.md (carrier: exemplar). Read per review rather than per turn, so the cap is larger per unit of cost and still bounded."
required = false
default = "8"

[vars.pattern_defer_days]
description = "How long a held pattern waits for the recurrence it is held for: judge-and-cluster §7 defers it for this many days, and a pattern whose deferral ends with no new evidence is dismissed by a run that has judged the pending observations, since one of them may be its recurrence. It sets when a pattern is looked at again, not what its evidence earns: the rubric judges that."
required = false
default = "90"

[vars.rig_list]
description = "Space-separated rig names whose stores hold observations (D5). Empty = runtime enumeration; if that fails, the run aborts fail-safe — never judge on a partial observation set."
required = false
default = ""

[vars.memory_notes_per_run]
description = "How many due memory notes one run judges, oldest first. The rest stay due and are judged by later runs in turn."
required = false
default = "200"

[[steps]]
id = "read-memory"
title = "Read the city's agent memory: end the waits that are done, tidy the indexes, count the due notes"
description = """
Agent memory notes are the loop's second intake. `memory-intake.sh` holds the
mechanics, and the learning-distill skill's memory section is how the judge
reads a note. Run:

`"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/memory-intake.sh" read`

Off the pack's home rig it prints `off-home` and changes nothing. On it, it
places the memory directory of each of the city's rigs and of its root as
Claude Code does, files a finding for a place it cannot resolve, removes each
note whose fix has landed and keeps its text, makes a note due again when its
wait ended with no fix landed, first marking one whose rule the operator vetoed
so agents stop following it, takes out the index and collection-note lines that
link a note no longer there, rewrites each index's guidance block, and prints
how many notes are due. load-and-gate seeds the pending set with them.
A non-zero exit names what it could not do, and the run goes on.

Then close this step (non-terminal: the same session then takes load-and-gate
with `gc hook --claim --json`):

`"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" --step mol-feedback-distiller.read-memory --outcome pass`

**Exit criteria:** the read printed its places and how many notes are due, or
off-home. Bead closed on every path; session NOT drained.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[[steps]]
id = "load-and-gate"
title = "Prime, home-rig gate, read pending observations cross-rig, apply the D7 cadence gate"
needs = ["read-memory"]
description = """
## 1. Prime and home-rig gate

```bash
SC="$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" && [ -x "$SC" ] || SC=""
gc prime
gc bd prime
REPO="$(git rev-parse --show-toplevel)"
# Load-bearing: judge-and-cluster reads the rubric and the adopted-rule
# inventory from origin/main, never the working tree (no workspace-setup step
# keeps this checkout current). Fail-soft — a failed fetch falls back to the
# last-known origin/main.
git -C "$REPO" fetch origin main --quiet || true

DISTILL_RUN=open   # open | gated | aborted | off-home
# Prompt updates are edits to the pack repo, authorable only from its home
# rig; every importing rig fires this order, so anywhere else is a clean
# no-op, not an error.
if ! { [ -f "$REPO/pack.toml" ] && grep -q '^name *= *"gc-toolkit"' "$REPO/pack.toml"; }; then
  DISTILL_RUN=off-home
  echo "DISTILL_RUN=off-home — not the gc-toolkit pack home rig; nothing to distill here."
  "${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.load-and-gate --outcome pass
  exit 0
fi
```

## 2. Cross-rig pending-observation read (D5)

Pending = observation beads not yet stamped `obs.distilled` (observations
are CLOSED at creation, so list closed). The due memory notes, at most
{{memory_notes_per_run}} and oldest first, seed the set, each marked by its
`memory_ref`. FAIL-SAFE: an unreadable rig set or
an unreadable listing for ANY store sets `DISTILL_RUN=aborted`, closes this
step `--outcome fail`, and files nothing — never judge on partial data.

```bash
SC="$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" && [ -x "$SC" ] || SC=""
# Rig set: a poured {{rig_list}} wins; else enumerate. `gc rig list --json`
# returns an OBJECT ({"rigs":[...]}), and the HQ entry is addressable only by
# PATH (`--rig <city>` fails) — so carry name + path per line.
# >>> distiller-pending-scratch
RIGSET=$(mktemp "${TMPDIR:-/tmp}/gctk-feedback-distiller.XXXXXX")
# The later blocks read $PENDING, so the trap keeps it only once this block
# reaches the handoff at its end. Every earlier exit removes it with the rest.
# The `.next` merge scratch is never handed on. An unset $RAW or $PENDING is
# guarded because `rm -f "$RAW.pending"` would otherwise name `.pending` in
# the cwd.
RAW=""
PENDING=""
PENDING_HANDOFF=""
distill_scratch_rm() {
  rm -f "$RIGSET"
  [ -n "$RAW" ] && rm -f "$RAW" "$RAW.pending"
  if [ -n "$PENDING" ]; then
    rm -f "$PENDING.next"
    [ -n "$PENDING_HANDOFF" ] || rm -f "$PENDING"
  fi
  return 0
}
trap distill_scratch_rm EXIT; trap 'exit 130' INT; trap 'exit 143' TERM; trap 'exit 129' HUP
POURED="{{rig_list}}"
if [ -n "$POURED" ]; then
  printf '%s' "$POURED" | tr ' ' '\\n' | grep -v '^$' > "$RIGSET"
else
  gc rig list --json 2>/dev/null | jq -r '.rigs[] | select((.name // "") != "") | [.name, (.path // "")] | @tsv' 2>/dev/null > "$RIGSET"
fi
if [ ! -s "$RIGSET" ]; then
  DISTILL_RUN=aborted
  echo "FAIL-SAFE: no rig_list poured and rig enumeration returned nothing — DISTILL_RUN=aborted, nothing judged, nothing filed"
  "${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.load-and-gate --outcome fail
  exit 0
fi

# memory-intake.sh sits beside the claim-close.sh that $SC names. It prints
# the due notes, or [] when it cannot read them.
PENDING=$(mktemp "${TMPDIR:-/tmp}/gctk-feedback-distiller.XXXXXX"); "${SC%/*}/memory-intake.sh" due --limit {{memory_notes_per_run}} > "$PENDING"
# `while read < file`, never `for R in $RIGS` (zsh does not word-split).
# Open a store by PATH when known (`gc bd -C <path>` — also reaches HQ),
# by NAME only for poured names.
TAB=$(printf '\\t')
while IFS="$TAB" read -r R RPATH; do
  [ -n "$R" ] || continue
  [ -n "$RAW" ] && rm -f "$RAW" "$RAW.pending"
  RAW=$(mktemp "${TMPDIR:-/tmp}/gctk-feedback-distiller.XXXXXX")
  if [ -n "$RPATH" ]; then
    gc bd -C "$RPATH" list -l observation --status=closed --json --limit=0 > "$RAW" 2>/dev/null
  else
    gc bd --rig "$R" list -l observation --status=closed --json --limit=0 > "$RAW" 2>/dev/null
  fi
  if ! jq -e 'type=="array"' "$RAW" >/dev/null 2>&1; then
    DISTILL_RUN=aborted
    echo "FAIL-SAFE: observation listing for store $R unreadable — DISTILL_RUN=aborted, nothing judged, nothing filed"
    "${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.load-and-gate --outcome fail
    exit 0
  fi
  # obs_rig_path rides along so file-and-dispatch's stamping reopens the SAME
  # store.
  jq --arg rig "$R" --arg rigpath "$RPATH" '[.[]
      | select((.metadata.task_kind // "") == "observation")
      | select((.metadata["obs.distilled"] // "") == "")
      | . + {obs_rig: $rig, obs_rig_path: $rigpath}]' "$RAW" > "$RAW.pending"
  jq -s 'add' "$PENDING" "$RAW.pending" > "$PENDING.next" && mv "$PENDING.next" "$PENDING"
done < "$RIGSET"
# The pending set is complete: hand it past the trap to the later blocks.
PENDING_HANDOFF=1
# <<< distiller-pending-scratch
```

## 3. The cadence gate (D7)

Judge iff: pending >= {{distill_min_pending}}, OR any pending observation is
urgent (`obs.endorsed=operator` / `obs.directive=standing`), OR the oldest
pending exceeds {{distill_max_age_days}} days (an unparseable timestamp
forces the trickle guard OPEN, not shut).

```bash
# >>> distiller-cadence-gate
N=$(jq 'length' "$PENDING")
URGENT=$(jq '[.[] | select(((.metadata["obs.endorsed"] // "") == "operator")
                        or ((.metadata["obs.directive"] // "") == "standing"))] | length' "$PENDING")
NOW=$(date -u +%s)
OLDEST=$(jq -r '[.[] | (.created_at // .created // empty)] | sort | first // empty' "$PENDING")
AGE_D=0
if [ -n "$OLDEST" ]; then
  if OLDEST_S=$(jq -rn --arg t "$OLDEST" '$t | fromdateiso8601' 2>/dev/null); then AGE_D=$(( (NOW - OLDEST_S) / 86400 )); else AGE_D=$(( {{distill_max_age_days}} + 1 )); fi
elif [ "$N" -gt 0 ]; then
  AGE_D=$(( {{distill_max_age_days}} + 1 ))
fi
if [ "$N" -ge "{{distill_min_pending}}" ] || [ "$URGENT" -gt 0 ] || [ "$AGE_D" -gt "{{distill_max_age_days}}" ]; then
  DISTILL_RUN=open
  echo "DISTILL_RUN=open — gate open: $N pending, $URGENT urgent, oldest ${AGE_D}d"
else
  DISTILL_RUN=gated
  echo "DISTILL_RUN=gated — $N pending, none urgent, oldest ${AGE_D}d; no observation is judged this run"
  # Empty the JUDGEABLE set and fall through — nothing is stamped on a gated
  # run, so all $N stay pending and still count toward the next gate;
  # judge-and-cluster's retirement pass (inputs: the fragments on disk) still
  # runs every run.
  echo '[]' > "$PENDING"
fi
# <<< distiller-cadence-gate
```

## 4. Vetoed-PR sweep (the D6 meta-loop's input)

A filed `prompt-update` bead whose PR was CLOSED unmerged is an operator
veto — over-promotion evidence. File ONE observation per veto
(`obs.category=learning-rubric`, provenance `pr:<owner/repo>#<n>:veto`),
deduped on that provenance and category against the full observation
surface (all live statuses + closed) BEFORE filing; an unreadable dedup
surface skips the sweep rather than risking duplicates. Find vetoes
through the PRs of CLOSED prompt-update beads carrying
`merge_result=pull_request` (the pipeline closes the bead when the PR
opens): a PR now CLOSED = vetoed, MERGED =
adopted, OPEN = in flight. Skip cleanly when gh or the repo slug is
unavailable. Vetoes filed this sweep are judged by the NEXT gate-opening
run.

Then close this step (non-terminal: the same session then takes the next step
with `gc hook --claim --json`, carrying $REPO, $PENDING, $DISTILL_RUN, and the
rig set):
```bash
"${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.load-and-gate --outcome pass
```

**Exit criteria:** disposition decided and echoed as `$DISTILL_RUN`; on
`open`, `$PENDING` holds every undistilled observation across every store
(HQ included), each tagged obs_rig/obs_rig_path, and the due memory notes
this run judges; on `gated`, `$PENDING` is empty; new vetoes recorded. Bead
closed on every path; session NOT drained.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[[steps]]
id = "judge-and-cluster"
title = "Judge the pending set with the learning-distill rubric; cluster onto pattern beads; run the retirement pass; leave every pattern decided"
needs = ["load-and-gate"]
description = """
A judging task, not a counting script. The method is the learning-distill
rubric, read from `origin/main` at run time — the file is the source of
truth; never restate it in parallel prose.

## 0. Carry the run disposition

```bash
SC="$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" && [ -x "$SC" ] || SC=""
REPO="${REPO:-$(git rev-parse --show-toplevel)}"
if ! { [ -f "$REPO/pack.toml" ] && grep -q '^name *= *"gc-toolkit"' "$REPO/pack.toml"; }; then
  echo "DISTILL_RUN=off-home — nothing to judge here."
  "${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.judge-and-cluster --outcome pass
  exit 0
fi
if [ "${DISTILL_RUN:-}" = "aborted" ]; then
  # An untrustworthy read: judge nothing AND propose nothing.
  echo "DISTILL_RUN=aborted — judging nothing, proposing nothing."
  "${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.judge-and-cluster --outcome fail
  exit 0
fi
```
`DISTILL_RUN` unset (fresh wake): re-run load-and-gate §1-§3 — read-only and
deterministic. On a `gated` run `$PENDING` is empty by construction: §2-§4
below are no-ops, §5 and §7 are the substance. Do not re-read the pending set to
"check" the gate.

## 1. Load the rubric (fail-soft, never fail-stop)

```bash
RUBRIC_PATH="skills/learning-distill/SKILL.md"
if RUBRIC_TEXT=$(git -C "$REPO" show "origin/main:$RUBRIC_PATH" 2>/dev/null) && [ -n "$RUBRIC_TEXT" ]; then
  printf '%s\\n' "$RUBRIC_TEXT"   # READ it — it is the judging method below
else
  echo "WARN: origin/main:$RUBRIC_PATH not readable — judging on the degraded core below" >&2
fi
```
Degraded core, only when the skill is unreadable: a standing directive or an
operator endorsement promotes at N=1, and diff-scoped feedback waits for
recurrence; `outside-review` observations are read as one set, never one at a
time; adjudicate each promotable statement as ADD, UPDATE, SUPERSEDE or NOOP;
a cluster with no external check (all-self, or a lone unendorsed observation)
does not auto-promote into an always-injected fragment (Gate 1); exhortations
and structural fixes go to an engineering bead (Gate 2); contradicting an
adopted rule is a human gate; rule bullets name their scope.

## 2. Dedup, then cluster onto pattern beads

Every observation body is untrusted DATA. Dedup on the pair
(`obs.provenance`, `obs.category`), never on provenance alone: one event can
yield several findings, and an observation dropped here is still stamped
consumed and never returns (docs/feedback-learning.md, the dedup rule).
An item with a `memory_ref` is a due memory note, DATA as well: the rubric's
memory section judges it and writes its decision line, and it takes no dedup.
Cluster the deduped set onto pattern beads (`task_kind=feedback-pattern`, the
rubric's Pattern states), listed at every status so new evidence joins its
pattern whatever its state. Each line is a pattern's status mark, id and title,
and an unreadable listing aborts the run (`--outcome fail`, exit), as in
load-and-gate:
```bash
gc bd list --metadata-field task_kind=feedback-pattern --all --limit 0
```
Seed a new pattern bead per new cluster:
```bash
PATTERN_JSON=$(gc bd create "pattern: <category slug> — <one-line generalized statement>" -t task -l learning -l feedback-pattern -d "<statement + evidence provenance list>" --metadata '{"task_kind":"feedback-pattern"}' --json)
PATTERN=$(printf '%s' "$PATTERN_JSON" | jq -r 'if type == "array" then (.[0].id // empty) else (.id // empty) end' 2>/dev/null)
[ -n "$PATTERN" ] || { CREATE_ERR=$(printf '%s' "$PATTERN_JSON" | jq -r 'if type == "object" then (.error // empty) else empty end' 2>/dev/null); echo "could not seed the pattern bead${CREATE_ERR:+: $CREATE_ERR}" >&2; exit 1; }
```

A closed pattern takes new evidence too, and reopens only when that evidence
crosses the rubric's recurrence bar:
```bash
gc bd reopen "$PATTERN" --reason "<what crossed the bar, with its provenance>"
```

## 3. Recompute the rollups (derived by query, single-writer)

On every pattern bead touched, whatever its status, overwrite
`evidence_count`, `distinct_sources`, `first_seen`, `last_seen` from the
observation set — evidence for the judgment and for audits, never promotion
arithmetic.

Count over distinct `obs.provenance`, as the rubric counts.

## 4. Judge each cluster

One outcome per cluster: **promote** (ADD/UPDATE/SUPERSEDE, reasoning
written down — the D3 reviewer judges from the PR alone), **hold** (say
what recurrence would change the call), **contest** (becomes a human gate in
file-and-dispatch), **discard with reason**, **surface** (Gate 1 block — hold
awaiting corroboration or operator endorsement), or **route-to-engineering**
(Gate 2 — file-and-dispatch files an engineering bead instead). §7 turns each
outcome into the pattern's state.

## 5. Retirement pass over adopted rules — EVERY run (gated runs included)

Inventory = every adopted entry across every carrier, read from origin/main.
`learning-recurrence.sh --inventory` is the shared parser (it skips the
seeded placeholders); do not re-derive the same anchor grep here:
```bash
REPO="${REPO:-$(git rev-parse --show-toplevel)}"
RECUR="$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/learning-recurrence.sh" && [ -x "$RECUR" ] || RECUR=""
if [ -n "$RECUR" ]; then
  "$RECUR" --inventory --repo "$REPO" --ref origin/main
  # origin/main, because a working tree can be stale or hold unmerged entries.
  # A non-zero exit refuses a partial city: judge without the metric.
  "$RECUR" --repo "$REPO" --ref origin/main || echo "WARN: recurrence report declined to run; retirement questions answered without it" >&2
else
  echo "WARN: learning-recurrence.sh not found; retirement pass runs without the inventory or the metric" >&2
fi
```
Ask each adopted entry the rubric's retirement questions. A promotion past its
carrier's budget ({{fragment_bullet_cap}} conventions bullets,
{{profile_entry_cap}} profile entries, {{work_quality_entry_cap}} work-quality
entries, {{exemplar_cap}} exemplars) must name its displacement or it does not
file.

## 6. Dedup proposals against in-flight work, then bound

Check live prompt-update beads AND the open PRs of closed ones. The same dedup keeps a concurrent peer pour from double-filing: the later
run's survivors empty here and it finalizes as a no-op. Cap survivors at
{{max_beads_per_run}}, strongest-reasoned first.

## 7. Leave every pattern decided — EVERY run (gated runs included)

Put each pattern this run judged that is not closed, and each one `bd ready`
lists, in one of the rubric's Pattern states. The ready read also wakes a
pattern whose deferral date has passed:
```bash
gc bd ready --metadata-field task_kind=feedback-pattern --limit 0
```
One this run did not judge is decided from its record, as the rubric says.

**Closed.** A pattern ships no commit, so it closes with
`gc.work_outcome=no-op` for the work-record gate:
```bash
gc bd update "$PATTERN" --set-metadata gc.work_outcome=no-op
```
```bash
gc bd close "$PATTERN" --reason "<resolved: rule adopted in <carrier file> | resolved: follow-ups <ids> closed | dismissed: <why>>"
```
**Waiting.** file-and-dispatch writes the edge onto each follow-up it files.
Reopen a closed pattern that takes one (`gc bd reopen`), and undefer a deferred
one (`gc bd undefer`). An open follow-up from an earlier run with no edge gets
one now, when both ids carry one prefix:
```bash
gc bd dep add "$PATTERN" "<the open follow-up>" --type=blocks
```
**Deferred.** For {{pattern_defer_days}} days, with the block it is held on:
```bash
gc bd update "$PATTERN" --set-metadata "promotion_hold=<the block, such as gate1-single-source-self>"
```
```bash
gc bd defer "$PATTERN" --until "+{{pattern_defer_days}}d" --reason "<the recurrence that would change the call>"
```
A hold back in `bd ready` with no new evidence has had its window: dismiss it.
If this run leaves observations or due memory notes unjudged, one may be its
recurrence, so defer it `--until +12h` with a reason that says so, as the
rubric defers a survivor §6 dropped at the cap.

Then close this step (non-terminal; the session carries the survivors and
the consumed-observation map forward):
```bash
"${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.judge-and-cluster --outcome pass
```

**Exit criteria:** judgeable set deduped and judged into pattern beads with
recomputed rollups (vacuous on a gated run); retirement pass asked of every
adopted rule; a bounded proposal list with written reasoning; contested
rules marked; every pattern decided (§7); a consumed map
`(obs id, obs rig, obs rig path) -> pattern` and a decision line for each
memory note judged, for file-and-dispatch. Bead closed on every path;
session NOT drained.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[[steps]]
id = "file-and-dispatch"
title = "File one prompt-update bead per proposal, stamp consumed observations, gate contested rules, drain"
needs = ["judge-and-cluster"]
description = """
The TERMINAL step, the one place this workflow drains.

It MUST finalize on every path: close its own bead, then
`gc runtime drain-ack`, even with nothing to file. Never leave it `open` or
`blocked`: the order is single-flight on an open root, so a step blocked here
stalls the distiller until a person runs
`gc order sweep-tracking --include-wisps feedback-distiller`.

## 0. Carry the run disposition

```bash
SC="$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" && [ -x "$SC" ] || SC=""
REPO="${REPO:-$(git rev-parse --show-toplevel)}"
if ! { [ -f "$REPO/pack.toml" ] && grep -q '^name *= *"gc-toolkit"' "$REPO/pack.toml"; }; then
  echo "DISTILL_RUN=off-home — no bead filed, no observation stamped."
  "${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.file-and-dispatch --outcome pass
  gc runtime drain-ack
  exit 0
fi
if [ "${DISTILL_RUN:-}" = "aborted" ]; then
  echo "DISTILL_RUN=aborted — no bead filed, no observation stamped."
  "${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.file-and-dispatch --outcome fail
  gc runtime drain-ack
  exit 0
fi
```
`DISTILL_RUN` unset: rebuild via load-and-gate §1-§3; never file on a
guess. A `gated` run reaches here normally with an empty consumed map and
possibly retirement proposals — file those like any survivor.

## 1. File one bead per surviving proposal

A proposal waits for the operator's placement sitting like any finding, so it
is filed held with Gas City's `hold:mayor` label and routed to no pool
(docs/feedback-learning.md, *The promotion path*).
```bash
BODY="## Rule
- Carrier: <convention | profile | work-quality | review-rubric | exemplar>
- Action: <ADD | UPDATE | SUPERSEDE | RETIRE | HARDEN>
- Exact text: <the bullet, entry, dimension, or before/after pair>

## Target
- convention    -> template-fragments/learned-conventions-<role>.template.md (cap {{fragment_bullet_cap}})
- profile       -> template-fragments/operator-profile.template.md (cap {{profile_entry_cap}}); needs an obs.source=operator observation
- work-quality  -> template-fragments/work-quality-<base | class>.template.md (cap {{work_quality_entry_cap}} per fragment), the fragment the rubric's carrier table names; no operator observation required
- review-rubric -> skills/review-correctness/SKILL.md, What to check; its anchor goes in skills/review-correctness/rubric-ledger.md, one line ending with the dimension it amends, never in SKILL.md (a reviewer reads the whole method file)
- exemplar      -> template-fragments/learning-exemplars.template.md (cap {{exemplar_cap}})
- learning-rubric proposals target skills/learning-distill/SKILL.md, no anchor and no inventory row: the rubric is the loop's own method, not an adopted rule the retirement pass judges
- Anchor: <!-- rule:$PATTERN src:<short provenance refs> adopted:<YYYY-MM-DD> -->

## Evidence
- Pattern bead: $PATTERN (evidence_count=<n>, distinct_sources=<k>, first_seen=<date>, last_seen=<date>)
- Provenance (full list): <every obs.provenance key behind this proposal>

## Reasoning
<the rubric's stated judgment — the D3 reviewer must be able to judge from the PR alone>"

# >>> distiller-file-for-placement
# The hold rides the create, so the bead is never in the store without the label
# that puts it in the sitting's queue. target=main and merge_strategy=mr are for
# the polecat that builds it once it is placed: they send its branch through the
# refinery to the operator's review.
PROPOSAL_META='{"task_kind":"prompt-update","target":"main","merge_strategy":"mr"}'
BEAD_JSON=$(gc bd create "prompt-update: <add|retire|harden> — <rule summary>" -t task -l learning -l prompt-update -l hold:mayor -d "$BODY" --metadata "$PROPOSAL_META" --json)
BEAD=$(printf '%s' "$BEAD_JSON" | jq -r 'if type == "array" then (.[0].id // empty) else (.id // empty) end' 2>/dev/null)
[ -n "$BEAD" ] && [ "$BEAD" != "null" ] || { CREATE_ERR=$(printf '%s' "$BEAD_JSON" | jq -r 'if type == "object" then (.error // empty) else empty end' 2>/dev/null); echo "WARN: could not create prompt-update bead for $PATTERN${CREATE_ERR:+ ($CREATE_ERR)}; skipping" >&2; continue; }
echo "filed prompt-update $BEAD for placement (pattern $PATTERN)"
# <<< distiller-file-for-placement
```
The pattern waits on its proposal and records it, so a later run reads what
it spawned:
```bash
gc bd dep add "$PATTERN" "$BEAD" --type=blocks
```
```bash
gc bd update "$PATTERN" --set-metadata "proposal_bead=$BEAD" --set-metadata "proposal_carrier=<carrier>" --set-metadata "proposal_action=<action>"
```

## 1b. Engineering beads (Gate 2 outcomes)

A route-to-engineering cluster gets ONE ordinary work bead describing the
mechanical fix (lint / doctor check / gate / code change). It waits for
placement the same way: `-l hold:mayor` on its create, and no route. It
carries no task_kind=prompt-update and no bullet-cap accounting. Dedup on the
pattern bead's `eng_bead` first (skip while it or its PR is live).
The pattern waits on it and records the outcome, so later runs neither
re-judge toward prose nor file a duplicate:
```bash
gc bd dep add "$PATTERN" "$EBEAD" --type=blocks
```
```bash
gc bd update "$PATTERN" --set-metadata remedy_class=structural --set-metadata "eng_bead=$EBEAD"
```
Engineering beads count against {{max_beads_per_run}}.

## 2. Stamp every consumed observation (zero-proposal runs included)

Judged is the criterion, not seen: every observation judged into a pattern
this run — promoted, held, NOOPed, contested, discarded — is stamped so it
never re-counts toward the D7 gate; on a gated run the map is empty and
NOTHING is stamped. Reopen
the store each observation was read from, by the same rule load-and-gate used:
```bash
if [ -n "$OBS_RIG_PATH" ]; then
  gc bd -C "$OBS_RIG_PATH" update "$OBS_ID" --set-metadata "obs.distilled=$PATTERN"
else
  gc bd --rig "$OBS_RIG" update "$OBS_ID" --set-metadata "obs.distilled=$PATTERN"
fi
```

## 2b. Apply each memory note's decision (none on a gated run)

Once the beads the decision lines name are filed, apply the run's lines (the
rubric's memory section) in one call:
`"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/memory-intake.sh" apply <the decisions file>`.
A `refused` line is a note that changed since it was read: it stays, due again.

## 3. Contested rules: file a human gate, never a flip

A contested rule is a human gate on its pattern bead under the key
`distiller-contention`: the pattern's rule waits on the operator's ruling.
```bash
SCRIPTS=$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir) && [ -x "$SCRIPTS/human-gate.sh" ] || SCRIPTS=""
"${SCRIPTS:?human-gate.sh not found in the pack}/human-gate.sh" --subject "$PATTERN" --key distiller-contention \
  --message "Contested rule: <rule summary>
<the adopted rule with its anchor + original provenance, versus the new contradicting evidence; likely outcomes scope-narrowing / retirement / dismissal — the operator picks>" >/dev/null \
  || { echo "human-gate.sh filed no gate on $PATTERN — stop, address what it reported, and re-run this block" >&2; exit 1; }
```

## 4. Every pattern is decided

It prints `[]` once each pattern is closed, deferred or waiting. Decide any it
lists (judge-and-cluster §7) before draining.
```bash
gc bd ready --metadata-field task_kind=feedback-pattern --brief --json --limit 0
```

## 5. Summarize and drain

```bash
SC="$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" && [ -x "$SC" ] || SC=""
echo "distiller complete (DISTILL_RUN=${DISTILL_RUN:-open}): filed F prompt-update(s), E engineering bead(s), held/surfaced H, G human gate(s), discarded D, stamped S observation(s)."
# The loop's success metric, in the log of the run that moved it.
REPO="${REPO:-$(git rev-parse --show-toplevel 2>/dev/null)}"
RECUR="$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/learning-recurrence.sh" && [ -x "$RECUR" ] || RECUR=""
if [ -n "$RECUR" ]; then
  # origin/main: the working tree can be stale or hold unmerged proposals.
  "$RECUR" --repo "$REPO" --ref origin/main || echo "WARN: recurrence report declined to run (an unreadable store refuses a partial number)" >&2
else
  echo "WARN: learning-recurrence.sh not found; no recurrence metric this run" >&2
fi
# The pending set's last use; each block is its own shell, hence the guard.
[ -n "${PENDING:-}" ] && rm -f "$PENDING"
"${SC:?claim-close.sh not found in the pack}" --step mol-feedback-distiller.file-and-dispatch --outcome pass
gc runtime drain-ack
```

**Never** close a filed prompt-update bead, and never edit a fragment,
prompt, or skill here: only the operator's merge of a built PR changes
behavior."""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }
