description = """
Witness patrol loop — rig work-health RECOVERY only. Poured as a root-only
wisp on startup (the agent prompt's startup reconcile adopts before it
pours):

  gc bd mol wisp mol-witness-patrol --root-only --var binding_prefix='{{binding_prefix}}'
  gc bd update $WISP --assignee=$GC_AGENT

The pour passes the binding prefix and nothing else, so the cycle wait is the
formula's default as it stood when this wisp was poured. It is rendered here
for the step that reads it:

  event_timeout={{event_timeout}}

Each wisp is ONE iteration: mail, orphan recovery, refinery queue health,
pour the next iteration. Steps are not materialized; read each description
as you reach it. Never exit the wisp from an intermediate step — continue,
or jump to next-iteration to pour and burn.

Scope: the witness recovers work whose owner died, files ONE warrant bead
for the dog pool when an owner is alive but wedged, files a bug bead for the
polecat pool when mail reports a defect in the pack, and watches the refinery
queue. It does NOT manage processes (controller), write code
(polecats), merge (refinery/cadence), kill sessions directly (the dog pool
executes warrants), or run the batch unnamed-wait triage (the
liveness-sweep exec order owns that surface). A finding becomes one deduped
BEAD through assets/scripts/patrol-finding.sh, and a proactive first reaction
disposes it: routed to a pool, held on an edge, or escalated to the operator
as a visit. assets/scripts/escalate.sh is for what a patrol cannot express as
a bead — an emergency that needs a human now.

Every address this formula stamps or queries comes from
assets/scripts/resolve-route.sh. The agents it files to do not share a scope:
the dog is city-scoped and its identity carries no rig segment, while the
polecat and refinery pools are rig-scoped and carry `<rig>/`. The qualifier that
reaches one is invisible to the other, and either stamp reads back clean, so a
hand-written address is right only by luck. A query by a hand-written address
fails just as quietly: listing beads by an address no agent holds returns a
valid empty array, which reads as an empty queue.

Marked blocks (bug-dispatch, notice-finding, candidate-pipeline,
host-bead-skip, downstream-court-skip, topology-root-skip,
liveness-map-guard, liveness-lookup, warrant-file, husk-guard,
owning-store-guard, recovery-stamp-gate, crash-loop-window,
patrol-wisp-pour, refinery-stuck-escalate) are extracted and executed by
their tests; keep markers, keep them backslash-free."""
formula = "mol-witness-patrol"

[vars]
[vars.binding_prefix]
description = "Agent identity prefix with trailing dot. Non-empty default on purpose: this patrol builds its refinery, polecat, and dog routing addresses from it, and an empty prefix renders bare roles like <rig>/refinery that no agent holds."
default = "gc-toolkit."

[vars.event_timeout]
description = "Seconds to wait before the next cycle. Spent as a bounded until-loop (the harness blocks a standalone sleep, which removes pacing entirely). Ceiling 600: the harness caps one call at 600s and SIGTERMs past it. Neither the startup pour nor the next-iteration pour passes it, so each wisp renders this default as it stands when that wisp is poured."
default = "600"

[[steps]]
id = "check-inbox"
title = "Check mail"
description = """
```bash
gc mail inbox
```
Triage HELP/blocked mail from polecats: unblock what you can (point at
docs, suggest an approach); a blocker you cannot becomes a finding bead
(`patrol-finding.sh --scope witness-findings --key polecat-help --about <the
polecat's bead> ...`), and the reaction decides whether it is work, a wait, or
a question for the operator. `--about` is what keeps two blocked polecats two
findings. Emergencies (crash, data loss, corruption, security) go straight to
escalate.sh — they need a human now, not a disposition.
A `DOG_DONE:` notice is a completed shutdown dance on a warrant this rig
filed — note the outcome (the closed warrant carries the evidence) and
archive.

Mail reporting a defect in the pack itself, a formula or script fault the
sender hit and worked around, is none of those: it needs a polecat rather
than a human. File it as a bug bead routed at the polecat pool, resolving
the address rather than writing the qualifier by hand. The route rides the
create rather than a second write: a bug that exists before it is routed is
an open bead offered to nobody for as long as that second write is
outstanding, and a second write that fails leaves it that way for good. Set
TITLE and BODY first:
```bash
# >>> bug-dispatch
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/resolve-route.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
# resolve-route.sh echoes its input UNVERIFIED on an unreadable roster (exit 3)
# and this block stamps what it prints, so the input itself must be claimable.
# The polecat pool is rig-scoped, so hand the resolver the rig-qualified form:
# on a readable roster it still resolves to whatever is live, and the exit-3
# fallback is a claimable address rather than the unclaimable bare role.
POOL=$("$SCRIPTS/resolve-route.sh" "${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat") || true
if [ -z "$POOL" ]; then
  echo "no live polecat identity resolves from '${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat'; a bug filed at a guessed address is offered to nobody, so escalate instead of filing." >&2
else
  BUG_JSON=$(gc bd create "$TITLE" -t bug -d "$BODY" --metadata "$(jq -nc --arg p "$POOL" '{"gc.routed_to":$p}')" --json)
  BUG=$(printf '%s' "$BUG_JSON" | jq -r 'if type == "array" then (.[0].id // empty) else (.id // empty) end' 2>/dev/null)
  if [ -n "$BUG" ] && [ "$BUG" != "null" ]; then
    echo "filed + routed bug $BUG to $POOL"
  else
    CREATE_ERR=$(printf '%s' "$BUG_JSON" | jq -r 'if type == "object" then (.error // empty) else empty end' 2>/dev/null)
    echo "gc bd create reported no id${CREATE_ERR:+ ($CREATE_ERR)}; look for a bug already routed at $POOL before filing this again." >&2
  fi
fi
# <<< bug-dispatch
```

A `NOTICE:` is never chatter. It reports a fact about shared state the sender
does not own, so it leaves a tracked record before it is archived. A pack
defect goes through bug-dispatch above and an emergency through escalate.sh.
Every other notice becomes a finding through the notice-finding block below.
Mail that asks you to act where you may not is the same, whatever its subject:
reaping a molecule, reconciling or closing another agent's beads, re-homing a
bead. The finding is the request's record, and its first reaction routes the
act to whoever may perform it.

The block files one mail per run. Set MAIL_ID first. KEY names the situation
the mail reports, the way every finding key does, and ABOUT is the bead it
concerns, left empty when it names none. NOTE is optional and adds what you
know that the sender did not. The block copies the mail into the finding
verbatim and archives the mail only after the finding is filed. When nothing is
filed, the mail stays unread and the next cycle files it:
```bash
# >>> notice-finding
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/patrol-finding.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
# peek leaves the mail unread. The control-byte strip keeps a raw byte from
# failing the parse; the body's escaped newlines survive it.
MAIL_JSON=""
if [ -n "${MAIL_ID:-}" ]; then
  MAIL_JSON=$(gc mail peek "$MAIL_ID" --json | tr -d '[:cntrl:]') || MAIL_JSON=""
fi
MAIL_SUBJECT=$(printf '%s' "$MAIL_JSON" | jq -r '.message.subject // empty' 2>/dev/null) || MAIL_SUBJECT=""
NOT_FILED=""
[ -n "$SCRIPTS" ] || NOT_FILED="patrol-finding.sh is not in the pack"
[ -n "${KEY:-}" ] || NOT_FILED="KEY is unset"
[ -n "$MAIL_SUBJECT" ] || NOT_FILED="the mail is unreadable"
[ -n "${MAIL_ID:-}" ] || NOT_FILED="MAIL_ID is unset"
if [ -n "$NOT_FILED" ]; then
  echo "notice-finding: nothing filed for mail '${MAIL_ID:-}': $NOT_FILED. The mail stays unread for the next cycle." >&2
  [ -z "${MAIL_ID:-}" ] || gc mail mark-unread "$MAIL_ID" >/dev/null 2>&1 || true
else
  MAIL_BODY=$(printf '%s' "$MAIL_JSON" | jq -r '.message.body // ""') || MAIL_BODY=""
  MAIL_FROM=$(printf '%s' "$MAIL_JSON" | jq -r '.message.from // "unknown"') || MAIL_FROM="unknown"
  MAIL_SENT=$(printf '%s' "$MAIL_JSON" | jq -r '.message.created_at // "unknown"') || MAIL_SENT="unknown"
  FINDING_TEXT="$MAIL_BODY

## Source
Mail $MAIL_ID from $MAIL_FROM, sent $MAIL_SENT. Subject: $MAIL_SUBJECT"
  if [ -n "${NOTE:-}" ]; then
    FINDING_TEXT="$FINDING_TEXT

## Witness
$NOTE"
  fi
  MAIL_TITLE="${MAIL_SUBJECT#NOTICE: }"
  [ -n "$MAIL_TITLE" ] || MAIL_TITLE="$MAIL_SUBJECT"
  if "$SCRIPTS/patrol-finding.sh" --scope witness-findings --key "$KEY" --about "${ABOUT:-}" --title "$MAIL_TITLE" --message "$FINDING_TEXT"; then
    gc mail archive "$MAIL_ID" >/dev/null || echo "notice-finding: filed, but mail $MAIL_ID did not archive. The next cycle files it again, and the finding counts that as a recurrence." >&2
  else
    echo "notice-finding: patrol-finding.sh filed nothing for mail $MAIL_ID. The mail stays unread for the next cycle." >&2
    gc mail mark-unread "$MAIL_ID" >/dev/null 2>&1 || true
  fi
fi
# <<< notice-finding
```
Lifecycle chatter is mail that reports the sender's own progress and asks for
nothing. Acknowledge it and archive it.

Inbox near-empty after this step. Close it and continue."""

[[steps]]
id = "recover-orphaned-beads"
title = "Recover orphaned work beads"
needs = ["check-inbox"]
description = """
**The witness's core job.** Find beads assigned to agents that will never
process them, salvage unpublished worktree work, and return the beads to the
pool. Each stage is a function in `assets/scripts/witness-recovery.sh`, whose
comments say why each rule holds. Every block below sources it first, because
each command is a fresh shell; run a candidate's stages in one command, since
they hand state through shell variables:
```bash
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/witness-recovery.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
. "${SCRIPTS:?witness-recovery.sh not found in the pack}/witness-recovery.sh"
```

**1. Candidates.** `witness_candidates` prints one `<bead> <owner>` row per
owned candidate. It drops beads that name no owner, beads whose work already
reached a downstream court (an in-flight PR, or `gc.routed_to=human`), and
graph.v2 topology roots. No rows means no candidates. A `did not parse` line
means the listing itself failed, so orphan recovery is blind this cycle: skip
the rest of this step, file it (`patrol-finding.sh --scope witness-findings
--key witness-candidates-unreadable --title "witness orphan-candidate listing
did not parse" --message "<the listing's stderr>"`), and continue to
check-refinery. Two more exclusions are structural: infrastructure identities
(refinery, witness, deacon, mechanik, configured named sessions), whose
lifecycle the controller owns, and dispatcher-routed control beads
(`gc.routed_to=control-dispatcher`, `gc.kind=workflow-finalize`/`ralph`).

**2. Liveness.** Build the map once per cycle, before reading any bead, then
resolve each candidate's owner:
```bash
witness_liveness_map; echo "MAP_TRIP=$MAP_TRIP MAP_COUNT=$MAP_COUNT"
OWNER="<owner>"; witness_liveness_lookup; echo "STATE=$STATE"
```
**Fail safe:** `MAP_TRIP` is the entire test. A non-empty one means the map
failed to load and would false-orphan live agents. Skip orphan recovery this cycle, file it
(`patrol-finding.sh --scope witness-findings --key witness-empty-liveness-map
--title "witness liveness map failed to load" --message "$MAP_TRIP"`), and
continue to check-refinery. An owner that resolves `absent` against a POPULATED
map is never grounds for the fail safe: it is the orphan signal.

Classify `STATE`: `active`/`awake` is not orphaned, but a live owner whose bead
shows no progress is the warrant path below. `creating`, `asleep`, `drained`,
`suspended`, `draining` and `quarantined` are not orphaned: the controller or
operator still owns them. `archived`, `closed` and `absent` are orphaned pool
work, decided only after BOTH the exact lookup and the normalizing retry.

**2b. Live but wedged -> ONE warrant.** An `active`/`awake` owner whose work
bead is stale (no `updated_at` movement and no wisp progress for longer than
the work plausibly needs) is wedged, not orphaned. First ask the recovery
order, never the pane: `quota-park-nudge.sh --status <session>`, where
`quota_park=yes` is a healthy park, so defer and file nothing. Otherwise file
ONE warrant for the dog pool, never killing directly. Set REASON to what is
stale and for how long; `file-warrant.sh` resolves OWNER to a live session id
and refuses a warrant no dog can execute:
```bash
# >>> warrant-file
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/file-warrant.sh" ] && [ -x "$c/assets/scripts/resolve-route.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
DOG=$("$SCRIPTS/resolve-route.sh" "{{binding_prefix}}dog") || true
if [ -z "$DOG" ]; then
  echo "no live dog identity resolves from '{{binding_prefix}}dog'; a warrant nothing claims leaves the session wedged and still reports success, so escalate instead of filing." >&2
else
  "$SCRIPTS/file-warrant.sh" --owner "$OWNER" --reason "$REASON" --requester witness --dog "$DOG"
  case $? in
    0|3) : ;;  # a warrant was filed, or one was already open for this session
    *) echo "file-warrant.sh refused to file for owner '$OWNER' (it resolved to no live session id); escalate this wedged session instead of leaving it silently un-warranted." >&2 ;;
  esac
fi
# <<< warrant-file
```
If the dog executes, the dead session's beads return through this step next
cycle.

**3-6. Recover each orphaned bead** in one command, with `BEAD` and `OWNER` set
from its row:
```bash
BEAD="<bead>"; OWNER="<owner>"
witness_salvage_context; echo "REPO_CTX=$REPO_CTX BRANCH_ON_ORIGIN=$BRANCH_ON_ORIGIN"
witness_salvage_scope; witness_nothing_to_salvage; witness_husk_guard
witness_salvage
witness_verify; echo "BRANCH_MERGED=$BRANCH_MERGED"
witness_owning_store; witness_worktree_cleanup
witness_dispose; echo "DISPOSE_RESULT=$DISPOSE_RESULT DISPOSE_RC=$DISPOSE_RC"
witness_recovery_stamp_gate; witness_prev_recovery; witness_crash_loop_window
witness_record; echo "STAMP_RECOVERY=$STAMP_RECOVERY CRASH_LOOP=$CRASH_LOOP COUNT=$COUNT"
```
Act on what the stages report:
- `REPO_CTX` other than `ok`: the owning repo was not found, so escalate
  (`escalate.sh --subject <bead> --key witness-branch-recovery-unknown ...`) and
  treat the branch's state as unknown, never gone.
- A work bead whose salvage was refused (a husk, a wrong origin, a missing
  work_dir) while its branch is not on the owning origin may have lost work.
  File it best-effort and carry on, since recovery is load-bearing:
  `patrol-finding.sh --scope witness-findings --key witness-salvage-refused
  --about <bead> ...`. A source bead that never had a worktree files nothing.
- `BRANCH_MERGED`: `yes`, the work landed, so escalate the observation, close
  the bead, and clean the worktree; `no`, it returns to the pool through the
  disposal; `skip`, nothing to verify; `unknown`, do NOT reset or call the work
  discardable, but escalate (`--key witness-branch-recovery-unknown`) and leave
  the bead for a human.
- An owning-store refusal leaves the worktree standing: escalate
  (`escalate.sh --subject <bead> --key witness-unplaceable-owner ...`).
  Disposal runs either way.
- `DISPOSE_RC=3` is a partial write, a half-released bead that needs a finding
  (`patrol-finding.sh --scope witness-findings --key witness-partial-release
  --about <bead> ...`), not a retry.
- `STAMP_RECOVERY=1` with `CRASH_LOOP=1`: file a finding naming the two
  recoveries that were close together,
  `--key witness-crash-loop --about <bead>`. `recovered_count` outside the window is a bead that keeps coming
  back, recorded as evidence, and not this key.

**PRESERVE `metadata.branch` on every recovery** — it is where the next polecat
resumes from; a recovery that strips it re-does the work.

Continue to check-refinery — do NOT exit the wisp here."""

[[steps]]
id = "check-refinery"
title = "Check refinery queue health"
needs = ["recover-orphaned-beads"]
description = """
Escalate a refinery handoff that has gone genuinely stuck, and the blind
monitor when the queue cannot be read at all — but never transient churn.

The beads still assigned to the refinery are its inbound queue: fresh handoffs
and rebase/rework tasks, which turn over on their own within a poll interval or
the fix pool's work time. Their count is churn, not a health signal. What a
human must see is one bead that has sat untouched far past that turnover, which
the refinery session is failing to advance. `refinery-stuck-escalate.sh` files
one visit per such bead, escalates once when the queue cannot be read or the
refinery address names no live agent, and retracts a visit moot once its
handoff's own row shows it closed, prepared, or reassigned. Its header says why
each arm is shaped as it is.

Pass the binding prefix this patrol was poured with:
```bash
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/refinery-stuck-escalate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
"${SCRIPTS:?refinery-stuck-escalate.sh not found in the pack}/refinery-stuck-escalate.sh" --binding-prefix "{{binding_prefix}}"
```
A stuck bead reaches a human through a re-derived visit rather than a nudge
whose count goes stale. Close this step and continue to next-iteration."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["check-refinery"]
description = """
**Config: event_timeout = {{event_timeout}}**

**1. Pour the next iteration and burn this one, both BEFORE the wait — and
GUARD the assign.** The pour and the assign are separate writes; a wisp poured
but not assigned reaches no hook and drops the loop, invisibly (the prompt's
title-scoped startup reconcile is the backstop, not the fix). Burning this
wisp is folded in right after the assign so it precedes the wait: a session
reset during that wait has already poured and assigned its successor and
burned itself, so the next boot adopts the successor instead of orphaning this
wisp. Pass exactly the vars the startup pour passes, which is binding_prefix
alone, and nothing else. An omitted var renders the formula's current default
on the new wisp, while a passed one keeps the first wisp's value for as long
as the chain runs, so a default changed on main would never reach it. Keep
each gc command on ONE line (TOML eats a trailing backslash).

`GC_BEAD_ID` is empty on a fresh session, so the fallback that resolves the
current wisp has to work: a wisp is an EPHEMERAL molecule, which means
`--type=molecule --include-infra` plus the title filter. Any narrower query
reads empty, and an unresolved current wisp is one that never burns.

```bash
# >>> patrol-wisp-pour
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --include-infra --limit=0 --json | jq -r '[.[] | select(.title == "mol-witness-patrol")][0].id // empty')
fi
NEXT=$(gc bd mol wisp mol-witness-patrol --root-only --var binding_prefix='{{binding_prefix}}' --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next witness wisp; NOT burning this one."
  exit 1
fi
gc bd update "$NEXT" --set-metadata gc.rig="$GC_RIG" || true  # rig-stamp before assign so an interrupted pour leaves a rig-scoped orphan
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign poured wisp $NEXT; rolling it back and NOT burning this one."
  gc bd mol burn "$NEXT" --force || echo "Rollback burn of $NEXT failed; startup reconcile will collect it."
  exit 1
fi
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current wisp; not burning."
  exit 1
fi
# <<< patrol-wisp-pour
```
If the pour or assign guard fires, this wisp is unburned and its successor was
rolled back or never poured: stay on the current wisp and retry next cycle,
skipping the wait below. If the pour succeeded but no current wisp resolves,
the successor is already live, so this exit hands off to it and leaves any
stray to the title-scoped reconcile.

**2. Wait before the next cycle** — a bounded clock-poll in ONE tool call
(the harness blocks a standalone sleep, and caps one call at 600s):
```bash
end=$(( $(date +%s) + {{event_timeout}} ))
until [ "$(date +%s)" -ge "$end" ]; do sleep 5; done
```

Re-read the plain `gc formula show mol-witness-patrol` for step order (not
the full --json; pull one step's description only as you reach it).

**Exit criteria:** the next wisp poured and assigned, this one burned, and the
inter-cycle wait elapsed — or a guard fired and this wisp survives for the
retry."""
