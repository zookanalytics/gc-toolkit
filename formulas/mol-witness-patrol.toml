description = """
Witness patrol loop — rig work-health RECOVERY only. Poured as a root-only
wisp on startup (the agent prompt's startup reconcile adopts before it
pours):

  gc bd mol wisp mol-witness-patrol --root-only --var binding_prefix='{{binding_prefix}}' --var event_timeout='{{event_timeout}}'
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: mail, orphan recovery, refinery queue health,
pour the next iteration. Steps are not materialized; read each description
as you reach it. Never exit the wisp from an intermediate step — continue,
or jump to next-iteration to pour and burn.

Scope: the witness recovers work whose owner died, files ONE warrant bead
for the dog pool when an owner is alive but wedged, and watches the
refinery queue. It does NOT manage processes (controller), write code
(polecats), merge (refinery/cadence), kill sessions directly (the dog pool
executes warrants), or run the batch unnamed-wait triage (the
liveness-sweep exec order owns that surface). Escalations go through
assets/scripts/escalate.sh — one open visit per situation key.

Marked blocks (host-bead-skip, liveness-map-guard, liveness-lookup, husk-guard,
crash-loop-window, patrol-wisp-pour, refinery-queue-nudge) are extracted and
executed by their tests; keep markers, keep them backslash-free."""
formula = "mol-witness-patrol"

[vars]
[vars.binding_prefix]
description = "Agent identity prefix, including trailing dot when bound."
default = ""

[vars.event_timeout]
description = "Seconds to wait before the next cycle. Spent as a bounded until-loop (the harness blocks a standalone sleep, which removes pacing entirely). Ceiling 600: the harness caps one call at 600s and SIGTERMs past it."
default = "600"

[[steps]]
id = "check-inbox"
title = "Check mail"
description = """
```bash
gc mail inbox
```
Triage HELP/blocked mail from polecats: unblock what you can (point at
docs, suggest an approach); a blocker that needs a human becomes a visit
via escalate.sh (`--subject <the polecat's bead> --key polecat-help`).
Emergencies (crash, data loss, corruption, security) escalate immediately.
A `DOG_DONE:` notice is a completed shutdown dance on a warrant this rig
filed — note the outcome (the closed warrant carries the evidence) and
archive. Lifecycle chatter is acknowledged and archived. Inbox near-empty
after this step. Close it and continue."""

[[steps]]
id = "recover-orphaned-beads"
title = "Recover orphaned work beads"
needs = ["check-inbox"]
description = """
**The witness's core job.** Find beads assigned to agents that will never
process them, salvage unpublished worktree work, and return the beads to
the pool. Canonical chain: worktree -> (push) -> branch -> (merge) ->
target; recovery ensures work reaches the branch, then the bead is
schedulable again.

**1. Candidates.** List this rig's beads and keep only OWNED ones:
```bash
gc bd list --status=in_progress --json --limit=0
gc bd list --status=open --json --limit=0
```
```bash
# >>> host-bead-skip
# Keep only beads that name an OWNER, and stamp that owner as `.owner` for the
# liveness loop. Reads the bead-list array on stdin, writes the surviving array
# on stdout — apply it to the combined in_progress + open listing before the
# per-bead liveness loop.
#
# A bead names its owner in up to three places and only one of them is an
# assignee. A workflow STEP bead has no assignee at all: gc bd list --json omits
# the key when it is empty, and the step names its owner in
# metadata.gc.session_id, which is what gc.session_affinity=require pins it to.
# A workflow ROOT bead names only metadata.gc.session_name.
#
# Precedence runs session id, then assignee, then session name. Only the id
# names a session that will never come back. It is re-stamped on every claim, so
# it always names the session actually holding the bead. The other two are labels
# a successor inherits: pool work is assigned to the slot, and the slot stays
# live under whoever holds it next. A crashed pool session leaves a bead whose
# assignee and session name both name that still-live slot, so resolving it on
# either label reports the successor's life as the dead owner's, and the bead
# stays in_progress under an owner that never returns.
jq -c '[ .[]
  | . as $bead
  | (.metadata // {}) as $m
  | ([ ($m["gc.session_id"] // ""), (.assignee // ""), ($m["gc.session_name"] // "") ]
     | map(select(. != "")) | first) as $owner
  | select($owner != null)
  | $bead + {owner: $owner} ]'
# <<< host-bead-skip
```
A bead naming no owner in any of the three places is already in the pool's
court, and it is the only thing this filter drops. There is no owned-bead class
orphan recovery must skip on kind alone: a visit whose session died SHOULD
return to the pool (cold continuity is respawn-and-reconstitute). Two
exclusions are structural, not kind-based:
- **Infrastructure identities** (refinery, witness, deacon, mechanik,
  configured named sessions) — the controller owns their lifecycle.
- **Dispatcher-routed control beads** (`gc.routed_to=control-dispatcher`,
  `gc.kind=workflow-finalize`/`ralph`) — infrastructure, not orphans; the
  serve loop picks them up.

**2. Liveness — session-ID liveness, never template matching.** Pool
instances get NEW ids on restart, so pattern-matching an assignee against a
template false-negatives forever. Build the identity->state map ONCE per
cycle, before the first bead is read, keyed on id / name / session_name /
alias / agent_name / configured_named_identity. Stream both blobs through
temp files, never --argjson (ARG_MAX):
```bash
# >>> liveness-map-guard
# Builds the map and answers the ONE question the fail safe asks: did the map
# itself fail to load. Sets LIVENESS_MAP, MAP_COUNT, and MAP_TRIP. MAP_TRIP is
# empty when the map is usable and carries the escalation reason otherwise. This
# runs once per cycle with no bead in scope, so no bead's owner can reach the
# decision.
SESSIONS_RAW=$(mktemp)
SESSION_BEADS=$(mktemp)
gc session list --state=all --json > "$SESSIONS_RAW" 2>/dev/null || true
gc bd list --type=session --label=gc:session --include-infra --all --json --limit=0 > "$SESSION_BEADS" 2>/dev/null || true
# The session list is the load-bearing source. A non-object, or an object with
# no .sessions array, is the READ failing, which is a different fact from a
# city that reports no sessions.
SESSIONS_OK=0
if jq -e 'type == "object" and (.sessions | type) == "array"' "$SESSIONS_RAW" >/dev/null 2>&1; then
  SESSIONS_OK=1
fi
# Normalize both sources to a shape the builder cannot fail on, so MAP_COUNT is
# a number on every path and the trip below is decided by SESSIONS_OK rather
# than by how the builder happened to die. The session beads contribute keys
# when they can and are never required: an unusable answer from them
# contributes nothing rather than failing the cycle.
[ "$SESSIONS_OK" = "1" ] || printf '{"sessions":[]}' > "$SESSIONS_RAW"
jq -e 'type == "array"' "$SESSION_BEADS" >/dev/null 2>&1 || printf '[]' > "$SESSION_BEADS"
LIVENESS_MAP=$(jq -n --slurpfile s "$SESSIONS_RAW" --slurpfile b "$SESSION_BEADS" '
  def kv($st): [ .id, .name, .session_name, .alias, .agent_name, .configured_named_identity ]
    | map(select(type == "string" and . != "")) | map({key: ., value: $st});
  # Bead keys first, session-list keys second: from_entries lets the later
  # entry win, which keeps the authoritative source authoritative.
  [ (($b[0] // [])[] | kv(.status // "active")) ]
  + [ (($s[0].sessions // [])[] | kv(.state // "active")) ]
  | add // {} | from_entries' 2>/dev/null) || LIVENESS_MAP=""
MAP_COUNT=$(printf '%s' "$LIVENESS_MAP" | jq 'length' 2>/dev/null) || MAP_COUNT=""
# Ordered by authority, and total: a count that is not a number means the
# builder died behind a source that read fine, which is still a map that
# cannot be trusted. Falling through to an empty MAP_TRIP would skip the
# fail safe on an unusable map, so the two assignments above absorb their own
# failure: under `set -e` an abort would leave MAP_TRIP unset, and unset reads
# as no trip.
MAP_TRIP=""
if [ "$SESSIONS_OK" != "1" ]; then
  MAP_TRIP="session list unreadable"
else
  case "$MAP_COUNT" in
    ''|*[!0-9]*) MAP_TRIP="liveness map unreadable" ;;
    0)           MAP_TRIP="liveness map empty" ;;
  esac
fi
rm -f "$SESSIONS_RAW" "$SESSION_BEADS"
# <<< liveness-map-guard
```

**Fail safe — never orphan on an empty map, and never on anything else.**
`MAP_TRIP` is the entire test. A non-empty `MAP_TRIP` means the map failed to
load, which would false-orphan live agents. Skip orphan recovery this cycle
and escalate
(`escalate.sh --subject <the standing subject> --key witness-empty-liveness-map ...`),
then continue to check-refinery. The subject is never this wisp: next-iteration
burns it, and the converse sitting writes its takeaway to the subject the visit
tracks, so a subject that dies each cycle loses its disposition. Use
this rig's standing subject — the open bead carrying `task_kind=triage-subject`
and `triage.scope=witness-findings`, created once if no open one exists.

An owner that resolves `absent` against a POPULATED map is never grounds for
the fail safe. Closed sessions are excluded from `gc session list` on every
path by design, so a bead naming a session that has since closed always
resolves absent and `--state=closed` never returns a row. That is permanent,
not drift, and it is the orphan signal the classification below prescribes.
The session beads answer with an empty array on a healthy city, because
`gc bd list` drops `issue_type=session` outright, so an empty second source is
not an empty map either. A map that omits sessions you can name is the steady
state this step is built to read.

Resolve the `.owner` the filter stamped on each bead — the loop's `OWNER` —
exact-first, with exactly ONE narrow fallback: the last `/`-segment, resolved
toward LIFE (a collision with any non-closed session reads as alive; the retry
can un-orphan, never manufacture an orphan). A session id is a map key like any
other, so the same two passes answer for an assignee, a session name, and a
session id:
```bash
# >>> liveness-lookup
# Exact lookup first: authoritative whenever the owner is a literal map key.
STATE=$(printf '%s' "$LIVENESS_MAP" | jq -r --arg a "$OWNER" '.[$a] // "absent"')
# Identity-normalizing fallback. Stripping the prefix can make two sessions in
# different cities collide on one bare identity, so resolve a collision toward
# LIFE: any matching session that is not closed/archived wins. Only when EVERY
# candidate owner is dead does the fallback report a dead state.
if [ "$STATE" = "absent" ]; then
  STATE=$(printf '%s' "$LIVENESS_MAP" | jq -r --arg a "$OWNER" '
    def bare: sub("^.*/"; "");
    [ to_entries[] | select((.key | bare) == ($a | bare)) | .value ] as $matches
    | if ($matches | length) == 0 then "absent"
      else ([ $matches[] | select(. != "closed" and . != "archived") ] | first) // $matches[0]
      end')
fi
# <<< liveness-lookup
```
Classify: `active`/`awake` -> not orphaned — but a live owner whose bead
shows no progress is the warrant path below, not a punt.
`creating`/`asleep`/`drained`/`suspended`/
`draining`/`quarantined` -> not orphaned (controller/operator still owns
it). `archived`/`closed`/`absent` — but only after BOTH the exact lookup and the
normalizing retry — -> orphaned pool work. Never classify on the exact
lookup alone: a rig-qualified assignee whose session registered the bare
alias resolves `absent` there while its owner is active.

**2b. Live but wedged -> ONE warrant.** An `active`/`awake` owner whose
work bead is stale (no `updated_at` movement and no wisp progress for
longer than the work plausibly needs — judgment over the same signals as
always, no new thresholds) is wedged, not orphaned. First ask the recovery
order, never the pane (pane text is agent-controlled output):
`quota-park-nudge.sh --status <session>` — `quota_park=yes` is a healthy
park: defer, file nothing this cycle. Otherwise file ONE warrant for the
dog pool, dedup'd on the target like an escalation key — never kill
directly:
```bash
OPEN_WARRANT=$(gc bd list --status=open,in_progress --metadata-field "warrant.target=<session>" --limit=1 --json | jq -r 'if type == "array" then (.[0].id // empty) else empty end')
if [ -z "$OPEN_WARRANT" ]; then
  gc bd create --type=task --title="Stuck: <agent>" --metadata '{"warrant.target":"<session>","warrant.reason":"No progress on <bead> for <duration>","warrant.requester":"witness","gc.routed_to":"{{binding_prefix}}dog"}' --label=warrant
fi
```
The dog pool runs mol-dog-shutdown-dance (three bounded interrogations,
pardon-or-execute, DOG_DONE notice back); if it executes, the dead
session's beads return through THIS step next cycle.

**3. Salvage.** Read `metadata.work_dir` and `metadata.branch` from the
bead. Before ANY salvage git write, assert the work_dir is its OWN worktree
root — a husk directory (worktree removed, dir survives) lets `cd` succeed
while every git command resolves to the ENCLOSING repo, so `git add -A &&
git push` would publish the town repo's working tree:
```bash
# >>> husk-guard
WORKTREE_SAFE=0
if [ -n "$WORKTREE" ] && [ -d "$WORKTREE" ]; then
  EXPECTED_ROOT=$(cd "$WORKTREE" && pwd -P)
  ACTUAL_ROOT=$(git -C "$WORKTREE" rev-parse --show-toplevel 2>/dev/null)
  if [ -n "$ACTUAL_ROOT" ] && [ "$ACTUAL_ROOT" = "$EXPECTED_ROOT" ]; then
    WORKTREE_SAFE=1
  else
    echo "witness: REFUSING salvage for <bead> — work_dir $WORKTREE is a husk (git toplevel='${ACTUAL_ROOT:-<none>}' != worktree root '$EXPECTED_ROOT'); skipping add/commit/push to avoid town-repo contamination." >&2
  fi
fi
# <<< husk-guard
```
If the branch is already on origin (`git ls-remote --heads origin $BRANCH`,
run from the RIG ROOT — a husk resolves `origin` from the wrong repo), the
worktree is disposable: go to step 4. Otherwise salvage — every git write
gated on the guard:
```bash
if [ "$WORKTREE_SAFE" = "1" ]; then
  cd "$WORKTREE"
  git status --porcelain
  # Commit whatever is uncommitted/untracked, then publish the branch. All
  # work is useful work — never discard.
  git add -A
  git commit -m "witness: salvage work from orphaned agent (<bead>)" || true
  BRANCH=$(git branch --show-current)
  git push origin HEAD
  gc bd update <bead> --set-metadata branch="$BRANCH"
else
  echo "husk or missing work_dir — REFUSING salvage writes (see HUSK GUARD); nothing salvageable." >&2
fi
```
When nothing is salvageable (no worktree and no branch on origin, or the
guard refused), escalate the refusal best-effort
(`escalate.sh --subject <bead> --key witness-salvage-refused ...`) and fall
through — recovery is load-bearing, the notice advisory.

**4. Verify before reset.** If the branch is already reachable from the
target (`git merge-base --is-ancestor origin/$BRANCH origin/main`), the
work landed: escalate the observation, close the bead, clean the worktree.
Otherwise reset:

**5. Cleanup + return to pool.** Remove the worktree (from the rig root:
`git worktree remove <path> --force; git worktree prune`). Then hand the bead
to `orphan-dispose.sh`, which picks the disposal from what the bead IS:

```bash
OD=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/orphan-dispose.sh" ] && { OD="$c/assets/scripts/orphan-dispose.sh"; break; }
done
if [ -z "$OD" ]; then
  echo "orphan-dispose.sh not found — NOT disposing of <bead>; it stays owned and returns next cycle" >&2
else
  "$OD" <bead> --owner "$OWNER" --apply
fi
```

Four kinds reach it and only two are returned to the pool. A **visit** gives up
its assignee and nothing else, because its route, continuation group and
task_kind are its identity. A **workflow step** gives up the dead session's pin
and keeps the rest, so the molecule resumes at that same step under whoever
claims it next. A **workflow root** is skipped: nothing claims a root, it closes
when its workflow-finalize step closes, and setting it open, unassigned and
routed is what makes a pool offer the root itself as work. Everything else is a
**source bead** and goes to `gc workflow delete-source --apply` followed by
`gc workflow reopen-source`.

Those two commands are the source arm alone. `delete-source` matches workflow
roots on `gc.source_bead_id`, a root poured from an input convoy carries no such
key, and so it reports `already_clean` for a graph.v2 chain whichever of its ids
it is handed. Running the pair on a step or a root therefore performs no close
and reopens live molecule machinery into a pool.

Exit 3 is a PARTIAL write: some fields landed and some did not, the bead is now
half-released, and it needs an escalation
(`escalate.sh --subject <bead> --key witness-partial-release ...`), not a retry.

**PRESERVE `metadata.branch` on every recovery** — it is where the next
polecat resumes from; a recovery that strips it re-does the work.

**6. Record the recovery. A crash loop is a RATE, not a mark.** A bare
`recovered=true` is a flag nothing clears, so reading a repeat recovery off
its presence makes every bead ever recovered a permanent escalation
candidate, and that population only grows. Two recoveries three days apart
are two incidents; a loop is recurrence faster than the work can progress
between them. Read the history the bead already carries BEFORE the stamp below
overwrites it, decide against a window, then stamp it forward:
```bash
PREV=$(gc bd show <bead> --json | tr -d '[:cntrl:]' | jq -r '.[0].metadata // {} | [(.recovered_at // ""), (.recovered_count // ""), (.recovered // "")] | @tsv')
PREV_AT=$(printf '%s' "$PREV" | cut -f1)
PREV_COUNT=$(printf '%s' "$PREV" | cut -f2)
PREV_FLAG=$(printf '%s' "$PREV" | cut -f3)
```
```bash
# >>> crash-loop-window
# Inputs: PREV_AT, PREV_COUNT and PREV_FLAG — metadata.recovered_at,
# recovered_count and recovered as they stood BEFORE this recovery, each empty
# when the key is absent. Sets NOW_AT, COUNT, and CRASH_LOOP=1 only when the
# previous recovery falls inside the window.
#
# An absent or unparseable PREV_AT is UNKNOWN, never "long ago, therefore a
# loop". Beads carrying a bare recovered=true predate this record and hold no
# evidence of recurrence at all, so they stamp a first timestamp and escalate
# nothing: the legacy population drains in one pass instead of escalating
# itself. The flag still proves one prior recovery, so the count it seeds is 2.
CRASH_LOOP_WINDOW="${CRASH_LOOP_WINDOW:-21600}"
NOW_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
case "${PREV_COUNT:-}" in
  ''|*[!0-9]*) case "${PREV_FLAG:-}" in true) COUNT=2 ;; *) COUNT=1 ;; esac ;;
  *)           COUNT=$((PREV_COUNT + 1)) ;;
esac
CRASH_LOOP=0
# The empty case is split off because `date -d ''` does not fail: GNU date
# resolves it to midnight TODAY, which reads as a recovery minutes ago through
# the small hours and turns every legacy bead into a loop until 06:00 UTC.
PREV_EPOCH=""
case "${PREV_AT:-}" in
  '') : ;;
  *)  PREV_EPOCH=$(date -u -d "$PREV_AT" +%s 2>/dev/null || printf '') ;;
esac
NOW_EPOCH=$(date -u +%s)
# `if`, not `[ ... ] && CRASH_LOOP=1`: a false test makes that AND-list the
# block's last command and its exit status 1, so under `set -e` the caller dies
# on the ordinary not-a-loop path, which is the one taken almost every cycle.
case "$PREV_EPOCH" in
  ''|*[!0-9]*) : ;;
  *) if [ "$((NOW_EPOCH - PREV_EPOCH))" -lt "$CRASH_LOOP_WINDOW" ]; then CRASH_LOOP=1; fi ;;
esac
# <<< crash-loop-window
```
```bash
gc bd update <bead> --set-metadata recovered=true --set-metadata "recovered_at=$NOW_AT" --set-metadata "recovered_count=$COUNT"
```
Escalate `--key witness-crash-loop` only when `CRASH_LOOP=1`, and say which
two recoveries were close together — a visit that reports only "recovered
before" asks a human to re-derive the interval. `recovered_count` outside the
window is a bead that keeps coming back rather than one that is looping; it is
recorded here so that signal can be built from evidence, and it is not this
key.

Continue to check-refinery — do NOT exit the wisp here."""

[[steps]]
id = "check-refinery"
title = "Check refinery queue health"
needs = ["recover-orphaned-beads"]
description = """
```bash
# >>> refinery-queue-nudge
REFINERY="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
# Under a strict shell a plain VAR=$(...) capture exits the step at a failed
# listing, before the arms below can tell an unreadable queue from an empty
# one.
if QUEUE=$(gc bd list --assignee="$REFINERY" --status=open --json --limit=0); then QUEUE_RC=0; else QUEUE_RC=$?; fi
printf '%s' "$QUEUE" | jq -r '.[] | [.id, .updated_at, .title] | @tsv' || true
DEPTH=$(printf '%s' "$QUEUE" | jq 'if type == "array" then length else empty end' 2>/dev/null) || DEPTH=""
# The nudge asserts a backlog, so only a counted one may send it: an
# unconditional send leaves a real backlog worded exactly like the
# empty-queue ones. Anything that is not a bead array counts nothing to
# assert — an error body is an object, whose length is its field count.
case "${DEPTH:-}" in
  ''|*[!0-9]*) DEPTH="" ;;
esac
if [ "$QUEUE_RC" -ne 0 ] || [ -z "$DEPTH" ]; then
  echo "check-refinery: queue listing unreadable (rc=$QUEUE_RC); not nudging" >&2
elif [ "$DEPTH" -eq 0 ]; then
  echo "check-refinery: queue empty; not nudging" >&2
else
  OLDEST=$(printf '%s' "$QUEUE" | jq -r 'sort_by(.updated_at // "") | .[0].updated_at // "unknown"')
  gc session nudge "$REFINERY" "Merge queue: $DEPTH open bead(s) assigned to you, oldest untouched since $OLDEST."
fi
# <<< refinery-queue-nudge
```
Look for: **stale beads** (assigned long ago, untouched — the refinery may
be stuck), **queue depth** (a pile means stuck or overwhelmed), **empty
queue** (usually fine — but a near-miss assignee on a handoff is missing
from this listing, not absent from the city; read the cadence's pass log
before calling it healthy).
Escalate only what a human must act on — a stuck queue, never an
approval-gated one (a PR awaiting the operator is a resting state worth
zero escalations):
```bash
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/escalate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
"$SCRIPTS/escalate.sh" --subject <bead> --key witness-refinery-queue --message "Observation: <what is stuck and since when>. Recommendation: <what should happen>."
```
One escalation per stuck bead, never a queue-wide roundup. Close this step
and continue to next-iteration."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["check-refinery"]
description = """
**Config: event_timeout = {{event_timeout}}**

**1. Pour next iteration BEFORE burning — and GUARD the assign.** The pour
and the assign are separate writes; a wisp poured but not assigned reaches
no hook and drops the loop, invisibly (the prompt's title-scoped startup
reconcile is the backstop, not the fix). Forward every declared var — a
--root-only pour materializes no defaults. Keep the pour on ONE line (TOML
eats a trailing backslash):

```bash
# >>> patrol-wisp-pour
NEXT=$(gc bd mol wisp mol-witness-patrol --root-only --var binding_prefix='{{binding_prefix}}' --var event_timeout='{{event_timeout}}' --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next witness wisp; NOT burning this one."
  exit 1
fi
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign poured wisp $NEXT; rolling it back and NOT burning this one."
  gc bd mol burn "$NEXT" --force || echo "Rollback burn of $NEXT failed; startup reconcile will collect it."
  exit 1
fi
# <<< patrol-wisp-pour
```
If either guard fires, stay on the current wisp and retry next cycle; skip
steps 2 and 3.

**2. Wait before the next cycle** — a bounded clock-poll in ONE tool call
(the harness blocks a standalone sleep, and caps one call at 600s):
```bash
end=$(( $(date +%s) + {{event_timeout}} ))
until [ "$(date +%s)" -ge "$end" ]; do sleep 5; done
```

**3. Burn this wisp — only if step 1 succeeded:**
```bash
gc bd mol burn <this-wisp-id> --force
```

Re-read the plain `gc formula show mol-witness-patrol` for step order (not
the full --json; pull one step's description only as you reach it).

**Exit criteria:** next wisp poured and assigned, this one burned — or the
guard fired and this wisp survives for the retry."""
