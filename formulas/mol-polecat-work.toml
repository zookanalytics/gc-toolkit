description = """
Polecat work lifecycle — feature-branch variant. Extends the core
mol-polecat-base with worktree/branch setup, affected-aware self-review, and
the refinery handoff. Run by every polecat in the city; the agent prompt
carries the doctrine, this file carries the mechanics.

Contract (self-cleaning model): receive work -> follow steps in order ->
push branch, hand the bead to the refinery -> close own step
chain -> drain. A run whose whole product is store work has no branch to
push and takes submit-and-exit's store-only arm instead, which releases the
bead and names the disposition for whoever owns the close.
NEVER close the work bead: the refinery closes an anchor on a
verified merge, and closes a rework hand-back landed-on-branch, both from
merge-push. ALWAYS close your own step beads through
assets/scripts/step-close.sh — a graph.v2 step advances only by closing its
own bead, and step-close.sh resolves it from the (gc.root_bead_id,
gc.step_ref) pair; $GC_BEAD_ID / $GC_TRIGGER_BEAD_ID name the wrong bead
after a claim, and a pool assignee names every molecule the slot ever ran.
workflow-finalize is the control-dispatcher's — never close it.

Two distinct branch questions: {{base_branch}} is what the worktree is
poured FROM (on a rework child, the reviewed branch — by design);
metadata.target is where the work LANDS. submit-and-exit resolves the
landing target once and fails closed. Its mechanics live in
assets/scripts/submit-and-exit.sh, and load-context's gates in
load-context-duplicate-dispatch-gate.sh and load-context-blocked-work-gate.sh;
each script's sibling *.test.sh runs it.

Two distinct BEAD questions, the same way: the bead you claimed is not always
the bead the branch is gated by. On a rework or rebase child the anchor is a
separate bead, and pr-open.sh, pr-facts.sh and merge.sh all read the anchor.
submit-and-exit resolves it once, and the summary and a retitle follow it.

Rejection-aware: metadata.branch + metadata.rejection_reason mean a prior
attempt bounced with the branch intact — resume it by bringing the branch
current with MERGE (never rebase or force-push), don't redo the work.
"""
formula = "mol-polecat-work"
extends = ["mol-polecat-base"]

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Agent identity prefix with trailing dot. Non-empty default on purpose: an empty prefix renders `<rig>/refinery`, an address no agent holds, and the refinery's exact-match find-work makes that strand silent."
default = "gc-toolkit."

[vars.affected_tests_command]
description = "Shell-safe command that reads `git diff --name-only origin/{{base_branch}}...HEAD` and runs the matching test subset. Empty = run full test_command."
default = ""

[[steps]]
id = "load-context"
title = "Load context and verify assignment"
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }
description = """
Initialize your session and understand your assignment.

**1. Prime your environment:**
```bash
gc prime                    # Load role context
gc bd prime                    # Load beads context
```

**2. Derive your work bead and check your hook:**
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd list --assignee=$GC_AGENT --status=in_progress
```

The work bead is your assigned issue. Read it carefully:
```bash
WORK_BEAD_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
printf '%s' "$WORK_BEAD_JSON" | jq '.[0]'           # Full issue details
printf '%s' "$WORK_BEAD_JSON" | jq '.[0].metadata'  # Check for existing metadata
```

**3. Gate the work bead before touching the workspace (FAIL CLOSED).** Two
gates run, in order:

- `load-context-duplicate-dispatch-gate.sh` refuses a bead that is unreadable,
  parked, in flight under another live owner, or already finished. Two dispatch
  surfaces can reach one work bead, this workflow and a direct pool route left
  on the bead itself, and two workers building one branch destroy each other's
  commits.
- `load-context-blocked-work-gate.sh` refuses a bead with an open `blocks`
  blocker. A formula sling pours without reading `blocks` deps, so this gate
  arms a re-dispatch that re-offers the work once the blocker closes.

Set `CLAIMED_STEP_BEAD_ID` to the `bead_id` from the `gc hook --claim --json`
that handed you this step. A refusal holds this step by it, and without it the
hold refuses rather than guess between duplicate step beads:

```bash
CLAIMED_STEP_BEAD_ID="<the bead_id your gc hook --claim returned for this step>"
WORK_BEAD_ID=$(gc convoy status {{convoy_id}} --json | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/load-context-blocked-work-gate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
: "${SCRIPTS:?the load-context gate scripts are not in the pack; mail the witness, and do not build or close this step}"
"$SCRIPTS/load-context-duplicate-dispatch-gate.sh" --bead "$WORK_BEAD_ID" --convoy {{convoy_id}} --step-bead "${CLAIMED_STEP_BEAD_ID:-}" || exit 1
"$SCRIPTS/load-context-blocked-work-gate.sh" --bead "$WORK_BEAD_ID" --step-bead "${CLAIMED_STEP_BEAD_ID:-}" || exit 1
```

Both gates exit 0 when the bead is yours to build. A non-zero exit is a
refusal, and you stop there. The gate has already written why on the work bead,
filed a visit when a human has a decision to make, and held this molecule and
drained once the hold landed. **Hold this step; never close it.** Closing
advances the workflow into workspace-setup, which recreates the branch and
destroys a live worker's uncommitted work. Each script's header says why
each refusal holds and which ones file a visit.

Any other reason you decline this bead takes the same exit. That covers work you
judge already delivered and a premise you find falsified. Record the visit,
hold, and drain with `escalate-hold-drain.sh`, and never leave a claimable step
behind. The block derives what it needs itself, because each command you run is
a fresh shell:

```bash
CLAIMED_STEP_BEAD_ID="<the bead_id your gc hook --claim returned for this step>"
WORK_BEAD_ID=$(gc convoy status {{convoy_id}} --json | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/escalate-hold-drain.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
"${SCRIPTS:?escalate-hold-drain.sh not found in the pack}/escalate-hold-drain.sh" --step mol-polecat-work.load-context --bead "${CLAIMED_STEP_BEAD_ID:-}" --reason "<why you declined, and what releases the hold>" --subject "$WORK_BEAD_ID" --key "<situation-key>" --message "<why you declined, and what releases the hold>"
exit 1
```

**4. Check for rejection (IMPORTANT):**

If `metadata.rejection_reason` exists, this bead was previously attempted
and rejected by the refinery. Read the reason carefully:
- Rebase conflict → you'll resume the existing branch and rebase
- Test failure → you'll resume the branch and fix the issue

If `metadata.branch` exists, a branch already exists from the prior attempt.
You will use it in workspace-setup instead of creating a new one.

**5. Check inbox for additional context:**
```bash
gc mail inbox
# Read any HANDOFF or assignment messages, then archive after absorbing context
# gc mail read <id> → process → gc mail archive <id>
```

**6. Understand the requirements:**
- What exactly needs to be done?
- What files are likely involved?
- What does "done" look like?
- If rejected: what specifically needs fixing?

If blocked or unclear, escalate. Your mail budget is zero, and an escalation
files one open visit per situation key that a human can claim and close:
```bash
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/escalate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
"${SCRIPTS:?escalate.sh not found in the pack}/escalate.sh" --subject "$WORK_BEAD_ID" --key polecat-unclear-requirements --message "Unclear requirements on $WORK_BEAD_ID. Question: <what you need clarified>. Tried: <where you already looked>."
```

**Exit criteria:** You understand the work and can begin."""

[[steps]]
id = "workspace-setup"
title = "Set up worktree and feature branch"
needs = ["load-context"]
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }
description = """
Ensure an isolated git worktree and a clean feature branch. Every check is
idempotent — safe to re-run after crash/restart.

**Config: base_branch = {{base_branch}}** (resolved by `gc sling`:
metadata.target on the bead, else the parent convoy chain, else the rig
default branch)
**Config: setup_command = {{setup_command}}**

Each refusal below runs `escalate-hold-drain.sh`, which files the visit, holds
this step, and drains, each only after the one before it landed. Set
`CLAIMED_STEP_BEAD_ID` to the `bead_id` your `gc hook --claim --json` returned
for this step, so the hold finds this step's bead.

**1. Fetch and derive the work bead:**
```bash
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-work requires an input convoy with exactly one tracked member" >&2
  SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/escalate-hold-drain.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
  "${SCRIPTS:?escalate-hold-drain.sh not found in the pack}/escalate-hold-drain.sh" --step mol-polecat-work.workspace-setup --bead "${CLAIMED_STEP_BEAD_ID:-}" --reason "input convoy {{convoy_id}} does not have exactly one tracked member; the pour is malformed and must be redone" --subject "{{convoy_id}}" --key polecat-malformed-convoy --message "Input convoy {{convoy_id}} does not have exactly one tracked member, so mol-polecat-work cannot derive its work bead; the pour is malformed and must be redone. Held at workspace-setup; nothing was touched or closed."
  exit 1
fi
```

**2. Worktree — reuse or create.** Reuse `metadata.work_dir` when the
directory still exists; otherwise create one scoped to the BEAD (not the
agent) and record it immediately so restarts and witness recovery can find it.
`git -C "$RIG_ROOT"` registers the worktree in the rig checkout whatever repo
your cwd sits in, so an unresolvable rig root fails closed:
```bash
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // empty')
if [ -n "$WORKTREE" ] && [ -d "$WORKTREE" ]; then
  cd "$WORKTREE"
else
  WORKTREE_PATH=$(pwd)/worktrees/"$WORK_BEAD_ID"
# >>> workspace-setup-worktree-add
  RIG_ROOT="${GC_RIG_ROOT:-}"
  [ -n "$RIG_ROOT" ] || RIG_ROOT=$(gc rig list --json | jq -r --arg r "$GC_RIG" '.rigs[] | select(.name == $r) | .path')
  [ -n "$RIG_ROOT" ] || { echo "workspace-setup: cannot resolve rig root (GC_RIG_ROOT unset, GC_RIG='$GC_RIG' matched no rig in the roster)" >&2; exit 1; }
  git -C "$RIG_ROOT" worktree add "$WORKTREE_PATH" --detach origin/{{base_branch}}
# <<< workspace-setup-worktree-add
  cd "$WORKTREE_PATH"
  gc bd update "$WORK_BEAD_ID" --set-metadata work_dir="$WORKTREE_PATH"
fi
```

**3. Branch — metadata.branch is AUTHORITATIVE when set** (rejection
recovery, or a caller applying work to an existing branch). Fetch it,
fast-forward only, and stop on divergence — never create a different branch:
```bash
BRANCH=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.branch // empty')
if [ -n "$BRANCH" ]; then
  git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || echo "Could not fetch metadata.branch=$BRANCH; checking local refs."
  if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
    if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
      git checkout "$BRANCH" || exit 1
      if ! git merge --ff-only "origin/$BRANCH"; then
        echo "Local $BRANCH diverged from origin/$BRANCH. STOP and reconcile."
        SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/escalate-hold-drain.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
        "${SCRIPTS:?escalate-hold-drain.sh not found in the pack}/escalate-hold-drain.sh" --step mol-polecat-work.workspace-setup --bead "${CLAIMED_STEP_BEAD_ID:-}" --reason "local $BRANCH diverged from origin/$BRANCH; reconcile the two by hand, then re-offer this molecule" --subject "$WORK_BEAD_ID" --key polecat-branch-divergence --message "Local $BRANCH diverged from origin/$BRANCH while resuming $WORK_BEAD_ID; the two must be reconciled by hand before this work can proceed. Held at workspace-setup; nothing was touched or closed."
        exit 1
      fi
    else
      git checkout --track -b "$BRANCH" "origin/$BRANCH" || exit 1
    fi
  elif git show-ref --verify --quiet "refs/heads/$BRANCH"; then
    git checkout "$BRANCH" || exit 1
  else
    echo "metadata.branch=$BRANCH is set but no local or origin branch exists. STOP — do not create a different branch."
# >>> workspace-setup-missing-branch-hold
    SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/escalate-hold-drain.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
    "${SCRIPTS:?escalate-hold-drain.sh not found in the pack}/escalate-hold-drain.sh" --step mol-polecat-work.workspace-setup --bead "${CLAIMED_STEP_BEAD_ID:-}" --reason "metadata.branch=$BRANCH names a branch that exists neither locally nor on origin; restore it or clear metadata.branch, then re-offer this molecule" --subject "$WORK_BEAD_ID" --key polecat-missing-branch --message "metadata.branch=$BRANCH on $WORK_BEAD_ID names a branch that exists neither locally nor on origin; restore it or clear metadata.branch before this work can resume. Held at workspace-setup; nothing was touched or closed."
    exit 1
# <<< workspace-setup-missing-branch-hold
  fi
fi
```

If resuming a REJECTED branch, bring it current by MERGE: never rebase, amend,
squash, or force-push. The refinery stamps `metadata.prepare_mode=merge` for
every branch shape, and an absent stamp resolves to merge too. A rebase forces a
`--force-with-lease` push, which resets the PR's "changes since last review" and
drifts its line-anchored review comments. The block records the PR head the
bring-current starts from before the merge moves HEAD, because submit-and-exit's
bring-current guard reads what the push added from there:
```bash
# >>> rejected-branch-resume-mode
BEAD_JSON=$(gc bd show "$WORK_BEAD_ID" --json 2>/dev/null)
REJECTION=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.rejection_reason // empty')
if [ -n "$REJECTION" ]; then
    echo "resuming rejected branch by MERGE (git merge --no-edit origin/{{base_branch}}); never rebase or force-push"
    RESUME_BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.branch // empty')
    RESUME_FROM=$(git rev-parse -q --verify "refs/remotes/origin/$RESUME_BRANCH" || git rev-parse HEAD)
    gc bd update "$WORK_BEAD_ID" --set-metadata bring_current_from="$RESUME_FROM"
    git merge --no-edit origin/{{base_branch}}
    # Conflicts (likely the rejection reason): resolve, git add, git commit.
    gc bd update "$WORK_BEAD_ID" --unset-metadata rejection_reason
fi
# <<< rejected-branch-resume-mode
```
Leave `prepare_mode` on the bead — the refinery re-stamps it (merge) on every
prepare.

**If no branch**: create `polecat/<bead-id>` from the FRESHLY-FETCHED remote
tip (a stale local base causes spurious duplicate conflicts at the refinery)
and record it:
```bash
git fetch origin {{base_branch}}
BRANCH="polecat/$WORK_BEAD_ID"
git branch -D "$BRANCH" 2>/dev/null || true
git checkout -B "$BRANCH" "origin/{{base_branch}}"
gc bd update "$WORK_BEAD_ID" --set-metadata branch="$BRANCH"
```

**Record the resolved worktree and work branch.** `self-review` and
`submit-and-exit` read `work_dir` from this bead to locate the checkout, and the
close gate checks `gc.work_commit` is reachable on `gc.work_branch`, which the
claim stamped from the pool checkout rather than the branch the work lands on.
Every path (a fresh create, a reused worktree, a rework child that adopted the
anchor's worktree) is in its worktree on the real branch here, so stamp both;
re-stamping the same values is a no-op:
```bash
# >>> workspace-setup-record-worktree
RECORD=(--set-metadata work_dir="$(pwd)")
WORK_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)
# A detached HEAD has no branch to record; skip it rather than blank the key.
[ -n "$WORK_BRANCH" ] && [ "$WORK_BRANCH" != "HEAD" ] && RECORD+=(--set-metadata gc.work_branch="$WORK_BRANCH")
gc bd update "$WORK_BEAD_ID" "${RECORD[@]}"
# <<< workspace-setup-record-worktree
```

**4. Clean state + setup:** `git status` should be clean; run
`{{setup_command}}` (empty = skip).

**Exit criteria:** in the worktree, on a clean recorded branch, current with
{{base_branch}}, deps installed."""

[[steps]]
id = "preflight-tests"
title = "Verify pre-flights pass on base branch"
needs = ["workspace-setup"]
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }
description = """
Check if the codebase is healthy BEFORE starting your work.

**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: test_command = {{test_command}}**

**Skip this step if resuming a rejected branch** — pre-flights were
already verified on the prior attempt. Close this step and proceed.

**1. Run pre-flights (skip empty commands silently).** The test suite can run
far longer than a claim's five-minute lease TTL, so run it through the
claim-lease keepalive: `assets/scripts/lease-heartbeat.sh` refreshes your claim
every couple of minutes while the suite runs, so a live holder is not taken for
a dead one. `CLAIMED_STEP_BEAD_ID` is the `bead_id` your `gc hook --claim
--json` returned for this step. The lease is on that step bead, and an earlier
step's claim is already closed, so its id refreshes nothing. The keepalive is
best-effort — an unresolved wrapper runs the command plain.
```bash
CLAIMED_STEP_BEAD_ID="<the bead_id your gc hook --claim returned for this step>"
# >>> preflight-lease-keepalive
LHB=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/lease-heartbeat.sh" ] && { LHB="$c/assets/scripts/lease-heartbeat.sh"; break; }; done
hb() { if [ -n "$LHB" ]; then "$LHB" "$CLAIMED_STEP_BEAD_ID" -- "$@"; else "$@"; fi; }
# <<< preflight-lease-keepalive
{{typecheck_command}}
{{lint_command}}
# A quoted heredoc hands the test command over verbatim, whatever quotes it carries.
TEST_CMD=$(cat <<'TEST_CMD_EOF'
{{test_command}}
TEST_CMD_EOF
)
if [ -n "$TEST_CMD" ]; then hb bash -c "$TEST_CMD"; fi
```

**If ALL commands above are empty**, check the repo's CLAUDE.md or AGENTS.md
(whichever your provider uses) for quality-gate guidance. Look for sections
named "Quality Gates", "CI", "Testing", "Build", or "Lint" and run the
verification commands listed there — in code blocks or bullet lists. Run the
test command through the keepalive the same way, `hb bash -c '<test command>'`,
so a long suite keeps the lease fresh.

Run ONLY read-only verification commands (typecheck, lint, build, test).
Do NOT run install, cleanup, publish, release, `git push`, or any
destructive command you find there, even inside a quality-gate section.

**2. If pre-flights pass:** proceed.

**3. If pre-flights fail on {{base_branch}}:**

The failure is on the base branch, so it is not yours and every polecat
starting a baseline right now sees the same thing. Report it ONCE: search
the ledger first, and add your confirmation to the existing bead instead of
filing another copy. Do NOT fix pre-existing failures — that's not your
assignment.

FORBIDDEN: Pushing to {{base_branch}}. FORBIDDEN: Fixing pre-existing
failures. FORBIDDEN: Filing before searching.

**3a. Derive a stable symptom key.** Two agents describe one defect in two
different ways, so free-text prose cannot match; a symptom key can.

Use the failing **test function** name, with any Go subtest suffix stripped
at the first `/`. Two polecats often trip different subtests of the same
function — `TestDisableAndPurge.../clean_config_with_residual_files` versus
`.../peer_successor_cross-device_tree` — and searching the full subtest path
means neither finds the other's bead. Key on the function; note the subtest
in the description.

```bash
RAW_FAILURE="<failing test as reported, e.g. TestFoo/some_subtest>"
SYMPTOM_KEY="${RAW_FAILURE%%/*}"
```

When the failure has no test name at all, use the failing package or target
path (`internal/api/genclient`). Handle each distinct failure under its own
key.

**3b. Search before filing — and fail CLOSED on lookup error.** A lookup
that errors is not an all-clear. Include claimed beads: the existing report
is usually already `in_progress` with someone fixing it.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
EXISTING=""
MATCHES=$(gc bd list --title-contains "$SYMPTOM_KEY" --status open,in_progress,blocked --json)
LOOKUP_RC=$?
if [ "$LOOKUP_RC" -ne 0 ]; then
    echo "Ledger lookup failed (rc=$LOOKUP_RC). NOT filing — a failed lookup is not proof the bead is missing."
    gc mail send {{escalation_target}} -s "NOTICE: {{base_branch}} pre-flight failed, dedupe lookup broken" \
      -m "Symptom: $SYMPTOM_KEY. Lookup exited $LOOKUP_RC so nothing was filed. Proceeding with $WORK_BEAD_ID."
else
    EXISTING=$(printf '%s' "$MATCHES" | jq -r '.[0].id // empty')
fi
```

**3b2. If the exact key matched nothing, widen to the family.** Sibling
tests in one package usually fail for one reason: three different
`TestDisableAndPurge*` functions were filed separately when a single
environment leak broke all of them, and that package accumulated eight beads
in under two days. Search the shared prefix, or the package name:

```bash
if [ "$LOOKUP_RC" -eq 0 ] && [ -z "$EXISTING" ]; then
    SYMPTOM_FAMILY="<shared test prefix or failing package, e.g. TestDisableAndPurge>"
    FAMILY_MATCHES=$(gc bd list --title-contains "$SYMPTOM_FAMILY" --status open,in_progress,blocked --json)
    FAMILY_RC=$?
    if [ "$FAMILY_RC" -ne 0 ]; then
        echo "Family lookup failed (rc=$FAMILY_RC). NOT filing — a failed lookup is not proof the bead is missing."
    else
        printf '%s' "$FAMILY_MATCHES" | jq -r '.[] | "\\(.id)\\t\\(.title)"'
    fi
fi
```

Read what comes back rather than matching on the string alone. A hit whose
symptom is genuinely the same defect — same package, same failure mode —
means comment on it as in 3c. Set it by hand — this one is a judgement
call, so nothing assigns it for you:

```bash
EXISTING="<the bead id you judged to be the same defect>"
```

A hit that merely shares a prefix but fails for a different reason is not
your bead; keep going to 3d.

**3c. If `$EXISTING` is set — comment, do not file:**

```bash
gc bd comment "$EXISTING" "Also observed on {{base_branch}} while starting $WORK_BEAD_ID."
```

One bead, N confirmations. Then get on with your own work.

**3d. If the lookup succeeded and matched nothing, check whether the fix
already landed** and your baseline is simply stale. Re-filing a defect that
is already fixed puts a ready bead in the pool, and the next sling sends a
polecat to redo merged work:

```bash
CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-7d +%Y-%m-%d)
CLOSED_MATCHES=$(gc bd list --title-contains "$SYMPTOM_KEY" --status closed --closed-after "$CUTOFF" --json)
CLOSED_RC=$?
```

On a match — or on a non-zero `$CLOSED_RC`, since a failed lookup is not
proof the fix has not landed — re-fetch `origin/{{base_branch}}`, reset your
worktree to the current tip, and re-run the pre-flight before filing
anything.

**3e. Only now file it** — with the symptom key verbatim in the title, so
the next polecat's 3b lookup finds your bead. Put the full failure,
including the subtest you stripped in 3a and the package, in the body:

```bash
gc bd create --title "Pre-existing failure: $SYMPTOM_KEY — <short description>" \
  --type bug --priority 1 \
  --design "Observed on {{base_branch}}. Full failure: $RAW_FAILURE"
gc mail send {{escalation_target}} -s "NOTICE: {{base_branch}} has failing pre-flights" \
  -m "Filed: <bead-id> for $SYMPTOM_KEY. Proceeding with $WORK_BEAD_ID."
```

**Exit criteria:** Pre-flights pass, or the failure is recorded exactly once
— a new bead you filed, or your comment on the bead that already had it —
or, when the ledger lookup itself was broken, `{{escalation_target}}` has been notified
instead."""

[[steps]]
id = "implement"
title = "Implement the solution"
needs = ["preflight-tests"]
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }
description = """
Do the actual implementation work.

**Working principles:**
- Follow existing codebase conventions
- Make atomic, focused commits
- Keep changes scoped to the assigned issue
- Don't gold-plate or scope-creep

**If resuming a rejected branch:** Read `metadata.rejection_reason`
from load-context. Focus on fixing the specific issue that caused
rejection — don't redo everything.

**If the rework turns out already satisfied:** a resumed rework can need no
change, because the feedback was addressed on the branch already or the
dispatch was spurious. Hand it back anyway through the normal path: run
self-review, then submit-and-exit. The branch is unchanged, so its `git push
origin HEAD` is a safe no-op ("Everything up-to-date"), and the handoff
is what routes the bead to the refinery and clears your
`gc.session_id`/`gc.session_name`. The refinery closes it as a rework hand-back
landed-on-branch. Never improvise the hand-back with a bare `gc bd update
--assignee=<refinery>`: it leaves your session identity stamped on the bead,
which `doctor/executor-identity-residue` reports and the witness owner filter
(which ranks `gc.session_id` ahead of the assignee) reads as a false orphan.

Derive your work bead in this shell context:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
```

**Commit frequently with detailed messages.** Every commit gets a
subject AND a body. The body is what makes the repo navigable a year
from now — the reviewer (and future-you) needs to understand *why* the
change exists, not just *what* the diff did. The diff already shows
the what.

```bash
git add <files>
git commit -m "<type>: <imperative subject> ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<1-3 paragraph explanation:>
- The motivation: which bug, regression, design decision, or upstream
  request drove this commit
- What the change actually does at a higher level than the diff
- Anything non-obvious about the approach: trade-offs taken, paths not
  chosen, hidden constraints honored
- Validation: which tests/benchmarks/manual checks confirmed correctness

Note any follow-ups, deferred edge cases, or downstream impacts here.
BODY
)"
```

Commit types: feat, fix, refactor, perf, test, docs, chore

**Examples of strong subjects + bodies:**
- `fix(session): preserve lifecycle metadata during crash adoption (ga-xxxx)`
  body: explains the stale session projection, the resume path that
  lost metadata, the projection update, and the focused adoption test
- `perf(events): batch typed payload registration lookups (ga-xxxx)`
  body: cites the event fan-out profile, names the registry call site
  that drove the regression, and notes why the cache stays read-only

**Weak commits to avoid** (refinery/reviewer can't tell what's going on):
- `fix: stuff (ga-xxxx)`
- `perf: speed up the slow loop`
- `refactor` with no body

**Discovered work (outside scope):**
```bash
gc bd create --title "Found: <description>" --type bug --priority 2
```
Do NOT fix unrelated issues in this branch.

**If stuck (>15 minutes):**
```bash
gc mail send {{escalation_target}} -s "HELP: Stuck on implementation" -m "Issue: $WORK_BEAD_ID
Problem: <what's blocking you>
Tried: <what you've attempted>"
```

**If context filling up:**
```bash
gc runtime request-restart
```
This blocks until the controller kills your session. The next session
resumes from context (re-reads formula steps, checks git/bead state).

**Close the inline step chain and drain.** self-review is a bounded check loop,
not an inline step: its iterations are claimed fresh from the pool so each runs
in its own session. So this inline session ends here, and it must close the
steps it completed before it drains — an open, routed step left behind by a
drained session is re-offered to a fresh polecat, and `load-context` re-offered
walks that polecat back through workspace-setup onto a branch this run already
built. Close forward (each step blocks the next, and `bd` refuses to close a
blocked issue), then drain; the self-review loop and submit-and-exit close
themselves.
```bash
SC=""
for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/step-close.sh" ] && { SC="$c/assets/scripts/step-close.sh"; break; }
done
: "${SC:?step-close.sh not found in the pack; close each step by its (gc.root_bead_id, gc.step_ref) pair, never by an id read from the environment}"
for STEP in load-context workspace-setup preflight-tests implement; do
  "$SC" --step "mol-polecat-work.$STEP" --outcome pass || echo "step-close: mol-polecat-work.$STEP was not this session's to close — left for the finalizer"
done
gc runtime drain-ack
```

**Exit criteria:** Implementation complete, all changes committed, the inline
step chain closed forward, and this session drained. The self-review loop takes
it from here."""

[[steps]]
id = "self-review"
title = "Self-review and verify green (affected-aware, bounded check loop)"
needs = ["implement"]
description = """
Prove the change is green before it can hand off. This step is a bounded check
loop: each iteration runs the declared checks in its own session and, on green,
stamps the verified HEAD on the work bead; the exit condition
(assets/scripts/self-review-check.sh) converges the loop only when the stamp
names the live HEAD. A red iteration spawns the next, up to `max_attempts`, so a
failure the refinery would have bounced a hop later — deleting the workflow and
repouring a fresh molecule — is fixed here instead. The refinery still re-runs
the real gate as the backstop.

Each iteration runs in a FRESH pooled session with none of the previous one's
context — the loop clears session affinity on every pool retry, by design.
Recover what you need from durable state; assume nothing carried over.

**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**
**Config: test_command = {{test_command}}**
**Config: affected_tests_command = {{affected_tests_command}}**

**1. Recover the work bead and worktree.** `CLAIMED_ITER_BEAD` is the `bead_id`
your `gc hook --claim --json` returned for this iteration; it is the only id
that names this attempt unambiguously, and you close it in step 6.
```bash
CLAIMED_ITER_BEAD="<the bead_id your gc hook --claim returned>"
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
[ -n "$WORK_BEAD_ID" ] || { echo "cannot derive work bead from convoy {{convoy_id}}" >&2; exit 1; }
WORK_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
WORKTREE=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata.work_dir // empty')
BRANCH=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata.branch // empty')
cd "$WORKTREE" || { echo "recorded work_dir is missing: $WORKTREE" >&2; exit 1; }
[ -n "$BRANCH" ] && git checkout "$BRANCH" 2>/dev/null || true
```

**2. Review the diff:**
```bash
git diff origin/{{base_branch}}...HEAD
git log --oneline origin/{{base_branch}}..HEAD
```
Check for bugs, security issues, missing error handling, debug cruft,
unintended file changes. Fix what you find. On a retry, the previous attempt's
failure reproduces in the checks below — run them and read the failure rather
than re-deriving from scratch.

**3. Quality checks (skip empty commands):**
```bash
{{setup_command}}
{{typecheck_command}}
{{lint_command}}
{{build_command}}
```

**4. Tests — affected subset when the rig provides one, full suite otherwise.**
Run them through the claim-lease keepalive. A claim's lease has a fixed
five-minute TTL and the suite routinely outlives it, so a live holder whose
lease expired reads, to any lease consumer, exactly like a dead one;
`assets/scripts/lease-heartbeat.sh` refreshes `$CLAIMED_ITER_BEAD` every couple
of minutes while the command runs. It is best-effort. An unresolved wrapper runs
the command plain, and a refresh the store refuses is reported once on stderr.
Neither fails the command.
```bash
# >>> self-review-lease-keepalive
LHB=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/lease-heartbeat.sh" ] && { LHB="$c/assets/scripts/lease-heartbeat.sh"; break; }; done
hb() { if [ -n "$LHB" ]; then "$LHB" "$CLAIMED_ITER_BEAD" -- "$@"; else "$@"; fi; }
# <<< self-review-lease-keepalive
# A quoted heredoc hands each command over verbatim, whatever quotes it carries.
TEST_CMD=$(cat <<'TEST_CMD_EOF'
{{affected_tests_command}}
TEST_CMD_EOF
)
[ -n "$TEST_CMD" ] || TEST_CMD=$(cat <<'TEST_CMD_EOF'
{{test_command}}
TEST_CMD_EOF
)
if [ -n "$TEST_CMD" ]; then hb bash -c "$TEST_CMD"; fi
```
If the rig declares no test command (both empty) and you run the repo's own
quality gate instead, invoke it the same way — `hb bash -c '<your test
command>'` — so the long run keeps the lease fresh.

**A failure your diff introduced blocks the stamp — fix it and commit.** A
failure that reproduces on `origin/{{base_branch}}` is pre-existing:
preflight-tests already filed it, so it neither blocks your stamp nor earns a
second bead. `git status` must be clean before you stamp.

**5. Stamp the verified HEAD — only when every check above is green.** The exit
condition converges on `self_review_passed_sha == live HEAD`, so the stamp
certifies exactly the tree whose checks you saw pass. `gc.var.issue` on the root
gives the exit condition a resilient handle on this bead when the store is
degraded.
```bash
HEAD_SHA=$(git rev-parse HEAD)
ROOT=$(gc bd show "$CLAIMED_ITER_BEAD" --json | jq -r '.[0].metadata."gc.root_bead_id" // empty')
gc bd update "$WORK_BEAD_ID" --set-metadata self_review_passed_sha="$HEAD_SHA"
[ -n "$ROOT" ] && gc bd update "$ROOT" --set-metadata gc.var.issue="$WORK_BEAD_ID"
```
If it is not green after your best effort this iteration, stamp nothing: an
absent or stale stamp is exactly what the exit condition reads as "not yet", and
the loop iterates. Never stamp a HEAD whose checks you did not watch pass — the
refinery re-runs them, and a forged green only wastes the round.

**6. Close this iteration bead — closing is what runs the exit condition.**
Close by the explicit id you claimed; `$GC_BEAD_ID` is unset for a pool-claimed
polecat, and a guarded close silently no-ops and stalls the loop.
```bash
gc bd close "$CLAIMED_ITER_BEAD" --reason "self-review iteration complete"
gc runtime drain-ack
```
Never close the work bead, and never close the `self-review` control bead: the
orchestrator closes the control on convergence, and on the final failing attempt
the exit condition hands the work bead back itself
(`aborted_at=self-review-exhausted`), because nothing runs after the budget is
spent.

**Exit criteria (for the loop, not for you):** the declared checks are green at
HEAD, `self_review_passed_sha` names that HEAD, and this iteration bead is
closed. Any iteration that leaves the tree closer to that has done its job."""

[steps.check]
# Total attempts including the first. A red iteration spawns the next; this
# bounds the churn a self-review fix usually takes, not any goal count.
# Exhaustion closes the control bead gc.outcome=fail and the exit condition
# hands the work bead back on that last failing attempt — it reads this budget
# off the control bead's gc.max_attempts, so changing the number here needs no
# other edit.
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/self-review-check.sh"
# The script verifies a sha-bound stamp; it does not run the gate (its header
# explains why — the exec is inline in the control dispatcher, sandboxed, and
# time-bounded, so a real test suite would time out and stall the city). 2m is
# slack for a few bead reads and the exhaustion handback, not a test budget.
timeout = "2m"

[[steps]]
id = "submit-and-exit"
title = "Submit work to refinery and exit"
needs = ["self-review"]
description = """
Hand off your work and self-clean. You cease to exist after this step.

`assets/scripts/submit-and-exit.sh` carries this step's mechanics, and its
header says why each gate exists. Every block below opens with the same two
lines, because each command you run is a fresh shell. Set
`CLAIMED_STEP_BEAD_ID` to the `bead_id` your `gc hook --claim --json` returned
for this step: a refusal holds this step by it.

**0. Store-only exit (TERMINAL) — a run whose whole product is store work.**
Some work has no diff: the deliverable is a bead filed in another rig's store,
or a record written into this one. Take this exit only when the run produced no
commit; the script refuses it when a diff exists. Name the bead ids the run
created or routed in `--record`, and say in `--note` what closes the work bead:

- The work MOVED to another store. The close verb is
  `assets/scripts/bead-rehome.sh --origin <bead> --successor <filed-bead>
  --kind re-homed`, plus `--successor-store rig:<name>` where the successor's
  id prefix is ambiguous. docs/authority-map.md gives that verb to converse
  dispositions, operator re-homes and duplicate-sweep.sh, so write the exact
  invocation into the note and mail the witness a `NOTICE:` carrying it.
- The bead legitimately stays open pending a ruling, a cadence, or a person.
  Open and unrouted is its resting state; say in the note what would close it.

A claim on a bead already stamped `halt_reason=store_only`, whose notes name
what was filed, is this exit offered again: re-take it, do not redo the work.

```bash
WORK_BEAD_ID=$(gc convoy status {{convoy_id}} --json | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/submit-and-exit.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
CLAIMED_STEP_BEAD_ID="<the bead_id your gc hook --claim returned for this step>"
"${SCRIPTS:?submit-and-exit.sh not found in the pack}/submit-and-exit.sh" store-only --bead "$WORK_BEAD_ID" --base {{base_branch}} --record "<bead ids>" --note "<what closes this bead, or the bead-rehome.sh invocation that disposes of it>" --step-bead "${CLAIMED_STEP_BEAD_ID:-}"
```

Every other run hands off a branch, through steps 1 to 4.

**1. Re-read the work bead's notes.** load-context read the bead once, at the
start. A coordinator may have appended a correction since: a retracted
premise, an added requirement, a reviewer's note. Reconcile the diff against
them now and fix what a note contradicts. A note asking for a decision you
cannot make is an escalation, not something to ship past.

**2. Commit everything.** `git status --porcelain` must print nothing. Commit
any leftover as `chore: capture remaining work ($WORK_BEAD_ID)`.

**3. Check the title the PR is composed from.** `pr-open.sh` writes the PR
title from the anchor's title, `pr-stack.sh` keeps an open PR's title equal to
it, and the squash merge takes its subject from it. The title names the branch,
not this pass. On a rework or rebase child the anchor is a different bead from
the one you claimed, and the script prints both:

```bash
WORK_BEAD_ID=$(gc convoy status {{convoy_id}} --json | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/submit-and-exit.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].notes // ""'
"${SCRIPTS:?submit-and-exit.sh not found in the pack}/submit-and-exit.sh" anchor --bead "$WORK_BEAD_ID"
```

When the title no longer names what the branch does (a rework that changed
what it does, or fresh work that ended narrower or broader than filed), pass
`--title` one line of plain words that does, with no conventional-commit type
and no bead id: the PR title adds both. Leave it empty when the title fits. The
script writes it onto the anchor, never onto the PR, because the merge cadence
re-composes the PR title from the anchor.

**4. Write the PR summary and hand off, in one command.** `pr-open.sh`
publishes the summary as the PR's `## Summary`. Without one the PR body falls
back to the dispatch text, written before the diff existed and addressed to
you. Describe the BRANCH for a reviewer who was not in the originating
conversation: the behavior before, the behavior now, and the shape of the
change. On a rework or rebase child the PR publishes the whole branch, so an
account of only this pass's fix describes something no reviewer is looking at.
Keep the heredoc delimiter quoted, so backticks in your prose do not run, and
write the file in the same command as the handoff, because the scratch reaper
can remove an idle temp file between commands:

```bash
WORK_BEAD_ID=$(gc convoy status {{convoy_id}} --json | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
SCRIPTS=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/submit-and-exit.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }; done
CLAIMED_STEP_BEAD_ID="<the bead_id your gc hook --claim returned for this step>"
PR_SUMMARY_FILE=$(mktemp "${TMPDIR:-/tmp}/gctk-polecat-work.XXXXXX")
cat > "$PR_SUMMARY_FILE" <<'PRSUMMARY'
<the behavior before, the behavior now, and the shape of the change — a short
paragraph or a few bullets of markdown>
PRSUMMARY
"${SCRIPTS:?submit-and-exit.sh not found in the pack}/submit-and-exit.sh" handoff --bead "$WORK_BEAD_ID" --base {{base_branch}} --refinery "${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery" --step-bead "${CLAIMED_STEP_BEAD_ID:-}" --summary-file "$PR_SUMMARY_FILE" --title "" --note "Implemented: <brief summary>"
```

`handoff` runs, in order: the branch-shape gate, the landing-target resolve,
the `auto_push=false` halt, the push and its verification, the bring-current
guard, the anchor's summary and title writes, the refinery handoff in three
claim-guard-safe writes, the refinery wake, the forward close of this step
chain, the release of the local branch, and the drain. It stops at the first
stage that refuses.

Exit 0 means the bead is handed off (or released branch-ready under
`auto_push=false`), the chain is closed, and the session is drained: you are
done. A non-zero exit prints why. A refusal a human must answer has filed its
visit, held this step, and drained. A refused push or an unfinished
bring-current guard drained with the bead still yours, and re-running this step
after the fix resumes it. Never close this step or the work bead yourself, and
never improvise the handoff with a bare `gc bd update --assignee`.

**Exit criteria:** branch pushed and verified, the refinery handoff written in
three guard-safe writes, refinery signaled, step chain closed forward, local
branch released, drain acknowledged — or the store-only release, chain closed
and drained. Done means gone."""
