description = """
Polecat work lifecycle: the feature-branch variant. It extends core's
mol-polecat-base and overrides the steps it really changes, each for the reason
docs/warrants.md gives under "The work formula's overrides". `implement` is
core's. A step text here calls a tested script and passes it the step's own
facts. Run by every polecat in the city; the agent prompt carries the doctrine,
this file carries the mechanics.

Contract (self-cleaning model): receive work -> follow steps in order ->
push branch, hand the bead to the refinery -> close this step -> drain. A run
whose whole product is store work has no branch to push and takes
submit-and-exit's store-only exit instead, which releases the bead and names the
disposition for whoever owns the close. A bead its record finishes goes to its
validating closer, mol-validate-close.
NEVER close the work bead: the refinery closes an anchor on a verified merge, and
closes a rework hand-back landed-on-branch, both from merge-push. ALWAYS close
your own step through assets/scripts/claim-close.sh: a graph.v2 step advances
only by closing its own bead. workflow-finalize is the control-dispatcher's;
never close it.

Two distinct branch questions: {{base_branch}} is what the worktree is poured
FROM (on a rework child, the reviewed branch, by design); metadata.target is
where the work LANDS. work-submit.sh resolves the landing target once and fails
closed.

Two distinct BEAD questions, the same way: the bead you claimed is not always
the bead the branch is gated by. On a rework or rebase child the anchor is a
separate bead, and pr-open.sh, pr-facts.sh and merge.sh all read the anchor.
work-submit.sh resolves it once, and the summary follows it.

Rejection-aware: metadata.branch + metadata.rejection_reason mean a prior
attempt bounced with the branch intact: resume it by bringing the branch current
with MERGE (never rebase or force-push), don't redo the work.
"""
formula = "mol-polecat-work"
extends = ["mol-polecat-base"]

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Agent identity prefix with trailing dot. Non-empty default on purpose: an empty prefix renders `<rig>/refinery`, an address no agent holds, and the refinery's exact-match find-work makes that strand silent."
default = "gc-toolkit."

[vars.affected_tests_command]
description = "Shell-safe command that reads `git diff --name-only origin/{{base_branch}}...HEAD` and runs the matching test subset. Empty = run full test_command."
default = ""

[[steps]]
id = "load-context"
title = "Load context and verify assignment"
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }
description = """
Initialize your session and understand your assignment. The read your claim
contract names has printed the work bead's description, metadata and notes.

**1. Prime your environment:**
```bash
gc prime
```
```bash
gc bd prime
```

**2. Prove the work is this run's to build, and take it (FAIL CLOSED):**
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/work-gate.sh" --convoy {{convoy_id}}
```
Exit 0: no other live run holds the work, and this session is recorded as its
holder. Any other exit: stop here and do not close this step. The script says why,
and when the refusal is final it has already recorded what releases the work,
cancelled the run and drained. Its cancel can interrupt this very tool call; that
is the cancel landing, not a person refusing it. A store that did not answer sends
the step back to the pool with nothing asked.

Closing this step to decline the work would advance the workflow into
workspace-setup, the branch-recreating step that destroys a live worker's
uncommitted work. The same holds for every other reason you might decline this
bead, such as work already delivered or a premise falsified: cancel the run as
your prompt's "Blocked work and human gates" section says.

**3. Check for rejection (IMPORTANT):**

If `metadata.rejection_reason` exists, this bead was previously attempted
and rejected by the refinery. Read the reason carefully:
- Conflict with the base: you'll resume the existing branch, bring it current
  by MERGE, and write an audit entry for each conflict you resolve
- Test failure: you'll resume the branch and fix the issue

If `metadata.branch` exists, a branch already exists from the prior attempt.
You will use it in workspace-setup instead of creating a new one.

**4. Check inbox for additional context:**
```bash
gc mail inbox
```
Read any HANDOFF or assignment messages with `gc mail read <id>`, then archive
them with `gc mail archive <id>` after absorbing the context.

**5. Understand the requirements:**
- What exactly needs to be done?
- What files are likely involved?
- What does "done" look like?
- If rejected: what specifically needs fixing?

If blocked or unclear, mail the witness first, as your prompt's "Blocked work
and human gates" section says: it answers what another agent can. When no agent
can answer, as with a decision that is the operator's to make, file a human gate
as that section shows.

**6. Close this step:**
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" --step mol-polecat-work.load-context
```

**Exit criteria:** You understand the work and can begin, and this step is
closed."""

[[steps]]
id = "workspace-setup"
title = "Set up worktree and feature branch"
needs = ["load-context"]
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }
description = """
Ensure an isolated git worktree and a clean feature branch. The call is
idempotent, so it is safe to re-run after a crash or restart.

**Config: base_branch = {{base_branch}}** (resolved by `gc sling`: the
bead's own metadata.target, else the first convoy target on the one parent
chain bd reports, else the rig default branch)

**1. Make or find the worktree and branch:**
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/work-setup.sh" --convoy {{convoy_id}} --base {{base_branch}}
```
The last line it prints is the worktree. Exit 0 or 3: enter it, and stay in it:
```bash
cd "<the path it printed>"
```
Exit 3 means it resumed a rejected branch by MERGE and the merge stopped on
conflicts, which it listed. Exit 1: stop here and do not close this step. The
script says why, and when the refusal is final it has already recorded what
releases the work, cancelled the run and drained.

**2. Conflicts: resolve, write the audit, then commit.** You are the only party
that knows what collided and why you chose what you chose, so you write it
down as you resolve. The round's account a person later reads, collapsed in
the triage verdict on the PR, is composed from your entries, and triage rules
on the round from them. This applies to any merge of the base you run in this
bead. For each file git could not merge, resolve it, stage it, and record one
entry before you commit the merge. An edit beyond what the merge needed, such as
a test repair a conflict forced, owes an entry too, and on a bead whose only job
is the bring-current every file a commit of your own changes owes one:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/bring-current-audit.sh" add --bead "<the work bead>" --path "<file>" --rating "<routine|judgment>" --collided "<the two intents that met: what the base changed and why, what the branch changed and why>" --resolution "<what you kept or wrote, and why>" --check "<what a reviewer should look at to confirm it>"
```
Then commit the merge, which also clears the rejection:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/work-setup.sh" --conclude-merge --convoy {{convoy_id}}
```
Rate an entry `routine` for an adjacent-line collision, an overlapping comment
edit or an obvious composition, and `judgment` for an informed decision: an
inferred intent, a side chosen on substance, or something new written. The
rating informs triage; it gates nothing, so rate honestly rather than low.
`bring-current-guard.sh coverage --bead <the work bead>` lists every item the
guard will hold the hand-off to, and which already have an entry.

**A conflict you cannot resolve without guessing** (two live designs, an
intent you cannot infer) is a question for a person, not a guess. Push
nothing: the branch stays as it was last reviewed. Ask once, with what collided
and the one decision you need. The human gate it files on the anchor carries
your entries so far and holds the anchor's merge. This call asks, aborts the
merge, ends the run and drains. On a molecule's step the work bead waits on that
gate through its own edge, and clearing the gate re-slings the work:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/work-setup.sh" --stop-merge --convoy {{convoy_id}} --path "<file>" --collided "<the two intents that met>" --question "<the one decision you need>"
```
Leave `prepare_mode` on the bead: the refinery re-stamps it (merge) on every
prepare.

**3. Clean state and setup:** `git status` should be clean. The rig's setup
command runs in the worktree through `gctk rig setup`, which records nothing; an
empty one is skipped:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/rig-checks.sh" setup <<'CHECKS'
setup={{setup_command}}
CHECKS
```

**4. Close this step:**
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" --step mol-polecat-work.workspace-setup
```

**Exit criteria:** in the worktree, on a clean recorded branch, current with
{{base_branch}}, deps installed, this step closed."""

[[steps]]
id = "preflight-tests"
title = "Verify pre-flights pass on base branch"
needs = ["workspace-setup"]
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }
description = """
Check if the codebase is healthy BEFORE starting your work.

**Skip this step if resuming a rejected branch**: pre-flights were already
verified on the prior attempt. Close this step and proceed.

**1. Run pre-flights.** Each declared check runs in the worktree through `gctk
rig`, which records its result against the base commit you are on, so every
polecat starting from this base shares one run: a call whose run is already
recorded there answers from the record without running. An empty command is
skipped.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/rig-checks.sh" preflight <<'CHECKS'
typecheck={{typecheck_command}}
lint={{lint_command}}
test={{test_command}}
CHECKS
```
It exits 0 when every check passes and 1 when one fails. A fail answered from the
record prints no output of its own; run `gctk rig <check> --command '<command>'
--force` when you need what failed to key it (3a). Exit 4 says nothing about the
code, and `gctk rig`'s line names why, such as files an earlier run left that git
does not ignore.

**If ALL the commands above are empty**, check the repo's CLAUDE.md or AGENTS.md
(whichever your provider uses) for quality-gate guidance. Look for sections
named "Quality Gates", "CI", "Testing", "Build", or "Lint" and run the
verification commands listed there, in code blocks or bullet lists. Run each
through the gate the same way, such as `rig-checks.sh preflight <<< 'test=<test
command>'`, so its result is recorded at this base.

Run ONLY read-only verification commands (typecheck, lint, build, test).
Do NOT run install, cleanup, publish, release, `git push`, or any
destructive command you find there, even inside a quality-gate section.

**2. If pre-flights pass:** close this step (step 4).

**3. If pre-flights fail on {{base_branch}}:**

The failure is on the base branch, so it is not yours and every polecat
starting a baseline right now sees the same thing. Report it ONCE: search
the ledger first, and add your confirmation to the existing bead instead of
filing another copy. Do NOT fix pre-existing failures: that's not your
assignment.

FORBIDDEN: Pushing to {{base_branch}}. FORBIDDEN: Fixing pre-existing
failures. FORBIDDEN: Filing before searching.

**3a. Derive the failure's key with the script.** Two agents describe one
defect in two different ways, so free-text prose cannot match; a key the
script derives can. `--test <function>` takes a failing test function and drops
a Go subtest suffix, because two polecats often trip different subtests of one
function; note the subtest in the description. `--target <path>` takes a failure
with no test function, such as a suite file, a package or a build target, by its
repo-relative path. `--lint <linter> <path>` takes a lint finding: the linter or
learned rule, and the repo-relative path of the file it flagged, one key per
file. Handle each distinct key on its own.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/preexisting-failure.sh" key --test "<failing test function, e.g. TestFoo/some_subtest>"
```

**3b. Search before filing, and fail CLOSED on lookup error.** The lookup
matches only the key stamped on a tracker, which a retitle leaves in place. It
never reads a title, so a bug that merely mentions the key is not taken for its
tracker. It reads every live status: the existing report is usually already
`in_progress` with someone fixing it. A tracker that a fold closed still
answers. Its `gc.superseded_by` names the live bead that carries the failure
now, such as a batch, and the lookup returns that bead, so 3c confirms on it.
It prints the tracker's id, or nothing when none stands.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/preexisting-failure.sh" find "<the key>"
```
A lookup that exits non-zero is not an all-clear, and neither is a `key` that
refused the failure. File nothing, tell `{{escalation_target}}` which of the two
happened, and get on with your own work:
```bash
gc mail send {{escalation_target}} -s "NOTICE: {{base_branch}} pre-flight failed, dedupe lookup broken" -m "Symptom: <the key or the raw failure>. <why nothing was looked up or filed>. Proceeding with <the work bead>."
```

**3b2. If the exact key matched nothing, widen to the family.** Sibling
tests in one package usually fail for one reason: three different
`TestDisableAndPurge*` functions were filed separately when a single
environment leak broke all of them, and that package accumulated eight beads
in under two days. Search the shared prefix, or the package name:
```bash
gc bd list --title-contains "<shared test prefix or failing package, e.g. TestDisableAndPurge>" --status open,in_progress,blocked
```
Read what comes back rather than matching on the string alone. A hit whose
symptom is genuinely the same defect, in the same package with the same failure
mode, means comment on it as in 3c. A hit that merely shares a prefix but fails
for a different reason is not your bead; keep going to 3d.

**3c. If a tracker stands, comment, do not file:**
```bash
gc bd comment "<the tracker>" "Also observed on {{base_branch}} while starting <the work bead>."
```
One bead, N confirmations. Then get on with your own work.

**3d. If the lookup succeeded and matched nothing, check whether the fix
already landed** and your baseline is simply stale. Re-filing a defect that
is already fixed puts a ready bead in the pool, and the next sling sends a
polecat to redo merged work:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/preexisting-failure.sh" find "<the key>" --closed-after "<the date seven days ago, YYYY-MM-DD>"
```
When it names a closed tracker, or exits non-zero, since a failed lookup is not
proof the fix has not landed, re-fetch `origin/{{base_branch}}`, reset your
worktree to the current tip, and re-run the pre-flight before filing anything.

**3e. Only now file it.** The script titles a P1 bug with the key and
stamps the key on it in the same write, so the next 3b lookup finds it even
after a retitle. Put the full failure, with the subtest 3a dropped and the
package, in the message. When another gate filed the key since your lookup, the
script files nothing and prints that tracker's id; confirm on it as in 3c.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/preexisting-failure.sh" file "<the key>" --summary "<short description>" --message "Observed on {{base_branch}} while starting <the work bead>. <the full failure: the test or check, its subtest or lines, the package, and the raw output>"
```
Then tell `{{escalation_target}}` what it printed:
```bash
gc mail send {{escalation_target}} -s "NOTICE: {{base_branch}} has failing pre-flights" -m "Symptom: <the key>. Tracked as: <the tracker, or nothing, the filing failed>. Proceeding with <the work bead>."
```

**4. Close this step:**
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" --step mol-polecat-work.preflight-tests
```

**Exit criteria:** Pre-flights pass, or the failure is recorded exactly once
(a new bead you filed, or your comment on the bead that already had it), or,
when `key` refused the failure, or the ledger lookup or the filing itself was
broken, `{{escalation_target}}` has been notified instead. This step is closed."""

[[steps]]
id = "self-review"
title = "Self-review and verify green (affected-aware, bounded check loop)"
needs = ["implement"]
description = """
Prove the change is green before it can hand off. This step is a bounded check
loop: each iteration runs the declared checks in its own session through `gctk
rig`, which records each result against the commit it ran at, and the exit
condition (assets/scripts/self-review-check.sh) converges the loop only when
test, lint, typecheck, setup and build all passed at the live HEAD. A red
iteration spawns the next, up to `max_attempts`, so a failure the refinery
would have bounced a hop later is fixed here instead. The refinery still runs
the real gate as the backstop.

Each iteration runs in a FRESH pooled session with none of the previous one's
context: the loop clears session affinity on every pool retry, by design.
Recover what you need from durable state; assume nothing carried over.

**1. Enter the work.** It prints the work bead's notes, read at this moment, and
then the worktree. A work bead closed while this run was mid-flight was
withdrawn, so the call cancels the run and exits non-zero: stop there.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/work-enter.sh" --convoy {{convoy_id}} --step self-review
```
```bash
cd "<the path it printed>"
```
A requirement in the notes that the branch does not answer is a defect for this
step: fix it, commit, and run the checks again.

**2. Review the diff:**
```bash
git diff origin/{{base_branch}}...HEAD
```
```bash
git log --oneline origin/{{base_branch}}..HEAD
```
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/rig-mentions.sh" --branch origin/{{base_branch}} --bead "<the work bead>"
```
Check for bugs, security issues, missing error handling, debug cruft,
unintended file changes, and each mention of another rig the last command
lists. Fix what you find. On a retry, the previous attempt's
failure reproduces in the checks below: run them and read the failure rather
than re-deriving from scratch.

**3. Run the declared checks through the gate**, in the worktree. test, lint and
typecheck record their result against HEAD through `gctk rig` and publish it to
the work bead's `rig_check.<check>`; a check the rig declares no command for
records a pass that ran nothing. setup and build record nothing, so on a clean
tree the call notes their outcome at HEAD on the work bead
(`self_review_setup_build`). A run already recorded at HEAD answers from its
record, and for a declared command no other run's record counts. The test run is
the affected subset when the rig declares one, else the full suite.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/rig-checks.sh" self-review --bead "<the work bead>" <<'CHECKS'
setup={{setup_command}}
typecheck={{typecheck_command}}
lint={{lint_command}}
build={{build_command}}
affected={{affected_tests_command}}
test={{test_command}}
CHECKS
```
It exits 0 when every check passes and 1 when one fails. Fix a failure your diff
introduced, commit, and run the checks again. A fail answered from its record
prints no output; `gctk rig <check> --command '<command>' --force` runs it again
to show what failed. Exit 4 says nothing about the code, and `gctk rig`'s line
names why, such as untracked files a run left, or a crash; a repeat at one commit
is the code's or the command's doing. When the rig declares no command and you
run the repo's own quality gate (CLAUDE.md or AGENTS.md) instead, run it through
the gate the same way, with `test=<its test command>` on the call's input.

**4. A failure your diff did not cause.** A red check that fails the same way on
`origin/{{base_branch}}` is pre-existing and does not hold the loop. Find or
file its tracker as preflight-tests' step 3 does, then mark its record at this
HEAD on the work bead; the exit condition takes the mark in place of a passing
record while that record stands:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/rig-check-pre-existing.sh" --bead "<the work bead>" --check "<test, lint, typecheck, setup or build: the red check>" --commit "<git rev-parse HEAD>" --trackers "<the tracker id of each failure in it, space-separated>"
```
Mark only a failure you reproduced on the base; a run with another command or
scope replaces the record and needs a mark of its own. A check still red after
your best effort stays red: the exit condition reads it as "not yet", and the
loop iterates. `git status` must be clean before you close the iteration.

**5. Close this iteration, which is what runs the exit condition, and drain:**
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/claim-close.sh" --step self-review && gc runtime drain-ack
```
Never close the work bead, and never close the `self-review` control bead: the
orchestrator closes the control on convergence, and on the final failing attempt
the exit condition hands the work bead back itself
(`aborted_at=self-review-exhausted`), because nothing runs after the budget is
spent.

**Exit criteria (for the loop, not for you):** the records of the test, lint and
typecheck runs above and the note of setup and build at HEAD pass, or name a
failure the work bead marks pre-existing at that HEAD, and this iteration bead
is closed.
Any iteration that leaves the tree closer to that has done its job."""

[steps.check]
# Total attempts including the first. A red iteration spawns the next; this
# bounds the churn a self-review fix usually takes, not any goal count.
# Exhaustion closes the control bead gc.outcome=fail and the exit condition
# hands the work bead back on that last failing attempt — it reads this budget
# off the control bead's gc.max_attempts, so changing the number here needs no
# other edit.
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/self-review-check.sh"
# The script reads the checks' records at HEAD; it does not run the checks (its
# header explains why — the exec is inline in the control dispatcher, sandboxed,
# and time-bounded, so a real test suite would time out and stall the city). 2m
# is slack for a few bead and record reads and the exhaustion handback, not a
# test budget.
timeout = "2m"

[[steps]]
id = "submit-and-exit"
title = "Submit work to refinery and exit"
needs = ["self-review"]
description = """
Hand off your work and self-clean. You cease to exist after this step.

**1. Reconcile first.** A coordinator may have appended a correction since the
work began: a retracted premise, an added requirement, a reviewer's note. The
read your claim contract names has just printed the bead's notes. The handoff is
the last point it is still cheap to honor, so reconcile the diff you are about
to hand off against them, and fix what a note contradicts. A note asking for a
decision you cannot make is a human gate to file, not something to ship past.
Everything else in this step runs in the worktree `metadata.work_dir` records,
so enter it, and commit whatever `git status` shows there.
```bash
cd "<the work bead's metadata.work_dir>"
```

**2. Store-only exit: a run whose whole product is store work (TERMINAL).**
Some work has no diff: the deliverable is a bead filed in another rig's
store, or a record written into this one. Take this exit only when the run
produced no commit, and name what it did produce (the bead ids it created or
routed) in `--store-only`. `store-only-exit.sh` refuses it when the run has work
to land, a commit ahead of the base, an uncommitted change or the branch on
origin, so a run that merely forgot to commit cannot park itself as store work.
The release leaves the bead open, unassigned and unrouted, so no pool is offered
it. A claim on a bead already stamped `halt_reason=store_only`, whose notes name
what was filed, is this exit's own release offered again: re-take the exit, do
not redo the work.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/work-submit.sh" --store-only "<the bead ids this run created or routed>" --notes "<what closes this bead, or the bead-rehome.sh invocation that disposes of it>" --done "<the close brief, or nothing>" --convoy {{convoy_id}} --base {{base_branch}}
```

**What closes the bead is never yours**, and which note you leave is
the difference between a bead someone can dispose of and one that just sits:

- The work MOVED to another store. The close verb is
  `assets/scripts/bead-rehome.sh --origin <bead> --successor <filed-bead>
  --kind re-homed`, plus `--successor-store rig:<name>` where the successor's
  id prefix is ambiguous. docs/authority-map.md gives that verb to converse
  dispositions, operator re-homes and duplicate-sweep.sh, so write the exact
  invocation into the note and mail the witness a `NOTICE:` carrying it.
- The bead legitimately stays open pending something else — a ruling, a
  cadence, a person. Open and unrouted IS the resting state and no close verb
  is owed. Say in the note what would close it.
- The record FINISHES the bead: a live verification whose every check passed,
  or any record that meets what the bead's description asks for. Nothing else
  would close it, so left open it reads as work not yet done. Write the close
  brief in `--done`: what the record shows, why that meets what the bead asks
  for, and anything that argues for keeping it open. `store-only-exit.sh`
  appends it to the bead's notes, holds the bead on this
  run's root, and arms `mol-validate-close` on the pool this run executes on.
  Once this run ends, that validating closer re-checks the record against live
  state, then closes the bead as done, or asks the operator when the record
  does not hold. The note says its validating closer closes it.

**3. Compose the PR summary.** `pr-open.sh` publishes `metadata.pr_summary`
as the PR's `## Summary`, and falls back to the anchor's description: the
dispatch text, written before the diff existed and addressed to you, not to a
reviewer. You are the only actor that has read the diff, so say what changed
and why, for a reviewer who was not in the originating conversation.

The operator accepts or rejects a PR from its summary, so the summary opens
with a brief they can answer in about a minute, in plain words, with any
identifier in parentheses. It says what approving changes and what that
costs, and names anything approving sets in motion or has to wait for, such as
a build that starts on merge or a branch that must not deploy before another
lands. A branch that asks the operator to decide something more, such as a
design doc's decision for them or a call the branch made for them that costs
something either way, opens on that decision: the stake, every option and
what it costs, which option the branch takes, and what happens if they do not
decide. Leave out what does not apply, so a small change's brief can be a
sentence or two.

The account of the diff follows the brief. Anything that would take the open
text past one screen goes in a collapsed section, opened on one line as
`<details><summary>what it holds</summary>`, because `pr-stack.sh` reads the
published summary only up to a bare `<details>` line.

Write the brief, then the account of the diff (the behavior before, the behavior
now, and the shape of the change, in a short paragraph or a few bullets of
markdown), to a file outside the worktree, and fix each mention of another rig
this lists. An empty or absent file writes no summary: one already on the anchor
stands, and with none the PR body falls back to the dispatch text.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/rig-mentions.sh" --file "<the summary file>"
```

What the summary describes is the BRANCH, not this pass. On a rework or
rebase child the PR body publishes the whole branch, so an account of only
the fix you just made describes something no reviewer is looking at. Every
stamp owes the same brief, a restamp as much as the first composition, and a
summary an earlier step stamped stands only if it opens this way. Rewrite the
brief to the branch's current state instead of extending it, put a new
qualification of its headline beside the headline, and put the round's
mechanics in the account.

**4. Check the anchor's title.** `pr-open.sh`, `pr-facts.sh` and `merge.sh` read
the anchor, the open bead that carries a `merge_result` for this branch, which on
fresh work is this bead. The PR's title is composed from its title: `pr-open.sh`
writes it at create, `pr-stack.sh` keeps an open PR's title equal to it, and the
squash merge takes its commit subject from it. Like the summary, it names the
branch, not this pass. A rework that changed what the branch does, or fresh work
that ended narrower or broader than what was filed, leaves a title naming work
the branch does not do. Read it:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/work-submit.sh" --anchor-only --convoy {{convoy_id}}
```
When it no longer names what the branch does, pass one line of plain words that
does as `--title` below. Leave out the conventional-commit type and the bead id:
the PR title adds both. When the title still fits, pass no `--title`. The handoff
writes it onto the anchor, never onto the PR: the merge cadence composes the PR
title from the anchor, so a title typed into the PR alone is replaced on its next
pass.

**5. Hand off.** This pushes the branch and verifies it on origin, runs the
bring-current guard, writes the summary and any retitle onto the anchor, writes
the refinery handoff, wakes the refinery, closes this step, releases the local
branch, and drains. Pass the anchor the last call printed, when it printed one.
`--notes` is appended to the bead's notes, never written over them.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/work-submit.sh" --convoy {{convoy_id}} --base {{base_branch}} --binding-prefix {{binding_prefix}} --anchor "<the anchor it printed, or leave this flag out>" --summary-file "<the summary file>" --title "<the new title, or leave this flag out>" --notes "Implemented: <brief summary>"
```
- Exit 0: handed off and drained. You are gone.
- Exit 3: nothing is handed off and you must not drain: it names what you owe,
  an uncommitted change or a bring-current audit entry. Finish that and re-run
  this call.
- Exit 1: stop. The script says why, and when the refusal is final it has already
  recorded what releases the work, cancelled the run and drained.

The bring-current guard runs for every handoff and acts on a branch that
carries a review to keep current: its anchor is gating, or a PR stands on it.
When the push brought that branch current with its base, the round is either
clean, because git merged it on its own and it lands quietly, or conflicted.
A conflicted round is handed off only when your audit has an entry for every
item the guard names, and then the guard stores the audit with its diff
evidence on the anchor and reopens triage, which rules from your entries on
what else reopens, and lifts the approval only when the round made a call
that is the operator's to make. On
an anchor whose check_set declares no triage lane, the guard adds triage to
it, so triage rules on that round too. The none and off opt-outs are the
exception: only a person changes one, so the guard lifts the approval itself.
A guard that cannot finish hands nothing off: the bead stays open and still
blocks the anchor, so nothing lands on a round nobody accounted for.

**Exit criteria:** branch pushed and verified, the refinery handoff written,
refinery signaled, this step closed, local branch released, drain acknowledged.
Done means gone."""
