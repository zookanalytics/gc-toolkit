description = """
Refinery patrol loop, on Gas Town's steps. Poured as a root-only wisp:

  gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: take one work bead assigned to you, bring its
branch current with its target by merge, run the rig's checks, then land it,
publish its PR or send it back, pour the next wisp and burn this one. Steps are
not materialized; read each step as you reach it. On a crash, re-derive where
you were from git and bead state.

Work beads flow directly: a polecat sets `branch` and `target` on its work
bead and assigns it to you. Every step makes one call to a tested pack script
and passes it the bead it acts for; each script refuses a bead whose branch is
not the one checked out in your tree for it (`refinery-lib.sh`). Resolve the
scripts at shell runtime, since formula bodies get no {{.ConfigDir}}:
`"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/<script>"`.

The merge strategy is the bead's `merge_strategy`: `direct` lands by a
fast-forward push, and `mr` publishes a pull request. On a rig whose
`pending_through_merge` formula var is "true", the PR's bead stays open on Gas
Town's pending-through-merge record until the landing order (orders/
pr-reconcile.toml) verifies its merge; on any other rig the merge cadence
(the refinery-reconcile order) opens and merges it. Neither is yours to run:
docs/refinery-merge-cadence.md."""
formula = "mol-refinery-patrol"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Agent identity prefix with trailing dot. Non-empty default on purpose: this patrol sends a bead back to the polecat pool, and an empty prefix names <rig>/polecat instead of <rig>/gc-toolkit.polecat, which no pool claims."
default = "gc-toolkit."

[vars.rig_name]
description = "Rig this patrol serves; injected by the pour and forwarded by next-iteration. Declared so the {{rig_name}} token in the pour command resolves."
default = ""

[vars.run_tests]
description = "Whether the gate runs test_command."
default = "true"

[vars.setup_command]
description = "Setup/install command. Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command. Empty = skip."
default = ""

[vars.lint_command]
description = "Lint command. Empty = skip."
default = ""

[vars.test_command]
description = "Test command (when run_tests is true)."
default = ""

[vars.build_command]
description = "Build command. Empty = skip."
default = ""

[vars.target_branch]
description = "The rig's default branch, which a bead with no target lands on."
default = "main"

[vars.default_merge_strategy]
description = "The strategy for a bead that names none: 'direct' lands by a fast-forward push, 'mr' publishes a PR. Whatever this says, a bead that would land direct on the rig's default branch takes mr, so the default branch takes work only through a PR (docs/warrants.md). The merge-push step reads the rig's value, else this default."
default = "direct"

[vars.delete_merged_branches]
description = "Delete a branch from origin once its direct landing is recorded."
default = "true"

[vars.check_set]
description = "The merge cadence's gating check set, stamped on a bead the old path parks for the cadence: a comma list of checks, each a lane that must derive green before merge.sh lands the PR. 'none' is stamped as itself, and an empty value recovers this default. Read only while pending_through_merge is unset."
default = "correctness,triage"

[vars.pending_through_merge]
description = "Whether the rig is on the new path: 'true' has the merge-push step publish an mr bead's PR and record it pending until the landing order verifies its merge. Any other value keeps the old path, where the bead parks for the merge cadence. A rig sets it in its [rigs.formula_vars] at its cutover, and the merge-push step reads the rig's value."
default = "false"

[[steps]]
id = "validate-identity"
title = "Validate canonical agent identity"
description = """
You poll your queue by `$GC_AGENT`, the identity the session harness
guarantees; `$GC_ALIAS` can be empty, and polling on an empty filter idles a
refinery that looks healthy.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/refinery-patrol.sh" identity
```
Exit 0: close this step. Exit 1: the script filed a patrol finding; end the
session with `gc runtime drain-ack`."""

[[steps]]
id = "check-inbox"
title = "Check mail"
needs = ["validate-identity"]
description = """
```bash
gc mail inbox
```
Archive a message once you have handled it, or once what it asks for is
tracked work. Note anything relevant to merge work, such as a hold request.

A notice for a hand-off that brings an integration effort's branch current
names the hand-off, a task assigned to you, and the effort's landing bead. Take
it now, with the call your prompt's "Bringing an effort's branch current"
gives, and archive its notice once the hand-off is closed or waits on its gate.
Then close this step."""

[[steps]]
id = "find-work"
title = "Find the next work bead assigned to you"
needs = ["check-inbox"]
description = """
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/refinery-find-work.sh"
```
It lists the beads assigned to you, open or in progress, that carry a branch,
and leaves a bead something holds, a bead whose branch another open bead works
on, and a bead the old path's cadence drives; its stderr names each one left.
Among the rest it takes a rework child handed back before its anchor.

Exit 0: the one line it printed is the bead this iteration acts for. Note it
and close this step. Exit 3: no work. Write `IDLE: no work, exiting turn.` and
end the turn; a polecat's hand-off wakes and nudges you, and deferred dispatch
sends a notice once a bead assigned to you becomes ready. Exit 1: a read did
not answer; end the turn the same way, and the next patrol retries."""

[[steps]]
id = "rebase"
title = "Bring the branch current with its target"
needs = ["find-work"]
description = """
**Config: target_branch = {{target_branch}}**

Bring the branch current by merging its target in, in your tree for the bead
under your own worktree. A branch is never rebased.
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/refinery-prep.sh" --bead <the bead> --pool {{binding_prefix}}polecat
```
- Exit 0: prepared. Close this step and run the gate.
- Exit 3: the merge conflicted, and the work went back to the pool with the
  reason "Conflicts with <target> at <commit>": the bead itself through
  `gc sling` when it records no open PR, or its PR's rework child when it does.
  Or the bead had left you before the requeue wrote. Jump to next-iteration.
- Exit 4: the target or the branch is not on origin, so the bead waits behind
  a human gate. Jump to next-iteration.
- Exit 1: nothing prepared, and the bead stays with you. End the session with
  `gc runtime drain-ack`; the next patrol retries."""

[[steps]]
id = "run-tests"
title = "Run quality checks and tests"
needs = ["rebase"]
description = """
The rig's checks run as one detached job in your tree for the bead, through
`gctk rig`, because a tool call is cut off at ten minutes and a gate can run
longer. Start it:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/refinery-gate.sh" start --bead <the bead>
```
Exit 5 means the rig sets no check commands: read the rig's CLAUDE.md and run
start again with each quality gate it documents as
`--add <setup|typecheck|lint|build|test> '<command>'`. Exit 1: nothing
started; end the session with `gc runtime drain-ack`.

Then wait for it in the FOREGROUND, as an ordinary tool call with a ten-minute
timeout, never in the background, and never end your turn while it runs:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/refinery-gate.sh" wait
```
Exit 3 (`state=running`): run the wait again. Read the result off its report
and the log's last line:
- `state=done rc=0`, `GATE PASSED`: every check passed.
- `state=done rc=1`, `GATE FAILED: <check:rc>...`: the log above it holds the
  failures. Go to handle-failures.
- `state=done rc=4`, `GATE CUT SHORT`: a check stopped short of a verdict,
  which says nothing about the branch. Start the gate once more; checks that
  passed answer from their records. When the same check stops short again,
  treat it as a failure the branch caused, with `gctk rig`'s line as its
  summary.
- Anything else (`state=died`, `state=exceeded`, or a wait that exits 1 while
  the gate still runs): start it once more. If it stops short again, file a
  human gate on the bead with `human-gate.sh --subject <the bead> --key
  refinery-gate-cut-short --message "<the cause>"` and end the session with
  `gc runtime drain-ack`.

Close this step once the gate has finished, pass or fail."""

[[steps]]
id = "handle-failures"
title = "Handle quality check or test failures"
needs = ["run-tests"]
description = """
All checks passed: close this step. Otherwise diagnose each failure: did the
branch cause it, or is it already red on the target? Re-running a check on the
target is a gate like any other, run with `detached-job.sh` in a directory of
its own and waited for in the foreground. **You never write code to fix a
failure.**

**Branch-caused:** send the work back with the failure's summary:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/refinery-requeue.sh" --bead <the bead> --reason "<failure summary>" --pool {{binding_prefix}}polecat
```
It goes back as the bead itself through `gc sling`, unassigned, or as its PR's
rework child when it records an open PR. Exit 0 or 3: jump to
next-iteration. Exit 1: end the session with `gc runtime drain-ack`.

**Pre-existing on the target:** track each failure once, then land. Run it
once per failure (each failing test function, each failing target with none,
each file a linter flagged), with the failure's evidence on stdin:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/refinery-pre-existing.sh" --bead <the bead> --check <test|lint|typecheck|setup|build> --test "<failing test function>" <<'FAILLOG'
<the check that failed, where it ran, and its raw output>
FAILLOG
```
Give `--target <repo-relative path>` for a failure with no test function, or
`--lint <linter> <repo-relative path>` for a lint finding, in place of
`--test`. Exit 0 prints the tracker. Exit 1 means no tracker was found or
filed, and the bead does not land: end the session with
`gc runtime drain-ack`.

**GATE**: no landing unless every check passed or every failure is tracked."""

[[steps]]
id = "merge-push"
title = "Land the branch, or publish its PR"
needs = ["handle-failures"]
description = """
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/refinery-land.sh" --bead <the bead>
```
It refuses a branch with no change against its target, then lands by the
bead's strategy. `direct` is a fast-forward push, recorded `merged` and closed.
`mr` on a rig on the new path edits the PR's title and body, pushes the head
under the lease on the commit the prep read, opens the PR as a draft when none
is open, and records it pending with `gctk pr record`; it takes a PR only when
the city's account opened it. `mr` on any other rig pushes the head and parks
the bead for the merge cadence. A rework child handed back lands on its
anchor's branch and closes.

- Exit 0: done. Close this step.
- Exit 4: the bead waits behind a human gate. Close this step.
- Exit 6: the branch or the target moved after the prep, so nothing landed.
  Close this step; the next patrol prepares it again.
- Exit 1: nothing landed, and the bead stays with you. End the session with
  `gc runtime drain-ack`.

**GATE**: a `direct` bead closes only on a verified push, and an `mr` bead
closes only once its merge is verified, never at publication."""

[[steps]]
id = "patrol-summary"
title = "Record patrol cycle summary"
needs = ["merge-push"]
description = """
Summarize the cycle for the next session: the bead and branch handled, its
disposition (landed, published, parked for the cadence, sent back, held behind
a gate), the checks and their results, the trackers filed or found, and the
gates filed. If the cycle ended early, say why and what state it left. The
summary lives in the wisp's closing reason."""

[[steps]]
id = "next-iteration"
title = "Pour the next iteration and loop"
needs = ["patrol-summary"]
description = """
Pour the next wisp before burning this one:
```bash
"$(b='{{binding_prefix}}'; gc "${b%.}" scripts-dir)/refinery-patrol.sh" next
```
Exit 0: close this step and begin the new wisp from the formula's first step
(`gc formula show mol-refinery-patrol`). Exit 1: the next wisp is not in place
and this one is kept; end the session with `gc runtime drain-ack`, and the
startup reconcile takes it up."""
