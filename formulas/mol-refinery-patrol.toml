description = """
Refinery patrol loop — merge JUDGMENT only. Poured as a root-only wisp:

  gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}
  gc bd update $WISP --assignee=$GC_AGENT

The pour passes the rig's identity and nothing else, so the merge policy is
the formula's default as it stood when this wisp was poured. It is rendered
here for the steps that read it:

  default_merge_strategy={{default_merge_strategy}}
  check_set={{check_set}}

Each wisp is ONE iteration: find one assigned work bead, prepare its branch,
run the rig's checks, decide (land / gate / reject), pour the next wisp,
burn this one. Steps are not materialized; read each description as you
reach it. On crash, re-derive position from git and bead state.

Everything downstream of the gating handoff — check arming and review
dispatch, PR opening, the merge itself, external PR facts, convoy
graduation — is the refinery-reconcile ORDER's (60s, no session). This
formula never runs those passes: docs/refinery-merge-cadence.md.

State writes: every merge_result transition goes through
assets/scripts/lifecycle.sh (one atomic validated write per transition);
every escalation goes through assets/scripts/escalate.sh (one open visit
per situation key). Resolve both at shell runtime — formula bodies get no
{{.ConfigDir}}:

    LC=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
      [ -x "$c/assets/scripts/lifecycle.sh" ] && { LC="$c/assets/scripts/lifecycle.sh"; break; }
    done

Marked blocks are extracted and executed by their tests
(find-work-gating-guard, mr-aware-rejection-failclosed,
preexisting-failure-dedup, check-set-normalize, one-anchor-per-pr,
patrol-wisp-reconcile, patrol-pour-vars, rig-check-commands, refinery-gate) — keep
markers and keep the blocks backslash-free (TOML eats line-ending
backslashes)."""
formula = "mol-refinery-patrol"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Agent identity prefix with trailing dot. Non-empty default on purpose: this patrol hands a rejected bead back to the polecat pool, and an empty prefix renders <rig>/polecat instead of <rig>/gc-toolkit.polecat. No pool holds that address, so the rejected bead never reaches a polecat: pool-route.sh refuses the route, and rejection-repool.sh files a visit in place of the pour."
default = "gc-toolkit."

[vars.rig_name]
description = "Rig this patrol serves; injected by the pour (forwarded verbatim by next-iteration). Declared so the {{rig_name}} token in the pour commands resolves instead of surviving literally."
default = ""

[vars.run_tests]
description = "Whether to run tests before merging."
default = "true"

[vars.setup_command]
description = "Setup/install command. Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command. Empty = skip."
default = ""

[vars.lint_command]
description = "Lint command. Empty = skip."
default = ""

[vars.test_command]
description = "Test command (when run_tests is true)."
default = ""

[vars.build_command]
description = "Build command. Empty = skip."
default = ""

[vars.target_branch]
description = "Default target branch for merges."
default = "main"

[vars.default_merge_strategy]
description = "Default when metadata.merge_strategy is unset: 'direct' = FF + push to target; 'mr'/'pr' = gated PR pipeline. Neither the startup pour nor the next-iteration pour passes it, so each wisp renders this default as it stands when that wisp is poured."
default = "mr"

[vars.delete_merged_branches]
description = "Delete source branches after a direct merge."
default = "true"

[vars.auto_ff_rig_main]
description = "After a direct merge, best-effort fast-forward the rig's canonical checkout when it is on the target branch with a clean tree. Never blocks the merge."
default = "true"

[vars.check_set]
description = "Merge gating check-set stamped on every anchor this formula transitions into a gating state: comma list of check names, each a lane that must derive green (lane-state.sh) before merge.sh lands the PR. 'correctness' = a review dispatched by the cadence's gate-ensure, the check that also holds the PR `## Summary` to the whole branch diff, so 'none' forgoes that summary check along with the rest of the review; 'triage' = a review that reads the check index at the reviewed commit and widens `check_set` through `signoff.sh --add-gates` with the specialist checks the diff warrants, adding only and never removing. Approval is not a check_set token — it is a universal merge rule (merge.sh requires every PR to carry a standing non-city APPROVED review), armed for every anchor and named by no token here. The 'none' sentinel is stamped (never collapsed to empty) so checkless-by-choice and never-normalized stay distinct on the anchor; an EMPTY value is treated as absent and recovers this default, because the --root-only pour path hand-substitutes raw TOML and a mis-substitution must not silently un-gate every PR. Neither the startup pour nor the next-iteration pour passes it, so each wisp renders this default as it stands when that wisp is poured, and a changed default reaches the next wisp."
default = "correctness,triage"

[[steps]]
id = "validate-identity"
title = "Validate canonical agent identity"
description = """
**Fail fast if `$GC_AGENT` is empty.** The refinery self-polls on
`$GC_AGENT` (the harness-guaranteed identity; `$GC_ALIAS` can legitimately
be empty, and polling on an empty filter idles a refinery that looks
healthy):
```bash
if [ -z "${GC_AGENT:-}" ]; then
    echo "GC_AGENT is empty — refusing to self-poll with an empty filter."
    SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
      [ -x "$c/assets/scripts/escalate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
    done
    [ -n "$SCRIPTS" ] && "$SCRIPTS/escalate.sh" --subject "${GC_SESSION_ID:-refinery}" --key refinery-empty-identity --message "Refinery session started with empty GC_AGENT; investigate the session harness."
    gc runtime drain-ack
    exit 1
fi
```
Close this step only when `$GC_AGENT` is confirmed non-empty."""

[[steps]]
id = "check-inbox"
title = "Check mail"
needs = ["validate-identity"]
description = """
```bash
gc mail inbox
```
Archive what you handle; note context relevant to merge work (priority
overrides, hold requests). Close this step and proceed."""

[[steps]]
id = "find-work"
title = "Find next work bead assigned to me"
needs = ["check-inbox"]
description = """
Select one assigned, open, branch-bearing work bead — excluding ANY bead
that carries a `merge_result`: a bead with one is a gating anchor driven by
the cadence's bead-keyed passes, never by this queue, and an assignee on one
is an anomaly to flag, not work to take. Every path that legitimately
returns a bead here clears the field first.

```bash
# >>> find-work-select
# bd's --json can emit a raw control byte inside a note (an unescaped newline
# from a multi-paragraph comment), which is invalid JSON and aborts jq;
# tr -d '[:cntrl:]' drops the control bytes JSON forbids raw before the parse.
# The shape guard then fails CLOSED on anything still unparseable, so a broken
# read ends the turn visibly instead of reading as an empty queue.
# The window is unbounded (--limit=0). Selection orders by priority then
# created_at, but bd sorts server-side on one field at a time, so any bounded
# single-key window can truncate off the bead this sort should pick: a newer
# high-priority handoff would fall past a created-ordered window, and the oldest
# within a band would fall past a priority-ordered one. Fetching the whole
# assigned-handoff set lets the client-side sort below see every candidate.
# created_at ranks wait time; updated_at does not, because any later write to a
# waiting handoff re-stamps it, so it tracks last-touched rather than age.
WORK_ROWS=$(gc bd list ${GC_RIG:+--rig="$GC_RIG"} --assignee=$GC_AGENT --status=open --exclude-type=epic --has-metadata-key=branch --limit=0 --json | tr -d '[:cntrl:]')
if ! printf '%s' "$WORK_ROWS" | jq -e 'type == "array"' >/dev/null 2>&1; then
  echo "find-work: work list did not parse as a JSON array (bd unreadable, or a payload no scrub could rescue) — ending the turn without claiming; the next patrol retries." >&2
  gc runtime drain-ack
  exit 0
fi
WORK=$(printf '%s' "$WORK_ROWS" | jq -r '[.[] | select((.metadata.merge_result // "") == "")] | sort_by((.priority // 2), (.created_at // .created // .id)) | .[0].id // empty' 2>/dev/null)
WORK_PARKED=$(printf '%s' "$WORK_ROWS" | jq -r '[.[] | select((.metadata.merge_result // "") != "") | .id + "(" + (.metadata.merge_result | tostring) + ")"] | join(" ")' 2>/dev/null)
if [ -n "$WORK_PARKED" ]; then
  echo "find-work: NOT selecting parked gating anchor(s) that carry an assignee: $WORK_PARKED. A bead with merge_result is driven by the cadence, never by find-work; flag only — do not re-gate it, do not clear it here." >&2
fi
# <<< find-work-select
```

`${GC_RIG:+--rig}` scopes to this refinery's rig store; `--limit=0` fetches the
whole assigned-handoff set, because selection orders by priority then created_at
and bd sorts on one field server-side, so any bounded window could truncate off
the bead the client-side sort would pick. An unbounded window also means a
parked anchor can never crowd real work out of it; the client-side filter drops
the anchors and the sort takes the highest-priority, oldest-within-band
handoff. Flag, never rewrite.

If found: confirm `metadata.branch` exists (`gc bd show $WORK --json`),
default `metadata.target` to {{target_branch}}, note the id, close this
step.

If NO work: this turn is over. End the turn — no sleeping, no watching, and
do NOT run the cadence's passes inline (the refinery-reconcile order is the
single writer; see docs/refinery-merge-cadence.md). The session_sleep policy
restarts you on the idle interval."""

[[steps]]
id = "rebase"
title = "Prepare the branch on its target"
needs = ["find-work"]
description = """
**Config: target_branch = {{target_branch}}**

Read the bead ONCE and prepare it by bringing its branch current with the
target — one fail-closed block, because `gc bd` fails open (errors to stderr,
empty stdout) and an unreadable bead must not read as "unset". Every branch
shape — per-bead `polecat/*`, shared `integration/*`, a graduation bead — is
brought current by MERGING origin/$TARGET in, never by a rebase: a rebase
rewrites history and forces a --force-with-lease push, which resets GitHub's
"changes since last review" and drifts the PR's line-anchored review comments.
main stays linear because merge.sh squashes at land, not because the branch was
rewritten. prepare_mode=merge is stamped on the bead BEFORE touching the
worktree, because the hand-back path (a rejection repool) reads it in a
different shell to bring the branch current the same way.

```bash
TARGET_BRANCH_DEFAULT="{{target_branch}}"
# >>> shared-branch-merge-mode
BEAD_JSON=$(gc bd show $WORK --json 2>/dev/null)
if ! printf '%s' "$BEAD_JSON" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
  echo "could not read $WORK (bd unavailable?) — NOT preparing the branch; leaving it with the refinery to retry"
  gc runtime drain-ack
  exit 1
fi
BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.branch // empty')
TARGET=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.target // empty')
[ -n "$TARGET" ] || TARGET="$TARGET_BRANCH_DEFAULT"
if [ -z "$BRANCH" ]; then
  echo "$WORK carries no metadata.branch — nothing to prepare; leaving it with the refinery"
  gc runtime drain-ack
  exit 1
fi
PREPARE_MODE=merge
if ! gc bd update $WORK --set-metadata prepare_mode="$PREPARE_MODE" >/dev/null 2>&1; then
  echo "could not record prepare_mode=$PREPARE_MODE on $WORK — NOT preparing the branch; leaving it with the refinery to retry"
  gc runtime drain-ack
  exit 1
fi
# Stage the branch under prep in a dedicated worktree, never the session's cwd.
# The refinery often runs in the rig canonical checkout, and a checkout there
# survives any interrupt before cleanup (a suspend mid-flow), stranding the rig
# root off its branch. The prep worktree is rig-scoped, lives inside the shared
# git dir (no working tree sees it), and is checked out DETACHED: it creates no
# local branch, so it cannot collide with a rig root already stranded on `temp`
# (the exact state this flow must survive), and the root's HEAD never moves.
# Every step that touches the prepared head resolves this same path through the
# same rig-root lookup, so all of them name one repo. The lookup never falls
# back to cwd, and an empty root fails closed because `git -C ""` follows cwd.
# A leftover from an interrupted iteration is cleared first.
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
git -C "$RIG_ROOT" fetch --prune origin
PREP_WT="$(git -C "$RIG_ROOT" rev-parse --path-format=absolute --git-common-dir)/gc-refinery-prep"
# A gate an interrupted iteration left running still runs in the prep worktree,
# so it is stopped before the worktree is rebuilt under it. A gate that will not
# stop leaves the work with the refinery. The launcher is found by path, as the
# rig root is, never from cwd. Its TERM-to-KILL grace outlasts the ten seconds
# `gctk rig` takes to stop a check's command, so no command outlives the stop.
GATE="$(git -C "$RIG_ROOT" rev-parse --path-format=absolute --git-common-dir)/gc-refinery-gate"
JOB=""
for c in "$RIG_ROOT" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/detached-job.sh" ] && { JOB="$c/assets/scripts/detached-job.sh"; break; }
done
[ -n "$JOB" ] || { echo "detached-job.sh not found, so a gate left running in $GATE cannot be stopped. NOT rebuilding the prep worktree; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
if ! STOP_OUT=$(DETACHED_JOB_STOP_GRACE=20 "$JOB" stop "$GATE"); then
  printf '%s' "$STOP_OUT"; echo
  echo "the gate left running in $GATE did not stop. NOT rebuilding the prep worktree under it; leaving the work with the refinery to retry"
  gc runtime drain-ack
  exit 1
fi
# refinery-workspace.sh clears the leftover and stages the branch, so this block
# removes nothing itself. It is found the way the launcher is. The stage records
# that the prep worktree holds $BRANCH for $WORK, and merge-push takes the bead
# and branch it acts for from that record.
WS=""
for c in "$RIG_ROOT" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/refinery-workspace.sh" ] && { WS="$c/assets/scripts/refinery-workspace.sh"; break; }
done
[ -n "$WS" ] || { echo "refinery-workspace.sh not found, so the prep worktree cannot be staged. NOT preparing the branch; leaving it with the refinery to retry"; gc runtime drain-ack; exit 1; }
# Check the staging result before any conflict path can run: a failed staging is
# prep-setup infrastructure, not an origin/$TARGET conflict, so it leaves the
# work with the refinery to retry instead of repooling it with a false rejection.
if ! "$WS" stage --rig-root "$RIG_ROOT" --branch "$BRANCH" --work "$WORK"; then
  echo "could not stage the prep worktree at $PREP_WT — NOT preparing the branch; leaving it with the refinery to retry (prep-setup failure, not an origin/$TARGET conflict)"
  gc runtime drain-ack
  exit 1
fi
PREPARE_FAILED=
# Bring the branch current by MERGE, never rebase — see the prose above. Every
# branch shape takes this force-push-free path; the push step ships a fast-forward
# because the merge keeps origin/$BRANCH an ancestor of the prepared head.
echo "bringing '$BRANCH' current with origin/$TARGET by MERGE (no rebase, no force-push)"
git -C "$PREP_WT" merge --no-edit "origin/$TARGET" || { git -C "$PREP_WT" merge --abort >/dev/null 2>&1 || true; PREPARE_FAILED=1; }
# <<< shared-branch-merge-mode
```

`$PREPARE_FAILED` empty: close this step, proceed to run-tests.

`$PREPARE_FAILED` set (conflicts): the abort already ran, so the tree is
clean. Retire the workflow, reopen the source, and repool with rejection
metadata through `rejection-repool.sh`. Its one lifecycle transition clears
`merge_result` atomically with the repool, so the hand-back re-gates fresh,
and `existing_pr` carries the anchor's PR over so the rework reuses it instead
of minting a duplicate. A fresh `mol-polecat-work` pour then dispatches the
rebuild, which no hold on the bead's epic reaches. reopen-source has already
taken the bead out of this queue, so a repool that stops short arms a retry
or files a visit:

```bash
# >>> rejection-conflict-reason
# The reason names origin/$TARGET's head in the rig's repository, read by path:
# the session's cwd may sit in another checkout, whose origin/$TARGET belongs
# to another repository.
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
REJECT_REASON="Conflicts with $TARGET at $(git -C "$RIG_ROOT" rev-parse "origin/$TARGET"); resume in prepare_mode=$PREPARE_MODE (merge = bring the branch current by MERGE; do not rebase and do not force-push it)"
# <<< rejection-conflict-reason
gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
# >>> mr-aware-rejection
REPOOL=""
for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/rejection-repool.sh" ] && { REPOOL="$c/assets/scripts/rejection-repool.sh"; break; }
done
if [ -z "$REPOOL" ]; then
  echo "rejection-repool.sh not found — NOT repooling $WORK; ending the turn"
  gc runtime drain-ack
  exit 1
fi
BEAD_JSON=$("$REPOOL" "$WORK" --pool {{binding_prefix}}polecat --reason "$REJECT_REASON")
case "$?" in
  0|2) ;;
  *) echo "rejection-repool.sh recorded nothing that dispatches $WORK (its output above says why); ending the turn"; gc runtime drain-ack; exit 1 ;;
esac
# <<< mr-aware-rejection
```

Do NOT delete `origin/$BRANCH` (the resuming polecat needs it). Tear down the
prep worktree with `refinery-workspace.sh teardown`, the script the rebase step
staged it with. The prep worktree is detached and holds no branch, so nothing
else has to be deleted, and the rig root's HEAD was never moved. A teardown
that does not complete is no reason to stop, because the next iteration's
rebase step clears the leftover before it stages:
```bash
# >>> prep-teardown
WS=""
for c in "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/refinery-workspace.sh" ] && { WS="$c/assets/scripts/refinery-workspace.sh"; break; }
done
if [ -z "$WS" ] || ! "$WS" teardown; then
  echo "the prep worktree was not torn down; carry on, since the next rebase step clears it before staging"
fi
# <<< prep-teardown
```
Then jump to next-iteration (pour before burn) — the rejection ends this
cycle."""

[[steps]]
id = "run-tests"
title = "Run quality checks and tests"
needs = ["rebase"]
description = """
The branch under test is staged in the prep worktree (the rebase step), so
every check runs THERE, and the rig root's checkout is never touched. A tool
call is cut off at ten minutes, and a cold build and test on a loaded host can
take far longer, so the checks run as one detached job through
`assets/scripts/detached-job.sh`: it starts the job in a session of its own,
reports a launch that did not happen, and waits for the job in bounded
foreground calls. Launch a gate no other way. A hand-rolled background launch
can fail without a word (macOS ships no `setsid`), and a background poll for a
result that never comes never returns.

The checks are setup_command, typecheck_command, lint_command and
build_command, then test_command when run_tests is "true". A rig sets them
under its `[rigs.formula_vars]` in city.toml, and a value the rig sets wins
over this formula's default, an empty one included. This wisp is poured
root-only, so nothing renders those vars into this step, and a session that
fills them in by hand can take either value. The block below reads both from
one `gc formula show --rig` call and gives the gate the rig's value wherever
the rig sets one, so every session runs the same checks. Never type a
configured check in by hand.

The gate runs each check through `gctk rig`, which runs the command with bash
in the prep worktree, with stdin closed, and records the result of test (the
full suite), lint and typecheck against the merged head: the commit merge-push
pushes and the reviews are pinned to. A run already recorded there answers
from its record. A comment, a quote, a heredoc or a `cd` in a command means
what it would at a prompt, an `exit` in it ends only that check, and the checks
after a failed one still run. A check's verdict is its command's exit status,
so a command that sends its work to the background passes before that work
ends: each must finish in the foreground.

When the rig sets no check commands, the block says so and starts no gate.
Add the quality gates documented in the rig's CLAUDE.md where the block marks,
each as `add_check <check> '<command>'`, where <check> is the one it is
(setup, typecheck, lint, build or test), with the command as documented and any
environment it needs, and run the block again. Those checks run only for a rig
that sets no check commands, and a gate with no check never starts, so the
gates are never skipped silently. Start the gate:
```bash
# >>> refinery-gate-start
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
COMMON="$(git -C "$RIG_ROOT" rev-parse --path-format=absolute --git-common-dir)"
PREP_WT="$COMMON/gc-refinery-prep"
GATE="$COMMON/gc-refinery-gate"
JOB=""
for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/detached-job.sh" ] && { JOB="$c/assets/scripts/detached-job.sh"; break; }
done
[ -n "$JOB" ] || { echo "detached-job.sh not found; NOT running the gate, and leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
# >>> gctk-bin
GCTK="${GCTK_BIN:-${GC_CITY_PATH:-}/.gc/services/gctk/bin/gctk}"
# <<< gctk-bin
[ -x "$GCTK" ] || { echo "no gctk binary at $GCTK to run the checks through; NOT running the gate, and leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
[ -d "$PREP_WT" ] || { echo "cannot find the prep worktree $PREP_WT; running no checks and leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
# A gate a previous session left running reads the checks and the script this
# block rewrites, so it is stopped first. One that survives the stop still
# runs, so nothing is rewritten under it and the work stays with the refinery.
if ! STOP_OUT=$(DETACHED_JOB_STOP_GRACE=20 "$JOB" stop "$GATE"); then
  printf '%s' "$STOP_OUT"; echo
  echo "the gate a previous session left running in $GATE did not stop, so its checks are not rewritten under it; leaving the work with the refinery to retry"
  gc runtime drain-ack
  exit 1
fi
# refinery-workspace.sh empties the checks directory, so this block removes
# nothing itself. It is found the way the launcher is.
WS=""
for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/refinery-workspace.sh" ] && { WS="$c/assets/scripts/refinery-workspace.sh"; break; }
done
[ -n "$WS" ] || { echo "refinery-workspace.sh not found, so the previous gate's checks cannot be cleared; NOT running the gate, and leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
"$WS" checks --rig-root "$RIG_ROOT" || { echo "could not empty $GATE/checks; running no checks and leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
# >>> rig-check-commands
# One read serves every check. An unreadable answer gives every check an empty
# value, which is also what a rig with no checks gives, so the block runs
# nothing and leaves the work with the refinery to retry.
CHECKS_JSON=""
[ -n "${GC_RIG:-}" ] && CHECKS_JSON=$(gc formula show mol-refinery-patrol --rig "$GC_RIG" --json 2>/dev/null)
if ! printf '%s' "$CHECKS_JSON" | jq -e '.ok == true and (.vars | type == "array")' >/dev/null 2>&1; then
  echo "cannot read the check commands of rig '${GC_RIG:-}' (gc formula show --rig failed); running no checks and leaving the work with the refinery to retry"
  gc runtime drain-ack
  exit 1
fi
# rig_default is the rig's own value and wins whenever it is present, so an
# empty one turns that check off. Otherwise the formula default applies.
check_value() {
  printf '%s' "$CHECKS_JSON" | jq -r --arg n "$1" '[.vars[] | select(.name == $n)][0] | if . == null then "" elif .rig_default != null then .rig_default else (.default // "") end'
}
# add_check <check> <command>: the command becomes the gate's next check, run as
# the gctk rig check of that name. A check that cannot be written runs nothing
# and leaves the work with the refinery to retry.
CHECKS=0
add_check() {
  CHECKS=$((CHECKS + 1))
  printf '%s' "$2" > "$GATE/checks/$(printf '%02d' "$CHECKS")-$1" && return 0
  echo "cannot write the $1 check into $GATE/checks; running no checks and leaving the work with the refinery to retry"
  gc runtime drain-ack
  exit 1
}
RUN_TESTS=$(check_value run_tests)
for CHECK in setup typecheck lint build test; do
  if [ "$CHECK" = "test" ] && [ "$RUN_TESTS" != "true" ]; then
    echo "run-tests: test_command skipped (run_tests=${RUN_TESTS})"
    continue
  fi
  CHECK_CMD=$(check_value "${CHECK}_command")
  if [ -z "$CHECK_CMD" ]; then
    echo "run-tests: ${CHECK}_command not set"
    continue
  fi
  echo "run-tests: ${CHECK}_command = ${CHECK_CMD}"
  add_check "$CHECK" "$CHECK_CMD"
done
[ "$CHECKS" -gt 0 ] || echo "run-tests: rig ${GC_RIG} sets no check commands"
# <<< rig-check-commands
if [ "$CHECKS" -eq 0 ]; then
  # The rig sets no check commands. Add each quality gate its CLAUDE.md
  # documents here, in the order it gives them, as
  #   add_check <setup|typecheck|lint|build|test> '<the command as documented, with any environment it needs>'
  :
fi
[ "$CHECKS" -gt 0 ] || { echo "run-tests: no check to run, so no gate started; add the quality gates the rig's CLAUDE.md documents where this block marks, and run it again"; exit 1; }
cat > "$GATE/gate.sh" <<'GATE'
cd "$1" || exit 2
gctk="$3"
# Every check ends this many seconds into the gate, inside the two hours its
# wait allows, so the wait never stops gctk in the middle of a stop of its own.
deadline=7080
failed=""
stopped=""
# check <check>: run the command on stdin through gctk rig and note its exit
# when it is not a pass: 1 a fail, any other a run that says nothing about the
# code.
check() {
  local cmd rc left
  cmd=$(cat)
  echo "== $1"
  left=$((deadline - SECONDS))
  if [ "$left" -lt 60 ]; then
    echo "no time left in the gate's bound to run $1"
    stopped="$stopped $1:timeout"
    return
  fi
  if [ "$1" = test ]; then
    "$gctk" rig test --scope full --command "$cmd" --timeout "${left}s" </dev/null
  else
    "$gctk" rig "$1" --command "$cmd" --timeout "${left}s" </dev/null
  fi
  rc=$?
  case "$rc" in
    0) ;;
    1) failed="$failed $1:1" ;;
    *) stopped="$stopped $1:$rc" ;;
  esac
}
# Each check is a file in the directory the job names, its name led by its
# place in the order.
for f in "$2"/*; do
  [ -f "$f" ] || continue
  name=${f##*/}
  check "${name#*-}" < "$f"
done
[ -z "$stopped" ] || { echo "GATE CUT SHORT:$stopped${failed:+ (failed:$failed)}"; exit 4; }
[ -z "$failed" ] || { echo "GATE FAILED:$failed"; exit 1; }
echo "GATE PASSED"
GATE
"$JOB" start "$GATE" -- bash "$GATE/gate.sh" "$PREP_WT" "$GATE/checks" "$GCTK" || { echo "the gate did not start; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
# <<< refinery-gate-start
```

Then wait for it in the FOREGROUND: run the block below as an ordinary tool
call with a ten-minute timeout (`timeout: 600000` in Claude Code), never with
`run_in_background`. Each wait returns within about eight minutes. While it
reports `state=running` (exit 3), run it again. Never end your turn while the
gate runs: a gate that finishes while you sit idle wakes nothing, and the
queue behind it waits. The wait stops a gate still running after two hours and
reports `state=exceeded`. A wait that reports the gate still running also
appends a note to this patrol's wisp. check-refinery-patrol-live (I14) dates a
patrol by its wisp's last write and calls it stalled once that is an hour old
with work queued, so the note keeps a gate in progress from reading as a stall.
A wait that cannot find its launcher says so and exits 1 without touching the
gate, which keeps running. Point it at the pack and wait again; do not drain
on it.
```bash
# >>> refinery-gate-wait
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
GATE="$(git -C "$RIG_ROOT" rev-parse --path-format=absolute --git-common-dir)/gc-refinery-gate"
JOB=""
for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/detached-job.sh" ] && { JOB="$c/assets/scripts/detached-job.sh"; break; }
done
[ -n "$JOB" ] || { echo "detached-job.sh not found from here, so this call cannot wait on the gate, which keeps running in $GATE; run this block again from the pack checkout, or with GC_RIG_ROOT or GC_CITY_PATH naming it, and do not end the turn"; exit 1; }
WAIT_OUT=$(DETACHED_JOB_STOP_GRACE=20 "$JOB" wait "$GATE" --limit 7200); WAIT_RC=$?
printf '%s' "$WAIT_OUT"; echo
if [ "$WAIT_RC" -eq 3 ]; then
  # This patrol's own wisp, found the way patrol-wisp-pour finds the wisp it
  # burns, so a leftover wisp never takes the note.
  CURRENT_WISP=${GC_BEAD_ID:-}
  if [ -z "$CURRENT_WISP" ]; then
    CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --include-infra --limit=0 --json | jq -r '[.[] | select(.title == "mol-refinery-patrol")][0].id // empty')
  fi
  ELAPSED=$(printf '%s' "$WAIT_OUT" | sed -n 's/^elapsed=//p')
  if [ -n "$CURRENT_WISP" ] && gc bd update "$CURRENT_WISP" --append-notes "run-tests: the gate has run ${ELAPSED:-?}s and is still running" >/dev/null 2>&1; then
    echo "noted the running gate on patrol wisp $CURRENT_WISP"
  else
    echo "could not note the running gate on this patrol's wisp ('$CURRENT_WISP'), so check-refinery-patrol-live may call this patrol stalled once its wisp is an hour old; keep waiting"
  fi
fi
exit "$WAIT_RC"
# <<< refinery-gate-wait
```

Read the result off the report and the job's log (`$GATE/log`):
- `state=done rc=0`: every check passed and the log ends `GATE PASSED`.
- `state=done rc=1`: the log's `GATE FAILED:` line names each failed check,
  and the log above it holds their output. A fail answered from its record
  prints none; `--force` runs it again, through `detached-job.sh` with a
  directory of its own, when handle-failures needs what failed.
- `state=done rc=4`: a check stopped short of a verdict, which says nothing
  about the branch. The log's `GATE CUT SHORT:` line names it, and `gctk rig`'s
  line above it says why, such as a crash or a command that changed a tracked
  file. Start the gate once more; the checks that passed answer from their
  records. When the same check stops short again at the same head, take
  handle-failures' branch-caused path with `gctk rig`'s line as the failure
  summary, so the work goes back to its author.
- `state=running` from a wait that exits 1: the gate ran past the limit and
  its process group survived TERM and KILL, so it still runs in the prep
  worktree. Never start another gate beside it. Escalate with key
  `refinery-gate-unstoppable`, naming the bead and the gate's pid, and leave
  the work with the refinery: `gc runtime drain-ack` and end the cycle
  without a rejection.
- anything else (`state=died`, `state=exceeded`, or any other `rc`): the gate
  stopped short of a verdict, ended by a signal, a restart, the limit, or a
  missing prep worktree, which says nothing about the branch. Start it once
  more. If the second run stops short too, escalate with key
  `refinery-gate-cut-short`, naming the bead and the cause, and leave the work
  with the refinery: `gc runtime drain-ack` and end the cycle without a
  rejection.

Close this step once the gate has finished, pass or fail."""

[[steps]]
id = "handle-failures"
title = "Handle quality check or test failures"
needs = ["run-tests"]
description = """
All checks PASSED: close this step, proceed to merge-push.

Any FAILED: diagnose — branch regression, or pre-existing on target?
**FORBIDDEN: writing code to fix failures. You are a merge processor.**
A check you re-run on the target to tell the two apart is a gate like any
other: run it through `detached-job.sh` with a directory of its own, and wait
for it in the foreground as run-tests does.

**Branch-caused:** retire the workflow and repool with the failure summary,
the same repool as the rebase step:
```bash
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
REJECT_REASON="<failure summary>"
# >>> mr-aware-rejection
REPOOL=""
for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/rejection-repool.sh" ] && { REPOOL="$c/assets/scripts/rejection-repool.sh"; break; }
done
if [ -z "$REPOOL" ]; then
  echo "rejection-repool.sh not found — NOT repooling $WORK; ending the turn"
  gc runtime drain-ack
  exit 1
fi
BEAD_JSON=$("$REPOOL" "$WORK" --pool {{binding_prefix}}polecat --reason "$REJECT_REASON")
case "$?" in
  0|2) ;;
  *) echo "rejection-repool.sh recorded nothing that dispatches $WORK (its output above says why); ending the turn"; gc runtime drain-ack; exit 1 ;;
esac
# <<< mr-aware-rejection
# >>> rejection-branch-keep
# $BEAD_JSON is the row rejection-repool.sh read before its write, so this
# decision costs no read of its own. It is empty only when the script could not
# read the bead, and then the branch it names is kept: a wrongly kept branch is
# swept later, and a wrongly deleted one strands a PR. The delete names the
# rig's repository by path through RIG_ROOT, because a bare push from another
# checkout deletes a same-named branch on that checkout's origin. The arm
# resolves RIG_ROOT before the repool and stops when it cannot, so RIG_ROOT is
# set by the time this block runs.
# >>> merge-strategy-resolve
# The one reading of the merge strategy. Every step that branches on it reads
# it through this block, so the step that keeps a branch and the step that
# opens a PR for that branch cannot disagree about the mode the bead is in.
MERGE_STRATEGY=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.merge_strategy // "{{default_merge_strategy}}"')
MERGE_STRATEGY="${MERGE_STRATEGY:-direct}"
if [ "$MERGE_STRATEGY" = "pr" ]; then MERGE_STRATEGY="mr"; fi
# A target under polecat/ is another bead's per-bead PR head, so work landing
# there folds into that PR rather than opening one of its own. In mr mode with
# no PR of its own to reuse, that would open a nested branch -> polecat/<id> PR,
# which a fold never wants, so resolve it to direct: the branch merges onto the
# PR head and the PR re-reviews at the new head. Shaped targets (the rig
# default, integration/, a named branch) stay mr, and so does a bead already
# recording its own PR. MS_FOLD_IN carries the reason to the branch decision so
# a kept branch and this flip cannot disagree.
MS_FOLD_IN=
MS_TARGET=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.target // empty')
MS_BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.branch // empty')
MS_HAS_OWN_PR=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata | [(.existing_pr // ""), (.pr_url // ""), (.pr_number // "" | tostring)] | map(select(. != "")) | length')
case "$MS_TARGET" in
  polecat/*)
    if [ "$MERGE_STRATEGY" = "mr" ] && [ "$MS_HAS_OWN_PR" = "0" ] && [ "$MS_TARGET" != "$MS_BRANCH" ]; then
      MERGE_STRATEGY="direct"
      MS_FOLD_IN=1
    fi ;;
esac
# <<< merge-strategy-resolve
BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.branch // empty')
# Nothing PR-shaped on the bead means "no PR will ever want this branch" only
# in direct mode. In mr mode the PR is opened later, by the cadence's pr-open,
# so that test is true for the whole pre-open window. A first-pass rejection
# lands inside it.
PR_SHAPED=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata | [(.pr_url // ""), (.pr_number // "" | tostring), (.existing_pr // "")] | map(select(. != "")) | length')
if ! printf '%s' "$BEAD_JSON" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
  echo "keeping whatever branch $WORK names — rejection-repool.sh could not read the bead, and the visit it filed carries it"
elif [ -z "$BRANCH" ]; then
  echo "no metadata.branch on $WORK — no branch to delete"
elif [ "$MERGE_STRATEGY" != "direct" ]; then
  echo "keeping origin/$BRANCH — merge_strategy=$MERGE_STRATEGY; the PR pipeline needs the branch"
elif [ "${PR_SHAPED:-1}" != "0" ]; then
  echo "keeping origin/$BRANCH — the bead already records a PR"
elif [ -n "$MS_FOLD_IN" ]; then
  echo "keeping origin/$BRANCH — it folds into the PR at $MS_TARGET and carries the rework"
else
  git -C "$RIG_ROOT" push origin --delete "$BRANCH" || echo "could not delete origin/$BRANCH — a kept branch is swept later; the repool already stands, so this does not fail the cycle"
fi
# <<< rejection-branch-keep
```
Tear down the prep worktree with `refinery-workspace.sh teardown`, the script
the rebase step staged it with. It is detached and holds no branch, so nothing
else has to be deleted, and a teardown that does not complete is cleared by the
next rebase step:
```bash
# >>> prep-teardown
WS=""
for c in "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/refinery-workspace.sh" ] && { WS="$c/assets/scripts/refinery-workspace.sh"; break; }
done
if [ -z "$WS" ] || ! "$WS" teardown; then
  echo "the prep worktree was not torn down; carry on, since the next rebase step clears it before staging"
fi
# <<< prep-teardown
```
Then jump to next-iteration.

**Pre-existing on target:** dedup FIRST, file only if none, then proceed
with the merge. One block, one shell — a probe result that does not survive
into the filing arm reads as "no duplicate". Run it once per failure: each
failing test function, each failing target that has none, and each file a
linter flagged is its own key and its own tracker:
```bash
# >>> preexisting-failure-dedup
# preexisting-failure.sh owns the key, the lookup and the filing. A polecat's
# pre-flight files these trackers through it too, so both gates derive one key
# per failure and find each other's trackers.
PF=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/preexisting-failure.sh" ] && { PF="$c/assets/scripts/preexisting-failure.sh"; break; }; done
if [ -z "$PF" ]; then
  echo "preexisting-failure.sh not found — filing nothing and NOT merging $WORK; the next patrol retries"
  gc runtime drain-ack
  exit 1
fi
# The failure's KEY comes from the script, never from prose: a summary is
# reworded every cycle and never meets the tracker the last cycle filed. A test
# function is --test <name>. A failing suite file, package or build target with
# no test function is --target <repo-relative path>. A lint finding is
# --lint <linter> <repo-relative path of the flagged file>.
if ! FAIL_KEY=$("$PF" key --test "<failing test function>"); then
  echo "no failure key derived — filing nothing and NOT merging $WORK"
  gc runtime drain-ack
  exit 1
fi
# The evidence that makes the bead workable. A title-only P1 cannot be
# dispositioned by anyone: nothing in it separates a host-load flake from a
# real regression, which is the judgment the bead exists to enable. Keep the
# heredoc QUOTED. Pasted failure output carries backticks and $, and an
# unquoted heredoc runs them.
FAIL_LOG=$(cat <<'FAILLOG'
<the check that failed, the package or target it ran in, and its raw output>
FAILLOG
)
# The lookup matches the failure_key stamp, which a retitle leaves in place,
# over every live status, because a red persists while someone fixes it. A
# tracker that a fold closed answers with the live bead its failure moved to,
# such as a batch, and that bead is the filing the merge notes cite. A
# lookup that could not read the store exits non-zero. That is UNKNOWN, never
# "no duplicate": file nothing and merge nothing, and the next patrol
# re-probes.
if ! DUP_ID=$("$PF" find "$FAIL_KEY"); then
  echo "duplicate probe unreadable (bd unavailable?) — filing nothing and NOT merging $WORK; the next patrol re-probes"
  gc runtime drain-ack
  exit 1
fi
if [ -n "$DUP_ID" ]; then
  echo "pre-existing failure already filed as $DUP_ID — proceeding with merge, filing nothing"
else
  # The observed-on branch comes off the work bead, so that read is
  # SHAPE-validated. `gc bd show` fails open, and it answers an OBJECT instead
  # of an array when the id resolves to nothing, both at exit 0. An
  # unvalidated read leaves TARGET empty and takes the formula default
  # silently, which files a P1 naming the default branch for a failure
  # observed on an integration branch. A readable bead is a NON-EMPTY array.
  # Anything else is UNKNOWN, and unknown files nothing and merges nothing.
  # The default stands in only for a bead that was read and genuinely carries
  # no target.
  WORK_JSON=$(gc bd show "$WORK" --json 2>/dev/null)
  if ! printf '%s' "$WORK_JSON" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
    echo "work bead $WORK unreadable — filing nothing and NOT merging $WORK; the next patrol re-reads"
    gc runtime drain-ack
    exit 1
  fi
  TARGET=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata.target // empty')
  [ -n "$TARGET" ] || TARGET="{{target_branch}}"
  # The script titles the bug with the key, stamps the key on it in the same
  # write, and puts the evidence in -d, the field every reader reads. A
  # filing that did not land leaves the GATE unmet.
  if ! DUP_ID=$("$PF" file "$FAIL_KEY" --message "Observed on $TARGET while merging $WORK, and classified as pre-existing on $TARGET rather than a regression from that branch.

## Failure

$FAIL_LOG"); then
    echo "no tracker filed for $FAIL_KEY — NOT merging $WORK; the next patrol re-probes"
    gc runtime drain-ack
    exit 1
  fi
  echo "pre-existing failure tracked as $DUP_ID — proceeding with merge"
fi
# <<< preexisting-failure-dedup
```
Note the resulting bug id in your merge notes — it satisfies the GATE.

Then mark each check you judged pre-existing, once per check with every
tracker the block printed for it, on the anchor at the merged head, so a review
pinned there does not run into the known wall again:
```bash
# >>> refinery-pre-existing-mark
CHECK="<test, lint or typecheck: the check whose failures you judged pre-existing>"
TRACKERS="<the tracker id each run of the block above printed for it, space-separated>"
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
PREP_WT="$(git -C "$RIG_ROOT" rev-parse --path-format=absolute --git-common-dir)/gc-refinery-prep"
HEAD_OID=$(git -C "$PREP_WT" rev-parse HEAD)
ANCHOR=$(gc bd show "$WORK" --json 2>/dev/null | jq -r '.[0].metadata.anchor_bead // empty' 2>/dev/null)
PRE=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-check-pre-existing.sh" ] && { PRE="$c/assets/scripts/rig-check-pre-existing.sh"; break; }; done
"${PRE:?rig-check-pre-existing.sh not found in the pack}" --bead "${ANCHOR:-$WORK}" --check "$CHECK" --commit "$HEAD_OID" --worktree "$PREP_WT" --trackers "$TRACKERS" || echo "the mark did not land; the merge goes on, and a review at this head runs the suite itself"
# <<< refinery-pre-existing-mark
```

**GATE**: no merge without all checks passing OR every pre-existing
failure's bug filed/found."""

[[steps]]
id = "merge-push"
title = "Merge and push (direct) or transition to gating (mr)"
needs = ["handle-failures"]
description = """
**Config: target_branch = {{target_branch}}** /
**delete_merged_branches = {{delete_merged_branches}}** /
**auto_ff_rig_main = {{auto_ff_rig_main}}**

Read the bead, its strategy and the helpers once. The step's blocks run in
order in one shell, since each reads what an earlier one set.

**The prepared head is one bead's, and this step acts for that bead.** The
rebase step recorded in the prep worktree which bead and branch it staged
there. The step's first lines take `WORK` and `BRANCH` from that record, never
from the agent's shell, so every block after them pushes, lands and records
for the bead whose head the prep worktree holds, whatever the shell carried
before. When the shell named another bead, the block says which one it now
acts for. When the prep worktree records nothing, or there is none, the block
tears down what is there, pushes and records nothing, and exits 4 without
draining: jump to next-iteration, and the next patrol prepares the work again.
```bash
# >>> prep-staged-work
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
WS=""
for c in "$RIG_ROOT" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/refinery-workspace.sh" ] && { WS="$c/assets/scripts/refinery-workspace.sh"; break; }
done
[ -n "$WS" ] || { echo "refinery-workspace.sh not found, so nothing shows which bead the prep worktree holds; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
if ! HELD=$("$WS" held --rig-root "$RIG_ROOT"); then
  "$WS" teardown --rig-root "$RIG_ROOT" || echo "the prep worktree was not torn down; the next rebase step clears it before staging"
  echo "nothing shows which bead the prep worktree holds, so nothing is pushed or recorded; jump to next-iteration, and the next patrol prepares the work again"
  exit 4
fi
PRIOR_WORK="${WORK:-}"
{ IFS= read -r WORK; IFS= read -r BRANCH; } <<<"$HELD"
[ -z "$PRIOR_WORK" ] || [ "$PRIOR_WORK" = "$WORK" ] || echo "WORK was $PRIOR_WORK, but the prep worktree holds $BRANCH for $WORK, so this step acts for $WORK"
# <<< prep-staged-work
BEAD_JSON=$(gc bd show $WORK --json)
TARGET=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.target // "{{target_branch}}"')
# >>> merge-strategy-resolve
# The one reading of the merge strategy. Every step that branches on it reads
# it through this block, so the step that keeps a branch and the step that
# opens a PR for that branch cannot disagree about the mode the bead is in.
MERGE_STRATEGY=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.merge_strategy // "{{default_merge_strategy}}"')
MERGE_STRATEGY="${MERGE_STRATEGY:-direct}"
if [ "$MERGE_STRATEGY" = "pr" ]; then MERGE_STRATEGY="mr"; fi
# A target under polecat/ is another bead's per-bead PR head, so work landing
# there folds into that PR rather than opening one of its own. In mr mode with
# no PR of its own to reuse, that would open a nested branch -> polecat/<id> PR,
# which a fold never wants, so resolve it to direct: the branch merges onto the
# PR head and the PR re-reviews at the new head. Shaped targets (the rig
# default, integration/, a named branch) stay mr, and so does a bead already
# recording its own PR. MS_FOLD_IN carries the reason to the branch decision so
# a kept branch and this flip cannot disagree.
MS_FOLD_IN=
MS_TARGET=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.target // empty')
MS_BRANCH=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.branch // empty')
MS_HAS_OWN_PR=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata | [(.existing_pr // ""), (.pr_url // ""), (.pr_number // "" | tostring)] | map(select(. != "")) | length')
case "$MS_TARGET" in
  polecat/*)
    if [ "$MERGE_STRATEGY" = "mr" ] && [ "$MS_HAS_OWN_PR" = "0" ] && [ "$MS_TARGET" != "$MS_BRANCH" ]; then
      MERGE_STRATEGY="direct"
      MS_FOLD_IN=1
    fi ;;
esac
# <<< merge-strategy-resolve
EXISTING_PR=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.existing_pr // empty')
if [ -n "$EXISTING_PR" ] && [ "$MERGE_STRATEGY" = "direct" ]; then
  echo "metadata.existing_pr requires the PR pipeline; using merge_strategy=mr."
  MERGE_STRATEGY="mr"
fi
LC=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/lifecycle.sh" ] && { LC="$c/assets/scripts/lifecycle.sh"; break; }
done
if [ -z "$LC" ]; then
  echo "lifecycle.sh not found — cannot transition $WORK; leaving it with the refinery to retry"
  gc runtime drain-ack
  exit 1
fi
# >>> branch-has-real-change
branch_has_real_change() {
  # 0-diff/0-commit guard: in the repository at <repo>, does <branch-ref>
  # introduce a real change vs its merge-base with <target-ref>?
  #   branch_has_real_change <repo> <target-ref> <branch-ref>
  # 0 = yes; 1 = empty (REFUSE close-as-merged); 2 = could not compute (fail
  # closed — a tool error is a suspect), with BHRC_ERROR naming the git call
  # that failed and what git said. Every call names <repo>: git otherwise reads
  # the cwd, which may be another checkout or no checkout at all. Each call runs
  # once, its stderr captured with its stdout, so the error reported is the one
  # the failed call wrote, never a rerun's. A call that succeeds answers on its
  # last line, below any warning git wrote.
  BHRC_ERROR=""
  if ! bhrc_out=$(git -C "$1" merge-base "$2" "$3" 2>&1); then
    bhrc_said=$(printf '%s' "$bhrc_out" | tr -s '[:space:]' ' ' | sed 's/ $//')
    BHRC_ERROR="merge-base $2 $3 failed: ${bhrc_said:-no common ancestor}"
    return 2
  fi
  bhrc_base=$(printf '%s' "$bhrc_out" | tail -n 1)
  bhrc_out=$(git -C "$1" diff --quiet "$bhrc_base" "$3" 2>&1)
  bhrc_rc=$?
  [ "$bhrc_rc" != 0 ] || return 1
  if [ "$bhrc_rc" != 1 ]; then
    bhrc_said=$(printf '%s' "$bhrc_out" | tr -s '[:space:]' ' ' | sed 's/ $//')
    BHRC_ERROR="diff $bhrc_base $3 failed: ${bhrc_said:-exit $bhrc_rc}"
    return 2
  fi
  if ! bhrc_out=$(git -C "$1" rev-list --count "$bhrc_base..$3" 2>&1); then
    bhrc_said=$(printf '%s' "$bhrc_out" | tr -s '[:space:]' ' ' | sed 's/ $//')
    BHRC_ERROR="rev-list $bhrc_base..$3 failed: ${bhrc_said:-no output}"
    return 2
  fi
  [ "$(printf '%s' "$bhrc_out" | tail -n 1)" -ge 1 ] || return 1
  return 0
}
# <<< branch-has-real-change
```

**0. Refuse a 0-diff branch (both modes).** A close-as-merged or a PR for a
branch that merges to a no-op is a false completion. Never silently retry. The
prepared head is the detached prep worktree's HEAD (the rebase step staged it
there), so resolve that path and read its commit rather than a `temp` branch.
A branch with no change is not always a false completion. `direct-merge-push.sh`
stamps `direct_landing_sha` on the bead before it pushes, so a target that
carries the stamped commit holds a direct landing an earlier patrol pushed and
did not record. The block sends that bead down the direct path, which records
it. A check that cannot run verifies nothing either way, and its cause is often
gone by the next patrol, so the block leaves that bead with the refinery to
retry, as this step's other infrastructure failures do. It counts the failures
in a row on the bead. At the third it files a visit, with `escalate.sh`'s
verdict window off, that names git's error and the directory the check ran in,
so nobody reads it as a branch with no change. Then `await-ruling.sh` makes the
work wait on that visit. It adds a `blocks` edge from the work onto the visit,
releases the refinery's assignment, which takes the work off the queue, and
arms a fresh `mol-polecat-work` pour for when the visit closes. That run hands
the branch back to the refinery. The work is not parked `blocked`: a park
records a `merge_result`, the pour's load-context reads a bead carrying one as
finished work, and on a rework child it would be a second anchor on the PR.
A graduated convoy is the exception, because a run poured onto a convoy works
on the beads the convoy tracks. The convoy is parked `blocked` once a `blocks`
edge holds it on the visit, and a person hands it back.
When the visit, the convoy's edge or the wait does not land, the work stays
with the refinery, which takes back an assignment the wait released, and the
count stays at the cap, so the next failed check asks again. A check that runs
clears the count:
```bash
# >>> zero-diff-guard
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
PREP_WT="$(git -C "$RIG_ROOT" rev-parse --path-format=absolute --git-common-dir)/gc-refinery-prep"
PREP_SHA=$(git -C "$PREP_WT" rev-parse HEAD)
BHRC_RC=0
branch_has_real_change "$RIG_ROOT" "origin/$TARGET" "$PREP_SHA" || BHRC_RC=$?
CHECK_FAIL_CAP=3
CHECK_FAILS=$(printf '%s' "$BEAD_JSON" | jq -r '(.[0].metadata.zero_diff_check_failures // "0") | tostring' 2>/dev/null)
case "$CHECK_FAILS" in ''|*[!0-9]*) CHECK_FAILS=0 ;; esac
# escalate.sh is looked for first in the pack lifecycle.sh came from, so a bead
# this block refuses or makes wait gets its visit wherever that pack was found.
SCRIPTS=""; for c in "${LC%/assets/scripts/lifecycle.sh}" "$RIG_ROOT" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/escalate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
if [ "$BHRC_RC" != 0 ] && [ "$BHRC_RC" != 1 ]; then
  CHECK_FAILS=$((CHECK_FAILS + 1))
  if [ "$CHECK_FAILS" -lt "$CHECK_FAIL_CAP" ]; then
    gc bd update "$WORK" --set-metadata zero_diff_check_failures="$CHECK_FAILS" >/dev/null 2>&1 || echo "could not count this failed check on $WORK, so the visit after $CHECK_FAIL_CAP in a row may come later"
    echo "the zero-diff check could not run in $RIG_ROOT: $BHRC_ERROR (failure $CHECK_FAILS of $CHECK_FAIL_CAP in a row); leaving the work with the refinery to retry"
    gc runtime drain-ack
    exit 1
  fi
  echo "the zero-diff check could not run in $RIG_ROOT: $BHRC_ERROR (failure $CHECK_FAILS in a row); asking a person, and taking $WORK off the refinery's queue until they answer"
  # A run poured onto a convoy works on the beads the convoy tracks, so no pour
  # rebuilds a graduated convoy. It is parked blocked instead, held by a blocks
  # edge onto the visit, and a person hands it back.
  WORK_KIND=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].issue_type // empty' 2>/dev/null)
  HANDBACK="close this visit: closing it pours a fresh run on $WORK, and that run hands the branch back to the refinery"
  [ "$WORK_KIND" != convoy ] || HANDBACK="hand $WORK back to the refinery and close this visit"
  WAITS=""
  if [ -z "$SCRIPTS" ] || [ ! -x "$SCRIPTS/await-ruling.sh" ]; then
    echo "escalate.sh and await-ruling.sh were not found together beside $LC or in any pack location, so no visit asks about $WORK"
  elif ! GC_ESCALATE_VERDICT_WINDOW=0 "$SCRIPTS/escalate.sh" --subject "$WORK" --key refinery-zero-diff-check-failed --message "The zero-diff check of branch $BRANCH against origin/$TARGET could not run in $RIG_ROOT, $CHECK_FAILS patrols in a row. The last error: $BHRC_ERROR. It verified nothing either way, so nothing was merged or closed: this is a failed check, not a branch without work. The refinery takes $WORK off its queue to wait on this visit. Fix that error, then $HANDBACK. To drop the work instead, close $WORK first, then this visit."; then
    echo "escalate.sh recorded no visit for $WORK"
  elif [ "$WORK_KIND" = convoy ]; then
    VISIT=$(gc bd list --status=open,in_progress --metadata-field escalation_key=refinery-zero-diff-check-failed --metadata-field "gc.continuation_group=$WORK" --limit=20 --json 2>/dev/null | tr -d '[:cntrl:]' | jq -r 'if type == "array" then ([ .[].id ] | sort | .[0] // empty) else empty end' 2>/dev/null)
    [ -z "$VISIT" ] || gc bd dep add "$WORK" "$VISIT" --type=blocks >/dev/null 2>&1 || true
    if [ -z "$VISIT" ] || ! gc bd dep list "$WORK" --json 2>/dev/null | tr -d '[:cntrl:]' | jq -e --arg v "$VISIT" 'any(.[]?; (.id // "") == $v and (.dependency_type // "") == "blocks")' >/dev/null 2>&1; then
      echo "no blocks edge from $WORK onto its visit landed, so $WORK is not parked"
    else
      "$LC" transition "$WORK" --to blocked --assignee "" --route human --set "blocked_reason=the zero-diff check could not run in $RIG_ROOT, $CHECK_FAILS patrols in a row: $BHRC_ERROR" --unset zero_diff_check_failures --takeaway "the zero-diff check could not run $CHECK_FAILS patrols in a row; fix the error its visit names, then hand the convoy back" && WAITS=1
    fi
  elif "$SCRIPTS/await-ruling.sh" "$WORK" --key refinery-zero-diff-check-failed --formula mol-polecat-work; then
    WAITS=1
    gc bd update "$WORK" --unset-metadata zero_diff_check_failures --append-notes "Refinery: the zero-diff check of $BRANCH could not run in $RIG_ROOT, $CHECK_FAILS patrols in a row ($BHRC_ERROR), so the branch was not judged and nothing was merged. $WORK waits on its refinery-zero-diff-check-failed visit. Closing that visit pours a fresh run, and that run hands the branch back to the refinery." >/dev/null 2>&1 || echo "could not clear the failed-check count on $WORK, so its next failed check asks a person at once"
  fi
  if [ -z "$WAITS" ]; then
    # A wait that did not land leaves the work with the refinery to retry.
    # await-ruling.sh releases the assignment before it arms, so the refinery
    # takes back a bead it finds open and unassigned.
    gc bd update "$WORK" --if-assignee "" --if-status open --assignee "$GC_AGENT" >/dev/null 2>&1 || true
    gc bd update "$WORK" --set-metadata zero_diff_check_failures="$CHECK_FAILS" >/dev/null 2>&1 || echo "could not count this failed check on $WORK"
    HOLDER=$(gc bd show "$WORK" --json 2>/dev/null | tr -d '[:cntrl:]' | jq -r 'if type == "array" and length > 0 then ((.[0].assignee // "") | if . == "" then "nobody" else . end) else empty end' 2>/dev/null)
    if [ "$HOLDER" = "$GC_AGENT" ]; then
      echo "the wait did not land, so $WORK stays with the refinery, and the next patrol checks it again"
    else
      echo "the wait did not land, and $WORK could not be left with the refinery (its assignee reads ${HOLDER:-unreadable}), so nothing takes it up again; assign it to $GC_AGENT once the check can run"
    fi
  fi
  gc runtime drain-ack
  exit 1
fi
[ "$CHECK_FAILS" = 0 ] || gc bd update "$WORK" --unset-metadata zero_diff_check_failures >/dev/null 2>&1 || true
if [ "$BHRC_RC" = 1 ]; then
  LANDED_SHA=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata.direct_landing_sha // empty')
  if [ -n "$LANDED_SHA" ] && git -C "$RIG_ROOT" merge-base --is-ancestor "$LANDED_SHA" "origin/$TARGET" 2>/dev/null; then
    echo "origin/$TARGET carries $LANDED_SHA, which a direct landing of $WORK pushed without recording; taking the direct path to record it"
    MERGE_STRATEGY=direct
  else
    "$LC" transition "$WORK" --to refused_false_completion --assignee "" --route human --set false_completion_suspected="branch $BRANCH no verified change vs origin/$TARGET; refused merge-close" --takeaway "the branch has no verified change against its target — refused close-as-merged; inspect the branch or drop the bead"
    if [ -n "$SCRIPTS" ]; then
      "$SCRIPTS/escalate.sh" --subject "$WORK" --key refinery-false-completion --message "Branch $BRANCH introduces no verified change vs origin/$TARGET; refused close-as-merged. Bead parked for a human; never silently retried."
    else
      echo "escalate.sh not found beside $LC or in any pack location; $WORK is parked for a human with no refinery-false-completion visit"
    fi
    gc runtime drain-ack
    exit 1
  fi
fi
# <<< zero-diff-guard
```

**If MERGE_STRATEGY = "direct":** `direct-merge-push.sh` lands the prepared
head on `$TARGET` as a fast-forward pushed by its commit id, so nothing is
checked out for the merge and nothing is left to remove. It stamps the commit
on the bead as `direct_landing_sha` before the push, verifies the remote ref,
then records and closes the bead through ONE lifecycle call, handed the rig
root as `GC_RIG_ROOT`: the writer checks the landing in that checkout. It
lands only for the bead and branch the prep worktree records, and with
delete_merged_branches = "true" it then deletes origin/$BRANCH, never the
target, once the landing is recorded. A landing it cannot record keeps the
stamp and the branch, and step 0 sends the bead back here on the next patrol.
Exit 3 means a push rejected for branch protection
(GH006/GH013/"protected branch"/"Changes must be made through a pull
request"/"approving review"/"Cannot update this protected ref") promoted the
bead to `merge_strategy=pr`, and the block falls through to the mr block — the
prep worktree is untouched and still holds the prepared head for the PR push.
Exit 4 means origin/$TARGET moved past the prepared head after the prepare, so
nothing landed. That is routine, not a fault: the block
stops without draining, and the next patrol prepares the branch again. Any
other non-zero exit stops the wisp, and the block leaves the work with the
refinery; the script's output says what landed, if anything.
```bash
# >>> direct-merge-push
DMP=""
for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/direct-merge-push.sh" ] && { DMP="$c/assets/scripts/direct-merge-push.sh"; break; }
done
[ -n "$DMP" ] || { echo "direct-merge-push.sh not found; NOT landing $WORK, and leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
DIRECT_RC=0
DIRECT_ARGS=(--work "$WORK" --branch "$BRANCH" --target "$TARGET")
[ "{{delete_merged_branches}}" != "true" ] || DIRECT_ARGS+=(--delete-branch)
"$DMP" "${DIRECT_ARGS[@]}" || DIRECT_RC=$?
case "$DIRECT_RC" in
  0) ;;
  3) MERGE_STRATEGY=mr ;;
  4) echo "origin/$TARGET moved after $WORK was prepared, so nothing landed; tear down the prep worktree, then jump to next-iteration, and the next patrol prepares $WORK again"; exit 4 ;;
  *) echo "direct-merge-push.sh exited $DIRECT_RC; leaving the work with the refinery"; gc runtime drain-ack; exit 1 ;;
esac
# <<< direct-merge-push
```
After a successful direct merge, or the block's exit 4, tear down the prep
worktree with `refinery-workspace.sh teardown`. It is detached and holds no
branch, and the rig root's HEAD was never moved, so nothing is restored; a
teardown that does not complete is cleared by the next rebase step:
```bash
# >>> prep-teardown
WS=""
for c in "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/refinery-workspace.sh" ] && { WS="$c/assets/scripts/refinery-workspace.sh"; break; }
done
if [ -z "$WS" ] || ! "$WS" teardown; then
  echo "the prep worktree was not torn down; carry on, since the next rebase step clears it before staging"
fi
# <<< prep-teardown
```
After exit 4, jump to next-iteration (pour before burn). After a merge, if
auto_ff_rig_main = "true", best-effort ff the rig canonical checkout
(`$RIG_ROOT`) when it is on `$TARGET` with a clean tree — never abort on its
failure.

**If MERGE_STRATEGY = "mr":** the refinery does NOT land the branch. It
pushes the prepared branch and transitions the anchor into the gated
pipeline; the cadence's gate-ensure dispatches the review, pr-open opens the
PR, merge.sh lands it. Check dispatch does NOT happen here.

1. Push the prepared branch. Force ONLY when the push actually rewrites
history — derived from ancestry, not the branch name:
```bash
# >>> shared-branch-push-mode
# The prepared head is the detached prep worktree's HEAD (the rebase step staged
# it there), never a branch in the rig root; push it from there so the root's
# HEAD is never moved to it.
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
PREP_WT="$(git -C "$RIG_ROOT" rev-parse --path-format=absolute --git-common-dir)/gc-refinery-prep"
# Deliberately NO fetch here. `--force-with-lease` with no explicit expected
# value compares against the LOCAL remote-tracking ref, so a fetch immediately
# before the push refreshes the very ref the lease is checked against and
# quietly degrades it to a plain --force. The rebase step's fetch is the
# snapshot both the ancestry test and the lease are taken against, which is
# what makes "the branch moved under us" detectable at all.
if git -C "$PREP_WT" merge-base --is-ancestor "origin/$BRANCH" HEAD; then
  git -C "$PREP_WT" push origin "HEAD:$BRANCH"
else
  git -C "$PREP_WT" push origin "HEAD:$BRANCH" --force-with-lease
fi
# <<< shared-branch-push-mode
```
A rejected push means the branch moved since the fetch: STOP, re-fetch,
re-run the prepare block, retry. Never plain `--force`, and never force a
branch the prepare block put in merge mode.

2. Validate a caller-supplied `existing_pr` (must be OPEN, head==$BRANCH,
base==$TARGET, in the rig's origin repo — `gh pr view <ref> --repo "$(git -C
"$RIG_ROOT" remote get-url origin)" --json url,number,state,headRefName,baseRefName`). Any mismatch is a durable block,
not a retry. Fill BOTH placeholders: `blocked_reason` is the row's detail and
`--takeaway` the one line the operator's board renders as what this bead
needs, capped at 140 characters.
```bash
"$LC" transition "$WORK" --to blocked --assignee "" --route human --set blocked_reason="<what is wrong with existing_pr>" --takeaway "existing_pr failed validation: <what is wrong> — supply a valid PR or clear existing_pr"
SCRIPTS=""; for c in "${GC_RIG_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/escalate.sh" ] && { SCRIPTS="$c/assets/scripts"; break; }
done
[ -n "$SCRIPTS" ] && "$SCRIPTS/escalate.sh" --subject "$WORK" --key refinery-invalid-existing-pr --message "existing_pr on $WORK failed validation: <reason>. Bead blocked and routed to human."
```
Then jump to next-iteration (pour before burn).

3. Decide pre-open vs post-open. PRE_OPEN means "no PR is recorded under
ANY key" — the refinery's own `pr_url`/`pr_number` count, not just the
caller's `existing_pr`, so a post-open anchor reaching this step by any
route converges on its PR instead of being re-parked:
```bash
# >>> pre-open-recorded-pr
RECORDED_PR="$EXISTING_PR"
if [ -z "$RECORDED_PR" ]; then
  RECORDED_PR=$(printf '%s' "$BEAD_JSON" | jq -r '.[0].metadata | (.pr_url // "") as $u | (.pr_number // "" | tostring) as $n | if $u != "" then $u elif $n != "" then $n else empty end' 2>/dev/null)
fi
PRE_OPEN=0
if [ -z "$RECORDED_PR" ] && command -v gh >/dev/null 2>&1; then
  PRE_OPEN=1
fi
if [ -n "$RECORDED_PR" ] && [ -z "$EXISTING_PR" ]; then
  echo "merge-push: $WORK already records PR $RECORDED_PR (pr_url/pr_number); taking the POST-OPEN path so the existing PR is reused, not re-parked to pre_open_gate." >&2
fi
# The post-open transition needs BOTH url and number; resolve them here so the
# terminal arm never stamps an unaddressable pull_request (empty pr_number is
# skipped by merge.sh and pr-facts.sh forever).
PR_URL=""; PR_NUMBER=""
if [ -n "$RECORDED_PR" ] && command -v gh >/dev/null 2>&1; then
  case "$RECORDED_PR" in
    http://*|https://*)
      # A recorded URL names its own repository, so it needs no rig.
      PR_VIEW=$(gh pr view "$RECORDED_PR" --json url,number,state,headRefName,baseRefName 2>/dev/null) ;;
    *)
      # Anything else, a bare pr_number included, resolves against a repository
      # gh picks from the cwd's checkout: with no `gh repo set-default`, its
      # first remote in gh's own order, upstream ahead of origin. Naming the
      # rig's origin, read by path, pins it. Only this lookup needs the rig, and
      # it stops when the rig or its origin cannot be named, because an unpinned
      # view can stamp another repository's PR on the bead.
      RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
      RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
      [ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root to look PR $RECORDED_PR up in; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
      PR_REPO=$(git -C "$RIG_ROOT" remote get-url origin 2>/dev/null)
      [ -n "$PR_REPO" ] || { echo "the rig at $RIG_ROOT has no origin to look PR $RECORDED_PR up in; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
      PR_VIEW=$(gh pr view "$RECORDED_PR" --repo "$PR_REPO" --json url,number,state,headRefName,baseRefName 2>/dev/null) ;;
  esac
  PR_URL=$(printf '%s' "$PR_VIEW" | jq -r '.url // empty' 2>/dev/null)
  PR_NUMBER=$(printf '%s' "$PR_VIEW" | jq -r '.number // empty | tostring' 2>/dev/null)
fi
# <<< pre-open-recorded-pr
```
On the post-open path, verify `$PR_VIEW` reports OPEN + head==$BRANCH
+ base==$TARGET; a caller-supplied PR that fails goes to the blocked arm
above, anything else stops the wisp for debugging without mutating state.

4. Normalize the check-set. Empty never out-ranks the declared default (the
--root-only pour path can mis-substitute), and the `none`/`off` sentinel is
STAMPED as the canonical `none` rather than collapsed to empty:
```bash
CHECK_SET="{{check_set}}"
# >>> check-set-normalize
_cs_canon="$(printf '%s' "$CHECK_SET" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:],')"
case "$_cs_canon" in
  '')       CHECK_SET="correctness,triage" ;;
  none|off) CHECK_SET="none" ;;
esac
unset _cs_canon
# <<< check-set-normalize
```

5. One-anchor-per-PR guard, then ONE lifecycle transition. If another OPEN
bead already gates this branch, $WORK is a rework hand-back: move it to
`unanchored` and close it landed-on-branch, never stamp `merge_result` on it
(a merge_result-carrying rework child joins the anchor enumeration as a
gateless second anchor), and let gating continue on the existing anchor: its
lanes derive their state from its reviews, not from the head, so the rework's
push does not move them — the cadence re-derives the existing anchor's checks
and holds until each derives green.

Branch is the join key and `merge_result` present is the whole predicate: any
declared state carries one, so an anchor parked for a person (`blocked`,
`held`, `abandoned`, `retargeted`, `refused_false_completion`) still owns its
PR, and a search restricted to the two gating states walks past it and mints
the second anchor it was written to prevent. Multi-candidate tiebreak: the
OLDEST anchor (the original predates any rework-minted duplicate);
`created_at` is the real field, `.created`/`.id` only defensive fallbacks.

The child leaves through `lifecycle.sh` because `merge_result` is the
lifecycle's field and `lifecycle.sh` is its only writer; `unanchored` is the
declared edge out of every gating state. A child closed still carrying one is
an I5 error (`doctor/check-closed-implies-landed`), so a refused transition
leaves it open for the next pass instead.

The close itself is `gc bd update --status=closed`, never `gc bd close`. bd's
ownership check is a property of the `close` verb: it compares the actor
against the assignee and refuses a bead held by another principal, pointing at
`--force`. Everything the refinery closes is a bead someone handed it, so the
verb that carries that check is the one verb it cannot use — and the refusal is
per-anchor and permanent, so a retry meets it unchanged every pass. The
`update` form reaches the same status with no such check, which is why every
other close in the pack goes through `lifecycle.sh`'s single atomic update.
`unanchored` is an open state, so `--close` is not available here and this arm
writes the status itself; its result is checked, because a close that reports
nothing leaves a bead that is unanchored, open, and assigned, which reads like
work still in flight.

The close also records the rework's work record, which the runtime's
work-record gate reads on it: `gc.work_outcome=shipped`, `gc.work_commit` set
to the head read back from origin, and `gc.work_branch` set to `$BRANCH`, the
branch that head is on. The read-back fetch has just put that head on
`origin/$BRANCH` in the rig's refs, which is where the gate looks for it.
```bash
# >>> one-anchor-per-pr-resolve
EXISTING_ANCHOR=""
if [ -n "${BRANCH:-}" ]; then
  ANCHOR_ROWS=$(gc bd list --status=open --metadata-field branch="$BRANCH" \
    --limit=0 --json 2>/dev/null) || ANCHOR_ROWS=""
  EXISTING_ANCHOR=$(printf '%s' "$ANCHOR_ROWS" | jq -r --arg self "$WORK" \
    '[ .[]? | select(.id != $self)
       | select((((.metadata // {}).merge_result // "") | tostring) != "") ]
     | sort_by(.created_at // .created // .id) | .[0].id // empty' 2>/dev/null) || EXISTING_ANCHOR=""
fi
GATING_ANCHOR="${EXISTING_ANCHOR:-$WORK}"
# <<< one-anchor-per-pr-resolve
# >>> one-anchor-per-pr-terminal
# The rework arm reads the prepared head back from the prep worktree, so this
# block resolves that path itself, as the push block does.
RR=""; for c in "${GC_PACK_DIR:-}" "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do [ -x "$c/assets/scripts/rig-root.sh" ] && { RR="$c/assets/scripts/rig-root.sh"; break; }; done
RIG_ROOT=$("${RR:?rig-root.sh not found in the pack}")
[ -n "$RIG_ROOT" ] || { echo "cannot resolve the rig root; leaving the work with the refinery to retry"; gc runtime drain-ack; exit 1; }
PREP_WT="$(git -C "$RIG_ROOT" rev-parse --path-format=absolute --git-common-dir)/gc-refinery-prep"
if [ -n "$EXISTING_ANCHOR" ]; then
  # This arm closes the rework landed-on-branch, so the landing must be provable
  # against origin: the mr push above can be rejected or skipped and leave
  # origin/$BRANCH at its pre-fix tip, and a sha read from the local prep
  # worktree would then close the rework and note it landed over a branch the
  # fix never reached. A stale local origin/$BRANCH is the same trap — a failed
  # fetch leaves it at its last cached value, which can coincidentally equal the
  # prepared head. So fail closed on the fetch first, then require the refreshed
  # remote tip to equal the prepared head; on either failure record nothing,
  # close nothing, and leave $WORK routed for the next pass to re-push.
  if ! git -C "$PREP_WT" fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" >/dev/null 2>&1; then
    echo "merge-push: could not fetch origin/$BRANCH to read back the rework landing; recording no landing and closing nothing. $WORK stays routed for the next pass to re-push." >&2
    gc runtime drain-ack
    exit 1
  fi
  PREPARED_HEAD=$(git -C "$PREP_WT" rev-parse HEAD 2>/dev/null || echo "")
  REMOTE_HEAD=$(git -C "$PREP_WT" rev-parse "origin/$BRANCH" 2>/dev/null || echo "")
  if [ -z "$PREPARED_HEAD" ] || [ -z "$REMOTE_HEAD" ] || [ "$PREPARED_HEAD" != "$REMOTE_HEAD" ]; then
    echo "merge-push: origin/$BRANCH is '${REMOTE_HEAD:-absent}', want prepared head '${PREPARED_HEAD:-absent}' — the rework fix is not on origin; recording no landing and closing nothing. $WORK stays routed for the next pass to re-push." >&2
    gc runtime drain-ack
    exit 1
  fi
  REWORK_SHA=$(git -C "$PREP_WT" rev-parse --short "origin/$BRANCH" 2>/dev/null || echo "")
  gc bd update "$EXISTING_ANCHOR" --append-notes "Rework $WORK landed on $BRANCH${REWORK_SHA:+ at $REWORK_SHA}; re-gate belongs to the cadence (one-anchor-per-PR)." >/dev/null 2>&1 || true
  if "$LC" transition "$WORK" --to unanchored --unset rejection_reason; then
    if ! gc bd update "$WORK" --status=closed \
         --set-metadata gc.work_outcome=shipped --set-metadata gc.work_commit="$REMOTE_HEAD" --set-metadata gc.work_branch="$BRANCH" \
         --append-notes "Rework landed on $BRANCH${REWORK_SHA:+ at $REWORK_SHA}; gating continues on anchor $EXISTING_ANCHOR"; then
      echo "merge-push: $WORK left the anchor class but the close was refused; it stays unanchored and open, and the next pass retries both idempotently" >&2
    fi
  else
    echo "merge-push: $WORK could not be moved off its anchor state; left OPEN for the next pass rather than closed still carrying one (doctor/check-closed-implies-landed)" >&2
  fi
elif [ "$PRE_OPEN" = 1 ] || [ -z "${PR_URL:-}" ] || [ -z "${PR_NUMBER:-}" ]; then
  if [ "$PRE_OPEN" != 1 ]; then
    echo "merge-push: $WORK records a PR but url/number did not both resolve (url='${PR_URL:-}' number='${PR_NUMBER:-}'); parking at pre_open_gate so pr-open.sh adopts the PR — an empty pr_number is unaddressable by merge.sh and pr-facts.sh forever." >&2
  fi
  "$LC" transition "$WORK" --to pre_open_gate --assignee "" --route "" --set merged_target="$TARGET" --set check_set="$CHECK_SET" --unset rejection_reason
else
  "$LC" transition "$WORK" --to pull_request --assignee "" --route "" --set pr_url="$PR_URL" --set pr_number="$PR_NUMBER" --set merged_target="$TARGET" --set check_set="$CHECK_SET" --unset rejection_reason
fi
# <<< one-anchor-per-pr-terminal
```
The anchor stays OPEN, detached from both work queues (`assignee=""` keeps
it out of find-work; empty route keeps it out of pool demand). It closes
later, on a verified merge, via the cadence — never here. A failed
transition leaves $WORK assigned and open; the next patrol retries
idempotently (push and anchor resolution are both re-runnable).

6. Cleanup: tear down the prep worktree with `refinery-workspace.sh teardown`,
the script the rebase step staged it with; a teardown that does not complete is
cleared by the next iteration's rebase step. The prep worktree is detached and
holds no branch, so nothing else has to be deleted:
```bash
# >>> prep-teardown
WS=""
for c in "${GC_RIG_ROOT:-}" "${GC_CITY_PATH:-}/rigs/gc-toolkit"; do
  [ -x "$c/assets/scripts/refinery-workspace.sh" ] && { WS="$c/assets/scripts/refinery-workspace.sh"; break; }
done
if [ -z "$WS" ] || ! "$WS" teardown; then
  echo "the prep worktree was not torn down; carry on, since the next rebase step clears it before staging"
fi
# <<< prep-teardown
```
Never delete `$BRANCH` in mr mode — the PR needs it. The rig root's HEAD was
never moved, so nothing has to be restored here.

**Unsupported strategies (e.g. `local`):** transition nothing; escalate
via escalate.sh (`--subject $WORK --key refinery-unsupported-strategy`) and
leave the bead for a human to re-strategize.

**GATE**: direct requires a verified target push then one merged+close
transition; mr requires a verified branch push then one gating transition
(pre_open_gate, or pull_request with the PR recorded). The bead closes only
on a verified merge — never at handoff — except a rework hand-back, which
closes landed-on-branch with NO merge_result."""

[[steps]]
id = "patrol-summary"
title = "Record patrol cycle summary"
needs = ["merge-push"]
description = """
Summarize the cycle for handoff context (it lives in the wisp's closing
reason): branch handled and disposition (merged / gated / rejected /
blocked), check results, bugs filed, escalations sent — and holds observed
that did NOT escalate; suppression removes the mail, never the record. If
the cycle ended early, note why and what state was left."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["patrol-summary"]
description = """
Pour the next wisp BEFORE burning this one, and GUARD the assign — a poured
but unassigned wisp reaches no hook and drops the loop. Pass exactly the
vars the startup pour passes: target_branch, rig_name and binding_prefix,
the rig identity the formula cannot know. Pass nothing else. An omitted var
renders the formula's current default on the new wisp, while a passed one
keeps the first wisp's value for as long as the chain runs, so a default
changed on main would never reach it.

`GC_BEAD_ID` is empty on a fresh session, so the fallback that resolves the
current wisp has to work: a wisp is an EPHEMERAL molecule, which means
`--type=molecule --include-infra` plus the title filter. Any narrower query
reads empty, and an unresolved current wisp is one that never burns.

```bash
# >>> patrol-wisp-pour
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --include-infra --limit=0 --json | jq -r '[.[] | select(.title == "mol-refinery-patrol")][0].id // empty')
fi
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
gc bd update "$NEXT" --set-metadata gc.rig="$GC_RIG" || true  # rig-stamp before assign so an interrupted pour leaves a rig-scoped orphan
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign next refinery wisp; rolling it back and not burning."
  gc bd mol burn "$NEXT" --force || echo "Rollback burn of $NEXT failed; startup reconcile collects it."
  gc runtime drain-ack
  exit 1
fi
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "Could not resolve current wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
# <<< patrol-wisp-pour
```

Close this step. The new wisp is ready — re-read the step order (the plain
`gc formula show mol-refinery-patrol`, not the full --json) and begin."""
